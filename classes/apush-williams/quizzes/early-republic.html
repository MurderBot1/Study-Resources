const Q = [
// ---------- CONSTITUTION (C) ----------
["C","When a woman asked Benjamin Franklin what kind of government the Convention had created, what did he reply?",["A monarchy, if the people allow it","A republic, if you can keep it","A democracy, if the states agree","A confederation, until it fails"],1,"Recorded in James McHenry’s journal on the last day of the Convention."],

["C","Who wrote Federalist #10?",["Alexander Hamilton","James Madison","John Jay","Thomas Jefferson"],1,"Madison, writing as ‘Publius’ with Hamilton and Jay."],
["C","Whom did Alexander Hamilton assume would be the first President?",["Himself","Thomas Jefferson","Benjamin Franklin","George Washington"],3,"Washington’s presence at the Convention made ratification easier."],
["C","Which group did Hamilton expect to resist the Constitution in order to protect their own power?",["Merchants and commercial interests","Owners of property","Creditors and bankers","Officeholders in the state governments"],3,"Hamilton expected merchants, creditors and property owners to support it, and state officials to oppose it."],
["C","George Mason, a Southerner, objected that Congress could make commercial treaties and navigation laws by what?",["A unanimous vote","A simple majority","A presidential veto only","A vote of the state legislatures"],1,"Southern minority states feared the North could pass commercial laws by simple majority, foreshadowing later North–South battles."],
["C","Which was the most prominent Anti-Federalist complaint about the new Constitution?",["It created no executive branch","It had no Bill of Rights","It gave states too much power","It abolished trial by jury in every case"],1,"Many Anti-Federalists refused to support ratification without a bill of rights."],
["C","Which fear is most associated with the common person during the ratification debate?",["That Congress would never meet","That elites would rule over the ‘poor illiterate people’","That states would gain too much power","That the Articles would be restored"],1,"Anti-Federalists feared a distant government run by aristocrats."],
["C","Which was an Anti-Federalist response to Federalist arguments?",["Supporters were playing to fears of anarchy","Shays’ Rebellion proved the Articles must be replaced at once","State constitutions should be abolished","A strong central government would protect liberty"],0,"Anti-Federalists called Federalists demagogues and argued there was time to fix problems with smaller changes."],
["C","Federalists pointed to what event as proof that the Articles of Confederation were too weak?",["Whiskey Rebellion","Shays’ Rebellion","Boston Massacre","Burr Conspiracy"],1,"Shays’ Rebellion (1786–87) in Massachusetts. Jefferson felt too much was made of it."],
["C","Which Article of the Constitution defines the legislative branch?",["Article I","Article II","Article III","Article IV"],0,"Article I: Congress."],
["C","Which Article defines the executive branch?",["Article I","Article II","Article III","Article V"],1,"Article II: the President."],
["C","Which Article defines the judicial branch?",["Article I","Article II","Article III","Article VI"],2,"Article III: the Supreme Court and inferior courts."],
["C","The Preamble is found in which Article?",["Article I","Article II","Article VII","None. It comes before the Articles"],3,"The Preamble (‘We the People…’) introduces the Constitution and is not an Article."],
["C","Where is Congress’s power to coin money found?",["Article I, Section 9","Article IV, Section 1","The Preamble","Article I, Section 8"],3,"Article I, Section 8 lists the enumerated powers, including coining money."],
["C","Where in the original Constitution is the right to habeas corpus listed?",["Bill of Rights","Article I, Section 9","Article II, Section 2","Article IV, Section 1"],1,"Article I, Section 9 protects against unlawful imprisonment."],
["C","The idea of habeas corpus can be traced back to what document?",["Magna Carta","Mayflower Compact","English Bill of Rights only","Declaration of Independence"],0,"Magna Carta (1215) guarantees against false imprisonment."],
["C","Why was no Bill of Rights originally included?",["Delegates opposed individual rights","Delegates thought they could never list all rights and that Article I, Section 9 was enough","The Articles of Confederation already had one","Congress was to write it later"],1,"Many delegates felt listing rights could imply others weren’t protected."],
["C","Which Bill of Rights protection does NOT trace back to Magna Carta?",["Right to a speedy trial","No excessive bail or fines","Right to bear arms","Eminent domain protections"],2,"The Second Amendment’s right to bear arms is not a Magna Carta right."],
["C","Which is NOT stated in Article III?",["The judicial branch is created","The Supreme Court is created","The courts’ original vs. appellate jurisdiction","Judicial review is granted to the courts"],3,"Judicial review is not in Article III. It was established by Marbury v. Madison (1803)."],
["C","What does Article IV, Section 1 (Full Faith and Credit) require?",["States to honor each other’s public acts, records and court decisions","States to share taxes","Congress to approve all state laws","States to extradite no one"],0,"It underlies recognition of driver’s licenses and marriages. Obergefell v. Hodges (2015) is a related controversy."],
["C","All of the following relate to state–state or state–national relations in Article IV EXCEPT:",["Citizens of each state get privileges and immunities in other states","Criminals who flee must be returned (extradition)","The U.S. guarantees each state protection","Recognition of the supremacy of state laws"],3,"Supremacy belongs to national law (Article VI). Article IV also allows new states to be created."],
["C","Which is NOT part of the amendment process in Article V?",["The President must sign the proposed amendment","Two-thirds of Congress must agree to propose it","Three-fourths of the states must ratify it","All of the above are in Article V"],0,"The President has no role in amending the Constitution."],
["C","What fraction of states must ratify an amendment?",["One-half","Two-thirds","Three-fourths","Unanimity"],2,"Three-fourths of state legislatures or special conventions."],
["C","What fraction of Congress is needed to propose an amendment?",["Simple majority","Two-thirds of both houses","Three-fifths","Three-fourths"],1,"Article V."],
["C","Which proposed amendment passed Congress but was never ratified by the states?",["Changing the name of the country","School prayer","Abolishing the electoral college","The Equal Rights Amendment (ERA)"],3,"The ERA, child labor and DC voting representation passed Congress but fell short in the states."],
["C","Amendments 1–4 primarily protect:",["Rights of the accused","Personal rights","State powers","Voting rights"],1,"Speech/religion, arms, quartering, searches."],
["C","Amendments 5–8 primarily protect:",["Rights of the accused","Personal freedoms of religion","Rights of states","Property rights of the states"],0,"Due process, trial rights, bail and punishment."],
["C","Which amendment bans the housing of soldiers in private homes without consent?",["2nd","3rd","4th","5th"],1,"The Quartering Amendment."],
["C","Which amendment protects against illegal searches and seizures?",["3rd","4th","5th","6th"],1,"4th Amendment."],
["C","Double jeopardy and self-incrimination are covered by which amendment?",["4th","5th","6th","8th"],1,"5th Amendment."],
["C","The right to a speedy trial, jury trial and an attorney comes from which amendment?",["5th","6th","7th","8th"],1,"6th Amendment."],
["C","The 8th Amendment prohibits:",["Quartering of soldiers","Excessive bail, fines and cruel and unusual punishment","Illegal searches","Self-incrimination"],1,"8th Amendment."],
["C","The right to a jury trial in civil cases over $20 comes from which amendment?",["6th","7th","8th","9th"],1,"7th Amendment."],
["C","In the ‘Bong Hits 4 Jesus’ case, which part of the First Amendment is most at issue?",["Freedom of the press","Freedom of religion","Freedom of speech","Right to petition"],2,"Morse v. Frederick (2007), arising from a 2002 Olympic torch event in Juneau, Alaska."],
["C","In that case, the Supreme Court held that the school’s suspension was:",["Unconstitutional","Constitutional","Void because of the 4th Amendment","Not reviewable"],1,"The Court sided with the school, 5–4."],
["C","Which provision supports an unenumerated right to privacy, as in Griswold v. Connecticut (birth control)?",["The 9th Amendment, among others","The 6th Amendment","The 7th Amendment","The 8th Amendment"],0,"Griswold (1965) relied on a ‘zone of privacy’ drawn from several amendments, including the 9th."],
["C","Which amendment says rights not listed in the Constitution may still be retained by the people?",["8th","9th","10th","11th"],1,"The 9th protects unenumerated rights."],
["C","Which amendment reserves powers not given to the national government to the states or people?",["8th","9th","10th","14th"],2,"The 10th, cited by South Carolina to justify secession."],
["C","Which part of the Bill of Rights did South Carolina use to justify secession?",["10th Amendment","4th Amendment","2nd Amendment","1st Amendment"],0,"States’ rights argument. Texas v. White (1869) later held secession unconstitutional."],
["C","Which Supreme Court case ruled secession was not constitutional?",["Texas v. White (1869)","Marbury v. Madison","McCulloch v. Maryland","Gibbons v. Ogden"],0,"The Court called the Union indestructible."],
["C","The first words of the Preamble are:",["In Congress Assembled","We the People","All men are created equal","Whereas the colonies"],1,"‘We the People of the United States…’"],
["C","What are the Federalist Papers?",["Essays arguing for ratification of the Constitution","A list of Anti-Federalist demands","Minutes of the Constitutional Convention","Early laws of Congress"],0,"Written by Hamilton, Madison and Jay as ‘Publius’."],
// ---------- EARLY REPUBLIC (E) ----------
["E","Which of Washington’s successes is listed as setting the tone for later Presidents?",["Precedents set","Winning a third term","Ending political parties","Abolishing the national debt"],0,"E.g., cabinet, two-term tradition, title ‘Mr. President’."],
["E","Which is NOT one of Hamilton’s three reports?",["Report on Public Credit","Report on the National Bank","Report on Manufactures","Report on Western Lands"],3,"Hamilton wrote on public credit, the bank, and manufactures."],
["E","Who favored loose construction of the Constitution?",["Jefferson","Hamilton","Patrick Henry","George Mason"],1,"Hamilton: the Constitution is a living document interpreted to meet changing needs."],
["E","Who favored strict construction?",["Jefferson","Hamilton","John Adams","John Jay"],0,"Jefferson: apply the text precisely and nothing more."],
["E","Who would agree that ‘the national debt should always exist as a way of uniting the economic interests of the country’?",["Jefferson","Hamilton"],1,"Hamilton wanted creditors tied to the national government."],
["E","Who would agree that ‘a national bank is a constitutional use of Congressional power’?",["Jefferson","Hamilton"],1,"Hamilton argued implied powers via the Necessary and Proper Clause."],
["E","Who would agree that ‘taxes hurt the liberty of all Americans’?",["Jefferson","Hamilton"],0,"Jefferson distrusted taxation and a powerful central government."],
["E","Who said ‘a little rebellion now and then is a good thing’?",["Jefferson","Hamilton"],0,"Jefferson, reflecting on Shays’ Rebellion."],
["E","What was the total debt after the Revolution?",["$19 million","$79 million","$179 million","$400 million"],1,"Roughly $25M state, $42M national (domestic), $12M foreign."],

["E","Hamilton proposed to refinance the debt by lowering interest from:",["8% to 6%","6% to 4%","10% to 5%","4% to 2%"],1,"Bondholders who kept their bonds received interest, tying them to the government."],
["E","Which revenue was used to fund the interest on the debt?",["An income tax","The Whiskey Excise and land sales","Tariffs on tea","A federal property tax"],1,"The excise tax on whiskey, with land sales."],
["E","The Compromise of 1790 (Residence Act) resulted in:",["The capital placed on the Potomac in exchange for Southern support of Hamilton’s debt plan","The creation of the Bank of the U.S.","Jay’s Treaty","A ban on slave importation"],0,"Jefferson, Madison and Hamilton’s ‘room where it happens’ dinner deal."],
["E","Who designed the plan for Washington, D.C.?",["Pierre L’Enfant","Benjamin Banneker","Thomas Jefferson","Charles Bulfinch"],0,"Banneker assisted with surveying."],
["E","The Whiskey Excise was regressive because it:",["Taxed the poor at a higher rate than the rich","Taxed only the rich","Was repealed immediately","Was paid only by merchants"],0,"Small western farmers distilled grain into whiskey, so it hit them hardest."],
["E","Where did the Whiskey Rebellion occur?",["Western Pennsylvania","Virginia tidewater","Massachusetts","New York harbor"],0,"A flag represented six counties in rebellion."],
["E","Washington’s response to the Whiskey Rebellion demonstrated:",["The new government’s ability to enforce federal law","The weakness of the presidency","The need to repeal all taxes","His disapproval of the Constitution"],0,"He led militia to put down the rebellion in 1794."],
["E","Explicit (enumerated) powers differ from implied powers because explicit powers are:",["Listed directly in the Constitution","Inferred from the Necessary and Proper Clause","Reserved to the states","Granted by state law"],0,"Implied powers are inferred, as in Hamilton’s bank argument."],
["E","Which Hamilton report asked for tariffs to promote a diverse economy?",["Report on Manufactures","Report on Public Credit","Report on the Bank","Report on Foreign Trade"],0,"It was not adopted. Jefferson and Madison opposed it."],
["E","Jefferson feared that large cities would:",["Create corruption as in Europe","Improve the economy of the South","Increase immigration","Strengthen farmers"],0,"He believed in an agrarian republic."],
["E","How did Jefferson and Hamilton view the French Revolution?",["Jefferson supported it; Hamilton was wary","Hamilton supported it; Jefferson opposed it","Both opposed it","Both supported it"],0,"Hamilton feared its effect on trade."],
["E","Washington issued the Proclamation of Neutrality in 1793 following:",["Citizen Genet Affair","XYZ Affair","Burr conspiracy","Jay’s Treaty"],0,"The U.S. would not take sides in the Franco-British conflict."],
["E","What was the Farewell Address’s approach to foreign policy?",["Avoid permanent entanglements","Ally with France","Annex Canada","Build a large navy immediately"],0,"Issued 1796, a few months before the presidential election."],
["E","Pinckney’s Treaty (1795) was with which nation and granted what?",["Spain; access to the Mississippi and New Orleans","Britain; forts evacuated","France; ended alliance","Spain; sold Florida"],0,"It benefited western farmers and the Federalists."],
["E","Jay’s Treaty (1794) was with which country?",["Great Britain","France","Spain","Russia"],0,"It was unpopular with many Americans but averted war."],
["E","In the 1792 election, Washington was:",["Re-elected unanimously","Defeated by Jefferson","Re-elected narrowly","Not on the ballot"],0,"Yet Democratic-Republicans gained seats in Congress."],
["E","Which party gained more seats in the 1794 midterms?",["Federalists","Democratic-Republicans"],1,"Whiskey Excise and neutrality concerns helped them (+5 for D-R, –4 for Federalists)."],
["E","The 1796 election was between:",["Adams and Jefferson","Hamilton and Burr","Jefferson and Madison","Adams and Pinckney only"],0,"Adams won. Jefferson, as runner-up, became Vice President."],
["E","What event helped the Federalists in 1798 by sparking anti-French feeling?",["XYZ Affair","Whiskey Rebellion","Embargo of 1807","Louisiana Purchase"],0,"French agents demanded bribes from American diplomats."],
["E","The undeclared naval conflict with France (1798–1800) is called the:",["Quasi-War","Tripolitan War","Seminole War","Pig War"],0,"It strengthened the Federalists until their domestic policies backfired."],

// ---------- NATIONALISM (N) ----------

["N","Sectionalism is best defined as:",["Undue concern with local interests at the expense of general well-being","Identification with one’s own nation","Separation of religion and politics","Partisan bias"],0,"Nationalism is loyalty to the nation, secularism is separation of religion and state."],
["N","Which did NOT cause sectionalism in the Era of Good Feelings?",["Federal land policy","Tariffs","The Second Bank of the United States","All of the above caused sectionalism"],3,"Land policy, industrialism, cities, internal improvements, tariffs and the Bank all affected regions differently."],
["N","Which did NOT help spur early American industrialism?",["Embargo of 1807","Tariff of 1816","War of 1812","The California Gold Rush"],3,"The Gold Rush was 1848–49. The Embargo, the war and the 1816 tariff all encouraged domestic manufacturing."],
["N","New York City grew from 124,000 in 1820 to roughly how many by 1860?",["800,000","300,000","1.5 million","50,000"],0,"Urban growth stemmed from industry, transport and immigration."],
["N","Which was a cause of the growth of cities?",["Industrialism, transportation revolution, and immigration","Only agriculture","Decline of trade","The Embargo only"],0,"Cities fueled a market economy of industrial goods."],

["N","Who won the most popular and electoral votes in 1824 but lost in the House?",["Andrew Jackson","Henry Clay","William Crawford","John C. Calhoun"],0,"He campaigned bitterly for 1828."],

["N","Ralph Waldo Emerson’s ‘The American Scholar’ (1837) echoed which earlier sentiment?",["J.Q. Adams’s call for distinctly American intellectual endeavors","Jefferson’s agrarianism","Hamilton’s report on manufactures","Jackson’s bank veto"],0,"A call for cultural independence from Europe."],
["N","Which was NOT part of Jacksonian ‘Democratic Nationalism’?",["Congressional caucus nominations","Ending property requirements for voting","State nominating conventions","Secret ballots"],0,"The caucus was replaced by conventions."],

["N","The crowd at Jackson’s 1829 inaugural party led Justice Story to say:",["‘The reign of King Mob seemed triumphant.’","‘We are all Federalists.’","‘The era of good feelings.’","‘A republic if you can keep it.’"],0,"Jackson was seen as ‘the People’s President.’"],
["N","The Indian Removal Act (1830) authorized:",["Relocation of Native Americans west of the Mississippi","Citizenship for Cherokees","Federal protection for tribal lands","Forts along the Ohio"],0,"It led to the Trail of Tears."],
["N","The Tariff of 1828 was nicknamed:",["Tariff of Abominations","Compromise Tariff","Walker Tariff","Morrill Tariff"],0,"Southerners hated its high duties."],
["N","Why did Southerners generally dislike tariffs?",["They raised the cost of manufactured goods","They could reduce British demand for Southern cotton","They seemed to benefit mainly the North","All of the above"],3,"Southerners felt they paid for Northern prosperity."],
["N","Calhoun’s ‘South Carolina Exposition and Protest’ argued for:",["Nullification of federal tariffs","Secession","A new bank","Abolition of tariffs by Congress"],0,"Written anonymously in 1828, public in 1831."],
["N","The Webster-Hayne Debate (1830) was NOT about:",["The national bank","Federal land policy","The tariff","The theory of nullification"],0,"Its core issue was states’ rights vs. national union."],
["N","Which term is NOT related to the Webster-Hayne debate?",["Embargo of 1807","Tariff of Abominations","American System","Kentucky and Virginia Resolutions"],0,"The Embargo isn’t tied to the nullification debate."],
["N","At the 1830 Jefferson Day dinner, Jackson toasted:",["‘Our federal Union, it must be preserved.’","‘Liberty and union forever.’","‘Nullification forever.’","‘Down with the bank.’"],0,"Calhoun replied with a toast to ‘the Union, next to our liberty, the most dear.’"],
["N","The Peggy Eaton affair damaged Jackson’s relationship with:",["John C. Calhoun","Martin Van Buren","Henry Clay","Daniel Webster"],0,"It helped Van Buren replace Calhoun as heir apparent."],

["N","Which was NOT a reason for the rise of the Whig Party?",["The Democrats’ support of the American System","Opposition to Jackson’s strong executive power","The Anti-Mason movement","Support for education and temperance"],0,"Democrats opposed the American System, and Whigs embraced it."],
["N","Whigs charged Jackson with:",["Wielding presidential power like a king","Weakening the military","Supporting the Bank","Opposing states’ rights"],0,"They called him ‘King Andrew I’."],

["N","What was the most significant cause of Van Buren’s defeat in 1840?",["The Panic of 1837","Anti-Mason sentiment","A duel","Texas annexation"],0,"William Henry Harrison won."],
["N","Which election year ended the Federalist presidency?",["1800","1796","1808","1792"],0,"Jefferson (D-R) won; Adams was the last Federalist President."],
["N","Who was President during the Era of Good Feelings (1817–1825)?",["James Monroe","James Madison","John Quincy Adams","Andrew Jackson"],0,"Elected in 1816 and 1820."],
["N","Which election was Monroe’s first win?",["1816","1812","1820","1824"],0,"A Democratic-Republican."],
];

const TOPICS={C:["The Constitution","Ratification, the Articles, the Bill of Rights"],E:["The Early Republic, 1789–1824","Washington, Hamilton v. Jefferson, Adams, Jefferson, Madison"],N:["Growth of American Nationalism","Era of Good Feelings, Missouri, Jackson, the Bank War"]};
const app=document.getElementById('app');
let S={};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prep(q){ // keep order for "all/none of the above" style sets
  const [t,text,opts,ans,why]=q; const idx=opts.map((_,i)=>i);
  const keep=opts.some(o=>/of the above|^all of|^none of|caused sectionalism|^both/i.test(o));
  const order=keep?idx:shuffle(idx);
  return {t,text,why,opts:order.map(i=>opts[i]),ans:order.indexOf(ans)};
}
function setup(){
  const counts={C:0,E:0,N:0};Q.forEach(q=>counts[q[0]]++);
  app.innerHTML=`
  <header><div class="label">Study quiz</div><h1>Early Republic to the Age of Jackson</h1>
  <p class="sub">${Q.length} questions from your three slide decks. Pick topics and start.</p></header>
  <section class="card">
    <div class="label">Topics</div>
    <div class="topics">${Object.keys(TOPICS).map(k=>`<label class="topic"><input type="checkbox" name="t" value="${k}" checked><div><b>${TOPICS[k][0]} <small style="font-weight:400;color:var(--muted)">· ${counts[k]} questions</small></b><span>${TOPICS[k][1]}</span></div></label>`).join('')}</div>
    <div class="row">
      <label class="opt"><input type="checkbox" id="shuf" checked> Shuffle order</label>
      <label class="opt">Questions <input type="number" id="num" min="1" max="${Q.length}" value="${Q.length}"></label>
    </div>
    <button class="btn" id="go">Start quiz</button>
  </section>`;
  const num=document.getElementById('num');
  const upd=()=>{const sel=[...document.querySelectorAll('input[name=t]:checked')].map(i=>i.value);const n=Q.filter(q=>sel.includes(q[0])).length;num.max=n;if(+num.value>n||!num.value)num.value=n;document.getElementById('go').disabled=!n};
  document.querySelectorAll('input[name=t]').forEach(i=>i.onchange=upd);
  document.getElementById('go').onclick=()=>{
    const sel=[...document.querySelectorAll('input[name=t]:checked')].map(i=>i.value);
    let pool=Q.filter(q=>sel.includes(q[0]));
    if(document.getElementById('shuf').checked)pool=shuffle(pool);
    pool=pool.slice(0,Math.max(1,Math.min(+num.value||pool.length,pool.length)));
    start(pool);
  };
}
function start(pool){S={qs:pool.map(prep),i:0,right:0,log:[],done:false};show()}
function show(){
  const q=S.qs[S.i],n=S.qs.length;
  app.innerHTML=`
  <div><div class="meta"><span>${esc(TOPICS[q.t][0])}</span><span>Question ${S.i+1} of ${n} · ${S.right} correct</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><i style="width:${S.i/n*100}%"></i></div></div>
  <section class="card">
    <p class="qtext">${esc(q.text)}</p>
    <div class="choices">${q.opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="k">${'ABCDEF'[i]}</span><span class="t">${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>
  <div class="row"><button class="btn ghost" id="quit">End quiz</button><span></span></div>`;
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  document.getElementById('quit').onclick=results;
}
function answer(i){
  const q=S.qs[S.i],ok=i===q.ans;
  if(ok)S.right++;
  S.log.push({q,pick:i,ok});
  document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('good');else if(j===i)b.classList.add('bad')});
  const last=S.i===S.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Correct':'Not quite'}</b><p>${esc(q.why)}</p></div>
  <div style="margin-top:16px"><button class="btn" id="next">${last?'See results':'Next question'}</button></div>`;
  const nx=document.getElementById('next');nx.focus();
  nx.onclick=()=>{if(last)results();else{S.i++;show();window.scrollTo(0,0)}};
}
function results(){
  const n=S.log.length,pct=n?Math.round(S.right/n*100):0;
  const by={};S.log.forEach(l=>{const b=by[l.q.t]||(by[l.q.t]={r:0,n:0});b.n++;if(l.ok)b.r++});
  const miss=S.log.filter(l=>!l.ok);
  app.innerHTML=`
  <header><div class="label">Results</div><h2>${pct>=90?'Excellent work':pct>=70?'Solid showing':'Keep studying'}</h2></header>
  <section class="card">
    <div class="score">${S.right}/${n} <span style="font-size:1.4rem;color:var(--muted)">${pct}%</span></div>
    <div class="break">${Object.keys(by).map(k=>`<div><span>${esc(TOPICS[k][0])}</span><span>${by[k].r}/${by[k].n}</span></div>`).join('')}</div>
    <div class="row" style="justify-content:flex-start">
      ${miss.length?`<button class="btn" id="retry">Retry ${miss.length} missed</button>`:''}
      <button class="btn ghost" id="again">New quiz</button>
    </div>
  </section>
  ${miss.length?`<section class="card"><div class="label">Review missed questions</div>${miss.map(l=>`<div class="miss"><p><b>${esc(l.q.text)}</b></p><p class="you">You: ${esc(l.q.opts[l.pick])}</p><p class="ans">Answer: ${esc(l.q.opts[l.q.ans])}</p><p class="why">${esc(l.q.why)}</p></div>`).join('')}</section>`:''}`;
  window.scrollTo(0,0);
  const r=document.getElementById('retry');
  if(r)r.onclick=()=>start(shuffle(miss.map(l=>{const q=l.q;return [q.t,q.text,q.opts,q.ans,q.why]})));
  document.getElementById('again').onclick=setup;
}
setup();
</script>
