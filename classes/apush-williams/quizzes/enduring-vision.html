<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1c1b19; --sub:#5b574f; --line:#e4e0d6;
  --accent:#7c3a2d; --accent2:#2f5233; --good:#2f7a3f; --bad:#b5352b;
  --chip:#eee7d8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140f; --card:#221e18; --ink:#f1ece1; --sub:#c9c0ac; --line:#3a3327;
    --accent:#e08a6d; --accent2:#8fbf9a; --good:#7fcf8c; --bad:#f28b7f; --chip:#2c2618;
  }
}
:root[data-theme="dark"]{
  --bg:#17140f; --card:#221e18; --ink:#f1ece1; --sub:#c9c0ac; --line:#3a3327;
  --accent:#e08a6d; --accent2:#8fbf9a; --good:#7fcf8c; --bad:#f28b7f; --chip:#2c2618;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style',serif;}
.wrap{max-width:780px;margin:0 auto;padding:24px 18px 60px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.2px;}
.subtitle{color:var(--sub);font-size:.92rem;margin:0 0 20px;font-family:-apple-system,sans-serif;}

/* ---- Quiz setup ---- */
.setup-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;font-family:-apple-system,sans-serif;}
.setup-card h2{font-family:Georgia,serif;margin-top:0;font-size:1.1rem;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px;}
.chip{
  background:var(--chip);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:.85rem;cursor:pointer;color:var(--ink);user-select:none;
}
.chip.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn{
  font-family:-apple-system,sans-serif;font-weight:600;background:var(--accent);color:#fff;
  border:none;border-radius:10px;padding:11px 20px;font-size:.95rem;cursor:pointer;
}
.btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

/* ---- Quiz running ---- */
.progress-wrap{display:flex;justify-content:space-between;align-items:center;font-family:-apple-system,sans-serif;font-size:.82rem;color:var(--sub);margin-bottom:10px;}
.progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;background:var(--accent);transition:width .25s ease;}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;}
.q-chapter{font-family:-apple-system,sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:700;margin-bottom:6px;}
.q-text{font-size:1.15rem;line-height:1.45;margin:0 0 18px;}
.choice{
  display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:10px;font-family:-apple-system,sans-serif;
  font-size:.95rem;cursor:pointer;color:var(--ink);line-height:1.35;
}
.choice:hover{border-color:var(--accent);}
.choice.correct{border-color:var(--good);background:color-mix(in srgb, var(--good) 15%, var(--card));}
.choice.incorrect{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 15%, var(--card));}
.choice.disabled{cursor:default;}
.choice .letter{font-weight:700;margin-right:8px;color:var(--accent);}
.feedback{font-family:-apple-system,sans-serif;font-size:.9rem;margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--chip);display:none;}
.feedback.show{display:block;}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;}

/* ---- Results ---- */
.result-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;font-family:-apple-system,sans-serif;}
.score-big{font-size:2.6rem;font-weight:700;color:var(--accent);margin:8px 0;}
.score-sub{color:var(--sub);margin-bottom:18px;}
.chap-breakdown{text-align:left;margin-top:18px;}
.chap-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
.chap-row:last-child{border-bottom:none;}

select{
  font-family:-apple-system,sans-serif;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:.88rem;
}
.small{font-family:-apple-system,sans-serif;font-size:.8rem;color:var(--sub);}
</style>

<div class="wrap">
  <h1>The Enduring Vision — Ch. 2-6</h1>
  <p class="subtitle">100-question multiple choice quiz covering colonization through the Constitution</p>

  <!-- QUIZ PANEL -->
  <div id="panel-quiz">

    <div id="quiz-setup" class="setup-card">
      <h2>Set up your quiz</h2>
      <p class="small">Choose which chapters to include (defaults to all 100 questions).</p>
      <div class="chip-row" id="chapter-chips"></div>
      <div class="row" style="margin-bottom:14px;">
        <label class="small" for="qcount">Number of questions:</label>
        <select id="qcount"></select>
        <label class="small" style="margin-left:14px;">
          <input type="checkbox" id="shuffle-choices" checked> Shuffle answer order
        </label>
      </div>
      <button class="btn" id="start-quiz">Start Quiz</button>
    </div>

    <div id="quiz-running" style="display:none;">
      <div class="progress-wrap">
        <span id="progress-label"></span>
        <span id="score-label"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="q-card">
        <div class="q-chapter" id="q-chapter"></div>
        <p class="q-text" id="q-text"></p>
        <div id="q-choices"></div>
        <div class="feedback" id="q-feedback"></div>
      </div>
      <div class="nav-row">
        <button class="btn secondary" id="quit-quiz">End Quiz</button>
        <button class="btn" id="next-question" disabled>Next Question →</button>
      </div>
    </div>

    <div id="quiz-results" style="display:none;">
      <div class="result-card">
        <div class="small">YOUR SCORE</div>
        <div class="score-big" id="final-score"></div>
        <div class="score-sub" id="final-sub"></div>
        <div class="chap-breakdown" id="chap-breakdown"></div>
        <div class="row" style="justify-content:center;margin-top:20px;">
          <button class="btn" id="retake-quiz">Take Another Quiz</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const DATA = {"chapters": {"Ch2": "Ch. 2: The Rise of the Atlantic World, 1400-1625", "Ch3": "Ch. 3: Expansion and Diversity, 1625-1700", "Ch4": "Ch. 4: The Bonds of Empire, 1660-1750", "Ch5": "Ch. 5: Roads to Revolution, 1750-1776", "Ch6": "Ch. 6: Securing Independence, Defining Nationhood, 1776-1788"}, "questions": [{"chapter": "Ch2", "q": "In what year did Christopher Columbus land at the island he named San Salvador?", "choices": ["1488", "1492", "1498", "1502"], "answer": 1, "id": 1}, {"chapter": "Ch2", "q": "Which West African empire was the leading power in the West African savanna during the fifteenth century, known for its wealthy Muslim rulers and the city of Timbuktu?", "choices": ["Songhai", "Benin", "Mali", "Kongo"], "answer": 2, "id": 2}, {"chapter": "Ch2", "q": "What treaty, signed in 1492, drew a line in the mid-Atlantic dividing future discoveries between Spain and Portugal?", "choices": ["Treaty of Utrecht", "Treaty of Tordesillas", "Treaty of Westphalia", "Treaty of Ghent"], "answer": 1, "id": 3}, {"chapter": "Ch2", "q": "Who was the Portuguese prince who sponsored maritime exploration along the African coast in the early-to-mid fifteenth century?", "choices": ["Vasco da Gama", "Bartolomeu Dias", "Prince Henry the Navigator", "Ferdinand Magellan"], "answer": 2, "id": 4}, {"chapter": "Ch2", "q": "Which Portuguese navigator first rounded the Cape of Good Hope in 1488?", "choices": ["Bartolomeu Dias", "Vasco da Gama", "Christopher Columbus", "Amerigo Vespucci"], "answer": 0, "id": 5}, {"chapter": "Ch2", "q": "What German monk's 1517 attack on the sale of indulgences initiated the Protestant Reformation?", "choices": ["John Calvin", "Ignatius Loyola", "Martin Luther", "Thomas Cranmer"], "answer": 2, "id": 6}, {"chapter": "Ch2", "q": "Which theologian developed the doctrine of predestination, asserting that God had foreordained only a few \"elect\" for salvation?", "choices": ["Martin Luther", "John Calvin", "Teresa of Avila", "Ignatius Loyola"], "answer": 1, "id": 7}, {"chapter": "Ch2", "q": "King Henry VIII broke from the Roman Catholic Church in the 1530s primarily because of what conflict?", "choices": ["Disagreement over Church taxation policy", "His desire to annul his marriage to Catherine of Aragón since she had not produced a male heir", "A dispute over control of Irish territory", "His support for Calvinist doctrine"], "answer": 1, "id": 8}, {"chapter": "Ch2", "q": "What name was given to militant English Calvinists who sought to purify the Church of England of Catholic practices?", "choices": ["Puritans", "Huguenots", "Jesuits", "Anabaptists"], "answer": 0, "id": 9}, {"chapter": "Ch2", "q": "Which Spanish conquistador led the conquest of the Aztec empire, capturing Tenochtitlan by 1521?", "choices": ["Francisco Pizarro", "Hernán Cortés", "Juan Ponce de León", "Francisco Vásquez de Coronado"], "answer": 1, "id": 10}, {"chapter": "Ch2", "q": "Who served as Hernán Cortés's interpreter, diplomatic broker, and mistress during the conquest of the Aztecs?", "choices": ["Pocahontas", "Malintzin (Doña Marina)", "Squanto", "Teresa of Avila"], "answer": 1, "id": 11}, {"chapter": "Ch2", "q": "What disease, brought by the Spanish, devastated Native American populations and significantly aided the conquest of the Aztec and Inca empires?", "choices": ["Influenza", "Smallpox", "Typhus", "Bubonic plague"], "answer": 1, "id": 12}, {"chapter": "Ch2", "q": "What term describes the wide-ranging exchange of plants, animals, diseases, and people between the Eastern and Western Hemispheres after 1492?", "choices": ["The Atlantic exchange", "The Columbian exchange", "The mercantile exchange", "The triangular trade"], "answer": 1, "id": 13}, {"chapter": "Ch2", "q": "Which crop, adapted by Englishman John Rolfe, became the economic salvation of the Virginia colony?", "choices": ["Sugar", "Cotton", "Tobacco", "Rice"], "answer": 2, "id": 14}, {"chapter": "Ch2", "q": "What Spanish system granted colonists land, labor, and tribute from Native Americans in the Americas?", "choices": ["The hacienda", "The encomienda", "The repartimiento", "The cabildo"], "answer": 1, "id": 15}, {"chapter": "Ch2", "q": "Which English settlement, founded in the 1580s under Sir Walter Raleigh's patent, later became known as the \"Lost Colony\" after its inhabitants vanished?", "choices": ["Jamestown", "Roanoke", "Plymouth", "Sagadahoc"], "answer": 1, "id": 16}, {"chapter": "Ch2", "q": "Which document, signed in 1620 by the Mayflower's adult male passengers, established a form of self-government for the Plymouth colony?", "choices": ["The Fundamental Orders of Connecticut", "The Mayflower Compact", "The Virginia Charter", "The Magna Carta"], "answer": 1, "id": 17}, {"chapter": "Ch2", "q": "Samuel de Champlain founded the French colony of New France at which location in 1608?", "choices": ["Montreal", "Quebec", "Acadia", "Port Royal"], "answer": 1, "id": 18}, {"chapter": "Ch2", "q": "Which Dutch explorer, sailing for the Netherlands, explored the river later named for him and led to Dutch claims and the colony of New Netherland?", "choices": ["Henry Hudson", "Willem Barentsz", "Peter Minuit", "Peter Stuyvesant"], "answer": 0, "id": 19}, {"chapter": "Ch2", "q": "What was a major long-term consequence of the Virginia Company's mismanagement and the destructive Anglo-Powhatan Wars by 1624?", "choices": ["Virginia was granted full independence from England", "James I revoked the company's charter and Virginia became a royal colony", "The colony was abandoned entirely", "Virginia merged with the Plymouth colony"], "answer": 1, "id": 20}, {"chapter": "Ch3", "q": "What was the name of the address John Winthrop delivered in 1630 outlining the Puritans' vision for New England?", "choices": ["\"A Model of Christian Charity\"", "\"The New England Way\"", "\"The Bay Psalm Book\"", "\"A City of God\""], "answer": 0, "id": 21}, {"chapter": "Ch3", "q": "Which Native American group did Massachusetts and Connecticut colonists (aided by Mohegan and Narragansett allies) nearly annihilate in 1637, including a massacre at Mystic, Connecticut?", "choices": ["Wampanoag", "Pequot", "Narragansett", "Iroquois"], "answer": 1, "id": 22}, {"chapter": "Ch3", "q": "Roger Williams, banished from Massachusetts Bay in 1635, founded which colony that became known for religious toleration?", "choices": ["Connecticut", "New Haven", "Providence/Rhode Island", "Maryland"], "answer": 2, "id": 23}, {"chapter": "Ch3", "q": "Anne Hutchinson was accused of what heresy, which her critics termed \"Antinomianism\"?", "choices": ["Denying the Trinity", "Claiming ministers who judged \"signs of salvation\" in others' behavior were wrong, since only inward personal revelation mattered", "Refusing to baptize infants", "Advocating separation of church and Anglican doctrine"], "answer": 1, "id": 24}, {"chapter": "Ch3", "q": "What was the 1662 compromise that allowed baptized adults' children (including \"nonsaints\") to receive baptism, though without full church membership rights?", "choices": ["The Half-Way Covenant", "The Toleration Act", "The Cambridge Platform", "The Mayflower Compact"], "answer": 0, "id": 25}, {"chapter": "Ch3", "q": "Who was the Wampanoag sachem, son of Massasoit, who led Native resistance in the 1675-1676 conflict known as King Philip's War?", "choices": ["Opechancanough", "Miantonomi", "Metacom", "Popé"], "answer": 2, "id": 26}, {"chapter": "Ch3", "q": "Approximately what percentage of New England's Native American population did King Philip's War eliminate?", "choices": ["10 percent", "25 percent", "40 percent", "75 percent"], "answer": 2, "id": 27}, {"chapter": "Ch3", "q": "The Salem witchcraft crisis of 1692 began after several Salem Village girls accused whom of teaching them fortune-telling and sorcery?", "choices": ["Sarah Fiske", "Tituba, an enslaved woman", "Mary Rowlandson", "Increase Mather"], "answer": 1, "id": 28}, {"chapter": "Ch3", "q": "Most of the 342 people accused of witchcraft in the Salem episode shared what common characteristic, according to the chapter?", "choices": ["They were recent immigrants from England", "A disproportionate number were women who had inherited or stood to inherit property beyond the usual widow's third", "They were all elderly men", "They were all servants of wealthy planters"], "answer": 1, "id": 29}, {"chapter": "Ch3", "q": "What type of evidence—testimony that a spirit resembling the accused had tormented a victim—did Salem judges controversially allow despite legal prohibitions?", "choices": ["Hearsay evidence", "Spectral evidence", "Circumstantial evidence", "Confession under torture"], "answer": 1, "id": 30}, {"chapter": "Ch3", "q": "In Virginia, what system did planters use to acquire land by paying for the transportation of laborers (including servants), receiving acreage per person brought over?", "choices": ["The headright system", "The encomienda system", "The manor system", "The town meeting system"], "answer": 0, "id": 31}, {"chapter": "Ch3", "q": "What crop dominated the Chesapeake economy and drove the demand for indentured servant and later enslaved labor?", "choices": ["Rice", "Sugar", "Tobacco", "Indigo"], "answer": 2, "id": 32}, {"chapter": "Ch3", "q": "What 1649 Maryland law, passed by a Protestant-dominated assembly, extended freedom of worship (though not separation of church and state) chiefly to protect the colony's Catholic minority?", "choices": ["The Act for Religious Toleration", "The Half-Way Covenant", "The Fundamental Constitutions", "The Act of Establishment"], "answer": 0, "id": 33}, {"chapter": "Ch3", "q": "What uprising in Virginia (1675-1676), led by a wealthy planter against Governor Berkeley's Indian policy and eventually turning into an attack on Jamestown itself, revealed deep social tensions between poor freemen, small planters, and the colonial elite?", "choices": ["The Pequot War", "Bacon's Rebellion", "The Pueblo Revolt", "King Philip's War"], "answer": 1, "id": 34}, {"chapter": "Ch3", "q": "By roughly what year did Virginia and Maryland legally codify slavery as a lifelong, inheritable, racial status?", "choices": ["1619 and 1624", "1661 and 1670", "1700 and 1705", "1642 and 1649"], "answer": 1, "id": 35}, {"chapter": "Ch3", "q": "Which English colony, founded through a 1663 grant from Charles II and developing a rice-based plantation economy modeled partly on West Indian slave societies, achieved a black majority population by 1700?", "choices": ["New Jersey", "Pennsylvania", "Carolina", "New York"], "answer": 2, "id": 36}, {"chapter": "Ch3", "q": "Which two European powers had earlier established colonial outposts (New Netherland and New Sweden) in the region that England seized and reorganized into the middle colonies?", "choices": ["Spain and Portugal", "France and Spain", "The Dutch and the Swedes", "The Dutch and the French"], "answer": 2, "id": 37}, {"chapter": "Ch3", "q": "William Penn founded Pennsylvania in 1681 chiefly as a \"holy experiment\" for members of which religious group, who preached the \"Inner Light\" and were called Quakers?", "choices": ["The Puritans", "The Society of Friends (Quakers)", "The Anglicans", "The Huguenots"], "answer": 1, "id": 38}, {"chapter": "Ch3", "q": "What was the 1680 Native American revolt in New Mexico, led by Popé, that expelled Spanish colonizers from the region for twelve years?", "choices": ["The Bacon's Rebellion", "The Pueblo Revolt", "The Beaver Wars", "The Pequot War"], "answer": 1, "id": 39}, {"chapter": "Ch3", "q": "Which French adventurer descended the Mississippi River to its delta in 1682 and claimed the entire Mississippi basin for Louis XIV, naming the territory Louisiana?", "choices": ["Jacques Marquette", "Louis Jolliet", "Sieur de La Salle", "Jean-Baptiste Colbert"], "answer": 2, "id": 40}, {"chapter": "Ch4", "q": "What event in 1688-1689 replaced James II with William and Mary and produced England's Bill of Rights?", "choices": ["The Restoration", "The Glorious Revolution", "The Dominion of New England", "King William's War"], "answer": 1, "id": 41}, {"chapter": "Ch4", "q": "Which colonies did James II and Charles II consolidate into the \"Dominion of New England\" in 1686-1688, under governor Sir Edmund Andros?", "choices": ["Only Massachusetts", "Massachusetts, New Hampshire, Connecticut, Rhode Island, Plymouth, New York, and the Jerseys", "Virginia and Maryland", "New York and Pennsylvania"], "answer": 1, "id": 42}, {"chapter": "Ch4", "q": "Leisler's Rebellion of 1689 occurred in which colony?", "choices": ["Massachusetts", "Maryland", "New York", "Virginia"], "answer": 2, "id": 43}, {"chapter": "Ch4", "q": "In Maryland, John Coode's Protestant Association (1689) succeeded in doing what?", "choices": ["Restoring the Catholic proprietor's full authority", "Removing Catholics from office and making the Church of England the established religion (by 1692)", "Establishing full religious toleration for all faiths", "Abolishing the proprietorship permanently"], "answer": 1, "id": 44}, {"chapter": "Ch4", "q": "What was the primary purpose of Britain's Navigation Acts (beginning 1651/1660)?", "choices": ["To promote free trade with all European nations", "To restrict colonial trade to English/colonial ships and channel key goods through England, benefiting the mother country under mercantilism", "To grant colonies full independence in trade policy", "To ban all colonial manufacturing entirely"], "answer": 1, "id": 45}, {"chapter": "Ch4", "q": "The Molasses Act of 1733 was intended primarily to:", "choices": ["Raise general tax revenue for the crown", "Protect British West Indian sugar producers from French Caribbean competition", "Encourage colonists to distill rum for export to Africa", "Eliminate the slave trade"], "answer": 1, "id": 46}, {"chapter": "Ch4", "q": "Which goods were classified as \"enumerated\" and had to pass through England before being sold to foreign markets?", "choices": ["Grain, livestock, and fish", "Tobacco, rice,  "Banned slavery and limited landholding to 500 acres", "Was governed directly by France", "Had no relationship with the British Parliament"], "answer": 1, "id": 53}, {"chapter": "Ch4", "q": "The 1701 \"Grand Settlement\" negotiated by the Iroquois Confederacy with France and England was significant because it:", "choices": ["Ended the Iroquois Confederacy permanently", "Allowed the Iroquois to maintain neutrality between France and England while preserving their lands and diplomatic influence", "Forced the Iroquois to convert to Catholicism", "Gave France full military control over Iroquois territory"], "answer": 1, "id": 54}, {"chapter": "Ch4", "q": "The 1737 \"Walking Purchase\" in Pennsylvania resulted in:", "choices": ["The Delaware Indians gaining additional protected land", "A fraudulent deal that forced the Delaware Indians to cede roughly 1,200 additional square miles of land", "William Penn's sons renouncing all claims to Pennsylvania land", "A peaceful renegotiation that benefited the Delawares"], "answer": 1, "id": 55}, {"chapter": "Ch4", "q": "Which 1735 New York trial, involving printer John Peter Zenger, became a landmark moment for freedom of the press?", "choices": ["Zenger was convicted, establishing strict press controls", "Zenger was acquitted after his attorney Andrew Hamilton argued that true statements should not be considered libelous", "The trial resulted in the banning of all colonial newspapers", "Zenger fled the colony before the verdict"], "answer": 1, "id": 56}, {"chapter": "Ch4", "q": "Which English scientist's discoveries about gravity, published in 1687, were a major inspiration for the Enlightenment?", "choices": ["Robert Boyle", "Isaac Newton", "John Locke", "Francis Bacon"], "answer": 1, "id": 57}, {"chapter": "Ch4", "q": "Benjamin Franklin exemplified the American Enlightenment through activities such as founding which organization in 1743 to promote scientific inquiry?", "choices": ["The Junto", "The Board of Trade", "The Americ The Quartering Act"], "answer": 2, "id": 76}, {"chapter": "Ch5", "q": "The four Coercive Acts passed in response to the Boston Tea Party, combined with the Quebec Act, were collectively known to colonists as what?", "choices": ["The Navigation Acts", "The Intolerable Acts", "The Declaratory Acts", "The Proclamation Acts"], "answer": 1, "id": 77}, {"chapter": "Ch5", "q": "What document did the First Continental Congress (1774) endorse that declared the colonies owed no obedience to the Coercive Acts?", "choices": ["The Olive Branch Petition", "The Declaration of Independence", "The Suffolk Resolves", "The Albany Plan"], "answer": 2, "id": 78}, {"chapter": "Ch5", "q": "What battles in April 1775 marked the outbreak of armed conflict when British troops marched to seize colonial military supplies?", "choices": ["Bunker Hill and Breed's Hill", "Lexington and Concord", "Alamance Creek and Fort Stanwix", "Ticonderoga and Crown Point"], "answer": 1, "id": 79}, {"chapter": "Ch5", "q": "Thomas Paine's Common Sense (January 1776) is credited with doing what for the independence movement?", "choices": ["Proposing the Olive Branch Petition", "Persuading colonists that monarchy itself was illegitimate and independence was both practical and inevitable", "Convincing Congress to seek reconciliation with George III", "Establishing the Continental Association's boycott rules"], "answer": 1, "id": 80}, {"chapter": "Ch6", "q": "What is the title and time period covered by Chapter 6 of The Enduring Vision?", "choices": ["Securing Independence, Defining Nationhood, 1776-1788", "The Coming of Independence, 1774-1776", "Building a New Nation, 1789-1800", "Colonial America, 1750-1776"], "answer": 0, "id": 81}, {"chapter": "Ch6", "q": "Who was Agrippa Hull, whose story opens the chapter?", "choices": ["A free African-American from Massachusetts who served in the Continental Army for the duration of the war", "A Hessian mercenary who defected to the Americans", "A Mohawk chief who allied with the British", "A Quaker abolitionist from Pennsylvania"], "answer": 0, "id": 82}, {"chapter": "Ch6", "q": "Approximately what percentage of white colonists remained loyalists after the Declaration of Independence?", "choices": ["5 percent", "20 percent", "40 percent", "60 percent"], "answer": 1, "id": 83}, {"chapter": "Ch6", "q": "Which two states had the greatest loyalist strength, furnishing about half of all Americans who fought as loyalists?", "choices": ["Georgia and South Carolina", "New York and New Jersey", "Massachusetts and Connecticut", "Virginia and North Carolina"], "answer": 1, "id": 84}, {"chapter": "Ch6", "q": "Which Native American leader, a Mohawk chief, led most of the Six Nations Iroquois in supporting the British?", "choices": ["Joseph Brant", "Alexander McGillivray", "Samson Occum", "Hyder Ali"], "answer": 0, "id": 85}, {"chapter": "Ch6", "q": "What advantage did Britain hold at the start of the war?", "choices": ["A smaller population but better morale", "A far larger population and the world's largest navy", "Superior guerrilla warfare tactics", "Stronger alliances with France and Spain"], "answer": 1, "id": 86}, {"chapter": "Ch6", "q": "What was the significance of the Battle of Saratoga (1777)?", "choices": ["It ended the war in the South", "It was the war's turning point, convincing France to recognize American independence and enter the war", "It led to Washington's surrender at Valley Forge", "It secured the Ohio Valley for the Americans"], "answer": 1, "id": 87}, {"chapter": "Ch6", "q": "Which European drillmaster arrived at Valley Forge in 1778 and transformed the Continental Army into a more disciplined fighting force?", "choices": ["Marquis de Lafayette", "Friedrich von Steuben", "Thaddeus Kosciuszko", "Horatio Gates"], "answer": 1, "id": 88}, {"chapter": "Ch6", "q": "What was the outcome of the Battle of Camden (1780)?", "choices": ["A decisive American victory that turned the tide in the South", "The worst rebel defeat of the war  Confederation establish?", "choices": ["A strong national government with an independent executive branch", "A weak \"firm league of friendship\" among sovereign states with no independent executive or judiciary", "A monarchy under a constitutional framework", "A military government led by Washington"], "answer": 1, "id": 96}, {"chapter": "Ch6", "q": "What was Shays's Rebellion (1786-1787)?", "choices": ["A slave uprising in South Carolina", "An uprising of indebted Massachusetts farmers, led by Daniel Shays, that helped spur calls for a stronger central government", "A loyalist uprising in New York", "A Native American uprising in the Northwest Territory"], "answer": 1, "id": 97}, {"chapter": "Ch6", "q": "At the Philadelphia Convention, what was the key difference between the Virginia Plan and the New Jersey Plan?", "choices": ["The Virginia Plan favored representation by population; the New Jersey Plan favored equal representation for each state", "The Virginia Plan abolished slavery; the New Jersey Plan protected it", "The Virginia Plan created a monarchy; the New Jersey Plan created a republic", "The Virginia Plan was proposed by small states; the New Jersey Plan by large states"], "answer": 0, "id": 98}, {"chapter": "Ch6", "q": "What compromise resolved the dispute between the Virginia and New Jersey Plans?", "choices": ["The Three-Fifths Compromise", "The Great (Connecticut) Compromise, giving equal state representation in the Senate and population-based representation in the House", "The Missouri Compromise", "The Compromise of 1850"], "answer": 1, "id": 99}, {"chapter": "Ch6", "q": "What was the essential argument of Antifederalists against the proposed Constitution?", "choices": ["That it gave too little power to the national government", "That it created excessive centralized power that threatened states' sovereignty and individual liberties without a bill of rights", "That it did not go far enough to abolish slavery", "That it failed to establish a strong navy"], "answer": 1, "id": 100}]};
const CHAPTERS = DATA.chapters;
const ALL_Q = DATA.questions;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---------------- QUIZ SETUP ---------------- */
const chipRow = document.getElementById('chapter-chips');
const chapKeys = Object.keys(CHAPTERS);
let selectedChapters = new Set(chapKeys);

chapKeys.forEach(key=>{
  const chip = document.createElement('div');
  chip.className='chip selected';
  chip.textContent = key.replace('Ch','Ch. ');
  chip.dataset.key = key;
  chip.addEventListener('click', ()=>{
    if(selectedChapters.has(key)){
      selectedChapters.delete(key);
      chip.classList.remove('selected');
    } else {
      selectedChapters.add(key);
      chip.classList.add('selected');
    }
    updateCountOptions();
  });
  chipRow.appendChild(chip);
});

const qcountSel = document.getElementById('qcount');
function updateCountOptions(){
  const avail = ALL_Q.filter(q=>selectedChapters.has(q.chapter)).length;
  qcountSel.innerHTML='';
  const opts = [10,20,30,50];
  opts.forEach(n=>{
    if(n<=avail){
      const o=document.createElement('option');
      o.value=n; o.textContent=n+' questions';
      qcountSel.appendChild(o);
    }
  });
  const o=document.createElement('option');
  o.value=avail; o.textContent='All '+avail+' questions';
  o.selected=true;
  qcountSel.appendChild(o);
}
updateCountOptions();

let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let chapStats = {};

document.getElementById('start-quiz').addEventListener('click', ()=>{
  const pool = ALL_Q.filter(q=>selectedChapters.has(q.chapter));
  if(pool.length===0){ alert('Select at least one chapter.'); return; }
  const n = Math.min(parseInt(qcountSel.value,10), pool.length);
  const doShuffleChoices = document.getElementById('shuffle-choices').checked;
  quizQuestions = shuffle(pool).slice(0,n).map(q=>{
    let choiceOrder = [0,1,2,3];
    if(doShuffleChoices) choiceOrder = shuffle(choiceOrder);
    return {
      id:q.id, chapter:q.chapter, q:q.q,
      choices: choiceOrder.map(i=>q.choices[i]),
      answer: choiceOrder.indexOf(q.answer)
    };
  });
  quizIndex=0; quizScore=0; chapStats={};
  chapKeys.forEach(k=>chapStats[k]={correct:0,total:0});
  document.getElementById('quiz-setup').style.display='none';
  document.getElementById('quiz-results').style.display='none';
  document.getElementById('quiz-running').style.display='block';
  renderQuestion();
});

function renderQuestion(){
  quizAnswered = false;
  const q = quizQuestions[quizIndex];
  document.getElementById('progress-label').textContent = 'Question '+(quizIndex+1)+' of '+quizQuestions.length;
  document.getElementById('score-label').textContent = 'Score: '+quizScore+'/'+quizIndex;
  document.getElementById('progress-fill').style.width = (100*quizIndex/quizQuestions.length)+'%';
  document.getElementById('q-chapter').textContent = CHAPTERS[q.chapter];
  document.getElementById('q-text').textContent = q.q;
  const choicesDiv = document.getElementById('q-choices');
  choicesDiv.innerHTML='';
  const letters=['A','B','C','D'];
  q.choices.forEach((choice, idx)=>{
    const btn = document.createElement('button');
    btn.className='choice';
    btn.innerHTML = '<span class="letter">'+letters[idx]+')</span>'+choice;
    btn.addEventListener('click', ()=>selectAnswer(idx));
    choicesDiv.appendChild(btn);
  });
  document.getElementById('q-feedback').classList.remove('show');
  document.getElementById('next-question').disabled = true;
}

function selectAnswer(idx){
  if(quizAnswered) return;
  quizAnswered = true;
  const q = quizQuestions[quizIndex];
  const buttons = document.querySelectorAll('#q-choices .choice');
  buttons.forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===q.answer) b.classList.add('correct');
    else if(i===idx) b.classList.add('incorrect');
  });
  chapStats[q.chapter].total++;
  const fb = document.getElementById('q-feedback');
  fb.classList.add('show');
  if(idx===q.answer){
    quizScore++;
    chapStats[q.chapter].correct++;
    fb.textContent = 'Correct!';
  } else {
    const letters=['A','B','C','D'];
    fb.textContent = 'Not quite — the correct answer is '+letters[q.answer]+') '+q.choices[q.answer];
  }
  document.getElementById('score-label').textContent = 'Score: '+quizScore+'/'+(quizIndex+1);
  document.getElementById('next-question').disabled = false;
}

document.getElementById('next-question').addEventListener('click', ()=>{
  quizIndex++;
  if(quizIndex>=quizQuestions.length){
    showResults();
  } else {
    renderQuestion();
  }
});

document.getElementById('quit-quiz').addEventListener('click', ()=>{
  if(confirm('End this quiz and see your current results?')) showResults();
});

function showResults(){
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('quiz-running').style.display='none';
  document.getElementById('quiz-results').style.display='block';
  const answeredCount = Object.values(chapStats).reduce((a,c)=>a+c.total,0);
  document.getElementById('final-score').textContent = quizScore+' / '+answeredCount;
  const pct = answeredCount? Math.round(100*quizScore/answeredCount):0;
  document.getElementById('final-sub').textContent = pct+'% correct';
  const breakdown = document.getElementById('chap-breakdown');
  breakdown.innerHTML='';
  chapKeys.forEach(k=>{
    const s = chapStats[k];
    if(s.total===0) return;
    const row = document.createElement('div');
    row.className='chap-row';
    row.innerHTML = '<span>'+CHAPTERS[k]+'</span><span>'+s.correct+'/'+s.total+'</span>';
    breakdown.appendChild(row);
  });
}

document.getElementById('retake-quiz').addEventListener('click', ()=>{
  document.getElementById('quiz-results').style.display='none';
  document.getElementById('quiz-setup').style.display='block';
});
</script>
