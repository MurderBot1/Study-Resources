    topic: s15-1
    question: 'The value of \(\displaystyle\int_0^1\int_2^{4-2x}dy\,dx\) is'
    A: '\(\frac{1}{2}\)'
    B: '\(4\)'
    C: '\(2\)'
    D: '\(1\)'
    answer: D
    hint: It is the area of a triangle.
    explanation: '\(\int_0^1(2-2x)dx=1\).'
  30:
    topic: s15-1
    question: 'The value of \(\displaystyle\int_0^1\int_y^{\sqrt y}dx\,dy\) is'
    A: '\(\frac{1}{3}\)'
    B: '\(\frac{1}{12}\)'
    C: '\(\frac{1}{6}\)'
    D: '\(\frac{1}{2}\)'
    answer: C
    hint: 'The area between \(y=x\) and \(y=x^2\).'
    explanation: '\(\int_0^1(x-x^2)dx=\tfrac16\).'
  31:
    topic: s15-1
    question: 'The value of \(\displaystyle\int_0^{\ln2}\int_{e^x}^2dy\,dx\) is'
    A: '\(2 \ln{\left(2 \right)}\)'
