  321:
    topic: s15-6
    question: 'A thick-walled cylinder (density \(1\)) has inner radius \(1\), outer radius \(2\), and height from \(z=0\) to \(z=4\). Its moment of inertia about the \(z\)-axis is'
    A: '\(15 \pi\)'
    B: '\(30 \pi\)'
    C: '\(12 \pi\)'
