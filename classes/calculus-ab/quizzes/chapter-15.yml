  11:
    topic: s15-1
    question: 'Integrate \(f(x,y)=x/y\) over the region in the first quadrant bounded by \(y=x\), \(y=2x\), \(x=1\), \(x=2\).'
    A: '\(1 + \frac{3 \ln{\left(2 \right)}}{2}\)'
    B: '\(\frac{3 \ln{\left(2 \right)}}{2}\)'
    C: '\(- \frac{3 \ln{\left(2 \right)}}{2}\)'
    D: '\(3 \ln{\left(2 \right)}\)'
    answer: B
    hint: 'Integrate in \(y\) from \(x\) to \(2x\) first.'
    explanation: '\(\int_1^2x\ln2\,dx\).'
  12:
    topic: s15-1
    question: 'Integrate \(f(x,y)=\dfrac1{xy}\) over the square \(1\le x\le2\), \(1\le y\le2\).'
    A: '\(\ln{\left(2 \right)}^{2}\)'
    B: '\(- \ln{\left(2 \right)}^{2}\)'
    C: '\(\ln{\left(2 \right)}^{2} + 1\)'
    D: '\(2 \ln{\left(2 \right)}^{2}\)'
    answer: A
    hint: The integrand separates.
    explanation: '\((\ln2)^2\).'
  13:
    topic: s15-1
    question: 'Integrate \(f(x,y)=x^2+y^2\) over the triangle with vertices \((0,0)\), \((1,0)\), \((0,1)\).'
    A: '\(\frac{1}{6}\)'
    B: '\(- \frac{1}{6}\)'
    C: '\(\frac{7}{6}\)'
    D: '\(\frac{1}{3}\)'
    answer: A
    hint: 'The hypotenuse is \(y=1-x\).'
    explanation: 'Integrate \(y\) from \(0\) to \(1-x\).'
  14:
    topic: s15-1
    question: 'Integrate \(f(x,y)=y\cos xy\) over the rectangle \(0\le x\le\pi\), \(0\le y\le1\).'
    A: '\(\frac{2 + \pi}{\pi}\)'
    B: '\(\frac{2}{\pi}\)'
    C: '\(- \frac{2}{\pi}\)'
    D: '\(\frac{4}{\pi}\)'
    answer: B
    hint: 'Integrate in \(x\) first.'
    explanation: 'The inner integral is \(\sin\pi y\).'
  15:
    topic: s15-1
    question: 'Integrate \(f(u,v)=v-\sqrt u\) over the triangle cut from the first quadrant of the \(uv\)-plane by \(u+v=1\).'
    A: '\(\frac{1}{10}\)'
    B: '\(\frac{9}{10}\)'
    C: '\(- \frac{1}{10}\)'
    D: '\(- \frac{1}{5}\)'
    answer: C
    hint: 'The region is \(0\le u\le1\), \(0\le v\le1-u\).'
    explanation: 'Integrate in \(v\) first.'
  16:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_{-2}^0\int_v^{-v}2\,dp\,dv\).'
    A: '\(16\)'
    B: '\(8\)'
    C: '\(9\)'
    D: '\(-8\)'
    answer: B
    hint: Integrate the inner variable first.
    explanation: The integrand is constant in the inner variable.
  17:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_{-\pi/3}^{\pi/3}\int_0^{\sec t}3\cos t\,du\,dt\).'
    A: '\(4 \pi\)'
    B: '\(1 + 2 \pi\)'
    C: '\(- 2 \pi\)'
    D: '\(2 \pi\)'
    answer: D
    hint: Integrate the inner variable first.
    explanation: The integrand is constant in the inner variable.
  18:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^1\int_0^{\sqrt{1-s^2}}8t\,dt\,ds\).'
    A: '\(\frac{16}{3}\)'
    B: '\(4\)'
    C: '\(\frac{8}{3}\)'
    D: '\(\frac{4}{3}\)'
    answer: C
    hint: 'Inner integral: \(4(1-s^2)\).'
    explanation: '\(\int_0^14(1-s^2)ds=\tfrac83\).'
  19:
    topic: s15-1
    question: 'Reversing the order of integration in \(\displaystyle\int_0^1\int_2^{4-2x}dy\,dx\) gives'
    A: '\(\displaystyle\int_2^4\int_0^{4-2y}dx\,dy\)'
    B: '\(\displaystyle\int_0^1\int_0^{(4-y)/2}dx\,dy\)'
    C: '\(\displaystyle\int_2^4\int_0^{(4-y)/2}dx\,dy\)'
    D: '\(\displaystyle\int_0^2\int_0^{(4-y)/2}dx\,dy\)'
    answer: C
    hint: Sketch the region and describe it with the other variable on the outside.
    explanation: The region is the same; only the description of its boundary changes.
  20:
    topic: s15-1
    question: 'Reversing the order of integration in \(\displaystyle\int_0^2\int_{y-2}^0dx\,dy\) gives'
