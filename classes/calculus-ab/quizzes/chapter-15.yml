    C: '\(-1 + 2 \ln{\left(2 \right)}\)'
    D: '\(1 - \ln{\left(2 \right)}\)'
    answer: C
    hint: '\(\int_0^{\ln2}(2-e^x)dx\).'
    explanation: '\(2\ln2-1\).'
  32:
    topic: s15-1
    question: 'The value of \(\displaystyle\int_0^{3/2}\int_0^{9-4x^2}16x\,dy\,dx\) is'
    A: '\(36\)'
    B: '\(72\)'
    C: '\(27\)'
    D: '\(18\)'
    answer: A
    hint: 'Integrate in \(y\) first: \(16x(9-4x^2)\).'
    explanation: '\(\int_0^{3/2}(144x-64x^3)dx=36\).'
  33:
    topic: s15-1
    question: 'The value of \(\displaystyle\int_0^2\int_0^{4-y^2}y\,dx\,dy\) is'
    A: '\(8\)'
    B: '\(2\)'
    C: '\(4\)'
    D: '\(16\)'
    answer: C
    hint: 'Integrate in \(x\) first.'
    explanation: '\(\int_0^2y(4-y^2)dy=8-4=4\).'
  34:
    topic: s15-1
    question: 'The value of \(\displaystyle\int_0^2\int_{-\sqrt{4-x^2}}^{\sqrt{4-x^2}}6x\,dy\,dx\) is'
    A: '\(32\)'
    B: '\(8\)'
    C: '\(16\)'
    D: '\(12\)'
    answer: C
    hint: 'Integrate in \(y\) first.'
    explanation: '\(\int_0^212x\sqrt{4-x^2}\,dx=16\).'
  35:
    topic: s15-1
    question: 'The value of \(\displaystyle\int_{-1}^1\int_{-\sqrt{1-y^2}}^{\sqrt{1-y^2}}3y\,dx\,dy\) is'
    A: '\(0\)'
    B: '\(\pi\)'
    C: '\(\frac{3}{2}\)'
    D: '\(3\)'
    answer: A
    hint: 'The integrand is odd in \(y\) over a region symmetric about the \(x\)-axis.'
    explanation: 'The region is the unit disk and \(3y\) is odd.'
  36:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^\pi\int_x^\pi\frac{\sin y}{y}\,dy\,dx\) by reversing the order of integration.'
    A: '\(-2\)'
    B: '\(2\)'
    C: '\(4\)'
    D: '\(3\)'
    answer: B
    hint: 'Reverse: \(0\le x\le y\), \(0\le y\le\pi\).'
    explanation: '\(\int_0^\pi\sin y\,dy=2\).'
  37:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^2\int_x^22y^2\sin xy\,dy\,dx\) by reversing the order of integration.'
    A: '\(5 - \sin{\left(4 \right)}\)'
    B: '\(-4 + \sin{\left(4 \right)}\)'
    C: '\(8 - 2 \sin{\left(4 \right)}\)'
    D: '\(4 - \sin{\left(4 \right)}\)'
    answer: D
    hint: 'Reverse: \(0\le x\le y\), \(0\le y\le2\); integrate in \(x\) first.'
    explanation: '\(\int_0^22y(1-\cos y^2)dy=4-\sin4\).'
  38:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^1\int_y^1x^2e^{xy}\,dx\,dy\) by reversing the order of integration.'
    A: '\(-1 + \frac{e}{2}\)'
    B: '\(\frac{e}{2}\)'
    C: '\(1 - \frac{e}{2}\)'
    D: '\(-2 + e\)'
    answer: A
    hint: 'Reverse: \(0\le y\le x\), \(0\le x\le1\).'
    explanation: '\(\int_0^1x(e^{x^2}-1)dx=\tfrac e2-1\).'
  39:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^2\int_0^{4-x^2}\frac{xe^{2y}}{4-y}\,dy\,dx\) by reversing the order of integration.'
    A: '\(- \frac{1}{2} + \frac{e^{8}}{2}\)'
    B: '\(\frac{1}{4} - \frac{e^{8}}{4}\)'
    C: '\(\frac{3}{4} + \frac{e^{8}}{4}\)'
    D: '\(- \frac{1}{4} + \frac{e^{8}}{4}\)'
    answer: D
    hint: 'Reverse: \(0\le x\le\sqrt{4-y}\), \(0\le y\le4\).'
    explanation: '\(\int_0^4\tfrac12e^{2y}dy=\tfrac{e^8-1}4\).'
  40:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^{2\sqrt{\ln3}}\int_{y/2}^{\sqrt{\ln3}}e^{x^2}\,dx\,dy\) by reversing the order of integration.'
    A: '\(3\)'
    B: '\(2\)'
    C: '\(-2\)'
    D: '\(4\)'
    answer: B
    hint: 'Reverse: \(0\le y\le2x\), \(0\le x\le\sqrt{\ln3}\).'
    explanation: '\(\int_0^{\sqrt{\ln3}}2xe^{x^2}dx=3-1=2\).'
  41:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^3\int_{\sqrt{x/3}}^1e^{y^3}\,dy\,dx\) by reversing the order of integration.'
    A: '\(e\)'
    B: '\(-1 + e\)'
    C: '\(1 - e\)'
    D: '\(-2 + 2 e\)'
    answer: B
    hint: 'Reverse: \(0\le x\le3y^2\), \(0\le y\le1\).'
    explanation: '\(\int_0^13y^2e^{y^3}dy=e-1\).'
  42:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^{1/16}\int_{y^{1/4}}^{1/2}\cos(16\pi x^5)\,dx\,dy\) by reversing the order of integration.'
