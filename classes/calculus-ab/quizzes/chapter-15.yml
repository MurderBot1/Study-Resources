    question: 'An isosceles triangle with base \(2a\) and altitude \(h\) lies on the diameter of a semicircle of radius \(a\) (the triangle above, the semicircle below). The centroid of the union lies on the common boundary when'
    A: '\(h=a\)'
    B: '\(h=\sqrt2\,a\)'
    C: '\(h=\sqrt3\,a\)'
    D: '\(h=2a\)'
    answer: B
    hint: 'Balance the moments about the common base: triangle \((ah)(h/3)\) against semicircle \(\left(\tfrac{\pi a^2}2\right)\left(\tfrac{4a}{3\pi}\right)\).'
    explanation: '\(\tfrac{ah^2}3=\tfrac{2a^3}3\Rightarrow h^2=2a^2\).'
  132:
    topic: s15-2
    question: 'An isosceles triangle of altitude \(h\) has as its base one side of a square of side \(s\) (the triangle above, the square below, not overlapping). The centroid of the union lies on the base when'
    A: '\(h=s\)'
    B: '\(h=2s\)'
    C: '\(h=\sqrt3\,s\)'
    D: '\(h=\sqrt2\,s\)'
    answer: C
    hint: 'Balance moments about the base: triangle \(\left(\tfrac{sh}2\right)\left(\tfrac h3\right)\) against square \(s^2\cdot\tfrac s2\).'
    explanation: '\(\tfrac{sh^2}6=\tfrac{s^3}2\Rightarrow h^2=3s^2\).'
