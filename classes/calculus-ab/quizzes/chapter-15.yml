    B: '\(\phi=\pi/4\)'
    C: '\(\phi=\pi/3\)'
    D: '\(\phi=\pi/2\)'
    answer: B
    hint: 'On the cone \(\tan\phi=r/z=1\).'
    explanation: '\(\phi=\pi/4\).'
  338:
    topic: s15-7
    question: 'Solving \(u=x-y\), \(v=2x+y\) for \(x,y\) gives'
    A: '\(x=u+v\), \(y=-2u+v\)'
    B: '\(x=\dfrac{u+v}2\), \(y=\dfrac{-2u+v}2\)'
    C: '\(x=\dfrac{u+v}3\), \(y=\dfrac{-2u+v}3\)'
    D: '\(x=\dfrac{u-v}3\), \(y=\dfrac{2u+v}3\)'
    answer: C
    hint: 'Add the equations to eliminate \(y\).'
    explanation: '\(u+v=3x\); \(v-2u=3y\).'
  339:
    topic: s15-7
    question: 'For \(u=x-y\), \(v=2x+y\), the Jacobian \(\dfrac{\partial(x,y)}{\partial(u,v)}\) equals'
    A: '\(3\)'
    B: '\(\frac{1}{9}\)'
    C: '\(\frac{1}{3}\)'
    D: '\(- \frac{1}{3}\)'
    answer: C
    hint: 'Use \(x=\tfrac{u+v}3\), \(y=\tfrac{-2u+v}3\).'
    explanation: '\(\tfrac13\cdot\tfrac13-\tfrac13\cdot\left(-\tfrac23\right)=\tfrac13\).'
  340:
    topic: s15-7
    question: 'Under \(u=x-y\), \(v=2x+y\), the triangle with vertices \((0,0)\), \((1,1)\), \((1,-2)\) is mapped to the triangle in the \(uv\)-plane with vertices'
    A: '\((0,0)\), \((3,3)\), \((3,0)\)'
    B: '\((0,0)\), \((0,3)\), \((3,0)\)'
    C: '\((0,0)\), \((0,1)\), \((1,0)\)'
    D: '\((0,0)\), \((0,-3)\), \((3,0)\)'
    answer: B
    hint: 'Evaluate \(u\) and \(v\) at each vertex.'
    explanation: '\((1,1)\mapsto(0,3)\) and \((1,-2)\mapsto(3,0)\).'
  341:
    topic: s15-7
    question: 'For \(u=x+2y\), \(v=x-y\), solving for \(x,y\) gives'
    A: '\(x=\dfrac{u-2v}3\), \(y=\dfrac{u+v}3\)'
    B: '\(x=u+2v\), \(y=u-v\)'
    C: '\(x=\dfrac{u+2v}3\), \(y=\dfrac{u-v}3\)'
    D: '\(x=\dfrac{2u+v}3\), \(y=\dfrac{u-v}3\)'
    answer: C
    hint: 'Subtract the second equation from the first to find \(y\).'
    explanation: '\(u-v=3y\).'
  342:
    topic: s15-7
    question: 'For \(u=x+2y\), \(v=x-y\), the Jacobian \(\dfrac{\partial(x,y)}{\partial(u,v)}\) is'
    A: '\(- \frac{1}{9}\)'
    B: '\(- \frac{1}{3}\)'
    C: '\(\frac{1}{3}\)'
    D: '\(-3\)'
    answer: B
    hint: 'Differentiate \(x=\tfrac{u+2v}3\), \(y=\tfrac{u-v}3\).'
    explanation: '\(\tfrac13(-\tfrac13)-\tfrac23\cdot\tfrac13=-\tfrac13\).'
  343:
    topic: s15-7
    question: 'Under \(u=x+2y\), \(v=x-y\), the triangle bounded by \(y=0\), \(y=x\), and \(x+2y=2\) is mapped to the triangle in the \(uv\)-plane with vertices'
    A: '\((0,0)\), \((2,0)\), \((0,2)\)'
    B: '\((0,0)\), \((1,1)\), \((2,0)\)'
    C: '\((0,0)\), \((2,2)\), \((2,0)\)'
    D: '\((0,0)\), \((2,-2)\), \((2,0)\)'
    answer: C
    hint: 'The vertices are \((0,0)\), \((2,0)\), \(\left(\tfrac23,\tfrac23\right)\).'
    explanation: '\((2,0)\mapsto(2,2)\); \(\left(\tfrac23,\tfrac23\right)\mapsto(2,0)\).'
  344:
    topic: s15-7
    question: 'For \(u=3x+2y\), \(v=x+4y\), solving gives'
    A: '\(x=\dfrac{2u-v}5\), \(y=\dfrac{-u+3v}{10}\)'
    B: '\(x=\dfrac{4u-2v}{10}\), \(y=\dfrac{-u+3v}{5}\)'
    C: '\(x=\dfrac{2u+v}5\), \(y=\dfrac{u+3v}{10}\)'
    D: '\(x=\dfrac{u-2v}5\), \(y=\dfrac{3u-v}{10}\)'
    answer: A
    hint: 'Eliminate \(y\): \(2u-v=5x\).'
    explanation: 'And \(3v-u=10y\).'
  345:
    topic: s15-7
    question: 'For \(u=3x+2y\), \(v=x+4y\), the Jacobian \(\dfrac{\partial(x,y)}{\partial(u,v)}\) is'
    A: '\(\frac{1}{10}\)'
    B: '\(\frac{1}{5}\)'
    C: '\(\frac{1}{50}\)'
    D: '\(10\)'
    answer: A
    hint: 'Differentiate \(x=\tfrac{2u-v}5\), \(y=\tfrac{3v-u}{10}\).'
    explanation: '\(\tfrac25\cdot\tfrac3{10}-\left(-\tfrac15\right)\left(-\tfrac1{10}\right)=\tfrac{6}{50}-\tfrac1{50}=\tfrac1{10}\).'
  346:
    topic: s15-7
    question: 'For \(u=2x-3y\), \(v=-x+y\), solving gives'
    A: '\(x=-u-3v\), \(y=u+2v\)'
    B: '\(x=u+3v\), \(y=u+2v\)'
    C: '\(x=-u-3v\), \(y=-u-2v\)'
    D: '\(x=-u+3v\), \(y=-u-2v\)'
    answer: C
    hint: 'Add \(2\times\)second equation to the first.'
    explanation: '\(u+2v=-y\).'
  347:
    topic: s15-7
    question: 'For \(u=2x-3y\), \(v=-x+y\), the Jacobian \(\dfrac{\partial(x,y)}{\partial(u,v)}\) is'
    A: '\(1\)'
    B: '\(5\)'
    C: '\(-5\)'
    D: '\(-1\)'
    answer: D
    hint: '\(x=-u-3v\), \(y=-u-2v\).'
    explanation: '\((-1)(-2)-(-3)(-1)=2-3=-1\).'
  348:
    topic: s15-7
    question: '\(\displaystyle\iint_R(2x^2-xy-y^2)\,dx\,dy\) over the first-quadrant region bounded by \(y=-2x+4\), \(y=-2x+7\), \(y=x-2\), \(y=x+1\), using \(u=x-y\), \(v=2x+y\), equals'
    A: '\(33\)'
    B: '\(\frac{33}{2}\)'
    C: '\(\frac{33}{4}\)'
    D: '\(\frac{11}{4}\)'
    answer: C
    hint: 'Note \(2x^2-xy-y^2=(2x+y)(x-y)=uv\), and \(|J|=\tfrac13\).'
    explanation: 'The region becomes \(-1\le u\le2\), \(4\le v\le7\): \(\tfrac13\cdot\tfrac32\cdot\tfrac{33}2\).'
  349:
    topic: s15-7
    question: '\(\displaystyle\iint_R(3x^2+14xy+8y^2)\,dx\,dy\) over the first-quadrant region bounded by \(y=-\tfrac32x+1\), \(y=-\tfrac32x+3\), \(y=-\tfrac14x\), \(y=-\tfrac14x+1\), using \(u=3x+2y\), \(v=x+4y\), equals'
    A: '\(\frac{128}{5}\)'
    B: '\(\frac{32}{5}\)'
    C: '\(\frac{64}{5}\)'
    D: '\(128\)'
    answer: C
    hint: '\(3x^2+14xy+8y^2=(3x+2y)(x+4y)=uv\), \(|J|=\tfrac1{10}\).'
    explanation: 'The region is \(2\le u\le6\), \(0\le v\le4\): \(\tfrac1{10}\cdot16\cdot8\).'
  350:
    topic: s15-7
    question: '\(\displaystyle\iint_R2(x-y)\,dx\,dy\) over the parallelogram bounded by \(x=-3\), \(x=0\), \(y=x\), \(y=x+1\), using \(u=2x-3y\), \(v=-x+y\), equals'
    A: '\(3\)'
    B: '\(-6\)'
    C: '\(-3\)'
    D: '\(6\)'
    answer: C
    hint: '\(x-y=-v\) and \(|J|=1\); the region is \(0\le v\le1\), \(-3v\le u\le3-3v\).'
    explanation: '\(\int_0^1(-2v)(3)\,dv=-3\).'
  351:
    topic: s15-7
    question: '\(\displaystyle\iint_R\left(\sqrt{y/x}+\sqrt{xy}\right)dx\,dy\) over the first-quadrant region bounded by \(xy=1\), \(xy=9\), \(y=x\), \(y=4x\), with \(x=u/v\), \(y=uv\), equals'
    A: '\(16 + \frac{104 \ln{\left(2 \right)}}{3}\)'
    B: '\(\frac{26 \ln{\left(2 \right)}}{3} + 8\)'
    C: '\(4 + \frac{26 \ln{\left(2 \right)}}{3}\)'
    D: '\(8 + \frac{52 \ln{\left(2 \right)}}{3}\)'
    answer: D
    hint: '\(J=\dfrac{2u}{v}\), \(\sqrt{y/x}=v\), \(\sqrt{xy}=u\); the region is \(1\le u\le3\), \(1\le v\le2\).'
    explanation: '\(\int_1^3\int_1^2(u+v)\dfrac{2u}v\,dv\,du=8+\tfrac{52}3\ln2\).'
  352:
    topic: s15-7
    question: 'For \(x=u\), \(y=uv\), the Jacobian \(\dfrac{\partial(x,y)}{\partial(u,v)}\) is'
    A: '\(v\)'
    B: '\(u v\)'
    C: '\(1\)'
    D: '\(u\)'
    answer: D
    hint: '\(\begin{vmatrix}1&0\\v&u\end{vmatrix}\).'
    explanation: '\(1\cdot u-0\cdot v=u\).'
  353:
    topic: s15-7
    question: 'With \(x=u\), \(y=uv\), the integral \(\displaystyle\int_1^2\int_1^2\frac yx\,dx\,dy\) equals'
    A: '\(\frac{3 \ln{\left(2 \right)}}{4}\)'
    B: '\(\frac{3 \ln{\left(2 \right)}}{2}\)'
    C: '\(\ln{\left(2 \right)}\)'
    D: '\(3 \ln{\left(2 \right)}\)'
    answer: B
    hint: 'In the \(uv\)-plane \(y/x=v\) and the region is \(1\le u\le2\), \(\tfrac1u\le v\le\tfrac2u\).'
    explanation: 'Directly: \(\int_1^2y\,dy\int_1^2\tfrac{dx}x=\tfrac32\ln2\).'
  354:
    topic: s15-7
    question: 'A thin elliptical plate \(x^2/a^2+y^2/b^2\le1\) (density \(1\)) has polar moment of inertia \(I_0=\) (use \(x=ar\cos\theta\), \(y=br\sin\theta\))'
    A: '\(\frac{\pi a b \left(a^{2} + b^{2}\right)}{4}\)'
    B: '\(\frac{\pi a b \left(a^{2} + b^{2}\right)}{2}\)'
    C: '\(\frac{\pi a b \left(a + b\right)}{4}\)'
    D: '\(\frac{\pi a^{2} b^{2}}{4}\)'
    answer: A
    hint: '\(J=abr\) and \(x^2+y^2=r^2(a^2\cos^2\theta+b^2\sin^2\theta)\).'
    explanation: '\(ab\cdot\tfrac14\cdot\pi(a^2+b^2)\).'
  355:
    topic: s15-7
    question: 'The Jacobian of the transformation \(x=ar\cos\theta\), \(y=br\sin\theta\) is'
    A: '\(ab\)'
    B: '\(r\)'
    C: '\(a^2b^2r\)'
    D: '\(abr\)'
    answer: D
    hint: '\(\begin{vmatrix}a\cos\theta&-ar\sin\theta\\b\sin\theta&br\cos\theta\end{vmatrix}\).'
    explanation: '\(abr\cos^2\theta+abr\sin^2\theta\).'
  356:
    topic: s15-7
    question: 'The area of the ellipse \(x^2/a^2+y^2/b^2=1\) found by the substitution \(x=au\), \(y=bv\) over the unit disk \(u^2+v^2\le1\) is'
    A: '\(\pi(a^2+b^2)\)'
    B: '\(\pi a^2b^2\)'
    C: '\(\pi(a+b)\)'
    D: '\(\pi ab\)'
    answer: D
    hint: '\(J=ab\).'
    explanation: '\(ab\cdot\pi(1)^2\).'
  357:
    topic: s15-7
    question: '\(\displaystyle\int_0^{2/3}\int_y^{2-2y}(x+2y)e^{(y-x)}\,dx\,dy\), using \(u=x+2y\), \(v=x-y\), equals'
    A: '\(e^{-2} + \frac{1}{3}\)'
    B: '\(\frac{2}{3}\)'
    C: '\(\frac{3 + e^{2}}{6 e^{2}}\)'
    D: '\(\frac{3}{e^{2}} + 1\)'
    answer: A
    hint: '\(|J|=\tfrac13\), \(e^{y-x}=e^{-v}\); the region is the triangle \(0\le v\le u\le2\).'
    explanation: '\(\tfrac13\int_0^2u(1-e^{-u})du=\tfrac13(1+3e^{-2})\).'
  358:
    topic: s15-7
    question: 'To evaluate \(\displaystyle\int_0^2\int_{y/2}^{(y+4)/2}y^3(2x-y)e^{(2x-y)^2}dx\,dy\), the substitution \(x=u+\tfrac12v\), \(y=v\) has Jacobian'
    A: '\(1\)'
    B: '\(u\)'
    C: '\(\tfrac12\)'
    D: '\(2\)'
    answer: A
    hint: '\(\begin{vmatrix}1&1/2\\0&1\end{vmatrix}\).'
    explanation: 'The determinant is \(1\).'
  359:
    topic: s15-7
    question: 'Using \(x=u+\tfrac12v\), \(y=v\), the integral \(\displaystyle\int_0^2\int_{y/2}^{(y+4)/2}y^3(2x-y)e^{(2x-y)^2}dx\,dy\) equals'
    A: '\(-1 + e^{16}\)'
    B: '\(- \frac{1}{4} + \frac{e^{16}}{4}\)'
    C: '\(-4 + 4 e^{16}\)'
    D: '\(e^{16}\)'
    answer: A
    hint: '\(2x-y=2u\); the region is \(0\le u\le2\), \(0\le v\le2\).'
    explanation: '\(\int_0^2v^3dv\cdot\int_0^22ue^{4u^2}du=4\cdot\tfrac{e^{16}-1}4\).'
  360:
    topic: s15-7
    question: 'The Jacobian \(\dfrac{\partial(x,y)}{\partial(u,v)}\) of \(x=u\cos v\), \(y=u\sin v\) is'
    A: '\(-u\)'
    B: '\(u\)'
    C: '\(1\)'
    D: '\(u^2\)'
    answer: B
    hint: '\(\begin{vmatrix}\cos v&-u\sin v\\\sin v&u\cos v\end{vmatrix}\).'
    explanation: '\(u\cos^2v+u\sin^2v=u\).'
  361:
    topic: s15-7
    question: 'The Jacobian \(\dfrac{\partial(x,y)}{\partial(u,v)}\) of \(x=u\sin v\), \(y=u\cos v\) is'
    A: '\(u\)'
    B: '\(-u\)'
    C: '\(1\)'
    D: '\(-u^2\)'
    answer: B
    hint: '\(\begin{vmatrix}\sin v&u\cos v\\\cos v&-u\sin v\end{vmatrix}\).'
    explanation: '\(-u\sin^2v-u\cos^2v=-u\).'
  362:
    topic: s15-7
    question: 'The Jacobian \(\dfrac{\partial(x,y,z)}{\partial(u,v,w)}\) for \(x=u\cos v\), \(y=u\sin v\), \(z=w\) is'
    A: '\(1\)'
    B: '\(u^2\)'
    C: '\(-u\)'
    D: '\(u\)'
    answer: D
    hint: Expand the determinant along the third column.
    explanation: 'It reduces to the \(2\times2\) polar Jacobian.'
  363:
    topic: s15-7
    question: 'The Jacobian \(\dfrac{\partial(x,y,z)}{\partial(u,v,w)}\) for \(x=2u-1\), \(y=3v-4\), \(z=\tfrac12(w-4)\) is'
    A: '\(6\)'
    B: '\(3\)'
    C: '\(\frac{3}{2}\)'
    D: '\(1\)'
    answer: B
    hint: 'The matrix is diagonal with entries \(2,3,\tfrac12\).'
    explanation: '\(2\cdot3\cdot\tfrac12=3\).'
  364:
    topic: s15-7
    question: 'The Jacobian of the transformation from spherical coordinates \((\rho,\phi,\theta)\) to Cartesian coordinates is'
    A: '\(\rho\sin\phi\)'
    B: '\(\rho^2\sin\phi\)'
    C: '\(\rho^2\)'
    D: '\(\rho^2\cos\phi\)'
    answer: B
    hint: 'Compute the \(3\times3\) determinant of partial derivatives.'
    explanation: 'This explains the volume element \(\rho^2\sin\phi\,d\rho\,d\phi\,d\theta\).'
  365:
    topic: s15-7
    question: 'The volume of the ellipsoid \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}\le1\) is (use \(x=au\), \(y=bv\), \(z=cw\))'
    A: '\(\frac{4 \pi a b c}{3}\)'
    B: '\(2 \pi a b c\)'
    C: '\(\pi a b c\)'
    D: '\(\frac{4 \pi a^{2} b^{2} c^{2}}{3}\)'
    answer: A
    hint: '\(J=abc\) and the \(uvw\)-region is the unit ball.'
    explanation: '\(abc\cdot\tfrac43\pi\).'
  366:
    topic: s15-7
    question: '\(\displaystyle\iiint|xyz|\,dx\,dy\,dz\) over the solid ellipsoid \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}\le1\) equals'
    A: '\(\frac{a b c}{6}\)'
    B: '\(\frac{a^{2} b^{2} c^{2}}{6}\)'
    C: '\(\frac{a^{2} b^{2} c^{2}}{12}\)'
    D: '\(\frac{a^{2} b^{2} c^{2}}{3}\)'
    answer: B
    hint: 'With \(x=au\), \(y=bv\), \(z=cw\): \(J=abc\) and \(|xyz|=abc|uvw|\); \(\iiint|uvw|dV=\tfrac16\) over the unit ball.'
    explanation: '\((abc)^2\cdot\tfrac16\).'
  367:
    topic: s15-7
    question: 'For the region \(1\le x\le2\), \(0\le xy\le2\), \(0\le z\le1\), the transformation \(u=x\), \(v=xy\), \(w=3z\) maps \(D\) to'
    A: 'the box \(1\le u\le2\), \(0\le v\le2\), \(0\le w\le3\)'
    B: 'the box \(1\le u\le2\), \(0\le v\le2\), \(0\le w\le1\)'
    C: 'the box \(1\le u\le2\), \(0\le v\le1\), \(0\le w\le3\)'
    D: 'the box \(0\le u\le1\), \(0\le v\le2\), \(0\le w\le3\)'
    answer: A
    hint: Transform each inequality.
    explanation: '\(z\in[0,1]\Rightarrow w=3z\in[0,3]\).'
  368:
    topic: s15-7
    question: 'Under \(u=x\), \(v=xy\), \(w=3z\), the Jacobian \(\dfrac{\partial(x,y,z)}{\partial(u,v,w)}\) is'
    A: '\(\frac{u}{3}\)'
    B: '\(\frac{1}{u}\)'
    C: '\(\frac{1}{3 u}\)'
    D: '\(3 u\)'
    answer: C
    hint: 'Solve: \(x=u\), \(y=v/u\), \(z=w/3\).'
    explanation: '\(1\cdot\tfrac1u\cdot\tfrac13=\tfrac1{3u}\).'
  369:
    topic: s15-7
    question: '\(\displaystyle\iiint_D(x^2y+3xyz)\,dx\,dy\,dz\) over \(1\le x\le2\), \(0\le xy\le2\), \(0\le z\le1\), using \(u=x\), \(v=xy\), \(w=3z\), equals'
    A: '\(3 \ln{\left(2 \right)} + 4\)'
    B: '\(2 + 3 \ln{\left(2 \right)}\)'
    C: '\(\ln{\left(2 \right)} + 2\)'
    D: '\(3 \ln{\left(2 \right)}\)'
    answer: B
    hint: 'The integrand becomes \(uv+vw\) and \(|J|=\tfrac1{3u}\).'
    explanation: '\(\int_1^2\int_0^2\int_0^3\dfrac{uv+vw}{3u}dw\,dv\,du=2+3\ln2\).'
  370:
    topic: s15-7
    question: 'A substitution \(x=g(u)\) in a single definite integral can be viewed as a transformation from the \(u\)-axis to the \(x\)-axis whose Jacobian is'
    A: '\(g(u)\)'
    B: '\(\dfrac{dx}{du}=g''(u)\)'
    C: '\(\dfrac{1}{g''(u)}\)'
    D: '\(\dfrac{du}{dx}\)'
    answer: B
    hint: 'The one-variable change of variables formula is \(\int f(x)dx=\int f(g(u))g''(u)du\).'
    explanation: The Jacobian is the derivative of the transformation.
  371:
    topic: s15-7
    question: 'In a change of variables for a double integral, \(\displaystyle\iint_Rf(x,y)\,dx\,dy=\iint_Gf(g(u,v),h(u,v))\,\cdot\)'
    A: '\(\left|\dfrac{\partial(x,y)}{\partial(u,v)}\right|\,du\,dv\)'
    B: '\(du\,dv\)'
    C: '\(\dfrac{\partial(x,y)}{\partial(u,v)}\,du\,dv\) (signed)'
    D: '\(\left|\dfrac{\partial(u,v)}{\partial(x,y)}\right|\,du\,dv\)'
    answer: A
    hint: Area scales by the absolute value of the Jacobian.
    explanation: 'The factor is \(|J(u,v)|\).'
