# Chapter 15: Multiple Integrals
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 15.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 15: Multiple Integrals"
description: Double integrals and their regions, area, moments and centers of mass, polar form, triple integrals, masses and moments in three dimensions, cylindrical and spherical coordinates, and substitutions with Jacobians.
topics:
  s15-1:
    title: 15.1 Double Integrals
  s15-2:
    title: 15.2 Areas, Moments, and Centers of Mass
  s15-3:
    title: 15.3 Double Integrals in Polar Form
  s15-4:
    title: 15.4 Triple Integrals in Rectangular Coordinates
  s15-5:
    title: 15.5 Masses and Moments in Three Dimensions
  s15-6:
    title: 15.6 Triple Integrals in Cylindrical and Spherical Coordinates
  s15-7:
    title: 15.7 Substitutions in Multiple Integrals
questions:
  1:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_{0}^{3}\int_{0}^{2}4 - y^{2}\,dy\,dx\).'
    A: '\(32\)'
    B: '\(17\)'
    C: '\(16\)'
    D: '\(-16\)'
    answer: C
    hint: Integrate with respect to the inner variable first, treating the other as a constant.
    explanation: Evaluate the inner integral, then integrate the result over the outer limits.
  2:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_{0}^{3}\int_{-2}^{0}x^{2} y - 2 x y\,dy\,dx\).'
    A: '\(3\)'
    B: '\(2\)'
    C: '\(0\)'
    D: '\(1\)'
    answer: C
    hint: Integrate with respect to the inner variable first, treating the other as a constant.
    explanation: Evaluate the inner integral, then integrate the result over the outer limits.
  3:
