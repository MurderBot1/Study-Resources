    explanation: '\(\int_0^{1/2}x^4\cos(16\pi x^5)dx=\dfrac{1}{80\pi}\).'
  43:
    topic: s15-1
    question: 'Evaluate \(\displaystyle\int_0^8\int_{\sqrt[3]x}^2\frac{dy\,dx}{y^4+1}\) by reversing the order of integration.'
    A: '\(\frac{\ln{\left(17 \right)}}{4} + 1\)'
    B: '\(- \frac{\ln{\left(17 \right)}}{4}\)'
