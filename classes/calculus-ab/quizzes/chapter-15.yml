    D: a cone
    answer: C
    hint: 'Multiply by \(\rho\): \(\rho^2=2\rho\cos\phi\).'
    explanation: '\(x^2+y^2+z^2=2z\).'
  337:
    topic: s15-6
    question: 'In spherical coordinates, the cone \(z=\sqrt{x^2+y^2}\) has equation'
