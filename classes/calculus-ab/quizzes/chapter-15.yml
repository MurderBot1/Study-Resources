    D: '\(\frac{31 \pi}{3}\)'
    answer: C
    hint: '\(V=\iiint\rho^2\sin\phi\,d\rho\,d\phi\,d\theta\), \(\cos\phi\le\rho\le2\), \(0\le\phi\le\pi/2\).'
    explanation: '\(\tfrac{16\pi}3-\tfrac\pi6\).'
  298:
    topic: s15-6
    question: 'The volume of the solid enclosed by the cardioid of revolution \(\rho=1-\cos\phi\) is'
    A: '\(\frac{4 \pi}{3}\)'
    B: '\(\frac{16 \pi}{3}\)'
    C: '\(1 + \frac{8 \pi}{3}\)'
    D: '\(\frac{8 \pi}{3}\)'
    answer: D
    hint: '\(V=2\pi\int_0^\pi\int_0^{1-\cos\phi}\rho^2\sin\phi\,d\rho\,d\phi\).'
