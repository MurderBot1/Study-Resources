# Chapter 12: Vectors and the Geometry of Space
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 12.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 12: Vectors and the Geometry of Space"
description: Three-dimensional coordinates, vectors, the dot and cross products, lines and planes in space, and cylinders and quadric surfaces.
topics:
  s12-1:
    title: 12.1 Three-Dimensional Coordinate Systems
  s12-2:
    title: 12.2 Vectors
  s12-3:
    title: 12.3 The Dot Product
  s12-4:
    title: 12.4 The Cross Product
  s12-5:
    title: 12.5 Lines and Planes in Space
  s12-6:
    title: 12.6 Cylinders and Quadric Surfaces
questions:
  1:
    topic: s12-1
    question: 'The set of points whose coordinates satisfy \(x=2,\ y=3\) is'
    A: 'the line parallel to the \(z\)-axis through \((2,3,0)\)'
    B: 'the point \((2,3,0)\)'
    C: 'the plane \(x=2\)'
    D: 'the line parallel to the \(x\)-axis through \((0,3,0)\)'
    answer: A
    hint: Each equation restricts one coordinate or one relation; combine them.
    explanation: Substitute the second equation into the first.
