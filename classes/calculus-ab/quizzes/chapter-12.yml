  174:
    topic: s12-3
    question: 'If \(\mathbf u\cdot\mathbf v_1=\mathbf u\cdot\mathbf v_2\) and \(\mathbf u\ne\mathbf 0\), can you conclude \(\mathbf v_1=\mathbf v_2\)?'
