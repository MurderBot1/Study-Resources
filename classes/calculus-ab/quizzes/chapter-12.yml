  196:
    topic: s12-3
    question: 'The curves \(x=\dfrac34-y^2\) and \(x=y^2-\dfrac34\) meet at \(\left(0,\pm\dfrac{\sqrt3}2\right)\). The acute angle between them is'
    A: '\(\dfrac\pi3\)'
    B: '\(\dfrac\pi4\)'
    C: '\(\dfrac\pi2\)'
    D: '\(\dfrac\pi6\)'
    answer: A
    hint: 'Tangent vectors \(\langle-2y,1\rangle\) and \(\langle2y,1\rangle\).'
    explanation: '\(\cos\theta=\dfrac{|{-4y^2}+1|}{4y^2+1}=\dfrac{2}{4}\).'
  197:
    topic: s12-3
    question: 'The curves \(y=x^3\) and \(x=y^2\) meet at \((0,0)\) and \((1,1)\). At \((1,1)\) the acute angle between them is'
    A: '\(\dfrac\pi4\)'
    B: '\(\dfrac\pi3\)'
    C: '\(\dfrac\pi6\)'
    D: '\(\dfrac\pi2\)'
    answer: A
    hint: 'Slopes: \(3\) and \(\tfrac12\).'
    explanation: '\(\tan\theta=\left|\dfrac{3-\frac12}{1+\frac32}\right|=1\).'
  198:
