    B: '\(\dfrac\pi3\)'
    C: '\(\dfrac\pi4\)'
    D: '\(\dfrac\pi6\)'
    answer: C
    hint: 'Normals \(\langle1,\sqrt3\rangle\) and \(\langle1-\sqrt3,1+\sqrt3\rangle\).'
