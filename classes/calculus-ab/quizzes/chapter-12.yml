  383:
    topic: s12-6
    question: 'The cylinder \(x^2+y^2=4\) in space is generated by'
    A: 'a vertical line moving around the circle \(x^2+y^2=4\) in the \(xy\)-plane'
    B: 'a plane rotating about the \(z\)-axis'
    C: a sphere of radius 2
    D: 'a circle moving along the \(z\)-axis in a sphere'
    answer: A
    hint: 'The equation has no \(z\).'
    explanation: 'Every plane \(z=c\) cuts a circle of radius \(2\).'
  384:
    topic: s12-6
    question: 'The equation \(z=y^2-1\) in space represents'
    A: 'a parabolic cylinder with rulings parallel to the \(x\)-axis'
    B: 'a parabola in the \(yz\)-plane only'
    C: a paraboloid of revolution
    D: a plane
    answer: A
    hint: 'The variable \(x\) is missing.'
    explanation: 'The parabola in the \(yz\)-plane is translated along \(x\).'
  385:
    topic: s12-6
    question: 'The ellipsoid \(x^2+\dfrac{y^2}4+\dfrac{z^2}9=1\) cut by the plane \(z=c\) (\(|c|<3\)) has cross-section of area'
    A: '\(A(c)=\pi\left(1-\dfrac{c^2}9\right)\)'
    B: '\(A(c)=2\pi\left(1-\dfrac{c^2}9\right)\)'
    C: '\(A(c)=2\pi\left(1+\dfrac{c^2}9\right)\)'
    D: '\(A(c)=2\pi\left(1-\dfrac{c^2}3\right)\)'
    answer: B
    hint: 'The slice is an ellipse with semi-axes \(\sqrt{1-c^2/9}\) and \(2\sqrt{1-c^2/9}\).'
    explanation: 'Area \(=\pi ab\) with \(a=\sqrt{1-c^2/9}\), \(b=2a\).'
  386:
    topic: s12-6
    question: 'The volume of the ellipsoid \(x^2+\dfrac{y^2}4+\dfrac{z^2}9=1\) is'
    A: '\(\dfrac{8\pi}3\)'
    B: '\(4\pi\)'
    C: '\(12\pi\)'
    D: '\(8\pi\)'
    answer: D
    hint: '\(V=\displaystyle\int_{-3}^{3}2\pi\left(1-\dfrac{c^2}9\right)dc\).'
    explanation: '\(2\pi\cdot4=8\pi\), matching \(\tfrac43\pi abc\) with \(a,b,c=1,2,3\).'
  387:
    topic: s12-6
    question: 'The volume of the ellipsoid \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}=1\) is'
    A: '\(\dfrac43\pi(a+b+c)\)'
    B: '\(\pi abc\)'
    C: '\(\dfrac{4}{3}\pi a^2b\)'
    D: '\(\dfrac43\pi abc\), which gives \(\dfrac43\pi a^3\) for a sphere'
    answer: D
    hint: 'Integrate the cross-sectional area \(\pi ab\left(1-\dfrac{z^2}{c^2}\right)\) from \(-c\) to \(c\).'
    explanation: '\(\pi ab\cdot\dfrac{4c}3\).'
  388:
    topic: s12-6
    question: 'A barrel of height \(2h\), midsection radius \(R\) and end radius \(r\) is shaped like an ellipsoid piece. Its volume is'
    A: '\(V=\dfrac{4\pi hR^2}3\)'
    B: '\(V=2\pi hR^2\)'
    C: '\(V=\dfrac{\pi h}{3}\left(2R^2+r^2\right)\)'
    D: '\(V=\dfrac{2\pi h}3\left(2R^2+r^2\right)\)'
    answer: D
    hint: 'Check the cylinder case \(r=R\): the volume should be \(2\pi hR^2\).'
    explanation: 'For \(r=R\): \(\tfrac{2\pi h}3\cdot3R^2=2\pi hR^2\); for \(r=0\), \(h=R\): \(\tfrac{4\pi R^3}3\) (a sphere).'
  389:
    topic: s12-6
    question: 'The volume of the segment cut from the paraboloid \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=\dfrac zc\) by the plane \(z=h\) equals'
    A: the base area times the altitude
    B: '\(\pi abh\)'
    C: one-third of the base area times the altitude
    D: 'half the base area times the altitude: \(\dfrac12\cdot\pi ab\,\dfrac hc\cdot h\)'
    answer: D
    hint: 'The cross-section at height \(z\) has area \(\pi ab\dfrac zc\).'
    explanation: '\(\displaystyle\int_0^h\pi ab\dfrac zc\,dz=\dfrac{\pi abh^2}{2c}\).'
  390:
    topic: s12-6
    question: 'The volume bounded by the hyperboloid \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}-\dfrac{z^2}{c^2}=1\) and the planes \(z=0\), \(z=h\) is'
    A: '\(\pi ab\left(h+\dfrac{h^3}{3c^2}\right)\)'
    B: '\(\pi ab\left(h-\dfrac{h^3}{3c^2}\right)\)'
    C: '\(\pi abh\)'
    D: '\(\dfrac{\pi abh^3}{3c^2}\)'
    answer: A
    hint: 'The cross-section at height \(z\) is an ellipse of area \(\pi ab\left(1+\dfrac{z^2}{c^2}\right)\).'
    explanation: 'Integrate from \(0\) to \(h\).'
  391:
    topic: s12-6
    question: 'That hyperboloid volume can be written as \(V=\dfrac h6\left(A_0+4A_m+A_h\right)\), where \(A_m\) is the cross-section area at'
    A: '\(z=h\)'
    B: '\(z=0\)'
    C: 'the middle height \(z=\dfrac h2\)'
    D: '\(z=\dfrac h3\)'
    answer: C
    hint: "This is Simpson's Rule applied to the (quadratic) cross-sectional area function."
    explanation: 'Simpson''s Rule is exact for polynomials of degree \(\le3\).'
  392:
    topic: s12-6
    question: 'If the hyperbolic paraboloid \(\dfrac{y^2}{b^2}-\dfrac{x^2}{a^2}=\dfrac zc\) is cut by the plane \(y=y_1\), the resulting curve is'
    A: 'a parabola opening downward (for \(c>0\)) with vertex \(\left(0,y_1,\dfrac{cy_1^2}{b^2}\right)\)'
    B: 'a parabola opening upward with vertex \((0,y_1,0)\)'
    C: an ellipse
    D: a hyperbola
    answer: A
    hint: 'Solve for \(z\): \(z=c\left(\dfrac{y_1^2}{b^2}-\dfrac{x^2}{a^2}\right)\).'
    explanation: '\(z=\dfrac{cy_1^2}{b^2}-\dfrac{c}{a^2}x^2\) is a downward parabola.'
  393:
    topic: s12-6
    question: 'Setting \(z=0\) in \(Ax^2+By^2+Cz^2+Dxy+Eyz+Fxz+Gx+Hy+Jz+K=0\) gives'
    A: 'a curve in the \(xy\)-plane that is a conic section (possibly degenerate)'
    B: a plane
    C: a surface
    D: a straight line always
    answer: A
    hint: 'The resulting equation is quadratic in \(x\) and \(y\).'
    explanation: 'It has the form \(Ax^2+Dxy+By^2+Gx+Hy+K=0\).'
  394:
    topic: s12-6
    question: The trace of a quadric surface in a plane parallel to a coordinate plane is always
    A: a straight line
    B: "a conic section (not a coincidence: fixing one variable leaves a second-degree equation in two variables)"
    C: a parabola
    D: a circle
    answer: B
    hint: Substitute a constant for one variable.
    explanation: The equation stays quadratic in the remaining two variables.
  395:
    topic: s12-6
    question: The trace of a quadric surface in a plane that is not parallel to a coordinate plane is
    A: still a conic section (a quadratic equation restricted to a plane stays quadratic)
    B: a circle only
    C: always a line
    D: not defined
    answer: A
    hint: Parametrize the plane by two coordinates.
    explanation: Substituting a linear relation into a quadratic expression gives a quadratic expression.
  396:
    topic: s12-6
    question: 'The surface \(z=x^2+y^2\) has horizontal traces \(z=c\) that are'
    A: 'ellipses for all \(c\)'
    B: parabolas
    C: hyperbolas
    D: 'circles for \(c>0\) (a single point for \(c=0\), empty for \(c<0\))'
    answer: D
    hint: 'Set \(z=c\): \(x^2+y^2=c\).'
    explanation: A circular paraboloid.
  397:
    topic: s12-6
    question: 'The surface \(z=x^2-y^2\) has the trace \(z=0\) equal to'
    A: a parabola
    B: a circle
    C: a single point
    D: 'the two lines \(y=\pm x\)'
    answer: D
    hint: 'Set \(0=x^2-y^2\).'
    explanation: '\((x-y)(x+y)=0\); the surface is a saddle.'
  398:
    topic: s12-6
    question: 'The surface \(x^2+y^2-z^2=1\) has horizontal traces \(z=c\) that are'
    A: 'circles of radius \(\sqrt{1-c^2}\)'
    B: hyperbolas
    C: parabolas
    D: 'circles of radius \(\sqrt{1+c^2}\)'
    answer: D
    hint: 'Set \(z=c\): \(x^2+y^2=1+c^2\).'
    explanation: The surface is connected (one sheet).
  399:
    topic: s12-6
    question: 'The surface \(z^2-x^2-y^2=1\) has horizontal traces \(z=c\) that are'
    A: hyperbolas
    B: 'circles for every \(c\)'
    C: lines
    D: 'empty for \(|c|<1\), and circles of radius \(\sqrt{c^2-1}\) for \(|c|\ge1\)'
    answer: D
    hint: 'Set \(z=c\): \(x^2+y^2=c^2-1\).'
    explanation: 'Two separate sheets (\(z\ge1\) and \(z\le-1\)).'
  400:
    topic: s12-6
    question: 'The surface \(x^2+y^2=z^2\) has horizontal traces that are'
    A: 'circles whose radius \(|z|\) grows linearly (a cone), degenerating to a point at \(z=0\)'
    B: parabolas
    C: hyperbolas
    D: circles of constant radius
    answer: A
    hint: 'Set \(z=c\).'
    explanation: '\(x^2+y^2=c^2\).'
  401:
    topic: s12-6
    question: 'The quadric \(z=x^2+y^2\) is called a paraboloid of revolution because'
    A: it has no axis
    B: its traces are parabolas only
    C: it is a cone
    D: 'it is obtained by revolving the parabola \(z=y^2\) about the \(z\)-axis'
    answer: D
    hint: Horizontal traces are circles.
    explanation: 'Rotation about the \(z\)-axis preserves \(x^2+y^2\).'
  402:
    topic: s12-6
    question: Which of the following is NOT a quadric surface?
    A: '\(x^2+y^2+z^2=1\)'
    B: '\(z=\sin x\)'
    C: '\(z=x^2+y^2\)'
    D: '\(x^2+y^2=z^2\)'
    answer: B
    hint: 'A quadric is a second-degree equation in \(x,y,z\).'
    explanation: '\(z=\sin x\) is not polynomial.'
  403:
    topic: s12-6
    question: 'The graph of \(4z^2-x^2-y^2=4\) has cross-sections \(z=c\) that are circles when \(|c|\) is'
    A: any value
    B: 'exactly \(0\)'
    C: 'less than \(1\)'
    D: 'at least \(1\)'
    answer: D
    hint: '\(x^2+y^2=4(c^2-1)\).'
    explanation: The right-hand side must be nonnegative.
  404:
    topic: s12-6
    question: 'The graph of \(x=4-y^2\) is'
    A: a paraboloid
    B: a hyperbolic paraboloid
    C: a parabola only
    D: 'a parabolic cylinder (a parabola in the \(xy\)-plane extruded along \(z\))'
    answer: D
    hint: 'The variable \(z\) is missing.'
    explanation: 'Each plane \(z=c\) cuts the same parabola.'
  405:
    topic: s12-6
    question: 'The graph of \(yz=1\) is'
    A: 'a hyperbolic cylinder with rulings parallel to the \(x\)-axis'
    B: a hyperboloid
    C: a hyperbolic paraboloid
    D: a plane
    answer: A
    hint: 'The variable \(x\) is missing.'
    explanation: 'Each plane \(x=c\) cuts the hyperbola \(yz=1\).'
