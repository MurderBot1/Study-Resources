    question: 'The curves \(y=\dfrac32-x^2\) and \(y=x^2\) meet at \(\left(\pm\dfrac{\sqrt3}2,\dfrac34\right)\). The acute angle between them at each point is'
    A: '\(\dfrac\pi4\)'
    B: '\(\dfrac\pi3\)'
    C: '\(\dfrac\pi2\)'
    D: '\(\dfrac\pi6\)'
    answer: B
    hint: 'Slopes at \(x=\tfrac{\sqrt3}2\): \(-2x=-\sqrt3\) and \(2x=\sqrt3\).'
