    C: 'No: \(\mathbf v_1-\mathbf v_2\) need only be orthogonal to \(\mathbf u\)'
    D: Yes, if the vectors are in the plane
    answer: C
    hint: '\(\mathbf u\cdot(\mathbf v_1-\mathbf v_2)=0\).'
    explanation: 'Example: \(\mathbf u=\mathbf i\), \(\mathbf v_1=\mathbf j\), \(\mathbf v_2=\mathbf k\).'
  175:
    topic: s12-3
