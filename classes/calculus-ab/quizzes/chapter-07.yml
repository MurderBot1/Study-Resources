    question: 'Express \(\tanh^{-1}\!\left(-\tfrac12\right)\) in terms of natural logarithms.'
    A: '\(- \ln{\left(3 \right)}\)'
    B: '\(- \ln{\left(2 \right)}\)'
    C: '\(\frac{\ln{\left(3 \right)}}{2}\)'
    D: '\(- \frac{\ln{\left(3 \right)}}{2}\)'
    answer: D
    hint: '\(\tanh^{-1}x=\tfrac12\ln\dfrac{1+x}{1-x}\).'
    explanation: '\(\tfrac12\ln\dfrac{1/2}{3/2}=\tfrac12\ln\tfrac13=-\tfrac12\ln3\).'
  195:
    topic: s7-4
    question: 'Express \(\coth^{-1}\!\left(\tfrac54\right)\) in terms of natural logarithms.'
    A: '\(- \ln{\left(3 \right)}\)'
    B: '\(\ln{\left(3 \right)}\)'
    C: '\(\frac{\ln{\left(9 \right)}}{4}\)'
    D: '\(\frac{\ln{\left(3 \right)}}{2}\)'
    answer: B
    hint: '\(\coth^{-1}x=\tfrac12\ln\dfrac{x+1}{x-1}\).'
    explanation: '\(\tfrac12\ln\dfrac{9/4}{1/4}=\tfrac12\ln9=\ln3\).'
  196:
    topic: s7-4
    question: 'Express \(\operatorname{sech}^{-1}\!\left(\tfrac35\right)\) in terms of natural logarithms.'
    A: '\(\ln{\left(2 \right)}\)'
    B: '\(- \ln{\left(3 \right)}\)'
    C: '\(\ln{\left(3 \right)}\)'
    D: '\(\ln{\left(\frac{8}{3} \right)}\)'
    answer: C
    hint: '\(\operatorname{sech}^{-1}x=\ln\dfrac{1+\sqrt{1-x^2}}{x}\).'
    explanation: '\(\sqrt{1-\tfrac9{25}}=\tfrac45\), so \(\ln\dfrac{9/5}{3/5}=\ln3\).'
  197:
    topic: s7-4
    question: 'Express \(\operatorname{csch}^{-1}\!\left(-\tfrac1{\sqrt3}\right)\) in terms of natural logarithms.'
    A: '\(\ln{\left(\sqrt{3} + 2 \right)}\)'
    B: '\(\ln{\left(2 - \sqrt{3} \right)}\)'
    C: '\(- \ln{\left(2 \right)}\)'
    D: '\(\ln{\left(\sqrt{3} \right)}\)'
    answer: B
    hint: '\(\operatorname{csch}^{-1}x=\ln\!\left(\dfrac1x+\dfrac{\sqrt{1+x^2}}{|x|}\right)\).'
    explanation: '\(\dfrac1x=-\sqrt3\) and \(\dfrac{\sqrt{4/3}}{1/\sqrt3}=2\), so \(\ln(2-\sqrt3)\).'
  198:
    topic: s7-4
    question: 'Evaluate \(\displaystyle\int_0^{2\sqrt3}\dfrac{dx}{\sqrt{4+x^2}}\) in natural logarithms.'
    A: '\(\ln{\left(2 \right)}\)'
    B: '\(\ln{\left(2 \sqrt{3} \right)}\)'
    C: '\(\ln{\left(\sqrt{3} \right)}\)'
    D: '\(\ln{\left(\sqrt{3} + 2 \right)}\)'
    answer: D
    hint: '\(\int\dfrac{dx}{\sqrt{a^2+x^2}}=\sinh^{-1}\dfrac xa\).'
    explanation: '\(\sinh^{-1}\sqrt3=\ln(\sqrt3+2)\).'
  199:
    topic: s7-4
    question: 'Evaluate \(\displaystyle\int_0^{1/3}\dfrac{6\,dx}{\sqrt{1+9x^2}}\) in natural logarithms.'
    A: '\(2 \ln{\left(1 + \sqrt{2} \right)}\)'
    B: '\(6 \ln{\left(2 \right)}\)'
    C: '\(\ln{\left(1 + \sqrt{2} \right)}\)'
    D: '\(2 \ln{\left(2 \right)}\)'
    answer: A
    hint: 'Let \(u=3x\); \(\int\dfrac{du}{\sqrt{1+u^2}}=\sinh^{-1}u\).'
    explanation: '\(2\sinh^{-1}1=2\ln(1+\sqrt2)\).'
  200:
    topic: s7-4
    question: 'Evaluate \(\displaystyle\int_0^{1/2}\dfrac{dx}{1-x^2}\).'
    A: '\(\ln{\left(2 \right)}\)'
    B: '\(\frac{\ln{\left(3 \right)}}{2}\)'
    C: '\(\frac{\ln{\left(3 \right)}}{4}\)'
    D: '\(\ln{\left(3 \right)}\)'
    answer: B
    hint: '\(\int\dfrac{dx}{1-x^2}=\tanh^{-1}x\) for \(|x|<1\).'
    explanation: '\(\tanh^{-1}\tfrac12=\tfrac12\ln3\).'
  201:
    topic: s7-4
    question: 'Evaluate \(\displaystyle\int_{5/4}^{2}\dfrac{dx}{1-x^2}\).'
    A: '\(- \ln{\left(3 \right)}\)'
    B: '\(\frac{\ln{\left(3 \right)}}{2}\)'
    C: '\(\ln{\left(3 \right)}\)'
    D: '\(- \frac{\ln{\left(3 \right)}}{2}\)'
    answer: D
    hint: 'For \(|x|>1\), \(\int\dfrac{dx}{1-x^2}=\coth^{-1}x\).'
    explanation: '\(\coth^{-1}2-\coth^{-1}\tfrac54=\tfrac12\ln3-\ln3=-\tfrac12\ln3\).'
  202:
    topic: s7-4
    question: 'The velocity of a skydiver of mass \(m\) falling with air resistance \(kv^2\) is \(v=\sqrt{\dfrac{mg}k}\tanh\!\left(\sqrt{\dfrac{gk}m}\,t\right)\). The limiting velocity is'
    A: '\(0\)'
    B: '\(\sqrt{\dfrac{mg}{k}}\)'
    C: '\(mg\)'
    D: '\(\sqrt{\dfrac{gk}{m}}\)'
    answer: B
    hint: '\(\tanh\to1\) as \(t\to\infty\).'
    explanation: The velocity approaches this value from below.
  203:
    topic: s7-4
    question: 'For a 160-lb skydiver (\(mg=160\)) with \(k=0.005\), the limiting velocity (ft/s) is about'
    A: '\(32\text{ ft/s}\)'
    B: '\(357.8\text{ ft/s}\)'
    C: '\(178.9\text{ ft/s}\)'
    D: '\(89.4\text{ ft/s}\)'
    answer: C
    hint: '\(v_{\lim}=\sqrt{\dfrac{mg}k}\).'
    explanation: '\(\sqrt{32{,}000}\approx178.9\) ft/s, about 122 mph.'
  204:
    topic: s7-4
    question: 'A hanging cable lies along \(y=\dfrac Hw\cosh\dfrac wHx\). The slope of the cable at \(P(x,y)\) is'
    A: '\(\dfrac Hw\sinh\dfrac wHx\)'
    B: '\(\cosh\dfrac wHx\)'
    C: '\(\tanh\dfrac wHx\)'
    D: '\(\sinh\dfrac wHx\)'
    answer: D
    hint: 'Differentiate \(y\).'
    explanation: '\(\dfrac{dy}{dx}=\tan\phi=\sinh\tfrac wHx\).'
  205:
    topic: s7-4
    question: 'For a hanging cable \(y=\dfrac1a\cosh ax\), the length of arc from \(x=0\) to \(x\) is'
    A: '\(a\sinh ax\)'
    B: '\(\dfrac1a\cosh ax\)'
    C: '\(\cosh ax\)'
    D: '\(\dfrac1a\sinh ax\)'
    answer: D
    hint: '\(\sqrt{1+(y'')^2}=\sqrt{1+\sinh^2ax}=\cosh ax\).'
    explanation: '\(\int_0^x\cosh at\,dt=\tfrac1a\sinh ax\).'
  206:
    topic: s7-4
    question: 'A 32-ft cable weighing 2 lb/ft is fastened at the same level to posts 30 ft apart and models \(y=\dfrac1a\cosh ax\), \(-15\le x\le15\). The constant \(a\) satisfies \(16a=\sinh15a\). Its positive solution is about'
    A: '\(0.0209\)'
    B: '\(0.1253\)'
    C: '\(0.0835\)'
    D: '\(0.0418\)'
    answer: D
    hint: "Solve numerically (graph or Newton's method)."
    explanation: '\(a\approx0.0418\).'
  207:
    topic: s7-4
    question: 'For the cable above (\(a\approx0.0418\)), the sag at its center (the rise of the posts above the lowest point, \(\tfrac1a(\cosh15a-1)\)) is about'
    A: '\(4.85\text{ ft}\)'
    B: '\(9.71\text{ ft}\)'
    C: '\(14.56\text{ ft}\)'
    D: '\(2.43\text{ ft}\)'
    answer: A
    hint: 'Compare \(y(15)\) with \(y(0)\).'
    explanation: '\(\tfrac1a(\cosh15a-1)\approx4.85\) ft.'
  208:
    topic: s7-4
    question: 'The region under \(y=\dfrac1a\cosh ax\) from \(x=0\) to \(x=b\) has the same area as a rectangle of height \(\dfrac1a\) and base equal to'
    A: '\(b\)'
    B: '\(\dfrac{b}{a}\)'
    C: 'the chord length from \((0,0)\) to \((b,y(b))\)'
    D: 'the arc length \(s\) of the curve from \(0\) to \(b\)'
    answer: D
    hint: 'Area \(=\int_0^b\tfrac1a\cosh ax\,dx=\tfrac1{a^2}\sinh ab\) and \(s=\tfrac1a\sinh ab\).'
    explanation: 'Area \(=\tfrac1a\cdot s\).'
  209:
    topic: s7-4
    question: 'Why does \(\sinh^{-1}x=\ln\!\left(x+\sqrt{x^2+1}\right)\) use the plus sign in front of the square root?'
    A: 'because \(\sqrt{x^2+1}\) is negative'
    B: the minus sign gives the same result
    C: 'because \(x\) is always positive'
    D: 'because \(x-\sqrt{x^2+1}<0\) and the logarithm requires a positive argument'
    answer: D
    hint: 'Solve \(x=\tfrac{e^y-e^{-y}}2\) as a quadratic in \(e^y\).'
    explanation: '\(e^y=x\pm\sqrt{x^2+1}\) and \(e^y>0\).'
  210:
    topic: s7-4
    question: 'Every function \(f\) defined on an interval symmetric about 0 equals'
    A: its odd part minus its even part
    B: 'its even part plus its odd part: \(\dfrac{f(x)+f(-x)}{2}+\dfrac{f(x)-f(-x)}{2}\)'
    C: twice its even part
    D: '\(f(x)f(-x)\)'
    answer: B
    hint: Add the two fractions.
    explanation: 'For \(f=e^x\) these are \(\cosh x\) and \(\sinh x\).'
  211:
    topic: s7-4
    question: 'The even and odd parts of \(f(x)=e^x\) are'
    A: '\(\sinh x\) and \(\cosh x\)'
    B: '\(1\) and \(x\)'
    C: '\(\cosh x\) and \(\sinh x\)'
    D: '\(e^x\) and \(e^{-x}\)'
    answer: C
    hint: 'Use \(\tfrac{f(x)\pm f(-x)}{2}\).'
    explanation: '\(\tfrac{e^x+e^{-x}}2=\cosh x\) is even; \(\tfrac{e^x-e^{-x}}2=\sinh x\) is odd.'
  212:
    topic: s7-4
    question: 'The area of a surface generated by revolving \(y=4\cosh\tfrac x4\), \(-\ln16\le x\le\ln81\), is a minimal surface. The surface-area integrand \(2\pi y\sqrt{1+(y'')^2}\) simplifies to'
    A: '\(8\pi\cosh^2\dfrac x4\)'
    B: '\(8\pi\sinh^2\dfrac x4\)'
    C: '\(2\pi\cosh^2\dfrac x4\)'
    D: '\(8\pi\cosh\dfrac x4\)'
    answer: A
    hint: '\(y''=\sinh\tfrac x4\) so \(\sqrt{1+(y'')^2}=\cosh\tfrac x4\).'
    explanation: '\(2\pi\cdot4\cosh\tfrac x4\cdot\cosh\tfrac x4\).'
  213:
    topic: s7-4
    question: 'Each of the formulas \(\displaystyle\int\operatorname{sech}x\,dx=\tan^{-1}(\sinh x)+C\) and \(\displaystyle\int\operatorname{sech}x\,dx=\sin^{-1}(\tanh x)+C\) is verified by'
    A: 'plugging in \(x=0\) only'
    B: differentiating the right-hand side
    C: integrating the left-hand side twice
    D: comparing graphs at three points
    answer: B
    hint: 'Differentiate: \(\dfrac{\cosh x}{1+\sinh^2x}=\dfrac{1}{\cosh x}\).'
    explanation: 'Both derivatives equal \(\operatorname{sech}x\), so the two antiderivatives differ by a constant (and both are 0 at \(x=0\)).'
