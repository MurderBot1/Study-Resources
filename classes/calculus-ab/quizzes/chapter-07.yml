# Chapter 7: Integrals and Transcendental Functions
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 7.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 7: Integrals and Transcendental Functions"
description: Integrals of logarithmic and exponential expressions, exponential growth and decay, relative rates of growth, and hyperbolic functions.
topics:
  s7-1:
    title: 7.1 The Logarithm Defined as an Integral
  s7-2:
    title: 7.2 Exponential Growth and Decay
  s7-3:
    title: 7.3 Relative Rates of Growth
  s7-4:
    title: 7.4 Hyperbolic Functions
questions:
  1:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_{-3}^{-2}\dfrac{dx}{x}\).'
    A: '\(- \ln{\left(2 \right)}\)'
    B: '\(\ln{\left(\frac{3}{2} \right)}\)'
    C: '\(\ln{\left(\frac{2}{3} \right)}\)'
    D: '\(\ln{\left(6 \right)}\)'
    answer: C
    hint: '\(\int\dfrac{dx}x=\ln|x|\).'
    explanation: '\(\ln2-\ln3=\ln\tfrac23\) (negative, since the integrand is negative and the interval runs left to right).'
  2:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_{-1}^{0}\dfrac{3\,dx}{3x-2}\).'
    A: '\(\ln{\left(\frac{5}{2} \right)}\)'
    B: '\(- \ln{\left(5 \right)} + \ln{\left(2 \right)} + 1\)'
    C: '\(\ln{\left(3 \right)}\)'
    D: '\(\ln{\left(\frac{2}{5} \right)}\)'
    answer: D
    hint: 'Let \(u=3x-2\); \(\int\dfrac{du}{u}=\ln|u|\).'
    explanation: '\(\ln|3x-2|\Big|_{-1}^0=\ln2-\ln5=\ln\tfrac25\).'
  3:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{2y\,dy}{y^2-25}\).'
    A: '\(\ln{\left(\left|{y - 5}\right| \right)}+C\)'
    B: '\(\ln{\left(\left|{y^{2} - 25}\right| \right)}+C\)'
    C: '\(\frac{1}{y^{2} - 25}+C\)'
    D: '\(2 y \ln{\left(\left|{y^{2} - 25}\right| \right)}+C\)'
    answer: B
    hint: The numerator is the derivative of the denominator.
    explanation: 'Differentiating \(\ln{\left(\left|{y^{2} - 25}\right| \right)}\) gives \(\frac{2 y}{y^{2} - 25}\).'
  4:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{8r\,dr}{4r^2-5}\).'
    A: '\(8 \ln{\left(\left|{r}\right| \right)}+C\)'
    B: '\(2 \ln{\left(\left|{4 r^{2} - 5}\right| \right)}+C\)'
    C: '\(\ln{\left(\left|{4 r^{2} - 5}\right| \right)}+C\)'
    D: '\(\frac{\ln{\left(\left|{4 r^{2} - 5}\right| \right)}}{2}+C\)'
    answer: C
    hint: '\(\dfrac{d}{dr}(4r^2-5)=8r\).'
    explanation: 'Differentiating \(\ln{\left(\left|{4 r^{2} - 5}\right| \right)}\) gives \(\frac{8 r}{4 r^{2} - 5}\).'
  5:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{3\sec^2t}{6+3\tan t}\,dt\).'
    A: '\(\dfrac{\ln|\tan t|}{3}+C\)'
    B: '\(\ln|2+\tan t|+C\)'
    C: '\(3\ln|6+3\tan t|+C\)'
    D: '\(\dfrac{1}{(6+3\tan t)^2}+C\)'
    answer: B
    hint: 'Cancel the common factor 3, then let \(u=2+\tan t\).'
    explanation: 'The integrand is \(\dfrac{\sec^2t}{2+\tan t}\). (\(\ln|6+3\tan t|+C\) is equivalent because the two logs differ by the constant \(\ln3\).)'
  6:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{\sec y\tan y}{2+\sec y}\,dy\).'
    A: '\(\ln{\left(\sec{\left(y \right)} + 2 \right)} \sec{\left(y \right)}+C\)'
    B: '\(\frac{1}{\sec{\left(y \right)} + 2}+C\)'
    C: '\(\ln{\left(\sec{\left(y \right)} + 2 \right)}+C\)'
    D: '\(\ln{\left(\left|{\sec{\left(y \right)}}\right| \right)}+C\)'
    answer: C
    hint: '\(\dfrac{d}{dy}(2+\sec y)=\sec y\tan y\).'
    explanation: 'Differentiating \(\ln{\left(\sec{\left(y \right)} + 2 \right)}\) gives \(\frac{\tan{\left(y \right)} \sec{\left(y \right)}}{\sec{\left(y \right)} + 2}\).'
  7:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{dx}{2\sqrt x+2x}\) (\(x>0\)).'
    A: '\(\ln{\left(\sqrt{x} \right)}+C\)'
    B: '\(\ln{\left(x + 1 \right)}+C\)'
    C: '\(2 \ln{\left(\sqrt{x} + 1 \right)}+C\)'
    D: '\(\ln{\left(\sqrt{x} + 1 \right)}+C\)'
    answer: D
    hint: 'Factor \(2\sqrt x\) out of the denominator and let \(u=1+\sqrt x\).'
    explanation: 'Differentiating \(\ln{\left(\sqrt{x} + 1 \right)}\) gives \(\frac{1}{2 \sqrt{x} + 2 x}\).'
  8:
    topic: s7-1
    question: 'Find \(\displaystyle\int8e^{x+1}\,dx\).'
    A: '\(\frac{e^{8 x + 8}}{8}+C\)'
    B: '\(8 e^{x + 1}+C\)'
    C: '\(8 x e^{x + 1}+C\)'
    D: '\(4 e^{x + 1}+C\)'
    answer: B
    hint: '\(\int e^{u}du=e^u\) with \(u=x+1\).'
    explanation: 'Differentiating \(8 e^{x + 1}\) gives \(8 e^{x + 1}\).'
  9:
    topic: s7-1
    question: 'Find \(\displaystyle\int2e^{2x-1}\,dx\).'
    A: '\(2 e^{2 x - 1}+C\)'
    B: '\(\frac{e^{2 x - 1}}{2}+C\)'
    C: '\(e^{2 x - 1}+C\)'
    D: '\(4 e^{2 x - 1}+C\)'
    answer: C
    hint: '\(\dfrac{d}{dx}e^{2x-1}=2e^{2x-1}\).'
    explanation: 'Differentiating \(e^{2 x - 1}\) gives \(2 e^{2 x - 1}\).'
  10:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{e^{\sqrt r}}{\sqrt r}\,dr\).'
    A: '\(e^{\sqrt{r}}+C\)'
    B: '\(2 \sqrt{r} e^{\sqrt{r}}+C\)'
    C: '\(\frac{e^{\sqrt{r}}}{2}+C\)'
    D: '\(2 e^{\sqrt{r}}+C\)'
    answer: D
    hint: 'Let \(u=\sqrt r\); then \(du=\dfrac{dr}{2\sqrt r}\).'
    explanation: 'Differentiating \(2 e^{\sqrt{r}}\) gives \(\frac{e^{\sqrt{r}}}{\sqrt{r}}\).'
  11:
    topic: s7-1
    question: 'Find \(\displaystyle\int2te^{-t^2}\,dt\).'
    A: '\(- \frac{e^{- t^{2}}}{2}+C\)'
    B: '\(- e^{- t^{2}}+C\)'
    C: '\(e^{- t^{2}}+C\)'
    D: '\(- 2 e^{- t^{2}}+C\)'
    answer: B
    hint: 'Let \(u=-t^2\).'
    explanation: 'Differentiating \(- e^{- t^{2}}\) gives \(2 t e^{- t^{2}}\).'
  12:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{e^{1/x}}{x^2}\,dx\).'
    A: '\(\frac{e^{\frac{1}{x}}}{x}+C\)'
    B: '\(e^{\frac{1}{x}}+C\)'
    C: '\(- \frac{e^{\frac{1}{x}}}{x}+C\)'
    D: '\(- e^{\frac{1}{x}}+C\)'
    answer: D
    hint: 'Let \(u=1/x\); then \(du=-\dfrac{dx}{x^2}\).'
    explanation: 'Differentiating \(- e^{\frac{1}{x}}\) gives \(\frac{e^{\frac{1}{x}}}{x^{2}}\).'
  13:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{e^r}{1+e^r}\,dr\).'
    A: '\(\frac{1}{e^{r} + 1}+C\)'
    B: '\(e^{r} \ln{\left(e^{r} + 1 \right)}+C\)'
    C: '\(\ln{\left(e^{r} + 1 \right)}+C\)'
    D: '\(r+C\)'
    answer: C
    hint: The numerator is the derivative of the denominator.
    explanation: 'Differentiating \(\ln{\left(e^{r} + 1 \right)}\) gives \(\frac{e^{r}}{e^{r} + 1}\).'
  14:
    topic: s7-1
    question: 'Find \(\displaystyle\int\dfrac{dx}{1+e^x}\).'
    A: '\(\ln{\left(e^{x} + 1 \right)}+C\)'
    B: '\(x + \ln{\left(e^{x} + 1 \right)}+C\)'
    C: '\(x - \ln{\left(e^{x} + 1 \right)}+C\)'
    D: '\(- \ln{\left(e^{x} + 1 \right)}+C\)'
    answer: C
    hint: 'Multiply top and bottom by \(e^{-x}\): \(\dfrac{e^{-x}}{e^{-x}+1}\).'
    explanation: '\(\int\dfrac{e^{-x}}{1+e^{-x}}dx=-\ln(1+e^{-x})=x-\ln(1+e^x)\).'
  15:
    topic: s7-1
    question: 'Find \(\displaystyle\int x2^{x^2}\,dx\).'
    A: '\(\frac{2^{x^{2}}}{\ln{\left(2 \right)}}+C\)'
    B: '\(\frac{2^{x^{2}} x^{2}}{2}+C\)'
    C: '\(2^{x^{2}}+C\)'
    D: '\(\frac{2^{x^{2}}}{2 \ln{\left(2 \right)}}+C\)'
    answer: D
    hint: 'Let \(u=x^2\) and use \(\int a^udu=\dfrac{a^u}{\ln a}\).'
    explanation: 'Differentiating \(\frac{2^{x^{2}}}{2 \ln{\left(2 \right)}}\) gives \(2^{x^{2}} x\).'
  16:
    topic: s7-1
    question: 'Find \(\displaystyle\int7^{\cos t}\sin t\,dt\).'
    A: '\(- \frac{7^{\cos{\left(t \right)}}}{\ln{\left(7 \right)}}+C\)'
    B: '\(\frac{7^{\cos{\left(t \right)}}}{\ln{\left(7 \right)}}+C\)'
    C: '\(- 7^{\cos{\left(t \right)}}+C\)'
    D: '\(- 7^{\cos{\left(t \right)}} \ln{\left(7 \right)}+C\)'
    answer: A
    hint: 'Let \(u=\cos t\).'
    explanation: 'Differentiating \(- \frac{7^{\cos{\left(t \right)}}}{\ln{\left(7 \right)}}\) gives \(7^{\cos{\left(t \right)}} \sin{\left(t \right)}\).'
  17:
    topic: s7-1
    question: 'Find \(\displaystyle\int x^{\sqrt2}\,dx\) (for \(x>0\)).'
    A: '\(\frac{x^{1 + \sqrt{2}}}{1 + \sqrt{2}}+C\)'
    B: '\(\sqrt{2} x^{-1 + \sqrt{2}}+C\)'
    C: '\(\frac{x^{-1 + \sqrt{2}}}{-1 + \sqrt{2}}+C\)'
    D: '\(x^{\sqrt{2}} \ln{\left(x \right)}+C\)'
    answer: A
    hint: "The exponent is just a constant: use the power rule."
    explanation: 'Differentiating \(\frac{x^{1 + \sqrt{2}}}{1 + \sqrt{2}}\) gives \(x^{\sqrt{2}}\).'
  18:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_{\ln2}^{\ln3}e^x\,dx\).'
    A: '\(e\)'
    B: '\(1\)'
    C: '\(2\)'
    D: '\(- \ln{\left(2 \right)} + \ln{\left(3 \right)}\)'
    answer: B
    hint: '\(\int e^xdx=e^x\).'
    explanation: '\(e^{\ln3}-e^{\ln2}=3-2=1\).'
  19:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_{-\ln2}^{0}e^{-x}\,dx\).'
    A: '\(\ln{\left(2 \right)}\)'
    B: '\(1\)'
    C: '\(\frac{1}{2}\)'
    D: '\(2\)'
    answer: B
    hint: '\(\int e^{-x}dx=-e^{-x}\).'
    explanation: '\(-1+e^{\ln2}=-1+2=1\).'
  20:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_{\ln4}^{\ln9}e^{x/2}\,dx\).'
    A: '\(4\)'
    B: '\(1\)'
    C: '\(5\)'
    D: '\(2\)'
    answer: D
    hint: '\(\int e^{x/2}dx=2e^{x/2}\).'
    explanation: '\(2(3-2)=2\).'
  21:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_0^{\ln16}e^{x/4}\,dx\).'
    A: '\(4\)'
    B: '\(2\)'
    C: '\(1\)'
    D: '\(8\)'
    answer: A
    hint: '\(\int e^{x/4}dx=4e^{x/4}\).'
    explanation: '\(4(e^{\ln 2}-1)=4\).'
  22:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_0^1 2^{-\theta}\,d\theta\).'
    A: '\(\frac{1}{\ln{\left(2 \right)}}\)'
    B: '\(\frac{1}{2 \ln{\left(2 \right)}}\)'
    C: '\(\frac{1}{2}\)'
    D: '\(\frac{\ln{\left(2 \right)}}{2}\)'
    answer: B
    hint: '\(\int a^{u}du=\dfrac{a^u}{\ln a}\) with base \(\tfrac12\) in effect.'
    explanation: '\(\left[-\dfrac{2^{-\theta}}{\ln2}\right]_0^1=\dfrac{1-\tfrac12}{\ln2}=\dfrac1{2\ln2}\).'
  23:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_1^{4}\dfrac{\log_{2}x}{x}\,dx\).'
    A: '\(2\)'
    B: '\(\ln{\left(2 \right)}\)'
    C: '\(4 \ln{\left(2 \right)}\)'
    D: '\(2 \ln{\left(2 \right)}\)'
    answer: D
    hint: '\(\log_2x=\dfrac{\ln x}{\ln2}\); let \(u=\ln x\).'
    explanation: '\(\dfrac{(\ln4)^2}{2\ln2}=\dfrac{4(\ln2)^2}{2\ln2}=2\ln2\).'
  24:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_1^e\dfrac{2\ln10\,\log_{10}x}{x}\,dx\).'
    A: '\(\ln{\left(10 \right)}\)'
    B: '\(1\)'
    C: '\(e\)'
    D: '\(2\)'
    answer: B
    hint: '\(\ln10\cdot\log_{10}x=\ln x\).'
    explanation: 'The integrand is \(\dfrac{2\ln x}{x}\); \(\left[(\ln x)^2\right]_1^e=1\).'
  25:
    topic: s7-1
    question: 'Evaluate \(\displaystyle\int_0^{2}\dfrac{2\log_{2}(x+2)}{x+2}\,dx\) (a harder substitution).'
    A: '\(4 \ln{\left(2 \right)}\)'
    B: '\(3 \ln{\left(2 \right)}\)'
    C: '\(2 \ln{\left(2 \right)}\)'
    D: '\(\ln{\left(2 \right)}\)'
    answer: B
    hint: 'Let \(u=\ln(x+2)\) and recall \(\log_2=\ln/\ln2\).'
    explanation: '\(\dfrac{[\ln(x+2)]^2}{\ln2}\Big|_0^2=\dfrac{(2\ln2)^2-(\ln2)^2}{\ln2}=3\ln2\).'
  26:
    topic: s7-1
    question: 'Solve \(\dfrac{dy}{dt}=e^t\sin(e^t-2)\), \(y(\ln2)=0\).'
    A: '\(y=-\sin(e^t-2)+1\)'
    B: '\(y=\cos(e^t-2)\)'
    C: '\(y=-\cos(e^t-2)\)'
    D: '\(y=-\cos(e^t-2)+1\)'
    answer: D
    hint: 'Let \(u=e^t-2\); then \(y=-\cos u+C\).'
    explanation: 'At \(t=\ln2\), \(u=0\) and \(-\cos0+C=0\) gives \(C=1\).'
  27:
    topic: s7-1
    question: 'Solve \(\dfrac{d^2y}{dx^2}=2e^{-x}\), \(y(0)=1\), \(y''(0)=0\).'
    A: '\(y=2e^{-x}+2x-1\)'
    B: '\(y=2e^{-x}-2x+1\)'
    C: '\(y=-2e^{-x}+2x+3\)'
    D: '\(y=2e^{-x}+2x\)'
    answer: A
    hint: 'Integrate twice: \(y''=-2e^{-x}+C_1\), \(y=2e^{-x}+C_1x+C_2\).'
    explanation: '\(y''(0)=0\) gives \(C_1=2\); \(y(0)=1\) gives \(C_2=-1\).'
  28:
    topic: s7-1
    question: 'Solve \(\dfrac{dy}{dx}=1+\dfrac1x\), \(y(1)=3\).'
    A: '\(y=x+\ln x+2\)'
    B: '\(y=x+\ln x+3\)'
    C: '\(y=x-\ln x+4\)'
    D: '\(y=x+\ln x+1\)'
    answer: A
    hint: '\(y=x+\ln|x|+C\).'
    explanation: '\(1+0+C=3\) gives \(C=2\).'
  29:
    topic: s7-1
    question: 'The region between \(y=\dfrac1{x^2}\) and the \(x\)-axis from \(x=\tfrac12\) to \(x=2\) is revolved about the \(y\)-axis. The volume is'
    A: '\(4\pi\ln4\)'
    B: '\(\pi\ln4\)'
    C: '\(2\pi\ln2\)'
    D: '\(2\pi\ln4\)'
    answer: D
    hint: 'Shells: \(V=2\pi\int x\cdot\dfrac1{x^2}dx=2\pi\int\dfrac{dx}x\).'
    explanation: '\(2\pi[\ln x]_{1/2}^2=2\pi(\ln2-\ln\tfrac12)=2\pi\ln4=4\pi\ln2\).'
  30:
    topic: s7-1
    question: 'The linearization of \(\ln(1+x)\) at \(x=0\) is'
    A: '\(1+x\)'
    B: '\(x\)'
    C: '\(\ln x\)'
    D: '\(1\)'
    answer: B
    hint: '\(L(x)=f(0)+f''(0)x\) with \(f''=\dfrac1{1+x}\).'
    explanation: '\(f(0)=0\) and \(f''(0)=1\), so \(L(x)=x\).'
  31:
    topic: s7-1
    question: 'The linearization of \(e^x\) at \(x=0\) is'
    A: '\(1+ex\)'
    B: '\(x\)'
    C: '\(e+x\)'
    D: '\(1+x\)'
    answer: D
    hint: '\(f(0)=f''(0)=1\).'
    explanation: '\(L(x)=1+x\); it overestimates nothing: \(e^x\ge1+x\) everywhere (the graph of \(e^x\) is concave up).'
  32:
    topic: s7-1
    question: 'Because the graph of \(e^x\) is concave up everywhere, the approximation \(e^x\approx1+x\)'
    A: 'underestimates \(e^x\) for every \(x\neq0\)'
    B: 'is exact for \(x=1\)'
    C: 'overestimates \(e^x\) for every \(x\neq0\)'
    D: 'overestimates for \(x<0\) and underestimates for \(x>0\)'
    answer: A
    hint: A tangent line lies below a concave-up curve.
    explanation: '\(e^x>1+x\) for all \(x\ne0\).'
  33:
    topic: s7-1
    question: 'Show that for \(a>1\), \(\displaystyle\int_1^a\ln x\,dx+\int_0^{\ln a}e^y\,dy\) equals'
    A: '\(a^2\ln a\)'
    B: '\(a\)'
    C: '\(a\ln a\)'
    D: '\(\ln a\)'
    answer: C
    hint: 'The two regions fit together to form a rectangle of width \(a\) and height \(\ln a\).'
    explanation: 'The area under \(y=\ln x\) and the area to its left (under \(x=e^y\)) fill the rectangle \([0,a]\times[0,\ln a]\) (minus nothing), giving \(a\ln a\).'
  34:
    topic: s7-1
    question: 'The geometric, logarithmic and arithmetic means of \(0<a<b\) satisfy'
    A: '\(\dfrac{a+b}{2}<\dfrac{b-a}{\ln b-\ln a}<\sqrt{ab}\)'
    B: '\(\sqrt{ab}=\dfrac{b-a}{\ln b-\ln a}=\dfrac{a+b}{2}\)'
    C: '\(\sqrt{ab}<\dfrac{b-a}{\ln b-\ln a}<\dfrac{a+b}2\)'
    D: '\(\dfrac{b-a}{\ln b-\ln a}<\sqrt{ab}<\dfrac{a+b}2\)'
    answer: C
    hint: 'Compare areas under \(e^x\) with a tangent-line and a chord.'
    explanation: 'Because \(e^x\) is concave up, the midpoint tangent rectangle underestimates the integral and the trapezoid overestimates it.'
  35:
    topic: s7-1
    question: 'The curve \(y=\dfrac{x^2}8-\ln x\), \(4\le x\le8\), has length'
    A: '\(5.31\)'
    B: '\(6\)'
    C: '\(6.69\)'
    D: '\(12\)'
    answer: C
    hint: '\(1+(y'')^2=\left(\dfrac x4+\dfrac1x\right)^2\).'
    explanation: '\(\int_4^8\left(\tfrac x4+\tfrac1x\right)dx=\left[\tfrac{x^2}8+\ln x\right]_4^8=6+\ln2\approx6.69\).'
  36:
    topic: s7-1
    question: 'To five decimal places, how close is \(x\) to \(\ln(1+x)\) for \(0\le x\le0.1\)? The largest error occurs at \(x=0.1\) and equals about'
    A: '\(0.00531\)'
    B: '\(0.00047\)'
    C: '\(0.00469\)'
    D: '\(0.0100\)'
    answer: C
    hint: 'Error \(=x-\ln(1+x)\) at \(x=0.1\).'
    explanation: '\(0.1-\ln1.1=0.1-0.09531=0.00469\).'
  37:
    topic: s7-1
    question: 'Find the value of \(\log_3 8\) to four decimal places.'
    A: '\(1.8928\)'
    B: '\(2.6667\)'
    C: '\(0.5283\)'
    D: '\(1.3979\)'
    answer: A
    hint: '\(\log_ab=\dfrac{\ln b}{\ln a}\).'
    explanation: '\(\dfrac{\ln8}{\ln3}=\dfrac{2.0794}{1.0986}\approx1.8928\).'
  38:
    topic: s7-1
    question: 'Find \(\log_{0.5}7\) to four decimal places.'
    A: '\(-0.3562\)'
    B: '\(2.8074\)'
    C: '\(0.3562\)'
    D: '\(-2.8074\)'
    answer: D
    hint: '\(\log_{0.5}7=\dfrac{\ln7}{\ln0.5}\); \(\ln0.5<0\).'
    explanation: '\(\dfrac{1.9459}{-0.6931}=-2.8074\).'
  39:
    topic: s7-1
    question: 'If \(\log_{10}x=2.3\), then \(\ln x=\)'
    A: '\(5.2959\)'
    B: '\(2.3\)'
    C: '\(0.9988\)'
    D: '\(1.4291\)'
    answer: A
    hint: '\(\ln x=\ln10\cdot\log_{10}x\).'
    explanation: '\(2.302585\times2.3\approx5.2959\).'
  40:
    topic: s7-1
    question: 'If \(\log_2x=1.4\), then \(\ln x=\)'
    A: '\(0.9704\)'
    B: '\(2.0197\)'
    C: '\(1.4427\)'
    D: '\(1.4\)'
    answer: A
    hint: '\(\ln x=\ln2\cdot\log_2x\).'
    explanation: '\(0.693147\times1.4\approx0.9704\).'
  41:
    topic: s7-1
    question: 'The conversion between logarithm bases: \(\log_2x\) in terms of \(\log_{10}x\) is'
    A: '\(\dfrac{\ln10}{\ln2}\log_{10}x\)'
    B: '\(\ln2\cdot\log_{10}x\)'
    C: '\(\dfrac{\ln2}{\ln10}\log_{10}x\)'
    D: '\(\log_{10}x-\log_{10}2\)'
    answer: A
    hint: '\(\log_2x=\dfrac{\ln x}{\ln2}\) and \(\ln x=\ln10\cdot\log_{10}x\).'
    explanation: Combine the two.
  42:
    topic: s7-1
    question: 'Which is bigger, \(\pi^e\) or \(e^\pi\)?'
    A: It cannot be decided without a calculator
    B: They are equal
    C: '\(e^\pi\)'
    D: '\(\pi^e\)'
    answer: C
    hint: 'The tangent line to \(y=\ln x\) through the origin is \(y=x/e\), and \(\ln x<x/e\) for \(x\ne e\).'
    explanation: '\(\ln\pi<\pi/e\) gives \(e\ln\pi<\pi\), i.e. \(\pi^e<e^\pi\).'
  43:
    topic: s7-1
    question: 'The tangent line to \(y=\ln x\) through the origin has equation'
    A: '\(y=x-1\)'
    B: '\(y=ex\)'
