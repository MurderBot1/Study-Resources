  88:
    topic: s8-1
    question: 'All of the substitutions \(u=\dfrac1{x+1}\), \(u=\tan^{-1}x\), \(u=\cosh^{-1}x\) etc. can be used on \(\displaystyle\int\left((x^2-1)(x+1)\right)^{-2/3}dx\). The value of the integral (for \(x>1\)) is'
    A: '\(3\left(\dfrac{x-1}{x+1}\right)^{1/3}+C\)'
    B: '\(\dfrac32\left(\dfrac{x+1}{x-1}\right)^{1/3}+C\)'
    C: '\(\dfrac23\left(\dfrac{x-1}{x+1}\right)^{1/3}+C\)'
    D: '\(\dfrac32\left(\dfrac{x-1}{x+1}\right)^{1/3}+C\)'
    answer: D
