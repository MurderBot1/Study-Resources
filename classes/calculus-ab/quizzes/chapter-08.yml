    explanation: '\(\ln\left|\dfrac{x-1}{x+1}\right|\Big|_{-\infty}^{-2}=\ln3-0\).'
  394:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-\infty}^{2}\dfrac{2\,dx}{x^2+4}\).'
    A: '\(\frac{3 \pi}{4}\)'
    B: '\(\frac{\pi}{2}\)'
    C: '\(\pi\)'
    D: '\(\frac{\pi}{4}\)'
    answer: A
    hint: '\(\int\dfrac{2\,dx}{x^2+4}=\tan^{-1}\dfrac x2\).'
    explanation: '\(\tan^{-1}1-\left(-\tfrac\pi2\right)=\tfrac\pi4+\tfrac\pi2=\tfrac{3\pi}4\).'
  395:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_2^\infty\dfrac{2\,dt}{t^2-1}\).'
    A: Diverges
    B: '\(\ln{\left(2 \right)}\)'
    C: '\(\ln{\left(3 \right)}\)'
    D: '\(\frac{\ln{\left(3 \right)}}{2}\)'
    answer: C
    hint: '\(\dfrac2{t^2-1}=\dfrac1{t-1}-\dfrac1{t+1}\).'
    explanation: '\(\ln\dfrac{t-1}{t+1}\Big|_2^\infty=0-\ln\tfrac13=\ln3\).'
  396:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-\infty}^\infty\dfrac{2x\,dx}{\left(x^2+1\right)^2}\).'
    A: Diverges
    B: '\(0\)'
    C: '\(1\)'
    D: '\(2\)'
    answer: B
    hint: 'Split at \(0\); each piece converges.'
    explanation: '\(-\dfrac1{x^2+1}\) tends to \(0\) at both ends, so the integral is \(0\) (the two halves cancel).'
  397:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^\infty\dfrac{dx}{(1+x)\sqrt x}\).'
    A: '\(2 \pi\)'
    B: Diverges
    C: '\(\frac{\pi}{2}\)'
    D: '\(\pi\)'
    answer: D
    hint: 'Let \(u=\sqrt x\); the integral becomes \(\int\dfrac{2\,du}{1+u^2}\).'
    explanation: '\(2\tan^{-1}\sqrt x\Big|_0^\infty=2\cdot\tfrac\pi2=\pi\).'
  398:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_1^\infty\dfrac{dx}{x\sqrt{x^2-1}}\).'
    A: '\(\frac{\pi}{4}\)'
    B: '\(\frac{\pi}{2}\)'
    C: Diverges
    D: '\(\pi\)'
    answer: B
    hint: 'Let \(x=\sec\theta\).'
    explanation: '\(\sec^{-1}x\Big|_1^\infty=\tfrac\pi2-0\).'
  399:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^\infty\dfrac{16\tan^{-1}x}{1+x^2}\,dx\).'
    A: '\(2 \pi^{2}\)'
    B: Diverges
    C: '\(4 \pi^{2}\)'
    D: '\(\pi^{2}\)'
    answer: A
    hint: 'Let \(u=\tan^{-1}x\).'
    explanation: '\(8\left(\tan^{-1}x\right)^2\Big|_0^\infty=8\cdot\tfrac{\pi^2}4=2\pi^2\).'
  400:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-\infty}^0\theta e^{\theta}\,d\theta\).'
    A: '\(-1\)'
    B: Diverges
    C: '\(0\)'
    D: '\(1\)'
    answer: A
    hint: 'Parts: \(\int\theta e^\theta d\theta=(\theta-1)e^\theta\).'
    explanation: '\((\theta-1)e^\theta\Big|_{-\infty}^0=-1-0=-1\).'
  401:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^\infty2e^{-\theta}\sin\theta\,d\theta\).'
    A: '\(1\)'
    B: '\(\frac{1}{2}\)'
    C: Diverges
    D: '\(2\)'
    answer: A
    hint: 'Parts twice, or a table: \(\int e^{-\theta}\sin\theta\,d\theta=-\tfrac12e^{-\theta}(\sin\theta+\cos\theta)\).'
    explanation: '\(-e^{-\theta}(\sin\theta+\cos\theta)\Big|_0^\infty=0+1=1\).'
  402:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-\infty}^0e^{-|x|}\,dx\).'
    A: Diverges
    B: '\(2\)'
    C: '\(\frac{1}{2}\)'
    D: '\(1\)'
    answer: D
    hint: 'For \(x<0\), \(e^{-|x|}=e^x\).'
    explanation: '\(e^x\Big|_{-\infty}^0=1\).'
  403:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-\infty}^\infty2xe^{-x^2}\,dx\).'
    A: '\(2\)'
    B: '\(1\)'
    C: Diverges
    D: '\(0\)'
    answer: D
    hint: 'Each half converges (\(-e^{-x^2}\) has limit 0 at both ends).'
    explanation: 'The integrand is odd, so the integral is \(0\).'
  404:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^1x\ln x\,dx\).'
    A: '\(- \frac{1}{2}\)'
    B: '\(- \frac{1}{4}\)'
    C: '\(\frac{1}{4}\)'
    D: Diverges
    answer: B
    hint: 'Parts; remember \(\lim_{x\to0^+}x^2\ln x=0\).'
    explanation: '\(\left[\tfrac{x^2}2\ln x-\tfrac{x^2}4\right]_0^1=-\tfrac14\).'
  405:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^1(-\ln x)\,dx\).'
    A: '\(1\)'
    B: Diverges
    C: '\(0\)'
    D: '\(-1\)'
    answer: A
    hint: '\(\int-\ln x\,dx=x-x\ln x\).'
    explanation: '\(\left[x-x\ln x\right]_0^1=1-0\), since \(x\ln x\to0\).'
  406:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^1\dfrac{4r\,dr}{\sqrt{1-r^4}}\).'
    A: '\(2 \pi\)'
    B: '\(\frac{\pi}{2}\)'
    C: '\(\pi\)'
    D: Diverges
    answer: C
    hint: 'Let \(u=r^2\).'
    explanation: '\(2\sin^{-1}r^2\Big|_0^1=2\cdot\tfrac\pi2=\pi\).'
  407:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_1^2\dfrac{ds}{s\sqrt{s^2-1}}\).'
    A: Diverges
    B: '\(\frac{\pi}{6}\)'
    C: '\(\frac{\pi}{2}\)'
    D: '\(\frac{\pi}{3}\)'
    answer: D
    hint: '\(\int\dfrac{ds}{s\sqrt{s^2-1}}=\sec^{-1}s\).'
    explanation: '\(\sec^{-1}2-\sec^{-1}1=\tfrac\pi3-0\).'
  408:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-1}^{4}\dfrac{dx}{\sqrt{|x|}}\).'
    A: '\(4\)'
    B: Diverges
    C: '\(6\)'
    D: '\(3\)'
    answer: C
    hint: 'Split at \(0\).'
    explanation: '\(\int_{-1}^0=2\) and \(\int_0^4=4\).'
  409:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^2\dfrac{dx}{\sqrt{|x-1|}}\).'
    A: Diverges
    B: '\(2\)'
    C: '\(8\)'
    D: '\(4\)'
    answer: D
    hint: 'The singularity is at \(x=1\).'
    explanation: 'Each half equals \(2\).'
  410:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-1}^\infty\dfrac{d\theta}{\theta^2+5\theta+6}\).'
    A: '\(\ln{\left(3 \right)}\)'
    B: '\(\frac{\ln{\left(2 \right)}}{2}\)'
    C: Diverges
    D: '\(\ln{\left(2 \right)}\)'
    answer: D
    hint: '\(\dfrac1{(\theta+2)(\theta+3)}=\dfrac1{\theta+2}-\dfrac1{\theta+3}\).'
    explanation: '\(\ln\dfrac{\theta+2}{\theta+3}\Big|_{-1}^\infty=0-\ln\tfrac12=\ln2\).'
  411:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^\infty\dfrac{dx}{(x+1)\left(x^2+1\right)}\).'
    A: '\(\frac{\pi}{8}\)'
    B: Diverges
    C: '\(\frac{\pi}{4}\)'
    D: '\(\frac{\pi}{2}\)'
    answer: C
    hint: 'Partial fractions: \(\dfrac12\left(\dfrac1{x+1}-\dfrac{x-1}{x^2+1}\right)\).'
    explanation: 'The logarithms cancel at the limits, leaving \(\dfrac12\cdot\dfrac\pi2=\dfrac\pi4\).'
  412:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^\infty\dfrac{d\theta}{1+e^\theta}\).'
    A: '\(1\)'
    B: '\(\ln{\left(2 \right)}\)'
    C: Diverges
    D: '\(\ln{\left(3 \right)}\)'
    answer: B
    hint: 'Multiply top and bottom by \(e^{-\theta}\).'
    explanation: '\(-\ln(1+e^{-\theta})\Big|_0^\infty=0+\ln2\).'
  413:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^{\ln2}x^{-2}e^{-1/x}\,dx\).'
    A: '\(\frac{2}{e^{\frac{1}{\ln{\left(2 \right)}}}}\)'
    B: Diverges
    C: '\(e^{- \frac{1}{\ln{\left(2 \right)}}}\)'
    D: '\(\frac{1}{2}\)'
    answer: C
    hint: 'Let \(u=-1/x\); then \(du=x^{-2}dx\).'
    explanation: '\(e^{-1/x}\Big|_{0}^{\ln2}=e^{-1/\ln2}-0\).'
  414:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_0^1\dfrac{e^{-\sqrt x}}{\sqrt x}\,dx\).'
    A: '\(2\)'
    B: '\(\frac{2}{e} + 2\)'
    C: '\(2 - \frac{2}{e}\)'
    D: Diverges
    answer: C
    hint: 'Let \(u=\sqrt x\).'
    explanation: '\(-2e^{-\sqrt x}\Big|_0^1=-2e^{-1}+2\).'
  415:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-1}^{1}-x\ln|x|\,dx\).'
    A: '\(\frac{1}{2}\)'
    B: Diverges
    C: '\(1\)'
    D: '\(0\)'
    answer: D
    hint: The integrand is odd, and each half converges.
    explanation: '\(\int_0^1-x\ln x\,dx=\tfrac14\) and \(\int_{-1}^0=-\tfrac14\), total \(0\).'
  416:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-1}^{1}\ln|x|\,dx\).'
    A: '\(2\)'
    B: '\(-2\)'
    C: '\(0\)'
    D: Diverges
    answer: B
    hint: '\(\ln|x|\) is even; \(\int_0^1\ln x\,dx=-1\).'
    explanation: '\(2(-1)=-2\).'
  417:
    topic: s8-8
    question: '\(\displaystyle\int_0^{\pi/2}\tan\theta\,d\theta\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'Compute directly: \(\int\tan\theta\,d\theta=-\ln|\cos\theta|\).'
    explanation: '\(-\ln\cos\theta\to\infty\) as \(\theta\to\tfrac\pi2^-\).'
  418:
    topic: s8-8
    question: '\(\displaystyle\int_0^{\pi/2}\cot\theta\,d\theta\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'Near \(0\), \(\cot\theta\approx\dfrac1\theta\).'
    explanation: '\(\ln\sin\theta\to-\infty\) as \(\theta\to0^+\).'
  419:
    topic: s8-8
    question: '\(\displaystyle\int_0^\pi\dfrac{\sin\theta\,d\theta}{\sqrt{\pi-\theta}}\) —'
    A: Converges
    B: Diverges
    answer: A
    hint: 'Near \(\pi\), \(\sin\theta\le\pi-\theta\), so the integrand is at most \(\sqrt{\pi-\theta}\).'
    explanation: 'It is bounded by a convergent \(p\)-integral with \(p=\tfrac12\).'
  420:
    topic: s8-8
    question: '\(\displaystyle\int_0^1\dfrac{dt}{t-\sin t}\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'Near \(0\), \(t-\sin t\approx\dfrac{t^3}6\).'
    explanation: 'Compare with \(\int\dfrac{dt}{t^3}\), a divergent \(p\)-integral with \(p=3\ge1\).'
  421:
    topic: s8-8
    question: '\(\displaystyle\int_0^2\dfrac{dx}{1-x^2}\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'The integrand has a vertical asymptote at \(x=1\) inside \([0,2]\).'
    explanation: 'Near \(x=1\), \(\dfrac1{1-x^2}\approx\dfrac1{2(1-x)}\), a \(p=1\) integral, which diverges.'
  422:
    topic: s8-8
    question: '\(\displaystyle\int_0^2\dfrac{dx}{1-x}\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'The integrand has a vertical asymptote at \(x=1\).'
    explanation: '\(\int\dfrac{dx}{1-x}=-\ln|1-x|\), which is unbounded near \(x=1\).'
  423:
    topic: s8-8
    question: '\(\displaystyle\int_1^\infty\dfrac{dx}{x^3+1}\) —'
    A: Converges
    B: Diverges
    answer: A
    hint: 'Direct comparison with \(\dfrac1{x^3}\).'
    explanation: '\(\dfrac1{x^3+1}<\dfrac1{x^3}\) and \(\int_1^\infty x^{-3}dx\) converges.'
  424:
    topic: s8-8
    question: '\(\displaystyle\int_4^\infty\dfrac{dx}{\sqrt x-1}\) —'
    A: Converges
    B: Diverges
    answer: B
    hint: 'Compare with \(\dfrac1{\sqrt x}\).'
    explanation: '\(\dfrac1{\sqrt x-1}>\dfrac1{\sqrt x}\) and \(\int^\infty x^{-1/2}dx\) diverges.'
  425:
    topic: s8-8
    question: '\(\displaystyle\int_2^\infty\dfrac{dx}{\sqrt{x-1}}\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'It behaves like \(x^{-1/2}\).'
    explanation: '\(2\sqrt{x-1}\to\infty\), so it diverges (\(p=\tfrac12<1\)).'
  426:
    topic: s8-8
    question: '\(\displaystyle\int_0^\infty\dfrac{dx}{\sqrt{x^6+1}}\) —'
    A: Diverges
    B: Converges
    answer: B
    hint: 'Compare with \(\dfrac1{x^3}\) for large \(x\) (the part near \(0\) is proper).'
    explanation: '\(\dfrac1{\sqrt{x^6+1}}<\dfrac1{x^3}\) for \(x\ge1\).'
  427:
    topic: s8-8
    question: '\(\displaystyle\int_2^\infty\dfrac{dx}{\sqrt{x^2-1}}\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'For large \(x\), \(\sqrt{x^2-1}\approx x\).'
    explanation: 'Limit comparison with \(\dfrac1x\) (limit \(1\)); \(\int\dfrac{dx}x\) diverges.'
  428:
    topic: s8-8
    question: '\(\displaystyle\int_1^\infty\dfrac{\sqrt{x+1}}{x^2}\,dx\) —'
    A: Converges
    B: Diverges
    answer: A
    hint: 'Limit comparison with \(x^{-3/2}\).'
    explanation: '\(\dfrac{\sqrt{x+1}}{x^2}\sim x^{-3/2}\), a convergent \(p\)-integral.'
  429:
    topic: s8-8
    question: '\(\displaystyle\int_2^\infty\dfrac{x\,dx}{\sqrt{x^4-1}}\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: 'For large \(x\), \(\sqrt{x^4-1}\approx x^2\).'
    explanation: 'The integrand behaves like \(\dfrac1x\); limit comparison with \(\int\dfrac{dx}x\) shows divergence.'
  430:
    topic: s8-8
    question: '\(\displaystyle\int_\pi^\infty\dfrac{2+\cos x}x\,dx\) —'
    A: Converges
    B: Diverges
    answer: B
    hint: '\(2+\cos x\ge1\).'
    explanation: '\(\dfrac{2+\cos x}x\ge\dfrac1x\), and \(\int\dfrac{dx}x\) diverges.'
  431:
    topic: s8-8
    question: '\(\displaystyle\int_\pi^\infty\dfrac{1+\sin x}{x^2}\,dx\) —'
    A: Diverges
    B: Converges
    answer: B
    hint: '\(0\le1+\sin x\le2\).'
    explanation: '\(\dfrac{1+\sin x}{x^2}\le\dfrac2{x^2}\), which converges.'
  432:
    topic: s8-8
    question: '\(\displaystyle\int_4^\infty\dfrac{2\,dt}{t^{3/2}-1}\) —'
    A: Diverges
    B: Converges
    answer: B
    hint: 'Limit comparison with \(t^{-3/2}\).'
    explanation: 'The ratio tends to \(2\); \(\int t^{-3/2}dt\) converges.'
  433:
    topic: s8-8
    question: '\(\displaystyle\int_2^\infty\dfrac{dx}{\ln x}\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: '\(\ln x<x\) for \(x>0\).'
    explanation: '\(\dfrac1{\ln x}>\dfrac1x\), and \(\int\dfrac{dx}x\) diverges.'
  434:
    topic: s8-8
    question: '\(\displaystyle\int_1^\infty\dfrac{e^x}x\,dx\) —'
    A: Diverges
    B: Converges
    answer: A
    hint: '\(e^x\) grows faster than any power of \(x\).'
    explanation: '\(\dfrac{e^x}x\to\infty\), so the integral cannot converge.'
  435:
    topic: s8-8
    question: '\(\displaystyle\int_1^\infty\dfrac{dx}{\sqrt{e^x-x}}\) —'
    A: Diverges
    B: Converges
    answer: B
    hint: '\(e^x-x\ge\tfrac12e^x\) for \(x\ge1\).'
    explanation: '\(\dfrac1{\sqrt{e^x-x}}\le\sqrt2e^{-x/2}\), which has a finite integral.'
  436:
    topic: s8-8
    question: '\(\displaystyle\int_{-\infty}^\infty\dfrac{dx}{\sqrt{x^4+1}}\) —'
    A: Converges
    B: Diverges
    answer: A
    hint: 'The integrand is even; for \(|x|\ge1\) compare with \(\dfrac1{x^2}\).'
    explanation: '\(\dfrac1{\sqrt{x^4+1}}<\dfrac1{x^2}\), and \(\int_1^\infty x^{-2}dx\) converges; the middle part is proper.'
  437:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-\infty}^\infty\dfrac{dx}{e^x+e^{-x}}\).'
    A: '\(\pi\)'
    B: '\(\frac{\pi}{2}\)'
    C: Diverges
    D: '\(1\)'
    answer: B
    hint: 'Multiply top and bottom by \(e^x\) and let \(u=e^x\).'
    explanation: '\(\tan^{-1}(e^x)\Big|_{-\infty}^\infty=\tfrac\pi2-0\).'
  438:
    topic: s8-8
    question: '\(\displaystyle\int_{-\infty}^\infty\dfrac{dx}{\sqrt{x^2+1}}\) —'
    A: Converges
    B: Diverges
    answer: B
    hint: 'For large \(|x|\), the integrand behaves like \(\dfrac1{|x|}\).'
    explanation: 'Limit comparison with \(\int\dfrac{dx}{x}\); equivalently \(\sinh^{-1}x\) is unbounded.'
  439:
    topic: s8-8
    question: '\(\displaystyle\int_{-\infty}^\infty\dfrac{e^{-x}\,dx}{x^2+1}\) —'
    A: Converges
    B: Diverges
    answer: B
    hint: 'Look at the behavior as \(x\to-\infty\).'
    explanation: '\(e^{-x}\) grows much faster than \(x^2+1\), so the integrand tends to \(\infty\).'
  440:
    topic: s8-8
    question: '\(\displaystyle\int_{-\infty}^\infty\dfrac{dx}{(x+1)^2}\) —'
    A: Converges
    B: Diverges
    answer: B
    hint: 'There is a vertical asymptote at \(x=-1\).'
    explanation: 'Near \(x=-1\), the integrand is \(p=2\ge1\), a divergent singular integral.'
  441:
    topic: s8-8
    question: '\(\displaystyle\int_{-\infty}^\infty\dfrac{|\sin x|+|\cos x|}{|x|+1}\,dx\) —'
    A: Converges
    B: Diverges
    answer: B
    hint: '\(|\sin x|+|\cos x|\ge\sin^2x+\cos^2x=1\).'
    explanation: 'The integrand is \(\ge\dfrac1{|x|+1}\), and \(\int_0^\infty\dfrac{dx}{x+1}\) diverges.'
  442:
    topic: s8-8
    question: 'Evaluate \(\displaystyle\int_{-\infty}^{\infty}\dfrac{x\,dx}{(x^2+1)(x^2+2)}\).'
    A: Diverges
    B: '\(\ln{\left(2 \right)}\)'
    C: '\(0\)'
    D: '\(1\)'
    answer: C
    hint: 'The integrand is odd and each half converges (decays like \(x^{-3}\)).'
    explanation: 'The two halves cancel: \(0\).'
  443:
    topic: s8-8
    question: '\(\displaystyle\int_{-\infty}^\infty\dfrac{dx}{x^2+1}\) equals'
    A: '\(\dfrac\pi2\)'
    B: The integral diverges
    C: '\(2\pi\)'
    D: '\(\pi\)'
    answer: D
    hint: Both halves converge; the integrand is even.
    explanation: '\(\tan^{-1}x\Big|_{-\infty}^\infty=\tfrac\pi2-\left(-\tfrac\pi2\right)\).'
  444:
    topic: s8-8
    question: 'For which \(p\) does \(\displaystyle\int_2^\infty\dfrac{dx}{x(\ln x)^p}\) converge?'
    A: '\(p>0\)'
    B: '\(p<1\)'
    C: '\(p>1\)'
    D: 'all \(p\)'
    answer: C
    hint: 'Let \(u=\ln x\); the integral becomes \(\int_{\ln2}^\infty u^{-p}du\).'
    explanation: 'A \(p\)-integral at infinity converges exactly when \(p>1\).'
  445:
    topic: s8-8
    question: 'For which \(p\) does \(\displaystyle\int_1^2\dfrac{dx}{x(\ln x)^p}\) converge?'
    A: '\(p>1\)'
    B: 'no \(p\)'
    C: '\(p>0\)'
    D: '\(p<1\)'
    answer: D
    hint: 'Let \(u=\ln x\); the singularity at \(u=0\) behaves like \(\int_0u^{-p}du\).'
    explanation: 'A \(p\)-integral at \(0\) converges exactly when \(p<1\).'
  446:
    topic: s8-8
    question: 'Consider \(\displaystyle\int_{-\infty}^\infty\dfrac{2x\,dx}{x^2+1}\). Which statement is correct?'
    A: 'It converges to \(\ln2\)'
    B: It diverges because the integrand is unbounded
    C: 'The integral diverges, even though \(\lim_{b\to\infty}\displaystyle\int_{-b}^b\dfrac{2x\,dx}{x^2+1}=0\)'
    D: 'It converges to \(0\) because the integrand is odd'
    answer: C
    hint: 'Check whether \(\int_0^\infty\dfrac{2x\,dx}{x^2+1}\) converges.'
    explanation: '\(\ln(x^2+1)\to\infty\); both halves diverge, so the symmetric-limit value \(0\) does not count.'
  447:
    topic: s8-8
    question: 'The area of the infinite region in the first quadrant between \(y=e^{-x}\) and the \(x\)-axis is'
    A: '\(\dfrac12\)'
    B: infinite
    C: '\(1\)'
    D: '\(e\)'
    answer: C
    hint: '\(\displaystyle\int_0^\infty e^{-x}dx\).'
    explanation: '\(-e^{-x}\Big|_0^\infty=1\).'
  448:
    topic: s8-8
    question: 'The centroid of the same region (first quadrant under \(y=e^{-x}\)) is at'
    A: '\(\left(\dfrac12,\dfrac14\right)\)'
    B: '\(\left(1,\dfrac12\right)\)'
    C: '\(\left(1,\dfrac14\right)\)'
    D: '\(\left(2,\dfrac14\right)\)'
    answer: C
    hint: '\(\bar x=\dfrac{\int xe^{-x}dx}{\int e^{-x}dx}\), \(\bar y=\dfrac{\frac12\int e^{-2x}dx}{\int e^{-x}dx}\).'
    explanation: '\(\bar x=\dfrac11=1\) and \(\bar y=\dfrac{\frac12\cdot\frac12}1=\dfrac14\).'
  449:
    topic: s8-8
    question: 'Revolving the region under \(y=e^{-x}\) (\(x\ge0\)) about the \(y\)-axis gives volume'
    A: '\(2\pi\)'
    B: infinite
    C: '\(\dfrac\pi2\)'
    D: '\(\pi\)'
    answer: A
    hint: 'Shells: \(V=2\pi\int_0^\infty xe^{-x}dx\).'
    explanation: '\(\int_0^\infty xe^{-x}dx=1\), so \(V=2\pi\).'
  450:
    topic: s8-8
    question: 'Revolving the region under \(y=e^{-x}\) (\(x\ge0\)) about the \(x\)-axis gives volume'
    A: infinite
    B: '\(\pi\)'
    C: '\(2\pi\)'
    D: '\(\dfrac\pi2\)'
    answer: D
    hint: 'Disks: \(V=\pi\int_0^\infty e^{-2x}dx\).'
    explanation: '\(\pi\cdot\dfrac12=\dfrac\pi2\).'
  451:
    topic: s8-8
    question: 'The area between \(y=\sec x\) and \(y=\tan x\) from \(x=0\) to \(x=\pi/2\) is'
    A: '\(1\)'
    B: infinite
    C: '\(\ln2\)'
    D: '\(\ln3\)'
    answer: C
    hint: 'Each function is unbounded at \(\pi/2\), but their difference \(\sec x-\tan x=\dfrac{1-\sin x}{\cos x}\) is not.'
    explanation: '\(\int(\sec x-\tan x)dx=\ln(1+\sin x)\), so the area is \(\ln2-0\).'
  452:
    topic: s8-8
    question: 'Revolving the region between \(y=\sec x\) and \(y=\tan x\), \(0\le x\le\pi/2\), about the \(x\)-axis gives volume'
    A: '\(\dfrac\pi2\)'
    B: '\(\pi^2\)'
    C: infinite
    D: '\(\dfrac{\pi^2}2\)'
    answer: D
    hint: 'Washers: \(V=\pi\int_0^{\pi/2}\left(\sec^2x-\tan^2x\right)dx\).'
    explanation: '\(\sec^2x-\tan^2x=1\), so \(V=\pi\cdot\dfrac\pi2=\dfrac{\pi^2}2\).'
  453:
    topic: s8-8
    question: 'Gabriel''s horn: revolving \(y=\dfrac1x\), \(x\ge1\), about the \(x\)-axis gives a solid of volume'
    A: '\(\dfrac\pi2\)'
    B: '\(\pi\)'
    C: infinite
    D: '\(2\pi\)'
    answer: B
    hint: '\(V=\pi\int_1^\infty\dfrac{dx}{x^2}\).'
    explanation: '\(\pi\left[-\dfrac1x\right]_1^\infty=\pi\).'
  454:
    topic: s8-8
    question: 'Gabriel''s horn has finite volume but its surface area \(2\pi\displaystyle\int_1^\infty\dfrac1x\sqrt{1+\dfrac1{x^4}}\,dx\) is'
    A: '\(\pi\)'
    B: 'infinite, since it is larger than \(2\pi\displaystyle\int_1^\infty\dfrac{dx}x\)'
    C: '\(2\pi\)'
    D: 'finite, equal to \(\pi\ln2\)'
    answer: B
    hint: 'Compare the integrand with \(\dfrac1x\).'
    explanation: '\(\sqrt{1+x^{-4}}>1\), and \(\int_1^\infty\dfrac{dx}x\) diverges.'
  455:
    topic: s8-8
    question: 'If \(\displaystyle\int_3^\infty e^{-x^2}dx<\int_3^\infty e^{-3x}dx=\dfrac13e^{-9}<0.000042\), then \(\displaystyle\int_0^\infty e^{-x^2}dx\) may be replaced by \(\displaystyle\int_0^3e^{-x^2}dx\) with an error of magnitude'
    A: zero
    B: 'greater than \(0.1\)'
    C: 'exactly \(\dfrac13e^{-9}\)'
    D: 'less than \(0.000042\)'
    answer: D
    hint: 'For \(x\ge3\), \(x^2\ge3x\), so \(e^{-x^2}\le e^{-3x}\).'
    explanation: 'The discarded tail is positive and smaller than \(0.000042\).'
  456:
    topic: s8-8
    question: 'The sine-integral \(\mathrm{Si}(x)=\displaystyle\int_0^x\dfrac{\sin t}t\,dt\) converges as \(x\to\infty\) to'
    A: '\(1\)'
    B: '\(\dfrac\pi2\)'
    C: '\(\pi\)'
    D: it diverges
    answer: B
    hint: This is a known conditionally convergent integral.
    explanation: '\(\displaystyle\int_0^\infty\dfrac{\sin t}t\,dt=\dfrac\pi2\).'
  457:
    topic: s8-8
    question: 'The error function \(\mathrm{erf}(x)=\displaystyle\int_0^x\dfrac{2e^{-t^2}}{\sqrt\pi}\,dt\) approaches what value as \(x\to\infty\)?'
    A: '\(1\)'
    B: '\(\infty\)'
    C: '\(\dfrac2{\sqrt\pi}\)'
    D: '\(\sqrt\pi\)'
    answer: A
    hint: 'Use \(\displaystyle\int_0^\infty e^{-t^2}dt=\dfrac{\sqrt\pi}2\).'
    explanation: '\(\dfrac2{\sqrt\pi}\cdot\dfrac{\sqrt\pi}2=1\).'
  458:
    topic: s8-8
    question: 'For the standard normal density \(f(x)=\dfrac1{\sqrt{2\pi}}e^{-x^2/2}\), \(\displaystyle\int_{-\infty}^\infty f(x)\,dx\) equals'
    A: '\(\dfrac12\)'
    B: '\(\infty\)'
    C: '\(1\)'
    D: '\(\sqrt{2\pi}\)'
    answer: C
    hint: It is a probability density.
    explanation: 'The total probability is \(1\).'
  459:
    topic: s8-8
    question: 'If \(f\) is even and the integrals exist, then \(\displaystyle\int_{-\infty}^\infty f(x)\,dx=\)'
    A: '\(\dfrac12\displaystyle\int_0^\infty f(x)\,dx\)'
    B: '\(0\)'
    C: '\(2\displaystyle\int_0^\infty f(x)\,dx\)'
    D: '\(\displaystyle\int_0^\infty f(x)\,dx\)'
    answer: C
    hint: 'Split at \(0\) and substitute \(x\to-x\) in one half.'
    explanation: The two halves have equal area.
  460:
    topic: s8-8
    question: 'If \(f\) is odd and \(\displaystyle\int_{-\infty}^\infty f(x)\,dx\) converges, then it equals'
    A: '\(\displaystyle\int_0^\infty f(x)\,dx\)'
    B: '\(0\)'
    C: '\(2\displaystyle\int_0^\infty f(x)\,dx\)'
    D: '\(\infty\)'
    answer: B
    hint: 'Split at \(0\) and substitute \(x\to-x\).'
    explanation: The halves cancel.
  461:
    topic: s8-8
    question: '\(\displaystyle\int_{-\infty}^\infty f(x)\,dx\) is defined to converge only if'
    A: 'both \(\displaystyle\int_{-\infty}^af\) and \(\displaystyle\int_a^\infty f\) converge'
    B: '\(\displaystyle\lim_{b\to\infty}\int_{-b}^bf\) exists'
    C: '\(f\) is continuous'
    D: '\(f\) is bounded'
    answer: A
    hint: Each end is handled with its own limit.
    explanation: 'The symmetric limit can exist even when the integral diverges, e.g. for \(f(x)=\dfrac{2x}{x^2+1}\).'
  462:
    topic: s8-8
    question: 'The "argument" that \(\ln3=\infty-\infty\), obtained by writing \(\int_3^\infty\left(\dfrac1{x-2}-\dfrac1x\right)dx\) as two separate integrals, fails because'
    A: '\(\dfrac1{x-2}\) is negative'
    B: each separate integral diverges, so the difference of limits is not defined
    C: the integrand is not continuous
    D: '\(\ln3\) is not defined'
    answer: B
    hint: Splitting is allowed only when both pieces converge.
    explanation: '\(\int_3^\infty\dfrac{dx}{x-2}\) and \(\int_3^\infty\dfrac{dx}{x}\) both diverge.'
  463:
    topic: s8-8
    question: '\(\displaystyle\int_0^ex^p\ln x\,dx\) converges when'
    A: '\(p<-1\)'
    B: '\(p>-1\)'
    C: '\(p>0\) only'
    D: 'for every \(p\)'
    answer: B
    hint: 'Near \(0\), \(x^p\ln x\) is dominated by \(x^p\) (times a slowly growing log).'
    explanation: 'The singularity at \(0\) is integrable exactly when \(p>-1\).'
  464:
    topic: s8-8
    question: '\(\displaystyle\int_e^\infty x^p\ln x\,dx\) converges when'
    A: '\(p>-1\)'
    B: 'for every \(p\)'
    C: '\(p<-1\)'
    D: '\(p<0\) only'
    answer: C
    hint: 'For large \(x\), compare with \(x^{p}\).'
    explanation: '\(x^p\ln x\) decays fast enough exactly when \(p<-1\).'
  465:
    topic: s8-8
    question: '\(\displaystyle\int_0^\infty x^p\ln x\,dx\) converges for'
    A: 'no value of \(p\)'
    B: '\(-1<p<0\)'
    C: '\(p<-1\)'
    D: '\(p>-1\)'
    answer: A
    hint: 'Split at \(x=1\) (or \(e\)); one half needs \(p>-1\), the other needs \(p<-1\).'
    explanation: 'No \(p\) satisfies both conditions.'
