    explanation: '\(4\left[\dfrac x{\sqrt{1-x^2}}-\sin^{-1}x\right]_0^{\sqrt3/2}=4\left(\sqrt3-\dfrac\pi3\right)\).'
  227:
    topic: s8-5
    question: 'Evaluate \(\displaystyle\int_0^1\dfrac{dx}{(4-x^2)^{3/2}}\).'
