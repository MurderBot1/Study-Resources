  247:
    topic: s8-5
    question: 'The region in the first quadrant bounded by the axes, \(y=\dfrac2{1+x^2}\) and \(x=1\) is revolved about the \(x\)-axis. The volume is'
    A: '\(\pi^{2}\)'
    B: '\(\frac{\pi^{2}}{2}\)'
