  249:
    topic: s8-5
    question: 'Find \(\displaystyle\int\dfrac{dx}{1-\sin x}\) (any method).'
    A: '\(\tan{\left(x \right)} - \sec{\left(x \right)}+C\)'
    B: '\(\tan{\left(x \right)}+C\)'
    C: '\(- \tan{\left(x \right)} - \sec{\left(x \right)}+C\)'
    D: '\(\tan{\left(x \right)} + \sec{\left(x \right)}+C\)'
    answer: D
    hint: 'Multiply top and bottom by \(1+\sin x\), or use \(z=\tan\tfrac x2\).'
    explanation: 'Differentiating \(\tan{\left(x \right)} + \sec{\left(x \right)}\) gives \(\frac{1}{1 - \sin{\left(x \right)}}\).'
  250:
    topic: s8-5
    question: 'Evaluate \(\displaystyle\int_0^{\pi/2}\dfrac{dx}{1+\sin x}\).'
    A: '\(2\)'
    B: '\(\ln{\left(2 \right)}\)'
    C: '\(1\)'
    D: '\(\frac{\pi}{4}\)'
    answer: C
    hint: 'Antiderivative: \(\tan x-\sec x\) (or use \(z=\tan\tfrac x2\)).'
    explanation: '\(\lim_{x\to\pi/2}(\tan x-\sec x)-(0-1)=0+1=1\).'
  251:
    topic: s8-5
    question: 'Evaluate \(\displaystyle\int_{\pi/3}^{\pi/2}\dfrac{dx}{1-\cos x}\).'
    A: '\(-1 + \sqrt{3}\)'
    B: '\(2\)'
    C: '\(1 + \sqrt{3}\)'
    D: '\(1 - \sqrt{3}\)'
    answer: A
    hint: '\(\dfrac1{1-\cos x}=\dfrac{1}{2\sin^2(x/2)}\), with antiderivative \(-\cot\tfrac x2\).'
    explanation: '\(-\cot\tfrac\pi4+\cot\tfrac\pi6=-1+\sqrt3\).'
  252:
    topic: s8-5
    question: 'Evaluate \(\displaystyle\int_0^{\pi/2}\dfrac{d\theta}{2+\cos\theta}\).'
    A: '\(\frac{\pi}{3}\)'
    B: '\(\frac{\sqrt{3} \pi}{18}\)'
    C: '\(\frac{2 \sqrt{3} \pi}{9}\)'
    D: '\(\frac{\sqrt{3} \pi}{9}\)'
    answer: D
    hint: 'Let \(z=\tan\tfrac\theta2\): \(\cos\theta=\dfrac{1-z^2}{1+z^2}\).'
    explanation: 'The integral becomes \(\int_0^1\dfrac{2\,dz}{z^2+3}=\dfrac2{\sqrt3}\tan^{-1}\dfrac1{\sqrt3}=\dfrac{\pi}{3\sqrt3}\).'
  253:
    topic: s8-5
    question: 'With \(z=\tan\dfrac x2\), the expression \(\sin x\) becomes'
    A: '\(\dfrac{2z}{1-z^2}\)'
    B: '\(\dfrac{2z}{1+z^2}\)'
    C: '\(\dfrac{z}{1+z^2}\)'
    D: '\(\dfrac{1-z^2}{1+z^2}\)'
    answer: B
    hint: 'Use a right triangle with \(\tan\tfrac x2=z\).'
    explanation: '\(\sin x=2\sin\tfrac x2\cos\tfrac x2=\dfrac{2z}{1+z^2}\).'
  254:
