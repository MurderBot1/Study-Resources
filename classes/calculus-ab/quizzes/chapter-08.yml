    B: '\(\frac{\sqrt{2}}{2} + \frac{\sqrt{3}}{2}\)'
    C: '\(- \sqrt{2} + \sqrt{3}\)'
    D: '\(1 - \frac{\sqrt{2}}{2}\)'
    answer: A
    hint: 'Let \(x=\sec\theta\); then \(\int\cos\theta\,d\theta=\sin\theta\).'
    explanation: '\(\dfrac{\sqrt{x^2-1}}{x}\Big|_{\sqrt2}^2=\dfrac{\sqrt3}2-\dfrac{1}{\sqrt2}\).'
  222:
    topic: s8-5
    question: 'Find \(\displaystyle\int\dfrac{x^3\,dx}{\sqrt{x^2+4}}\).'
    A: '\(\frac{\sqrt{x^{2} + 4} \left(x^{2} + 8\right)}{3}+C\)'
    B: '\(\frac{\left(x^{2} - 4\right) \sqrt{x^{2} + 4}}{3}+C\)'
    C: '\(\left(x^{2} - 8\right) \sqrt{x^{2} + 4}+C\)'
    D: '\(\frac{\left(x^{2} - 8\right) \sqrt{x^{2} + 4}}{3}+C\)'
    answer: D
    hint: 'Let \(u=x^2+4\), so \(x^2=u-4\) and \(x\,dx=\tfrac12du\).'
    explanation: 'Differentiating \(\frac{\left(x^{2} - 8\right) \sqrt{x^{2} + 4}}{3}\) gives \(\frac{x^{3}}{\sqrt{x^{2} + 4}}\).'
  223:
    topic: s8-5
    question: 'Find \(\displaystyle\int\dfrac{dx}{x^2\sqrt{x^2+1}}\).'
    A: '\(- \sqrt{x^{2} + 1}+C\)'
    B: '\(- \frac{x}{\sqrt{x^{2} + 1}}+C\)'
    C: '\(\frac{\sqrt{x^{2} + 1}}{x}+C\)'
    D: '\(- \frac{\sqrt{x^{2} + 1}}{x}+C\)'
    answer: D
    hint: 'Let \(x=\tan\theta\); the integral becomes \(\int\dfrac{\cos\theta}{\sin^2\theta}d\theta\).'
    explanation: 'Differentiating \(- \frac{\sqrt{x^{2} + 1}}{x}\) gives \(\frac{1}{x^{2} \sqrt{x^{2} + 1}}\).'
  224:
    topic: s8-5
    question: 'Find \(\displaystyle\int\dfrac{8\,dw}{w^2\sqrt{4-w^2}}\) (\(0<|w|<2\)).'
    A: '\(- \frac{2 \sqrt{4 - w^{2}}}{w}+C\)'
    B: '\(- \frac{\sqrt{4 - w^{2}}}{w}+C\)'
    C: '\(\frac{2 \sqrt{4 - w^{2}}}{w}+C\)'
    D: '\(- 2 \sqrt{4 - w^{2}}+C\)'
    answer: A
    hint: 'Let \(w=2\sin\theta\).'
    explanation: 'Differentiating \(- \frac{2 \sqrt{4 - w^{2}}}{w}\) gives \(\frac{8}{w^{2} \sqrt{4 - w^{2}}}\).'
  225:
    topic: s8-5
    question: 'Find \(\displaystyle\int\dfrac{\sqrt{9-w^2}}{w^2}\,dw\) (\(0<|w|<3\)).'
    A: '\(\sin^{-1}{\left(\frac{w}{3} \right)} - \frac{\sqrt{9 - w^{2}}}{w}+C\)'
    B: '\(- \sin^{-1}{\left(\frac{w}{3} \right)} - \frac{\sqrt{9 - w^{2}}}{w}+C\)'
    C: '\(- \sin^{-1}{\left(\frac{w}{3} \right)} + \frac{\sqrt{9 - w^{2}}}{w}+C\)'
    D: '\(- \frac{\sqrt{9 - w^{2}}}{w}+C\)'
