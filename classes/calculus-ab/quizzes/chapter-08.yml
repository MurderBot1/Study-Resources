    D: '\(t \sqrt{25 - t^{2}} + \frac{25 \sin^{-1}{\left(\frac{t}{5} \right)}}{2}+C\)'
    answer: B
    hint: 'Let \(t=5\sin\theta\); then \(\sqrt{25-t^2}=5\cos\theta\).'
    explanation: 'Differentiating \(\frac{t \sqrt{25 - t^{2}}}{2} + \frac{25 \sin^{-1}{\left(\frac{t}{5} \right)}}{2}\) gives \(\sqrt{25 - t^{2}}\).'
  220:
    topic: s8-5
    question: 'Find \(\displaystyle\int\sqrt{1-9t^2}\,dt\) (\(|t|<\tfrac13\)).'
    A: '\(\frac{t \sqrt{1 - 9 t^{2}}}{2} + \frac{\sin^{-1}{\left(3 t \right)}}{2}+C\)'
    B: '\(\frac{t \sqrt{1 - 9 t^{2}}}{2} - \frac{\sin^{-1}{\left(3 t \right)}}{6}+C\)'
    C: '\(t \sqrt{1 - 9 t^{2}} + \frac{\sin^{-1}{\left(3 t \right)}}{6}+C\)'
    D: '\(\frac{t \sqrt{1 - 9 t^{2}}}{2} + \frac{\sin^{-1}{\left(3 t \right)}}{6}+C\)'
    answer: D
    hint: 'Let \(3t=\sin\theta\), so \(dt=\tfrac13\cos\theta\,d\theta\).'
    explanation: 'Differentiating \(\frac{t \sqrt{1 - 9 t^{2}}}{2} + \frac{\sin^{-1}{\left(3 t \right)}}{6}\) gives \(\sqrt{1 - 9 t^{2}}\).'
  221:
    topic: s8-5
    question: 'Evaluate \(\displaystyle\int_{\sqrt2}^{2}\dfrac{dx}{x^2\sqrt{x^2-1}}\).'
