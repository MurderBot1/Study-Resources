# Chapter 8: Techniques of Integration
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 8.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 8: Techniques of Integration"
description: Basic integration formulas, integration by parts, partial fractions, trigonometric integrals and substitutions, integral tables, numerical integration, and improper integrals.
topics:
  s8-1:
    title: 8.1 Basic Integration Formulas
  s8-2:
    title: 8.2 Integration by Parts
  s8-3:
    title: 8.3 Integration of Rational Functions by Partial Fractions
  s8-4:
    title: 8.4 Trigonometric Integrals
  s8-5:
    title: 8.5 Trigonometric Substitutions
  s8-6:
    title: 8.6 Integral Tables and Computer Algebra Systems
  s8-7:
    title: 8.7 Numerical Integration
  s8-8:
    title: 8.8 Improper Integrals
questions:
  1:
    topic: s8-1
    question: 'Find \(\displaystyle\int \frac{16 x}{\sqrt{8 x^{2} + 1}}\,dx\).'
    A: '\(2 \sqrt{8 x^{2} + 1}+C\)'
    B: '\(\sqrt{8 x^{2} + 1}+C\)'
    C: '\(- 2 \sqrt{8 x^{2} + 1}+C\)'
    D: '\(4 \sqrt{8 x^{2} + 1}+C\)'
    answer: A
    hint: 'Let \(u=8x^2+1\), so \(du=16x\,dx\).'
    explanation: 'Differentiating \(2 \sqrt{8 x^{2} + 1}\) gives \(\frac{16 x}{\sqrt{8 x^{2} + 1}}\).'
  2:
    topic: s8-1
    question: 'Find \(\displaystyle\int \frac{3 \cos{\left(x \right)}}{\sqrt{3 \sin{\left(x \right)} + 1}}\,dx\).'
    A: '\(- 2 \sqrt{3 \sin{\left(x \right)} + 1}+C\)'
    B: '\(\sqrt{3 \sin{\left(x \right)} + 1}+C\)'
    C: '\(2 \sqrt{3 \sin{\left(x \right)} + 1}+C\)'
    D: '\(4 \sqrt{3 \sin{\left(x \right)} + 1}+C\)'
    answer: C
    hint: 'Let \(u=1+3\sin x\); then \(du=3\cos x\,dx\).'
    explanation: 'Differentiating \(2 \sqrt{3 \sin{\left(x \right)} + 1}\) gives \(\frac{3 \cos{\left(x \right)}}{\sqrt{3 \sin{\left(x \right)} + 1}}\).'
  3:
    topic: s8-1
    question: 'Find \(\displaystyle\int 3 \sqrt{\sin{\left(v \right)}} \cos{\left(v \right)}\,dv\).'
    A: '\(4 \sin^{\frac{3}{2}}{\left(v \right)}+C\)'
    B: '\(\sin^{\frac{3}{2}}{\left(v \right)}+C\)'
    C: '\(- 2 \sin^{\frac{3}{2}}{\left(v \right)}+C\)'
    D: '\(2 \sin^{\frac{3}{2}}{\left(v \right)}+C\)'
    answer: D
    hint: 'Let \(u=\sin v\) and use the power rule.'
    explanation: 'Differentiating \(2 \sin^{\frac{3}{2}}{\left(v \right)}\) gives \(3 \sqrt{\sin{\left(v \right)}} \cos{\left(v \right)}\).'
  4:
    topic: s8-1
    question: 'Find \(\displaystyle\int \cot^{3}{\left(y \right)} \csc^{2}{\left(y \right)}\,dy\).'
    A: '\(- \frac{1 - 2 \sin^{2}{\left(y \right)}}{8 \sin^{4}{\left(y \right)}}+C\)'
    B: '\(- \frac{1 - 2 \sin^{2}{\left(y \right)}}{4 \sin^{4}{\left(y \right)}}+C\)'
    C: '\(\frac{1 - 2 \sin^{2}{\left(y \right)}}{4 \sin^{4}{\left(y \right)}}+C\)'
    D: '\(- \frac{1 - 2 \sin^{2}{\left(y \right)}}{2 \sin^{4}{\left(y \right)}}+C\)'
    answer: B
    hint: 'Let \(u=\cot y\); then \(du=-\csc^2y\,dy\).'
    explanation: 'Differentiating \(- \frac{1 - 2 \sin^{2}{\left(y \right)}}{4 \sin^{4}{\left(y \right)}}\) gives \(\cot^{3}{\left(y \right)} \csc^{2}{\left(y \right)}\).'
  5:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_{0}^{1} \frac{16 x}{8 x^{2} + 2}\,dx\).'
    A: '\(\ln{\left(5 \right)}\)'
    B: '\(2 \ln{\left(5 \right)}\)'
    C: '\(- \ln{\left(5 \right)}\)'
    D: '\(\frac{\ln{\left(5 \right)}}{2}\)'
    answer: A
    hint: The numerator is the derivative of the denominator.
    explanation: '\(\ln(8x^2+2)\Big|_0^1=\ln10-\ln2=\ln5\).'
  6:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_{\frac{\pi}{4}}^{\frac{\pi}{3}} \frac{\sec^{2}{\left(z \right)}}{\tan{\left(z \right)}}\,dz\).'
    A: '\(\ln{\left(3 \right)}\)'
    B: '\(\frac{\ln{\left(3 \right)}}{2}\)'
    C: '\(- \frac{\ln{\left(3 \right)}}{2}\)'
    D: '\(\frac{\ln{\left(3 \right)}}{4}\)'
    answer: B
    hint: 'Let \(u=\tan z\); then \(du=\sec^2z\,dz\).'
    explanation: 'An antiderivative is \(- \frac{\ln{\left(\sin^{2}{\left(z \right)} - 1 \right)}}{2} + \ln{\left(\sin{\left(z \right)} \right)}\); then \(F(\frac{\pi}{3})-F(\frac{\pi}{4})=\frac{\ln{\left(3 \right)}}{2}\).'
  7:
    topic: s8-1
    question: 'Find \(\displaystyle\int \frac{1}{\sqrt{x} \left(\sqrt{x} + 1\right)}\,dx\).'
    A: '\(\ln{\left(\sqrt{x} + 1 \right)}+C\)'
    B: '\(4 \ln{\left(\sqrt{x} + 1 \right)}+C\)'
    C: '\(2 \ln{\left(\sqrt{x} + 1 \right)}+C\)'
    D: '\(- 2 \ln{\left(\sqrt{x} + 1 \right)}+C\)'
    answer: C
    hint: 'Let \(u=\sqrt x+1\); then \(du=\dfrac{dx}{2\sqrt x}\).'
    explanation: 'Differentiating \(2 \ln{\left(\sqrt{x} + 1 \right)}\) gives \(\frac{1}{\sqrt{x} \left(\sqrt{x} + 1\right)}\).'
  8:
    topic: s8-1
    question: 'Find \(\displaystyle\int \frac{1}{- \sqrt{x} + x}\,dx\).'
    A: '\(2 \ln{\left(\sqrt{x} \right)}+C\)'
    B: '\(\ln{\left(\left|{\sqrt{x} - x}\right| \right)}+C\)'
    C: '\(2 \ln{\left(\left|{\sqrt{x} - 1}\right| \right)}+C\)'
    D: '\(\ln{\left(\left|{\sqrt{x} - 1}\right| \right)}+C\)'
    answer: C
    hint: 'Let \(u=\sqrt x\), so \(x=u^2\) and \(dx=2u\,du\).'
    explanation: 'Differentiating \(2 \ln{\left(\left|{\sqrt{x} - 1}\right| \right)}\) gives \(\frac{1}{- \sqrt{x} + x}\).'
  9:
    topic: s8-1
    question: 'Find \(\displaystyle\int\cot(3-7x)\,dx\).'
    A: '\(- \frac{\ln{\left(\left|{\sin{\left(7 x - 3 \right)}}\right| \right)}}{7}+C\)'
    B: '\(- \ln{\left(\left|{\sin{\left(7 x - 3 \right)}}\right| \right)}+C\)'
    C: '\(\frac{\ln{\left(\left|{\sin{\left(7 x - 3 \right)}}\right| \right)}}{7}+C\)'
    D: '\(- \frac{\ln{\left(\left|{\cos{\left(7 x - 3 \right)}}\right| \right)}}{7}+C\)'
    answer: A
    hint: 'Write \(\cot u=\dfrac{\cos u}{\sin u}\) with \(u=3-7x\), so \(du=-7\,dx\).'
    explanation: 'Differentiating \(- \frac{\ln{\left(\left|{\sin{\left(7 x - 3 \right)}}\right| \right)}}{7}\) gives \(- \cot{\left(7 x - 3 \right)}\).'
  10:
    topic: s8-1
    question: 'Find \(\displaystyle\int\csc(\pi x-1)\,dx\).'
    A: '\(\frac{\ln{\left(\left|{\sin{\left(\pi x - 1 \right)}}\right| \right)}}{\pi}+C\)'
    B: '\(\frac{\ln{\left(\left|{\cot{\left(\pi x - 1 \right)} + \csc{\left(\pi x - 1 \right)}}\right| \right)}}{\pi}+C\)'
    C: '\(- \ln{\left(\left|{\cot{\left(\pi x - 1 \right)} + \csc{\left(\pi x - 1 \right)}}\right| \right)}+C\)'
    D: '\(- \frac{\ln{\left(\left|{\cot{\left(\pi x - 1 \right)} + \csc{\left(\pi x - 1 \right)}}\right| \right)}}{\pi}+C\)'
    answer: D
    hint: '\(\int\csc u\,du=-\ln|\csc u+\cot u|+C\); here \(u=\pi x-1\).'
    explanation: 'Differentiating \(- \frac{\ln{\left(\left|{\cot{\left(\pi x - 1 \right)} + \csc{\left(\pi x - 1 \right)}}\right| \right)}}{\pi}\) gives \(\csc{\left(\pi x - 1 \right)}\).'
  11:
    topic: s8-1
    question: 'Find \(\displaystyle\int e^{\theta}\csc\left(e^{\theta}+1\right)d\theta\).'
    A: '\(- \ln{\left(\left|{\sin{\left(e^{\theta} + 1 \right)}}\right| \right)}+C\)'
    B: '\(\ln{\left(\left|{\cot{\left(e^{\theta} + 1 \right)} + \csc{\left(e^{\theta} + 1 \right)}}\right| \right)}+C\)'
    C: '\(\ln{\left(\left|{\sin{\left(e^{\theta} + 1 \right)}}\right| \right)}+C\)'
    D: '\(- \ln{\left(\left|{\cot{\left(e^{\theta} + 1 \right)} + \csc{\left(e^{\theta} + 1 \right)}}\right| \right)}+C\)'
    answer: D
    hint: 'Let \(u=e^\theta+1\); then use \(\int\csc u\,du\).'
    explanation: 'Differentiating \(- \ln{\left(\left|{\cot{\left(e^{\theta} + 1 \right)} + \csc{\left(e^{\theta} + 1 \right)}}\right| \right)}\) gives \(e^{\theta} \csc{\left(e^{\theta} + 1 \right)}\).'
  12:
    topic: s8-1
    question: 'Find \(\displaystyle\int\sec\dfrac t3\,dt\).'
    A: '\(\ln{\left(\left|{\tan{\left(\frac{t}{3} \right)} + \sec{\left(\frac{t}{3} \right)}}\right| \right)}+C\)'
    B: '\(\frac{\ln{\left(\left|{\tan{\left(\frac{t}{3} \right)} + \sec{\left(\frac{t}{3} \right)}}\right| \right)}}{3}+C\)'
    C: '\(3 \ln{\left(\left|{\tan{\left(\frac{t}{3} \right)} + \sec{\left(\frac{t}{3} \right)}}\right| \right)}+C\)'
    D: '\(3 \tan{\left(\frac{t}{3} \right)}+C\)'
    answer: C
    hint: 'Let \(u=t/3\), so \(dt=3\,du\), then \(\int\sec u\,du=\ln|\sec u+\tan u|\).'
    explanation: 'Differentiating \(3 \ln{\left(\left|{\tan{\left(\frac{t}{3} \right)} + \sec{\left(\frac{t}{3} \right)}}\right| \right)}\) gives \(\sec{\left(\frac{t}{3} \right)}\).'
  13:
    topic: s8-1
    question: 'Find \(\displaystyle\int x\sec\left(x^2-5\right)dx\).'
    A: '\(\ln{\left(\left|{\tan{\left(x^{2} - 5 \right)} + \sec{\left(x^{2} - 5 \right)}}\right| \right)}+C\)'
    B: '\(\frac{\tan{\left(x^{2} - 5 \right)}}{2}+C\)'
    C: '\(\frac{\ln{\left(\left|{\tan{\left(x^{2} - 5 \right)} + \sec{\left(x^{2} - 5 \right)}}\right| \right)}}{2}+C\)'
    D: '\(2 \ln{\left(\left|{\tan{\left(x^{2} - 5 \right)} + \sec{\left(x^{2} - 5 \right)}}\right| \right)}+C\)'
    answer: C
    hint: 'Let \(u=x^2-5\), so \(x\,dx=\tfrac12du\).'
    explanation: 'Differentiating \(\frac{\ln{\left(\left|{\tan{\left(x^{2} - 5 \right)} + \sec{\left(x^{2} - 5 \right)}}\right| \right)}}{2}\) gives \(x \sec{\left(x^{2} - 5 \right)}\).'
  14:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac1{\theta^2}\csc\dfrac1\theta\,d\theta\).'
    A: '\(- \ln{\left(\left|{\cot{\left(\frac{1}{\theta} \right)} + \csc{\left(\frac{1}{\theta} \right)}}\right| \right)}+C\)'
    B: '\(\ln{\left(\left|{\cot{\left(\frac{1}{\theta} \right)} + \csc{\left(\frac{1}{\theta} \right)}}\right| \right)}+C\)'
    C: '\(\frac{\ln{\left(\left|{\cot{\left(\frac{1}{\theta} \right)} + \csc{\left(\frac{1}{\theta} \right)}}\right| \right)}}{\theta}+C\)'
    D: '\(\ln{\left(\left|{\sin{\left(\frac{1}{\theta} \right)}}\right| \right)}+C\)'
    answer: B
    hint: 'Let \(u=1/\theta\); then \(du=-d\theta/\theta^2\).'
    explanation: 'Differentiating \(\ln{\left(\left|{\cot{\left(\frac{1}{\theta} \right)} + \csc{\left(\frac{1}{\theta} \right)}}\right| \right)}\) gives \(\frac{\csc{\left(\frac{1}{\theta} \right)}}{\theta^{2}}\).'
  15:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_0^{\sqrt{\ln2}}2xe^{x^2}\,dx\).'
    A: '\(-1 + e\)'
    B: '\(1\)'
    C: '\(\ln{\left(2 \right)}\)'
    D: '\(2\)'
    answer: B
    hint: 'Let \(u=x^2\).'
    explanation: '\(e^{x^2}\Big|_0^{\sqrt{\ln2}}=e^{\ln2}-1=1\).'
  16:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_{\pi/2}^{\pi}(\sin y)e^{\cos y}\,dy\).'
    A: '\(-1 + e\)'
    B: '\(1 - \frac{1}{2 e}\)'
    C: '\(-1 + e^{-1}\)'
    D: '\(1 - e^{-1}\)'
    answer: D
    hint: 'Let \(u=\cos y\), so \(du=-\sin y\,dy\).'
    explanation: '\(-e^{\cos y}\Big|_{\pi/2}^{\pi}=-e^{-1}+e^0=1-\tfrac1e\).'
  17:
    topic: s8-1
    question: 'Find \(\displaystyle\int e^{\tan{\left(v \right)}} \sec^{2}{\left(v \right)}\,dv\).'
    A: '\(e^{\tan{\left(v \right)}}+C\)'
    B: '\(- e^{\tan{\left(v \right)}}+C\)'
    C: '\(\frac{e^{\tan{\left(v \right)}}}{2}+C\)'
    D: '\(2 e^{\tan{\left(v \right)}}+C\)'
    answer: A
    hint: 'Let \(u=\tan v\).'
    explanation: 'Differentiating \(e^{\tan{\left(v \right)}}\) gives \(e^{\tan{\left(v \right)}} \sec^{2}{\left(v \right)}\).'
  18:
    topic: s8-1
    question: 'Find \(\displaystyle\int \frac{e^{\sqrt{t}}}{\sqrt{t}}\,dt\).'
    A: '\(2 e^{\sqrt{t}}+C\)'
    B: '\(e^{\sqrt{t}}+C\)'
    C: '\(4 e^{\sqrt{t}}+C\)'
    D: '\(- 2 e^{\sqrt{t}}+C\)'
    answer: A
    hint: 'Let \(u=\sqrt t\); then \(du=\dfrac{dt}{2\sqrt t}\).'
    explanation: 'Differentiating \(2 e^{\sqrt{t}}\) gives \(\frac{e^{\sqrt{t}}}{\sqrt{t}}\).'
  19:
    topic: s8-1
    question: 'Find \(\displaystyle\int3^{x+1}\,dx\).'
    A: '\(3^{x + 1}+C\)'
    B: '\(3^{x + 1} \ln{\left(3 \right)}+C\)'
    C: '\(\frac{3^{x + 1}}{\ln{\left(3 \right)}}+C\)'
    D: '\(\frac{3^{x + 2}}{x + 2}+C\)'
    answer: C
    hint: '\(\int a^udu=\dfrac{a^u}{\ln a}+C\).'
    explanation: 'Differentiating \(\frac{3^{x + 1}}{\ln{\left(3 \right)}}\) gives \(3^{x + 1}\).'
  20:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{2^{\ln x}}{x}\,dx\).'
    A: '\(2^{\ln{\left(x \right)}} \ln{\left(x \right)}+C\)'
    B: '\(2^{\ln{\left(x \right)}}+C\)'
    C: '\(2^{\ln{\left(x \right)}} \ln{\left(2 \right)}+C\)'
    D: '\(\frac{2^{\ln{\left(x \right)}}}{\ln{\left(2 \right)}}+C\)'
    answer: D
    hint: 'Let \(u=\ln x\).'
    explanation: 'Differentiating \(\frac{2^{\ln{\left(x \right)}}}{\ln{\left(2 \right)}}\) gives \(\frac{2^{\ln{\left(x \right)}}}{x}\).'
  21:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{2^{\sqrt w}}{2\sqrt w}\,dw\).'
    A: '\(\frac{2^{\sqrt{w}}}{\ln{\left(2 \right)}}+C\)'
    B: '\(\frac{2^{\sqrt{w}}}{2 \ln{\left(2 \right)}}+C\)'
    C: '\(\frac{2 \cdot 2^{\sqrt{w}}}{\ln{\left(2 \right)}}+C\)'
    D: '\(2^{\sqrt{w}}+C\)'
    answer: A
    hint: 'Let \(u=\sqrt w\), so \(du=\dfrac{dw}{2\sqrt w}\).'
    explanation: 'Differentiating \(\frac{2^{\sqrt{w}}}{\ln{\left(2 \right)}}\) gives \(\frac{2^{\sqrt{w}}}{2 \sqrt{w}}\).'
  22:
    topic: s8-1
    question: 'Find \(\displaystyle\int10^{2\theta}\,d\theta\).'
    A: '\(\frac{2 \cdot 10^{2 \theta}}{\ln{\left(10 \right)}}+C\)'
    B: '\(\frac{10^{2 \theta}}{2 \ln{\left(10 \right)}}+C\)'
    C: '\(2 \cdot 10^{2 \theta} \ln{\left(10 \right)}+C\)'
    D: '\(\frac{10^{2 \theta}}{\ln{\left(10 \right)}}+C\)'
    answer: B
    hint: 'Let \(u=2\theta\).'
    explanation: 'Differentiating \(\frac{10^{2 \theta}}{2 \ln{\left(10 \right)}}\) gives \(10^{2 \theta}\).'
  23:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{9\,du}{1+9u^2}\).'
    A: '\(3 \tan^{-1}{\left(3 u \right)}+C\)'
    B: '\(\tan^{-1}{\left(3 u \right)}+C\)'
    C: '\(3 \tan^{-1}{\left(u \right)}+C\)'
    D: '\(9 \tan^{-1}{\left(3 u \right)}+C\)'
    answer: A
    hint: 'Let \(w=3u\); then \(\int\dfrac{dw}{1+w^2}=\tan^{-1}w\).'
    explanation: 'Differentiating \(3 \tan^{-1}{\left(3 u \right)}\) gives \(\frac{9}{9 u^{2} + 1}\).'
  24:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{4\,dx}{1+(2x+1)^2}\).'
    A: '\(4 \tan^{-1}{\left(2 x + 1 \right)}+C\)'
    B: '\(2 \tan^{-1}{\left(x \right)}+C\)'
    C: '\(\tan^{-1}{\left(2 x + 1 \right)}+C\)'
    D: '\(2 \tan^{-1}{\left(2 x + 1 \right)}+C\)'
    answer: D
    hint: 'Let \(u=2x+1\), so \(dx=\tfrac12du\).'
    explanation: 'Differentiating \(2 \tan^{-1}{\left(2 x + 1 \right)}\) gives \(\frac{4}{\left(2 x + 1\right)^{2} + 1}\).'
  25:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_0^{1/6}\dfrac{dx}{\sqrt{1-9x^2}}\).'
    A: '\(\frac{\pi}{6}\)'
    B: '\(\frac{\pi}{54}\)'
    C: '\(\frac{\pi}{18}\)'
    D: '\(\frac{\pi}{3}\)'
    answer: C
    hint: 'Let \(u=3x\); then \(\int\dfrac{du}{\sqrt{1-u^2}}=\sin^{-1}u\).'
    explanation: '\(\tfrac13\sin^{-1}(3x)\Big|_0^{1/6}=\tfrac13\sin^{-1}\tfrac12=\dfrac\pi{18}\).'
  26:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_0^1\dfrac{dt}{\sqrt{4-t^2}}\).'
    A: '\(\frac{\pi}{2}\)'
    B: '\(\frac{\pi}{6}\)'
    C: '\(\frac{\pi}{3}\)'
    D: '\(\frac{\pi}{4}\)'
    answer: B
    hint: '\(\int\dfrac{dt}{\sqrt{a^2-t^2}}=\sin^{-1}\dfrac ta\).'
    explanation: '\(\sin^{-1}\tfrac12=\dfrac\pi6\).'
  27:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{2s\,ds}{\sqrt{1-s^4}}\) (for \(|s|<1\)).'
    A: '\(s + \cos^{-1}{\left(s^{2} \right)}+C\)'
    B: '\(\sin^{-1}{\left(s \right)}+C\)'
    C: '\(\sin^{-1}{\left(s^{2} \right)}+C\)'
    D: '\(2 \sin^{-1}{\left(s^{2} \right)}+C\)'
    answer: C
    hint: 'Let \(u=s^2\), so \(du=2s\,ds\).'
    explanation: 'Differentiating \(\sin^{-1}{\left(s^{2} \right)}\) gives \(\frac{2 s}{\sqrt{1 - s^{4}}}\).'
  28:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{2\,dx}{x\sqrt{1-4\ln^2x}}\) (for \(0<2|\ln x|<1\)).'
    A: '\(\sin^{-1}{\left(2 \ln{\left(x \right)} \right)}+C\)'
    B: '\(\cos^{-1}{\left(2 \ln{\left(x \right)} \right)}+C\)'
    C: '\(2 \sin^{-1}{\left(2 \ln{\left(x \right)} \right)}+C\)'
    D: '\(\sin^{-1}{\left(\ln{\left(x \right)} \right)}+C\)'
    answer: A
    hint: 'Let \(u=2\ln x\), so \(du=\dfrac{2\,dx}x\).'
    explanation: 'Differentiating \(\sin^{-1}{\left(2 \ln{\left(x \right)} \right)}\) gives \(\frac{2}{x \sqrt{1 - 4 \ln{\left(x \right)}^{2}}}\).'
  29:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{dx}{e^x+e^{-x}}\).'
    A: '\(2 \tan^{-1}{\left(e^{x} \right)}+C\)'
    B: '\(\frac{\tan^{-1}{\left(e^{x} \right)}}{2}+C\)'
    C: '\(\tan^{-1}{\left(e^{x} \right)}+C\)'
    D: '\(\ln{\left(e^{x} + e^{- x} \right)}+C\)'
    answer: C
    hint: 'Multiply top and bottom by \(e^x\): \(\dfrac{e^x}{e^{2x}+1}\); let \(u=e^x\).'
    explanation: 'Differentiating \(\tan^{-1}{\left(e^{x} \right)}\) gives \(\frac{1}{e^{x} + e^{- x}}\).'
  30:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_1^{e^{\pi/3}}\dfrac{dx}{x\cos(\ln x)}\).'
    A: '\(\ln{\left(2 \right)}\)'
    B: '\(\ln{\left(\sqrt{3} \right)}\)'
    C: '\(\ln{\left(1 + \sqrt{2} \right)}\)'
    D: '\(\ln{\left(\sqrt{3} + 2 \right)}\)'
    answer: D
    hint: 'Let \(u=\ln x\); then \(\int\sec u\,du=\ln|\sec u+\tan u|\).'
    explanation: '\(\ln\left(\sec\tfrac\pi3+\tan\tfrac\pi3\right)=\ln(2+\sqrt3)\).'
  31:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_1^2\dfrac{8\,dx}{x^2-2x+2}\).'
    A: '\(\pi\)'
    B: '\(8 \pi\)'
    C: '\(2 \pi\)'
    D: '\(4 \pi\)'
    answer: C
    hint: 'Complete the square: \(x^2-2x+2=(x-1)^2+1\).'
    explanation: '\(8\tan^{-1}(x-1)\Big|_1^2=8\cdot\tfrac\pi4=2\pi\).'
  32:
    topic: s8-1
    question: 'Evaluate \(\displaystyle\int_2^4\dfrac{2\,dx}{x^2-6x+10}\).'
    A: '\(2 \pi\)'
    B: '\(\frac{\pi}{2}\)'
    C: '\(\frac{\pi}{4}\)'
    D: '\(\pi\)'
    answer: D
    hint: '\(x^2-6x+10=(x-3)^2+1\).'
    explanation: '\(2\tan^{-1}(x-3)\Big|_2^4=2\left(\tfrac\pi4+\tfrac\pi4\right)=\pi\).'
  33:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{dt}{\sqrt{-t^2+4t-3}}\) (on \(1<t<3\)).'
    A: '\(\sin^{-1}{\left(t \right)}+C\)'
    B: '\(\frac{\sin^{-1}{\left(t - 2 \right)}}{2}+C\)'
    C: '\(\sin^{-1}{\left(t - 2 \right)}+C\)'
    D: '\(2 \sin^{-1}{\left(t - 2 \right)}+C\)'
    answer: C
    hint: '\(-t^2+4t-3=1-(t-2)^2\).'
    explanation: 'Differentiating \(\sin^{-1}{\left(t - 2 \right)}\) gives \(\frac{1}{\sqrt{- t^{2} + 4 t - 3}}\).'
  34:
    topic: s8-1
    question: 'Find \(\displaystyle\int\dfrac{d\theta}{\sqrt{2\theta-\theta^2}}\) (on \(0<\theta<2\)).'
    A: '\(\frac{\sin^{-1}{\left(\theta - 1 \right)}}{2}+C\)'
    B: '\(\theta + \sin^{-1}{\left(\theta - 1 \right)}+C\)'
    C: '\(\sin^{-1}{\left(\theta - 1 \right)}+C\)'
