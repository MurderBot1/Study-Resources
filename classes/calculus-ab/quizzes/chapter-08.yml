    B: '\(\frac{2}{3}\)'
    C: '\(\frac{4}{3}\)'
    D: '\(- \frac{4}{3}\)'
    answer: C
    hint: 'Odd power of cosine: save one \(\cos x\).'
    explanation: 'An antiderivative is \(- \frac{\sin^{3}{\left(x \right)}}{3} + \sin{\left(x \right)}\); then \(F(\frac{\pi}{2})-F(- \frac{\pi}{2})=\frac{4}{3}\).'
  177:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\frac{\pi}{6}} 3 \cos^{5}{\left(3 x \right)}\,dx\).'
    A: '\(\frac{16}{15}\)'
    B: '\(\frac{8}{15}\)'
    C: '\(\frac{4}{15}\)'
    D: '\(- \frac{8}{15}\)'
    answer: B
    hint: 'Let \(u=3x\); then \(\cos^5u=\cos u(1-\sin^2u)^2\).'
    explanation: 'An antiderivative is \(\frac{\sin^{5}{\left(3 x \right)}}{5} - \frac{2 \sin^{3}{\left(3 x \right)}}{3} + \sin{\left(3 x \right)}\); then \(F(\frac{\pi}{6})-F(0)=\frac{8}{15}\).'
  178:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\frac{\pi}{2}} \sin^{7}{\left(y \right)}\,dy\).'
