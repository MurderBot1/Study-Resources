  70:
    topic: s8-1
    question: 'Find \(\displaystyle\int\cos^3\theta\,d\theta\).'
    A: '\(- \frac{\sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}+C\)'
    B: '\(\frac{\sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}+C\)'
    C: '\(\frac{\cos^{4}{\left(\theta \right)}}{4}+C\)'
    D: '\(- \sin^{3}{\left(\theta \right)} + \sin{\left(\theta \right)}+C\)'
    answer: A
    hint: 'Write \(\cos^3\theta=\cos\theta(1-\sin^2\theta)\) and let \(u=\sin\theta\).'
    explanation: 'Differentiating \(- \frac{\sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}\) gives \(\cos^{3}{\left(\theta \right)}\).'
  71:
    topic: s8-1
    question: 'Find \(\displaystyle\int\cos^5\theta\,d\theta\).'
    A: '\(\frac{\sin^{5}{\left(\theta \right)}}{5} - \frac{2 \sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}+C\)'
    B: '\(\frac{\sin^{5}{\left(\theta \right)}}{5} - \frac{\sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}+C\)'
    C: '\(- \frac{\sin^{5}{\left(\theta \right)}}{5} - \frac{2 \sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}+C\)'
    D: '\(\frac{\sin^{5}{\left(\theta \right)}}{5} + \frac{2 \sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}+C\)'
    answer: A
    hint: '\(\cos^5\theta=\cos\theta(1-\sin^2\theta)^2\).'
    explanation: 'Differentiating \(\frac{\sin^{5}{\left(\theta \right)}}{5} - \frac{2 \sin^{3}{\left(\theta \right)}}{3} + \sin{\left(\theta \right)}\) gives \(\cos^{5}{\left(\theta \right)}\).'
  72:
    topic: s8-1
    question: 'Find \(\displaystyle\int\sin^3\theta\,d\theta\).'
