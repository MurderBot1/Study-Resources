  155:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{2 \theta^{3} + 5 \theta^{2} + 8 \theta + 4}{\left(\theta^{2} + 2 \theta + 2\right)^{2}}\,d\theta\).'
    A: '\(\ln{\left(\left|{\theta^{2} + 2 \theta + 2}\right| \right)} - \tan^{-1}{\left(\theta + 1 \right)}+C\)'
    B: '\(\ln{\left(\left|{\theta^{2} + 2 \theta + 2}\right| \right)} - \tan^{-1}{\left(\theta + 1 \right)} - \frac{2}{\theta^{2} + 2 \theta + 2}+C\)'
    C: '\(\ln{\left(\left|{\theta^{2} + 2 \theta + 2}\right| \right)} - \tan^{-1}{\left(\theta + 1 \right)} + \frac{1}{\theta^{2} + 2 \theta + 2}+C\)'
    D: '\(\ln{\left(\left|{\theta^{2} + 2 \theta + 2}\right| \right)} - \tan^{-1}{\left(\theta + 1 \right)} - \frac{1}{\theta^{2} + 2 \theta + 2}+C\)'
    answer: D
    hint: 'Use \(\dfrac{A\theta+B}{\theta^2+2\theta+2}+\dfrac{C\theta+D}{(\theta^2+2\theta+2)^2}\).'
    explanation: 'Differentiating \(\ln{\left(\left|{\theta^{2} + 2 \theta + 2}\right| \right)} - \tan^{-1}{\left(\theta + 1 \right)} - \frac{1}{\theta^{2} + 2 \theta + 2}\) gives \(\frac{2 \theta^{3} + 5 \theta^{2} + 8 \theta + 4}{\left(\theta^{2} + 2 \theta + 2\right)^{2}}\).'
  156:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{2 x^{3} - 2 x^{2} + 1}{x^{2} - x}\,dx\).'
    A: '\(- x^{2} - \ln{\left(\left|{x}\right| \right)} + \ln{\left(\left|{x - 1}\right| \right)}+C\)'
    B: '\(2 x^{2} - \ln{\left(\left|{x}\right| \right)} + \ln{\left(\left|{x - 1}\right| \right)}+C\)'
    C: '\(- \ln{\left(\left|{x}\right| \right)} + \ln{\left(\left|{x - 1}\right| \right)}+C\)'
    D: '\(x^{2} - \ln{\left(\left|{x}\right| \right)} + \ln{\left(\left|{x - 1}\right| \right)}+C\)'
    answer: D
    hint: 'Divide first, then use \(\dfrac{A}{x}+\dfrac B{x-1}\).'
    explanation: 'Differentiating \(x^{2} - \ln{\left(\left|{x}\right| \right)} + \ln{\left(\left|{x - 1}\right| \right)}\) gives \(\frac{2 x^{3} - 2 x^{2} + 1}{x^{2} - x}\).'
  157:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{x^{4}}{x^{2} - 1}\,dx\).'
    A: '\(\frac{x^{3}}{3} + x + \frac{\ln{\left(\left|{x - 1}\right| \right)}}{2} - \frac{\ln{\left(\left|{x + 1}\right| \right)}}{2}+C\)'
    B: '\(\frac{x^{3}}{3} + \frac{\ln{\left(\left|{x - 1}\right| \right)}}{2} - \frac{\ln{\left(\left|{x + 1}\right| \right)}}{2}+C\)'
    C: '\(\frac{x^{3}}{3} + 2 x + \frac{\ln{\left(\left|{x - 1}\right| \right)}}{2} - \frac{\ln{\left(\left|{x + 1}\right| \right)}}{2}+C\)'
    D: '\(\frac{x^{3}}{3} - x + \frac{\ln{\left(\left|{x - 1}\right| \right)}}{2} - \frac{\ln{\left(\left|{x + 1}\right| \right)}}{2}+C\)'
    answer: A
    hint: 'Divide: \(\dfrac{x^4}{x^2-1}=x^2+1+\dfrac1{x^2-1}\).'
    explanation: 'Differentiating \(\frac{x^{3}}{3} + x + \frac{\ln{\left(\left|{x - 1}\right| \right)}}{2} - \frac{\ln{\left(\left|{x + 1}\right| \right)}}{2}\) gives \(\frac{x^{4}}{x^{2} - 1}\).'
  158:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{9 x^{3} - 3 x + 1}{x^{3} - x^{2}}\,dx\).'
    A: '\(9 x + 2 \ln{\left(\left|{x}\right| \right)} + 7 \ln{\left(\left|{x - 1}\right| \right)}+C\)'
    B: '\(9 x + 2 \ln{\left(\left|{x}\right| \right)} + 7 \ln{\left(\left|{x - 1}\right| \right)} + \frac{2}{x}+C\)'
    C: '\(9 x + 2 \ln{\left(\left|{x}\right| \right)} + 7 \ln{\left(\left|{x - 1}\right| \right)} - \frac{1}{x}+C\)'
    D: '\(9 x + 2 \ln{\left(\left|{x}\right| \right)} + 7 \ln{\left(\left|{x - 1}\right| \right)} + \frac{1}{x}+C\)'
    answer: D
    hint: 'Divide first, then \(x^3-x^2=x^2(x-1)\).'
    explanation: 'Differentiating \(9 x + 2 \ln{\left(\left|{x}\right| \right)} + 7 \ln{\left(\left|{x - 1}\right| \right)} + \frac{1}{x}\) gives \(\frac{9 x^{3} - 3 x + 1}{x^{3} - x^{2}}\).'
  159:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{y^{4} + y^{2} - 1}{y^{3} + y}\,dy\).'
    A: '\(\frac{\ln{\left(y^{2} + 1 \right)}}{2} - \ln{\left(\left|{y}\right| \right)}+C\)'
    B: '\(- \frac{y^{2}}{2} + \frac{\ln{\left(y^{2} + 1 \right)}}{2} - \ln{\left(\left|{y}\right| \right)}+C\)'
    C: '\(y^{2} + \frac{\ln{\left(y^{2} + 1 \right)}}{2} - \ln{\left(\left|{y}\right| \right)}+C\)'
    D: '\(\frac{y^{2}}{2} + \frac{\ln{\left(y^{2} + 1 \right)}}{2} - \ln{\left(\left|{y}\right| \right)}+C\)'
    answer: D
    hint: 'Divide first; \(y^3+y=y(y^2+1)\).'
    explanation: 'Differentiating \(\frac{y^{2}}{2} + \frac{\ln{\left(y^{2} + 1 \right)}}{2} - \ln{\left(\left|{y}\right| \right)}\) gives \(\frac{y^{4} + y^{2} - 1}{y^{3} + y}\).'
  160:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{e^{t}}{e^{2 t} + 3 e^{t} + 2}\,dt\).'
    A: '\(\ln{\left(e^{t} + 1 \right)} + \ln{\left(e^{t} + 2 \right)}+C\)'
    B: '\(\ln{\left(e^{t} + 1 \right)} - \ln{\left(e^{t} + 2 \right)}+C\)'
    C: '\(\ln{\left(e^{t} + 1 \right)}+C\)'
    D: '\(\ln{\left(e^{t} + 1 \right)} - 2 \ln{\left(e^{t} + 2 \right)}+C\)'
    answer: B
    hint: 'Let \(u=e^t\), so \(e^t\,dt=du\), and \(u^2+3u+2=(u+1)(u+2)\).'
    explanation: 'Differentiating \(\ln{\left(e^{t} + 1 \right)} - \ln{\left(e^{t} + 2 \right)}\) gives \(\frac{e^{t}}{e^{2 t} + 3 e^{t} + 2}\).'
  161:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{\cos{\left(y \right)}}{\sin^{2}{\left(y \right)} + \sin{\left(y \right)} - 6}\,dy\).'
    A: '\(\frac{\ln{\left(\left|{\sin{\left(y \right)} - 2}\right| \right)}}{5} - \frac{2 \ln{\left(\left|{\sin{\left(y \right)} + 3}\right| \right)}}{5}+C\)'
    B: '\(\frac{\ln{\left(\left|{\sin{\left(y \right)} - 2}\right| \right)}}{5} - \frac{\ln{\left(\left|{\sin{\left(y \right)} + 3}\right| \right)}}{5}+C\)'
    C: '\(\frac{\ln{\left(\left|{\sin{\left(y \right)} - 2}\right| \right)}}{5} + \frac{\ln{\left(\left|{\sin{\left(y \right)} + 3}\right| \right)}}{5}+C\)'
    D: '\(\frac{\ln{\left(\left|{\sin{\left(y \right)} - 2}\right| \right)}}{5}+C\)'
    answer: B
    hint: 'Let \(u=\sin y\); \(u^2+u-6=(u+3)(u-2)\).'
    explanation: 'Differentiating \(\frac{\ln{\left(\left|{\sin{\left(y \right)} - 2}\right| \right)}}{5} - \frac{\ln{\left(\left|{\sin{\left(y \right)} + 3}\right| \right)}}{5}\) gives \(\frac{\cos{\left(y \right)}}{\sin^{2}{\left(y \right)} + \sin{\left(y \right)} - 6}\).'
  162:
    topic: s8-3
    question: 'Find \(\displaystyle\int \frac{\sin{\left(\theta \right)}}{\cos^{2}{\left(\theta \right)} + \cos{\left(\theta \right)} - 2}\,d\theta\).'
    A: '\(\frac{\ln{\left(\left|{\cos{\left(\theta \right)} + 2}\right| \right)}}{3}+C\)'
    B: '\(- \frac{2 \ln{\left(\left|{\cos{\left(\theta \right)} - 1}\right| \right)}}{3} + \frac{\ln{\left(\left|{\cos{\left(\theta \right)} + 2}\right| \right)}}{3}+C\)'
    C: '\(\frac{\ln{\left(\left|{\cos{\left(\theta \right)} - 1}\right| \right)}}{3} + \frac{\ln{\left(\left|{\cos{\left(\theta \right)} + 2}\right| \right)}}{3}+C\)'
    D: '\(- \frac{\ln{\left(\left|{\cos{\left(\theta \right)} - 1}\right| \right)}}{3} + \frac{\ln{\left(\left|{\cos{\left(\theta \right)} + 2}\right| \right)}}{3}+C\)'
    answer: D
    hint: 'Let \(u=\cos\theta\), so \(\sin\theta\,d\theta=-du\); \(u^2+u-2=(u+2)(u-1)\).'
    explanation: 'Differentiating \(- \frac{\ln{\left(\left|{\cos{\left(\theta \right)} - 1}\right| \right)}}{3} + \frac{\ln{\left(\left|{\cos{\left(\theta \right)} + 2}\right| \right)}}{3}\) gives \(\frac{\sin{\left(\theta \right)}}{\cos^{2}{\left(\theta \right)} + \cos{\left(\theta \right)} - 2}\).'
  163:
    topic: s8-3
    question: 'Solve \(\left(t^2-3t+2\right)\dfrac{dx}{dt}=1\) for \(t>2\), \(x(3)=0\).'
    A: '\(x=\ln\dfrac{2(t-1)}{t-2}\)'
    B: '\(x=\ln\dfrac{2(t-2)}{t-1}\)'
    C: '\(x=\ln\dfrac{t-2}{t-1}\)'
    D: '\(x=\ln\dfrac{t-2}{2(t-1)}\)'
    answer: B
    hint: '\(\dfrac{1}{(t-1)(t-2)}=\dfrac1{t-2}-\dfrac1{t-1}\).'
    explanation: '\(x=\ln\dfrac{t-2}{t-1}+C\), and \(x(3)=\ln\tfrac12+C=0\) gives \(C=\ln2\).'
  164:
    topic: s8-3
    question: 'Solve \(\left(t^2+2t\right)\dfrac{dx}{dt}=2x+2\) for \(t,x>0\), \(x(1)=1\).'
    A: '\(x=\dfrac{t+1}{t+2}\)'
    B: '\(x=\dfrac{2t-1}{t+2}\)'
    C: '\(x=\dfrac{5t-2}{t+2}\)'
    D: '\(x=\dfrac{5t+2}{t+2}\)'
    answer: C
    hint: 'Separate: \(\dfrac{dx}{x+1}=\dfrac{2\,dt}{t(t+2)}=\left(\dfrac1t-\dfrac1{t+2}\right)dt\).'
    explanation: '\(\ln(x+1)=\ln\dfrac t{t+2}+C\); \(x(1)=1\) gives \(\ln2=\ln\tfrac13+C\), so \(x+1=\dfrac{6t}{t+2}\).'
  165:
    topic: s8-3
    question: 'Solve \((t+1)\dfrac{dx}{dt}=x^2+1\) for \(t>-1\), \(x(0)=0\).'
    A: '\(x=\tan(\ln(t+1))\)'
    B: '\(x=\dfrac{\ln(t+1)}{t+1}\)'
    C: '\(x=\tan(t+1)\)'
    D: '\(x=\ln(\tan(t+1))\)'
    answer: A
    hint: 'Separate: \(\dfrac{dx}{x^2+1}=\dfrac{dt}{t+1}\).'
    explanation: '\(\tan^{-1}x=\ln(t+1)+C\), and \(x(0)=0\) gives \(C=0\).'
  166:
    topic: s8-3
    question: 'The region under \(y=\dfrac3{\sqrt{3x-x^2}}\) for \(\tfrac12\le x\le\tfrac52\) is revolved about the \(x\)-axis. The volume is'
    A: '\(3 \pi \ln{\left(5 \right)}\)'
    B: '\(6 \pi \ln{\left(5 \right)}\)'
    C: '\(6 \ln{\left(5 \right)}\)'
    D: '\(6 \pi \ln{\left(2 \right)}\)'
    answer: B
    hint: 'Disks: \(V=\pi\int\dfrac9{x(3-x)}dx\); use partial fractions.'
    explanation: '\(\dfrac9{x(3-x)}=3\left(\dfrac1x+\dfrac1{3-x}\right)\), so \(V=3\pi\left[\ln\dfrac x{3-x}\right]_{1/2}^{5/2}=3\pi(2\ln5)\).'
  167:
    topic: s8-3
    question: 'The region under \(y=\dfrac{2}{(x+1)(2-x)}\), \(0\le x\le1\), is revolved about the \(y\)-axis. The volume (to two decimals) is'
    A: '\(5.81\)'
    B: '\(1.45\)'
    C: '\(2.9\)'
    D: '\(4.36\)'
    answer: C
    hint: 'Shells: \(V=2\pi\int_0^1x\cdot\dfrac2{(x+1)(2-x)}dx\); use partial fractions.'
    explanation: '\(\dfrac{x}{(x+1)(2-x)}=-\dfrac13\cdot\dfrac1{x+1}+\dfrac23\cdot\dfrac1{2-x}\), then integrate from \(0\) to \(1\): \(V=\dfrac{4\pi\ln2}{3}\).'
  168:
    topic: s8-3
    question: 'A rumor spreads with \(\dfrac{dx}{dt}=kx(N-x)\), \(k=\dfrac1{250}\), \(N=1000\), \(x(0)=2\). The number of people who know the rumor after \(t\) days is \(x=\dfrac{1000}{1+499e^{-4t}}\). Half the population (500 people) has heard it after about how many days?'
    A: '\(0.78\text{ days}\)'
    B: '\(6.21\text{ days}\)'
    C: '\(1.55\text{ days}\)'
    D: '\(3.11\text{ days}\)'
    answer: C
    hint: 'Set \(x=500\) and solve for \(t\).'
    explanation: '\(1+499e^{-4t}=2\) gives \(e^{-4t}=\tfrac1{499}\), so \(t=\dfrac{\ln499}{4}\approx1.55\) days.'
  169:
    topic: s8-3
    question: 'In the second-order reaction \(\dfrac{dx}{dt}=k(a-x)^2\) (case \(a=b\)) with \(x(0)=0\), the amount of product at time \(t\) is'
    A: '\(x=\dfrac{a^2kt}{1+akt}\)'
    B: '\(x=a^2kt\)'
    C: '\(x=\dfrac{akt}{1+a^2kt}\)'
    D: '\(x=a\left(1-e^{-kt}\right)\)'
    answer: A
    hint: 'Separate: \(\dfrac{dx}{(a-x)^2}=k\,dt\), so \(\dfrac1{a-x}=kt+C\).'
    explanation: '\(x(0)=0\) gives \(C=\tfrac1a\); then \(a-x=\dfrac1{kt+1/a}\), so \(x=\dfrac{a^2kt}{1+akt}\).'
  170:
    topic: s8-3
    question: 'For the second-order reaction with \(a\ne b\), integrating \(\dfrac{dx}{(a-x)(b-x)}=k\,dt\) uses'
    A: 'the same formula as the case \(a=b\)'
    B: 'partial fractions, giving \(\dfrac1{a-b}\ln\dfrac{b(a-x)}{a(b-x)}=kt\)'
    C: integration by parts only
    D: a trigonometric substitution
    answer: B
    hint: '\(\dfrac1{(a-x)(b-x)}=\dfrac1{b-a}\left(\dfrac1{a-x}-\dfrac1{b-x}\right)\).'
    explanation: 'Applying \(x(0)=0\) fixes the constant.'
  171:
    topic: s8-3
    question: 'The integral \(\displaystyle\int_0^1\dfrac{x^4(x-1)^4}{x^2+1}\,dx\) equals'
    A: '\(\dfrac{22}{7}-\pi\)'
    B: '\(\dfrac{22}{7}\)'
    C: '\(\pi-\dfrac{22}{7}\)'
    D: '\(\dfrac{22}{7}+\pi\)'
    answer: A
    hint: 'Divide the numerator by \(x^2+1\) first.'
    explanation: 'The quotient is a polynomial; the remainder gives \(\dfrac4{x^2+1}\), so the integral is \(\dfrac{22}{7}-\pi\).'
  172:
    topic: s8-3
    question: 'The integrand in \(\displaystyle\int_0^1\dfrac{x^4(x-1)^4}{x^2+1}dx=\dfrac{22}7-\pi\) is positive. Using this, \(\dfrac{22}7-\pi\) as a percentage of \(\pi\) is about'
    A: '\(0.04\text{ \%}\)'
    B: '\(0.402\text{ \%}\)'
    C: '\(0.004\text{ \%}\)'
    D: '\(4.02\text{ \%}\)'
    answer: A
    hint: 'Divide the difference by \(\pi\) and multiply by 100.'
    explanation: '\(\dfrac{0.001264}{3.14159}\approx0.0402\%\), so \(22/7\) is a very good approximation.'
  173:
    topic: s8-3
    question: 'Find the second-degree polynomial \(P(x)\) with \(P(0)=1\), \(P^\prime(0)=0\) such that \(\displaystyle\int\dfrac{P(x)}{x^3(x-1)^2}dx\) is a rational function.'
    A: '\(P(x)=1-6x^2\)'
    B: '\(P(x)=1-3x^2\)'
    C: '\(P(x)=1+6x^2\)'
    D: '\(P(x)=1+3x^2\)'
    answer: B
    hint: '\(P(x)=ax^2+1\). The integral is rational exactly when the \(\dfrac1x\) and \(\dfrac1{x-1}\) terms are absent.'
    explanation: 'The residue at \(x=0\) is \(a+3\) (and at \(x=1\) it is \(-a-3\)), so \(a=-3\).'
  174:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\frac{\pi}{2}} \sin^{5}{\left(x \right)}\,dx\).'
    A: '\(- \frac{8}{15}\)'
    B: '\(\frac{16}{15}\)'
    C: '\(\frac{8}{15}\)'
    D: '\(\frac{4}{15}\)'
    answer: C
    hint: 'Odd power of sine: save one \(\sin x\) and use \(\sin^2x=1-\cos^2x\).'
    explanation: 'An antiderivative is \(- \frac{\cos^{5}{\left(x \right)}}{5} + \frac{2 \cos^{3}{\left(x \right)}}{3} - \cos{\left(x \right)}\); then \(F(\frac{\pi}{2})-F(0)=\frac{8}{15}\).'
  175:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\pi} \sin^{5}{\left(\frac{x}{2} \right)}\,dx\).'
    A: '\(- \frac{16}{15}\)'
    B: '\(\frac{16}{15}\)'
    C: '\(\frac{8}{15}\)'
    D: '\(\frac{32}{15}\)'
    answer: B
    hint: 'Let \(u=x/2\), then save one \(\sin u\).'
    explanation: 'An antiderivative is \(- \frac{2 \cos^{5}{\left(\frac{x}{2} \right)}}{5} + \frac{4 \cos^{3}{\left(\frac{x}{2} \right)}}{3} - 2 \cos{\left(\frac{x}{2} \right)}\); then \(F(\pi)-F(0)=\frac{16}{15}\).'
  176:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{- \frac{\pi}{2}}^{\frac{\pi}{2}} \cos^{3}{\left(x \right)}\,dx\).'
