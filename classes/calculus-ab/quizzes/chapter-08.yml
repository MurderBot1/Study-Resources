    answer: A
    hint: 'Use \(\dfrac Az+\dfrac B{z^2}+\dfrac C{z-1}\).'
    explanation: '\(B=-1\), \(C=2\), and comparing the \(z^2\) coefficients gives \(A+C=0\), so \(A=-2\).'
  134:
    topic: s8-3
    question: 'Expand \(\frac{z}{z^{3} - z^{2} - 6 z}\) in partial fractions.'
