    hint: 'Let \(x=\sin\theta\).'
    explanation: '\(\sqrt{1-x^2}=\cos\theta\) and \(dx=\cos\theta\,d\theta\), so the integral is \(\theta\).'
  242:
    topic: s8-5
    question: 'Solve \(x\dfrac{dy}{dx}=\sqrt{x^2-4}\), \(x\ge2\), \(y(2)=0\).'
