    hint: 'Let \(w=3\sin\theta\); then \(\int\cot^2\theta\,d\theta\).'
    explanation: 'Differentiating \(- \sin^{-1}{\left(\frac{w}{3} \right)} - \frac{\sqrt{9 - w^{2}}}{w}\) gives \(\frac{\sqrt{9 - w^{2}}}{w^{2}}\).'
  226:
    topic: s8-5
    question: 'Evaluate \(\displaystyle\int_0^{\sqrt3/2}\dfrac{4x^2\,dx}{(1-x^2)^{3/2}}\).'
