    explanation: 'The integrand is \((x-1)^{-2/3}(x+1)^{-4/3}=u^{-2/3}(x+1)^{-2}\), giving \(\tfrac12\int u^{-2/3}du=\tfrac32u^{1/3}\).'
  89:
