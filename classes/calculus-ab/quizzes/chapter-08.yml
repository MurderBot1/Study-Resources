  248:
    topic: s8-5
    question: 'Using \(z=\tan\dfrac x2\), \(\displaystyle\int\dfrac{dx}{1+\cos x}=\)'
    A: '\(- \cot{\left(\frac{x}{2} \right)}+C\)'
    B: '\(\tan{\left(x \right)}+C\)'
    C: '\(2 \tan{\left(\frac{x}{2} \right)}+C\)'
    D: '\(\tan{\left(\frac{x}{2} \right)}+C\)'
    answer: D
    hint: '\(\cos x=\dfrac{1-z^2}{1+z^2}\) and \(dx=\dfrac{2\,dz}{1+z^2}\).'
