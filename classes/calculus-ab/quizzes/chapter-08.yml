    D: '\(\frac{1}{x + 1} + \frac{3}{\left(x + 1\right)^{2}}\)'
    answer: D
    hint: 'A repeated factor needs both \(\dfrac A{x+1}\) and \(\dfrac B{(x+1)^2}\).'
