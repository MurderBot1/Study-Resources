    explanation: '\(y=\sqrt{x^2-4}-2\sec^{-1}\tfrac x2+C\), and \(y(2)=0-0+C=0\).'
  243:
    topic: s8-5
    question: 'Solve \(\sqrt{x^2-9}\,\dfrac{dy}{dx}=1\), \(x>3\), \(y(5)=\ln3\).'
