    answer: A
    hint: '\(\sin^5\theta=\sin\theta(1-\cos^2\theta)^2\).'
    explanation: 'Differentiating \(- \frac{\cos^{5}{\left(\theta \right)}}{5} + \frac{2 \cos^{3}{\left(\theta \right)}}{3} - \cos{\left(\theta \right)}\) gives \(\sin^{5}{\left(\theta \right)}\).'
  74:
    topic: s8-1
    question: 'Find \(\displaystyle\int \sin^{7}{\left(\theta \right)}\,d\theta\).'
