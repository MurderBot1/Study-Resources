    B: '\(\frac{3 \pi}{2}\)'
    C: '\(6 \pi\)'
    D: '\(- 3 \pi\)'
    answer: A
    hint: 'Even power: use \(\sin^2x=\tfrac{1-\cos2x}2\) twice.'
    explanation: 'An antiderivative is \(3 x - 2 \sin^{3}{\left(x \right)} \cos{\left(x \right)} - 3 \sin{\left(x \right)} \cos{\left(x \right)}\); then \(F(\pi)-F(0)=3 \pi\).'
  181:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{1} 8 \cos^{4}{\left(2 \pi x \right)}\,dx\).'
    A: '\(\frac{3}{2}\)'
    B: '\(6\)'
    C: '\(-3\)'
    D: '\(3\)'
    answer: D
    hint: 'Even power: use \(\cos^2u=\tfrac{1+\cos2u}2\) twice.'
    explanation: 'An antiderivative is \(\frac{4 \left(\frac{3 \pi x}{4} + \frac{\sin{\left(2 \pi x \right)} \cos^{3}{\left(2 \pi x \right)}}{4} + \frac{3 \sin{\left(2 \pi x \right)} \cos{\left(2 \pi x \right)}}{8}\right)}{\pi}\); then \(F(1)-F(0)=3\).'
  182:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{- \frac{\pi}{4}}^{\frac{\pi}{4}} 16 \sin^{2}{\left(x \right)} \cos^{2}{\left(x \right)}\,dx\).'
    A: '\(\frac{\pi}{2}\)'
    B: '\(\pi\)'
    C: '\(- \pi\)'
    D: '\(2 \pi\)'
    answer: B
    hint: '\(\sin x\cos x=\tfrac12\sin2x\), so the integrand is \(4\sin^22x\).'
    explanation: 'An antiderivative is \(2 x - \sin{\left(2 x \right)} \cos{\left(2 x \right)}\); then \(F(\frac{\pi}{4})-F(- \frac{\pi}{4})=\pi\).'
  183:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\pi} 8 \sin^{4}{\left(y \right)} \cos^{2}{\left(y \right)}\,dy\).'
    A: '\(\frac{\pi}{4}\)'
    B: '\(\pi\)'
    C: '\(- \frac{\pi}{2}\)'
    D: '\(\frac{\pi}{2}\)'
    answer: D
    hint: 'Use \(\sin^2y=\tfrac{1-\cos2y}2\) and \(\cos^2y=\tfrac{1+\cos2y}2\).'
    explanation: 'An antiderivative is \(\frac{y}{2} + \frac{4 \sin^{5}{\left(y \right)} \cos{\left(y \right)}}{3} - \frac{\sin^{3}{\left(y \right)} \cos{\left(y \right)}}{3} - \frac{\sin{\left(y \right)} \cos{\left(y \right)}}{2}\); then \(F(\pi)-F(0)=\frac{\pi}{2}\).'
  184:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\frac{\pi}{2}} 35 \sin^{4}{\left(x \right)} \cos^{3}{\left(x \right)}\,dx\).'
    A: '\(-2\)'
    B: '\(2\)'
    C: '\(4\)'
