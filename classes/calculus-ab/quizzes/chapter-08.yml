    explanation: '\(2\pi\left[x\sin x+\cos x\right]_0^{\pi/2}=2\pi\left(\tfrac\pi2-1\right)=\pi(\pi-2)\).'
  128:
    topic: s8-2
    question: 'The region under \(y=\cos x\) for \(0\le x\le\pi/2\) is revolved about the line \(x=\pi/2\). The volume is'
    A: '\(\pi \left(-2 + \pi\right)\)'
    B: '\(\pi^{2}\)'
    C: '\(2 \pi\)'
    D: '\(\pi\)'
    answer: C
    hint: 'Shell radius is \(\tfrac\pi2-x\).'
    explanation: '\(2\pi\int_0^{\pi/2}\left(\tfrac\pi2-x\right)\cos x\,dx=2\pi\left[\left(\tfrac\pi2-x\right)\sin x-\cos x\right]_0^{\pi/2}=2\pi(0-(-1))=2\pi\).'
  129:
    topic: s8-3
    question: 'Expand \(\frac{5 x - 13}{\left(x - 3\right) \left(x - 2\right)}\) in partial fractions.'
