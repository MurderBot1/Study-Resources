    D: '\(\frac{\int\limits_{1}^{2} \begin{cases} \frac{r^{5} - 3 r^{3} + 2 r + \sqrt{\frac{r^{2} - 1}{r^{2}}} \sqrt{r^{2} - 1}}{\left(r^{2} - 1\right)^{\frac{3}{2}}} & \text{for}\: r > 1 \vee r < -1 \\\frac{i \left(- r^{4} + r^{2} \sqrt{1 - r^{2}} + 2 r^{2} - \sqrt{1 - r^{2}} - 1\right)}{r \left(\sqrt{1 - r^{2}} + 1\right)} & \text{otherwise} \end{cases}\, dr}{2}\)'
