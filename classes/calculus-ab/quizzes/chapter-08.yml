    B: '\(\frac{16}{5}\)'
    C: '\(\frac{8}{5}\)'
    D: '\(\frac{32}{5}\)'
    answer: B
    hint: Odd power of cosine.
    explanation: 'An antiderivative is \(- \sin^{7}{\left(t \right)} + \frac{21 \sin^{5}{\left(t \right)}}{5} - 7 \sin^{3}{\left(t \right)} + 7 \sin{\left(t \right)}\); then \(F(\frac{\pi}{2})-F(0)=\frac{16}{5}\).'
  180:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\pi} 8 \sin^{4}{\left(x \right)}\,dx\).'
