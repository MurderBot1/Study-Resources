  240:
    topic: s8-5
    question: '\(\displaystyle\int\dfrac{x\,dx}{\sqrt{x^2-1}}\) (\(x>1\)) is most easily found with'
    A: '\(x=\tan\theta\) (result \(\tan^{-1}x+C\))'
    B: '\(x=\sin\theta\) (result \(\sin^{-1}x+C\))'
    C: '\(x=\sec\theta\) (result \(\sec^{-1}x+C\))'
