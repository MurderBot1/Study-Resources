    B: '\(- \frac{16}{35}\)'
    C: '\(\frac{16}{35}\)'
    D: '\(\frac{32}{35}\)'
    answer: C
    hint: Odd power of sine.
    explanation: 'An antiderivative is \(\frac{\cos^{7}{\left(y \right)}}{7} - \frac{3 \cos^{5}{\left(y \right)}}{5} + \cos^{3}{\left(y \right)} - \cos{\left(y \right)}\); then \(F(\frac{\pi}{2})-F(0)=\frac{16}{35}\).'
  179:
    topic: s8-4
    question: 'Evaluate \(\displaystyle\int_{0}^{\frac{\pi}{2}} 7 \cos^{7}{\left(t \right)}\,dt\).'
