  87:
    topic: s8-1
    question: 'Using \(\csc x=\dfrac{\csc x(\csc x+\cot x)}{\csc x+\cot x}\) (or the cofunction version of the derivation for \(\sec x\)) gives \(\displaystyle\int\csc x\,dx=\)'
    A: '\(-\ln|\csc x+\cot x|+C\)'
