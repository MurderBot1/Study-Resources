    D: 'an ellipse with \(e=2\)'
    answer: B
    hint: 'Write it as \(r=\dfrac{ke}{1\pm e\cos\theta}\) (or with \(\sin\theta\)) and read off \(e\). \(e\) is the coefficient of \(\cos\theta\) in the denominator when the constant term is \(1\).'
    explanation: '\(e=2>1\).'
  392:
    topic: s10-8
    question: 'The graph of \(r=\dfrac{1}{1-\sin\theta}\) is'
    A: 'a parabola with directrix \(y=-1\)'
    B: an ellipse
    C: 'a parabola with directrix \(y=1\)'
    D: a hyperbola
    answer: A
    hint: 'Write it as \(r=\dfrac{ke}{1\pm e\cos\theta}\) (or with \(\sin\theta\)) and read off \(e\). \(e=1\).'
    explanation: '\(ke=1\), \(k=1\); the minus puts the directrix below.'
  393:
    topic: s10-8
    question: 'The graph of \(r=\dfrac{1}{1+2\sin\theta}\) is'
    A: 'a hyperbola with \(e=2\) and directrix \(y=\tfrac12\)'
    B: 'an ellipse with \(e=2\)'
    C: 'a hyperbola with directrix \(y=-\tfrac12\)'
    D: a parabola
    answer: A
    hint: 'Write it as \(r=\dfrac{ke}{1\pm e\cos\theta}\) (or with \(\sin\theta\)) and read off \(e\). \(e=2\), \(ke=1\).'
    explanation: '\(k=\tfrac12\).'
  394:
    topic: s10-8
    question: 'For an ellipse of semimajor axis \(a\) and eccentricity \(e\) with a focus at the origin, the center is at distance'
    A: '\(ae\) from the origin'
    B: '\(\dfrac ae\) from the origin'
    C: '\(a\) from the origin'
    D: '\(a(1-e)\) from the origin'
    answer: A
    hint: 'The center is a distance \(c\) from each focus.'
    explanation: '\(c=ae\).'
  395:
    topic: s10-8
    question: For a planet orbiting the sun (the sun at one focus), the closest and farthest distances are
    A: '\(a(1+e)\) (perihelion) and \(a(1-e)\) (aphelion)'
    B: '\(a(1-e)\) (perihelion) and \(a(1+e)\) (aphelion)'
    C: '\(\dfrac ae\) and \(ae\)'
    D: '\(a-e\) and \(a+e\)'
    answer: B
    hint: 'The polar equation is \(r=\dfrac{a(1-e^2)}{1+e\cos\theta}\).'
    explanation: 'At \(\theta=0\), \(r=a(1-e)\); at \(\theta=\pi\), \(r=a(1+e)\).'
  396:
    topic: s10-8
    question: 'Mercury has semimajor axis \(0.3871\) AU and eccentricity \(0.2056\). Its perihelion and aphelion distances (in AU, to three decimals) are'
    A: '\(0.308\) and \(0.467\)'
    B: '\(0.371\) and \(0.403\)'
    C: '\(0.321\) and \(0.487\)'
    D: '\(0.181\) and \(0.593\)'
    answer: A
    hint: '\(r_{\min}=a(1-e)\), \(r_{\max}=a(1+e)\).'
    explanation: '\(0.3871(1\mp0.2056)\).'
  397:
    topic: s10-8
    question: 'Mars has semimajor axis \(1.524\) AU and eccentricity \(0.0934\). Its perihelion and aphelion distances (in AU, to three decimals) are'
    A: '\(1.431\) and \(1.617\)'
    B: '\(1.511\) and \(1.537\)'
    C: '\(1.394\) and \(1.681\)'
    D: '\(1.382\) and \(1.666\)'
    answer: D
    hint: '\(r_{\min}=a(1-e)\), \(r_{\max}=a(1+e)\).'
    explanation: '\(1.524(1\mp0.0934)\).'
  398:
    topic: s10-8
    question: 'Jupiter has semimajor axis \(5.203\) AU and eccentricity \(0.0484\). Its perihelion and aphelion distances (in AU, to three decimals) are'
    A: '\(5.191\) and \(5.215\)'
    B: '\(5.155\) and \(5.251\)'
    C: '\(4.951\) and \(5.455\)'
    D: '\(4.963\) and \(5.468\)'
    answer: C
    hint: '\(r_{\min}=a(1-e)\), \(r_{\max}=a(1+e)\).'
    explanation: '\(5.203(1\mp0.0484)\).'
  399:
    topic: s10-8
    question: 'Uranus has semimajor axis \(19.18\) AU and eccentricity \(0.046\). Its perihelion and aphelion distances (in AU, to three decimals) are'
    A: '\(19.139\) and \(19.221\)'
    B: '\(19.134\) and \(19.226\)'
    C: '\(18.298\) and \(20.062\)'
    D: '\(18.337\) and \(20.105\)'
    answer: C
    hint: '\(r_{\min}=a(1-e)\), \(r_{\max}=a(1+e)\).'
    explanation: '\(19.18(1\mp0.046)\).'
  400:
    topic: s10-8
    question: 'Pluto has semimajor axis \(39.44\) AU and eccentricity \(0.2481\). Its perihelion and aphelion distances (in AU, to three decimals) are'
    A: '\(37.012\) and \(41.868\)'
    B: '\(29.655\) and \(49.225\)'
    C: '\(39.192\) and \(39.688\)'
    D: '\(31.600\) and \(52.454\)'
    answer: B
    hint: '\(r_{\min}=a(1-e)\), \(r_{\max}=a(1+e)\).'
    explanation: '\(39.44(1\mp0.2481)\).'
  401:
    topic: s10-8
    question: 'A polar equation for the orbit of Mercury (\(a=0.3871\) AU, \(e=0.2056\)) with the sun at the origin is'
    A: '\(r=\dfrac{0.3871}{1+0.2056\cos\theta}\)'
    B: '\(r=\dfrac{0.3871(1+0.2056^2)}{1+0.2056\cos\theta}\)'
    C: '\(r=\dfrac{0.3707}{1+0.3871\cos\theta}\)'
    D: '\(r=\dfrac{0.3871(1-0.2056^2)}{1+0.2056\cos\theta}\approx\dfrac{0.3707}{1+0.2056\cos\theta}\)'
    answer: D
    hint: '\(r=\dfrac{a(1-e^2)}{1+e\cos\theta}\).'
    explanation: '\(0.3871(1-0.04227)=0.3707\).'
  402:
    topic: s10-8
    question: 'To draw an ellipse of eccentricity \(0.2\) with a 10-in. string, the pins should be placed'
    A: '\(5\) in. apart'
    B: '\(2\) in. apart'
    C: '\(4\) in. apart'
    D: '\(1\) in. apart'
    answer: B
    hint: 'The string length is \(2a\), and the pin separation is \(2c=2ae\).'
    explanation: '\(2a=10\) gives \(a=5\); \(c=ae=1\); the pins are \(2c=2\) in. apart.'
  403:
    topic: s10-8
    question: 'The polar equation of the parabola with focus at the origin and directrix \(r\cos\theta=4\) is'
    A: '\(r=\dfrac4{1-\cos\theta}\)'
    B: '\(r=\dfrac4{1+\cos\theta}\)'
    C: '\(r=\dfrac8{1+\cos\theta}\)'
    D: '\(r=\dfrac2{1+\cos\theta}\)'
    answer: B
    hint: '\(e=1\) and \(k=4\).'
    explanation: '\(r=\dfrac{ke}{1+e\cos\theta}\).'
  404:
    topic: s10-8
    question: 'The polar equation of the parabola with focus at the origin and directrix \(r\cos\left(\theta-\tfrac\pi2\right)=2\) is'
    A: '\(r=\dfrac4{1+\sin\theta}\)'
    B: '\(r=\dfrac2{1+\cos\theta}\)'
    C: '\(r=\dfrac2{1-\sin\theta}\)'
    D: '\(r=\dfrac2{1+\sin\theta}\)'
    answer: D
    hint: '\(r\cos(\theta-\tfrac\pi2)=r\sin\theta\), so the directrix is \(y=2\).'
    explanation: '\(e=1\), \(k=2\).'
  405:
    topic: s10-8
    question: 'The curves \(r=4\sin\theta\) and \(r=\sqrt3\sec\theta\) in Cartesian form are \(x^2+(y-2)^2=4\) and \(x=\sqrt3\). They intersect at'
    A: '\(\left(\sqrt3,2\right)\) only'
    B: '\(\left(1,\sqrt3\right)\) and \(\left(3,\sqrt3\right)\)'
    C: '\(\left(\sqrt3,1\right)\) and \(\left(\sqrt3,3\right)\)'
    D: '\(\left(\sqrt3,0\right)\) and \(\left(\sqrt3,4\right)\)'
    answer: C
    hint: 'Substitute \(x=\sqrt3\): \(3+(y-2)^2=4\).'
    explanation: '\((y-2)^2=1\) gives \(y=1\) or \(3\).'
  406:
    topic: s10-8
    question: 'The polar equation of the circle \(x^2+y^2-2ay=0\) is'
    A: '\(r=2a\cos\theta\)'
    B: '\(r=-2a\sin\theta\)'
    C: '\(r=a\sin\theta\)'
    D: '\(r=2a\sin\theta\)'
    answer: D
    hint: '\(r^2=2ar\sin\theta\).'
    explanation: 'Divide by \(r\).'
  407:
    topic: s10-8
    question: 'The polar equation of the parabola \(y^2=4ax+4a^2\) (focus at the origin) is'
    A: '\(r=\dfrac{2a}{1+\cos\theta}\)'
    B: '\(r=\dfrac{4a}{1-\cos\theta}\)'
    C: '\(r=\dfrac{2a}{1-\cos\theta}\)'
    D: '\(r=\dfrac{a}{1-\cos\theta}\)'
    answer: C
    hint: 'Write \(y^2=4a(x+a)\); its focus is \((0,0)\).'
    explanation: '\(x^2+y^2=(x+2a)^2\) (distance to focus equals distance to the line \(x=-2a\)), so \(r=2a+r\cos\theta\).'
  408:
    topic: s10-8
    question: 'The polar equation of the line \(x\cos\alpha+y\sin\alpha=p\) is'
    A: '\(r=p\cos\alpha\)'
    B: '\(r\cos(\theta-\alpha)=p\)'
    C: '\(r\cos(\theta+\alpha)=p\)'
    D: '\(r\sin(\theta-\alpha)=p\)'
    answer: B
    hint: 'Substitute \(x=r\cos\theta\), \(y=r\sin\theta\).'
    explanation: '\(r(\cos\theta\cos\alpha+\sin\theta\sin\alpha)=r\cos(\theta-\alpha)\).'
  409:
    topic: s10-8
    question: 'The polar equation of the curve \(\left(x^2+y^2\right)^2+2ax\left(x^2+y^2\right)-a^2y^2=0\) is'
    A: '\(r=2a\sin\theta\)'
    B: '\(r=a(1-\cos\theta)\) (a cardioid)'
    C: '\(r=a\cos2\theta\)'
    D: '\(r=a(1+\cos\theta)\)'
    answer: B
    hint: 'Divide by \(r^2\): \(r^2+2ar\cos\theta-a^2\sin^2\theta=0\).'
    explanation: 'The quadratic in \(r\) has roots \(r=-a\cos\theta\pm a\), giving \(r=a(1-\cos\theta)\).'
  410:
    topic: s10-8
    question: 'For \(r=\dfrac{ke}{1+e\cos\theta}\), as \(e\) increases from \(0\) to \(1\) (with \(ke\) fixed) the ellipse'
    A: becomes a hyperbola immediately
    B: shrinks to a point
    C: becomes a circle
    D: becomes more elongated and approaches a parabola
    answer: D
    hint: '\(e=0\) is a circle; \(e=1\) is a parabola.'
    explanation: 'Small \(e\) gives a nearly circular ellipse.'
  411:
    topic: s10-8
    question: 'For \(r=\dfrac{ke}{1+e\cos\theta}\) with \(e>1\), the graph is'
    A: an ellipse
    B: a parabola
    C: a circle
    D: 'a hyperbola, and the polar curve has asymptotic directions where \(1+e\cos\theta=0\)'
    answer: D
    hint: 'The denominator can vanish when \(e>1\).'
    explanation: '\(\cos\theta=-\tfrac1e\) gives the asymptotic directions.'
