# Chapter 10: Conic Sections and Polar Coordinates
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 10.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 10: Conic Sections and Polar Coordinates"
description: Parabolas, ellipses and hyperbolas, eccentricity and directrices, rotation of axes, parametrized conics and the cycloid, polar coordinates and graphs, areas and lengths in polar coordinates, and conics in polar form.
topics:
  s10-1:
    title: 10.1 Conic Sections and Quadratic Equations
  s10-2:
    title: 10.2 Classifying Conic Sections by Eccentricity
  s10-3:
    title: 10.3 Quadratic Equations and Rotations
  s10-4:
    title: 10.4 Conics and Parametric Equations; The Cycloid
  s10-5:
    title: 10.5 Polar Coordinates
  s10-6:
    title: 10.6 Graphing in Polar Coordinates
  s10-7:
    title: 10.7 Areas and Lengths in Polar Coordinates
  s10-8:
    title: 10.8 Conic Sections in Polar Coordinates
questions:
  1:
    topic: s10-1
    question: 'Match the parabola \(x^2=2y\) with its description.'
    A: 'opens upward, focus \(\left(0,2\right)\)'
    B: 'opens to the right, focus \(\left(\tfrac12,0\right)\)'
    C: 'opens downward, focus \(\left(0,-\tfrac12\right)\)'
    D: 'opens upward, focus \(\left(0,\tfrac12\right)\)'
    answer: D
    hint: '\(x^2=4py\) with \(4p=2\).'
    explanation: '\(p=\tfrac12>0\), so it opens upward with focus \((0,p)\).'
  2:
    topic: s10-1
    question: 'Match the parabola \(x^2=-6y\) with its description.'
    A: 'opens downward, focus \(\left(0,-6\right)\), directrix \(y=6\)'
    B: 'opens upward, focus \(\left(0,\tfrac32\right)\), directrix \(y=-\tfrac32\)'
    C: 'opens to the left, focus \(\left(-\tfrac32,0\right)\), directrix \(x=\tfrac32\)'
    D: 'opens downward, focus \(\left(0,-\tfrac32\right)\), directrix \(y=\tfrac32\)'
    answer: D
    hint: '\(4p=-6\).'
    explanation: '\(p=-\tfrac32\), so the focus is \((0,p)\) and the directrix is \(y=-p\).'
  3:
    topic: s10-1
    question: 'The parabola \(y^2=8x\) has focus and directrix'
