    C: 'focus \((8,0)\), directrix \(x=-8\)'
    D: 'focus \((0,2)\), directrix \(y=-2\)'
    answer: B
    hint: '\(y^2=4px\).'
    explanation: '\(4p=8\) gives \(p=2\).'
