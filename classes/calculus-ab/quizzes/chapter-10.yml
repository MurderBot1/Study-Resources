    hint: '\(V=\pi\displaystyle\int_0^h\dfrac{b^2y}{4h}\,dy\).'
    explanation: '\(V=\dfrac{\pi b^2h}{8}\) while the cone has \(\dfrac{\pi b^2h}{12}\); the ratio is \(\tfrac32\).'
  77:
    topic: s10-1
    question: 'A suspension-bridge cable satisfies \(\dfrac{dy}{dx}=\dfrac wHx\) with \(y(0)=0\). The cable hangs in the shape'
