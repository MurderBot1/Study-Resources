  90:
    topic: s10-1
    question: 'As \(x\to\infty\), the vertical distance \(\dfrac bax-\dfrac ba\sqrt{x^2-a^2}\) between the asymptote and the hyperbola \(\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1\) tends to'
