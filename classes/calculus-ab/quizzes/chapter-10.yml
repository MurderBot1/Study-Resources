    hint: 'Write it as \(r=\dfrac{ke}{1\pm e\cos\theta}\) (or with \(\sin\theta\)) and read off \(e\).'
    explanation: '\(e=1\), \(ke=1\), so \(k=1\); at \(\theta=0\), \(r=\tfrac12\).'
  384:
    topic: s10-8
    question: 'The graph of \(r=\dfrac6{2+\cos\theta}\) is'
