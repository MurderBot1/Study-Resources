    C: '\((9,\ 0)\) and \((-9,\ 0)\)'
    D: '\((\sqrt{41},\ 0)\) and \((- \sqrt{41},\ 0)\)'
    answer: A
    hint: 'Divide to get standard form \(\dfrac{x^2}{25}+\dfrac{y^2}{16}=1\); then \(c^2=a^2-b^2\).'
    explanation: '\(a^2=25\), \(b^2=16\), \(c=3\). The major axis is along the \(x\)-axis.'
