  156:
    topic: s10-3
    question: 'To remove the \(xy\)-term from \(xy=2\), rotate the axes through'
    A: '\(45^\circ\), giving \(x''^2-y''^2=4\)'
    B: '\(45^\circ\), giving \(x''^2+y''^2=4\)'
    C: '\(90^\circ\), giving \(y''^2-x''^2=2\)'
    D: '\(30^\circ\), giving \(x''^2-y''^2=4\)'
    answer: A
    hint: '\(\tan2\alpha=\dfrac{B}{A-C}\), undefined when \(A=C\) (so \(2\alpha=90^\circ\)).'
    explanation: 'With \(x=\tfrac{x''-y''}{\sqrt2}\), \(y=\tfrac{x''+y''}{\sqrt2}\): \(xy=\tfrac{x''^2-y''^2}2=2\). The graph is a hyperbola.'
  157:
    topic: s10-3
    question: 'Rotate the axes through \(45^\circ\) to remove the \(xy\)-term in \(x^2+xy+y^2=1\). The new equation is'
    A: '\(3x''^2-y''^2=2\), a hyperbola'
    B: '\(\dfrac{3x''^2}2+\dfrac{y''^2}2=2\), an ellipse'
    C: '\(3x''^2+y''^2=2\), an ellipse'
    D: '\(x''^2+3y''^2=2\), an ellipse'
    answer: C
    hint: 'When \(A=C\), \(\alpha=45^\circ\); use \(A''=A\cos^2\alpha+B\sin\alpha\cos\alpha+C\sin^2\alpha\).'
    explanation: '\(A''=\tfrac32\), \(C''=\tfrac12\), so \(\tfrac32x''^2+\tfrac12y''^2=1\).'
  158:
    topic: s10-3
    question: 'To remove the \(xy\)-term from \(3x^2+2\sqrt3xy+y^2-8x+8\sqrt3y=0\), rotate through'
    A: '\(\alpha=45^\circ\); the graph is a hyperbola'
    B: '\(\alpha=30^\circ\); the graph is an ellipse'
    C: '\(\alpha=60^\circ\); the graph is a parabola'
    D: '\(\alpha=30^\circ\) (since \(\tan2\alpha=\sqrt3\)); the graph is a parabola'
    answer: D
    hint: '\(\tan2\alpha=\dfrac{B}{A-C}=\dfrac{2\sqrt3}{2}\).'
    explanation: '\(B^2-4AC=12-12=0\); the new equation is \(4x''^2+16y''=0\).'
  159:
    topic: s10-3
    question: 'The equation \(x^2-\sqrt3xy+2y^2=1\) becomes free of the \(xy\)-term after rotating the axes through'
    A: '\(45^\circ\)'
    B: '\(30^\circ\)'
    C: '\(60^\circ\)'
    D: '\(15^\circ\)'
    answer: B
    hint: '\(\tan2\alpha=\dfrac{B}{A-C}=\dfrac{-\sqrt3}{-1}=\sqrt3\).'
    explanation: '\(2\alpha=60^\circ\), so \(\alpha=30^\circ\); the graph is an ellipse (\(B^2-4AC=3-8<0\)).'
  160:
    topic: s10-3
    question: 'After rotating the axes through \(45^\circ\), the equation \(3x^2+2xy+3y^2=19\) becomes'
    A: '\(4x''^2-2y''^2=19\), a hyperbola'
    B: '\(6x''^2=19\), a pair of lines'
    C: '\(4x''^2+2y''^2=19\), an ellipse'
    D: '\(2x''^2+4y''^2=19\), an ellipse'
    answer: C
    hint: '\(A=C\) forces \(\alpha=45^\circ\).'
    explanation: '\(A''=\tfrac32+1+\tfrac32=4\), \(C''=\tfrac32-1+\tfrac32=2\).'
  161:
    topic: s10-3
    question: 'After rotating through \(30^\circ\), the equation \(3x^2+4\sqrt3xy-y^2=7\) becomes'
    A: '\(5x''^2+3y''^2=7\), an ellipse'
    B: '\(5x''^2-3y''^2=7\), a hyperbola'
    C: '\(2x''^2=7\), a parabola'
    D: '\(3x''^2-5y''^2=7\), a hyperbola'
    answer: B
    hint: '\(\tan2\alpha=\dfrac{4\sqrt3}{4}=\sqrt3\).'
    explanation: '\(A''=\tfrac94+3-\tfrac14=5\), \(C''=\tfrac34-3-\tfrac34=-3\).'
  162:
    topic: s10-3
    question: 'To eliminate the cross-product term from \(14x^2+16xy+2y^2-10x+26370y-17=0\), rotate through an angle \(\alpha\) in Quadrant I with'
    A: '\(\cos\alpha=\dfrac2{\sqrt5}\), \(\sin\alpha=\dfrac1{\sqrt5}\)'
    B: '\(\cos\alpha=\dfrac1{\sqrt5}\), \(\sin\alpha=\dfrac2{\sqrt5}\)'
    C: '\(\cos\alpha=\dfrac45\), \(\sin\alpha=\dfrac35\)'
    D: '\(\cos\alpha=\dfrac35\), \(\sin\alpha=\dfrac45\)'
    answer: A
    hint: '\(\tan2\alpha=\dfrac{16}{14-2}=\dfrac43\), so \(\cos2\alpha=\dfrac35\).'
    explanation: '\(\cos\alpha=\sqrt{\dfrac{1+3/5}2}=\dfrac2{\sqrt5}\) and \(\sin\alpha=\dfrac1{\sqrt5}\).'
  163:
    topic: s10-3
    question: 'To eliminate the cross-product term from \(4x^2-4xy+y^2-8\sqrt5x-16\sqrt5y=0\), rotate through an angle in Quadrant II with'
    A: '\(\sin\alpha=\dfrac2{\sqrt5}\), \(\cos\alpha=\dfrac1{\sqrt5}\)'
    B: '\(\sin\alpha=\dfrac45\), \(\cos\alpha=-\dfrac35\)'
    C: '\(\sin\alpha=\dfrac1{\sqrt5}\), \(\cos\alpha=-\dfrac2{\sqrt5}\)'
    D: '\(\sin\alpha=\dfrac2{\sqrt5}\), \(\cos\alpha=-\dfrac1{\sqrt5}\)'
    answer: C
    hint: '\(\tan2\alpha=\dfrac{B}{A-C}=\dfrac{-4}{3}\) with \(2\alpha\) in Quadrant IV.'
    explanation: '\(\cos2\alpha=\dfrac35\) gives \(\cos^2\alpha=\dfrac45\); in Quadrant II \(\cos\alpha<0\).'
  164:
    topic: s10-3
    question: 'A \(90^\circ\) rotation about the origin carries the ellipse \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1\) (\(a>b\)) to'
    A: '\(\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1\)'
    B: '\(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1\)'
    C: '\(\dfrac{x^2}{b^2}+\dfrac{y^2}{a^2}=1\)'
    D: '\(\dfrac{y^2}{b^2}-\dfrac{x^2}{a^2}=1\)'
    answer: C
    hint: 'A \(90^\circ\) rotation swaps the roles of \(x\) and \(y\) (up to sign).'
    explanation: The major axis becomes vertical.
  165:
    topic: s10-3
    question: 'A \(90^\circ\) rotation about the origin carries the hyperbola \(\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1\) to'
    A: '\(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1\)'
    B: '\(\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1\)'
    C: '\(\dfrac{y^2}{a^2}-\dfrac{x^2}{b^2}=1\)'
    D: '\(\dfrac{x^2}{b^2}-\dfrac{y^2}{a^2}=1\)'
    answer: C
    hint: 'Replace \((x,y)\) by \((y,-x)\).'
    explanation: The branches now open upward and downward.
  166:
    topic: s10-3
    question: 'A \(90^\circ\) rotation takes the line \(y=mx\) (\(m\ne0\)) to'
    A: '\(y=-\dfrac1mx\)'
    B: '\(y=mx\)'
    C: '\(y=\dfrac1mx\)'
    D: '\(y=-mx\)'
    answer: A
    hint: The new line is perpendicular to the old one.
    explanation: 'The slopes multiply to \(-1\).'
  167:
    topic: s10-3
    question: 'A \(180^\circ\) rotation about the origin takes the line \(y=mx+b\) to'
    A: '\(y=mx-b\)'
    B: '\(y=-mx-b\)'
    C: '\(y=mx+b\)'
    D: '\(y=-mx+b\)'
    answer: A
    hint: 'Replace \((x,y)\) by \((-x,-y)\).'
    explanation: '\(-y=-mx+b\), so \(y=mx-b\).'
  168:
    topic: s10-3
    question: 'A \(180^\circ\) rotation about the origin leaves each of the following unchanged: the ellipse \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1\), the hyperbola \(\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1\), the circle \(x^2+y^2=a^2\), and'
    A: 'the line \(y=mx+b\) (\(b\ne0\))'
    B: no other graph
    C: 'the line \(y=mx\)'
    D: 'the parabola \(y=x^2\)'
    answer: C
    hint: 'Replace \((x,y)\) by \((-x,-y)\) in each equation.'
    explanation: 'The first three involve only \(x^2\) and \(y^2\); \(y=mx\) maps to itself, but \(y=mx+b\) becomes \(y=mx-b\).'
  169:
    topic: s10-3
    question: 'The hyperbola \(xy=a\) (\(a>0\)) has eccentricity'
    A: '\(\dfrac{\sqrt2}2\)'
    B: '\(2\)'
    C: '\(\sqrt2\)'
    D: '\(1\)'
    answer: C
    hint: 'Rotating through \(45^\circ\) gives \(x''^2-y''^2=2a\), a hyperbola with equal semi-axes.'
    explanation: 'For \(a^2=b^2\): \(c=\sqrt2a\), \(e=\sqrt2\).'
  170:
    topic: s10-3
    question: 'After a \(45^\circ\) rotation, \(xy=a\) becomes'
    A: '\(x''^2-y''^2=a\)'
    B: '\(2x''^2-y''^2=a\)'
    C: '\(x''^2+y''^2=2a\)'
    D: '\(x''^2-y''^2=2a\)'
    answer: D
    hint: '\(xy=\dfrac{x''^2-y''^2}2\).'
    explanation: 'So \(\dfrac{x''^2-y''^2}2=a\).'
  171:
    topic: s10-3
    question: 'The ellipse \(Ax^2+Bxy+Cy^2=1\) with \(B^2-4AC<0\) has area'
    A: '\(\dfrac{\pi}{\sqrt{4AC-B^2}}\)'
    B: '\(\dfrac{2\pi}{\sqrt{AC}}\)'
    C: '\(\dfrac{2\pi}{4AC-B^2}\)'
    D: '\(\dfrac{2\pi}{\sqrt{4AC-B^2}}\)'
    answer: D
    hint: 'Rotate to remove \(xy\): the area is \(\pi ab=\dfrac{\pi}{\sqrt{A''C''}}\) and \(4A''C''=4AC-B^2\).'
    explanation: '\(\dfrac{\pi}{\sqrt{A''C''}}=\dfrac{2\pi}{\sqrt{4A''C''}}\).'
  172:
    topic: s10-3
    question: Under any rotation of the axes about the origin, which quantities are invariant?
    A: '\(A-C\) and \(D\)'
    B: 'only \(A\) and \(C\) separately'
    C: 'only \(B\)'
    D: '\(B^2-4AC\), \(A+C\), and \(D^2+E^2\)'
    answer: D
    hint: 'Use the rotation equations for \(A'', B'', C'', D'', E''\).'
    explanation: Each of these combinations is unchanged; the type of conic therefore does not depend on the rotation.
  173:
    topic: s10-3
    question: 'If \(AC<0\) in \(Ax^2+Bxy+Cy^2+Dx+Ey+F=0\), then the graph (if it is a nondegenerate conic) is'
    A: a hyperbola
    B: a circle
    C: a parabola
    D: an ellipse
    answer: A
    hint: '\(B^2-4AC>B^2\ge0\).'
    explanation: The discriminant is positive.
  174:
    topic: s10-3
    question: 'Which statement about \(Ax^2+Bxy+Cy^2+Dx+Ey+F=0\) is FALSE?'
    A: 'If \(AC<0\) the graph is a hyperbola (if nondegenerate)'
    B: 'If \(B^2-4AC<0\) the graph is an ellipse, a point, or empty'
    C: 'If \(B^2-4AC=0\) the graph can be a parabola or a pair of lines'
    D: 'If \(AC>0\) the graph is always an ellipse'
    answer: D
    hint: 'Find a counterexample with \(AC>0\) and a large \(B\).'
    explanation: '\(x^2+3xy+y^2=1\) has \(AC=1>0\) but \(B^2-4AC=5>0\): a hyperbola.'
  175:
    topic: s10-3
    question: 'The graph of \(x^2+4xy+4y^2+6x+12y+9=0\) is'
    A: 'the line \(x+2y+3=0\)'
    B: two parallel lines
    C: a parabola
    D: an ellipse
    answer: A
    hint: Factor as a square.
    explanation: '\((x+2y+3)^2=0\); the graph is the single line \(2y=-x-3\).'
  176:
    topic: s10-3
    question: 'The graph of \(9x^2+6xy+y^2-12x-4y+4=0\) is'
    A: a parabola
    B: two parallel lines
    C: 'the line \(y=-3x+2\)'
    D: an ellipse
    answer: C
    hint: Look for a perfect square.
    explanation: '\((3x+y-2)^2=0\).'
  177:
    topic: s10-3
    question: 'The graph of \(xy-y-x+1=0\) is'
    A: 'a hyperbola with asymptotes \(x=1\), \(y=1\)'
    B: 'a pair of perpendicular lines \(x=1\) and \(y=1\)'
    C: a parabola
    D: a single point
    answer: B
    hint: 'Factor: \((x-1)(y-1)\).'
    explanation: '\((x-1)(y-1)=0\) gives \(x=1\) or \(y=1\) (a degenerate hyperbola).'
  178:
    topic: s10-3
    question: 'The graph of \(x^2-2xy+y^2=2\) is'
    A: an ellipse
    B: 'two parallel lines \(x-y=\pm\sqrt2\)'
    C: a hyperbola
    D: a parabola
    answer: B
    hint: The left side is a perfect square.
    explanation: '\((x-y)^2=2\), a degenerate parabola.'
  179:
    topic: s10-3
    question: 'The curve \(xy+2x-y=0\) is a'
    A: ellipse
    B: parabola
    C: 'hyperbola, with the rational form \(y=\dfrac{2x}{1-x}\)'
    D: pair of lines
    answer: C
    hint: 'Solve for \(y\): \(y(x-1)=-2x\).'
    explanation: '\(y=-\dfrac{2x}{x-1}\); the graph has asymptotes \(x=1\) and \(y=-2\).'
  180:
    topic: s10-3
    question: 'For \(x^2+4xy+4y^2+6x+12y+9=0\), the graph can be written in the form'
    A: '\(y=2x+3\)'
    B: '\(y=\dfrac{x+3}{2}\)'
    C: '\(2y=-x-3\)'
    D: '\(y=-2x-3\)'
    answer: C
    hint: 'Take the square root of \((x+2y+3)^2=0\).'
    explanation: '\(x+2y+3=0\) gives \(2y=-x-3\).'
  181:
    topic: s10-3
    question: 'For \(9x^2+6xy+y^2-12x-4y+4=0\), the graph can be written as'
    A: '\(y=\dfrac{-x+2}{3}\)'
    B: '\(y=-3x+2\)'
    C: '\(y=-3x-2\)'
    D: '\(y=3x-2\)'
    answer: B
    hint: 'Take the square root of \((3x+y-2)^2=0\).'
    explanation: '\(3x+y-2=0\).'
  182:
    topic: s10-4
    question: 'The path \(x=\cos t\), \(y=\sin t\), \(0\le t\le\pi\) is'
    A: the upper half, traversed clockwise
    B: the full unit circle
    C: the lower half of the unit circle
    D: 'the upper half of the unit circle, traversed counterclockwise from \((1,0)\) to \((-1,0)\)'
    answer: D
    hint: '\(x^2+y^2=1\) and \(y=\sin t\ge0\).'
    explanation: 'At \(t=0\) the point is \((1,0)\); at \(t=\pi\) it is \((-1,0)\).'
  183:
    topic: s10-4
    question: 'The path \(x=\sin(2\pi(1-t))\), \(y=\cos(2\pi(1-t))\), \(0\le t\le1\) is'
    A: the full unit circle traversed once clockwise
    B: the upper half circle
    C: 'the full unit circle traversed once counterclockwise starting at \((0,1)\)'
    D: the circle traversed twice
    answer: C
    hint: '\(x^2+y^2=1\); check the points at \(t=0\) and \(t=\tfrac14\).'
    explanation: 'At \(t=0\): \((0,1)\); at \(t=\tfrac14\): \((\sin\tfrac{3\pi}2,\cos\tfrac{3\pi}2)=(-1,0)\), which is counterclockwise.'
  184:
    topic: s10-4
    question: 'The path \(x=4\cos t\), \(y=5\sin t\), \(0\le t\le\pi\) is'
    A: 'the upper half of \(\dfrac{x^2}{25}+\dfrac{y^2}{16}=1\)'
    B: the right half of the ellipse
    C: 'the whole ellipse \(\dfrac{x^2}{16}+\dfrac{y^2}{25}=1\)'
    D: 'the upper half of the ellipse \(\dfrac{x^2}{16}+\dfrac{y^2}{25}=1\), from \((4,0)\) to \((-4,0)\)'
    answer: D
    hint: 'Eliminate \(t\) with \(\cos^2t+\sin^2t=1\).'
    explanation: '\(y=5\sin t\ge0\) for \(0\le t\le\pi\).'
  185:
    topic: s10-4
    question: 'The path \(x=4\sin t\), \(y=5\cos t\), \(0\le t\le2\pi\) is'
    A: 'the full ellipse \(\dfrac{x^2}{16}+\dfrac{y^2}{25}=1\), traversed clockwise from \((0,5)\)'
    B: the upper half only
    C: 'the ellipse \(\dfrac{x^2}{25}+\dfrac{y^2}{16}=1\)'
    D: 'the full ellipse traversed counterclockwise from \((0,5)\)'
    answer: A
    hint: 'At \(t=0\) the point is \((0,5)\); at \(t=\tfrac\pi2\) it is \((4,0)\).'
    explanation: 'Going from \((0,5)\) to \((4,0)\) is clockwise.'
  186:
    topic: s10-4
    question: 'The path \(x=t\), \(y=\sqrt t\), \(t\ge0\) is'
    A: 'the parabola \(y=x^2\)'
    B: 'the right half of \(x^2=y\)'
    C: 'the upper half of the parabola \(y^2=x\)'
    D: 'the whole parabola \(y^2=x\)'
    answer: C
    hint: '\(y^2=t=x\) and \(y\ge0\).'
    explanation: It starts at the origin and moves up and to the right.
  187:
    topic: s10-4
    question: 'The path \(x=\sec^2t-1\), \(y=\tan t\), \(-\tfrac\pi2<t<\tfrac\pi2\) is'
    A: 'the entire parabola \(x=y^2\)'
    B: 'the upper half of the parabola \(x=y^2\)'
    C: 'the parabola \(y=x^2\)'
    D: 'the hyperbola \(x^2-y^2=1\)'
    answer: A
    hint: '\(\sec^2t-1=\tan^2t\).'
    explanation: '\(x=y^2\), and \(y=\tan t\) takes every real value.'
  188:
    topic: s10-4
    question: 'The path \(x=-\sec t\), \(y=\tan t\), \(-\tfrac\pi2<t<\tfrac\pi2\) is'
    A: 'the upper branch of \(y^2-x^2=1\)'
    B: 'the whole hyperbola \(x^2-y^2=1\)'
    C: 'the left branch of the hyperbola \(x^2-y^2=1\)'
    D: 'the right branch of \(x^2-y^2=1\)'
    answer: C
    hint: '\(\sec^2t-\tan^2t=1\), and \(\sec t>0\) here.'
    explanation: '\(x=-\sec t<0\).'
  189:
    topic: s10-4
    question: 'The path \(x=\csc t\), \(y=\cot t\), \(0<t<\pi\) is'
    A: 'the right branch of the hyperbola \(x^2-y^2=1\)'
    B: 'the upper branch of \(y^2-x^2=1\)'
    C: 'the left branch of \(x^2-y^2=1\)'
    D: the whole hyperbola
    answer: A
    hint: '\(\csc^2t-\cot^2t=1\), and \(\csc t>0\) on \((0,\pi)\).'
    explanation: '\(x\ge1\).'
  190:
    topic: s10-4
    question: 'The path \(x=t\), \(y=\sqrt{4-t^2}\), \(0\le t\le2\) is'
    A: the whole circle
    B: 'a quarter of \(x^2+y^2=2\)'
    C: 'the upper half of the circle \(x^2+y^2=4\)'
    D: 'a quarter of the circle \(x^2+y^2=4\), in the first quadrant'
    answer: D
    hint: '\(x^2+y^2=4\) with \(x,y\ge0\).'
    explanation: 'It runs from \((0,2)\) to \((2,0)\).'
  191:
    topic: s10-4
    question: 'The path \(x=t^2\), \(y=\sqrt{t^4+1}\), \(t\ge0\) is'
    A: 'the parabola \(y=x^2+1\)'
    B: 'the right branch of \(x^2-y^2=1\)'
    C: 'the whole upper branch of \(y^2-x^2=1\)'
    D: 'the part of the upper branch of \(y^2-x^2=1\) with \(x\ge0\)'
    answer: D
    hint: '\(y^2-x^2=t^4+1-t^4=1\).'
    explanation: '\(x=t^2\ge0\) and \(y\ge1\).'
  192:
    topic: s10-4
    question: 'The path \(x=-\cosh t\), \(y=\sinh t\), \(-\infty<t<\infty\) is'
    A: 'the right branch of \(x^2-y^2=1\)'
    B: 'the upper branch of \(y^2-x^2=1\)'
    C: 'the left branch of \(x^2-y^2=1\)'
    D: the unit circle
    answer: C
    hint: '\(\cosh^2t-\sinh^2t=1\).'
    explanation: '\(x=-\cosh t\le-1\).'
  193:
    topic: s10-4
    question: 'The path \(x=2\sinh t\), \(y=2\cosh t\), \(-\infty<t<\infty\) is'
    A: 'the right branch of \(x^2-y^2=4\)'
    B: 'the upper branch of \(y^2-x^2=4\)'
    C: 'the lower branch of \(y^2-x^2=4\)'
    D: the whole hyperbola
    answer: B
    hint: '\(y^2-x^2=4\left(\cosh^2t-\sinh^2t\right)=4\).'
    explanation: '\(y=2\cosh t\ge2\).'
  194:
    topic: s10-4
    question: 'The path \(x=2t+3\), \(y=t^2-1\), \(-2\le t\le2\) is'
    A: 'part of the parabola \(y=x^2-1\)'
    B: a straight segment
    C: 'part of the parabola \((x+3)^2=4(y-1)\)'
    D: 'part of the parabola \((x-3)^2=4(y+1)\)'
    answer: D
    hint: 'Solve \(t=\dfrac{x-3}2\) and substitute into \(y\).'
    explanation: '\(y+1=\dfrac{(x-3)^2}4\).'
  195:
    topic: s10-4
    question: 'A hypocycloid (a circle of radius \(\tfrac a4\) rolling inside \(x^2+y^2=a^2\)) is the astroid with parametric equations'
    A: '\(x=a\cos^2\theta\), \(y=a\sin^2\theta\)'
    B: '\(x=a\sin^3\theta\), \(y=a\cos^3\theta\) traversed clockwise'
    C: '\(x=a\cos\theta\), \(y=a\sin\theta\)'
    D: '\(x=a\cos^3\theta\), \(y=a\sin^3\theta\)'
    answer: D
    hint: 'Take \(b=\tfrac a4\) in the general hypocycloid equations.'
    explanation: 'The curve is \(x^{2/3}+y^{2/3}=a^{2/3}\), which has four cusps.'
  196:
    topic: s10-4
    question: 'A wheel of radius \(a\) rolls along a horizontal line. A point \(P\) on a spoke \(b\) units from the center traces \(x=a\theta-b\sin\theta\), \(y=a-b\cos\theta\). The curve is a cycloid when'
    A: '\(b=2a\)'
    B: '\(b=0\)'
    C: '\(b=\dfrac a2\)'
    D: '\(b=a\)'
    answer: D
    hint: The point must lie on the rim.
    explanation: 'For \(b=a\): \(x=a(\theta-\sin\theta)\), \(y=a(1-\cos\theta)\).'
  197:
    topic: s10-4
    question: 'The cycloid \(x=t-\sin t\), \(y=1-\cos t\) has cusps (points where it touches the \(x\)-axis) at'
    A: '\(t=\dfrac{\pi}{2}+\pi k\)'
    B: '\(t=\pi k\) for integers \(k\)'
    C: '\(t=2\pi k\) for integers \(k\)'
    D: '\(t=0\) only'
    answer: C
    hint: 'The cusps are where \(y=0\), i.e., \(\cos t=1\).'
    explanation: 'One arch runs over \(0\le t\le2\pi\), with width \(2\pi\) and height \(2\).'
  198:
    topic: s10-4
    question: 'The point on the parabola \(x=t\), \(y=t^2\) closest to \(\left(2,\tfrac12\right)\) is'
    A: '\(\left(\tfrac12,\tfrac14\right)\)'
    B: '\((2,4)\)'
    C: '\((0,0)\)'
    D: '\((1,1)\)'
    answer: D
    hint: 'Minimize \(d^2=(t-2)^2+\left(t^2-\tfrac12\right)^2\).'
    explanation: '\(\dfrac{d(d^2)}{dt}=2(t-2)+4t\left(t^2-\tfrac12\right)=4t^3-4\), so \(t=1\).'
  199:
    topic: s10-4
    question: 'The point on the ellipse \(x=2\cos t\), \(y=\sin t\) closest to \(\left(\tfrac34,0\right)\) is'
    A: '\(\left(\tfrac34,\ \pm\dfrac{\sqrt{55}}{8}\right)\)'
    B: '\(\left(1,\ \pm\dfrac{\sqrt3}2\right)\)'
    C: '\(\left(0,\ \pm1\right)\)'
    D: '\(\left(2,0\right)\)'
    answer: B
    hint: '\(d^2=3\cos^2t-3\cos t+\tfrac{25}{16}\).'
    explanation: 'The minimum is at \(\cos t=\tfrac12\), so \(x=1\) and \(y=\pm\tfrac{\sqrt3}2\); \(d^2=\tfrac{13}{16}\).'
  200:
    topic: s10-4
    question: 'A deltoid is traced by \(x=2\cos t+\cos2t\), \(y=2\sin t-\sin2t\), \(0\le t\le2\pi\). It has'
    A: three cusps
    B: four cusps
    C: two cusps
    D: no cusps
    answer: A
    hint: It is a hypocycloid generated by a circle one-third the size of the fixed circle.
    explanation: 'Replacing \(2\) with \(-2\) in the equations turns it into a different curve.'
  201:
    topic: s10-4
    question: 'The parametric equations \(x=\cos t\), \(y=\sin t\) (\(0\le t\le2\pi\)) and \(x=\cos2t\), \(y=\sin2t\) (\(0\le t\le\pi\)) trace'
    A: the same circle at the same speed
    B: the same unit circle, but the second moves twice as fast
    C: different circles
    D: a circle and an ellipse
    answer: B
    hint: Eliminate the parameter.
    explanation: 'Both satisfy \(x^2+y^2=1\).'
  202:
    topic: s10-5
    question: 'Which pair of polar coordinates labels the same point as \((3,0)\)?'
    A: '\((-3,0)\)'
    B: '\((3,\pi)\)'
    C: '\((-3,\pi)\)'
    D: '\((-3,\tfrac\pi2)\)'
    answer: C
    hint: '\((-r,\theta+\pi)\) labels the same point as \((r,\theta)\).'
    explanation: '\((-3,\pi)\) lies \(3\) units from the origin in the direction opposite \(\pi\), i.e. at \((3,0)\).'
  203:
    topic: s10-5
    question: 'Which pair of polar coordinates labels the same point as \((-3,0)\)?'
    A: '\((-3,2\pi)\)'
    B: '\((-3,\pi)\)'
    C: '\((3,2\pi)\)'
    D: '\((3,\tfrac\pi2)\)'
    answer: A
    hint: 'Adding \(2\pi\) to the angle gives the same point.'
    explanation: 'Both give the Cartesian point \((-3,0)\).'
  204:
    topic: s10-5
    question: 'Which pair labels the same point as \((2,\tfrac{2\pi}3)\)?'
    A: '\((-2,-\tfrac\pi3)\)'
    B: '\((-2,\tfrac{2\pi}3)\)'
    C: '\((2,\tfrac\pi3)\)'
    D: '\((2,\tfrac{7\pi}3)\)'
    answer: A
    hint: 'Use \((-r,\theta+\pi)\), then subtract \(2\pi\).'
    explanation: '\(\tfrac{2\pi}3+\pi-2\pi=-\tfrac\pi3\).'
  205:
    topic: s10-5
    question: 'Which pair labels the same point as \((2,\tfrac\pi3)\)?'
    A: '\((-2,\tfrac{2\pi}3)\)'
    B: '\((-2,\tfrac\pi3)\)'
    C: '\((2,-\tfrac\pi3)\)'
    D: '\((2,\tfrac{7\pi}3)\)'
    answer: D
    hint: 'Adding \(2\pi\) to the angle does not change the point.'
    explanation: '\(\tfrac\pi3+2\pi=\tfrac{7\pi}3\).'
  206:
    topic: s10-5
    question: 'All polar coordinates of the point \((2,\tfrac\pi2)\) are'
    A: '\((2,\tfrac\pi2+2n\pi)\) only'
    B: '\((2,\tfrac\pi2+2n\pi)\) and \((-2,\tfrac{3\pi}2+2n\pi)\)'
    C: '\((2,\tfrac\pi2+n\pi)\)'
    D: '\((-2,\tfrac\pi2+2n\pi)\)'
    answer: B
    hint: 'Add multiples of \(2\pi\); also use a negative \(r\) with \(\theta+\pi\).'
    explanation: The same point has infinitely many labels.
  207:
    topic: s10-5
    question: All polar coordinates of the origin are
    A: '\((r,0)\) for any \(r\)'
    B: '\((0,2n\pi)\) only'
    C: '\((0,\theta)\) for any \(\theta\)'
    D: '\((0,0)\) only'
    answer: C
    hint: 'At \(r=0\) the angle is irrelevant.'
    explanation: The origin is the pole; every angle describes it.
  208:
    topic: s10-5
    question: 'The Cartesian coordinates of the polar point \(\left(\sqrt2,\tfrac\pi4\right)\) are'
    A: '\((-1,\ -1)\)'
    B: '\((1,\ 1)\)'
    C: '\((1,\ -1)\)'
    D: '\((-1,\ 1)\)'
    answer: B
    hint: '\(x=r\cos\theta\), \(y=r\sin\theta\).'
    explanation: '\(x=1\), \(y=1\).'
  209:
    topic: s10-5
    question: 'The Cartesian coordinates of the polar point \(\left(-3,\tfrac{5\pi}6\right)\) are'
    A: '\((- \frac{3 \sqrt{3}}{2},\ - \frac{3}{2})\)'
    B: '\((\frac{3 \sqrt{3}}{2},\ \frac{3}{2})\)'
    C: '\((- \frac{3}{2},\ \frac{3 \sqrt{3}}{2})\)'
    D: '\((\frac{3 \sqrt{3}}{2},\ - \frac{3}{2})\)'
    answer: D
    hint: '\(x=r\cos\theta\), \(y=r\sin\theta\).'
    explanation: '\(x=\frac{3 \sqrt{3}}{2}\), \(y=- \frac{3}{2}\).'
  210:
    topic: s10-5
    question: 'The Cartesian coordinates of the polar point \(\left(2\sqrt3,\tfrac{2\pi}3\right)\) are'
    A: '\((- \sqrt{3},\ -3)\)'
    B: '\((- \sqrt{3},\ 3)\)'
    C: '\((\sqrt{3},\ 3)\)'
    D: '\((3,\ - \sqrt{3})\)'
    answer: B
    hint: '\(x=r\cos\theta\), \(y=r\sin\theta\).'
    explanation: '\(x=- \sqrt{3}\), \(y=3\).'
  211:
    topic: s10-5
    question: 'The Cartesian coordinates of the polar point \(\left(-\sqrt2,\tfrac\pi4\right)\) are'
    A: '\((1,\ 1)\)'
    B: '\((-1,\ 1)\)'
    C: '\((-1,\ -1)\)'
    D: '\((1,\ -1)\)'
    answer: C
    hint: '\(x=r\cos\theta\), \(y=r\sin\theta\).'
    explanation: '\(x=-1\), \(y=-1\).'
  212:
    topic: s10-5
    question: 'The Cartesian coordinates of the polar point \(\left(5,\tan^{-1}\tfrac43\right)\) are'
    A: '\((5,0)\)'
    B: '\((3,4)\)'
    C: '\((4,3)\)'
    D: '\((-3,-4)\)'
    answer: B
    hint: '\(\cos\theta=\tfrac35\), \(\sin\theta=\tfrac45\) when \(\tan\theta=\tfrac43\) in Quadrant I.'
    explanation: '\(x=5\cdot\tfrac35=3\), \(y=5\cdot\tfrac45=4\).'
  213:
    topic: s10-5
    question: 'The Cartesian coordinates of the polar point \((-1,7\pi)\) are'
    A: '\((0,-1)\)'
    B: '\((0,1)\)'
    C: '\((1,0)\)'
    D: '\((-1,0)\)'
    answer: C
    hint: '\(\cos7\pi=-1\) and \(\sin7\pi=0\).'
    explanation: '\(x=(-1)(-1)=1\), \(y=0\).'
  214:
    topic: s10-5
    question: 'The Cartesian coordinates of the polar point \((0,\tfrac\pi2)\) are'
    A: '\((0,0)\)'
    B: '\((0,\tfrac\pi2)\)'
    C: '\((1,0)\)'
    D: '\((0,1)\)'
    answer: A
    hint: '\(r=0\).'
    explanation: 'Any point with \(r=0\) is the origin.'
  215:
    topic: s10-5
    question: 'The set of points with polar coordinates satisfying \(r=2\) is'
    A: 'a vertical line \(x=2\)'
    B: 'a circle of radius \(2\) centered at the origin'
    C: a ray from the origin
    D: 'the disk of radius \(2\)'
    answer: B
    hint: '\(r\) is the distance from the origin.'
    explanation: 'All points at distance \(2\).'
  216:
    topic: s10-5
    question: 'The inequality \(1\le r\le2\) describes'
    A: 'the closed annulus between the circles of radius \(1\) and \(2\)'
    B: 'a disk of radius \(2\)'
    C: a circle
    D: 'the outside of the circle \(r=1\)'
    answer: A
    hint: 'Distance from the origin between \(1\) and \(2\).'
    explanation: It is a ring.
  217:
    topic: s10-5
    question: 'The set \(0\le\theta\le\tfrac\pi6\), \(r\ge0\) is'
    A: 'the ray \(\theta=\tfrac\pi6\)'
    B: the whole first quadrant
    C: 'an infinite wedge (sector) in the first quadrant between the \(x\)-axis and the ray \(\theta=\tfrac\pi6\)'
    D: a finite sector of a disk
    answer: C
    hint: 'Angles between \(0\) and \(\tfrac\pi6\) with unlimited \(r\).'
    explanation: The wedge extends without bound.
  218:
    topic: s10-5
    question: 'The set \(\theta=\tfrac\pi2\), \(r\ge0\) is'
    A: 'the whole \(y\)-axis'
    B: 'the point \((0,\tfrac\pi2)\)'
    C: 'the positive \(y\)-axis (a ray)'
    D: 'the positive \(x\)-axis'
    answer: C
    hint: 'Fixed angle, \(r\) nonnegative.'
    explanation: It points straight up from the origin.
  219:
    topic: s10-5
    question: 'The set \(\theta=\tfrac\pi2\), \(r\le0\) is'
    A: 'the whole \(y\)-axis'
    B: 'the negative \(x\)-axis'
    C: 'the negative \(y\)-axis (a ray)'
    D: 'the positive \(y\)-axis'
    answer: C
    hint: 'A negative \(r\) points opposite the angle.'
    explanation: 'Opposite \(\tfrac\pi2\) is straight down.'
  220:
    topic: s10-5
    question: 'The set \(0\le\theta\le\pi\), \(r=-1\) is'
    A: the lower half of the unit circle
    B: 'a segment on the \(x\)-axis'
    C: the upper half of the unit circle
    D: the whole unit circle
    answer: A
    hint: '\(r=-1\) reflects each point through the origin.'
    explanation: '\((-1,\theta)=(1,\theta+\pi)\), and \(\theta+\pi\in[\pi,2\pi]\).'
  221:
    topic: s10-5
    question: 'The inequality \(0\le\theta\le\pi\), \(r=1\) describes'
    A: the upper half of the unit circle
    B: the whole unit circle
    C: the lower half of the unit circle
    D: the unit disk
    answer: A
    hint: '\(r=1\) with angles from \(0\) to \(\pi\).'
    explanation: '\(y=\sin\theta\ge0\).'
  222:
    topic: s10-5
    question: 'The polar equation \(r\cos\theta=2\) is equivalent to'
    A: 'the line \(y=x+2\)'
    B: 'the line \(x=2\)'
    C: 'the line \(y=2\)'
    D: 'the circle \(x^2+y^2=2\)'
    answer: B
    hint: '\(x=r\cos\theta\).'
    explanation: It is a vertical line.
  223:
    topic: s10-5
    question: 'The polar equation \(r\sin\theta=-1\) is equivalent to'
    A: 'the line \(y=1\)'
    B: 'the circle \(x^2+y^2=1\)'
    C: 'the line \(x=-1\)'
    D: 'the line \(y=-1\)'
    answer: D
    hint: '\(y=r\sin\theta\).'
    explanation: A horizontal line.
  224:
    topic: s10-5
    question: 'The polar equation \(r\sin\theta=0\) is equivalent to'
    A: 'the \(x\)-axis'
    B: 'the \(y\)-axis'
    C: the origin only
    D: 'the line \(y=x\)'
    answer: A
    hint: '\(y=0\).'
    explanation: 'All points with \(y=0\).'
  225:
    topic: s10-5
    question: 'The polar equation \(r\cos\theta=0\) is equivalent to'
    A: the origin only
    B: 'the \(y\)-axis'
    C: 'the \(x\)-axis'
    D: 'the line \(y=x\)'
    answer: B
    hint: '\(x=0\).'
    explanation: 'All points with \(x=0\).'
  226:
    topic: s10-5
    question: 'The polar equation \(r=4\csc\theta\) is equivalent to'
    A: 'the line \(y=-4\)'
    B: 'the line \(y=4\)'
    C: 'the circle \(x^2+y^2=16\)'
    D: 'the line \(x=4\)'
    answer: B
    hint: 'Multiply by \(\sin\theta\).'
    explanation: '\(r\sin\theta=4\).'
  227:
    topic: s10-5
    question: 'The polar equation \(r=-3\sec\theta\) is equivalent to'
    A: 'the circle \(x^2+y^2=9\)'
    B: 'the line \(x=-3\)'
    C: 'the line \(x=3\)'
    D: 'the line \(y=-3\)'
    answer: B
    hint: 'Multiply by \(\cos\theta\).'
    explanation: '\(r\cos\theta=-3\).'
  228:
    topic: s10-5
    question: 'The polar equation \(r\cos\theta+r\sin\theta=1\) is equivalent to'
    A: 'the line \(x-y=1\)'
    B: 'the circle \(x^2+y^2=1\)'
    C: 'the line \(y=x\)'
    D: 'the line \(x+y=1\)'
    answer: D
    hint: 'Substitute \(x\) and \(y\).'
    explanation: '\(x+y=1\).'
  229:
    topic: s10-5
    question: 'The polar equation \(r\sin\theta=r\cos\theta\) is equivalent to'
    A: 'the line \(y=-x\)'
    B: the unit circle
    C: 'the \(x\)-axis'
    D: 'the line \(y=x\) (together with the origin)'
    answer: D
    hint: '\(y=x\).'
    explanation: Both sides vanish at the origin.
  230:
    topic: s10-5
    question: 'The polar equation \(r^2=1\) is equivalent to'
    A: 'the circle \(x^2+y^2=1\)'
    B: 'the circle \(x^2+y^2=2\)'
    C: 'the point \((1,0)\)'
    D: 'the line \(x=1\)'
    answer: A
    hint: '\(r^2=x^2+y^2\).'
    explanation: Unit circle.
  231:
    topic: s10-5
    question: 'The polar equation \(r^2=4r\sin\theta\) is equivalent to'
    A: 'the circle \(x^2+y^2=4\)'
    B: 'the circle \((x-2)^2+y^2=4\)'
    C: 'the circle \(x^2+(y-2)^2=4\)'
    D: 'the circle \(x^2+(y+2)^2=4\)'
    answer: C
    hint: '\(x^2+y^2=4y\).'
    explanation: 'Complete the square in \(y\).'
  232:
    topic: s10-5
    question: 'The polar equation \(r=\dfrac5{\sin\theta-2\cos\theta}\) is equivalent to'
    A: 'the circle \(x^2+y^2=25\)'
    B: 'the line \(y=\dfrac x2+5\)'
    C: 'the line \(y=2x+5\)'
    D: 'the line \(y=-2x+5\)'
    answer: C
    hint: 'Clear the denominator: \(r\sin\theta-2r\cos\theta=5\).'
    explanation: '\(y-2x=5\).'
  233:
    topic: s10-5
    question: 'The polar equation \(r^2\sin2\theta=2\) is equivalent to'
    A: 'the circle \(x^2+y^2=2\)'
    B: 'the hyperbola \(xy=2\)'
    C: 'the hyperbola \(xy=1\)'
    D: 'the parabola \(y=x^2\)'
    answer: C
    hint: '\(\sin2\theta=2\sin\theta\cos\theta\).'
    explanation: '\(2r^2\sin\theta\cos\theta=2xy=2\).'
  234:
    topic: s10-5
    question: 'The polar equation \(r=\cot\theta\csc\theta\) is equivalent to'
    A: 'the parabola \(x^2=y\)'
    B: 'the hyperbola \(xy=1\)'
    C: 'the parabola \(y^2=x\)'
    D: 'the circle \(x^2+y^2=1\)'
    answer: C
    hint: 'Multiply by \(r\sin^2\theta\): \(r\sin^2\theta=\cos\theta\).'
    explanation: '\(r^2\sin^2\theta=r\cos\theta\) gives \(y^2=x\).'
  235:
    topic: s10-5
    question: 'The polar equation \(r=4\tan\theta\sec\theta\) is equivalent to'
    A: 'the circle \(x^2+y^2=16\)'
    B: 'the parabola \(x^2=4y\)'
    C: 'the line \(y=4x\)'
    D: 'the parabola \(y^2=4x\)'
    answer: B
    hint: '\(r\cos^2\theta=4\sin\theta\).'
    explanation: '\(r^2\cos^2\theta=4r\sin\theta\).'
  236:
    topic: s10-5
    question: 'The polar equation \(r=\csc\theta\,e^{r\cos\theta}\) is equivalent to'
    A: 'the curve \(y=e^x\)'
    B: 'the line \(y=x+1\)'
    C: 'the curve \(x=e^y\)'
    D: 'the curve \(y=\ln x\)'
    answer: A
    hint: 'Multiply by \(\sin\theta\).'
    explanation: '\(r\sin\theta=e^{r\cos\theta}\).'
  237:
    topic: s10-5
    question: 'The polar equation \(r\sin\theta=\ln r+\ln\cos\theta\) is equivalent to'
    A: 'the curve \(y=\ln x\)'
    B: 'the curve \(y=\ln y\)'
    C: 'the line \(y=x\)'
    D: 'the curve \(y=e^x\)'
    answer: A
    hint: Combine the logarithms.
    explanation: '\(\ln r+\ln\cos\theta=\ln(r\cos\theta)=\ln x\).'
  238:
    topic: s10-5
    question: 'The polar equation \(r^2+2r^2\cos\theta\sin\theta=1\) is equivalent to'
    A: 'the pair of lines \(x+y=\pm1\)'
    B: 'the hyperbola \(xy=1\)'
    C: 'the line \(x+y=1\)'
    D: 'the circle \(x^2+y^2=1\)'
    answer: A
    hint: '\(x^2+y^2+2xy=1\).'
    explanation: '\((x+y)^2=1\).'
  239:
    topic: s10-5
    question: 'The polar equation \(\cos^2\theta=\sin^2\theta\) is equivalent to'
    A: 'the circle \(x^2+y^2=1\)'
    B: 'the hyperbola \(x^2-y^2=1\)'
    C: 'the pair of lines \(y=\pm x\)'
    D: 'the line \(y=x\) only'
    answer: C
    hint: '\(\tan^2\theta=1\).'
    explanation: '\(y^2=x^2\).'
  240:
    topic: s10-5
    question: 'The polar equation \(r^2=-4r\cos\theta\) is equivalent to'
    A: 'the circle \((x-2)^2+y^2=4\)'
    B: 'the circle \((x+2)^2+y^2=4\)'
    C: 'the circle \(x^2+(y+2)^2=4\)'
    D: 'the circle \(x^2+y^2=4\)'
    answer: B
    hint: '\(x^2+y^2=-4x\).'
    explanation: Complete the square.
  241:
    topic: s10-5
    question: 'The polar equation \(r^2=-6r\sin\theta\) is equivalent to'
    A: 'the circle \(x^2+y^2=9\)'
    B: 'the circle \(x^2+(y+3)^2=9\)'
    C: 'the circle \((x+3)^2+y^2=9\)'
    D: 'the circle \(x^2+(y-3)^2=9\)'
    answer: B
    hint: '\(x^2+y^2=-6y\).'
    explanation: Complete the square.
  242:
    topic: s10-5
    question: 'The polar equation \(r=8\sin\theta\) is equivalent to'
    A: 'the circle \(x^2+(y-8)^2=64\)'
    B: 'the circle \(x^2+y^2=64\)'
    C: 'the circle \(x^2+(y-4)^2=16\)'
    D: 'the circle \((x-4)^2+y^2=16\)'
    answer: C
    hint: 'Multiply by \(r\).'
    explanation: '\(x^2+y^2=8y\).'
  243:
    topic: s10-5
    question: 'The polar equation \(r=3\cos\theta\) is equivalent to'
    A: 'the circle \(x^2+\left(y-\tfrac32\right)^2=\tfrac94\)'
    B: 'the circle \(\left(x-\tfrac32\right)^2+y^2=\tfrac94\)'
    C: 'the circle \(x^2+y^2=9\)'
    D: 'the circle \((x-3)^2+y^2=9\)'
    answer: B
    hint: 'Multiply by \(r\): \(x^2+y^2=3x\).'
    explanation: Complete the square.
  244:
    topic: s10-5
    question: 'The polar equation \(r=2\cos\theta+2\sin\theta\) is equivalent to'
    A: 'the circle \((x-1)^2+(y-1)^2=2\)'
    B: 'the line \(x+y=2\)'
    C: 'the circle \((x-1)^2+(y-1)^2=4\)'
    D: 'the circle \((x-2)^2+(y-2)^2=2\)'
    answer: A
    hint: 'Multiply by \(r\).'
    explanation: '\(x^2+y^2=2x+2y\).'
  245:
    topic: s10-5
    question: 'The polar equation \(r=2\cos\theta-\sin\theta\) is equivalent to'
    A: 'the line \(2x-y=1\)'
    B: 'the circle \((x-1)^2+\left(y+\tfrac12\right)^2=\tfrac54\)'
    C: 'the circle \((x+1)^2+\left(y-\tfrac12\right)^2=\tfrac54\)'
    D: 'the circle \((x-2)^2+(y+1)^2=5\)'
    answer: B
    hint: 'Multiply by \(r\).'
    explanation: '\(x^2+y^2=2x-y\).'
  246:
    topic: s10-5
    question: 'The polar equation \(r\sin\left(\theta+\tfrac\pi6\right)=2\) is equivalent to'
    A: 'the line \(x-\sqrt3y=4\)'
    B: 'the line \(\sqrt3x+y=4\)'
    C: 'the line \(x+\sqrt3y=4\)'
    D: 'the line \(x+\sqrt3y=2\)'
    answer: C
    hint: 'Expand \(\sin(\theta+\tfrac\pi6)\).'
    explanation: '\(\tfrac{\sqrt3}2y+\tfrac12x=2\).'
  247:
    topic: s10-5
    question: 'The polar equation \(r\sin\left(\tfrac{2\pi}3-\theta\right)=5\) is equivalent to'
    A: 'the line \(\sqrt3x-y=10\)'
    B: 'the line \(\sqrt3x+y=10\)'
    C: 'the line \(x+\sqrt3y=10\)'
    D: 'the line \(\sqrt3x+y=5\)'
    answer: B
    hint: '\(\sin(\tfrac{2\pi}3-\theta)=\tfrac{\sqrt3}2\cos\theta+\tfrac12\sin\theta\).'
    explanation: '\(\tfrac{\sqrt3}2x+\tfrac12y=5\).'
  248:
    topic: s10-5
    question: 'The Cartesian equation \(x=7\) has the polar form'
    A: '\(r=7\csc\theta\)'
    B: '\(r=7\sec\theta\)'
    C: '\(r=7\)'
    D: '\(\theta=7\)'
    answer: B
    hint: '\(x=r\cos\theta\).'
    explanation: '\(r\cos\theta=7\).'
  249:
    topic: s10-5
    question: 'The Cartesian equation \(y=1\) has the polar form'
    A: '\(\theta=1\)'
    B: '\(r=1\)'
    C: '\(r=\csc\theta\)'
    D: '\(r=\sec\theta\)'
    answer: C
    hint: '\(y=r\sin\theta\).'
    explanation: '\(r\sin\theta=1\).'
  250:
    topic: s10-5
    question: 'The Cartesian equation \(x=y\) has the polar form'
    A: '\(r=1\)'
    B: '\(\theta=\dfrac{3\pi}4\)'
    C: '\(\theta=\dfrac\pi2\)'
    D: '\(\theta=\dfrac\pi4\)'
    answer: D
    hint: '\(\tan\theta=1\).'
    explanation: 'The line through the origin at \(45^\circ\).'
  251:
    topic: s10-5
    question: 'The Cartesian equation \(x-y=3\) has the polar form'
    A: '\(r(\cos\theta-\sin\theta)=3\)'
    B: '\(r(\cos\theta+\sin\theta)=3\)'
    C: '\(r(\sin\theta-\cos\theta)=3\)'
    D: '\(r=3\)'
    answer: A
    hint: 'Substitute \(x\) and \(y\).'
    explanation: '\(r\cos\theta-r\sin\theta=3\).'
  252:
    topic: s10-5
    question: 'The Cartesian equation \(x^2+y^2=4\) has the polar form'
    A: '\(r=2\)'
    B: '\(r=4\)'
    C: '\(r=2\cos\theta\)'
    D: '\(r=\sqrt2\)'
    answer: A
    hint: '\(r^2=x^2+y^2\).'
    explanation: '\(r^2=4\) with \(r=2\).'
  253:
    topic: s10-5
    question: 'The Cartesian equation \(x^2-y^2=1\) has the polar form'
    A: '\(r^2=\cos2\theta\)'
    B: '\(r^2\cos2\theta=1\)'
    C: '\(r=\cos2\theta\)'
    D: '\(r^2\sin2\theta=1\)'
    answer: B
    hint: '\(\cos^2\theta-\sin^2\theta=\cos2\theta\).'
    explanation: '\(r^2\left(\cos^2\theta-\sin^2\theta\right)=1\).'
  254:
    topic: s10-5
    question: 'The Cartesian equation \(xy=2\) has the polar form'
    A: '\(r^2\cos2\theta=4\)'
    B: '\(r^2\sin2\theta=2\)'
    C: '\(r\sin2\theta=4\)'
    D: '\(r^2\sin2\theta=4\)'
    answer: D
    hint: '\(xy=r^2\sin\theta\cos\theta\).'
    explanation: '\(\tfrac{r^2}2\sin2\theta=2\).'
  255:
    topic: s10-5
    question: 'The Cartesian equation \(y^2=4x\) has the polar form'
    A: '\(r=4\cos\theta\)'
    B: '\(r^2=4\cos\theta\)'
    C: '\(r=\dfrac{4\sin\theta}{\cos^2\theta}\)'
    D: '\(r=\dfrac{4\cos\theta}{\sin^2\theta}\)'
    answer: D
    hint: '\(r^2\sin^2\theta=4r\cos\theta\).'
    explanation: 'Divide by \(r\sin^2\theta\).'
  256:
    topic: s10-5
    question: 'The Cartesian equation \(x^2+(y-2)^2=4\) has the polar form'
    A: '\(r=2\)'
    B: '\(r=4\sin\theta\)'
    C: '\(r=2\sin\theta\)'
    D: '\(r=4\cos\theta\)'
    answer: B
    hint: 'Expand and use \(x^2+y^2=r^2\).'
    explanation: '\(r^2=4r\sin\theta\).'
  257:
    topic: s10-5
    question: 'The Cartesian equation \((x-5)^2+y^2=25\) has the polar form'
    A: '\(r=10\sin\theta\)'
    B: '\(r=5\cos\theta\)'
    C: '\(r=10\cos\theta\)'
    D: '\(r=5\)'
    answer: C
    hint: 'Expand: \(x^2+y^2=10x\).'
    explanation: '\(r^2=10r\cos\theta\).'
  258:
    topic: s10-5
    question: 'The Cartesian equation \(x^2+xy+y^2=1\) has the polar form'
    A: '\(r^2(1+\sin2\theta)=1\)'
    B: '\(r^2(1-\sin\theta\cos\theta)=1\)'
    C: '\(r^2(1+\sin\theta\cos\theta)=1\)'
    D: '\(r(1+\sin\theta\cos\theta)=1\)'
    answer: C
    hint: '\(xy=r^2\sin\theta\cos\theta\).'
    explanation: '\(r^2+r^2\sin\theta\cos\theta=1\).'
  259:
    topic: s10-5
    question: 'The Cartesian equation \((x-3)^2+(y+1)^2=4\) has the polar form'
    A: '\(r^2-6r\cos\theta+2r\sin\theta-6=0\)'
    B: '\(r^2+6r\cos\theta-2r\sin\theta+6=0\)'
    C: '\(r^2-6r\cos\theta-2r\sin\theta+6=0\)'
    D: '\(r^2-6r\cos\theta+2r\sin\theta+6=0\)'
    answer: D
    hint: 'Expand: \(x^2+y^2-6x+2y+6=0\).'
    explanation: 'Replace \(x,y\) with \(r\cos\theta,r\sin\theta\).'
  260:
    topic: s10-5
    question: 'The Cartesian equation \((x+2)^2+(y-5)^2=16\) has the polar form'
    A: '\(r^2+4r\cos\theta+10r\sin\theta+13=0\)'
    B: '\(r^2+4r\cos\theta-10r\sin\theta+13=0\)'
    C: '\(r^2+4r\cos\theta-10r\sin\theta-13=0\)'
    D: '\(r^2-4r\cos\theta+10r\sin\theta+13=0\)'
    answer: B
    hint: 'Expand: \(x^2+y^2+4x-10y+13=0\).'
    explanation: 'Replace \(x,y\) with \(r\cos\theta,r\sin\theta\).'
  261:
    topic: s10-5
    question: 'Every vertical line \(x=a\) has a polar equation of the form'
    A: '\(r=a\csc\theta\)'
    B: '\(r=a\sec\theta\)'
    C: '\(\theta=a\)'
    D: '\(r=a\cos\theta\)'
    answer: B
    hint: '\(x=r\cos\theta\).'
    explanation: '\(r\cos\theta=a\).'
  262:
    topic: s10-5
    question: 'Every horizontal line \(y=b\) has a polar equation of the form'
    A: '\(\theta=b\)'
    B: '\(r=b\sec\theta\)'
    C: '\(r=b\sin\theta\)'
    D: '\(r=b\csc\theta\)'
    answer: D
    hint: '\(y=r\sin\theta\).'
    explanation: '\(r\sin\theta=b\).'
  263:
    topic: s10-6
    question: 'The graph of \(r=1+\cos\theta\) is symmetric about'
    A: 'the \(x\)-axis'
    B: 'the \(y\)-axis'
    C: the origin
    D: both axes and the origin
    answer: A
    hint: '\(\cos(-\theta)=\cos\theta\).'
    explanation: 'Replacing \(\theta\) by \(-\theta\) leaves the equation unchanged (cardioid).'
  264:
    topic: s10-6
    question: 'The graph of \(r=2-2\cos\theta\) is symmetric about'
    A: both axes and the origin
    B: 'the \(x\)-axis'
    C: 'the \(y\)-axis'
    D: the origin
    answer: B
    hint: '\(\cos(-\theta)=\cos\theta\).'
    explanation: 'A cardioid opening along the \(x\)-axis.'
  265:
    topic: s10-6
    question: 'The graph of \(r=1-\sin\theta\) is symmetric about'
    A: 'the \(y\)-axis'
    B: 'the \(x\)-axis'
    C: the origin
    D: both axes and the origin
    answer: A
    hint: '\(\sin(\pi-\theta)=\sin\theta\).'
    explanation: 'Replacing \(\theta\) by \(\pi-\theta\) leaves the equation unchanged.'
  266:
    topic: s10-6
    question: 'The graph of \(r=2+\sin\theta\) is symmetric about'
    A: both axes and the origin
    B: 'the \(x\)-axis'
    C: 'the \(y\)-axis'
    D: the origin
    answer: C
    hint: '\(\sin(\pi-\theta)=\sin\theta\).'
    explanation: 'It is a limaçon (oval) with symmetry about the \(y\)-axis.'
  267:
    topic: s10-6
    question: 'The graph of \(r=1+2\sin\theta\) is symmetric about'
    A: 'the \(y\)-axis'
    B: 'the \(x\)-axis'
    C: both axes and the origin
    D: the origin
    answer: A
    hint: '\(\sin(\pi-\theta)=\sin\theta\).'
    explanation: 'A limaçon with an inner loop, symmetric about the \(y\)-axis.'
  268:
    topic: s10-6
    question: 'The graph of \(r^2=4\cos2\theta\) is symmetric about'
    A: no axis
    B: the origin only
    C: 'the \(x\)-axis only'
    D: 'the \(x\)-axis, the \(y\)-axis and the origin'
    answer: D
    hint: 'Test \((r,-\theta)\), \((-r,\theta)\).'
    explanation: The lemniscate satisfies all three tests.
  269:
    topic: s10-6
    question: 'The graph of \(r^2=\cos\theta\) is symmetric about'
    A: 'the \(x\)-axis, the \(y\)-axis and the origin'
    B: no axis
    C: 'the \(x\)-axis only'
    D: 'the \(y\)-axis only'
    answer: A
    hint: '\(r\to-r\) leaves \(r^2\) unchanged; \(\theta\to-\theta\) leaves \(\cos\theta\) unchanged.'
    explanation: Two symmetries imply the third.
  270:
    topic: s10-6
    question: 'The graph of \(r^2=\sin\theta\) is symmetric about'
    A: 'the \(y\)-axis only'
    B: 'the \(x\)-axis only'
    C: 'the \(y\)-axis and the origin (hence also the \(x\)-axis)'
    D: no axis
    answer: C
    hint: 'Replace \(r\) by \(-r\), and \(\theta\) by \(\pi-\theta\).'
    explanation: '\(r^2=\sin\theta\) is unchanged by \(r\to-r\) (origin) and \(\theta\to\pi-\theta\) (\(y\)-axis), so also by the \(x\)-axis reflection.'
  271:
    topic: s10-6
    question: 'The graph of \(r=\cos\dfrac\theta2\) is symmetric about'
    A: 'the \(y\)-axis'
    B: the origin
    C: both axes and the origin
    D: 'the \(x\)-axis'
    answer: D
    hint: '\(\cos\left(-\tfrac\theta2\right)=\cos\tfrac\theta2\).'
    explanation: '\(\theta\to-\theta\) leaves the equation unchanged.'
  272:
    topic: s10-6
    question: 'The graph of \(r=\sin\dfrac\theta2\) is symmetric about'
    A: both axes and the origin
    B: the origin
    C: 'the \(x\)-axis'
    D: 'the \(y\)-axis'
    answer: D
    hint: 'Try \((r,\theta)\to(-r,-\theta)\).'
    explanation: '\(-r=\sin(-\tfrac\theta2)\) gives \(r=\sin\tfrac\theta2\).'
  273:
    topic: s10-6
    question: 'If a polar curve has any two of the three symmetries (about the \(x\)-axis, the \(y\)-axis, the origin), then it'
    A: is a circle
    B: also has the third
    C: cannot have the third
    D: is a lemniscate
    answer: B
    hint: Combine two reflections or a reflection with a half-turn.
    explanation: 'Reflecting across both axes is a rotation by \(\pi\), the origin symmetry; and similarly for the other pairs.'
  274:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=-1+\cos\theta\) at \(\theta=\tfrac\pi2\) is'
    A: '\(1\)'
    B: '\(0\)'
    C: '\(-1\)'
    D: '\(2\)'
    answer: C
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(-1\) and the denominator is \(1\).'
  275:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=-1+\cos\theta\) at \(\theta=-\tfrac\pi2\) is'
    A: '\(-1\)'
    B: '\(2\)'
    C: '\(0\)'
    D: '\(1\)'
    answer: D
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(-1\) and the denominator is \(-1\).'
  276:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=-1+\sin\theta\) at \(\theta=0\) is'
    A: '\(2\)'
    B: '\(0\)'
    C: '\(-1\)'
    D: '\(1\)'
    answer: C
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(-1\) and the denominator is \(1\).'
  277:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=-1+\sin\theta\) at \(\theta=\pi\) is'
    A: '\(1\)'
    B: '\(0\)'
    C: '\(-1\)'
    D: '\(2\)'
    answer: A
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(1\) and the denominator is \(1\).'
  278:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=\sin2\theta\) at \(\theta=\tfrac\pi4\) is'
    A: '\(0\)'
    B: '\(-1\)'
    C: '\(1\)'
    D: '\(2\)'
    answer: B
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(\frac{\sqrt{2}}{2}\) and the denominator is \(- \frac{\sqrt{2}}{2}\).'
  279:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=\sin2\theta\) at \(\theta=-\tfrac\pi4\) is'
    A: '\(1\)'
    B: '\(0\)'
    C: '\(2\)'
    D: '\(-1\)'
    answer: A
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(- \frac{\sqrt{2}}{2}\) and the denominator is \(- \frac{\sqrt{2}}{2}\).'
  280:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=\sin2\theta\) at \(\theta=\tfrac{3\pi}4\) is'
    A: '\(-1\)'
    B: '\(0\)'
    C: '\(2\)'
    D: '\(1\)'
    answer: D
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(\frac{\sqrt{2}}{2}\) and the denominator is \(\frac{\sqrt{2}}{2}\).'
  281:
    topic: s10-6
    question: 'The slope \(\dfrac{dy}{dx}\) of the polar curve \(r=\sin2\theta\) at \(\theta=-\tfrac{3\pi}4\) is'
    A: '\(2\)'
    B: '\(-1\)'
    C: '\(0\)'
    D: '\(1\)'
    answer: B
    hint: '\(\dfrac{dy}{dx}=\dfrac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}\).'
    explanation: 'At this angle the numerator is \(- \frac{\sqrt{2}}{2}\) and the denominator is \(\frac{\sqrt{2}}{2}\).'
  282:
    topic: s10-6
    question: 'The slope of the four-leaved rose \(r=\cos2\theta\) at \(\theta=\tfrac\pi2\) is'
    A: '\(0\)'
    B: undefined
    C: '\(-1\)'
    D: '\(1\)'
    answer: A
    hint: 'At \(\theta=\tfrac\pi2\), \(r=-1\) and \(r''=0\); the denominator is \(r''\cos\theta-r\sin\theta=1\).'
    explanation: 'The numerator is \(r''\sin\theta+r\cos\theta=0\), so the tangent is horizontal.'
  283:
    topic: s10-6
    question: 'The tangent to \(r=\cos2\theta\) at \(\theta=0\) is'
    A: 'of slope \(-1\)'
    B: horizontal
    C: 'of slope \(1\)'
    D: vertical (slope undefined)
    answer: D
    hint: 'At \(\theta=0\), \(r=1\), \(r''=0\).'
    explanation: 'The denominator \(r''\cos\theta-r\sin\theta=0\) while the numerator is \(1\).'
  284:
    topic: s10-6
    question: "Which of these limaçons has an inner loop?"
    A: '\(r=2+\cos\theta\)'
    B: '\(r=\tfrac12+\cos\theta\)'
    C: '\(r=1-\cos\theta\)'
    D: '\(r=\tfrac32+\cos\theta\)'
    answer: B
    hint: 'For \(r=a+b\cos\theta\): inner loop if \(a<b\); cardioid if \(a=b\); dimpled if \(b<a<2b\); oval if \(a\ge2b\).'
    explanation: 'Here \(a=\tfrac12<b=1\).'
  285:
    topic: s10-6
    question: 'The limaçon \(r=1-\cos\theta\) is a'
    A: cardioid
    B: "oval limaçon"
    C: "limaçon with an inner loop"
    D: "dimpled limaçon"
    answer: A
    hint: '\(a=b\).'
    explanation: A heart-shaped curve with a cusp at the origin.
  286:
    topic: s10-6
    question: 'The limaçon \(r=\tfrac32+\cos\theta\) is a'
    A: "dimpled limaçon"
    B: "limaçon with an inner loop"
    C: cardioid
    D: "oval limaçon"
    answer: A
    hint: 'Here \(b<a<2b\).'
    explanation: '\(1<\tfrac32<2\).'
  287:
    topic: s10-6
    question: 'The limaçon \(r=2+\cos\theta\) is a'
    A: "dimpled limaçon"
    B: "limaçon with an inner loop"
    C: cardioid
    D: "convex (oval) limaçon"
    answer: D
    hint: 'Here \(a\ge2b\).'
    explanation: '\(2\ge2\).'
  288:
    topic: s10-6
    question: 'Which equation has the same graph as \(r=1-\cos\theta\)?'
    A: '\(r=1+\cos\theta\)'
    B: '\(r=-1+\cos\theta\)'
    C: '\(r=-1-\cos\theta\)'
    D: '\(r=\cos\theta-1\) with \(\theta\) shifted by \(\tfrac\pi2\)'
    answer: C
    hint: 'Replace \((r,\theta)\) by \((-r,\theta+\pi)\) in \(r=-1-\cos\theta\).'
    explanation: '\(-r=-1-\cos(\theta+\pi)=-1+\cos\theta\), so \(r=1-\cos\theta\).'
  289:
    topic: s10-6
    question: 'Which equation has the same graph as \(r=\cos2\theta\)?'
    A: '\(r=-\sin\left(2\theta+\tfrac\pi2\right)\)'
    B: '\(r=\sin2\theta\)'
    C: '\(r=-\cos\tfrac\theta2\)'
    D: '\(r=\cos\theta\)'
    answer: A
    hint: 'Use \(\sin(2\theta+\tfrac\pi2)=\cos2\theta\).'
    explanation: '\(-\sin(2\theta+\tfrac\pi2)=-\cos2\theta\), which traces the same four-leaved rose (replace \(\theta\) by \(\theta+\tfrac\pi2\) and \(r\) by \(-r\)).'
  290:
    topic: s10-6
    question: 'The graph of \(r=\sin\dfrac\theta2\)... is traced completely for \(\theta\) in'
    A: '\([0,8\pi]\)'
    B: '\([0,\pi]\)'
    C: '\([0,4\pi]\)'
    D: '\([0,2\pi]\)'
    answer: C
    hint: 'The period of \(\sin\tfrac\theta2\) is \(4\pi\).'
    explanation: 'The curve closes after \(\theta\) increases by \(4\pi\).'
  291:
    topic: s10-6
    question: 'The region \(-1\le r\le2\), \(-\tfrac\pi2\le\theta\le\tfrac\pi2\) is'
    A: 'the right half-disk of radius \(2\)'
    B: 'the full disk of radius \(2\)'
    C: 'the left half-disk of radius \(2\)'
    D: 'the right half-disk of radius \(2\) together with the left half-disk of radius \(1\)'
    answer: D
    hint: 'A negative \(r\) with angle \(\theta\) is a point in the opposite direction.'
    explanation: 'For \(r\in[-1,0]\) the points lie on the left side (\(\theta+\pi\)).'
  292:
    topic: s10-6
    question: 'The region \(0\le r\le2\sec\theta\), \(-\tfrac\pi4\le\theta\le\tfrac\pi4\) is'
    A: 'the half-disk \(x\ge0\)'
    B: 'the triangle with vertices \((0,0)\), \((2,2)\), \((2,-2)\)'
    C: 'a sector of a circle of radius \(2\)'
    D: 'the triangle with vertices \((0,0)\), \((1,1)\), \((1,-1)\)'
    answer: B
    hint: '\(r=2\sec\theta\) is the line \(x=2\).'
    explanation: 'The rays at \(\pm45^\circ\) cut the line at \((2,\pm2)\).'
  293:
    topic: s10-6
    question: 'The inequality \(0\le r\le2-2\cos\theta\) describes'
    A: 'a disk of radius \(4\)'
    B: the region enclosed by a cardioid
    C: 'a circle of radius \(2\)'
    D: the region outside a cardioid
    answer: B
    hint: Each ray from the origin extends out to the cardioid.
    explanation: 'The boundary is \(r=2(1-\cos\theta)\).'
  294:
    topic: s10-6
    question: 'The inequality \(0\le r^2\le\cos\theta\) describes'
    A: the whole plane
    B: the region outside the curve
    C: a circle
    D: 'the region inside the curve \(r^2=\cos\theta\) (a lemniscate-like loop)'
    answer: D
    hint: 'It requires \(\cos\theta\ge0\), so \(-\tfrac\pi2\le\theta\le\tfrac\pi2\).'
    explanation: The region lies in the right half-plane.
  295:
    topic: s10-6
    question: 'The point \(\left(2,\tfrac{3\pi}4\right)\) lies on \(r=2\sin2\theta\) because'
    A: '\(2\sin\tfrac{3\pi}4=2\)'
    B: 'the same point has the labels \(\left(-2,\tfrac{7\pi}4\right)\), and \(2\sin\tfrac{7\pi}2=-2\)'
    C: it does not lie on the curve
    D: '\(2\sin\tfrac{3\pi}2=2\)'
    answer: B
    hint: Try other polar labels of the same point.
    explanation: '\(\left(-2,\tfrac{7\pi}4\right)\) satisfies \(r=2\sin2\theta\).'
  296:
    topic: s10-6
    question: 'The point \(\left(\tfrac12,\tfrac{3\pi}2\right)\) lies on \(r=-\sin\dfrac\theta3\) because'
    A: it does not lie on the curve
    B: '\(-\sin\tfrac{3\pi}{2\cdot3}=\tfrac12\) directly'
    C: '\(\sin\tfrac{3\pi}{6}=\tfrac12\)'
    D: 'the point has another label \((r,\theta)\) with \(\theta=\tfrac{7\pi}{2}\) giving \(-\sin\tfrac{7\pi}6=\tfrac12\)'
    answer: D
    hint: 'Use other labels with \(\theta+2\pi k\).'
    explanation: '\(-\sin\tfrac{7\pi}6=\tfrac12\), and \(\theta=\tfrac{7\pi}2\) is \(\tfrac{3\pi}2\) plus \(2\pi\).'
  297:
    topic: s10-6
    question: 'The curves \(r=1+\cos\theta\) and \(r=1-\cos\theta\) intersect at'
    A: '\(\left(2,0\right)\) and the origin'
    B: the origin only
    C: '\(\left(1,0\right)\) and \(\left(1,\pi\right)\) only'
    D: '\(\left(1,\pm\tfrac\pi2\right)\) and the origin'
    answer: D
    hint: 'Set \(1+\cos\theta=1-\cos\theta\).'
    explanation: '\(\cos\theta=0\) gives \(\theta=\pm\tfrac\pi2\), \(r=1\); both curves also pass through the origin.'
  298:
    topic: s10-6
    question: 'The curves \(r=1+\sin\theta\) and \(r=1-\sin\theta\) intersect at'
    A: the origin only
    B: '\((1,0)\), \((1,\pi)\) and the origin'
    C: '\((2,0)\) and the origin'
    D: '\((1,\tfrac\pi2)\) and \((1,-\tfrac\pi2)\)'
    answer: B
    hint: 'Set \(1+\sin\theta=1-\sin\theta\).'
    explanation: '\(\sin\theta=0\) gives \(\theta=0,\pi\); the origin is on both curves with different angles.'
  299:
    topic: s10-6
    question: 'The circles \(r=2\sin\theta\) and \(r=2\sin2\theta\) (restricted to \(0\le\theta\le\pi\)) meet away from the origin at angle(s)'
    A: '\(\theta=\tfrac\pi6\)'
    B: '\(\theta=\tfrac\pi3\) (point \((\sqrt3,\tfrac\pi3)\))'
    C: '\(\theta=\tfrac\pi2\)'
    D: '\(\theta=\tfrac{2\pi}3\) only'
    answer: B
    hint: 'Solve \(\sin\theta=\sin2\theta=2\sin\theta\cos\theta\).'
    explanation: '\(\cos\theta=\tfrac12\) gives \(\theta=\tfrac\pi3\) and \(r=2\sin\tfrac\pi3=\sqrt3\).'
  300:
    topic: s10-6
    question: 'The curves \(r=\cos\theta\) and \(r=1-\cos\theta\) intersect (off the origin) at'
    A: '\(\left(\tfrac12,\pm\tfrac{2\pi}3\right)\)'
    B: '\(\left(\tfrac12,\pm\tfrac\pi6\right)\)'
    C: '\(\left(1,\pm\tfrac\pi3\right)\)'
    D: '\(\left(\tfrac12,\pm\tfrac\pi3\right)\)'
    answer: D
    hint: 'Solve \(\cos\theta=1-\cos\theta\).'
    explanation: '\(\cos\theta=\tfrac12\), so \(\theta=\pm\tfrac\pi3\) and \(r=\tfrac12\).'
  301:
    topic: s10-6
    question: 'The curves \(r=\sqrt2\) and \(r^2=4\sin\theta\) intersect at'
    A: '\(\left(2,\tfrac\pi6\right)\) and \(\left(2,\tfrac{5\pi}6\right)\)'
    B: '\(\left(\sqrt2,\tfrac\pi6\right)\) and \(\left(\sqrt2,\tfrac{5\pi}6\right)\)'
    C: '\(\left(\sqrt2,\tfrac\pi3\right)\) and \(\left(\sqrt2,\tfrac{2\pi}3\right)\)'
    D: '\(\left(\sqrt2,\tfrac\pi4\right)\) and \(\left(\sqrt2,\tfrac{3\pi}4\right)\)'
    answer: B
    hint: 'Substitute \(r^2=2\).'
    explanation: '\(4\sin\theta=2\), so \(\sin\theta=\tfrac12\).'
  302:
    topic: s10-6
    question: 'The curves \(r^2=\sqrt2\sin\theta\) and \(r^2=\sqrt2\cos\theta\) intersect at'
    A: '\(\left(\pm1,\tfrac\pi4\right)\) and the origin'
    B: '\(\left(\pm\sqrt2,\tfrac\pi4\right)\) and the origin'
    C: '\(\left(1,\tfrac\pi4\right)\) and \(\left(1,\tfrac{5\pi}4\right)\)'
    D: '\(\left(1,\tfrac\pi4\right)\) only'
    answer: A
    hint: 'Set \(\sin\theta=\cos\theta\).'
    explanation: '\(\theta=\tfrac\pi4\) gives \(r^2=1\), so \(r=\pm1\); also the origin.'
  303:
    topic: s10-6
    question: 'The curves \(r=1\) and \(r=2\sin2\theta\) intersect when \(\theta\in[0,\tfrac\pi2]\) at'
    A: '\(\theta=\tfrac\pi{24}\) and \(\theta=\tfrac{5\pi}{24}\)'
    B: '\(\theta=\tfrac\pi6\) and \(\theta=\tfrac{5\pi}6\)'
    C: '\(\theta=\tfrac\pi{12}\) and \(\theta=\tfrac{5\pi}{12}\)'
    D: '\(\theta=\tfrac\pi4\) only'
    answer: C
    hint: 'Solve \(2\sin2\theta=1\).'
    explanation: '\(2\theta=\tfrac\pi6,\tfrac{5\pi}6\).'
  304:
    topic: s10-6
    question: 'The maximum width of the petal of the four-leaved rose \(r=\cos2\theta\) that lies along the \(x\)-axis (to three decimals) is'
    A: '\(1.000\)'
    B: '\(0.707\)'
    C: '\(0.544\)'
    D: '\(0.272\)'
    answer: C
    hint: 'Maximize \(y=r\sin\theta=\cos2\theta\sin\theta\) and double.'
    explanation: '\(\cos2\theta=4\sin^2\theta\) gives \(\sin^2\theta=\tfrac16\); \(y_{\max}=\dfrac{2}{3\sqrt6}\approx0.272\); width \(\approx0.544\).'
  305:
    topic: s10-6
    question: 'The maximum height above the \(x\)-axis of the cardioid \(r=2(1+\cos\theta)\) (to two decimals) is'
    A: '\(3.46\)'
    B: '\(2.00\)'
    C: '\(4.00\)'
    D: '\(2.60\)'
    answer: D
    hint: 'Maximize \(y=2(1+\cos\theta)\sin\theta\).'
    explanation: '\(y''=0\) at \(\theta=\tfrac\pi3\): \(y=3\cdot\tfrac{\sqrt3}2=\tfrac{3\sqrt3}2\approx2.60\).'
  306:
    topic: s10-6
    question: 'The graph of \(r=\theta\) (\(\theta\ge0\)) is an'
    A: logarithmic spiral
    B: Archimedean spiral
    C: hyperbolic spiral
    D: lemniscate
    answer: B
    hint: '\(r\) grows linearly with \(\theta\).'
    explanation: Equal turns add equal distances from the origin.
  307:
    topic: s10-6
    question: 'The graph of \(r=e^{\theta/10}\) is a'
    A: Archimedean spiral
    B: rose
    C: hyperbolic spiral
    D: logarithmic spiral
    answer: D
    hint: '\(r\) grows exponentially in \(\theta\).'
    explanation: 'Each full turn multiplies \(r\) by a constant factor.'
  308:
    topic: s10-6
    question: 'The graph of \(r=\dfrac8\theta\) (\(\theta>0\)) is a'
    A: circle
    B: 'hyperbolic spiral, which winds toward the origin as \(\theta\to\infty\)'
    C: logarithmic spiral
    D: Archimedean spiral
    answer: B
    hint: '\(r\to0\) as \(\theta\to\infty\).'
    explanation: '\(r\theta=8\).'
  309:
    topic: s10-6
    question: 'A rose \(r=\cos m\theta\) with \(m\) a positive odd integer has'
    A: '\(m/2\) petals'
    B: '\(m\) petals'
    C: '\(2m\) petals'
    D: one petal
    answer: B
    hint: 'Count the petals for \(m=1,3,5\).'
    explanation: '\(m=3\) gives a three-petaled rose; even \(m\) gives \(2m\) petals.'
  310:
    topic: s10-6
    question: 'A rose \(r=\cos m\theta\) with \(m\) a positive even integer has'
    A: '\(m\) petals'
    B: '\(2m\) petals'
    C: one petal
    D: '\(m/2\) petals'
    answer: B
    hint: '\(r=\cos2\theta\) has four petals.'
    explanation: 'For even \(m\) the curve is traced once for \(0\le\theta<2\pi\) with \(2m\) petals.'
  311:
    topic: s10-7
    question: 'The area inside the oval limaçon \(r=4+2\cos\theta\) is'
    A: '\(9 \pi\)'
    B: '\(18 \pi\)'
    C: '\(16 \pi\)'
    D: '\(36 \pi\)'
    answer: B
    hint: '\(A=\tfrac12\displaystyle\int_0^{2\pi}r^2\,d\theta\).'
    explanation: '\(\tfrac12\int_0^{2\pi}(16+16\cos\theta+4\cos^2\theta)d\theta=\tfrac12(32\pi+4\pi)=18\pi\).'
  312:
    topic: s10-7
    question: 'The area inside the cardioid \(r=a(1+\cos\theta)\) is'
    A: '\(3 \pi a^{2}\)'
    B: '\(\pi a^{2}\)'
    C: '\(\frac{3 \pi a^{2}}{4}\)'
    D: '\(\frac{3 \pi a^{2}}{2}\)'
    answer: D
    hint: '\(A=\tfrac{a^2}2\displaystyle\int_0^{2\pi}(1+\cos\theta)^2d\theta\).'
    explanation: '\(\tfrac{a^2}2\left(2\pi+\pi\right)=\dfrac{3\pi a^2}2\).'
  313:
    topic: s10-7
    question: 'The area of one leaf of the four-leaved rose \(r=\cos2\theta\) is'
    A: '\(\frac{\pi}{2}\)'
    B: '\(\frac{\pi}{16}\)'
    C: '\(\frac{\pi}{8}\)'
    D: '\(\frac{\pi}{4}\)'
    answer: C
    hint: 'One leaf is traced for \(-\tfrac\pi4\le\theta\le\tfrac\pi4\).'
    explanation: '\(\tfrac12\int_{-\pi/4}^{\pi/4}\cos^22\theta\,d\theta=\dfrac\pi8\).'
  314:
    topic: s10-7
    question: 'The area inside the lemniscate \(r^2=2a^2\cos2\theta\) (\(a>0\)) is'
    A: '\(\pi a^{2}\)'
    B: '\(2 a^{2}\)'
    C: '\(4 a^{2}\)'
    D: '\(a^{2}\)'
    answer: B
    hint: 'Use \(4\) times the area of the quarter \(0\le\theta\le\tfrac\pi4\).'
    explanation: '\(4\cdot\tfrac12\int_0^{\pi/4}2a^2\cos2\theta\,d\theta=2a^2\).'
  315:
    topic: s10-7
    question: 'The area inside one loop of the lemniscate \(r^2=4\sin2\theta\) is'
    A: '\(4\)'
    B: '\(2\)'
    C: '\(1\)'
    D: '\(\pi\)'
    answer: B
    hint: 'One loop: \(0\le\theta\le\tfrac\pi2\).'
    explanation: '\(\tfrac12\int_0^{\pi/2}4\sin2\theta\,d\theta=2\).'
  316:
    topic: s10-7
    question: 'The area inside the six-lobed curve \(r^2=2\sin3\theta\) (all six lobes) is'
    A: '\(8\)'
    B: '\(4\)'
    C: '\(2\)'
    D: '\(\frac{2}{3}\)'
    answer: B
    hint: 'Each lobe has area \(\tfrac12\int_0^{\pi/3}2\sin3\theta\,d\theta\).'
    explanation: 'Each lobe has area \(\tfrac23\); six lobes give \(4\).'
  317:
    topic: s10-7
    question: 'The area shared by the circles \(r=2\cos\theta\) and \(r=2\sin\theta\) is'
    A: '\(-1 + \frac{\pi}{4}\)'
    B: '\(\frac{\pi}{2}\)'
    C: '\(-1 + \frac{\pi}{2}\)'
    D: '\(-2 + \pi\)'
    answer: C
    hint: 'Double the area of the sector \(0\le\theta\le\tfrac\pi4\) under \(r=2\sin\theta\), plus the corresponding sector of the other circle.'
    explanation: '\(2\left[\tfrac12\int_0^{\pi/4}4\sin^2\theta\,d\theta\right]\) gives \(\dfrac\pi2-1\).'
  318:
    topic: s10-7
    question: 'The area shared by the circles \(r=1\) and \(r=2\sin\theta\) is'
    A: '\(1.571\)'
    B: '\(2.457\)'
    C: '\(1.228\)'
    D: '\(0.614\)'
    answer: C
    hint: 'Split the region at the intersections \(\theta=\tfrac\pi6\) and \(\tfrac{5\pi}6\).'
    explanation: '\(2\cdot\tfrac12\int_0^{\pi/6}4\sin^2\theta\,d\theta+\tfrac12\int_{\pi/6}^{5\pi/6}1\,d\theta=\dfrac\pi3\cdot\ldots\approx1.228\).'
  319:
    topic: s10-7
    question: 'The area shared by the circles \(r=1\) and \(r=2\sin\theta\) equals'
    A: '\(\dfrac{2\pi}3-\dfrac{\sqrt3}2\)'
    B: '\(\pi-\sqrt3\)'
    C: '\(\dfrac{2\pi}3+\dfrac{\sqrt3}2\)'
    D: '\(\dfrac{\pi}{3}-\dfrac{\sqrt3}4\)'
    answer: A
    hint: See the previous computation.
    explanation: 'The sum evaluates to \(\dfrac{2\pi}3-\dfrac{\sqrt3}2\approx1.228\).'
  320:
    topic: s10-7
    question: 'The area shared by the cardioids \(r=2(1+\cos\theta)\) and \(r=2(1-\cos\theta)\) is'
    A: '\(8 + 3 \pi\)'
    B: '\(-8 + 6 \pi\)'
    C: '\(-8 + 3 \pi\)'
    D: '\(3 \pi\)'
    answer: C
    hint: 'By symmetry use \(4\) times the part of the first cardioid with \(\tfrac\pi2\le\theta\le\pi\) halved appropriately.'
    explanation: 'The shared region has area \(3\pi-8\).'
  321:
    topic: s10-7
    question: 'The area inside the lemniscate \(r^2=6\cos2\theta\) and outside the circle \(r=\sqrt3\) is'
    A: '\(- \pi + 6 \sqrt{3}\)'
    B: '\(\pi + 3 \sqrt{3}\)'
    C: '\(- \pi + 3 \sqrt{3}\)'
    D: '\(- \pi + \sqrt{3}\)'
    answer: C
    hint: 'They meet at \(\theta=\pm\tfrac\pi6\); use symmetry.'
    explanation: '\(4\left[\tfrac12\int_0^{\pi/6}\left(6\cos2\theta-3\right)d\theta\right]=3\sqrt3-\pi\).'
  322:
    topic: s10-7
    question: 'The area inside the circle \(r=3a\cos\theta\) and outside the cardioid \(r=a(1+\cos\theta)\) (\(a>0\)) is'
    A: '\(\pi a^{2}\)'
    B: '\(2 \pi a^{2}\)'
    C: '\(\frac{3 \pi a^{2}}{2}\)'
    D: '\(\frac{\pi a^{2}}{2}\)'
    answer: A
    hint: 'They meet where \(3\cos\theta=1+\cos\theta\), i.e. \(\theta=\pm\tfrac\pi3\).'
    explanation: '\(2\cdot\tfrac12\int_0^{\pi/3}a^2\left(9\cos^2\theta-(1+\cos\theta)^2\right)d\theta=\pi a^2\).'
  323:
    topic: s10-7
    question: 'The area inside the circle \(r=-2\cos\theta\) and outside the circle \(r=1\) is'
    A: '\(- \frac{\sqrt{3}}{2} + \frac{2 \pi}{3}\)'
    B: '\(\sqrt{3} + \frac{2 \pi}{3}\)'
    C: '\(\frac{\sqrt{3}}{2} + \frac{\pi}{3}\)'
    D: '\(- \frac{\sqrt{3}}{2} + \frac{\pi}{3}\)'
    answer: C
    hint: 'They intersect at \(\theta=\pm\tfrac{2\pi}3\) (on the left side).'
    explanation: '\(\tfrac12\int_{2\pi/3}^{4\pi/3}\left(4\cos^2\theta-1\right)d\theta=\dfrac\pi3+\dfrac{\sqrt3}2\).'
  324:
    topic: s10-7
    question: 'The area inside the outer loop of the limaçon \(r=2\cos\theta+1\) is'
    A: '\(3 \sqrt{3} + 2 \pi\)'
    B: '\(\frac{3 \sqrt{3}}{2} + \pi\)'
    C: '\(\frac{3 \sqrt{3}}{2} + 2 \pi\)'
    D: '\(- \frac{3 \sqrt{3}}{2} + 2 \pi\)'
    answer: C
    hint: 'The outer loop is traced for \(-\tfrac{2\pi}3\le\theta\le\tfrac{2\pi}3\) (where \(r\ge0\)), but it includes the inner loop''s region.'
    explanation: '\(\tfrac12\int_{-2\pi/3}^{2\pi/3}(2\cos\theta+1)^2d\theta=2\pi+\dfrac{3\sqrt3}2\).'
  325:
    topic: s10-7
    question: 'The area inside the inner loop of \(r=2\cos\theta+1\) is'
    A: '\(- 3 \sqrt{3} + 2 \pi\)'
    B: '\(\frac{3 \sqrt{3}}{2} + \pi\)'
    C: '\(- \frac{3 \sqrt{3}}{4} + \frac{\pi}{2}\)'
    D: '\(\pi - \frac{3 \sqrt{3}}{2}\)'
    answer: D
    hint: 'The inner loop is traced for \(\tfrac{2\pi}3\le\theta\le\tfrac{4\pi}3\), where \(r\le0\).'
    explanation: '\(\tfrac12\int_{2\pi/3}^{4\pi/3}(2\cos\theta+1)^2d\theta=\pi-\dfrac{3\sqrt3}2\).'
  326:
    topic: s10-7
    question: 'The area inside the outer loop and outside the inner loop of \(r=2\cos\theta+1\) is'
    A: '\(\pi - 3 \sqrt{3}\)'
    B: '\(3 \sqrt{3} + 3 \pi\)'
    C: '\(\pi + 3 \sqrt{3}\)'
    D: '\(\frac{3 \sqrt{3}}{2} + \pi\)'
    answer: C
    hint: Subtract the inner loop area from the outer loop area.
    explanation: '\(\left(2\pi+\tfrac{3\sqrt3}2\right)-\left(\pi-\tfrac{3\sqrt3}2\right)=\pi+3\sqrt3\).'
  327:
    topic: s10-7
    question: 'The area inside the circle \(r=6\) above the line \(r=3\csc\theta\) (\(y=3\)) is (two decimals)'
    A: '\(33.17\)'
    B: '\(44.22\)'
    C: '\(22.11\)'
    D: '\(11.06\)'
    answer: C
    hint: 'They meet where \(3\csc\theta=6\): \(\theta=\tfrac\pi6,\tfrac{5\pi}6\).'
    explanation: '\(\tfrac12\int_{\pi/6}^{5\pi/6}\left(36-9\csc^2\theta\right)d\theta=12\pi-9\sqrt3\approx22.11\).'
  328:
    topic: s10-7
    question: 'The area inside the circle \(r=6\) above the line \(y=3\) equals'
    A: '\(12\pi-9\sqrt3\)'
    B: '\(6\pi-9\sqrt3\)'
    C: '\(18\pi-9\sqrt3\)'
    D: '\(12\pi+9\sqrt3\)'
    answer: A
    hint: It is a circular segment.
    explanation: '\(\tfrac12\left[36\theta+9\cot\theta\right]_{\pi/6}^{5\pi/6}=12\pi-9\sqrt3\).'
  329:
    topic: s10-7
    question: 'The area inside the cardioid \(r=\cos\theta+1\) and outside the circle \(r=\cos\theta\) is'
    A: '\(\dfrac{3\pi}2\)'
    B: '\(\pi\)'
    C: '\(\dfrac{3\pi}4\)'
    D: '\(\dfrac{5\pi}4\)'
    answer: D
    hint: 'The circle \(r=\cos\theta\) (area \(\tfrac\pi4\)) lies entirely inside the cardioid (area \(\tfrac{3\pi}2\)).'
    explanation: '\(\tfrac{3\pi}2-\tfrac\pi4=\tfrac{5\pi}4\). The integral \(\tfrac12\int_0^{2\pi}\left[(\cos\theta+1)^2-\cos^2\theta\right]d\theta=\pi\) is wrong because \(\theta\) from \(0\) to \(2\pi\) traces the circle twice.'
  330:
    topic: s10-7
    question: 'The length of the spiral \(r=\theta^2\), \(0\le\theta\le\sqrt5\), is'
    A: '\(\dfrac{38}3\)'
    B: '\(\dfrac{27}3\)'
    C: '\(\dfrac{19}9\)'
    D: '\(\dfrac{19}3\)'
    answer: D
    hint: '\(L=\displaystyle\int\sqrt{r^2+(r'')^2}\,d\theta=\int\theta\sqrt{\theta^2+4}\,d\theta\).'
    explanation: '\(\dfrac13\left(\theta^2+4\right)^{3/2}\Big|_0^{\sqrt5}=\dfrac{27-8}3\).'
  331:
    topic: s10-7
    question: 'The length of the spiral \(r=\dfrac{e^\theta}{\sqrt2}\), \(0\le\theta\le\pi\), is'
    A: '\(e^\pi-1\)'
    B: '\(\dfrac{e^\pi-1}{\sqrt2}\)'
    C: '\(e^{\pi}\)'
    D: '\(\sqrt2\left(e^\pi-1\right)\)'
    answer: A
    hint: '\(r''=r\), so \(\sqrt{r^2+r''^2}=\sqrt2\,r=e^\theta\).'
    explanation: '\(\int_0^\pi e^\theta d\theta=e^\pi-1\).'
  332:
    topic: s10-7
    question: 'The length of the cardioid \(r=1+\cos\theta\) is'
    A: '\(8\)'
    B: '\(2\pi\)'
    C: '\(4\)'
    D: '\(6\)'
    answer: A
    hint: '\(r^2+r''^2=2+2\cos\theta=4\cos^2\tfrac\theta2\).'
    explanation: '\(2\int_0^\pi2\cos\tfrac\theta2\,d\theta=8\).'
  333:
    topic: s10-7
    question: 'The length of the curve \(r=a\sin^2\dfrac\theta2\), \(0\le\theta\le\pi\) (\(a>0\)), is'
    A: '\(a\)'
    B: '\(4a\)'
    C: '\(\pi a\)'
    D: '\(2a\)'
    answer: D
    hint: '\(r^2+r''^2=a^2\sin^2\tfrac\theta2\).'
    explanation: '\(a\int_0^\pi\sin\tfrac\theta2d\theta=2a\).'
  334:
    topic: s10-7
    question: 'The length of the parabolic segment \(r=\dfrac6{1+\cos\theta}\), \(0\le\theta\le\tfrac\pi2\), is (two decimals)'
    A: '\(3.44\)'
    B: '\(13.77\)'
    C: '\(6.89\)'
    D: '\(10.33\)'
    answer: C
    hint: '\(r^2+r''^2=\dfrac{72}{(1+\cos\theta)^3}\).'
    explanation: '\(L=\int_0^{\pi/2}\dfrac{6\sqrt2}{(1+\cos\theta)^{3/2}}d\theta\approx6.89\).'
  335:
    topic: s10-7
    question: 'The length of the parabolic segment \(r=\dfrac2{1-\cos\theta}\), \(\tfrac\pi2\le\theta\le\pi\), is (two decimals)'
    A: '\(2.3\)'
    B: '\(1.15\)'
    C: '\(4.59\)'
    D: '\(3.44\)'
    answer: A
    hint: '\(r^2+r''^2=\dfrac{8}{(1-\cos\theta)^3}\).'
    explanation: 'Evaluate \(\int\sqrt{8}\,(1-\cos\theta)^{-3/2}d\theta\) numerically: \(\approx2.30\).'
  336:
    topic: s10-7
    question: 'The length of the curve \(r=\cos^3\dfrac\theta3\), \(0\le\theta\le\dfrac\pi4\), is'
    A: '\(\dfrac\pi8+\dfrac34\)'
    B: '\(\dfrac\pi8+\dfrac38\)'
    C: '\(\dfrac\pi8-\dfrac38\)'
    D: '\(\dfrac\pi4+\dfrac38\)'
    answer: B
    hint: '\(r^2+r''^2=\cos^6\tfrac\theta3+\cos^4\tfrac\theta3\sin^2\tfrac\theta3=\cos^4\tfrac\theta3\).'
    explanation: '\(\int_0^{\pi/4}\cos^2\tfrac\theta3d\theta=\left[\tfrac\theta2+\tfrac34\sin\tfrac{2\theta}3\right]_0^{\pi/4}=\tfrac\pi8+\tfrac38\).'
  337:
    topic: s10-7
    question: 'The length of the curve \(r=\sqrt{1+\sin2\theta}\), \(0\le\theta\le\pi\sqrt2\), is'
    A: '\(2\)'
    B: '\(4\pi\)'
    C: '\(\pi\sqrt2\)'
    D: '\(2\pi\)'
    answer: D
    hint: 'Simplify \(r^2+r''^2\).'
    explanation: '\(r^2+r''^2=2\), so \(L=\sqrt2\cdot\pi\sqrt2=2\pi\).'
  338:
    topic: s10-7
    question: 'The length of the curve \(r=\sqrt{1+\cos2\theta}\), \(0\le\theta\le\pi\sqrt2\), is'
    A: '\(\pi\)'
    B: '\(2\pi\)'
    C: '\(\pi\sqrt2\)'
    D: '\(4\pi\)'
    answer: B
    hint: '\(r''=-\dfrac{\sin2\theta}{r}\).'
    explanation: '\(r^2+r''^2=1+\cos2\theta+\dfrac{\sin^22\theta}{1+\cos2\theta}=2\), so \(L=\sqrt2\cdot\pi\sqrt2=2\pi\).'
  339:
    topic: s10-7
    question: 'Using the polar arc-length formula, the circumference of \(r=a\cos\theta\) is'
    A: '\(\pi a\)'
    B: '\(\dfrac{\pi a}2\)'
    C: '\(\pi a^2\)'
    D: '\(2\pi a\)'
    answer: A
    hint: '\(r^2+r''^2=a^2\), and the circle is traced once for \(0\le\theta\le\pi\).'
    explanation: '\(\int_0^\pi a\,d\theta=\pi a\).'
  340:
    topic: s10-7
    question: 'Using the polar arc-length formula, the circumference of \(r=a\) is'
    A: '\(4\pi a\)'
    B: '\(\pi a\)'
    C: '\(\pi a^2\)'
    D: '\(2\pi a\)'
    answer: D
    hint: '\(\int_0^{2\pi}a\,d\theta\).'
    explanation: 'It is a circle of radius \(a\).'
  341:
    topic: s10-7
    question: 'The surface generated by revolving \(r=\sqrt{\cos2\theta}\), \(0\le\theta\le\tfrac\pi4\), about the \(y\)-axis has area'
    A: '\(2\pi\sqrt2\)'
    B: '\(\pi\sqrt2\)'
    C: '\(\dfrac{\pi\sqrt2}2\)'
    D: '\(\pi\)'
    answer: B
    hint: '\(S=2\pi\displaystyle\int r\cos\theta\sqrt{r^2+r''^2}\,d\theta\) with \(\sqrt{r^2+r''^2}=\dfrac1{\sqrt{\cos2\theta}}\).'
    explanation: '\(S=2\pi\int_0^{\pi/4}\cos\theta\,d\theta=2\pi\sin\tfrac\pi4=\pi\sqrt2\).'
  342:
    topic: s10-7
    question: 'The surface generated by revolving \(r=\sqrt2\,e^{\theta/2}\), \(0\le\theta\le\tfrac\pi2\), about the \(x\)-axis has area'
    A: '\(\pi\sqrt5\left(e^{\pi/2}-1\right)\)'
    B: '\(\pi\sqrt5\left(e^{\pi/2}+1\right)\)'
    C: '\(\pi\left(e^{\pi/2}+1\right)\)'
    D: '\(2\pi\sqrt5\left(e^{\pi/2}+1\right)\)'
    answer: B
    hint: '\(r''=\tfrac r2\), so \(\sqrt{r^2+r''^2}=\tfrac{\sqrt5}2r\).'
    explanation: '\(S=2\pi\cdot\tfrac{\sqrt5}2\int_0^{\pi/2}2e^\theta\sin\theta\,d\theta=\pi\sqrt5\left(e^{\pi/2}+1\right)\).'
  343:
    topic: s10-7
    question: 'The surface generated by revolving the right half of the lemniscate \(r^2=\cos2\theta\) about the \(x\)-axis has area'
    A: '\(\pi\left(2+\sqrt2\right)\)'
    B: '\(\pi\sqrt2\)'
    C: '\(\pi\left(2-\sqrt2\right)\)'
    D: '\(2\pi\left(2-\sqrt2\right)\)'
    answer: C
    hint: 'Use \(2\times\) the upper-half integral \(S=2\pi\int r\sin\theta\,ds\) with \(ds=\dfrac{d\theta}{\sqrt{\cos2\theta}}\).'
    explanation: '\(S=2\pi\int_0^{\pi/4}\sin\theta\,d\theta=2\pi\left(1-\tfrac{\sqrt2}2\right)\) (the upper half is revolved to cover the whole surface once).'
  344:
    topic: s10-7
    question: 'Revolving the circle \(r=2a\cos\theta\) (\(a>0\)) about the \(y\)-axis generates a surface of area'
    A: '\(2\pi^2a^2\)'
    B: '\(4\pi a^2\)'
    C: '\(8\pi^2a^2\)'
    D: '\(4\pi^2a^2\)'
    answer: D
    hint: 'Pappus: area \(=\) (length of the curve)\(\times\)(distance traveled by its centroid).'
    explanation: '\(2\pi a\cdot2\pi a=4\pi^2a^2\).'
  345:
    topic: s10-7
    question: 'The average value of \(r\) over the cardioid \(r=a(1-\cos\theta)\), \(0\le\theta\le2\pi\), is'
    A: '\(\dfrac{3a}{2}\)'
    B: '\(\dfrac a2\)'
    C: '\(a\)'
    D: '\(2a\)'
    answer: C
    hint: '\(r_{av}=\dfrac1{2\pi}\displaystyle\int_0^{2\pi}a(1-\cos\theta)\,d\theta\).'
    explanation: '\(\dfrac{1}{2\pi}\cdot2\pi a=a\).'
  346:
    topic: s10-7
    question: 'The average value of \(r\) over the circle \(r=a\cos\theta\), \(-\tfrac\pi2\le\theta\le\tfrac\pi2\), is'
    A: '\(\dfrac{a}{2}\)'
    B: '\(\dfrac a\pi\)'
    C: '\(a\)'
    D: '\(\dfrac{2a}\pi\)'
    answer: D
    hint: '\(r_{av}=\dfrac1\pi\displaystyle\int_{-\pi/2}^{\pi/2}a\cos\theta\,d\theta\).'
    explanation: '\(\dfrac{2a}\pi\).'
  347:
    topic: s10-7
    question: 'If \(f\) is continuous, the length of the curve \(r=2f(\theta)\), \(\alpha\le\theta\le\beta\), compared with the length of \(r=f(\theta)\) is'
    A: exactly twice as long
    B: the same
    C: four times as long
    D: half as long
    answer: A
    hint: '\(\sqrt{(2f)^2+(2f'')^2}=2\sqrt{f^2+f''^2}\).'
    explanation: Lengths scale with the factor.
  348:
    topic: s10-7
    question: 'If the curves \(r=f(\theta)\) and \(r=2f(\theta)\) (\(\alpha\le\theta\le\beta\)) are revolved about the \(x\)-axis, the surface area of the second is'
    A: the same
    B: four times that of the first
    C: twice that of the first
    D: eight times that of the first
    answer: B
    hint: Surface area scales like length times radius.
    explanation: Both length and radius double.
  349:
    topic: s10-7
    question: 'The centroid of the region enclosed by the cardioid \(r=a(1+\cos\theta)\) has \(\bar x=\)'
    A: '\(\dfrac{3a}{4}\)'
    B: '\(\dfrac{5a}6\)'
    C: '\(a\)'
    D: '\(\dfrac{a}2\)'
    answer: B
    hint: '\(\bar x=\dfrac{\frac23\int r^3\cos\theta\,d\theta}{\int r^2d\theta}\).'
    explanation: 'The region is symmetric about the \(x\)-axis (\(\bar y=0\)), and \(\bar x=\dfrac{5a}6\).'
  350:
    topic: s10-7
    question: 'The centroid of the semicircular region \(0\le r\le a\), \(0\le\theta\le\pi\), has \(\bar y=\)'
    A: '\(\dfrac{4a}{3\pi}\)'
    B: '\(\dfrac{4a}{3}\)'
    C: '\(\dfrac{2a}{3\pi}\)'
    D: '\(\dfrac a2\)'
    answer: A
    hint: '\(\bar y=\dfrac{\frac23\int_0^\pi a^3\sin\theta\,d\theta}{\int_0^\pi a^2\,d\theta}\).'
    explanation: '\(\bar y=\dfrac{\frac23\cdot2a^3}{\pi a^2}=\dfrac{4a}{3\pi}\).'
  351:
    topic: s10-8
    question: 'The line at perpendicular distance \(5\) from the origin whose perpendicular direction is \(\dfrac\pi6\) has polar and Cartesian equations'
