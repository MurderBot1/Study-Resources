    D: '\(\frac{8}{\pi}\)'
    answer: A
    hint: 'For a quarter disk of radius \(r\), \(\bar x=\bar y=\dfrac{4r}{3\pi}\).'
    explanation: '\(\dfrac{4\cdot3}{3\pi}=\dfrac4\pi\).'
  129:
    topic: s6-4
    question: 'The center of mass \(\bar y\) of the plate bounded by the \(x\)-axis and the semicircle \(y=\sqrt{9-x^2}\) is'
    A: '\(\frac{8}{\pi}\)'
    B: '\(- \frac{4}{\pi}\)'
    C: '\(\frac{4}{\pi}\)'
    D: '\(\frac{4}{\pi^{2}}\)'
    answer: C
    hint: 'For a semicircular disk of radius \(a\), \(\bar y=\dfrac{4a}{3\pi}\).'
    explanation: '\(\dfrac{4\cdot3}{3\pi}=\dfrac4\pi\), the same as for the quarter disk.'
  130:
    topic: s6-4
    question: 'A plate covers the region between the \(x\)-axis and \(y=\dfrac{2}{x^2}\), \(1\le x\le2\), with density \(\delta(x)=x^2\). Its center of mass \(\bar x\) is'
    A: '\(3\)'
    B: '\(\frac{3}{4}\)'
    C: '\(\frac{3}{2}\)'
    D: '\(- \frac{3}{2}\)'
    answer: C
    hint: '\(\bar x=\dfrac{\int x\,\delta\,y\,dx}{\int\delta\,y\,dx}\) with \(y=2/x^2\).'
    explanation: 'The mass is \(\int2\,dx=2\); the moment is \(\int2x\,dx=3\), so \(\bar x=\tfrac32\).'
  131:
    topic: s6-4
    question: 'The centroid of the triangle with vertices \((-1,0),(1,0),(0,3)\) is'
    A: '\(\left(1,0\right)\)'
    B: '\(\left(0,1\right)\)'
    C: '\(\left(1,1\right)\)'
    D: '\(\left(0,2\right)\)'
    answer: B
    hint: The centroid is the average of the three vertices (the intersection of the medians).
    explanation: '\(\left(\dfrac{\sum x_i}3,\dfrac{\sum y_i}3\right)\).'
  132:
    topic: s6-4
    question: 'The centroid of the triangle with vertices \((0,0),(1,0),(0,1)\) is'
