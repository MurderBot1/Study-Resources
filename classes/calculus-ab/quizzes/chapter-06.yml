questions:
  1:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=-1\) and \(x=1\); its cross-sections run from \(y=-\sqrt{1-x^2}\) to \(y=\sqrt{1-x^2}\) and are circular disks with diameters in the \(xy\)-plane. The cross-sectional area \(A(x)\) is'
    A: '\(- 4 \pi x^{2} + 4 \pi\)'
    B: '\(- 2 \pi x^{2} + 2 \pi\)'
    C: '\(- \frac{\pi x^{2}}{2} + \frac{\pi}{2}\)'
    D: '\(- \pi x^{2} + \pi\)'
    answer: D
    hint: Find the length of the cross-section first (here the vertical distance between the two semicircles), then the area formula for the shape.
    explanation: 'The length is \(2\sqrt{1-x^2}\): a disk of diameter \(2\sqrt{1-x^2}\) has radius \(\sqrt{1-x^2}\). So \(A(x)=- \pi x^{2} + \pi\).'
  2:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=-1\) and \(x=1\); its cross-sections run from \(y=-\sqrt{1-x^2}\) to \(y=\sqrt{1-x^2}\) and are squares with bases in the \(xy\)-plane. The cross-sectional area \(A(x)\) is'
    A: '\(2 - 2 x^{2}\)'
    B: '\(8 - 8 x^{2}\)'
    C: '\(1 - x^{2}\)'
    D: '\(4 - 4 x^{2}\)'
    answer: D
    hint: Find the length of the cross-section first (here the vertical distance between the two semicircles), then the area formula for the shape.
    explanation: 'The length is \(2\sqrt{1-x^2}\): the side is \(2\sqrt{1-x^2}\). So \(A(x)=4 - 4 x^{2}\).'
  3:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=-1\) and \(x=1\); its cross-sections run from \(y=-\sqrt{1-x^2}\) to \(y=\sqrt{1-x^2}\) and are squares with diagonals in the \(xy\)-plane. The cross-sectional area \(A(x)\) is'
    A: '\(2 - 2 x^{2}\)'
    B: '\(1 - x^{2}\)'
    C: '\(4 - 4 x^{2}\)'
    D: '\(8 - 8 x^{2}\)'
    answer: A
    hint: Find the length of the cross-section first (here the vertical distance between the two semicircles), then the area formula for the shape.
    explanation: 'The length is \(2\sqrt{1-x^2}\): the diagonal is \(2\sqrt{1-x^2}\), so the side is \(\sqrt2\sqrt{1-x^2}\). So \(A(x)=2 - 2 x^{2}\).'
  4:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=-1\) and \(x=1\); its cross-sections run from \(y=-\sqrt{1-x^2}\) to \(y=\sqrt{1-x^2}\) and are equilateral triangles with bases in the \(xy\)-plane. The cross-sectional area \(A(x)\) is'
    A: '\(- 4 \sqrt{3} x^{2} + 4 \sqrt{3}\)'
    B: '\(- \frac{\sqrt{3} x^{2}}{2} + \frac{\sqrt{3}}{2}\)'
    C: '\(- \sqrt{3} x^{2} + \sqrt{3}\)'
    D: '\(- 2 \sqrt{3} x^{2} + 2 \sqrt{3}\)'
    answer: C
    hint: Find the length of the cross-section first (here the vertical distance between the two semicircles), then the area formula for the shape.
    explanation: 'The length is \(2\sqrt{1-x^2}\): the base is \(2\sqrt{1-x^2}\) and the area of an equilateral triangle is \(\tfrac{\sqrt3}{4}s^2\). So \(A(x)=- \sqrt{3} x^{2} + \sqrt{3}\).'
  5:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=0\) and \(x=4\); the cross-sections run from \(y=-\sqrt x\) to \(y=\sqrt x\) and are circular disks with the \(xy\)-plane segment as a diameter, side or base. The cross-sectional area is'
    A: '\(2 \pi x\)'
    B: '\(\frac{\pi x}{2}\)'
    C: '\(\pi x\)'
    D: '\(\pi x^{2}\)'
    answer: C
    hint: 'The segment from \(-\sqrt x\) to \(\sqrt x\) has length \(2\sqrt x\).'
    explanation: 'With the length \(2\sqrt{x}\): disks \(\pi x\), squares \(4x\), diagonal squares \(2x\), equilateral triangles \(\sqrt3x\).'
  6:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=0\) and \(x=4\); the cross-sections run from \(y=-\sqrt x\) to \(y=\sqrt x\) and are squares with bases in the \(xy\)-plane with the \(xy\)-plane segment as a diameter, side or base. The cross-sectional area is'
    A: '\(8 x\)'
    B: '\(2 x\)'
    C: '\(4 x^{2}\)'
    D: '\(4 x\)'
    answer: D
    hint: 'The segment from \(-\sqrt x\) to \(\sqrt x\) has length \(2\sqrt x\).'
    explanation: 'With the length \(2\sqrt{x}\): disks \(\pi x\), squares \(4x\), diagonal squares \(2x\), equilateral triangles \(\sqrt3x\).'
  7:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=0\) and \(x=4\); the cross-sections run from \(y=-\sqrt x\) to \(y=\sqrt x\) and are squares with diagonals in the \(xy\)-plane with the \(xy\)-plane segment as a diameter, side or base. The cross-sectional area is'
    A: '\(2 x^{2}\)'
    B: '\(4 x\)'
    C: '\(x\)'
    D: '\(2 x\)'
    answer: D
    hint: 'The segment from \(-\sqrt x\) to \(\sqrt x\) has length \(2\sqrt x\).'
    explanation: 'With the length \(2\sqrt{x}\): disks \(\pi x\), squares \(4x\), diagonal squares \(2x\), equilateral triangles \(\sqrt3x\).'
  8:
    topic: s6-1
    question: 'The solid lies between planes perpendicular to the \(x\)-axis at \(x=0\) and \(x=4\); the cross-sections run from \(y=-\sqrt x\) to \(y=\sqrt x\) and are equilateral triangles with the \(xy\)-plane segment as a diameter, side or base. The cross-sectional area is'
    A: '\(\sqrt{3} x^{2}\)'
    B: '\(2 \sqrt{3} x\)'
    C: '\(\frac{\sqrt{3} x}{2}\)'
    D: '\(\sqrt{3} x\)'
    answer: D
    hint: 'The segment from \(-\sqrt x\) to \(\sqrt x\) has length \(2\sqrt x\).'
    explanation: 'With the length \(2\sqrt{x}\): disks \(\pi x\), squares \(4x\), diagonal squares \(2x\), equilateral triangles \(\sqrt3x\).'
  9:
    topic: s6-1
    question: 'The solid lies between \(x=0\) and \(x=4\); its cross-sections between \(y=-\sqrt x\) and \(y=\sqrt x\) are squares. Its volume is'
    A: '\(16\)'
    B: '\(32\)'
    C: '\(-32\)'
    D: '\(64\)'
    answer: B
    hint: '\(V=\int_0^4A(x)\,dx\) with \(A=(2\sqrt x)^2\).'
    explanation: '\(\int_0^44x\,dx=32\).'
  10:
    topic: s6-1
    question: 'The solid lies between \(x=-1\) and \(x=1\); cross-sections are disks whose diameters run from \(y=x^2\) to \(y=2-x^2\). Its volume is'
    A: '\(\frac{16 \pi}{15}\)'
    B: '\(- \frac{16 \pi}{15}\)'
    C: '\(\frac{32 \pi}{15}\)'
    D: '\(\frac{16}{15}\)'
    answer: A
    hint: 'The diameter is \(2-2x^2\), so the radius is \(1-x^2\).'
    explanation: '\(V=\pi\int_{-1}^1(1-x^2)^2dx=\tfrac{16\pi}{15}\).'
  11:
    topic: s6-1
    question: 'The solid lies between \(x=-1\) and \(x=1\); cross-sections are squares with bases from \(y=-\sqrt{1-x^2}\) to \(y=\sqrt{1-x^2}\). Its volume is'
    A: '\(- \frac{16}{3}\)'
    B: '\(\frac{32}{3}\)'
    C: '\(\frac{8}{3}\)'
    D: '\(\frac{16}{3}\)'
    answer: D
    hint: '\(A=(2\sqrt{1-x^2})^2\).'
    explanation: '\(\int_{-1}^14(1-x^2)dx=\tfrac{16}{3}\).'
  12:
    topic: s6-1
    question: 'The same solid but with squares whose diagonals run from \(y=-\sqrt{1-x^2}\) to \(y=\sqrt{1-x^2}\) has volume'
    A: '\(\frac{4}{3}\)'
    B: '\(\frac{8}{3}\)'
    C: '\(- \frac{8}{3}\)'
    D: '\(\frac{16}{3}\)'
    answer: B
    hint: 'A square with diagonal \(d\) has area \(d^2/2\).'
    explanation: '\(\int_{-1}^12(1-x^2)dx=\tfrac83\).'
  13:
    topic: s6-1
    question: 'The base of a solid is the region between \(y=2\sqrt{\sin x}\) and the \(x\)-axis on \([0,\pi]\). Its cross-sections perpendicular to the \(x\)-axis are equilateral triangles with bases from the axis to the curve. The volume is'
    A: '\(\sqrt{3}\)'
    B: '\(- 2 \sqrt{3}\)'
    C: '\(4 \sqrt{3}\)'
    D: '\(2 \sqrt{3}\)'
    answer: D
    hint: 'The side is \(2\sqrt{\sin x}\); equilateral area is \(\tfrac{\sqrt3}{4}s^2\).'
    explanation: '\(\int_0^\pi\sqrt3\sin x\,dx=2\sqrt3\).'
  14:
    topic: s6-1
    question: 'With the same base, but cross-sections that are squares with bases running from the \(x\)-axis to the curve, the volume is'
    A: '\(8\)'
    B: '\(4\)'
    C: '\(16\)'
    D: '\(-8\)'
    answer: A
    hint: '\(A=(2\sqrt{\sin x})^2=4\sin x\).'
    explanation: '\(\int_0^\pi4\sin x\,dx=8\).'
  15:
    topic: s6-1
    question: 'The solid lies between \(x=-\pi/3\) and \(x=\pi/3\); its cross-sections are circular disks whose diameters run from \(y=\tan x\) to \(y=\sec x\). The volume is'
    A: '\(\frac{\pi \left(\pi - 6 \sqrt{3}\right)}{6}\)'
    B: '\(\frac{\pi \left(- \pi + 6 \sqrt{3}\right)}{6}\)'
    C: '\(- \frac{\pi}{6} + \sqrt{3}\)'
    D: '\(\frac{\pi \left(- \pi + 6 \sqrt{3}\right)}{3}\)'
    answer: B
    hint: 'The radius is \(\tfrac12(\sec x-\tan x)\).'
    explanation: '\(\tfrac\pi4\int_{-\pi/3}^{\pi/3}(\sec x-\tan x)^2dx\).'
  16:
    topic: s6-1
    question: 'The solid lies between \(y=0\) and \(y=2\); its cross-sections perpendicular to the \(y\)-axis are disks whose diameters run from the \(y\)-axis to the parabola \(x=\sqrt5y^2\). Its volume is'
    A: '\(8\)'
    B: '\(- 8 \pi\)'
    C: '\(16 \pi\)'
    D: '\(8 \pi\)'
    answer: D
    hint: 'The diameter is \(\sqrt5y^2\), so \(A=\tfrac\pi4\cdot5y^4\).'
    explanation: '\(\tfrac{5\pi}4\cdot\tfrac{32}5=8\pi\).'
  17:
    topic: s6-1
    question: 'The base of a solid is the disk \(x^2+y^2\le1\). Its cross-sections perpendicular to the \(y\)-axis between \(y=-1\) and \(y=1\) are isosceles right triangles with one leg in the disk. The volume is'
    A: '\(\frac{4}{3}\)'
    B: '\(- \frac{8}{3}\)'
    C: '\(\frac{16}{3}\)'
    D: '\(\frac{8}{3}\)'
    answer: D
    hint: 'The leg is \(2\sqrt{1-y^2}\); the area is \(\tfrac12\) leg\(^2\).'
    explanation: '\(\int_{-1}^12(1-y^2)dy=\tfrac83\).'
  18:
    topic: s6-1
    question: 'The solid lies between \(x=-1\) and \(x=1\); cross-sections are circles whose diameters stretch from \(y=-\dfrac{1}{\sqrt{1+x^2}}\) to \(y=\dfrac{1}{\sqrt{1+x^2}}\). The volume is'
    A: '\(\frac{\pi}{2}\)'
    B: '\(\frac{\pi^{2}}{2}\)'
    C: '\(- \frac{\pi^{2}}{2}\)'
    D: '\(\pi^{2}\)'
    answer: B
    hint: 'The radius is \(\dfrac{1}{\sqrt{1+x^2}}\), so \(A=\dfrac{\pi}{1+x^2}\).'
    explanation: '\(\pi\left[\tan^{-1}x\right]_{-1}^1=\dfrac{\pi^2}{2}\).'
  19:
    topic: s6-1
    question: 'With the same \(x\)-range, cross-sections that are vertical squares with base edges from \(y=-\dfrac1{\sqrt{1+x^2}}\) to \(y=\dfrac1{\sqrt{1+x^2}}\) give volume'
    A: '\(4 \pi\)'
    B: '\(2 \pi\)'
    C: '\(2\)'
    D: '\(- 2 \pi\)'
    answer: B
    hint: 'The side is \(\dfrac{2}{\sqrt{1+x^2}}\).'
    explanation: '\(4\left[\tan^{-1}x\right]_{-1}^1=2\pi\).'
  20:
    topic: s6-1
    question: 'A square of side \(s\) lies in a plane perpendicular to a line \(L\). One vertex is on \(L\). The square moves a distance \(h\) along \(L\), turning once, to form a twisted column. Its volume is'
    A: '\(\dfrac{s^2h}{3}\)'
    B: '\(s^2h\)'
    C: '\(\pi s^2h\)'
    D: '\(\dfrac{s^2h}{2}\)'
    answer: B
    hint: 'Every cross-section has area \(s^2\); rotation does not change area (Cavalieri''s principle).'
    explanation: The volume is the area times the height. Turning twice instead of once does not change it.
  21:
    topic: s6-1
    question: 'A solid between \(x=0\) and \(x=12\) has circular-disk cross-sections with diameters from \(y=x/2\) to \(y=x\). Its volume equals that of a right circular cone with base radius 3 and height 12. Why?'
    A: The solids are congruent
    B: Both have the same surface area
    C: Both have radius 3
    D: 'Cross-sectional areas match at every \(x\) (Cavalieri''s principle)'
    answer: D
    hint: 'The disk diameter is \(x/2\).'
    explanation: '\(A(x)=\pi(x/4)^2\) in both solids; the cone of radius 3 and height 12 has volume \(36\pi\).'
  22:
    topic: s6-1
    question: 'The region bounded by \(y=x^2\), \(y=0\), \(x=2\) is revolved about the \(x\)-axis. Using the disk method, the volume is'
    A: '\(- \frac{32 \pi}{5}\)'
    B: '\(\frac{32}{5}\)'
    C: '\(\frac{64 \pi}{5}\)'
    D: '\(\frac{32 \pi}{5}\)'
    answer: D
    hint: '\(V=\pi\int_a^b[f(x)]^2dx\).'
    explanation: '\(V=\pi\int_{0}^{2}\left(x^{4}\right)dx=\frac{32 \pi}{5}\).'
  23:
    topic: s6-1
    question: 'The region bounded by \(y=x^3\), \(y=0\), \(x=2\) is revolved about the \(x\)-axis. Using the disk method, the volume is'
    A: '\(\frac{128 \pi}{7}\)'
    B: '\(- \frac{128 \pi}{7}\)'
    C: '\(\frac{128}{7}\)'
    D: '\(\frac{256 \pi}{7}\)'
    answer: A
    hint: '\(V=\pi\int_a^b[f(x)]^2dx\).'
    explanation: '\(V=\pi\int_{0}^{2}\left(x^{6}\right)dx=\frac{128 \pi}{7}\).'
  24:
    topic: s6-1
    question: 'The region bounded by \(y=\sqrt{9-x^2}\), \(y=0\) is revolved about the \(x\)-axis. Using the disk method, the volume is'
    A: '\(72 \pi\)'
    B: '\(36 \pi\)'
    C: '\(36\)'
    D: '\(- 36 \pi\)'
    answer: B
    hint: '\(V=\pi\int_a^b[f(x)]^2dx\).'
    explanation: '\(V=\pi\int_{-3}^{3}\left(9 - x^{2}\right)dx=36 \pi\).'
  25:
    topic: s6-1
    question: 'The region bounded by \(y=x-x^2\), \(y=0\) is revolved about the \(x\)-axis. Using the disk method, the volume is'
    A: '\(\frac{1}{30}\)'
    B: '\(\frac{\pi}{15}\)'
    C: '\(\frac{\pi}{30}\)'
    D: '\(- \frac{\pi}{30}\)'
    answer: C
    hint: '\(V=\pi\int_a^b[f(x)]^2dx\).'
    explanation: '\(V=\pi\int_{0}^{1}\left(\left(- x^{2} + x\right)^{2}\right)dx=\frac{\pi}{30}\).'
  26:
    topic: s6-1
    question: 'The region bounded by \(y=\sqrt{\cos x}\), \(0\le x\le\tfrac\pi2\), \(y=0\), \(x=0\) is revolved about the \(x\)-axis. Using the disk method, the volume is'
    A: '\(\pi\)'
    B: '\(1\)'
    C: '\(2 \pi\)'
    D: '\(- \pi\)'
    answer: A
    hint: '\(V=\pi\int_a^b[f(x)]^2dx\).'
    explanation: '\(V=\pi\int_{0}^{\frac{\pi}{2}}\left(\cos{\left(x \right)}\right)dx=\pi\).'
  27:
    topic: s6-1
    question: 'The region bounded by \(y=\sec x\), \(y=0\), \(x=-\tfrac\pi4\), \(x=\tfrac\pi4\) is revolved about the \(x\)-axis. Using the disk method, the volume is'
    A: '\(4 \pi\)'
    B: '\(- 2 \pi\)'
    C: '\(2\)'
    D: '\(2 \pi\)'
    answer: D
    hint: '\(V=\pi\int_a^b[f(x)]^2dx\).'
    explanation: '\(V=\pi\int_{- \frac{\pi}{4}}^{\frac{\pi}{4}}\left(\sec^{2}{\left(x \right)}\right)dx=2 \pi\).'
  28:
    topic: s6-1
    question: 'The region bounded by \(y=e^{-x}\), \(y=0\), \(x=0\), \(x=1\) is revolved about the \(x\)-axis. Using the disk method, the volume is'
    A: '\(- \frac{\pi}{2} + \frac{\pi}{2 e^{2}}\)'
    B: '\(- \frac{1 - e^{2}}{2 e^{2}}\)'
    C: '\(- \frac{\pi}{e^{2}} + \pi\)'
    D: '\(- \frac{\pi}{2 e^{2}} + \frac{\pi}{2}\)'
    answer: D
    hint: '\(V=\pi\int_a^b[f(x)]^2dx\).'
    explanation: '\(V=\pi\int_{0}^{1}\left(e^{- 2 x}\right)dx=- \frac{\pi}{2 e^{2}} + \frac{\pi}{2}\).'
  29:
    topic: s6-1
    question: 'The region under \(x+2y=2\) in the first quadrant is revolved about the \(x\)-axis. The volume is'
    A: '\(\frac{4 \pi}{3}\)'
    B: '\(\frac{2 \pi}{3}\)'
    C: '\(\frac{2}{3}\)'
    D: '\(- \frac{2 \pi}{3}\)'
    answer: B
    hint: '\(y=\tfrac{2-x}{2}\) for \(0\le x\le2\).'
    explanation: '\(\tfrac\pi4\int_0^2(2-x)^2dx=\tfrac{2\pi}3\).'
  30:
    topic: s6-1
    question: 'The region between the \(y\)-axis, \(y=2\), and the line \(x=\tfrac{3y}{2}\) (for \(0\le y\le2\)) is revolved about the \(y\)-axis. The volume is'
    A: '\(6 \pi\)'
    B: '\(12 \pi\)'
    C: '\(6\)'
    D: '\(- 6 \pi\)'
    answer: A
    hint: 'Integrate with respect to \(y\); the radius is \(x=\tfrac{3y}{2}\).'
    explanation: '\(\tfrac{9\pi}4\int_0^2y^2dy=6\pi\).'
  31:
    topic: s6-1
    question: 'The region under \(y=\sin x\cos x\) on \([0,\tfrac\pi2]\) is revolved about the \(x\)-axis. The volume is'
    A: '\(\frac{\pi}{16}\)'
    B: '\(\frac{\pi^{2}}{8}\)'
    C: '\(\frac{\pi^{2}}{16}\)'
    D: '\(- \frac{\pi^{2}}{16}\)'
    answer: C
    hint: '\(\sin^2x\cos^2x=\tfrac14\sin^22x\).'
    explanation: '\(\dfrac{\pi^2}{16}\).'
  32:
    topic: s6-1
    question: 'The region bounded by \(y=\dfrac{1}{2\sqrt x}\), the \(x\)-axis, \(x=\tfrac14\) and \(x=4\) is revolved about the \(x\)-axis. The volume is'
    A: '\(\pi \ln{\left(2 \right)}\)'
    B: '\(- \pi \ln{\left(2 \right)}\)'
    C: '\(\ln{\left(2 \right)}\)'
    D: '\(2 \pi \ln{\left(2 \right)}\)'
    answer: A
    hint: '\(y^2=\dfrac{1}{4x}\).'
    explanation: '\(\tfrac\pi4\ln16=\pi\ln2\).'
  33:
    topic: s6-1
    question: 'The region bounded by \(y=\sqrt{\cot x}\), the \(x\)-axis, \(x=\tfrac\pi6\) and \(x=\tfrac\pi2\) is revolved about the \(x\)-axis. The volume is'
    A: '\(- \pi \ln{\left(2 \right)}\)'
    B: '\(2 \pi \ln{\left(2 \right)}\)'
    C: '\(\pi \ln{\left(2 \right)}\)'
    D: '\(\ln{\left(2 \right)}\)'
    answer: C
    hint: '\(\int\cot x\,dx=\ln|\sin x|\).'
    explanation: '\(\pi\ln\dfrac{1}{1/2}=\pi\ln2\).'
  34:
    topic: s6-1
    question: 'The region enclosed by \(x=\sqrt5\,y^2\), \(x=0\), \(y=-1\) and \(y=1\) is revolved about the \(y\)-axis. The volume is'
    A: '\(- 2 \pi\)'
    B: '\(4 \pi\)'
    C: '\(2\)'
    D: '\(2 \pi\)'
    answer: D
    hint: 'Use disks perpendicular to the \(y\)-axis.'
    explanation: '\(5\pi\cdot\tfrac25=2\pi\).'
  35:
    topic: s6-1
    question: 'The region enclosed by \(y=x\), \(y=1\), \(x=0\) is revolved about the \(x\)-axis. Using washers, the volume is'
    A: '\(\frac{2 \pi}{3}\)'
    B: '\(\frac{4 \pi}{3}\)'
    C: '\(- \frac{2 \pi}{3}\)'
    D: '\(\frac{2}{3}\)'
    answer: A
    hint: '\(V=\pi\int(R^2-r^2)\,dx\), where \(R\) is the outer curve and \(r\) the inner.'
    explanation: 'Outer minus inner squared, integrated: \(V=\frac{2 \pi}{3}\).'
  36:
    topic: s6-1
    question: 'The region enclosed by \(y=2\sqrt x\), \(y=2\), \(x=0\) is revolved about the \(x\)-axis. Using washers, the volume is'
    A: '\(2 \pi\)'
    B: '\(2\)'
    C: '\(- 2 \pi\)'
    D: '\(4 \pi\)'
    answer: A
    hint: '\(V=\pi\int(R^2-r^2)\,dx\), where \(R\) is the outer curve and \(r\) the inner.'
    explanation: 'Outer minus inner squared, integrated: \(V=2 \pi\).'
  37:
    topic: s6-1
    question: 'The region enclosed by \(y=x^2+1\) and \(y=x+3\) is revolved about the \(x\)-axis. Using washers, the volume is'
    A: '\(\frac{117 \pi}{5}\)'
    B: '\(\frac{234 \pi}{5}\)'
    C: '\(\frac{117}{5}\)'
    D: '\(- \frac{117 \pi}{5}\)'
    answer: A
    hint: '\(V=\pi\int(R^2-r^2)\,dx\), where \(R\) is the outer curve and \(r\) the inner.'
    explanation: 'Outer minus inner squared, integrated: \(V=\frac{117 \pi}{5}\).'
  38:
    topic: s6-1
    question: 'The region enclosed by \(y=4-x^2\) and \(y=2-x\) is revolved about the \(x\)-axis. Using washers, the volume is'
    A: '\(\frac{108 \pi}{5}\)'
    B: '\(\frac{108}{5}\)'
    C: '\(- \frac{108 \pi}{5}\)'
    D: '\(\frac{216 \pi}{5}\)'
    answer: A
    hint: '\(V=\pi\int(R^2-r^2)\,dx\), where \(R\) is the outer curve and \(r\) the inner.'
    explanation: 'Outer minus inner squared, integrated: \(V=\frac{108 \pi}{5}\).'
  39:
    topic: s6-1
