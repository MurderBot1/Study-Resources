    explanation: '\(\left(\tfrac{a}{3},\tfrac{b}{3}\right)\).'
  136:
    topic: s6-4
    question: The centroid of a triangle lies at the intersection of the medians, which is
    A: at the midpoint of each side
    B: at the vertex with the largest angle
    C: one-third of the way from each side toward the opposite vertex
    D: halfway along each median
    answer: C
    hint: 'For the triangle of height \(h\), \(\bar y=\dfrac1A\int y\,L(y)\,dy=\dfrac h3\).'
    explanation: 'Computing \(\int_0^hy\cdot\tfrac bh(h-y)\,dy\) over \(\tfrac12bh\) gives \(\bar y=\tfrac h3\).'
  137:
    topic: s6-4
    question: 'The moment about the \(x\)-axis of a wire of constant density 1 lying along \(y=\sqrt x\) from \(x=0\) to \(x=2\) is'
    A: '\(- \frac{13}{6}\)'
    B: '\(\frac{13}{12}\)'
    C: '\(\frac{13}{3}\)'
    D: '\(\frac{13}{6}\)'
    answer: D
    hint: '\(M_x=\int y\,ds\) with \(ds=\sqrt{1+\tfrac1{4x}}\,dx\).'
    explanation: '\(\int_0^2\sqrt{x+\tfrac14}\,dx=\tfrac23\left[(\tfrac94)^{3/2}-(\tfrac14)^{3/2}\right]=\tfrac{13}6\).'
  138:
    topic: s6-4
    question: 'The moment about the \(x\)-axis of a wire of density 1 lying along \(y=x^3\) from \(x=0\) to \(x=1\) is'
    A: '\(\frac{1}{54} - \frac{5 \sqrt{10}}{27}\)'
    B: '\(- \frac{1}{108} + \frac{5 \sqrt{10}}{54}\)'
    C: '\(- \frac{1}{27} + \frac{10 \sqrt{10}}{27}\)'
    D: '\(- \frac{1}{54} + \frac{5 \sqrt{10}}{27}\)'
    answer: D
    hint: '\(M_x=\int y\,ds\), \(ds=\sqrt{1+9x^4}\,dx\). Let \(u=1+9x^4\).'
    explanation: '\(\tfrac1{54}\left[(1+9x^4)^{3/2}\right]_0^1=\dfrac{10\sqrt{10}-1}{54}\).'
  139:
    topic: s6-4
    question: 'The centroid of a circular arc of radius \(a\) and half-angle \(\alpha\), symmetric about the \(y\)-axis, has \(\bar y=\)'
    A: '\(\dfrac{a\alpha}{\sin\alpha}\)'
    B: '\(\dfrac{2a}{\pi}\)'
    C: '\(\dfrac{a\cos\alpha}{\alpha}\)'
    D: '\(\dfrac{a\sin\alpha}{\alpha}\)'
    answer: D
    hint: 'For a semicircle (\(\alpha=\tfrac\pi2\)) this must give \(\tfrac{2a}{\pi}\).'
    explanation: '\(\dfrac{a\sin(\pi/2)}{\pi/2}=\dfrac{2a}\pi\) as expected.'
  140:
    topic: s6-4
    question: 'Find \(\displaystyle\lim_{\alpha\to0^+}\dfrac{\sin\alpha-\alpha\cos\alpha}{\alpha-\alpha\cos\alpha}\) (the ratio \(d/h\) of centroid distance to arc height for a shallow arc).'
    A: '\(\dfrac23\)'
    B: '\(1\)'
    C: '\(\dfrac12\)'
    D: '\(\dfrac13\)'
    answer: A
    hint: "Use L'Hôpital's Rule twice, or Taylor expansions."
    explanation: 'Numerator \(\approx\tfrac{\alpha^3}3\) and denominator \(\approx\tfrac{\alpha^3}{2}\), so the ratio is \(\tfrac23\).'
  141:
    topic: s6-4
    question: 'Whatever \(p>0\) is, the \(y\)-coordinate of the centroid of the parabolic segment bounded by \(y=\dfrac{x^2}{4p}\) and the line \(y=a\) is'
    A: '\(\dfrac34a\)'
    B: '\(\dfrac35a\)'
    C: '\(\dfrac12a\)'
    D: '\(\dfrac23a\)'
    answer: B
    hint: 'The region is symmetric about the \(y\)-axis; integrate with strips of width \(2\sqrt{4py}\).'
    explanation: '\(\bar y=\dfrac{\int_0^ay\sqrt y\,dy}{\int_0^a\sqrt y\,dy}=\dfrac{\frac25a^{5/2}}{\frac23a^{3/2}}=\dfrac35a\).'
  142:
    topic: s6-5
    question: 'The lateral surface area generated by revolving \(y=\tfrac x2\), \(0\le x\le4\), about the \(x\)-axis is'
    A: '\(- 4 \sqrt{5} \pi\)'
    B: '\(8 \sqrt{5} \pi\)'
    C: '\(4 \sqrt{5} \pi\)'
    D: '\(4 \sqrt{5}\)'
    answer: C
    hint: '\(S=\int2\pi y\,ds\) with \(ds=\tfrac{\sqrt5}2dx\). Check: \(\tfrac12\) (base circumference) (slant height).'
    explanation: '\(2\pi\cdot\tfrac{\sqrt5}2\int_0^4\tfrac x2dx=4\pi\sqrt5\).'
  143:
    topic: s6-5
    question: 'The lateral surface area generated by revolving \(y=\tfrac x2\), \(0\le x\le4\), about the \(y\)-axis is'
    A: '\(8 \sqrt{5} \pi\)'
    B: '\(16 \sqrt{5} \pi\)'
    C: '\(- 8 \sqrt{5} \pi\)'
    D: '\(8 \sqrt{5}\)'
    answer: A
    hint: '\(S=\int2\pi x\,ds\).'
    explanation: '\(2\pi\cdot\tfrac{\sqrt5}{2}\cdot8=8\pi\sqrt5\).'
  144:
    topic: s6-5
    question: 'Revolving the segment \(y=\tfrac x2+\tfrac12\), \(1\le x\le3\), about the \(x\)-axis generates a cone frustum with surface area'
    A: '\(3 \sqrt{5}\)'
    B: '\(- 3 \sqrt{5} \pi\)'
    C: '\(6 \sqrt{5} \pi\)'
    D: '\(3 \sqrt{5} \pi\)'
    answer: D
    hint: 'Geometry: \(\pi(r_1+r_2)\times\) slant height, with \(r_1=1\), \(r_2=2\), slant \(\sqrt5\).'
    explanation: '\(3\pi\sqrt5\).'
  145:
    topic: s6-5
    question: 'Revolving that segment about the \(y\)-axis instead gives surface area'
    A: '\(8 \sqrt{5} \pi\)'
    B: '\(4 \sqrt{5}\)'
    C: '\(4 \sqrt{5} \pi\)'
    D: '\(- 4 \sqrt{5} \pi\)'
    answer: C
    hint: 'Radii are 1 and 3; slant height is \(\sqrt5\).'
    explanation: '\(\pi(1+3)\sqrt5=4\pi\sqrt5\).'
  146:
    topic: s6-5
    question: 'The area of the surface generated by revolving \(y=\dfrac{x^3}9\), \(0\le x\le2\), about the \(x\)-axis is'
    A: '\(\frac{98 \pi}{81}\)'
    B: '\(\frac{196 \pi}{81}\)'
    C: '\(- \frac{98 \pi}{81}\)'
    D: '\(\frac{98}{81}\)'
    answer: A
    hint: '\(S=2\pi\int\dfrac{x^3}9\sqrt{1+\dfrac{x^4}9}\,dx\); let \(u=1+\tfrac{x^4}9\).'
    explanation: '\(\tfrac{\pi}{3}\left[u^{3/2}\right]_1^{25/9}=\tfrac{98\pi}{81}\).'
  147:
    topic: s6-5
    question: 'The area of the surface generated by revolving \(y=\sqrt x\), \(\tfrac34\le x\le\tfrac{15}4\), about the \(x\)-axis is'
    A: '\(\frac{56 \pi}{3}\)'
    B: '\(- \frac{28 \pi}{3}\)'
    C: '\(\frac{28}{3}\)'
    D: '\(\frac{28 \pi}{3}\)'
    answer: D
    hint: '\(\sqrt x\sqrt{1+\tfrac1{4x}}=\sqrt{x+\tfrac14}\).'
    explanation: '\(2\pi\cdot\tfrac23\left[(x+\tfrac14)^{3/2}\right]=\tfrac{28\pi}3\).'
  148:
    topic: s6-5
    question: 'The area of the surface generated by revolving \(y=\sqrt{2x-x^2}\), \(0.5\le x\le1.5\), about the \(x\)-axis is'
    A: '\(2\)'
    B: '\(- 2 \pi\)'
    C: '\(4 \pi\)'
    D: '\(2 \pi\)'
    answer: D
    hint: '\(y\sqrt{1+(y'')^2}=1\) for this circle of radius 1.'
    explanation: '\(2\pi\int_{0.5}^{1.5}1\,dx=2\pi\).'
  149:
    topic: s6-5
    question: 'The area of the surface generated by revolving \(y=\sqrt{x+1}\), \(1\le x\le5\), about the \(x\)-axis is'
    A: '\(\frac{49 \pi}{3}\)'
    B: '\(\frac{49}{3}\)'
    C: '\(\frac{98 \pi}{3}\)'
    D: '\(- \frac{49 \pi}{3}\)'
    answer: A
    hint: '\(\sqrt{x+1}\sqrt{1+\tfrac1{4(x+1)}}=\sqrt{x+\tfrac54}\).'
    explanation: '\(2\pi\cdot\tfrac23\left[(x+\tfrac54)^{3/2}\right]_1^5\).'
  150:
    topic: s6-5
    question: 'The surface area of a sphere of radius \(a\), found by revolving \(y=\sqrt{a^2-x^2}\), \(-a\le x\le a\), about the \(x\)-axis, is'
    A: '\(2\pi a^2\)'
    B: '\(\pi a^2\)'
    C: '\(4\pi a^2\)'
    D: '\(\dfrac43\pi a^3\)'
    answer: C
    hint: '\(y\sqrt{1+(y'')^2}=a\).'
    explanation: '\(2\pi\int_{-a}^aa\,dx=4\pi a^2\).'
  151:
    topic: s6-5
    question: 'The lateral surface area of a cone of height \(h\) and base radius \(r\), found by revolving \(y=\tfrac rhx\), \(0\le x\le h\), about the \(x\)-axis, is'
    A: '\(\pi r^2\)'
    B: '\(\pi r\sqrt{r^2+h^2}\)'
    C: '\(2\pi r\sqrt{r^2+h^2}\)'
    D: '\(\dfrac13\pi r^2h\)'
    answer: B
    hint: '\(S=2\pi\int\tfrac rhx\sqrt{1+\tfrac{r^2}{h^2}}\,dx\).'
    explanation: '\(\pi r\sqrt{h^2+r^2}\), the semiperimeter of the base times the slant height.'
  152:
    topic: s6-5
    question: 'The band cut from a sphere of radius \(R\) by two parallel planes \(h\) apart has surface area'
    A: '\(2\pi Rh\)'
    B: '\(4\pi Rh\)'
    C: '\(\pi R^2h\)'
    D: '\(\pi Rh\)'
    answer: A
    hint: The area depends only on the distance between the planes (Archimedes).
    explanation: '\(2\pi\int_a^{a+h}R\,dx=2\pi Rh\).'
  153:
    topic: s6-5
    question: When a curve crosses the axis of revolution, the surface-area formula should use
    A: '\(S=\displaystyle\int2\pi x\,ds\)'
    B: '\(S=\displaystyle\int2\pi f(x)\,ds\) with no change'
    C: '\(S=\displaystyle\int\pi f(x)^2\,dx\)'
    D: '\(S=\displaystyle\int2\pi|f(x)|\,ds\)'
    answer: D
    hint: Otherwise the part below the axis would count negatively.
    explanation: 'For \(y=x\), \(-1\le x\le2\): \(S=2\pi\sqrt2\int|x|\,dx=5\sqrt2\,\pi\).'
  154:
    topic: s6-5
    question: 'The surface area of the double cone generated by revolving \(y=x\), \(-1\le x\le2\), about the \(x\)-axis is'
    A: '\(10 \sqrt{2} \pi\)'
    B: '\(- 5 \sqrt{2} \pi\)'
    C: '\(5 \sqrt{2} \pi\)'
    D: '\(5 \sqrt{2}\)'
    answer: C
    hint: 'Use \(|f(x)|\) in the integrand.'
    explanation: '\(2\pi\sqrt2\left(\tfrac12+2\right)=5\sqrt2\,\pi\).'
  155:
    topic: s6-5
    question: 'Revolving \(x=\cos t\), \(y=2+\sin t\), \(0\le t\le2\pi\), about the \(x\)-axis generates a torus of surface area'
    A: '\(8 \pi^{2}\)'
    B: '\(8 \pi\)'
    C: '\(16 \pi^{2}\)'
    D: '\(- 8 \pi^{2}\)'
    answer: A
    hint: '\(ds=dt\) because the speed is 1. \(S=\int2\pi y\,ds\).'
    explanation: '\(2\pi\cdot4\pi=8\pi^2\).'
  156:
    topic: s6-5
    question: 'Revolving the segment \(x=2t\), \(y=t+1\), \(0\le t\le1\), about the \(x\)-axis gives a frustum of surface area'
    A: '\(3 \sqrt{5}\)'
    B: '\(- 3 \sqrt{5} \pi\)'
    C: '\(6 \sqrt{5} \pi\)'
    D: '\(3 \sqrt{5} \pi\)'
    answer: D
    hint: '\(ds=\sqrt{4+1}\,dt\).'
    explanation: '\(2\pi\sqrt5\left[\tfrac{t^2}2+t\right]_0^1=3\pi\sqrt5\). Geometry: \(\pi(1+2)\sqrt5\).'
  157:
    topic: s6-5
    question: "Pappus's First Theorem says the volume of a solid of revolution equals"
    A: the surface area times the height
    B: the area times the diameter
    C: the perimeter times the radius
    D: the area of the region times the distance traveled by its centroid
    answer: D
    hint: '\(V=2\pi\bar\rho A\).'
    explanation: 'Here \(\bar\rho\) is the distance from the centroid to the axis.'
  158:
    topic: s6-5
    question: "Pappus's Second Theorem says the lateral surface area of a solid of revolution equals"
    A: the volume divided by the radius
    B: 'the area of the region times \(2\pi\)'
    C: half the product of radius and height
    D: the length of the generating curve times the distance traveled by its centroid
    answer: D
    hint: '\(S=2\pi\bar\rho L\).'
    explanation: The centroid of the curve (not the region) is used.
  159:
    topic: s6-5
    question: 'The square with vertices \((0,2)\), \((2,0)\), \((4,2)\), \((2,4)\) is revolved about the \(x\)-axis. Its volume (Pappus) is'
    A: '\(8\pi\)'
    B: '\(16\pi\)'
    C: '\(32\pi\)'
    D: '\(64\pi\)'
    answer: C
    hint: 'The area is 8 and the centroid is \((2,2)\).'
    explanation: '\(V=2\pi\cdot2\cdot8=32\pi\).'
  160:
    topic: s6-5
    question: For the same square, the surface area of the solid (Pappus) is
    A: '\(32\pi\)'
    B: '\(64\pi\sqrt2\)'
    C: '\(16\pi\sqrt2\)'
    D: '\(32\pi\sqrt2\)'
    answer: D
    hint: 'The perimeter is \(4\cdot2\sqrt2\) and the centroid of the boundary is also \((2,2)\).'
    explanation: '\(S=2\pi\cdot2\cdot8\sqrt2=32\pi\sqrt2\).'
  161:
    topic: s6-5
    question: 'The triangle bounded by the coordinate axes and \(2x+y=6\) is revolved about \(x=5\). Its volume is'
    A: '\(72\pi\)'
    B: '\(54\pi\)'
    C: '\(144\pi\)'
    D: '\(36\pi\)'
    answer: A
    hint: 'The area is 9 and the centroid is \((1,2)\), at distance 4 from the line.'
    explanation: '\(V=2\pi\cdot4\cdot9=72\pi\).'
  162:
    topic: s6-5
    question: 'The circle \((x-2)^2+y^2=1\) is revolved about the \(y\)-axis. The volume of the torus (Pappus) is'
    A: '\(4\pi^2\)'
    B: '\(2\pi^2\)'
    C: '\(\pi^2\)'
    D: '\(8\pi^2\)'
    answer: A
    hint: 'The centroid is the center \((2,0)\), at distance 2; the area is \(\pi\).'
    explanation: '\(V=2\pi\cdot2\cdot\pi=4\pi^2\).'
  163:
    topic: s6-5
    question: 'The semicircle \(y=\sqrt{a^2-x^2}\) has its centroid at \(\left(0,\tfrac{2a}\pi\right)\). When the semicircle (an arc) is revolved about the line \(y=a\), the surface area is'
    A: '\(2\pi(a-\tfrac{2a}{\pi})\cdot\pi a=2\pi a^2(\pi-2)\)'
    B: '\(2\pi^2a^2\)'
    C: '\(\pi a^2(\pi-2)\)'
    D: '\(4\pi a^2\)'
    answer: A
    hint: 'Distance from the centroid to the axis is \(a-\tfrac{2a}\pi\); the arc length is \(\pi a\).'
    explanation: '\(S=2\pi\left(a-\tfrac{2a}\pi\right)\pi a=2\pi a^2(\pi-2)\).'
  164:
    topic: s6-5
    question: 'The region under the semiellipse \(y=\tfrac ba\sqrt{a^2-x^2}\) has area \(\tfrac12\pi ab\), and revolving it about the \(x\)-axis gives volume \(\tfrac43\pi ab^2\). By Pappus, the centroid of the region has \(\bar y=\)'
    A: '\(\dfrac{2b}{\pi}\)'
    B: '\(\dfrac{4b}{3\pi}\)'
    C: '\(\dfrac{b}{2}\)'
    D: '\(\dfrac{4a}{3\pi}\)'
    answer: B
    hint: '\(V=2\pi\bar y\,A\).'
    explanation: '\(\bar y=\dfrac{4\pi ab^2/3}{2\pi\cdot\pi ab/2}=\dfrac{4b}{3\pi}\); notice it does not depend on \(a\).'
  165:
    topic: s6-6
    question: "It takes 1800 J of work to stretch a spring from its natural length of 2 m to a length of 5 m. The spring's force constant is"
    A: '\(1200\) N/m'
    B: '\(400\) N/m'
    C: '\(200\) N/m'
    D: '\(600\) N/m'
    answer: B
    hint: '\(W=\tfrac12kx^2\) with \(x=3\) m.'
    explanation: '\(1800=\tfrac12k\cdot9\) gives \(k=400\).'
  166:
    topic: s6-6
    question: An 800-lb force stretches a spring from 10 in. to 14 in. The force constant (in lb/in.) is
    A: '\(200\)'
    B: '\(800\)'
    C: '\(100\)'
    D: '\(400\)'
    answer: A
    hint: '\(F=kx\) with \(x=4\) in.'
    explanation: '\(k=800/4=200\) lb/in.'
  167:
    topic: s6-6
    question: 'With \(k=200\) lb/in., the work done stretching the spring from 10 in. to 12 in. is'
    A: '\(200\) in.-lb'
    B: '\(1600\) in.-lb'
    C: '\(400\) in.-lb'
    D: '\(800\) in.-lb'
    answer: C
    hint: '\(W=\int_0^2200x\,dx\).'
    explanation: '\(100x^2\Big|_0^2=400\).'
  168:
    topic: s6-6
    question: 'With \(k=200\) lb/in., a 1600-lb force stretches the spring how far beyond its natural length?'
    A: '\(16\) in.'
    B: '\(4\) in.'
    C: '\(2\) in.'
    D: '\(8\) in.'
    answer: D
    hint: '\(F=kx\).'
    explanation: '\(x=1600/200\).'
  169:
    topic: s6-6
    question: "A 2 N force stretches a rubber band 2 cm (assume Hooke's law). How much work does it take to stretch it 4 cm?"
    A: '\(0.16\) J'
    B: '\(4\) J'
    C: '\(0.08\) J'
    D: '\(0.04\) J'
    answer: C
    hint: '\(k=2/0.02=100\) N/m.'
    explanation: '\(W=\tfrac12(100)(0.04)^2=0.08\) J.'
  170:
    topic: s6-6
    question: If a force of 90 N stretches a spring 1 m, the work to stretch it 5 m is
    A: '\(2250\) J'
    B: '\(225\) J'
    C: '\(450\) J'
    D: '\(1125\) J'
    answer: D
    hint: '\(k=90\) N/m.'
    explanation: '\(\tfrac12(90)(25)=1125\).'
  171:
    topic: s6-6
    question: 'A subway spring assembly compresses 3 in. under 21,714 lb (force constant \(k=7238\) lb/in.). The work to compress it the first half inch is about'
    A: '\(2714\) in.-lb'
    B: '\(3619\) in.-lb'
    C: '\(905\) in.-lb'
    D: '\(1810\) in.-lb'
    answer: C
    hint: '\(W=\tfrac12kx^2\) with \(x=0.5\).'
    explanation: '\(\tfrac12(7238)(0.25)\approx905\). For the second half inch: \(\tfrac12k(1-0.25)\approx2714\).'
  172:
    topic: s6-6
    question: 'A bathroom scale is compressed \(\tfrac1{16}\) in. by a 150-lb person. The work done compressing it \(\tfrac18\) in. is'
    A: '\(37.5\) in.-lb'
    B: '\(9.375\) in.-lb'
    C: '\(150\) in.-lb'
    D: '\(18.75\) in.-lb'
    answer: D
    hint: '\(k=150\cdot16=2400\) lb/in.'
    explanation: '\(\tfrac12(2400)\left(\tfrac18\right)^2=18.75\).'
  173:
    topic: s6-6
    question: A mountain climber hauls up 50 m of hanging rope weighing 0.624 N/m. The work is
    A: '\(390\text{ J}\)'
    B: '\(780\text{ J}\)'
    C: '\(1{,}170\text{ J}\)'
    D: '\(1{,}560\text{ J}\)'
    answer: B
    hint: 'Work \(=\int_0^{50}0.624x\,dx\).'
    explanation: '\(0.312\cdot2500=780\) J.'
  174:
    topic: s6-6
    question: A 144-lb bag of sand is lifted at a constant rate; half the sand has leaked out by the time it reaches 18 ft. The work (ft-lb) is
    A: '\(3{,}888\text{ ft-lb}\)'
    B: '\(1{,}944\text{ ft-lb}\)'
    C: '\(972\text{ ft-lb}\)'
    D: '\(2{,}916\text{ ft-lb}\)'
    answer: B
    hint: 'The weight at height \(x\) is \(144-4x\).'
    explanation: '\(144\cdot18-2\cdot324=1944\).'
  175:
    topic: s6-6
    question: An elevator cable weighing 4.5 lb/ft is paid out; at the first floor 180 ft are out. The work the motor does lifting only the cable to the top is
    A: '\(72{,}900\text{ ft-lb}\)'
    B: '\(36{,}450\text{ ft-lb}\)'
    C: '\(145{,}800\text{ ft-lb}\)'
    D: '\(109{,}350\text{ ft-lb}\)'
    answer: A
    hint: 'Cable still hanging \(=x\) ft when the car is \(180-x\) ft from the top.'
    explanation: '\(\tfrac92\cdot\tfrac{180^2}2=72{,}900\) ft-lb.'
  176:
    topic: s6-6
    question: A leaky bucket starts with 16 lb of water and loses it at a constant rate, empty just as it reaches a height of 20 ft. The work spent lifting the water alone is
    A: '\(320\text{ ft-lb}\)'
    B: '\(240\text{ ft-lb}\)'
    C: '\(80\text{ ft-lb}\)'
    D: '\(160\text{ ft-lb}\)'
    answer: D
    hint: 'The weight at height \(x\) is \(16-0.8x\).'
    explanation: '\(320-160=160\) ft-lb.'
  177:
    topic: s6-6
    question: 'A particle at \((x,0)\) is attracted to the origin with force \(k/x^2\). It starts at rest at \(x=b\) and reaches \(x=a<b\). The work done on it is'
    A: '\(k\left(\dfrac1b-\dfrac1a\right)\)'
    B: '\(k\ln\dfrac ba\)'
    C: '\(k\left(\dfrac1a-\dfrac1b\right)\)'
    D: '\(\dfrac{k}{ab}\)'
    answer: C
    hint: '\(W=\int_a^b\dfrac{k}{x^2}dx\).'
    explanation: '\(k\left[-\tfrac1x\right]_a^b=k\left(\tfrac1a-\tfrac1b\right)\).'
  178:
    topic: s6-6
    question: 'When a gas in a cylinder of cross-section \(A\) is compressed by a piston from \((p_1,V_1)\) to \((p_2,V_2)\), the work done is'
    A: '\(\displaystyle\int V\,dp\)'
    B: '\(\displaystyle\int_{V_1}^{V_2}p\,dV\)'
    C: '\(\displaystyle\int p\,dA\)'
    D: '\(p(V_2-V_1)\) for any gas'
    answer: B
    hint: 'Force \(=pA\) and \(dV=A\,dx\).'
    explanation: 'Work \(=\int F\,dx=\int pA\,dx=\int p\,dV\) (sign conventions aside).'
  179:
    topic: s6-6
    question: 'Gas obeying \(pV^{1.4}=\text{constant}\) is compressed from \(V_1=243\) in.\(^3\) to \(V_2=32\) in.\(^3\), starting at \(p_1=50\) lb/in.\(^2\). The work (in.-lb) done on the gas is about'
    A: '\(75{,}938\) in.-lb'
    B: '\(2121\) in.-lb'
    C: '\(18{,}984\) in.-lb'
    D: '\(37{,}969\) in.-lb'
    answer: D
    hint: '\(p=cV^{-1.4}\) with \(c=p_1V_1^{1.4}\); \(W=\int_{V_2}^{V_1}p\,dV\).'
    explanation: '\(243^{-0.4}=\tfrac19\) and \(32^{-0.4}=\tfrac14\), so \(W=\dfrac{50\cdot243^{1.4}}{0.4}\left(\tfrac14-\tfrac19\right)=37{,}968.75\).'
  180:
    topic: s6-6
    question: 'A vertical cylindrical tank 30 ft high and 20 ft in diameter is full of kerosene weighing 51.2 lb/ft\(^3\). The work to pump it all to the top of the tank is'
    A: '\(7{,}238{,}229\text{ ft-lb}\)'
    B: '\(2{,}304{,}000\text{ ft-lb}\)'
    C: '\(10{,}857{,}344\text{ ft-lb}\)'
    D: '\(14{,}476{,}459\text{ ft-lb}\)'
    answer: A
    hint: 'A slice at height \(y\) weighs \(51.2\cdot\pi\cdot100\,dy\) and is lifted \(30-y\).'
    explanation: '\(51.2\cdot100\pi\cdot450=2{,}304{,}000\pi\) ft-lb \(\approx7.24\times10^6\) ft-lb.'
  181:
    topic: s6-6
    question: 'The paraboloid tank formed by revolving \(y=x^2\), \(0\le x\le4\) (meters) about the \(y\)-axis is full of seawater (10,000 N/m\(^3\)). The work to pump it all to the top is'
    A: '\(21{,}446{,}606\text{ J}\)'
    B: '\(32{,}169{,}909\text{ J}\)'
    C: '\(6{,}826{,}667\text{ J}\)'
    D: '\(42{,}893{,}212\text{ J}\)'
    answer: A
    hint: 'A slice at height \(y\) has area \(\pi y\) and is lifted \(16-y\).'
    explanation: '\(10^4\pi\int_0^{16}y(16-y)\,dy=10^4\pi\cdot\tfrac{2048}3\approx2.14\times10^7\) J.'
  182:
    topic: s6-6
    question: 'A hemispherical reservoir of radius 5 m is full of water (9800 N/m\(^3\)). The work to pump it all to 4 m above the top is'
    A: '\(22{,}609{,}650\text{ J}\)'
    B: '\(4{,}797{,}917\text{ J}\)'
    C: '\(30{,}146{,}200\text{ J}\)'
    D: '\(15{,}073{,}100\text{ J}\)'
    answer: D
    hint: 'With the origin at the center, the slice at \(y\) has radius \(\sqrt{25-y^2}\) and is lifted \(4-y\).'
    explanation: '\(9800\pi\int_{-5}^0(25-y^2)(4-y)\,dy\approx1.5\times10^7\) J.'
  183:
    topic: s6-6
    question: 'A 2-oz tennis ball is served at 160 ft/s. The work done on it (use \(m=\text{weight}/32\)) is'
    A: '\(100\) ft-lb'
    B: '\(50\) ft-lb'
    C: '\(12.5\) ft-lb'
    D: '\(25\) ft-lb'
    answer: B
    hint: '\(W=\tfrac12mv^2\).'
    explanation: '\(m=\tfrac{2/16}{32}=\tfrac1{256}\), so \(W=\tfrac12\cdot\tfrac{1}{256}\cdot160^2=50\).'
  184:
    topic: s6-6
    question: How many foot-pounds of work does it take to throw a baseball (5 oz) at 90 mph (132 ft/s)?
    A: 'about \(170\) ft-lb'
    B: 'about \(85\) ft-lb'
    C: 'about \(11\) ft-lb'
    D: 'about \(42\) ft-lb'
    answer: B
    hint: '\(m=0.3125/32\), \(W=\tfrac12mv^2\).'
    explanation: '\(\tfrac12(0.009766)(17424)\approx85.1\).'
  185:
    topic: s6-6
    question: A 1.6-oz golf ball leaves the tee at 280 ft/s. The work done on it is about
    A: '\(61\) ft-lb'
    B: '\(12\) ft-lb'
    C: '\(245\) ft-lb'
    D: '\(122.5\) ft-lb'
    answer: D
    hint: '\(m=(0.1)/32\).'
    explanation: '\(\tfrac12(0.003125)(78400)=122.5\).'
  186:
    topic: s6-6
    question: 'The work done on a body by the net force moving it from \(x_1\) to \(x_2\) equals'
    A: the force times the time
    B: its change in velocity
    C: its change in momentum
    D: 'the change in its kinetic energy, \(\tfrac12mv_2^2-\tfrac12mv_1^2\)'
    answer: D
    hint: 'Use \(F=m\,dv/dt=mv\,dv/dx\).'
    explanation: '\(\int F\,dx=\int mv\,dv=\tfrac12mv^2\Big|\).'
  187:
    topic: s6-6
    question: 'A 2-oz steel ball bearing is placed on a vertical spring (\(k=18\) lb/ft), compressed 2 in. and released. How high does it go?'
    A: '\(4\) ft'
    B: '\(1\) ft'
    C: '\(0.25\) ft'
    D: '\(2\) ft'
    answer: D
    hint: 'Spring energy \(\tfrac12kx^2\) becomes gravitational energy \(wh\).'
    explanation: '\(\tfrac12\cdot18\cdot\left(\tfrac16\right)^2=0.25\) ft-lb \(=\tfrac18h\), so \(h=2\) ft.'
  188:
    topic: s6-6
    question: 'The work to lift a 1000-kg satellite from Earth''s surface (\(r=6.37\times10^6\) m) to an orbit \(r=35.78\times10^6\) m is \(\displaystyle\int\dfrac{1000MG}{r^2}dr\) with \(M=5.975\times10^{24}\) kg, \(G=6.672\times10^{-11}\). It is about'
    A: '\(1.4\times10^{9}\) J'
    B: '\(5.14\times10^{7}\) J'
    C: '\(5.14\times10^{10}\) J'
    D: '\(6.3\times10^{9}\) J'
    answer: C
    hint: 'Evaluate \(1000MG\left(\tfrac1{r_1}-\tfrac1{r_2}\right)\).'
    explanation: '\(1000MG\approx3.986\times10^{17}\) and \(\tfrac1{r_1}-\tfrac1{r_2}\approx1.29\times10^{-7}\).'
  189:
    topic: s6-6
    question: 'Two electrons repel with force \(F=\dfrac{23\times10^{-29}}{r^2}\) N. One is fixed at \((1,0)\). The work to move a second one along the \(x\)-axis from \((-1,0)\) to the origin is'
    A: '\(11.5\times10^{-29}\) J'
    B: '\(23\times10^{-29}\) J'
    C: '\(5.75\times10^{-29}\) J'
    D: '\(46\times10^{-29}\) J'
    answer: A
    hint: 'The distance \(r\) from the fixed electron goes from 2 to 1.'
    explanation: '\(\int_1^2\dfrac{23\times10^{-29}}{r^2}dr=23\times10^{-29}\left(1-\tfrac12\right)\).'
  190:
    topic: s6-7
    question: 'The fluid force on a horizontal surface of area \(A\) at depth \(h\) in a fluid of weight density \(w\) is'
    A: '\(F=whA\)'
    B: '\(F=wA/h\)'
    C: '\(F=whA/2\)'
    D: '\(F=wh^2\)'
    answer: A
    hint: 'Pressure is \(wh\); force is pressure times area.'
    explanation: 'On vertical plates, the depth varies, so integrate: \(F=\int w\cdot(\text{depth})\cdot(\text{width})\,dy\).'
  191:
    topic: s6-7
    question: 'A semicircular plate 2 ft in diameter sticks straight down into fresh water (62.4 lb/ft\(^3\)) with the diameter along the surface. The force on one side is'
    A: '\(83.2\text{ lb}\)'
    B: '\(62.4\text{ lb}\)'
    C: '\(20.8\text{ lb}\)'
    D: '\(41.6\text{ lb}\)'
    answer: D
    hint: 'The width at depth \(y\) is \(2\sqrt{1-y^2}\).'
    explanation: '\(62.4\cdot\tfrac23=41.6\) lb.'
  192:
    topic: s6-7
    question: 'An isosceles triangular plate with a 4-ft base is submerged vertically in a lake with its base 1 ft below the surface and its apex 4 ft deeper (at depth 5 ft). The force against one face in fresh water (62.4 lb/ft\(^3\)) is'
    A: '\(1{,}164.8\text{ lb}\)'
    B: '\(1{,}747.2\text{ lb}\)'
    C: '\(2{,}329.6\text{ lb}\)'
    D: '\(582.4\text{ lb}\)'
    answer: A
    hint: 'The width at depth \(y\) is \(5-y\) ft.'
    explanation: '\(62.4\int_1^5y(5-y)\,dy=62.4\cdot\tfrac{56}{3}\approx1164.8\) lb.'
  193:
    topic: s6-7
    question: 'If the same triangular plate is in seawater (64 lb/ft\(^3\)), the force changes by the factor'
    A: '\(\frac{1}{2}\)'
    B: '\(\frac{40}{39}\)'
    C: '\(\frac{39}{40}\)'
    D: '\(2\)'
    answer: B
    hint: The force is proportional to the weight density.
    explanation: '\(\dfrac{64}{62.4}\approx1.026\).'
  194:
    topic: s6-7
    question: 'The vertical ends of a watering trough are 3-ft squares. When the trough is full of water (62.4 lb/ft\(^3\)), the force on each end is'
    A: '\(421.2\text{ lb}\)'
    B: '\(1{,}684.8\text{ lb}\)'
    C: '\(1{,}263.6\text{ lb}\)'
    D: '\(842.4\text{ lb}\)'
    answer: D
    hint: The width is constant, 3 ft.
    explanation: '\(62.4\cdot3\cdot\tfrac92=842.4\) lb.'
  195:
    topic: s6-7
    question: 'For the trough with 3-ft-square ends, the depth to which the water must be lowered to cut the force on the ends by 25% is \(d=3\sqrt{0.75}\approx2.6\) ft. So the level drops by about'
    A: '\(2.4\) in.'
    B: '\(12\) in.'
    C: '\(4.8\) in.'
    D: '\(9\) in.'
    answer: C
    hint: Force is proportional to the square of the depth.
    explanation: '\(3-2.598=0.402\) ft \(\approx4.8\) in.'
  196:
    topic: s6-7
    question: 'The vertical ends of a trough are isosceles triangles (base 4 ft at the top, height 3 ft, apex down). Full of water (62.4 lb/ft\(^3\)), the force on one end is'
    A: '\(187.2\text{ lb}\)'
    B: '\(748.8\text{ lb}\)'
    C: '\(561.6\text{ lb}\)'
    D: '\(374.4\text{ lb}\)'
    answer: D
    hint: 'Measure \(y\) up from the apex: the width at height \(y\) is \(\tfrac43y\) and the depth is \(3-y\).'
    explanation: '\(62.4\cdot\tfrac43\int_0^3y(3-y)\,dy=62.4\cdot6=374.4\) lb.'
  197:
    topic: s6-7
    question: 'A cylindrical milk truck tank of diameter 6 ft is full of milk (64.5 lb/ft\(^3\)). The force on each end is'
    A: '\(8{,}207\text{ lb}\)'
    B: '\(5{,}471\text{ lb}\)'
    C: '\(10{,}942\text{ lb}\)'
    D: '\(1{,}742\text{ lb}\)'
    answer: B
    hint: 'The depth at height \(y\) from the center is \(3-y\); the width is \(2\sqrt{9-y^2}\).'
    explanation: '\(64.5\cdot3\cdot9\pi=64.5\cdot27\pi\approx5471\) lb.'
  198:
    topic: s6-7
    question: 'The average value of the fluid pressure over the vertical dimension of a submerged vertical rectangular plate (top at depth \(d_1\), bottom at depth \(d_2\)) times its area equals'
    A: the pressure at the top times the area
    B: half the weight of the fluid above
    C: the pressure at the bottom times the area
    D: the total force on one face of the plate
    answer: D
    hint: 'Average pressure \(=\dfrac{1}{d_2-d_1}\int_{d_1}^{d_2}wh\,dh\).'
    explanation: 'This is Exercises 15–16: \(F=\operatorname{av}(p)\cdot A\).'
  199:
    topic: s6-7
    question: 'A rectangular fish tank (freshwater, 62.4 lb/ft\(^3\)) has base 2 ft by 4 ft and height 2 ft, filled to 2 in. from the top (water depth \(\tfrac53\) ft). The force on one 4-ft side is'
    A: '\(693.3\text{ lb}\)'
    B: '\(173.3\text{ lb}\)'
    C: '\(346.7\text{ lb}\)'
    D: '\(520\text{ lb}\)'
    answer: C
    hint: '\(F=\int w\,y\cdot4\,dy\).'
    explanation: '\(62.4\cdot4\cdot\tfrac{25}{18}\approx346.7\) lb.'
  200:
    topic: s6-7
    question: 'The same tank: the force on one 2-ft end (width 2 ft, depth \(\tfrac53\) ft) is'
    A: '\(346.7\text{ lb}\)'
    B: '\(260\text{ lb}\)'
    C: '\(173.3\text{ lb}\)'
    D: '\(86.7\text{ lb}\)'
    answer: C
    hint: The width is 2 ft.
    explanation: '\(62.4\cdot2\cdot\tfrac{25}{18}\approx173.3\) lb.'
  201:
    topic: s6-7
    question: A trough has vertical triangular ends with height 3 ft and a top width of 4 ft (apex down). The force on one end when full of water is
    A: '\(561.6\text{ lb}\)'
    B: '\(187.2\text{ lb}\)'
    C: '\(374.4\text{ lb}\)'
    D: '\(748.8\text{ lb}\)'
    answer: C
    hint: Same as the earlier triangular end.
    explanation: '\(374.4\) lb.'
  202:
    topic: s6-7
    question: 'A rectangular plate lies in a vertical plane with its top edge at the water surface. Its width is \(b\) and height \(a\). The fluid force on one face is'
    A: '\(\dfrac12wba^2\)'
    B: '\(wba\)'
    C: '\(\dfrac13wba^2\)'
    D: '\(wba^2\)'
    answer: A
    hint: '\(F=\int_0^awyb\,dy\).'
    explanation: '\(wb\cdot\tfrac{a^2}{2}\).'
  203:
    topic: s6-7
    question: If a vertical plate is lowered deeper into a fluid (with the same orientation), the fluid force on it
    A: increases
    B: decreases
    C: stays the same
    D: doubles exactly
    answer: A
    hint: Pressure increases with depth.
    explanation: Every strip is at greater depth, so each carries more force.
  204:
    topic: s6-7
    question: "The fluid force on a submerged plate depends on the plate's shape and depth but not on"
    A: the length of a trough (for the end plates)
    B: the depth of the plate
    C: the weight density of the fluid
    D: the width of the plate
    answer: A
    hint: 'Which quantity does not appear in \(F=\int w\cdot\text{depth}\cdot\text{width}\,dy\)?'
    explanation: The force on an end plate does not depend on how long the trough is (Exercise 21c).
  205:
    topic: s6-7
    question: 'A tank end is a trapezoid; the fluid force is computed by splitting it into horizontal strips of width \(L(y)\) at depth \(h(y)\). The strip''s force is approximately'
    A: '\(w\,L(y)\,\Delta y\) only'
    B: '\(w\,h(y)^2\Delta y\)'
    C: '\(w\,h(y)\,L(y)\,\Delta y\)'
    D: '\(h(y)\,L(y)/w\)'
    answer: C
    hint: 'Pressure \(wh\) times area \(L\,\Delta y\).'
    explanation: 'Summing the strips and taking \(\Delta y\to0\) gives the integral.'
  206:
    topic: s6-7
    question: A dam face is inclined. For an inclined plate, the fluid force is computed using
    A: only the slant length
    B: only the vertical height
    C: the horizontal width of the plate at the bottom
    D: the vertical depth of each strip and the slant width of the strip
    answer: D
    hint: Pressure depends on vertical depth; area depends on the actual strip length.
    explanation: 'For the 100 ft by 26 ft face with a 24 ft vertical rise, the strip area uses the 26-ft slant: \(F=62.4\cdot100\cdot\tfrac{26}{24}\cdot\tfrac{24^2}{2}\).'
  207:
    topic: s6-7
    question: 'A dam face is a 100 ft by 26 ft rectangle inclined so its top is 24 ft above its bottom. Water (62.4 lb/ft\(^3\)) is level with the top. The force on the dam is'
    A: '\(3{,}894{,}000\text{ lb}\)'
    B: '\(1{,}797{,}120\text{ lb}\)'
    C: '\(1{,}946{,}880\text{ lb}\)'
    D: '\(974{,}000\text{ lb}\)'
    answer: C
    hint: 'Use vertical depth \(y\in[0,24]\) and strip width \(100\cdot\tfrac{26}{24}\,dy\) along the slant.'
    explanation: '\(62.4\cdot100\cdot\tfrac{26}{24}\cdot288=1{,}947{,}000\) lb \(\approx1.95\times10^6\) lb.'
  208:
    topic: s6-7
    question: 'A window 63 in. wide runs from 0.5 in. to 33.5 in. below the surface of seawater (64 lb/ft\(^3\)). The force on it is about'
    A: '\(1310\) lb'
    B: '\(2620\) lb'
    C: '\(650\) lb'
    D: '\(330\) lb'
    answer: A
    hint: 'Convert to feet: width \(\tfrac{63}{12}=5.25\) ft; depths \(\tfrac{0.5}{12}\) to \(\tfrac{33.5}{12}\).'
    explanation: '\(F=64\cdot5.25\cdot\tfrac12\left(d_2^2-d_1^2\right)\approx1309\) lb.'
