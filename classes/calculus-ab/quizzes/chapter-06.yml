    D: '\(- \frac{3}{10}\)'
    answer: A
    hint: '\(\bar y=\dfrac1A\int\tfrac12\left(f^2-g^2\right)dx\), \(\bar x=\dfrac1A\int x(f-g)\,dx\); use symmetry where possible.'
    explanation: 'The area is \(\frac{4}{3}\), giving \(\bar{y}=- \frac{3}{5}\).'
  124:
    topic: s6-4
