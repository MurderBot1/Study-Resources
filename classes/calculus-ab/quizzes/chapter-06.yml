  135:
    topic: s6-4
    question: 'The centroid of the triangle with vertices \((0,0)\), \((a,0)\), \((0,b)\) is'
    A: '\(\left(\dfrac{a}{3},\dfrac{b}{2}\right)\)'
    B: '\(\left(\dfrac a3,\dfrac b3\right)\)'
