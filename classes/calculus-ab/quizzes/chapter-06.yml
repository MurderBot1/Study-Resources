    title: 6.3 Lengths of Plane Curves
  s6-4:
    title: 6.4 Moments and Centers of Mass
  s6-5:
    title: 6.5 Areas of Surfaces of Revolution and the Theorems of Pappus
  s6-6:
    title: 6.6 Work
