  340:
    topic: s16-8
    question: 'The flux of the position vector field \(\mathbf F=x\mathbf i+y\mathbf j+z\mathbf k\) outward through a smooth closed surface \(S\) equals'
    A: zero
    B: 'the area of \(S\)'
    C: the volume enclosed
    D: three times the volume of the region enclosed
    answer: D
