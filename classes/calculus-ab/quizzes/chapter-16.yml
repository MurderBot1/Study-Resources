  237:
    topic: s16-5
    question: 'The moment of inertia of a thin spherical shell of radius \(a\) (density \(\delta\)) about a line tangent to the sphere is'
    A: '\(\dfrac{20\pi}3\delta a^4\)'
    B: '\(\dfrac{16\pi}3\delta a^4\)'
    C: '\(\dfrac{8\pi}3\delta a^4\)'
