  229:
    topic: s16-5
    question: 'The outward flux of \(\mathbf F=z^2\mathbf i+x\mathbf j-3z\mathbf k\) through the parabolic cylinder \(z=4-y^2\) cut by \(x=0\), \(x=1\), and \(z=0\) is'
    A: '\(-32\)'
