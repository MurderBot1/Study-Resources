  325:
    topic: s16-8
    question: 'The outward flux of \(\mathbf F=x^2\mathbf i+y^2\mathbf j+z^2\mathbf k\) across the cylindrical can \(x^2+y^2\le1\), \(0\le z\le1\), is'
