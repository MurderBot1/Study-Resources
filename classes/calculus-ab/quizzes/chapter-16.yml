    explanation: '\(\oint_C\mathbf F\cdot d\mathbf r-\oint_C\mathbf F\cdot d\mathbf r=0\).'
  306:
    topic: s16-7
    question: 'The flux of \(\nabla\times\mathbf F\) for \(\mathbf F=2z\mathbf i+3x\mathbf j+5y\mathbf k\) across the paraboloid \(\mathbf r=(r\cos\theta,r\sin\theta,4-r^2)\), \(0\le r\le2\), outward (upward), is'
    A: '\(12 \pi\)'
    B: '\(- 12 \pi\)'
    C: '\(6 \pi\)'
    D: '\(24 \pi\)'
    answer: A
