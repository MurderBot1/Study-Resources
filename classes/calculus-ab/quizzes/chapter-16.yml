    explanation: '\(I_L=I_{c.m.}+mh^2\).'
  238:
    topic: s16-5
    question: 'The centroid of the lateral surface of a solid right circular cone of base radius \(a\) and height \(h\) lies on the axis at a height above the base equal to'
    A: '\(\dfrac h2\)'
    B: '\(\dfrac{2h}3\)'
    C: '\(\dfrac h3\)'
    D: '\(\dfrac h4\)'
    answer: C
    hint: 'The lateral surface is an ice-cream-cone shell; surface area is proportional to \(r\) times slant length.'
    explanation: The centroid is one third of the way from the base to the vertex.
  239:
    topic: s16-5
    question: 'The area of the surface cut from the bottom of the paraboloid \(z=x^2+y^2\) by the plane \(z=3\) is'
