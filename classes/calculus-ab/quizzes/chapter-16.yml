  232:
    topic: s16-5
    question: 'The centroid of the portion of the sphere \(x^2+y^2+z^2=a^2\) that lies in the first octant is'
    A: '\(\left(\dfrac a2,\dfrac a2,\dfrac a2\right)\)'
    B: '\(\left(\dfrac{2a}3,\dfrac{2a}3,\dfrac{2a}3\right)\)'
    C: '\(\left(\dfrac{a}{3},\dfrac a3,\dfrac a3\right)\)'
