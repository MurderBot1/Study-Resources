    explanation: '\(\iint(10r^2\cos\theta+4r^2\sin\theta+3r)\,dr\,d\theta=12\pi\).'
  307:
    topic: s16-7
    question: 'The flux of \(\nabla\times\mathbf F\) for \(\mathbf F=(y-z)\mathbf i+(z-x)\mathbf j+(x+z)\mathbf k\) across the paraboloid \(\mathbf r=(r\cos\theta,r\sin\theta,9-r^2)\), \(0\le r\le3\), upward, is'
    A: '\(18 \pi\)'
