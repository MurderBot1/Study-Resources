    explanation: '\(\sqrt2\,\delta\cdot2\pi\int_1^2r^3dr=\tfrac{15\sqrt2\pi}2\delta\).'
  235:
    topic: s16-5
    question: 'The mass of the shell cut from the cone \(x^2+y^2-z^2=0\) between \(z=1\) and \(z=2\) with constant density \(\delta\) is'
    A: '\(3 \pi \delta\)'
