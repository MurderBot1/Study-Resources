  311:
    topic: s16-7
    question: 'The circulation of \(\mathbf F=\nabla\times(x\mathbf i+y\mathbf j+z\mathbf k)\) around the boundary of any smooth orientable surface is'
    A: '\(2\pi\)'
    B: the surface area
    C: '\(3\) times the volume'
    D: '\(0\), since \(\nabla\times(x\mathbf i+y\mathbf j+z\mathbf k)=\mathbf0\)'
    answer: D
    hint: The position field is conservative.
    explanation: The curl is zero.
  312:
    topic: s16-7
    question: 'The identity \(\nabla\times\nabla f=\mathbf0\) and Stokes'' Theorem imply that'
    A: the circulation of a gradient field around the boundary of any surface is zero
    B: flux through any closed surface is zero
    C: the divergence of a gradient field is zero
    D: every vector field is a gradient field
    answer: A
    hint: 'Circulation \(=\) flux of the curl.'
    explanation: '\(\nabla\times\nabla f=\mathbf0\).'
  313:
    topic: s16-7
    question: 'For \(f=(x^2+y^2+z^2)^{-1/2}\), the clockwise circulation of \(\mathbf F=\nabla f\) around the circle \(x^2+y^2=a^2\) in the \(xy\)-plane is'
    A: '\(0\)'
    B: '\(\pi a^2\)'
    C: '\(2\pi\)'
    D: '\(-2\pi\)'
    answer: A
    hint: '\(\mathbf F\) is a gradient field.'
    explanation: The circulation around a closed curve is zero.
  314:
    topic: s16-7
    question: 'For the vector field \(\mathbf F=\dfrac{-y}{x^2+y^2}\mathbf i+\dfrac{x}{x^2+y^2}\mathbf j+z\mathbf k\), the curl is'
    A: '\(\mathbf k\) everywhere'
    B: '\(\mathbf 0\) (away from the \(z\)-axis), yet the circulation around the unit circle is \(2\pi\)'
    C: 'nonzero away from the \(z\)-axis'
    D: '\(\mathbf 0\) and the circulation around the unit circle is also \(0\)'
    answer: B
    hint: 'The domain excludes the \(z\)-axis and is not simply connected.'
    explanation: '\(\oint\mathbf F\cdot d\mathbf r=\int_0^{2\pi}1\,dt=2\pi\) on the unit circle.'
  315:
    topic: s16-7
    question: "Does Stokes' Theorem say anything special about circulation in a field whose curl is zero?"
    A: 'Yes: the circulation is always \(2\pi\)'
    B: No; the circulation can be anything
    C: "Yes: the circulation around the boundary of any surface in the domain (on which the field is defined and differentiable) is zero"
    D: Only for planar curves
    answer: C
    hint: 'Circulation \(=\) flux of the curl \(=0\).'
    explanation: 'The surface integral of \(\mathbf 0\) is zero.'
  316:
    topic: s16-7
    question: 'For \(r=\sqrt{x^2+y^2}\), the integral \(\displaystyle\oint_C\nabla(r^4)\cdot\mathbf n\,ds\) around a closed curve \(C\) bounding a plane region \(R\) (moments of inertia \(I_x,I_y\)) equals'
    A: '\(8\left(I_x+I_y\right)\)'
    B: '\(16\left(I_x+I_y\right)\)'
    C: '\(4\left(I_x+I_y\right)\)'
    D: '\(I_x+I_y\)'
    answer: B
    hint: 'By Green''s flux form it equals \(\iint\nabla^2(r^4)\,dA\).'
    explanation: '\(\nabla^2(r^4)=16r^2\) and \(\iint r^2\,dA=I_x+I_y\).'
  317:
    topic: s16-7
    question: 'For \(\mathbf F=\dfrac{-y}{x^2+y^2}\mathbf i+\dfrac x{x^2+y^2}\mathbf j+z\mathbf k\), Stokes'' Theorem does not give circulation zero around the unit circle in the \(xy\)-plane because'
    A: '\(\nabla\times\mathbf F\ne\mathbf 0\)'
