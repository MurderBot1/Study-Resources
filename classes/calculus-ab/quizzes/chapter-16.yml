    explanation: Divergence is a linear operator.
  338:
    topic: s16-8
    question: 'For a differentiable scalar function \(g\) and vector field \(\mathbf F\), \(\nabla\cdot(g\mathbf F)=\)'
    A: '\(\nabla g\cdot\nabla\cdot\mathbf F\)'
    B: '\(g\nabla\times\mathbf F\)'
