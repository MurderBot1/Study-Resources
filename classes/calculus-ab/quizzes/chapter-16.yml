    question: 'The outward flux of \(\mathbf F=z^2\mathbf i+x\mathbf j-3z\mathbf k\) through the parabolic cylinder \(z=4-y^2\), \(0\le x\le1\), \(z\ge0\) (normal away from the \(x\)-axis), using \(\mathbf r=u\mathbf i+v\mathbf j+(4-v^2)\mathbf k\), is'
    A: '\(16\)'
    B: '\(-16\)'
    C: '\(-32\)'
    D: '\(32\)'
    answer: C
    hint: '\(\mathbf r_u\times\mathbf r_v=2v\mathbf j+\mathbf k\); \(\mathbf F\cdot\mathbf n\,dA=\left[2uv-3(4-v^2)\right]du\,dv\).'
    explanation: '\(\int_0^1\int_{-2}^2\left[2uv-12+3v^2\right]dv\,du=-32\).'
  271:
    topic: s16-6
    question: 'The outward (away from the \(yz\)-plane) flux of \(\mathbf F=x^2\mathbf j-xz\mathbf k\) through the parabolic cylinder \(y=x^2\), \(-1\le x\le1\), \(0\le z\le2\), is'
    A: '\(\frac{4}{3}\)'
    B: '\(\frac{8}{3}\)'
    C: '\(\frac{2}{3}\)'
    D: '\(- \frac{4}{3}\)'
    answer: A
    hint: 'Parametrize \(\mathbf r=u\mathbf i+u^2\mathbf j+v\mathbf k\); the normal away from the \(yz\)-plane is \(\mathbf n\,dS=(-2u,1,0)\,du\,dv\).'
    explanation: '\(\mathbf F\cdot\mathbf n=u^2\); \(\int_{-1}^1\int_0^2u^2dv\,du=\tfrac43\).'
  272:
    topic: s16-6
    question: 'The outward flux of \(\mathbf F=z\mathbf k\) across the portion of the sphere \(x^2+y^2+z^2=a^2\) in the first octant is'
    A: '\(\frac{\pi a^{3}}{6}\)'
    B: '\(\frac{\pi a^{3}}{3}\)'
    C: '\(\frac{\pi a^{3}}{2}\)'
    D: '\(\frac{\pi a^{3}}{12}\)'
    answer: A
    hint: 'Use \(\mathbf r=a(\sin u\cos v,\sin u\sin v,\cos u)\); \(\mathbf r_u\times\mathbf r_v\) points outward.'
    explanation: '\(\mathbf F\cdot\mathbf n=a^3\cos^2u\sin u\); integrate over \(0\le u,v\le\tfrac\pi2\).'
  273:
    topic: s16-6
    question: 'The outward flux of \(\mathbf F=x\mathbf i+y\mathbf j+z\mathbf k\) across the sphere \(x^2+y^2+z^2=a^2\) is'
    A: '\(4 \pi a^{3}\)'
    B: '\(2 \pi a^{3}\)'
    C: '\(\frac{4 \pi a^{3}}{3}\)'
    D: '\(8 \pi a^{3}\)'
    answer: A
    hint: 'On the sphere \(\mathbf F\cdot\mathbf n=a\); multiply by the area \(4\pi a^2\).'
    explanation: '\(a\cdot4\pi a^2=4\pi a^3\).'
  274:
    topic: s16-6
    question: 'The upward flux of \(\mathbf F=2xy\mathbf i+2yz\mathbf j+2xz\mathbf k\) across the portion of the plane \(x+y+z=2a\) above the square \(0\le x\le a\), \(0\le y\le a\) is'
    A: '\(\frac{13 a^{4}}{3}\)'
    B: '\(\frac{13 a^{4}}{6}\)'
    C: '\(\frac{19 a^{4}}{6}\)'
    D: '\(\frac{13 a^{4}}{12}\)'
    answer: B
    hint: 'With \(\mathbf r=u\mathbf i+v\mathbf j+(2a-u-v)\mathbf k\), \(\mathbf n\,dA=(1,1,1)\,du\,dv\).'
    explanation: '\(\iint(2uv+2v(2a-u-v)+2u(2a-u-v))\,du\,dv\).'
  275:
    topic: s16-6
    question: 'The outward flux of \(\mathbf F=x\mathbf i+y\mathbf j+z\mathbf k\) through the portion of the cylinder \(x^2+y^2=1\) cut by \(z=0\) and \(z=a\) is'
    A: '\(4 \pi a\)'
    B: '\(2 \pi a^{2}\)'
    C: '\(2 \pi a\)'
    D: '\(\pi a\)'
    answer: C
    hint: 'On the cylinder \(\mathbf F\cdot\mathbf n=x^2+y^2=1\) (the \(z\)-component does not contribute on the side).'
    explanation: 'The flux is the lateral area \(2\pi a\).'
  276:
    topic: s16-6
    question: 'The outward (normal away from the \(z\)-axis) flux of \(\mathbf F=xy\mathbf i-z\mathbf k\) through the cone \(z=\sqrt{x^2+y^2}\), \(0\le z\le1\), is'
    A: '\(\frac{2 \pi}{3}\)'
    B: '\(- \frac{2 \pi}{3}\)'
    C: '\(\frac{4 \pi}{3}\)'
    D: '\(\frac{\pi}{3}\)'
    answer: A
    hint: 'With \(\mathbf r=(u\cos v,u\sin v,u)\), \(\mathbf r_u\times\mathbf r_v=(-u\cos v,-u\sin v,u)\); take the opposite orientation.'
    explanation: '\(\mathbf F\cdot\mathbf n\,dA=\left[u^3\cos^2v\sin v\cdots+u^2\right]\).'
  277:
    topic: s16-6
    question: 'The outward flux of \(\mathbf F=y^2\mathbf i+xz\mathbf j-\mathbf k\) through the cone \(z=2\sqrt{x^2+y^2}\), \(2\le z\le4\) (normal away from the \(z\)-axis), is'
    A: '\(- 3 \pi\)'
    B: '\(3 \pi\)'
    C: '\(\frac{3 \pi}{2}\)'
    D: '\(6 \pi\)'
    answer: B
    hint: 'Use \(\mathbf r=(u\cos v,u\sin v,2u)\) with \(1\le u\le2\); \(\mathbf r_u\times\mathbf r_v=(-2u\cos v,-2u\sin v,u)\) points inward, so reverse it.'
    explanation: 'The \(\mathbf k\) component contributes \(-1\cdot(-u)\) after reversing.'
  278:
    topic: s16-6
    question: 'The outward flux of \(\mathbf F=-x\mathbf i-y\mathbf j+z^2\mathbf k\) through the cone frustum \(z=\sqrt{x^2+y^2}\), \(1\le z\le2\) (normal away from the \(z\)-axis), is'
    A: '\(\frac{73 \pi}{6}\)'
    B: '\(- \frac{73 \pi}{6}\)'
    C: '\(- \frac{73 \pi}{3}\)'
    D: '\(- \frac{73 \pi}{12}\)'
    answer: B
    hint: 'Reverse the orientation of \(\mathbf r_u\times\mathbf r_v=(-u\cos v,-u\sin v,u)\).'
    explanation: 'With the outward normal \((u\cos v,u\sin v,-u)\): \(\mathbf F\cdot\mathbf n=-(u^2+u^3)\); integrate over \(1\le u\le2\), \(0\le v\le2\pi\).'
  279:
    topic: s16-6
    question: 'The outward (away from the \(z\)-axis) flux of \(\mathbf F=4x\mathbf i+4y\mathbf j+2\mathbf k\) through the paraboloid \(z=x^2+y^2\), \(0\le z\le1\), is'
    A: '\(\pi\)'
    B: '\(4 \pi\)'
    C: '\(- 2 \pi\)'
    D: '\(2 \pi\)'
    answer: D
    hint: 'With \(\mathbf r=(u\cos v,u\sin v,u^2)\) take \(\mathbf n\,dA=(2u^2\cos v,2u^2\sin v,-u)\,du\,dv\).'
    explanation: '\(\iint\left(8u^3-2u\right)du\,dv=2\pi(2-1)=2\pi\).'
  280:
    topic: s16-6
    question: 'The centroid of the portion of the sphere \(x^2+y^2+z^2=a^2\) in the first octant lies at \((\bar x,\bar y,\bar z)=\)'
    A: '\(\left(\dfrac a3,\dfrac a3,\dfrac a3\right)\)'
    B: '\(\left(\dfrac{3a}8,\dfrac{3a}8,\dfrac{3a}8\right)\)'
    C: '\(\left(\dfrac a2,\dfrac a2,\dfrac a2\right)\)'
    D: '\(\left(\dfrac{a}{\sqrt3},\dfrac a{\sqrt3},\dfrac a{\sqrt3}\right)\)'
    answer: C
    hint: '\(\bar z=\iint z\,d\sigma/\iint d\sigma\).'
    explanation: '\(\iint a\cos u\cdot a^2\sin u\,du\,dv=\tfrac{\pi a^3}4\), area \(\tfrac{\pi a^2}2\).'
  281:
    topic: s16-6
    question: 'The moment of inertia about the \(z\)-axis of a thin spherical shell \(x^2+y^2+z^2=a^2\) of constant density \(\delta\) is'
    A: '\(\frac{16 \pi a^{4} \delta}{3}\)'
    B: '\(\frac{8 \pi a^{4} \delta}{3}\)'
    C: '\(\frac{8 \pi a^{5} \delta}{15}\)'
    D: '\(\frac{4 \pi a^{4} \delta}{3}\)'
    answer: B
    hint: '\(I_z=\iint(x^2+y^2)\delta\,d\sigma\) with \(d\sigma=a^2\sin u\,du\,dv\).'
    explanation: '\(2\pi\delta a^4\int_0^\pi\sin^3u\,du=\tfrac{8\pi}3\delta a^4\).'
  282:
    topic: s16-6
    question: 'The moment of inertia about the \(z\)-axis of the thin conical shell \(z=\sqrt{x^2+y^2}\), \(0\le z\le1\), of constant density \(\delta\) is'
    A: '\(\frac{\pi \delta}{2}\)'
    B: '\(\frac{\sqrt{2} \pi \delta}{4}\)'
    C: '\(\sqrt{2} \pi \delta\)'
    D: '\(\frac{\sqrt{2} \pi \delta}{2}\)'
    answer: D
    hint: '\(\mathbf r=(u\cos v,u\sin v,u)\), \(|\mathbf r_u\times\mathbf r_v|=\sqrt2u\); \(I_z=\iint u^2\delta\,\sqrt2u\,du\,dv\).'
    explanation: '\(2\pi\sqrt2\delta\cdot\tfrac14=\tfrac{\sqrt2\pi}2\delta\).'
  283:
    topic: s16-6
    question: 'An equation of the plane tangent to the cone \(\mathbf r=(r\cos\theta)\mathbf i+(r\sin\theta)\mathbf j+r\mathbf k\) at \(P_0(\sqrt2,\sqrt2,2)\) (\(r=2\), \(\theta=\pi/4\)) is (normal \(=\mathbf r_u\times\mathbf r_v\) at the point, up to a scalar)'
    A: '\(- \sqrt{2} x - \sqrt{2} y + 2 z=0\)'
    B: '\(- \sqrt{2} x - \sqrt{2} y + 2 z + 1=0\)'
    C: '\(\sqrt{2} x - \sqrt{2} y + 2 z - 4=0\)'
    D: '\(- \sqrt{2} x - \sqrt{2} y - 2 z + 8=0\)'
    answer: A
    hint: 'The tangent plane is normal to \(\mathbf r_u\times\mathbf r_v\) at \(P_0\) and passes through \(P_0\).'
    explanation: '\(\mathbf r_u\times\mathbf r_v(P_0)=-\sqrt{2}\mathbf{i}-\sqrt{2}\mathbf{j}+2\mathbf{k}\).'
  284:
    topic: s16-6
    question: 'An equation of the plane tangent to the sphere \(\mathbf r=(4\sin\phi\cos\theta)\mathbf i+(4\sin\phi\sin\theta)\mathbf j+(4\cos\phi)\mathbf k\) at \(P_0\left(\sqrt2,\sqrt2,2\sqrt3\right)\) (\(\phi=\pi/6\), \(\theta=\pi/4\)) is (normal \(=\mathbf r_u\times\mathbf r_v\) at the point, up to a scalar)'
    A: '\(- 2 \sqrt{2} x + 2 \sqrt{2} y + 4 \sqrt{3} z - 24=0\)'
    B: '\(2 \sqrt{2} x + 2 \sqrt{2} y - 4 \sqrt{3} z + 16=0\)'
    C: '\(2 \sqrt{2} x + 2 \sqrt{2} y + 4 \sqrt{3} z - 32=0\)'
    D: '\(2 \sqrt{2} x + 2 \sqrt{2} y + 4 \sqrt{3} z + 32=0\)'
    answer: C
    hint: 'The tangent plane is normal to \(\mathbf r_u\times\mathbf r_v\) at \(P_0\) and passes through \(P_0\).'
    explanation: '\(\mathbf r_u\times\mathbf r_v(P_0)=2 \sqrt{2}\mathbf{i}+2 \sqrt{2}\mathbf{j}+4 \sqrt{3}\mathbf{k}\).'
  285:
    topic: s16-6
    question: 'An equation of the plane tangent to the parabolic cylinder \(\mathbf r=x\mathbf i+y\mathbf j-x^2\mathbf k\) at \(P_0(1,2,-1)\) is (normal \(=\mathbf r_u\times\mathbf r_v\) at the point, up to a scalar)'
    A: '\(2 x - z - 3=0\)'
    B: '\(2 x + z - 1=0\)'
    C: '\(- 2 x + z + 3=0\)'
    D: '\(2 y + z - 3=0\)'
    answer: B
    hint: 'The tangent plane is normal to \(\mathbf r_u\times\mathbf r_v\) at \(P_0\) and passes through \(P_0\).'
    explanation: '\(\mathbf r_u\times\mathbf r_v(P_0)=2\mathbf{i}+\mathbf{k}\).'
  286:
    topic: s16-6
    question: 'The surface area of the torus \(\mathbf r(u,v)=\left((R+r\cos u)\cos v,(R+r\cos u)\sin v,r\sin u\right)\), \(0\le u,v\le2\pi\), is'
    A: '\(4 \pi^{2} R r\)'
    B: '\(4 \pi^{2} R^{2} r\)'
    C: '\(2 \pi^{2} R r\)'
    D: '\(2 \pi R r\)'
    answer: A
    hint: '\(|\mathbf r_u\times\mathbf r_v|=r(R+r\cos u)\).'
    explanation: '\(\int_0^{2\pi}\int_0^{2\pi}r(R+r\cos u)\,du\,dv=4\pi^2Rr\).'
  287:
    topic: s16-6
    question: 'For a surface of revolution obtained by revolving the curve \((f(u),g(u))\) (with \(g>0\)) about the \(x\)-axis, a parametrization is'
    A: '\(\mathbf r(u,v)=f(u)\cos v\,\mathbf i+g(u)\sin v\,\mathbf j\)'
    B: '\(\mathbf r(u,v)=g(u)\mathbf i+f(u)\cos v\,\mathbf j+f(u)\sin v\,\mathbf k\)'
    C: '\(\mathbf r(u,v)=f(u)\mathbf i+g(u)\cos v\,\mathbf j+g(u)\sin v\,\mathbf k\), \(0\le v\le2\pi\)'
    D: '\(\mathbf r(u,v)=f(u)\mathbf i+g(u)\mathbf j+v\mathbf k\)'
    answer: C
    hint: '\(f(u)\) measures distance along the axis; \(g(u)\) measures distance from it.'
    explanation: 'The angle \(v\) rotates the point about the \(x\)-axis.'
  288:
    topic: s16-6
    question: 'An ellipsoid \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}=1\) can be parametrized by'
    A: '\(\mathbf r=a\sin\theta\sin\phi\,\mathbf i+b\sin\theta\cos\phi\,\mathbf j+c\cos\phi\,\mathbf k\cdot\cos\theta\)'
    B: '\(\mathbf r=a\cos\phi\,\mathbf i+b\cos\theta\,\mathbf j+c\sin\theta\,\mathbf k\)'
    C: '\(\mathbf r=a\cos\theta\,\mathbf i+b\sin\theta\,\mathbf j+c\phi\,\mathbf k\)'
    D: '\(\mathbf r(\theta,\phi)=a\cos\theta\cos\phi\,\mathbf i+b\sin\theta\cos\phi\,\mathbf j+c\sin\phi\,\mathbf k\)'
    answer: D
    hint: 'Mimic spherical coordinates with scale factors \(a,b,c\).'
    explanation: 'Substituting gives \(\cos^2\phi+\sin^2\phi=1\).'
  289:
    topic: s16-6
    question: 'A hyperboloid of one sheet \(x^2+y^2-z^2=1\) can be parametrized by'
    A: '\(\mathbf r=\cosh u\,\mathbf i+\sinh u\,\mathbf j+\theta\,\mathbf k\)'
    B: '\(\mathbf r=\sinh u\cos\theta\,\mathbf i+\sinh u\sin\theta\,\mathbf j+\cosh u\,\mathbf k\)'
    C: '\(\mathbf r(\theta,u)=\cosh u\cos\theta\,\mathbf i+\cosh u\sin\theta\,\mathbf j+\sinh u\,\mathbf k\)'
    D: '\(\mathbf r=\cos u\cos\theta\,\mathbf i+\cos u\sin\theta\,\mathbf j+\sin u\,\mathbf k\)'
    answer: C
    hint: 'Use \(\cosh^2u-\sinh^2u=1\).'
    explanation: '\(r^2-z^2=1\) with \(r=\cosh u\), \(z=\sinh u\).'
  290:
    topic: s16-6
    question: 'A hyperboloid of two sheets \(\dfrac{z^2}{c^2}-\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1\) can be parametrized (upper sheet) by'
    A: '\(\mathbf r=a\sinh u\,\mathbf i+b\cosh u\,\mathbf j+c\theta\,\mathbf k\)'
    B: '\(\mathbf r=a\cosh u\cos\theta\,\mathbf i+b\cosh u\sin\theta\,\mathbf j+c\sinh u\,\mathbf k\)'
    C: '\(\mathbf r=a\cos u\cos\theta\,\mathbf i+b\cos u\sin\theta\,\mathbf j+c\sin u\,\mathbf k\)'
    D: '\(\mathbf r=a\sinh u\cos\theta\,\mathbf i+b\sinh u\sin\theta\,\mathbf j+c\cosh u\,\mathbf k\)'
    answer: D
    hint: 'Use \(\cosh^2u-\sinh^2u=1\).'
    explanation: '\(\dfrac{z^2}{c^2}-\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=\cosh^2u-\sinh^2u\).'
  291:
    topic: s16-6
    question: 'The tangent plane to a parametrized surface \(\mathbf r(u,v)\) at \(P_0=\mathbf r(u_0,v_0)\) is the plane through \(P_0\) with normal vector'
    A: '\(\mathbf r(u_0,v_0)\)'
    B: '\(\mathbf r_u\cdot\mathbf r_v\)'
    C: '\(\mathbf r_u+\mathbf r_v\)'
    D: '\(\mathbf r_u(u_0,v_0)\times\mathbf r_v(u_0,v_0)\)'
    answer: D
    hint: '\(\mathbf r_u\) and \(\mathbf r_v\) are tangent to the surface.'
    explanation: Their cross product is normal.
  292:
    topic: s16-6
    question: 'The area of a smooth parametrized surface \(\mathbf r(u,v)\), \(a\le u\le b\), \(c\le v\le d\), is'
    A: '\(\displaystyle\int_c^d\int_a^b|\mathbf r_u+\mathbf r_v|\,du\,dv\)'
    B: '\(\displaystyle\int_c^d\int_a^b\mathbf r_u\cdot\mathbf r_v\,du\,dv\)'
    C: '\(\displaystyle\int_c^d\int_a^b|\mathbf r_u\times\mathbf r_v|\,du\,dv\)'
    D: '\(\displaystyle\int_c^d\int_a^b|\mathbf r_u|\,|\mathbf r_v|\,du\,dv\)'
    answer: C
    hint: '\(|\mathbf r_u\times\mathbf r_v|\,du\,dv\) is the area of a small parallelogram.'
    explanation: Add up the parallelogram areas.
  293:
    topic: s16-7
    question: 'The counterclockwise circulation of \(\mathbf F=x^2\mathbf i+2x\mathbf j+z^2\mathbf k\) around the ellipse \(4x^2+y^2=4\) in the \(xy\)-plane (viewed from above) is'
    A: '\(\pi\)'
    B: '\(8 \pi\)'
    C: '\(4 \pi\)'
    D: '\(2 \pi\)'
    answer: C
    hint: '\(\nabla\times\mathbf F=2\mathbf k\); with \(\mathbf n=\mathbf k\) the circulation is \(2\cdot\text{Area}\).'
    explanation: 'The ellipse has semi-axes \(1\) and \(2\): area \(2\pi\).'
  294:
    topic: s16-7
    question: 'The counterclockwise circulation of \(\mathbf F=2y\mathbf i+3x\mathbf j-z^2\mathbf k\) around the circle \(x^2+y^2=9\) in the \(xy\)-plane is'
    A: '\(3 \pi\)'
    B: '\(27 \pi\)'
    C: '\(18 \pi\)'
    D: '\(9 \pi\)'
    answer: D
    hint: '\(\nabla\times\mathbf F=(3-2)\mathbf k=\mathbf k\); circulation \(=\text{Area}\).'
    explanation: '\(\pi\cdot3^2=9\pi\).'
  295:
    topic: s16-7
    question: 'Stokes'' Theorem states that the circulation of \(\mathbf F\) around the boundary \(C\) of an oriented surface \(S\) is'
    A: '\(\displaystyle\oint_C\mathbf F\cdot d\mathbf r=\iiint_D\nabla\times\mathbf F\,dV\)'
    B: '\(\displaystyle\oint_C\mathbf F\cdot d\mathbf r=\iint_S\nabla\times\mathbf F\cdot\mathbf n\,d\sigma\)'
    C: '\(\displaystyle\oint_C\mathbf F\cdot d\mathbf r=\iint_S\mathbf F\cdot\mathbf n\,d\sigma\)'
    D: '\(\displaystyle\oint_C\mathbf F\cdot d\mathbf r=\iint_S\nabla\cdot\mathbf F\,d\sigma\)'
    answer: B
    hint: Circulation around the edge equals the flux of the curl through the surface.
    explanation: "This generalizes the circulation form of Green's Theorem."
  296:
    topic: s16-7
    question: 'The circulation of \(\mathbf F=(y^2+z^2)\mathbf i+(x^2+z^2)\mathbf j+(x^2+y^2)\mathbf k\) around the boundary of the triangle cut from \(x+y+z=1\) by the first octant (counterclockwise from above) is'
    A: '\(1\)'
    B: '\(0\)'
    C: '\(- \frac{1}{3}\)'
    D: '\(\frac{1}{3}\)'
    answer: B
    hint: '\(\nabla\times\mathbf F=(2y-2z,\,2z-2x,\,2x-2y)\); \(\mathbf n\,dS=(1,1,1)\,dA\).'
    explanation: The sum of the components of the curl is zero.
  297:
    topic: s16-7
    question: 'The circulation of \(\mathbf F=(y^2+z^2)\mathbf i+(x^2+z^2)\mathbf j+(x^2+y^2)\mathbf k\) around the boundary of the triangle cut from \(x+y+z=1\) by the first octant is'
    A: '\(1\)'
    B: '\(\dfrac13\)'
    C: '\(0\)'
    D: '\(-\dfrac13\)'
    answer: C
    hint: '\(\nabla\times\mathbf F=(2y-2z,2z-2x,2x-2y)\) and \(\mathbf n\,dS\propto(1,1,1)\).'
    explanation: '\((2y-2z)+(2z-2x)+(2x-2y)=0\).'
  298:
    topic: s16-7
    question: 'The counterclockwise circulation of \(\mathbf F=(y^2+z^2)\mathbf i+(x^2+y^2)\mathbf j+(x^2+y^2)\mathbf k\) around the square bounded by \(x=\pm1\), \(y=\pm1\) in the \(xy\)-plane is'
    A: '\(-4\)'
    B: '\(8\)'
    C: '\(0\)'
    D: '\(4\)'
    answer: C
    hint: 'On the \(xy\)-plane \(\mathbf n=\mathbf k\); \((\nabla\times\mathbf F)\cdot\mathbf k=N_x-M_y=2x-2y\).'
    explanation: '\(\iint(2x-2y)\,dA=0\) over a symmetric square.'
  299:
    topic: s16-7
    question: 'The counterclockwise circulation of \(\mathbf F=x^2y^3\mathbf i+\mathbf j+z\mathbf k\) around the curve in which \(x^2+y^2=4\) meets the hemisphere \(x^2+y^2+z^2=16\), \(z\ge0\), is'
    A: '\(- 8 \pi\)'
    B: '\(8 \pi\)'
    C: '\(- 16 \pi\)'
    D: '\(- 4 \pi\)'
    answer: A
    hint: 'The curve is the circle of radius \(2\) at height \(z=\sqrt{12}\); \(\nabla\times\mathbf F=-3x^2y^2\mathbf k\); on the base disk the flux is \(\iint-3x^2y^2\,dA\).'
    explanation: '\(-3\int_0^{2\pi}\cos^2\theta\sin^2\theta\,d\theta\int_0^2r^5dr=-3\cdot\tfrac\pi4\cdot\tfrac{64}6\).'
  300:
    topic: s16-7
    question: 'The counterclockwise circulation of \(\mathbf F=x^2y^3\mathbf i+\mathbf j+z\mathbf k\) around the circle \(x^2+y^2=4\) in the \(xy\)-plane is'
    A: '\(- 4 \pi\)'
    B: '\(4 \pi\)'
    C: '\(- 8 \pi\)'
    D: '\(8 \pi\)'
    answer: C
    hint: '\(\nabla\times\mathbf F=-3x^2y^2\mathbf k\) and \(\mathbf n=\mathbf k\) on the flat disk.'
    explanation: '\(-3\int_0^{2\pi}\cos^2\theta\sin^2\theta\,d\theta\int_0^2r^5dr=-3\cdot\tfrac\pi4\cdot\tfrac{32}3=-8\pi\).'
  301:
    topic: s16-7
    question: 'If \(S\) is the upper half of the elliptical shell \(4x^2+9y^2+36z^2=36\), \(z\ge0\), and \(\mathbf F=y\mathbf i+x^2\mathbf j+(x^2+y^4)^{3/2}\sin e^{\sqrt{xyz}}\mathbf k\), then \(\iint_S\nabla\times\mathbf F\cdot\mathbf n\,d\sigma\) (outward normal) equals'
    A: '\(0\)'
    B: '\(- 3 \pi\)'
    C: '\(6 \pi\)'
    D: '\(- 6 \pi\)'
    answer: D
    hint: 'Apply Stokes'' Theorem to the base ellipse \(x=3\cos t\), \(y=2\sin t\) (\(z=0\)).'
    explanation: 'On \(z=0\): \(\oint y\,dx+x^2dy=\iint(2x-1)\,dA=-\text{Area}=-6\pi\).'
  302:
    topic: s16-7
    question: 'Let \(S\) be the cylinder \(x^2+y^2=a^2\), \(0\le z\le h\), together with its top \(x^2+y^2\le a^2\), \(z=h\). The outward flux of \(\nabla\times\mathbf F\) through \(S\) equals'
    A: 'zero for every \(\mathbf F\)'
    B: 'the circulation of \(\mathbf F\) around the top circle but with opposite sign'
    C: the volume of the cylinder
    D: 'the counterclockwise circulation of \(\mathbf F\) around the base circle \(x^2+y^2=a^2\), \(z=0\) (as seen from above)'
    answer: D
    hint: '\(S\) is a surface whose only boundary is the circle at \(z=0\).'
    explanation: "By Stokes' Theorem the flux depends only on the boundary."
  303:
    topic: s16-7
    question: '\(\displaystyle\iint_S\nabla\times(y\mathbf i)\cdot\mathbf n\,d\sigma\) over the upper unit hemisphere \(x^2+y^2+z^2=1\), \(z\ge0\), outward normal, equals'
    A: '\(- 2 \pi\)'
    B: '\(0\)'
    C: '\(- \pi\)'
    D: '\(\pi\)'
    answer: C
