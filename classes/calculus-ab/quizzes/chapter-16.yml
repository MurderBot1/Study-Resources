  304:
    topic: s16-7
    question: 'If two oriented surfaces \(S_1\) and \(S_2\) span the same curve \(C\) and induce the same positive direction on \(C\), then \(\displaystyle\iint_{S_1}\nabla\times\mathbf F\cdot\mathbf n\,d\sigma\) and \(\displaystyle\iint_{S_2}\nabla\times\mathbf F\cdot\mathbf n\,d\sigma\) are'
    A: negatives of each other
