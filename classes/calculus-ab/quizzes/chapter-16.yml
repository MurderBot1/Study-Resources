  308:
    topic: s16-7
    question: 'The flux of \(\nabla\times\mathbf F\) for \(\mathbf F=3y\mathbf i+(5-2x)\mathbf j+(z^2-2)\mathbf k\) over the hemisphere \(\mathbf r=\sqrt3(\sin\phi\cos\theta,\sin\phi\sin\theta,\cos\phi)\), \(0\le\phi\le\tfrac\pi2\), outward is'
