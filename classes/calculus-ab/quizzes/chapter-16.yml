  208:
    topic: s16-5
    question: 'The area of the band cut from the paraboloid \(x^2+y^2-z=0\) by the planes \(z=2\) and \(z=6\) is'
    A: '\(\frac{49 \pi}{6}\)'
    B: '\(\frac{49 \pi}{3}\)'
