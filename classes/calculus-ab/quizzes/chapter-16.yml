  342:
    topic: s16-8
    question: 'The outward flux of a constant vector field \(\mathbf F=\mathbf C\) across any closed surface is'
    A: '\(3|\mathbf C|\)'
    B: '\(|\mathbf C|\) times the area'
    C: '\(\mathbf C\) times the volume'
    D: '\(0\)'
    answer: D
    hint: '\(\nabla\cdot\mathbf C=0\).'
