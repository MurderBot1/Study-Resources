  215:
    topic: s16-5
    question: 'The area of the portion of \(x=4-y^2-z^2\) above the ring \(1\le y^2+z^2\le4\) in the \(yz\)-plane is'
    A: '\(\frac{\pi \left(- 5 \sqrt{5} + 17 \sqrt{17}\right)}{3}\)'
    B: '\(\frac{\pi \left(- 5 \sqrt{5} + 17 \sqrt{17}\right)}{6}\)'
    C: '\(12 \pi\)'
    D: '\(\frac{\pi \left(- 5 \sqrt{5} + 17 \sqrt{17}\right)}{12}\)'
    answer: B
    hint: '\(f_y^2+f_z^2+1=1+4r^2\).'
    explanation: '\(2\pi\int_1^2r\sqrt{1+4r^2}dr=\tfrac\pi6\left(17^{3/2}-5^{3/2}\right)\).'
  216:
    topic: s16-5
    question: 'The area of the surface cut from the paraboloid \(x^2+y+z^2=2\) by the plane \(y=0\) is'
    A: '\(2 \pi\)'
    B: '\(\frac{26 \pi}{3}\)'
