  236:
    topic: s16-5
    question: 'The moment of inertia of a thin spherical shell of radius \(a\) and constant density \(\delta\) about a diameter is'
    A: '\(\dfrac{8\pi}{15}\delta a^5\)'
    B: '\(\dfrac{2\pi}3\delta a^4\)'
