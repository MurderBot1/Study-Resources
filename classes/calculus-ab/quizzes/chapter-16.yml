    D: '\(2 \pi \left(2 - \sqrt{2}\right)\)'
    answer: D
    hint: 'Use \(z=\sqrt{2-x^2-y^2}\): \(dS=\dfrac{\sqrt2}{\sqrt{2-r^2}}\,r\,dr\,d\theta\) over \(r\le1\).'
    explanation: '\(2\pi\sqrt2\left(\sqrt2-1\right)\) \(=2\pi(2-\sqrt2)\).'
  213:
    topic: s16-5
    question: 'The area of the ellipse cut from the plane \(z=cx\) by the cylinder \(x^2+y^2=1\) is'
    A: '\(\pi \left(c^{2} + 1\right)\)'
    B: '\(2 \pi \sqrt{c^{2} + 1}\)'
    C: '\(\pi \sqrt{c^{2} + 1}\)'
    D: '\(\pi c\)'
    answer: C
    hint: '\(\sqrt{f_x^2+f_y^2+1}=\sqrt{1+c^2}\) over the unit disk.'
    explanation: '\(\pi\sqrt{1+c^2}\).'
  214:
    topic: s16-5
    question: 'The area of the upper portion of the cylinder \(x^2+z^2=1\) lying between the planes \(x=\pm\tfrac12\) and \(y=\pm\tfrac12\) is'
    A: '\(\pi\)'
    B: '\(\frac{2 \pi}{3}\)'
