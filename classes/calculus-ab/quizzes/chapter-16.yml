  322:
    topic: s16-8
    question: 'The outward flux of \(\mathbf F=(y-x)\mathbf i+(z-y)\mathbf j+(y-x)\mathbf k\) across the cube bounded by \(x=\pm1\), \(y=\pm1\), \(z=\pm1\) is'
