  217:
    topic: s16-5
    question: 'The integral of \(g=x+y+z\) over the part of the surface of the first-octant cube (side \(a\)) lying on the planes \(x=a\), \(y=a\), \(z=a\) is'
    A: '\(2 a^{3}\)'
    B: '\(3 a^{3}\)'
