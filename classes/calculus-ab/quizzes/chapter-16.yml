  210:
    topic: s16-5
    question: 'The area of the portion of \(x^2-2z=0\) above the triangle bounded by \(x=\sqrt3\), \(y=0\), and \(y=x\) is'
    A: '\(\frac{7}{3}\)'
    B: '\(\frac{7}{6}\)'
    C: '\(7\)'
    D: '\(\frac{14}{3}\)'
    answer: A
    hint: '\(z=x^2/2\): \(\sqrt{1+x^2}\,dy\,dx\).'
    explanation: '\(\int_0^{\sqrt3}x\sqrt{1+x^2}\,dx=\tfrac13\left(8-1\right)=\tfrac73\).'
  211:
    topic: s16-5
    question: 'The area of the portion of the plane \(x-2y-2z=0\) above the triangle bounded by \(x=2\), \(y=0\), \(y=3x\) is'
    A: '\(9\)'
    B: '\(4\)'
    C: '\(18\)'
    D: '\(6\)'
