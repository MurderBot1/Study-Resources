  309:
    topic: s16-7
    question: 'The flux of \(\nabla\times\mathbf F\) for \(\mathbf F=y^2\mathbf i+z^2\mathbf j+x\mathbf k\) over the hemisphere \(\mathbf r=2(\sin\phi\cos\theta,\sin\phi\sin\theta,\cos\phi)\), \(0\le\phi\le\tfrac\pi2\), outward is'
    A: '\(0\)'
    B: '\(3\)'
    C: '\(\pi\)'
