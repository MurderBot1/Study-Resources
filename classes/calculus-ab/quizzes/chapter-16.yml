  223:
    topic: s16-5
    question: 'The flux of \(\mathbf F=yx^2\mathbf i-2\mathbf j+xz\mathbf k\) across the rectangle \(y=0\), \(-1\le x\le2\), \(2\le z\le7\), in the direction \(-\mathbf j\) is'
