  207:
    topic: s16-5
    question: 'The area of the surface cut from the paraboloid \(x^2+y^2-z=0\) by the plane \(z=2\) is'
    A: '\(\frac{26 \pi}{3}\)'
    B: '\(\frac{13 \pi}{3}\)'
