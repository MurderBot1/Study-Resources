    D: '\(\frac{13 \pi}{3}\)'
    answer: D
    hint: '\(y=2-x^2-z^2\), \(r^2=x^2+z^2\le2\); \(dS=\sqrt{1+4r^2}\,r\,dr\,d\theta\).'
