  329:
    topic: s16-8
    question: 'The outward flux of \(\mathbf F=(6x^2+2xy)\mathbf i+(2y+x^2z)\mathbf j+4x^2y^3\mathbf k\) across the boundary of the region cut from the first octant by \(x^2+y^2=4\) and \(z=3\) is'
