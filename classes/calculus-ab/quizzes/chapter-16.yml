  9:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=x + y\) over the straight segment \(x=t\), \(y=1-t\), \(z=0\), from \((0,1,0)\) to \((1,0,0)\) is'
    A: '\(1 + \sqrt{2}\)'
    B: '\(\frac{\sqrt{2}}{2}\)'
    C: '\(2 \sqrt{2}\)'
    D: '\(\sqrt{2}\)'
    answer: D
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=\sqrt{2}\) and integrate.'
  10:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=x - y + z - 2\) over the segment \(x=t\), \(y=1-t\), \(z=1\), from \((0,1,1)\) to \((1,0,1)\) is'
    A: '\(1 - \sqrt{2}\)'
    B: '\(- 2 \sqrt{2}\)'
    C: '\(- \sqrt{2}\)'
    D: '\(- \frac{\sqrt{2}}{2}\)'
    answer: C
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=\sqrt{2}\) and integrate.'
  11:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=x y + y + z\) over the curve \(\mathbf r(t)=2t\mathbf i+t\mathbf j+(2-2t)\mathbf k\), \(0\le t\le1\) is'
    A: '\(\frac{13}{2}\)'
    B: '\(\frac{15}{2}\)'
    C: '\(13\)'
    D: '\(\frac{13}{4}\)'
    answer: A
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=3\) and integrate.'
  12:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=\sqrt{x^{2} + y^{2}}\) over the curve \(\mathbf r(t)=(4\cos t)\mathbf i+(4\sin t)\mathbf j+3t\mathbf k\), \(-2\pi\le t\le2\pi\) is'
    A: '\(1 + 80 \pi\)'
    B: '\(40 \pi\)'
    C: '\(160 \pi\)'
    D: '\(80 \pi\)'
    answer: D
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=5\) and integrate.'
  13:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=x + y + z\) over the straight segment from \((1,2,3)\) to \((0,-1,0)\) is'
    A: '\(4 \sqrt{14}\)'
    B: '\(2 \sqrt{14}\)'
    C: '\(\sqrt{14}\)'
    D: '\(1 + 2 \sqrt{14}\)'
    answer: B
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=\sqrt{14}\) and integrate.'
  14:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=\frac{\sqrt{3}}{x^{2} + y^{2} + z^{2}}\) over the curve \(\mathbf r(t)=t\mathbf i+t\mathbf j+t\mathbf k\), \(1\le t\le2\) is'
    A: '\(1\)'
    B: '\(\frac{1}{2}\)'
    C: '\(\frac{3}{2}\)'
    D: '\(\frac{1}{4}\)'
    answer: B
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=\sqrt{3}\) and integrate.'
  15:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=x + \sqrt{y} - z^{2}\) over the parabolic arc \(\mathbf r(t)=t\mathbf i+t^2\mathbf j\), \(0\le t\le1\) is'
    A: '\(- \frac{1}{3} + \frac{5 \sqrt{5}}{3}\)'
    B: '\(\frac{5}{6} + \frac{5 \sqrt{5}}{6}\)'
    C: '\(- \frac{1}{6} + \frac{5 \sqrt{5}}{6}\)'
    D: '\(- \frac{1}{12} + \frac{5 \sqrt{5}}{12}\)'
    answer: C
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=\sqrt{4 t^{2} + 1}\) and integrate.'
  16:
    topic: s16-1
    question: 'The line integral \(\displaystyle\int_Cf\,ds\) of \(f(x,y,z)=- \sqrt{x^{2} + y^{2}}\) over the circle \(\mathbf r(t)=3\cos t\,\mathbf i+3\sin t\,\mathbf j\), \(0\le t\le2\pi\) is'
    A: '\(1 - 18 \pi\)'
    B: '\(- 36 \pi\)'
    C: '\(- 18 \pi\)'
    D: '\(- 9 \pi\)'
    answer: C
    hint: '\(\int_Cf\,ds=\int_a^bf(\mathbf r(t))\,|\mathbf r''(t)|\,dt\).'
    explanation: 'Compute \(|\mathbf v|=3\) and integrate.'
  17:
    topic: s16-1
    question: 'The integral of \(f(x,y,z)=x+\sqrt y-z^2\) over \(C_1:\mathbf r=t\mathbf i+t^2\mathbf j\) (\(0\le t\le1\)) followed by \(C_2:\mathbf r=\mathbf i+\mathbf j+t\mathbf k\) (\(0\le t\le1\)) is'
    A: '\(\frac{3}{2} + \frac{5 \sqrt{5}}{6}\)'
    B: '\(\frac{5}{3}\)'
    C: '\(\frac{5 \sqrt{5}}{6} + \frac{5}{2}\)'
    D: '\(- \frac{1}{6} + \frac{5 \sqrt{5}}{6}\)'
    answer: A
    hint: Integrate over each piece and add.
    explanation: '\(C_1\) contributes \(\int_0^1(2t)\sqrt{1+4t^2}\,dt\); \(C_2\) contributes \(\int_0^1(2-t^2)dt\).'
  18:
    topic: s16-1
    question: 'The integral of \(f(x,y,z)=\dfrac{x+y+z}{x^2+y^2+z^2}\) over \(\mathbf r(t)=t\mathbf i+t\mathbf j+t\mathbf k\), \(0<a\le t\le b\), is'
    A: '\(\sqrt{3} \left(- \ln{\left(a \right)} + \ln{\left(b \right)}\right)\)'
    B: '\(\sqrt{3} \left(\ln{\left(a \right)} - \ln{\left(b \right)}\right)\)'
    C: '\(- \ln{\left(a \right)} + \ln{\left(b \right)}\)'
    D: '\(- 3 \ln{\left(a \right)} + 3 \ln{\left(b \right)}\)'
    answer: A
    hint: '\(|\mathbf v|=\sqrt3\) and \(f=\dfrac{3t}{3t^2}=\dfrac1t\).'
    explanation: '\(\sqrt3\int_a^b\dfrac{dt}t=\sqrt3\ln\dfrac ba\).'
  19:
    topic: s16-1
    question: 'The integral of \(f(x,y,z)=-\sqrt{x^2+z^2}\) over the circle \(\mathbf r(t)=(a\cos t)\mathbf j+(a\sin t)\mathbf k\), \(0\le t\le2\pi\), \(a>0\), is'
    A: '\(- 2 a^{2}\)'
    B: '\(- 2 \pi a^{2}\)'
    C: '\(4 a^{2}\)'
    D: '\(- 4 a^{2}\)'
    answer: D
    hint: 'On the circle \(\sqrt{x^2+z^2}=|a\sin t|\) and \(|\mathbf v|=a\).'
    explanation: '\(-a^2\int_0^{2\pi}|\sin t|\,dt=-4a^2\).'
  20:
    topic: s16-1
    question: 'The integral of \(f(x,y)=x^3/y\) over \(C:\ y=x^2/2\), \(0\le x\le2\), is'
    A: '\(\frac{1}{3} + \frac{10 \sqrt{5}}{3}\)'
    B: '\(- \frac{1}{3} + \frac{5 \sqrt{5}}{3}\)'
    C: '\(- \frac{4}{3} + \frac{20 \sqrt{5}}{3}\)'
    D: '\(- \frac{2}{3} + \frac{10 \sqrt{5}}{3}\)'
    answer: D
    hint: 'Parametrize \(x=t\), \(y=t^2/2\); \(ds=\sqrt{1+t^2}\,dt\).'
    explanation: '\(\int_0^22t\sqrt{1+t^2}dt\).'
  21:
    topic: s16-1
    question: 'The integral of \(f(x,y)=(x+y^2)/\sqrt{1+x^2}\) over \(C:\ y=x^2/2\) from \((1,\tfrac12)\) to \((0,0)\) is'
    A: '\(\frac{3}{4}\)'
    B: '\(\frac{1}{4}\)'
    C: '\(\frac{1}{2}\)'
    D: '\(\frac{11}{20}\)'
    answer: D
    hint: 'Parametrize \(x=t\), \(y=t^2/2\); \(ds=\sqrt{1+t^2}\,dt\). Direction does not matter for a scalar line integral.'
    explanation: '\(\int_0^1\left(t+\tfrac{t^4}4\right)dt=\tfrac12+\tfrac1{20}=\tfrac{11}{20}\).'
  22:
    topic: s16-1
    question: 'The integral of \(f(x,y)=x+y\) over the quarter circle \(x^2+y^2=4\) in the first quadrant is'
    A: '\(4\)'
    B: '\(8\)'
    C: '\(16\)'
    D: '\(2\)'
    answer: B
    hint: 'Parametrize \(x=2\cos t\), \(y=2\sin t\); \(ds=2\,dt\).'
    explanation: '\(4\int_0^{\pi/2}(\cos t+\sin t)dt=8\).'
  23:
    topic: s16-1
    question: 'The integral of \(f(x,y)=x^2-y\) over the part of the circle \(x^2+y^2=4\) in the first quadrant from \((0,2)\) to \((\sqrt2,\sqrt2)\) is'
    A: '\(- 4 \sqrt{2} - 4 + 2 \pi\)'
    B: '\(- 2 \sqrt{2} - 2 + \pi\)'
    C: '\(- \sqrt{2} - 1 + \frac{\pi}{2}\)'
    D: '\(- 2 \sqrt{2} - 1 + \pi\)'
    answer: B
    hint: 'Parametrize the arc \(\tfrac\pi4\le t\le\tfrac\pi2\); \(ds=2\,dt\).'
    explanation: '\(\int_{\pi/4}^{\pi/2}\left(8\cos^2t-4\sin t\right)dt=\pi-2-2\sqrt2\).'
  24:
    topic: s16-1
    question: 'The mass of a wire along \(\mathbf r(t)=(t^2-1)\mathbf j+2t\mathbf k\), \(0\le t\le1\), with density \(\delta=\tfrac32t\) is'
    A: '\(-3 + 6 \sqrt{2}\)'
    B: '\(-1 + 2 \sqrt{2}\)'
    C: '\(2 \sqrt{2}\)'
    D: '\(-1 + \sqrt{2}\)'
    answer: B
    hint: '\(|\mathbf v|=2\sqrt{t^2+1}\); \(M=\int\delta\,|\mathbf v|dt\).'
    explanation: '\(3\int_0^1t\sqrt{t^2+1}dt=\left(2\sqrt2-1\right)\).'
  25:
    topic: s16-1
    question: 'A wire along \(\mathbf r(t)=(t^2-1)\mathbf j+2t\mathbf k\), \(-1\le t\le1\), has density \(\delta=15\sqrt{y+2}\). Its mass is'
    A: '\(160\)'
    B: '\(80\)'
    C: '\(40\)'
    D: '\(60\)'
    answer: B
    hint: '\(y+2=t^2+1\) and \(|\mathbf v|=2\sqrt{t^2+1}\).'
    explanation: '\(30\int_{-1}^1(t^2+1)dt=30\cdot\tfrac83=80\).'
  26:
    topic: s16-1
    question: 'The center of mass of that wire (\(\mathbf r(t)=(t^2-1)\mathbf j+2t\mathbf k\), \(\delta=15\sqrt{y+2}\)) has \(\bar z=\)'
    A: '\(1\)'
    B: '\(\tfrac12\)'
    C: '\(\tfrac43\)'
    D: '\(0\)'
    answer: D
    hint: 'The integrand for \(M_{xy}\) is odd in \(t\).'
    explanation: '\(z=2t\) is odd and the density is even in \(t\).'
  27:
    topic: s16-1
    question: 'A thin wire along \(\mathbf r(t)=\sqrt2t\,\mathbf i+\sqrt2t\,\mathbf j+(4-t^2)\mathbf k\), \(0\le t\le1\), has density \(\delta=3t\). Its mass is'
    A: '\(6 \sqrt{2}\)'
    B: '\(-2 + 4 \sqrt{2}\)'
    C: '\(-1 + 2 \sqrt{2}\)'
    D: '\(4 \sqrt{2}\)'
    answer: B
    hint: '\(|\mathbf v|=\sqrt{4+4t^2}=2\sqrt{1+t^2}\).'
    explanation: '\(6\int_0^1t\sqrt{1+t^2}dt=2(2\sqrt2-1)\).'
  28:
    topic: s16-1
    question: 'The same wire (\(\mathbf r(t)=\sqrt2t\,\mathbf i+\sqrt2t\,\mathbf j+(4-t^2)\mathbf k\), \(0\le t\le1\)) with constant density \(\delta=1\) has mass'
    A: '\(\ln{\left(1 + \sqrt{2} \right)}\)'
    B: '\(\ln{\left(1 + \sqrt{2} \right)} + \sqrt{2}\)'
    C: '\(2 \sqrt{2}\)'
    D: '\(\sqrt{2}\)'
    answer: B
    hint: '\(M=\int_0^12\sqrt{1+t^2}dt\).'
    explanation: '\(\left[t\sqrt{1+t^2}+\ln\left(t+\sqrt{1+t^2}\right)\right]_0^1=\sqrt2+\ln\left(1+\sqrt2\right)\).'
  29:
    topic: s16-1
    question: 'The center of mass of a wire with constant density and the shape of the curve \(\mathbf r(t)=(\cos t)\mathbf i+(\sin t)\mathbf j\), \(0\le t\le\pi\), has \(\bar y=\)'
    A: '\(\dfrac1\pi\)'
    B: '\(\dfrac4{3\pi}\)'
    C: '\(\dfrac12\)'
    D: '\(\dfrac2\pi\)'
    answer: D
    hint: '\(\bar y=\dfrac{\int y\,ds}{\int ds}\).'
    explanation: '\(\dfrac{\int_0^\pi\sin t\,dt}{\pi}=\dfrac2\pi\).'
  30:
    topic: s16-1
    question: 'A circular hoop of constant density \(\delta\) lies on \(x^2+y^2=a^2\). Its moment of inertia about the \(z\)-axis is'
    A: '\(2 \pi a^{2} \delta\)'
    B: '\(4 \pi a^{3} \delta\)'
    C: '\(2 \pi a^{3} \delta\)'
    D: '\(\pi a^{3} \delta\)'
    answer: C
    hint: '\(I_z=\int(x^2+y^2)\delta\,ds\).'
    explanation: '\(a^2\delta\cdot2\pi a=2\pi\delta a^3\).'
  31:
    topic: s16-1
    question: 'The radius of gyration of the hoop about the \(z\)-axis is'
    A: '\(\frac{a}{2}\)'
    B: '\(\sqrt{2} a\)'
    C: '\(a^{2}\)'
    D: '\(a\)'
    answer: D
    hint: '\(R_z=\sqrt{I_z/M}\) with \(M=2\pi a\delta\).'
    explanation: '\(\sqrt{a^2}=a\).'
  32:
    topic: s16-1
    question: 'A rod of constant density \(\delta\) lies along \(\mathbf r(t)=t\mathbf j+(2-2t)\mathbf k\), \(0\le t\le1\). Its moment of inertia about the \(x\)-axis is'
    A: '\(\frac{5 \sqrt{5} \delta}{6}\)'
    B: '\(\sqrt{5} \delta\)'
    C: '\(\frac{5 \sqrt{5} \delta}{3}\)'
    D: '\(\frac{5 \delta}{3}\)'
    answer: C
    hint: '\(I_x=\int(y^2+z^2)\delta\,ds\) with \(ds=\sqrt5\,dt\).'
    explanation: '\(\sqrt5\delta\int_0^1\left[t^2+(2-2t)^2\right]dt=\sqrt5\delta\cdot\tfrac53\).'
  33:
    topic: s16-1
    question: 'A spring of constant density \(\delta\) lies along the helix \(\mathbf r(t)=(\cos t)\mathbf i+(\sin t)\mathbf j+t\mathbf k\), \(0\le t\le2\pi\). Its moment of inertia \(I_z\) is'
    A: '\(4 \sqrt{2} \pi \delta\)'
    B: '\(\sqrt{2} \pi \delta\)'
    C: '\(2 \sqrt{2} \pi \delta\)'
    D: '\(2 \pi \delta\)'
    answer: C
    hint: '\(I_z=\int(x^2+y^2)\delta\,ds\) with \(ds=\sqrt2\,dt\).'
    explanation: '\(2\sqrt2\pi\delta\).'
  34:
    topic: s16-1
    question: 'The radius of gyration \(R_z\) of the helical spring above is'
    A: '\(\frac{1}{2}\)'
    B: '\(1\)'
    C: '\(2\)'
    D: '\(\sqrt{2}\)'
    answer: B
    hint: '\(R_z=\sqrt{I_z/M}\) with \(M=2\sqrt2\pi\delta\).'
    explanation: '\(x^2+y^2=1\) along the whole spring.'
  35:
    topic: s16-1
    question: 'A second spring twice as long lies along the same helix for \(0\le t\le4\pi\). Compared with the first spring, its radius of gyration \(R_z\) is'
    A: 'doubled, while \(I_z\) is the same'
    B: 'doubled, and \(I_z\) is also doubled'
    C: 'halved, while \(I_z\) is doubled'
    D: 'the same, while \(I_z\) is doubled'
    answer: D
    hint: '\(R_z=\sqrt{I_z/M}\); both \(I_z\) and \(M\) double.'
    explanation: The ratio is unchanged.
  36:
    topic: s16-1
    question: 'A wire of constant density \(\delta=1\) has the shape of the curve with \(\mathbf r(t)=t\cos t\,\mathbf i+t\sin t\,\mathbf j+\tfrac{2\sqrt2}3t^{3/2}\mathbf k\), \(0\le t\le1\). Its speed \(|\mathbf v|\) is'
    A: '\(1+t\)'
    B: '\(t\)'
    C: '\(\sqrt{1+t}\)'
    D: '\(1+t^2\)'
    answer: A
    hint: '\(|\mathbf v|^2=\left(\cos t-t\sin t\right)^2+\left(\sin t+t\cos t\right)^2+2t\).'
    explanation: '\(|\mathbf v|^2=1+t^2+2t=(1+t)^2\).'
  37:
    topic: s16-1
