    explanation: The Laplacian is zero.
  344:
    topic: s16-8
    question: 'If \(f\) is harmonic throughout a solid region \(D\) bounded by a smooth closed surface \(S\) with outward normal \(\mathbf n\), then \(\displaystyle\iint_S\nabla f\cdot\mathbf n\,d\sigma=\)'
    A: 'the volume of \(D\)'
    B: '\(f\) integrated over \(D\)'
    C: '\(\displaystyle\iiint_D|\nabla f|^2dV\)'
    D: '\(0\)'
    answer: D
    hint: 'Apply the Divergence Theorem to \(\nabla f\).'
    explanation: '\(\nabla\cdot\nabla f=0\).'
  345:
    topic: s16-8
    question: 'If \(f\) is harmonic on \(D\), then \(\displaystyle\iint_Sf\nabla f\cdot\mathbf n\,d\sigma=\)'
    A: '\(0\)'
    B: '\(\displaystyle\iiint_Df\,dV\)'
    C: '\(\displaystyle\iiint_D|\nabla f|^2\,dV\)'
    D: '\(\displaystyle\iiint_D\nabla^2f\,dV\)'
    answer: C
    hint: '\(\nabla\cdot(f\nabla f)=f\nabla^2f+|\nabla f|^2\).'
    explanation: 'With \(\nabla^2f=0\) only \(|\nabla f|^2\) remains.'
  346:
    topic: s16-8
    question: 'Green''s first formula is \(\displaystyle\iint_Sf\nabla g\cdot\mathbf n\,d\sigma=\)'
    A: '\(\displaystyle\iiint_D\nabla^2(fg)\,dV\)'
    B: '\(\displaystyle\iiint_D\left(f\nabla^2g-\nabla f\cdot\nabla g\right)dV\)'
    C: '\(\displaystyle\iiint_D\left(f\nabla^2g+\nabla f\cdot\nabla g\right)dV\)'
    D: '\(\displaystyle\iiint_Df\nabla g\,dV\)'
    answer: C
    hint: 'Apply the Divergence Theorem to \(f\nabla g\).'
    explanation: '\(\nabla\cdot(f\nabla g)=f\nabla^2g+\nabla f\cdot\nabla g\).'
  347:
    topic: s16-8
    question: 'Green''s second formula is \(\displaystyle\iint_S\left(f\nabla g-g\nabla f\right)\cdot\mathbf n\,d\sigma=\)'
    A: '\(\displaystyle\iiint_D\left(\nabla f\cdot\nabla g\right)dV\)'
    B: '\(\displaystyle\iiint_D\left(f\nabla^2g-g\nabla^2f\right)dV\)'
    C: '\(0\) always'
    D: '\(\displaystyle\iiint_D\left(f\nabla^2g+g\nabla^2f\right)dV\)'
    answer: B
    hint: 'Subtract the first formula with \(f\) and \(g\) interchanged.'
    explanation: 'The \(\nabla f\cdot\nabla g\) terms cancel.'
  348:
    topic: s16-8
    question: 'The Law of Conservation of Mass for a fluid with velocity field \(\mathbf v\) and density \(\rho\) says \(\dfrac{d}{dt}\displaystyle\iiint_D\rho\,dV=\)'
    A: '\(\displaystyle\iint_S\rho\mathbf v\cdot\mathbf n\,d\sigma\)'
    B: '\(0\)'
    C: '\(-\displaystyle\iint_S\rho\,d\sigma\)'
    D: '\(-\displaystyle\iint_S\rho\mathbf v\cdot\mathbf n\,d\sigma\)'
    answer: D
    hint: The rate of change of mass equals minus the outward mass flux.
    explanation: Mass leaves through the boundary.
  349:
    topic: s16-8
    question: The continuity equation for a fluid is
    A: '\(\nabla\cdot\rho\mathbf v+\dfrac{\partial\rho}{\partial t}=0\)'
    B: '\(\nabla\cdot\rho\mathbf v=\dfrac{\partial\rho}{\partial t}\)'
    C: '\(\nabla\rho\cdot\mathbf v=0\)'
    D: '\(\nabla\times\rho\mathbf v=\dfrac{\partial\rho}{\partial t}\)'
    answer: A
    hint: Apply the Divergence Theorem to the conservation law.
    explanation: It holds at every point of the fluid.
  350:
    topic: s16-8
    question: 'The heat (diffusion) equation for the temperature \(T(t,x,y,z)\) is'
    A: '\(\nabla^2T=K\)'
    B: '\(\dfrac{\partial T}{\partial t}=K\nabla^2T\)'
    C: '\(\dfrac{\partial T}{\partial t}=K\nabla T\)'
    D: '\(\dfrac{\partial^2T}{\partial t^2}=K\nabla^2T\)'
    answer: B
    hint: 'Heat flows in the direction of \(-\nabla T\).'
    explanation: It follows from conservation of energy and the divergence theorem.
  351:
    topic: s16-8
    question: Heat flows in the direction of
    A: '\(\nabla T\)'
    B: '\(\nabla\times\nabla T\)'
    C: a direction along level surfaces
    D: '\(-\nabla T\) (from hot to cold)'
    answer: D
    hint: 'Temperature decreases most rapidly along \(-\nabla T\).'
    explanation: The gradient points toward higher temperature.
  352:
    topic: s16-8
    question: 'If \(|\mathbf F|\le1\) on a region \(D\) bounded by a smooth closed surface \(S\), can any bound be placed on \(\displaystyle\iiint_D\nabla\cdot\mathbf F\,dV\)?'
    A: 'Yes: it is at most the volume of \(D\)'
    B: No; the divergence can be arbitrarily large
    C: 'Yes: it is exactly \(0\)'
    D: 'Yes: it is at most the area of \(S\) in absolute value, since it equals the flux and \(|\mathbf F\cdot\mathbf n|\le1\)'
    answer: D
    hint: '\(\iiint\nabla\cdot\mathbf F\,dV=\iint\mathbf F\cdot\mathbf n\,d\sigma\).'
    explanation: '\(|\mathbf F\cdot\mathbf n|\le1\), so the flux is at most the area of \(S\).'
  353:
    topic: s16-8
    question: 'Let \(\mathbf F=x\mathbf i-2y\mathbf j+(z+3)\mathbf k\) and let the surface be the unit cube-like closed surface with sides \(x=0,1\), \(y=0,1\), \(z=0\) (base), and an unknown top. If the outward flux through side \(x=1\) is \(1\) and through side \(y=1\) is \(-3\) (flux through \(x=0\), \(y=0\) is \(0\) and through \(z=0\) is \(-3\)), then the outward flux through the top is'
    A: '\(0\)'
    B: '\(5\)'
    C: '\(-5\)'
    D: '\(3\)'
    answer: B
    hint: '\(\nabla\cdot\mathbf F=0\), so the total outward flux is \(0\).'
    explanation: '\(1-3-3+\text{top}=0\Rightarrow\text{top}=5\).'
  354:
    topic: s16-8
    question: 'Among all boxes \(0\le x\le a\), \(0\le y\le b\), \(0\le z\le1\), the outward flux of \(\mathbf F=(-x^2-4xy)\mathbf i-6yz\mathbf j+12z\mathbf k\) is largest for'
    A: '\(a=4\), \(b=\frac{3}{2}\)'
    B: '\(a=\frac{3}{2}\), \(b=3\)'
    C: '\(a=3\), \(b=\frac{3}{2}\)'
    D: '\(a=3\), \(b=\frac{5}{2}\)'
    answer: C
    hint: '\(\text{flux}=\iiint(12-2x-4y-6z)\,dV=ab\,(9-a-2b)\).'
    explanation: 'Set the partial derivatives of \(ab(9-a-2b)\) with respect to \(a\) and \(b\) to zero.'
  355:
    topic: s16-8
    question: The greatest possible outward flux through such a box (previous question) is
    A: '\(\frac{27}{4}\)'
    B: '\(\frac{27}{2}\)'
    C: '\(\frac{29}{2}\)'
    D: '\(27\)'
    answer: B
    hint: 'Substitute the optimal \(a,b\) into \(ab(9-a-2b)\).'
    explanation: 'It is the maximum of \(ab(9-a-2b)\).'
  356:
    topic: s16-8
    question: 'The flux \(\displaystyle\iint_S\nabla f\cdot\mathbf n\,d\sigma\) for \(f=\ln\sqrt{x^2+y^2+z^2}\) across the part of the sphere \(x^2+y^2+z^2=a^2\) in the first octant (outward) is'
    A: '\(\frac{\pi a^{2}}{2}\)'
    B: '\(\pi a\)'
    C: '\(\frac{\pi}{2}\)'
    D: '\(\frac{\pi a}{2}\)'
    answer: D
    hint: 'On the sphere \(\nabla f\cdot\mathbf n=\dfrac1a\); multiply by the area \(\tfrac{\pi a^2}2\).'
    explanation: '\(\dfrac1a\cdot\dfrac{\pi a^2}2=\dfrac{\pi a}2\).'
  357:
    topic: s16-8
    question: 'A solid has volume \(V\) and is bounded by a smooth surface \(S\). For the field \(\mathbf F=x\mathbf i+y\mathbf j+z\mathbf k\) the average value of \(\nabla\cdot\mathbf F\) over the solid is'
    A: '\(3\)'
    B: '\(\dfrac13\)'
    C: '\(1\)'
    D: '\(V\)'
    answer: A
    hint: '\(\nabla\cdot\mathbf F=1+1+1\).'
    explanation: It is constant.
  358:
    topic: s16-8
    question: "In the unified theory, the Fundamental Theorem of Calculus, Green's Theorem, Stokes' Theorem and the Divergence Theorem all say that"
    A: the integral of a derivative-like quantity over a region equals the integral of the field over the boundary of that region
    B: curl and divergence are always zero
    C: every vector field is conservative
    D: surface integrals equal line integrals only in the plane
    answer: A
    hint: 'Compare \(\int_a^bf''(x)dx=f(b)-f(a)\).'
    explanation: Each relates an integral over a region to values on its boundary.
