  233:
    topic: s16-5
    question: 'The centroid of the surface cut from the cylinder \(y^2+z^2=9\), \(z\ge0\), by the planes \(x=0\) and \(x=3\) is at \(\bar x=\) and \(\bar z=\)'
    A: '\(\bar x=\dfrac32\), \(\bar z=\dfrac{4\cdot3}{3\pi}\cdot\tfrac12\)'
    B: '\(\bar x=\dfrac32\), \(\bar z=\dfrac6\pi\)'
    C: '\(\bar x=\dfrac32\), \(\bar z=\dfrac3\pi\)'
    D: '\(\bar x=3\), \(\bar z=\dfrac6\pi\)'
    answer: B
    hint: '\(\bar x\) is the midpoint; \(\bar z=\dfrac{\int_0^\pi3\sin\theta\,d\theta}{\pi}\).'
