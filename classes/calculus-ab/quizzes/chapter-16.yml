  220:
    topic: s16-5
    question: 'The integral of \(g=x+y+z\) over the portion of the plane \(2x+2y+z=2\) in the first octant is'
    A: '\(4\)'
    B: '\(1\)'
    C: '\(2\)'
    D: '\(3\)'
