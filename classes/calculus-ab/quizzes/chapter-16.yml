  230:
    topic: s16-5
    question: 'The flux of \(\mathbf F=4x\mathbf i+4y\mathbf j+2\mathbf k\) outward (away from the \(z\)-axis) through the part of the paraboloid \(z=x^2+y^2\) below \(z=1\) is'
