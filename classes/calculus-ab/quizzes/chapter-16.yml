# Chapter 16: Integration in Vector Fields
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 16.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 16: Integration in Vector Fields"
description: "Line integrals, vector fields, work, circulation and flux, path independence and potential functions, Green's Theorem, surface area and surface integrals, parametrized surfaces, Stokes' Theorem, and the Divergence Theorem."
topics:
  s16-1:
    title: 16.1 Line Integrals
  s16-2:
    title: 16.2 Vector Fields, Work, Circulation, and Flux
  s16-3:
    title: 16.3 Path Independence, Potential Functions, and Conservative Fields
  s16-4:
    title: "16.4 Green's Theorem in the Plane"
  s16-5:
    title: 16.5 Surface Area and Surface Integrals
  s16-6:
    title: 16.6 Parametrized Surfaces
  s16-7:
    title: "16.7 Stokes' Theorem"
  s16-8:
    title: 16.8 The Divergence Theorem and a Unified Theory
questions:
  1:
    topic: s16-1
    question: 'The path \(\mathbf r(t)=t\mathbf i+(1-t)\mathbf j,\ 0\le t\le1\) is'
    A: 'the segment in the \(xy\)-plane from \((0,1,0)\) to \((1,0,0)\)'
    B: 'the segment of the \(x\)-axis from \((-1,0,0)\) to \((1,0,0)\)'
    C: 'the vertical segment from \((1,1,-1)\) to \((1,1,1)\)'
    D: 'the circle of radius \(2\) in the \(xy\)-plane, counterclockwise'
    answer: A
    hint: 'Evaluate \(\mathbf r\) at the endpoints and identify the shape.'
    explanation: Substitute the parameter values to find the start and end points.
