  333:
    topic: s16-8
    question: 'The outward flux of \(\mathbf F=(5x^3+12xy^2)\mathbf i+(y^3+e^y\sin z)\mathbf j+(5z^3+e^y\cos z)\mathbf k\) across the boundary of the region between the spheres \(\rho=1\) and \(\rho=\sqrt2\) is'
    A: '\(6 \pi \left(-1 + 4 \sqrt{2}\right)\)'
    B: '\(12 \pi \left(-1 + 4 \sqrt{2}\right)\)'
    C: '\(24 \pi \left(-1 + 4 \sqrt{2}\right)\)'
    D: '\(\pi \left(-11 + 48 \sqrt{2}\right)\)'
    answer: B
    hint: 'Simplify the divergence first: \(\nabla\cdot\mathbf F=15x^2+12y^2+3y^2+15z^2=15\rho^2\).'
