  326:
    topic: s16-8
    question: 'The outward flux of \(\mathbf F=y\mathbf i+xy\mathbf j-z\mathbf k\) across the boundary of the region inside \(x^2+y^2\le4\) between \(z=0\) and the paraboloid \(z=x^2+y^2\) is'
