    hint: '\(z=\tfrac{x-2y}2\) so \(\sqrt{f_x^2+f_y^2+1}=\tfrac32\); the base triangle has legs \(2\) and \(6\).'
    explanation: '\(\tfrac32\cdot6=9\).'
  212:
    topic: s16-5
    question: 'The area of the cap cut from the sphere \(x^2+y^2+z^2=2\) by the cone \(z=\sqrt{x^2+y^2}\) is'
    A: '\(\pi \left(2 - \sqrt{2}\right)\)'
    B: '\(4 \pi\)'
