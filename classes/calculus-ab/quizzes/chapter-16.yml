    B: '\(\displaystyle\iint_S\mathbf F\cdot\mathbf n\,d\sigma\)'
    C: '\(3\displaystyle\iint_S\mathbf F\cdot\mathbf n\,d\sigma\)'
    D: '\(\dfrac12\displaystyle\iint_S\mathbf F\cdot\mathbf n\,d\sigma\)'
    answer: A
    hint: '\(\iint\mathbf F\cdot\mathbf n=3V\).'
