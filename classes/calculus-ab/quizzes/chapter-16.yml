    D: zero (the form is exact)
    answer: D
    hint: 'Here \(M=x^3\), \(N=-y^3\).'
    explanation: '\(N_x-M_y=0\).'
  200:
    topic: s16-4
    question: 'If \(f(x,y)\) satisfies Laplace''s equation \(f_{xx}+f_{yy}=0\), then for every closed curve \(C\) to which Green''s Theorem applies, \(\displaystyle\oint_Cf_y\,dx-f_x\,dy=\)'
    A: '\(0\)'
    B: '\(\text{Area}\)'
    C: '\(f_{xy}\)'
    D: '\(2\pi\)'
    answer: A
    hint: 'Apply Green''s Theorem with \(M=f_y\), \(N=-f_x\).'
    explanation: '\(N_x-M_y=-f_{xx}-f_{yy}=0\).'
  201:
    topic: s16-4
    question: 'Among all smooth simple closed curves oriented counterclockwise, the one maximizing the work done by \(\mathbf F=\left(\tfrac14x^2y+\tfrac13y^3\right)\mathbf i+x\mathbf j\) is the curve bounding the region where \(\mathbf k\cdot\nabla\times\mathbf F\) is positive, i.e.'
    A: 'the ellipse \(4x^2+y^2=4\)'
    B: 'the circle \(x^2+y^2=4\)'
    C: 'the circle \(x^2+y^2=1\)'
    D: 'the ellipse \(x^2+4y^2=4\)'
    answer: D
    hint: '\(N_x-M_y=1-\tfrac14x^2-y^2\).'
    explanation: 'It is positive exactly when \(x^2+4y^2<4\).'
  202:
    topic: s16-4
    question: "Green's Theorem extends to regions with finitely many holes, provided each boundary curve"
    A: is a circle
    B: is oriented counterclockwise (all of them)
    C: is traversed clockwise
    D: is oriented so that the region lies on the left as one traverses it
    answer: D
    hint: Outer boundary counterclockwise, inner boundaries clockwise.
    explanation: The region must stay on the immediate left.
  203:
    topic: s16-4
    question: 'For a conservative field \(\mathbf F\) in a simply connected plane region, the curl component \(\partial N/\partial x-\partial M/\partial y\) is'
    A: '\(0\)'
    B: undefined
    C: positive
    D: '\(1\)'
    answer: A
    hint: '\(\mathbf F=\nabla f\) has equal mixed partials.'
    explanation: '\(f_{yx}-f_{xy}=0\).'
  204:
    topic: s16-4
    question: 'Bendixson''s criterion says that if \(M_x+N_y\ne0\) throughout a simply connected region \(R\), then'
    A: the field is conservative
    B: the flow is irrotational
    C: every streamline is closed
    D: 'no streamline of the flow in \(R\) is a closed curve'
    answer: D
    hint: If a streamline were closed, the flux across it would be zero.
    explanation: 'By Green''s Theorem the flux would equal \(\iint(M_x+N_y)\,dA\ne0\).'
  205:
    topic: s16-4
    question: 'The counterclockwise circulation of \(\mathbf F=(2x-y)\mathbf i+(x+3y)\mathbf j\) around the ellipse \(x^2+4y^2=4\) is'
    A: '\(4 \pi\)'
    B: '\(\pi\)'
    C: '\(8 \pi\)'
    D: '\(2 \pi\)'
    answer: A
    hint: '\(N_x-M_y=1-(-1)=2\).'
    explanation: '\(2\cdot\text{Area}=2\cdot2\pi\).'
  206:
    topic: s16-4
    question: 'The counterclockwise circulation of \(\mathbf F=(2x^3-y^3)\mathbf i+(x^3+y^3)\mathbf j\) around the ellipse \(\tfrac{x^2}4+\tfrac{y^2}9=1\) is'
