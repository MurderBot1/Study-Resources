    explanation: "The hypotheses of Stokes' Theorem fail."
  318:
    topic: s16-7
    question: 'For \(\oint_C2y\,dx+3z\,dy-x\,dz\) with \(C\) a closed curve in the plane \(2x+2y+z=2\), the value depends on \(C\) only through'
