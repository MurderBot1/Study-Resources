  221:
    topic: s16-5
    question: 'The integral of \(g=x\sqrt{y^2+4}\) over the surface cut from the parabolic cylinder \(y^2+4z=16\) by the planes \(x=0\), \(x=1\), and \(z=0\) is'
    A: '\(\frac{56}{3}\)'
