    explanation: "It generalizes the flux form of Green's Theorem."
  335:
    topic: s16-8
    question: 'For any field \(\mathbf G=M\mathbf i+N\mathbf j+P\mathbf k\) with continuous second partials, \(\nabla\cdot(\nabla\times\mathbf G)=\)'
    A: '\(1\)'
    B: '\(0\)'
    C: '\(\nabla\times(\nabla\cdot\mathbf G)\)'
    D: '\(\nabla^2\mathbf G\)'
    answer: B
    hint: Mixed partial derivatives cancel.
    explanation: '\((P_{yx}-N_{zx})+(M_{zy}-P_{xy})+(N_{xz}-M_{yz})=0\).'
  336:
    topic: s16-8
    question: 'If \(\mathbf G\) is a field with continuous second partials, then the flux of \(\nabla\times\mathbf G\) across any closed surface is'
    A: '\(0\)'
    B: '\(2\pi\)'
    C: positive
    D: the enclosed volume
    answer: A
    hint: 'Apply the Divergence Theorem and \(\nabla\cdot(\nabla\times\mathbf G)=0\).'
    explanation: The integrand is zero.
  337:
    topic: s16-8
    question: 'For differentiable fields and constants \(a,b\), \(\nabla\cdot(a\mathbf F_1+b\mathbf F_2)=\)'
    A: '\(a\nabla\cdot\mathbf F_1+b\nabla\cdot\mathbf F_2\)'
    B: '\(\nabla\cdot\mathbf F_1+\nabla\cdot\mathbf F_2\)'
    C: '\(a\nabla\times\mathbf F_1+b\nabla\times\mathbf F_2\)'
    D: '\(ab\nabla\cdot\mathbf F_1\nabla\cdot\mathbf F_2\)'
