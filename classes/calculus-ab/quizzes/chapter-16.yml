  319:
    topic: s16-8
    question: 'The divergence of the spin field \(\mathbf F=-\dfrac{y}{\sqrt{x^2+y^2}}\mathbf i+\dfrac{x}{\sqrt{x^2+y^2}}\mathbf j\) is'
