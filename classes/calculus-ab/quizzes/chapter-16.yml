  234:
    topic: s16-5
    question: 'The moment of inertia about the \(z\)-axis of a thin shell of constant density \(\delta\) cut from the cone \(x^2+y^2-z^2=0\) by the planes \(z=1\) and \(z=2\) is'
    A: '\(\frac{15 \sqrt{2} \pi \delta}{4}\)'
    B: '\(15 \sqrt{2} \pi \delta\)'
