  343:
    topic: s16-8
    question: 'A function \(f\) is called harmonic in a region \(D\) if'
    A: '\(\nabla^2f=f_{xx}+f_{yy}+f_{zz}=0\) throughout \(D\)'
    B: '\(\nabla\times\nabla f\ne\mathbf0\)'
    C: '\(\nabla f=\mathbf0\)'
    D: '\(f\) is linear'
    answer: A
