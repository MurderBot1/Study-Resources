  231:
    topic: s16-5
    question: 'The outward flux of \(\mathbf F=2xy\mathbf i+2yz\mathbf j+2xz\mathbf k\) across the surface of the cube cut from the first octant by \(x=a\), \(y=a\), \(z=a\) is'
