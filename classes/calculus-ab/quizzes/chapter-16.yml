    answer: A
    hint: 'Use Stokes'' Theorem: the flux equals the flux through the flat disk bounded by the same circle (normal \(\mathbf k\)).'
    explanation: '\(\iint(N_x-M_y)\,dA\) over the disk of radius \(\sqrt3\) (or \(2\)).'
  310:
    topic: s16-7
    question: 'The circulation of \(\mathbf F=2x\mathbf i+2y\mathbf j+2z\mathbf k\) around the boundary of any smooth orientable surface is'
    A: not determined
    B: '\(0\), since \(\mathbf F=\nabla(x^2+y^2+z^2)\)'
    C: '\(2\) times the volume'
    D: the area of the surface
    answer: B
