  339:
    topic: s16-8
    question: 'For a differentiable scalar \(g\) and field \(\mathbf F\), \(\nabla\times(g\mathbf F)=\)'
    A: '\(g\nabla\times\mathbf F+\nabla g\times\mathbf F\)'
    B: '\(g\nabla\cdot\mathbf F\)'
