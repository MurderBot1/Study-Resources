    explanation: 'Both equal \(\oint_C\mathbf F\cdot d\mathbf r\).'
  305:
    topic: s16-7
    question: 'If a smooth closed oriented surface \(S\) is the union of two surfaces \(S_1\) and \(S_2\) joined along a smooth simple closed curve, then the outward flux of \(\nabla\times\mathbf F\) through \(S\) is'
    A: not determined
    B: '\(0\)'
    C: 'twice the flux through \(S_1\)'
    D: the volume enclosed
    answer: B
