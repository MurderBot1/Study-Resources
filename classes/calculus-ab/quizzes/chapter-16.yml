  334:
    topic: s16-8
    question: 'The Divergence Theorem states that the outward flux of \(\mathbf F\) across a closed surface \(S\) bounding a solid \(D\) is'
    A: '\(\displaystyle\iint_S\mathbf F\cdot\mathbf n\,d\sigma=\iiint_D\nabla\times\mathbf F\,dV\)'
    B: '\(\displaystyle\iint_S\mathbf F\cdot\mathbf n\,d\sigma=\iiint_D\nabla\cdot\mathbf F\,dV\)'
    C: '\(\displaystyle\iint_S\mathbf F\cdot\mathbf n\,d\sigma=\iiint_D|\mathbf F|\,dV\)'
    D: '\(\displaystyle\iint_S\mathbf F\cdot\mathbf n\,d\sigma=\oint_{\partial S}\mathbf F\cdot d\mathbf r\)'
    answer: B
