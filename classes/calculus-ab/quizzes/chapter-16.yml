    D: '\(9 a^{3}\)'
    answer: C
    hint: 'Each face contributes \(\iint(a+u+v)\,dA\) over a square of side \(a\).'
    explanation: '\(3\left(a^3+\tfrac{a^3}2+\tfrac{a^3}2\right)=6a^3\).'
  218:
    topic: s16-5
    question: 'The integral of \(g=xyz\) over the surface of the rectangular solid cut from the first octant by the planes \(x=a\), \(y=b\), \(z=c\) is'
    A: '\(\frac{a b c \left(a b + a c + b c\right)}{4}\)'
    B: '\(\frac{a b c \left(a + b + c\right)}{4}\)'
    C: '\(\frac{a^{2} b^{2} c^{2}}{4}\)'
    D: '\(\frac{a b c \left(a b + a c + b c\right)}{2}\)'
    answer: A
    hint: 'Only the three faces \(x=a\), \(y=b\), \(z=c\) contribute (on the others \(xyz=0\)).'
    explanation: '\(\tfrac{abc}4\left(ab+ac+bc\right)\).'
  219:
    topic: s16-5
    question: 'The integral of \(g=xyz\) over the surface of the rectangular solid bounded by \(x=\pm a\), \(y=\pm b\), \(z=\pm c\) is'
