  189:
    topic: s13-2
    question: 'A baseball is hit from \(2.5\) ft with speed \(145\) ft/s at \(23^\circ\); a gust adds \(-14\) ft/s to the horizontal velocity (\(g=32\) ft/s\(^2\)). Its flight time is about'
    A: '\(5.38\text{ s}\)'
    B: '\(3.58\text{ s}\)'
