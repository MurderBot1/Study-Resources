  137:
    topic: s13-1
    question: 'If \(\mathbf v\) is a differentiable vector function of \(t\) with \(\mathbf v\cdot\dfrac{d\mathbf v}{dt}=0\) for all \(t\), then'
    A: '\(\mathbf v=\mathbf 0\)'
    B: '\(\mathbf v\) is constant'
    C: '\(\mathbf v\) is parallel to \(d\mathbf v/dt\)'
    D: '\(|\mathbf v|\) is constant'
    answer: D
    hint: '\(\dfrac d{dt}|\mathbf v|^2=2\mathbf v\cdot\mathbf v''\).'
    explanation: '\(|\mathbf v|^2\) has zero derivative.'
  138:
    topic: s13-1
    question: 'The derivative of a triple scalar product is \(\dfrac d{dt}(\mathbf u\cdot\mathbf v\times\mathbf w)=\)'
    A: '\(\mathbf u''\cdot\mathbf v''\times\mathbf w'')\)'
    B: '\(\mathbf u''\cdot\mathbf v\times\mathbf w-\mathbf u\cdot\mathbf v''\times\mathbf w\)'
    C: '\(\mathbf u''\cdot\mathbf v\times\mathbf w\)'
    D: '\(\mathbf u''\cdot\mathbf v\times\mathbf w+\mathbf u\cdot\mathbf v''\times\mathbf w+\mathbf u\cdot\mathbf v\times\mathbf w''\)'
    answer: D
    hint: Use the product rule in each of the three factors.
    explanation: "The determinant formula: differentiate one row at a time and add."
  139:
    topic: s13-1
    question: 'If \(\mathbf r(t)=f(t)\mathbf i+g(t)\mathbf j+h(t)\mathbf k\) has derivatives through order three, then \(\dfrac d{dt}\left(\mathbf r\cdot\dfrac{d\mathbf r}{dt}\times\dfrac{d^2\mathbf r}{dt^2}\right)=\)'
    A: '\(\mathbf 0\)'
    B: '\(\mathbf r\cdot\left(\dfrac{d^2\mathbf r}{dt^2}\times\dfrac{d^3\mathbf r}{dt^3}\right)\)'
    C: '\(\dfrac{d\mathbf r}{dt}\cdot\dfrac{d^2\mathbf r}{dt^2}\times\dfrac{d^3\mathbf r}{dt^3}\)'
    D: '\(\mathbf r\cdot\left(\dfrac{d\mathbf r}{dt}\times\dfrac{d^3\mathbf r}{dt^3}\right)\)'
    answer: D
    hint: Differentiate the three factors; the terms with repeated vectors vanish.
    explanation: '\(\mathbf r''\cdot(\mathbf r''\times\mathbf r'''')=0\) and \(\mathbf r\cdot(\mathbf r''''\times\mathbf r'''')=0\) (repeated vectors), leaving \(\mathbf r\cdot(\mathbf r''\times\mathbf r^{\prime\prime\prime})\).'
  140:
    topic: s13-1
    question: 'If \(\mathbf u\) is a differentiable vector function and \(f\) a differentiable scalar function, then \(\dfrac d{dt}(f\mathbf u)=\)'
    A: '\(\dfrac{df}{dt}\mathbf u+f\dfrac{d\mathbf u}{dt}\)'
    B: '\(f\dfrac{d\mathbf u}{dt}\)'
    C: '\(\dfrac{df}{dt}\dfrac{d\mathbf u}{dt}\)'
    D: '\(\dfrac{df}{dt}\mathbf u-f\dfrac{d\mathbf u}{dt}\)'
    answer: A
    hint: Product rule.
    explanation: Apply it componentwise.
  141:
    topic: s13-1
    question: 'If \(\mathbf u\) is a vector function with constant value \(\mathbf C\), then \(\dfrac{d\mathbf u}{dt}=\)'
    A: '\(\mathbf 0\)'
    B: '\(0\) (the scalar)'
    C: undefined
    D: '\(\mathbf C\)'
    answer: A
    hint: Each component is a constant.
    explanation: The derivative of a constant vector is the zero vector.
  142:
    topic: s13-1
    question: 'A vector function \(\mathbf r(t)=f(t)\mathbf i+g(t)\mathbf j+h(t)\mathbf k\) is continuous at \(t_0\) if and only if'
    A: '\(f\), \(g\), and \(h\) are all continuous at \(t_0\)'
    B: '\(f\), \(g\), \(h\) are all differentiable at \(t_0\)'
    C: '\(f\) is continuous at \(t_0\)'
    D: '\(|\mathbf r|\) is continuous at \(t_0\)'
    answer: A
    hint: Continuity is componentwise.
    explanation: The limit of a vector function is the vector of limits.
  143:
    topic: s13-1
    question: 'If \(\mathbf r\) is differentiable at \(t_0\), then \(\mathbf r\) is'
    A: continuous only from the left
    B: 'constant near \(t_0\)'
    C: 'continuous at \(t_0\)'
    D: 'not necessarily continuous at \(t_0\)'
    answer: C
    hint: Differentiable implies continuous componentwise.
    explanation: Each component is differentiable hence continuous.
  144:
    topic: s13-1
    question: 'If \(\displaystyle\lim_{t\to t_0}\mathbf r_1(t)=\mathbf A\) and \(\displaystyle\lim_{t\to t_0}\mathbf r_2(t)=\mathbf B\), then \(\displaystyle\lim_{t\to t_0}(\mathbf r_1\times\mathbf r_2)=\)'
    A: '\(\mathbf B\times\mathbf A\)'
    B: '\(\mathbf A+\mathbf B\)'
    C: '\(\mathbf A\times\mathbf B\)'
    D: '\(\mathbf A\cdot\mathbf B\)'
    answer: C
    hint: The cross product is made from sums of products of components.
    explanation: Use the determinant formula and the limit product and sum rules.
  145:
    topic: s13-1
    question: 'By the Fundamental Theorem of Calculus for vector functions, if \(\mathbf R\) is an antiderivative of the continuous function \(\mathbf r\) on \([a,b]\), then \(\displaystyle\int_a^b\mathbf r(t)\,dt=\)'
    A: '\(\mathbf R(a)-\mathbf R(b)\)'
    B: '\(\mathbf r(b)-\mathbf r(a)\)'
    C: '\(\mathbf R(b)-\mathbf R(a)\)'
    D: '\(\mathbf R(b)+\mathbf R(a)\)'
    answer: C
    hint: Apply the scalar theorem to each component.
    explanation: Same as in single-variable calculus, componentwise.
  146:
    topic: s13-1
    question: 'Two antiderivatives of the same vector function \(\mathbf r\) on an interval differ by'
    A: a scalar constant
    B: nothing; the antiderivative is unique
    C: 'a constant vector \(\mathbf C\)'
    D: 'a scalar function of \(t\)'
    answer: C
    hint: Corollary of the Mean Value Theorem for each component.
    explanation: Each component differs by a constant.
  147:
    topic: s13-1
    question: 'For constant \(\mathbf C\), \(\displaystyle\int_a^b\mathbf C\times\mathbf r(t)\,dt=\)'
    A: '\(\displaystyle\int_a^b\mathbf r(t)\,dt\times\mathbf C\)'
    B: '\(\mathbf C\times\displaystyle\int_a^b\mathbf r(t)\,dt\)'
    C: '\(\mathbf C\cdot\displaystyle\int_a^b\mathbf r(t)\,dt\)'
    D: '\(\mathbf C\,\displaystyle\int_a^b|\mathbf r(t)|\,dt\)'
    answer: B
    hint: Constants factor out of integrals.
    explanation: 'Each component of the cross product is a linear combination of the components of \(\mathbf r\).'
  148:
    topic: s13-1
    question: 'A curve has position \(\mathbf{r}(t)=\left(- t \cos{\left(t \right)} + \sin{\left(t \right)}\right)\mathbf{i}+\left(t \sin{\left(t \right)} + \cos{\left(t \right)}\right)\mathbf{j}+t^{2}\mathbf{k}\). Its velocity vector \(d\mathbf r/dt\) at \(t_0=\frac{3 \pi}{2}\) is'
    A: '\(3 \pi\mathbf{i}-\frac{3 \pi}{2}\mathbf{k}\)'
    B: '\(-\mathbf{i}-\frac{3 \pi}{2}\mathbf{j}+\frac{9 \pi^{2}}{4}\mathbf{k}\)'
    C: '\(\frac{3 \pi}{2}\mathbf{i}-3 \pi\mathbf{k}\)'
    D: '\(-\frac{3 \pi}{2}\mathbf{i}+3 \pi\mathbf{k}\)'
    answer: D
    hint: Differentiate each component.
    explanation: '\(\mathbf r''(t)=t \sin{\left(t \right)}\mathbf{i}+t \cos{\left(t \right)}\mathbf{j}+2 t\mathbf{k}\).'
  149:
    topic: s13-1
    question: 'A curve has position \(\mathbf{r}(t)=\left(- t \cos{\left(t \right)} + \sin{\left(t \right)}\right)\mathbf{i}+\left(t \sin{\left(t \right)} + \cos{\left(t \right)}\right)\mathbf{j}+t^{2}\mathbf{k}\). The point \(\mathbf r(t_0)\) at \(t_0=\frac{3 \pi}{2}\) is'
    A: '\(-\mathbf{i}-\frac{3 \pi}{2}\mathbf{j}+\frac{9 \pi^{2}}{4}\mathbf{k}\)'
    B: '\(\frac{9 \pi^{2}}{4}\mathbf{i}-\frac{3 \pi}{2}\mathbf{j}-\mathbf{k}\)'
    C: '\(\mathbf{i}+\frac{3 \pi}{2}\mathbf{j}-\frac{9 \pi^{2}}{4}\mathbf{k}\)'
    D: '\(-\frac{3 \pi}{2}\mathbf{i}+3 \pi\mathbf{k}\)'
    answer: A
    hint: 'Substitute \(t_0\).'
    explanation: '\(\mathbf r(t_0)=-\mathbf{i}- \frac{3 \pi}{2}\mathbf{j}+\frac{9 \pi^{2}}{4}\mathbf{k}\).'
  150:
    topic: s13-1
    question: 'A curve has position \(\mathbf{r}(t)=\sqrt{2} t\mathbf{i}+e^{t}\mathbf{j}+e^{- t}\mathbf{k}\). Its velocity vector \(d\mathbf r/dt\) at \(t_0=1\) is'
    A: '\(\sqrt{2}\mathbf{i}+e\mathbf{j}-e^{-1}\mathbf{k}\)'
    B: '\(-\sqrt{2}\mathbf{i}-e\mathbf{j}+e^{-1}\mathbf{k}\)'
    C: '\(-e^{-1}\mathbf{i}+e\mathbf{j}+\sqrt{2}\mathbf{k}\)'
    D: '\(\sqrt{2}\mathbf{i}+e\mathbf{j}+e^{-1}\mathbf{k}\)'
    answer: A
    hint: Differentiate each component.
    explanation: '\(\mathbf r''(t)=\sqrt{2}\mathbf{i}+e^{t}\mathbf{j}- e^{- t}\mathbf{k}\).'
  151:
    topic: s13-1
    question: 'A curve has position \(\mathbf{r}(t)=\sqrt{2} t\mathbf{i}+e^{t}\mathbf{j}+e^{- t}\mathbf{k}\). The point \(\mathbf r(t_0)\) at \(t_0=1\) is'
    A: '\(\sqrt{2}\mathbf{i}+e\mathbf{j}-e^{-1}\mathbf{k}\)'
    B: '\(e^{-1}\mathbf{i}+e\mathbf{j}+\sqrt{2}\mathbf{k}\)'
    C: '\(\sqrt{2}\mathbf{i}+e\mathbf{j}+e^{-1}\mathbf{k}\)'
    D: '\(-\sqrt{2}\mathbf{i}-e\mathbf{j}-e^{-1}\mathbf{k}\)'
    answer: C
    hint: 'Substitute \(t_0\).'
    explanation: '\(\mathbf r(t_0)=\sqrt{2}\mathbf{i}+e\mathbf{j}+e^{-1}\mathbf{k}\).'
  152:
    topic: s13-1
    question: 'For the helix \(\mathbf r(t)=(\cos at)\mathbf i+(\sin at)\mathbf j+bt\mathbf k\), increasing \(a\) (with \(b\) fixed) makes the helix'
    A: 'rise faster along the \(z\)-axis'
    B: 'become wider than the cylinder of radius \(1\)'
    C: turn faster, so it winds more tightly around the cylinder
    D: unwind into a straight line
    answer: C
    hint: 'The \(x,y\)-part has period \(2\pi/a\).'
    explanation: 'The pitch \(2\pi b/a\) decreases as \(a\) increases.'
  153:
    topic: s13-1
    question: 'For the helix \(\mathbf r(t)=(\cos t)\mathbf i+(\sin t)\mathbf j+bt\mathbf k\), increasing \(b\) (with \(a=1\) fixed) makes the helix'
    A: reverse direction
    B: 'stretch out along the \(z\)-axis (larger pitch), with the same radius'
    C: wind more tightly around the cylinder
    D: increase in radius
    answer: B
    hint: 'The pitch is \(2\pi b\).'
    explanation: 'Radius is determined by the \(xy\)-part only.'
  154:
    topic: s13-2
    question: 'A projectile is fired at \(840\) m/s at a \(60^\circ\) angle. The time to get \(21\) km downrange is'
    A: '\(25\text{ s}\)'
    B: '\(100\text{ s}\)'
    C: '\(50\text{ s}\)'
    D: '\(36.4\text{ s}\)'
    answer: C
    hint: '\(x=(v_0\cos\alpha)t\).'
    explanation: '\(t=21000/(840\cos60^\circ)=50\) s.'
  155:
    topic: s13-2
    question: 'A gun has maximum range \(24.5\) km (take \(g=9.8\) m/s\(^2\)). Its muzzle speed is'
    A: '\(980\text{ m/s}\)'
    B: '\(700\text{ m/s}\)'
    C: '\(490\text{ m/s}\)'
    D: '\(245\text{ m/s}\)'
    answer: C
    hint: 'Maximum range occurs at \(45^\circ\): \(R=v_0^2/g\).'
    explanation: '\(v_0=\sqrt{Rg}=\sqrt{24500\cdot9.8}=490\) m/s.'
  156:
    topic: s13-2
    question: 'A projectile is fired at \(500\) m/s at \(45^\circ\) (\(g=9.8\) m/s\(^2\)). It strikes the ground (same level) after about'
    A: '\(72.2\text{ s}\)'
    B: '\(50.5\text{ s}\)'
    C: '\(144.3\text{ s}\)'
    D: '\(36.1\text{ s}\)'
    answer: A
    hint: '\(T=2v_0\sin\alpha/g\).'
    explanation: '\(T=2(500)(0.7071)/9.8\approx72.2\) s.'
  157:
    topic: s13-2
    question: 'A projectile is fired at \(500\) m/s at \(45^\circ\) (\(g=9.8\) m/s\(^2\)). Its range is about'
    A: '\(36.1\text{ km}\)'
    B: '\(51.02\text{ km}\)'
    C: '\(12.76\text{ km}\)'
    D: '\(25.51\text{ km}\)'
    answer: D
    hint: '\(R=v_0^2\sin2\alpha/g\).'
    explanation: '\(R=500^2/9.8\approx25.5\) km.'
  158:
    topic: s13-2
    question: 'A projectile is fired at \(500\) m/s at \(45^\circ\) (\(g=9.8\) m/s\(^2\)). Its greatest height is about'
    A: '\(8{,}000\text{ m}\)'
    B: '\(6{,}378\text{ m}\)'
    C: '\(3{,}189\text{ m}\)'
    D: '\(12{,}755\text{ m}\)'
    answer: B
    hint: '\(y_{\max}=(v_0\sin\alpha)^2/(2g)\).'
    explanation: '\(y_{\max}=(353.55)^2/19.6\approx6378\) m.'
  159:
    topic: s13-2
    question: 'A projectile is fired at \(500\) m/s at \(45^\circ\) (\(g=9.8\) m/s\(^2\)). When it is \(5\) km downrange, its height is about'
    A: '\(2{,}010\text{ m}\)'
    B: '\(5{,}000\text{ m}\)'
    C: '\(8{,}040\text{ m}\)'
    D: '\(4{,}020\text{ m}\)'
    answer: D
    hint: 'Find \(t\) from \(x=5000\), then \(y\).'
    explanation: '\(t=5000/353.55\approx14.14\) s; \(y=353.55t-4.9t^2\approx4020\) m.'
  160:
    topic: s13-2
    question: 'A baseball is thrown from stands \(32\) ft above the field at \(30^\circ\) with initial speed \(32\) ft/s (\(g=32\) ft/s\(^2\)). It strikes the ground after about'
    A: '\(2\text{ s}\)'
    B: '\(1.5\text{ s}\)'
    C: '\(3\text{ s}\)'
    D: '\(1\text{ s}\)'
    answer: A
    hint: 'Solve \(32+16t-16t^2=0\).'
    explanation: '\(t^2-t-2=0\Rightarrow t=2\) s.'
  161:
    topic: s13-2
    question: 'A baseball is thrown from stands \(32\) ft above the field at \(30^\circ\) with initial speed \(32\) ft/s (\(g=32\) ft/s\(^2\)). It strikes the ground about this far away:'
    A: '\(32\text{ ft}\)'
    B: '\(27.7\text{ ft}\)'
    C: '\(110.9\text{ ft}\)'
    D: '\(55.4\text{ ft}\)'
    answer: D
    hint: '\(x=(v_0\cos\alpha)t\).'
    explanation: '\(x=27.7\cdot2\approx55.4\) ft.'
  162:
    topic: s13-2
    question: 'A shot is put at \(45^\circ\) from \(6.5\) ft above the ground at \(44\) ft/s (\(g=32\) ft/s\(^2\)). The flight time is about'
    A: '\(1.95\text{ s}\)'
    B: '\(3.2\text{ s}\)'
    C: '\(1.07\text{ s}\)'
    D: '\(2.13\text{ s}\)'
    answer: D
    hint: 'Solve \(6.5+31.11t-16t^2=0\).'
    explanation: 'The positive root is \(t\approx2.13\) s.'
  163:
    topic: s13-2
    question: 'A shot is put at \(45^\circ\) from \(6.5\) ft above the ground at \(44\) ft/s (\(g=32\) ft/s\(^2\)). It lands about this far from the stopboard:'
    A: '\(90.5\text{ ft}\)'
    B: '\(60.5\text{ ft}\)'
    C: '\(66.4\text{ ft}\)'
    D: '\(33.1\text{ ft}\)'
    answer: C
    hint: '\(x=(v_0\cos\alpha)t\).'
    explanation: '\(x=31.11\cdot2.13\approx66.3\) ft.'
  164:
    topic: s13-2
    question: 'A shot is put from \(6.5\) ft at \(44\) ft/s (\(g=32\) ft/s\(^2\)). Because of the initial elevation it would have gone slightly farther at \(40^\circ\) than at \(45^\circ\). How much farther (in inches)?'
    A: '\(14.2\text{ in.}\)'
    B: '\(2.8\text{ in.}\)'
    C: '\(0.7\text{ in.}\)'
    D: '\(1.2\text{ in.}\)'
    answer: D
    hint: Compute both landing distances.
    explanation: 'The range at \(40^\circ\) exceeds that at \(45^\circ\) by about \(1.4\) in.'
  165:
    topic: s13-2
    question: 'A golf ball is fired at \(45^\circ\) and lands \(10\) m away (\(g=9.8\) m/s\(^2\)). Its initial speed was about'
    A: '\(9.9\text{ m/s}\)'
    B: '\(14\text{ m/s}\)'
    C: '\(4.95\text{ m/s}\)'
    D: '\(19.8\text{ m/s}\)'
    answer: A
    hint: '\(R=v_0^2/g\) at \(45^\circ\).'
    explanation: '\(v_0=\sqrt{98}\approx9.9\) m/s.'
  166:
    topic: s13-2
    question: 'With the same initial speed (\(v_0^2=98\) m\(^2\)/s\(^2\)) the smaller firing angle giving a range of \(6\) m is about (\(g=9.8\) m/s\(^2\))'
    A: '\(36.9^{\circ}\)'
    B: '\(26.6^{\circ}\)'
    C: '\(18.4^{\circ}\)'
    D: '\(53.1^{\circ}\)'
    answer: C
    hint: '\(\sin2\alpha=Rg/v_0^2\).'
    explanation: '\(\sin2\alpha=0.6\), \(2\alpha=36.87^\circ\), \(\alpha\approx18.4^\circ\).'
  167:
    topic: s13-2
    question: 'With the same initial speed (\(v_0^2=98\) m\(^2\)/s\(^2\)) the larger firing angle giving a range of \(6\) m is about (\(g=9.8\) m/s\(^2\))'
    A: '\(18.4^{\circ}\)'
    B: '\(36.9^{\circ}\)'
    C: '\(71.6^{\circ}\)'
    D: '\(53.1^{\circ}\)'
    answer: C
    hint: The two angles are complementary.
    explanation: '\(90^\circ-18.4^\circ\approx71.6^\circ\).'
  168:
    topic: s13-2
    question: 'An electron is beamed horizontally at \(5\times10^6\) m/s toward a screen \(40\) cm away (\(g=9.8\) m/s\(^2\)). It drops about (in units of \(10^{-14}\) m)'
    A: '\(6.3\)'
    B: '\(3.1\)'
    C: '\(1.6\)'
    D: '\(9.4\)'
    answer: B
    hint: 'Time \(t=0.4/(5\times10^6)\); drop \(=\tfrac12gt^2\).'
    explanation: '\(t=8\times10^{-8}\) s; drop \(=4.9(8\times10^{-8})^2\approx3.1\times10^{-14}\) m.'
  169:
    topic: s13-2
    question: 'A golf ball hit at \(9^\circ\) travels \(248.8\) yd (\(g=32\) ft/s\(^2\), neglect air resistance). Its launch speed is about (in mph)'
    A: '\(95\text{ mph}\)'
    B: '\(190\text{ mph}\)'
    C: '\(133\text{ mph}\)'
    D: '\(275\text{ mph}\)'
    answer: B
    hint: '\(R=v_0^2\sin2\alpha/g\) with \(R=746.4\) ft; convert ft/s to mph.'
    explanation: '\(v_0=\sqrt{746.4\cdot32/\sin18^\circ}\approx278\) ft/s \(\approx190\) mph.'
  170:
    topic: s13-2
    question: 'A human cannonball with \(v_0=80\sqrt{10/3}\) ft/s lands \(200\) ft away at the same height (\(g=32\) ft/s\(^2\)). The low firing angle is about'
    A: '\(17.5^{\circ}\)'
    B: '\(17.4^{\circ}\)'
    C: '\(4.4^{\circ}\)'
    D: '\(8.7^{\circ}\)'
    answer: D
    hint: '\(\sin2\alpha=Rg/v_0^2=0.3\).'
    explanation: '\(2\alpha=17.46^\circ\), so \(\alpha\approx8.7^\circ\).'
  171:
    topic: s13-2
    question: 'A human cannonball is fired at \(8.7^\circ\) with \(v_0=80\sqrt{10/3}\approx146\) ft/s (\(g=32\) ft/s\(^2\)). The greatest height reached is about (the ceiling is at \(75\) ft)'
    A: '\(3.8\text{ ft}\)'
    B: '\(15.2\text{ ft}\)'
    C: '\(75\text{ ft}\)'
    D: '\(7.7\text{ ft}\)'
    answer: D
    hint: '\(y_{\max}=(v_0\sin\alpha)^2/(2g)\).'
    explanation: '\(y_{\max}\approx7.6\) ft, well below the ceiling.'
  172:
    topic: s13-2
    question: 'A golf ball leaves the ground at \(30^\circ\) with speed \(90\) ft/s (\(g=32\) ft/s\(^2\)). Its height when it is \(135\) ft downrange is about'
    A: '\(45\text{ ft}\)'
    B: '\(14.9\text{ ft}\)'
    C: '\(59.8\text{ ft}\)'
    D: '\(29.9\text{ ft}\)'
    answer: D
    hint: 'Find \(t\) from \(x=135\), then \(y\).'
    explanation: '\(t\approx1.732\) s, \(y\approx77.9-48=29.9\) ft, so it just fails to clear a \(30\)-ft tree.'
  173:
    topic: s13-2
    question: 'A golf ball leaves the ground at \(30^\circ\) with speed \(90\) ft/s (\(g=32\) ft/s\(^2\)). Will it clear a \(30\)-ft tree \(135\) ft down the fairway?'
    A: 'Yes; it is about \(60\) ft high there'
    B: 'Yes; it is about \(45\) ft high there'
    C: 'No; it is only about \(29.9\) ft high there'
    D: No; it is already on the ground
    answer: C
    hint: 'Find the height when \(x=135\).'
    explanation: '\(y(135)\approx29.9<30\).'
  174:
    topic: s13-2
    question: 'A golf ball is hit at \(116\) ft/s at \(45^\circ\) toward a green \(45\) ft above the tee (\(g=32\) ft/s\(^2\)). It lands about this far (horizontally) from the tee:'
    A: '\(369\text{ ft}\)'
    B: '\(420\text{ ft}\)'
    C: '\(309\text{ ft}\)'
    D: '\(409\text{ ft}\)'
    answer: A
    hint: 'Solve \(y=45\) for the later time.'
    explanation: 'Set \(45=82.0t-16t^2\) and take the later root (the ball is descending onto the green); then \(x=82.0\,t\).'
  175:
    topic: s13-2
    question: 'A baseball hit at \(20^\circ\) from \(3\) ft just clears a \(37\)-ft wall \(315\) ft away (\(g=32\) ft/s\(^2\)). Its initial speed was about'
    A: '\(119.4\text{ ft/s}\)'
    B: '\(149.3\text{ ft/s}\)'
    C: '\(186.6\text{ ft/s}\)'
    D: '\(224\text{ ft/s}\)'
    answer: B
    hint: 'Solve \(y(t)=37\) with \(x(t)=315\).'
    explanation: 'Eliminate \(t\): \(34=315\tan20^\circ-\dfrac{16\cdot315^2}{v_0^2\cos^220^\circ}\).'
  176:
    topic: s13-2
    question: 'A baseball hit at \(20^\circ\) from \(3\) ft just clears a \(37\)-ft wall \(315\) ft away (\(g=32\) ft/s\(^2\)). The time to reach the wall is about'
    A: '\(3.2\text{ s}\)'
    B: '\(1.5\text{ s}\)'
    C: '\(2.25\text{ s}\)'
    D: '\(4.5\text{ s}\)'
    answer: C
    hint: '\(t=x/(v_0\cos\alpha)\).'
    explanation: 'Divide \(315\) by the horizontal speed.'
  177:
    topic: s13-2
    question: 'A projectile fired at an angle of \(\alpha\) degrees from the horizontal (\(0<\alpha<90\)) has the same range as one fired at the same speed at'
    A: '\(180-\alpha\) degrees'
    B: '\(\alpha/2\) degrees'
    C: '\(90-\alpha\) degrees'
    D: '\(45-\alpha\) degrees'
    answer: C
    hint: '\(R\propto\sin2\alpha\).'
    explanation: '\(\sin(2(90-\alpha))=\sin(180-2\alpha)=\sin2\alpha\).'
  178:
    topic: s13-2
    question: 'To hit a target \(16\) km downrange at the same level with initial speed \(400\) m/s (\(g=9.8\) m/s\(^2\)), the smaller elevation angle is about'
    A: '\(50.7^{\circ}\)'
    B: '\(78.5^{\circ}\)'
    C: '\(39.3^{\circ}\)'
    D: '\(19.6^{\circ}\)'
    answer: C
    hint: '\(\sin2\alpha=Rg/v_0^2\).'
    explanation: '\(\sin2\alpha=0.98\), \(2\alpha\approx78.5^\circ\), \(\alpha\approx39.3^\circ\).'
  179:
    topic: s13-2
    question: If the initial speed of a projectile is doubled (same launch angle), its range is multiplied by
    A: '\(2\)'
    B: '\(\sqrt2\)'
    C: '\(4\)'
    D: '\(8\)'
    answer: C
    hint: '\(R=v_0^2\sin2\alpha/g\).'
    explanation: 'Range is proportional to \(v_0^2\).'
  180:
    topic: s13-2
    question: By about what percent should the initial speed be increased to double both the height and the range of a projectile?
    A: '\(100\%\)'
    B: '\(25\%\)'
    C: '\(50\%\)'
    D: 'about \(41\%\)'
    answer: D
    hint: 'Both are proportional to \(v_0^2\).'
    explanation: '\(v_0\) must be multiplied by \(\sqrt2\approx1.414\).'
  181:
    topic: s13-2
    question: 'A shot put leaves the hand at \(40^\circ\) from \(6.5\) ft and lands \(73\) ft \(10\) in. away (\(g=32\) ft/s\(^2\)). Its initial speed was about'
    A: '\(46.6\text{ ft/s}\)'
    B: '\(32.6\text{ ft/s}\)'
    C: '\(60.6\text{ ft/s}\)'
    D: '\(74.6\text{ ft/s}\)'
    answer: A
    hint: 'Use \(x=v_0\cos\alpha\,t\) and \(y=6.5+v_0\sin\alpha\,t-16t^2=0\).'
    explanation: 'Eliminate \(t\) and solve for \(v_0\).'
  182:
    topic: s13-2
    question: A projectile reaches three-quarters of its maximum height in what fraction of the time it takes to reach the maximum?
    A: one-third
    B: one-half
    C: three-quarters
    D: two-thirds
    answer: B
    hint: '\(y(t)=v_0\sin\alpha\,t-\tfrac12gt^2\) with peak at \(t^*=v_0\sin\alpha/g\).'
    explanation: '\(y(t^*/2)=\tfrac34y_{\max}\).'
  183:
    topic: s13-2
    question: 'Solving \(\dfrac{d^2\mathbf r}{dt^2}=-g\mathbf j\), \(\mathbf r(0)=x_0\mathbf i+y_0\mathbf j\), \(\mathbf r''(0)=(v_0\cos\alpha)\mathbf i+(v_0\sin\alpha)\mathbf j\) gives \(y(t)=\)'
    A: '\(y_0+(v_0\cos\alpha)t-\tfrac12gt^2\)'
    B: '\(y_0+(v_0\sin\alpha)t-gt^2\)'
    C: '\(y_0+(v_0\sin\alpha)t-\tfrac12gt^2\)'
    D: '\((v_0\sin\alpha)t-\tfrac12gt^2\)'
    answer: C
    hint: Integrate twice; use both initial conditions.
    explanation: '\(y''''=-g\), \(y''=v_0\sin\alpha-gt\), \(y=y_0+(v_0\sin\alpha)t-\tfrac12gt^2\).'
  184:
    topic: s13-2
    question: 'When the launch angle is \(\alpha=90^\circ\), the path of an ideal projectile is'
    A: a vertical line segment traced up and back down
    B: a parabola opening downward
    C: a horizontal line
    D: a straight line forever
    answer: A
    hint: '\(\cos90^\circ=0\).'
    explanation: '\(x\) stays at \(x_0\) and only \(y\) changes.'
  185:
    topic: s13-2
    question: 'A marble A is launched at angle \(\alpha\) and speed \(v_0\) toward marble B, which is released from rest at the same instant at a height \(R\tan\alpha\) directly above a spot \(R\) units downrange from A. The marbles'
    A: never collide
    B: 'collide only if \(\alpha=45^\circ\)'
    C: 'collide only if \(v_0\) is large'
    D: 'collide, regardless of \(v_0\) (as long as they meet before landing)'
    answer: D
    hint: 'Gravity pulls both down by the same \(\tfrac12gt^2\).'
    explanation: Relative to free fall, A moves in a straight line along its launch direction toward B, and B starts on that line.
  186:
    topic: s13-2
    question: 'An ideal projectile is launched straight down an inclined plane (hill) from point \(O\). The downhill range is greatest when the initial velocity vector'
    A: points along the hill
    B: is horizontal
    C: is perpendicular to the hill
    D: bisects the angle between the vertical and the hill
    answer: D
