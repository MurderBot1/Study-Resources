    explanation: By symmetry/optimization the best angle is halfway between the downward vertical and the hill line.
  187:
    topic: s13-2
    question: 'A model train engine moving at constant speed fires a marble straight up; the marble rejoins the engine after \(1\) s (\(g=32\) ft/s\(^2\)). The maximum height of the marble above the launch point is'
    A: '\(2\) ft'
    B: '\(16\) ft'
    C: '\(4\) ft'
    D: '\(8\) ft'
    answer: C
    hint: 'It spends \(0.5\) s rising.'
    explanation: '\(h=\tfrac12g(0.5)^2=\tfrac12(32)(0.25)=4\) ft.'
  188:
    topic: s13-2
    question: 'A baseball is hit from \(2.5\) ft with speed \(145\) ft/s at \(23^\circ\); a gust adds \(-14\) ft/s to the horizontal velocity (\(g=32\) ft/s\(^2\)). Its maximum height is about'
    A: '\(105\text{ ft}\)'
