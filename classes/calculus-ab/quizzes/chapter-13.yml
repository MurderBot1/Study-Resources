  196:
    topic: s13-2
    question: 'Consider a baseball hit from \(3\) ft at \(140\) ft/s and \(20^\circ\) with linear drag \(k=0.12\) (\(g=32\) ft/s\(^2\)). It reaches its maximum height at about'
    A: '\(0.96\text{ s}\)'
