# Chapter 13: Vector-Valued Functions and Motion in Space
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 13.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 13: Vector-Valued Functions and Motion in Space"
description: Vector functions and their derivatives and integrals, projectile motion, arc length, curvature, the TNB frame, torsion, and planetary motion.
topics:
  s13-1:
    title: 13.1 Vector Functions
  s13-2:
    title: 13.2 Modeling Projectile Motion
  s13-3:
    title: 13.3 Arc Length and the Unit Tangent Vector T
  s13-4:
    title: 13.4 Curvature and the Unit Normal Vector N
  s13-5:
    title: 13.5 Torsion and the Unit Binormal Vector B
  s13-6:
    title: 13.6 Planetary Motion and Satellites
questions:
  1:
    topic: s13-1
    question: 'A particle has position \(\mathbf{r}(t)=\left(t + 1\right)\mathbf{i}+\left(t^{2} - 1\right)\mathbf{j}\). The path of the particle is the graph of'
    A: '\(y=x^2-2x+2\)'
    B: '\(y=x^2-2x\)'
    C: '\(y=x^2-1\)'
    D: '\(y=x^2+2x\)'
    answer: B
    hint: 'Eliminate \(t\): \(t=x-1\).'
    explanation: '\(y=(x-1)^2-1=x^2-2x\).'
  2:
    topic: s13-1
    question: 'A particle has position \(\mathbf{r}(t)=(t^2+1)\mathbf{i}+(2t-1)\mathbf{j}\). The path is'
    A: '\(x=\dfrac{(y-1)^2}{4}+1\)'
    B: '\(x=\dfrac{(y+1)^2}{4}+1\), a parabola opening to the right'
    C: '\(x=(y+1)^2+1\)'
    D: '\(y=\dfrac{(x+1)^2}{4}+1\)'
    answer: B
    hint: 'Solve \(y=2t-1\) for \(t\).'
    explanation: '\(t=(y+1)/2\), so \(x=(y+1)^2/4+1\).'
  3:
    topic: s13-1
    question: 'A particle has position \(\mathbf{r}(t)=e^t\mathbf{i}+\tfrac29e^{2t}\mathbf{j}\). The path is'
    A: '\(y=\dfrac29x^2\) with \(x\) any real number'
    B: '\(y=\dfrac29x^2\) with \(x>0\)'
    C: '\(y=\dfrac49x^2\) with \(x>0\)'
    D: '\(y=\dfrac29x\) with \(x>0\)'
    answer: B
    hint: '\(e^{2t}=(e^t)^2\).'
    explanation: '\(x=e^t>0\) and \(y=\frac29x^2\).'
  4:
    topic: s13-1
    question: 'A particle has position \(\mathbf{r}(t)=(\cos2t)\mathbf{i}+(3\sin2t)\mathbf{j}\). The path is'
    A: 'the hyperbola \(x^2-\dfrac{y^2}9=1\)'
    B: 'the ellipse \(\dfrac{x^2}9+y^2=1\)'
    C: 'the ellipse \(x^2+\dfrac{y^2}9=1\)'
    D: 'the circle \(x^2+y^2=1\)'
    answer: C
    hint: 'Use \(\cos^2+\sin^2=1\).'
    explanation: '\(x=\cos2t\), \(y/3=\sin2t\).'
  5:
    topic: s13-1
    question: 'The position of a particle is \(\mathbf{r}(t)=\left(t + 1\right)\mathbf{i}+\left(t^{2} - 1\right)\mathbf{j}\). Its velocity at \(t=1\) is'
    A: '\(-\mathbf{i}-2\mathbf{j}\)'
    B: '\(2\mathbf{j}\)'
    C: '\(\mathbf{i}+2\mathbf{j}\)'
    D: '\(2\mathbf{i}\)'
    answer: C
    hint: 'Differentiate each component: \(\mathbf v=d\mathbf r/dt\).'
    explanation: '\(\mathbf v(t)=\mathbf{i}+2 t\mathbf{j}\), so at \(t=1\) it equals \(\mathbf{i}+2\mathbf{j}\).'
  6:
    topic: s13-1
    question: 'The position of a particle is \(\mathbf{r}(t)=\left(t + 1\right)\mathbf{i}+\left(t^{2} - 1\right)\mathbf{j}\). Its acceleration at \(t=1\) is'
    A: '\(-2\mathbf{j}\)'
    B: '\(2\mathbf{j}\)'
    C: '\(2\mathbf{i}\)'
    D: '\(\mathbf{i}+2\mathbf{j}\)'
    answer: B
    hint: 'Differentiate twice: \(\mathbf a=d^2\mathbf r/dt^2\).'
    explanation: '\(\mathbf a(t)=2\mathbf{j}\), so at \(t=1\) it equals \(2\mathbf{j}\).'
  7:
    topic: s13-1
    question: 'The position of a particle is \(\mathbf{r}(t)=\left(t + 1\right)\mathbf{i}+\left(t^{2} - 1\right)\mathbf{j}\). Its speed at \(t=1\) is'
    A: '\(5\)'
    B: '\(3\)'
    C: '\(\sqrt{5}\)'
    D: '\(2\)'
    answer: C
    hint: 'Speed is \(|\mathbf v|\).'
    explanation: '\(\mathbf v=\mathbf{i}+2\mathbf{j}\) has length \(\sqrt{5}\).'
  8:
    topic: s13-1
    question: 'The position of a particle is \(\mathbf{r}(t)=\left(t + 1\right)\mathbf{i}+\left(t^{2} - 1\right)\mathbf{j}\). The direction of motion (unit vector along \(\mathbf v\)) at \(t=1\) is'
    A: '\(\frac{\sqrt{5}}{5}\mathbf{i}+\frac{2 \sqrt{5}}{5}\mathbf{j}\)'
    B: '\(-\frac{\sqrt{5}}{5}\mathbf{i}-\frac{2 \sqrt{5}}{5}\mathbf{j}\)'
    C: '\(\mathbf{i}+2\mathbf{j}\)'
    D: '\(\mathbf{j}\)'
    answer: A
    hint: Divide the velocity by its length.
    explanation: '\(\mathbf v=\mathbf{i}+2\mathbf{j}\), \(|\mathbf v|=\sqrt{5}\); divide.'
