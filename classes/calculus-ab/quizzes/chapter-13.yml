  193:
    topic: s13-2
    question: 'For projectiles fired from the ground with fixed speed \(v_0\), the highest points of the parabolic trajectories (as \(\alpha\) varies) all lie on the ellipse'
    A: '\(x^2+\left(y-\dfrac{v_0^2}{4g}\right)^2=\dfrac{v_0^4}{4g^2}\)'
    B: '\(x^2+4y^2=\dfrac{v_0^4}{4g^2}\)'
    C: '\(4x^2+\left(y-\dfrac{v_0^2}{4g}\right)^2=\dfrac{v_0^4}{4g^2}\)'
