  191:
    topic: s13-2
    question: 'A volleyball is hit from \(4\) ft, \(12\) ft from a \(6\)-ft net, at \(35\) ft/s and \(27^\circ\) (\(g=32\) ft/s\(^2\)). Its height when it passes over the net is about'
