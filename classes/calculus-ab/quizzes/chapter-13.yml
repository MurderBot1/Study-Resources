  412:
    topic: s13-6
    question: 'Planet A (at \(\mathbf r_A=2\cos(2\pi t)\mathbf i+2\sin(2\pi t)\mathbf j\)) and planet B (at \(\mathbf r_B=3\cos(\pi t)\mathbf i+3\sin(\pi t)\mathbf j\)) orbit the sun. The position of B relative to A is'
    A: '\((3\cos\pi t-2\cos2\pi t)\mathbf i+(3\sin\pi t-2\sin2\pi t)\mathbf j\)'
    B: '\((2\cos2\pi t-3\cos\pi t)\mathbf i+(2\sin2\pi t-3\sin\pi t)\mathbf j\)'
    C: '\((3\cos\pi t+2\cos2\pi t)\mathbf i+(3\sin\pi t+2\sin2\pi t)\mathbf j\)'
    D: '\(5\cos\pi t\,\mathbf i+5\sin\pi t\,\mathbf j\)'
    answer: A
    hint: 'Subtract the position vectors: \(\mathbf r_B-\mathbf r_A\).'
    explanation: 'Relative position \(=\mathbf r_B-\mathbf r_A\).'
  413:
    topic: s13-6
    question: 'Planet A has orbital period \(1\) and planet B has orbital period \(2\) (\(\mathbf r_A=2\cos2\pi t\,\mathbf i+2\sin2\pi t\,\mathbf j\), \(\mathbf r_B=3\cos\pi t\,\mathbf i+3\sin\pi t\,\mathbf j\)). Planet A therefore is the'
    A: outer planet, moving faster
    B: inner planet, moving faster
    C: outer planet, moving slower
    D: inner planet, moving slower
    answer: B
    hint: 'A has radius \(2<3\).'
    explanation: 'A completes a revolution in \(t=1\), B in \(t=2\).'
  414:
    topic: s13-6
    question: To the people on planet A, planet B appears to
    A: stand still
    B: go through loops (retrograde motion) as it moves across the sky
    C: move along a straight line
    D: move in a perfect circle
    answer: B
    hint: 'Graph \(\mathbf r_B-\mathbf r_A\).'
    explanation: Relative to A, B traces a looped (epicycle-like) curve.
  415:
    topic: s13-6
    question: 'The semimajor axis \(a\) and period \(T\) of a satellite about a central mass \(M\) satisfy'
    A: '\(T^2=\dfrac{4\pi^2}{GM}a^3\)'
    B: '\(T=\dfrac{4\pi^2}{GM}a^3\)'
    C: '\(T^3=\dfrac{4\pi^2}{GM}a^2\)'
    D: '\(T^2=\dfrac{GM}{4\pi^2}a^3\)'
    answer: A
    hint: "Kepler's third law."
    explanation: 'Derived from \(T=2\pi ab/h\) and \(h^2=GMb^2/a\).'
  416:
    topic: s13-6
    question: 'In the model of planetary motion the angular momentum per unit mass \(\mathbf h=\mathbf r\times\mathbf v\) is'
    A: constant
    B: zero
    C: proportional to time
    D: 'inversely proportional to \(r\)'
    answer: A
    hint: Gravity is a central force.
    explanation: Torque about the sun is zero.
  417:
    topic: s13-6
    question: At perihelion (closest approach), the velocity of a planet is
    A: zero
    B: perpendicular to the position vector
    C: equal to the escape speed
    D: parallel to the position vector
    answer: B
    hint: 'The distance \(r\) is minimized.'
    explanation: '\(\dfrac{d}{dt}|\mathbf r|^2=2\mathbf r\cdot\mathbf v=0\).'
  418:
    topic: s13-6
    question: 'Using \(\mathbf r\) from the center of the sun and \(\mathbf w\) the vector from Earth''s South Pole to North Pole, perihelion occurs when'
    A: '\(\mathbf r\times\mathbf w=\mathbf 0\)'
    B: '\(|\mathbf r|\) is a minimum'
    C: '\(\mathbf r\cdot\mathbf w=0\)'
    D: '\(|\mathbf r|\) is a maximum'
    answer: B
    hint: Perihelion is the closest approach.
    explanation: It is where the distance to the sun is smallest.
  419:
    topic: s13-6
    question: 'Using \(\mathbf r\) from the sun to Earth and \(\mathbf w\) from the South Pole to the North Pole, an equinox occurs when'
    A: '\(\mathbf r\cdot\mathbf w=0\)'
    B: '\(\mathbf r\cdot\mathbf w\) is a maximum'
    C: '\(|\mathbf r|\) is a minimum'
    D: '\(\mathbf r\times\mathbf w=\mathbf 0\)'
    answer: A
    hint: "At an equinox the sun lies in Earth's equatorial plane."
    explanation: The axis is then perpendicular to the sun direction.
