  194:
    topic: s13-2
    question: 'Projectile motion with linear drag satisfies \(\dfrac{d^2\mathbf r}{dt^2}=-g\mathbf j-k\dfrac{d\mathbf r}{dt}\). With \(\mathbf r(0)=\mathbf 0\) and \(\mathbf v(0)=(v_0\cos\alpha)\mathbf i+(v_0\sin\alpha)\mathbf j\), the horizontal coordinate is'
    A: '\(x(t)=\dfrac{v_0}{k^2}\left(1-e^{-kt}\right)\cos\alpha\)'
    B: '\(x(t)=(v_0\cos\alpha)\,t\)'
    C: '\(x(t)=\dfrac{v_0}{k}\left(1-e^{-kt}\right)\cos\alpha\)'
    D: '\(x(t)=\dfrac{v_0}{k}e^{-kt}\cos\alpha\)'
    answer: C
    hint: '\(x''''=-kx''\) is first order in \(x''\).'
    explanation: '\(x''=v_0\cos\alpha\,e^{-kt}\), integrate with \(x(0)=0\).'
  195:
    topic: s13-2
    question: 'With linear drag, the horizontal distance traveled by a projectile as \(t\to\infty\) approaches'
