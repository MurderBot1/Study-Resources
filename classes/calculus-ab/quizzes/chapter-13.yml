  190:
    topic: s13-2
    question: 'A baseball is hit from \(2.5\) ft with speed \(145\) ft/s at \(23^\circ\); a gust adds \(-14\) ft/s to the horizontal velocity (\(g=32\) ft/s\(^2\)). Its range is about'
    A: '\(214\text{ ft}\)'
