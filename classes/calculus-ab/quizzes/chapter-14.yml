  775:
    topic: s14-9
    question: 'If \(w=x^2+y^2+z^2\) and \(z=x^2+y^2\), then \(\left(\dfrac{\partial w}{\partial y}\right)_z=\)'
    A: '\(1\)'
    B: '\(0\)'
