    topic: s14-6
    question: 'The derivative of \(f(x,y)=x^2+y^2\) in the direction of the unit tangent vector of the involute \(\mathbf r(t)=(\cos t+t\sin t)\mathbf i+(\sin t-t\cos t)\mathbf j\) (\(t>0\)) is'
