  783:
    topic: s14-9
    question: 'Let \(U=f(P,V,T)\) with \(PV=nRT\) (\(n,R\) constant). Then \(\left(\dfrac{\partial U}{\partial P}\right)_V=\)'
    A: '\(\dfrac{\partial U}{\partial P}+\dfrac V{nR}\dfrac{\partial U}{\partial T}\)'
    B: '\(\dfrac{\partial U}{\partial P}\)'
    C: '\(\dfrac{\partial U}{\partial P}+\dfrac{nR}V\dfrac{\partial U}{\partial T}\)'
    D: '\(\dfrac V{nR}\dfrac{\partial U}{\partial T}\)'
    answer: A
    hint: 'Hold \(V\) fixed; \(T=PV/(nR)\) varies with \(P\).'
    explanation: '\(\left(\dfrac{\partial T}{\partial P}\right)_V=\dfrac V{nR}\).'
  784:
    topic: s14-9
    question: 'Let \(U=f(P,V,T)\) with \(PV=nRT\). Then \(\left(\dfrac{\partial U}{\partial T}\right)_V=\)'
    A: '\(\dfrac{\partial U}{\partial T}+\dfrac V{nR}\dfrac{\partial U}{\partial P}\)'
    B: '\(\dfrac{\partial U}{\partial T}\)'
    C: '\(\dfrac{nR}V\dfrac{\partial U}{\partial P}\)'
    D: '\(\dfrac{\partial U}{\partial T}+\dfrac{nR}V\dfrac{\partial U}{\partial P}\)'
    answer: D
    hint: 'Hold \(V\) fixed; \(P=nRT/V\) varies with \(T\).'
    explanation: '\(\left(\dfrac{\partial P}{\partial T}\right)_V=\dfrac{nR}V\).'
  785:
    topic: s14-9
    question: 'If \(w=x^2+y^2+z^2\) and \(y\sin z+z\sin x=0\), then \(\left(\dfrac{\partial w}{\partial x}\right)_y\) at \((0,1,\pi)\) is'
    A: '\(2 \pi^{2}\)'
    B: '\(\pi^{2}\)'
    C: '\(- 2 \pi^{2}\)'
    D: '\(2 \pi\)'
    answer: A
    hint: '\(z=z(x,y)\); \(z_x=-F_x/F_z\).'
    explanation: '\(z_x=\pi\); \(w_x=2x+2zz_x=2\pi^2\).'
  786:
    topic: s14-9
    question: 'If \(w=x^2+y^2+z^2\) and \(y\sin z+z\sin x=0\), then \(\left(\dfrac{\partial w}{\partial z}\right)_y\) at \((0,1,\pi)\) is'
    A: '\(\pi\)'
