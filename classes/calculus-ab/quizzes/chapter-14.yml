    topic: s14-3
    question: 'Does a function \(f(x,y)\) with continuous first partial derivatives throughout an open region \(R\) have to be continuous on \(R\)?'
    A: 'Only on the boundary of \(R\)'
    B: Only if the second partials also exist
    C: No, never
    D: Yes; continuous first partials imply differentiability, hence continuity
    answer: D
    hint: Differentiability follows from continuity of the first partials.
    explanation: Differentiable functions are continuous.
  346:
    topic: s14-3
    question: 'If \(f(x,y)\) has continuous second partial derivatives throughout an open region \(R\), the first-order partials of \(f\)'
    A: need not be continuous
    B: must be zero
    C: must be continuous (they are differentiable)
    D: are continuous only at isolated points
    answer: C
    hint: The second partials are the partials of the first partials.
    explanation: Continuous second partials make the first partials differentiable, so continuous.
  347:
    topic: s14-3
    question: The three-dimensional Laplace equation is
    A: '\(\dfrac{\partial^2f}{\partial x^2}+\dfrac{\partial^2f}{\partial y^2}+\dfrac{\partial^2f}{\partial z^2}=0\)'
    B: '\(\dfrac{\partial f}{\partial x}+\dfrac{\partial f}{\partial y}+\dfrac{\partial f}{\partial z}=0\)'
    C: '\(\dfrac{\partial^2f}{\partial t^2}=c^2\dfrac{\partial^2f}{\partial x^2}\)'
    D: '\(\dfrac{\partial^2f}{\partial x\partial y\partial z}=0\)'
    answer: A
    hint: It sums the unmixed second partials.
    explanation: Steady-state temperature and potentials satisfy it.
  348:
    topic: s14-3
    question: The one-dimensional wave equation is
    A: '\(\dfrac{\partial w}{\partial t}=c^2\dfrac{\partial^2w}{\partial x^2}\)'
    B: '\(\dfrac{\partial^2w}{\partial t^2}=c^2\dfrac{\partial^2w}{\partial x^2}\)'
    C: '\(\dfrac{\partial w}{\partial t}=c\dfrac{\partial w}{\partial x}\)'
    D: '\(\dfrac{\partial^2w}{\partial t^2}+c^2\dfrac{\partial^2w}{\partial x^2}=0\)'
    answer: B
    hint: '\(c\) is the propagation speed.'
    explanation: 'Second derivative in time equals \(c^2\) times second derivative in space.'
  349:
