  468:
    topic: s14-5
    question: 'If \(\mathbf i,\mathbf j,\mathbf k\) are the standard unit vectors, then \(D_{\mathbf i}f\), \(D_{\mathbf j}f\), \(D_{\mathbf k}f\) equal'
