title: "Chapter 14: Partial Derivatives"
description: "Functions of several variables, limits and continuity, partial derivatives, the Chain Rule, directional derivatives and gradients, tangent planes and linearization, extreme values, Lagrange multipliers, constrained variables, and Taylor's formula."
topics:
  s14-1:
    title: 14.1 Functions of Several Variables
  s14-2:
    title: 14.2 Limits and Continuity in Higher Dimensions
  s14-3:
    title: 14.3 Partial Derivatives
  s14-4:
    title: 14.4 The Chain Rule
  s14-5:
    title: 14.5 Directional Derivatives and Gradient Vectors
  s14-6:
    title: 14.6 Tangent Planes and Differentials
  s14-7:
    title: 14.7 Extreme Values and Saddle Points
  s14-8:
    title: 14.8 Lagrange Multipliers
  s14-9:
    title: 14.9 Partial Derivatives with Constrained Variables
  s14-10:
    title: "14.10 Taylor's Formula for Two Variables"
questions:
  1:
    topic: s14-1
    question: 'The domain of \(f(x,y)=y-x\) is'
    A: 'the half-plane \(y\ge x\)'
    B: 'all points with \(y\ne x\)'
    C: 'the half-plane \(y>0\)'
    D: 'all points \((x,y)\)'
    answer: D
    hint: Find where the formula is defined.
    explanation: Check denominators, even roots, logarithms, and inverse trig restrictions.
  2:
    topic: s14-1
    question: 'The range of \(f(x,y)=y-x\) is'
    A: '\((-\infty,\infty)\)'
    B: '\([0,\infty)\)'
    C: '\([1,\infty)\)'
    D: '\((0,\infty)\)'
    answer: A
    hint: Look at the values the expression can take on its domain.
    explanation: Examine the extreme values attained over the domain.
  3:
    topic: s14-1
    question: 'The level curves of \(f(x,y)=y-x\) are'
    A: 'lines \(y=-x+c\)'
    B: 'lines \(y=x+c\) (parallel lines of slope \(1\))'
    C: 'parabolas \(y=x^2+c\)'
    D: circles centered at the origin
    answer: B
    hint: 'Set \(f(x,y)=c\) and describe the curve.'
    explanation: 'Solve \(f(x,y)=c\) for the relation between \(x\) and \(y\).'
  4:
    topic: s14-1
    question: 'As a region in the plane, the domain of \(f(x,y)=y-x\) is (open/closed, bounded/unbounded)'
    A: both open and closed, unbounded
    B: open, unbounded
    C: open, bounded
    D: closed, bounded
    answer: A
    hint: A region is open if it contains none of its boundary points and closed if it contains all of them.
    explanation: The boundary of the domain is no points (empty boundary).
  5:
    topic: s14-1
    question: 'The boundary of the domain of \(f(x,y)=y-x\) is'
    A: 'the \(y\)-axis'
    B: no points (empty boundary)
    C: 'the \(x\)-axis'
    D: 'the line \(y=x\)'
    answer: B
    hint: The boundary consists of the points where the domain stops.
    explanation: Identify the edge of the domain.
