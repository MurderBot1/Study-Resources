  571:
    topic: s14-6
    question: 'The derivative of \(f(x,y,z)=x^2+y^2+z^2\) in the direction of the unit tangent of the helix \(\mathbf r(t)=(\cos t)\mathbf i+(\sin t)\mathbf j+t\mathbf k\) is'
