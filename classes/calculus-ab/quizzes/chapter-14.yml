    hint: 'Solve \(\nabla f=\lambda\nabla g\) together with the constraint, then compare the values of \(f\) at the solutions.'
    explanation: '\(f\) is extreme at \(\pm\dfrac{5}{\sqrt{14}}(1,2,3)\). The maximum occurs at \((\frac{5 \sqrt{14}}{14}, \frac{5 \sqrt{14}}{7}, \frac{15 \sqrt{14}}{14})\).'
  750:
    topic: s14-8
    question: 'The minimum value of \(f=x+2y+3z\) on the sphere \(x^2+y^2+z^2=25\) is'
