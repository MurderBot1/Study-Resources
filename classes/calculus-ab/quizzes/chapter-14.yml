  463:
    topic: s14-5
    question: 'At \(P_0(1,2)\), \(D_{(\mathbf i+\mathbf j)/\sqrt2}f=2\sqrt2\) and \(D_{-\mathbf j}f=-3\). Then \(\nabla f(P_0)=\)'
    A: '\(3\mathbf i+\mathbf j\)'
