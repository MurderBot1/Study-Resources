  465:
    topic: s14-5
    question: 'The derivative of \(f(x,y,z)\) at \(P\) is greatest in the direction of \(\mathbf v=\mathbf i+\mathbf j-\mathbf k\), with value \(2\sqrt3\). Then \(\nabla f(P)=\)'
