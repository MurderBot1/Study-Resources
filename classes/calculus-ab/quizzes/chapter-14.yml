    B: '\(1+\cos t\)'
    C: '\(\cos t\)'
    D: '\(1\)'
    answer: B
    hint: 'With \(x,z,t\) independent, \(y=t-x\).'
    explanation: '\(w=x^2+t-x-z+\sin t\).'
  782:
    topic: s14-9
    question: 'If \(w=x^2+y-z+\sin t\) and \(x+y=t\), then \(\left(\dfrac{\partial w}{\partial t}\right)_{y,z}=\)'
    A: '\(1+\cos t\)'
    B: '\(2x\)'
