    question: 'If \(f_{xy}\) and \(f_{yx}\) are both continuous at a point, then'
    A: '\(f_{xy}=f_{xx}\) there'
    B: '\(f_{xy}=-f_{yx}\) there'
    C: they can differ
    D: '\(f_{xy}=f_{yx}\) there'
    answer: D
