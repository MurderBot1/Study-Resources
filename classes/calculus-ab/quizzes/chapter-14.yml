  769:
    topic: s14-8
    question: 'For nonnegative \(a,b,c\), the inequality \((abc)^{1/3}\le\dfrac{a+b+c}3\) says that'
    A: the geometric mean is at most the arithmetic mean
    B: the harmonic mean is the largest mean
    C: the product is at most the sum
    D: the arithmetic mean is at most the geometric mean
    answer: A
