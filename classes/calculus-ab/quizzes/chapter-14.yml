  460:
    topic: s14-5
    question: 'For \(f(x,y)=\dfrac{x^2-y^2}{x^2+y^2}\) at \(P(1,1)\), the directions with \(D_{\mathbf u}f=0\) are'
    A: '\(\pm\mathbf i\)'
