  776:
    topic: s14-9
    question: 'If \(w=x^2+y^2+z^2\) and \(z=x^2+y^2\), then \(\left(\dfrac{\partial w}{\partial z}\right)_x=\)'
    A: '\(1\)'
    B: '\(1+2z\)'
