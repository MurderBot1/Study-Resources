    explanation: It is the AM-GM inequality.
  770:
    topic: s14-8
    question: 'For positive numbers \(a_1,\dots,a_n\), the maximum of \(\displaystyle\sum a_ix_i\) subject to \(\displaystyle\sum x_i^2=1\) is'
    A: '\(\max a_i\)'
    B: '\(\displaystyle\sum a_i^2\)'
    C: '\(\displaystyle\sum a_i\)'
    D: '\(\sqrt{\displaystyle\sum a_i^2}\)'
    answer: D
    hint: This is the Cauchy-Schwarz inequality.
    explanation: 'The maximum is \(|\mathbf a|\) when \(\mathbf x=\mathbf a/|\mathbf a|\).'
  771:
    topic: s14-8
    question: 'In the method of Lagrange multipliers with two constraints \(g_1=0\), \(g_2=0\), the extreme points of \(f\) satisfy'
    A: '\(\nabla f=\lambda\nabla g_1\times\nabla g_2\)'
    B: '\(\nabla f=\lambda_1\nabla g_1+\lambda_2\nabla g_2\)'
    C: '\(\nabla f\cdot\nabla g_1=\nabla f\cdot\nabla g_2\)'
    D: '\(\nabla f=\mathbf0\)'
    answer: B
    hint: '\(\nabla f\) lies in the span of the constraint gradients.'
    explanation: 'Together with \(g_1=g_2=0\).'
  772:
    topic: s14-8
    question: 'The condition \(\nabla f=\lambda\nabla g\) at an extremum of \(f\) subject to \(g=0\) means that'
    A: '\(\nabla f\) is tangent to the constraint'
    B: '\(\nabla f\) is normal to the constraint curve (surface) there'
    C: '\(f\) is constant everywhere'
    D: '\(\nabla f=\mathbf0\)'
    answer: B
    hint: 'Along the constraint \(f\) has zero rate of change at the extremum.'
    explanation: Both gradients are perpendicular to the constraint set.
  773:
    topic: s14-8
    question: 'To find the distance from the line \(y=x+1\) to the parabola \(y^2=x\), one minimizes \((x-w)^2+(y-z)^2\) subject to'
    A: '\(y^2=x\) and \(z=w+1\)'
    B: '\(y=x+1\) and \(z=w^2\)'
    C: '\(y=x+1\) and \(z^2=w\)'
    D: '\(y=x\) and \(z^2=w+1\)'
