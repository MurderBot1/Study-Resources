    explanation: '\((a+b)/\sqrt2=2\sqrt2\Rightarrow a+b=4\); \(-b=-3\Rightarrow b=3\), \(a=1\).'
  464:
    topic: s14-5
    question: 'Given \(\nabla f(P_0)=\mathbf i+3\mathbf j\), the derivative of \(f\) at \(P_0\) in the direction of \(-\mathbf i-2\mathbf j\) is'
