    answer: C
    hint: '\(\nabla f(1,1)=\langle1,-1\rangle\); take \(\mathbf u\perp\nabla f\).'
    explanation: 'The level curve through \((1,1)\) is the line \(y=x\).'
  461:
    topic: s14-5
    question: 'Is there a direction \(\mathbf u\) in which the rate of change of \(f(x,y)=x^2-3xy+4y^2\) at \(P(1,2)\) equals \(14\)?'
