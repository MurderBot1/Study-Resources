  787:
    topic: s14-9
    question: 'If \(w=x^2y^2+yz-z^3\) and \(x^2+y^2+z^2=6\), then \(\left(\dfrac{\partial w}{\partial y}\right)_x\) at \((x,y,z)=(2,1,-1)\) is'
    A: '\(-5\)'
    B: '\(6\)'
    C: '\(10\)'
    D: '\(5\)'
    answer: D
    hint: '\(z=z(x,y)\), \(z_y=-y/z\).'
    explanation: '\(w_y=2x^2y+z+(y-3z^2)z_y\).'
  788:
    topic: s14-9
    question: 'If \(w=x^2y^2+yz-z^3\) and \(x^2+y^2+z^2=6\), then \(\left(\dfrac{\partial w}{\partial y}\right)_z\) at \((x,y,z)=(2,1,-1)\) is'
    A: '\(10\)'
    B: '\(5\)'
    C: '\(6\)'
    D: '\(-5\)'
    answer: B
    hint: '\(x=x(y,z)\), \(x_y=-y/x\).'
    explanation: '\(w_y=2xy^2x_y+2x^2y+z\).'
  789:
    topic: s14-9
    question: 'If \(x=u^2+v^2\) and \(y=uv\), then \(\left(\dfrac{\partial u}{\partial y}\right)_x\) at \((u,v)=(\sqrt2,1)\) is'
    A: '\(-\dfrac12\)'
    B: '\(\dfrac{\sqrt2}2\)'
    C: '\(1\)'
    D: '\(-1\)'
    answer: D
    hint: 'Invert the Jacobian: \(u_y=-x_v/\det\).'
    explanation: '\(\det=2u^2-2v^2=2\) and \(x_v=2v=2\).'
  790:
    topic: s14-9
    question: 'If \(x^2+y^2=r^2\) and \(x=r\cos\theta\), then \(\left(\dfrac{\partial x}{\partial r}\right)_\theta\) and \(\left(\dfrac{\partial r}{\partial x}\right)_y\) are'
    A: '\(\cos\theta\) and \(\sec\theta\)'
    B: '\(\cos\theta\) and \(\cos\theta\)'
    C: '\(r\cos\theta\) and \(\cos\theta\)'
    D: '\(\sin\theta\) and \(\sin\theta\)'
    answer: B
    hint: '\(x=r\cos\theta\) gives \(x_r=\cos\theta\); \(r=\sqrt{x^2+y^2}\) gives \(r_x=x/r\).'
    explanation: '\(x/r=\cos\theta\).'
  791:
    topic: s14-9
    question: 'If \(w=x^2-y^2+4z+t\) and \(x+2z+t=25\), then \(\dfrac{\partial w}{\partial x}=2x-1\) when the independent variables are'
    A: '\(x,y,t\) (with \(z=\tfrac{25-x-t}2\))'
    B: '\(x,z,t\)'
    C: '\(x,y,z\) (with \(t=25-x-2z\))'
    D: '\(y,z,t\)'
    answer: C
    hint: Eliminate the dependent variable and differentiate.
    explanation: '\(w=x^2-y^2+2z+25-x\), so \(w_x=2x-1\).'
  792:
    topic: s14-9
    question: 'If \(w=x^2-y^2+4z+t\) and \(x+2z+t=25\), then \(\dfrac{\partial w}{\partial x}=2x-2\) when the independent variables are'
    A: '\(y,z,t\)'
