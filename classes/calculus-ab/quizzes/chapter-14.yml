    question: 'For \(f(x,y)=x^2+kxy+y^2\), the Second Derivative Test guarantees a local minimum at \((0,0)\) when'
    A: '\(k>0\)'
    B: '\(|k|<2\)'
    C: '\(k=\pm2\)'
    D: '\(|k|>2\)'
    answer: B
    hint: '\(D=4-k^2>0\) and \(f_{xx}=2>0\).'
    explanation: '\(|k|<2\).'
  661:
    topic: s14-7
    question: 'For \(f(x,y)=x^2+kxy+y^2\), the Second Derivative Test is inconclusive at \((0,0)\) when'
    A: '\(|k|<2\)'
    B: '\(k=0\)'
    C: '\(k=\pm2\)'
    D: '\(|k|>2\)'
    answer: C
    hint: '\(D=4-k^2=0\).'
    explanation: 'Then \(f=(x\pm y)^2\ge0\), a degenerate minimum.'
  662:
    topic: s14-7
    question: 'If \(f_x(a,b)=f_y(a,b)=0\), must \(f\) have a local maximum or minimum at \((a,b)\)?'
    A: Yes, a minimum
    B: Yes, a maximum
    C: No; it could be a saddle point
    D: Yes, always
    answer: C
    hint: 'Think of \(f=x^2-y^2\) at the origin.'
    explanation: Critical points need not be extrema.
  663:
    topic: s14-7
    question: 'If \(f\) and its first and second partials are continuous on a disk about \((a,b)\), \(f_x(a,b)=f_y(a,b)=0\), and \(f_{xx}(a,b)\) and \(f_{yy}(a,b)\) differ in sign, then'
    A: '\(f\) has a local minimum at \((a,b)\)'
    B: '\(f\) has a local maximum at \((a,b)\)'
    C: nothing can be concluded
    D: '\(f\) has a saddle point at \((a,b)\)'
    answer: D
    hint: '\(D=f_{xx}f_{yy}-f_{xy}^2<0\).'
    explanation: 'Opposite signs make \(f_{xx}f_{yy}<0\), so \(D<0\).'
