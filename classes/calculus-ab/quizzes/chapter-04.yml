    C: 'If \(f\) is continuous, then \(f\) has a derivative'
    D: 'If \(f(a)=f(b)\), then \(f\) is constant'
    answer: B
    hint: Apply the MVT on subintervals; the average slope is 0.
    explanation: '\(f(b)-f(a)=f''(c)(b-a)=0\) for every pair \(a<b\).'
