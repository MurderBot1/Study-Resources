  42:
    topic: s4-2
    question: 'Does \(f(x)=x^{2/3}\) satisfy the hypotheses of the Mean Value Theorem on \([-1,8]\)?'
    A: 'Yes, because \(f(-1)\ne f(8)\)'
    B: 'No: \(f\) is not continuous on \([-1,8]\)'
    C: 'No: \(f\) is not differentiable at \(x=0\), which lies inside the interval'
    D: 'Yes: \(f\) is continuous and differentiable everywhere'
    answer: C
    hint: 'Check \(f''\) on the open interval.'
    explanation: '\(f''(x)=\tfrac23x^{-1/3}\) is undefined at 0. (The hypotheses are sufficient, not necessary, so the conclusion may still happen to hold.)'
  43:
    topic: s4-2
    question: 'Does \(f(x)=x^{4/5}\) satisfy the hypotheses of the Mean Value Theorem on \([0,1]\)?'
    A: 'No: \(f\) is not differentiable at 0, so the theorem fails'
    B: 'No: \(f\) is not continuous'
    C: 'No: \(f(0)=f(1)\)'
    D: 'Yes: \(f\) is continuous on \([0,1]\) and differentiable on \((0,1)\)'
    answer: D
    hint: 'The MVT only needs differentiability on the open interval \((0,1)\).'
    explanation: '\(f''(x)=\tfrac45x^{-1/5}\) exists for \(0<x<1\); the trouble at \(x=0\) is an endpoint.'
  44:
    topic: s4-2
    question: 'Does \(f(x)=\sqrt{x(1-x)}\) satisfy the hypotheses of the Mean Value Theorem on \([0,1]\)?'
