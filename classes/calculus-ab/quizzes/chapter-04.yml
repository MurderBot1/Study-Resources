    explanation: '\(y=\sin t+C\) behaves like \(\sin\).'
  117:
    topic: s4-4
    question: 'The graph of \(f\) is concave down where'
    A: '\(f''''>0\)'
    B: '\(f''''<0\)'
    C: '\(f''<0\)'
    D: '\(f''>0\)'
    answer: B
    hint: Concavity is about the sign of the second derivative.
    explanation: 'The slope decreases as \(x\) increases.'
  118:
    topic: s4-4
    question: 'A graph with \(f''>0\) and \(f''''>0\) on an interval is'
    A: increasing and concave up (curving upward, getting steeper)
    B: increasing and concave down
    C: decreasing and concave down
    D: decreasing and concave up
    answer: A
    hint: The first derivative controls rise/fall.
    explanation: Positive slope that itself increases.
  119:
    topic: s4-4
    question: 'Which statement about \(f(x)=\sin x\) on \((0,\pi)\) is true?'
    A: It is increasing then decreasing and concave down throughout
    B: It is increasing and concave up
    C: It is concave up then concave down
    D: It is decreasing throughout
    answer: A
    hint: '\(f''''=-\sin x<0\) on \((0,\pi)\).'
    explanation: '\(\cos x\) changes sign at \(\tfrac\pi2\) but \(-\sin x\) does not change sign on \((0,\pi)\).'
  120:
    topic: s4-4
    question: 'The function \(y=x+\sin x\) on \([-\tfrac{2\pi}{3},\tfrac{2\pi}{3}]\) at \(x=0\) has'
    A: an inflection point with slope 2
    B: a corner
    C: a local maximum
    D: a local minimum
    answer: A
    hint: '\(y''=1+\cos x\), \(y''''=-\sin x\).'
    explanation: '\(y''''\) changes sign at 0 and \(y''(0)=2\).'
  121:
    topic: s4-4
    question: 'The curve \(y=\tan x-4x\) on \((-\tfrac\pi2,\tfrac\pi2)\) has local extrema at'
    A: '\(x=\pm\dfrac\pi4\)'
    B: '\(x=\pm\dfrac\pi3\)'
    C: '\(x=\pm\dfrac\pi6\)'
    D: '\(x=0\)'
    answer: B
    hint: '\(y''=\sec^2x-4=0\).'
    explanation: '\(\cos^2x=\tfrac14\), so \(x=\pm\tfrac\pi3\).'
  122:
    topic: s4-4
    question: 'The cost of manufacturing \(x\) items is shown with an inflection near \(x=60\) thousand. There, marginal cost'
    A: is undefined
    B: switches from increasing to decreasing
    C: switches from decreasing to increasing
    D: is zero
    answer: C
    hint: 'At an inflection point of cost, \(c''\) has a local minimum.'
    explanation: The slope of the cost curve is smallest there.
  123:
    topic: s4-4
    question: 'An oblique (slant) asymptote of \(y=\dfrac{x^2-3}{x-2}\) is'
    A: '\(y=x+2\)'
    B: '\(y=2\)'
    C: '\(y=x-2\)'
    D: '\(y=x\)'
    answer: A
    hint: 'Divide: \(x^2-3=(x-2)(x+2)+1\).'
    explanation: '\(y=x+2+\dfrac{1}{x-2}\).'
  124:
    topic: s4-4
    question: 'The curve \(y=\dfrac{x^3}{3x^2+1}\) has an oblique asymptote at'
    A: '\(y=x\)'
    B: '\(y=3x\)'
    C: '\(y=0\)'
    D: '\(y=\dfrac{x}{3}\)'
    answer: D
    hint: 'The leading terms give \(\dfrac{x^3}{3x^2}\).'
    explanation: '\(y=\dfrac x3-\dfrac{x}{3(3x^2+1)}\).'
  125:
    topic: s4-4
    question: 'The curve \(y=\dfrac{x^2-3}{x-2}\) has local extrema at'
    A: '\(x=1\) (a local maximum) and \(x=3\) (a local minimum)'
    B: '\(x=1\) (a local minimum) and \(x=3\) (a local maximum)'
    C: '\(x=2\) (a local maximum)'
    D: no local extrema
    answer: A
    hint: '\(y''=\dfrac{x^2-4x+3}{(x-2)^2}=\dfrac{(x-1)(x-3)}{(x-2)^2}\).'
    explanation: '\(y''\) goes \(+,-,-,+\) across \(1,2,3\).'
  126:
    topic: s4-5
    question: 'What is the smallest possible perimeter of a rectangle with area 16 in.\(^2\)?'
    A: '\(32\) in.'
    B: '\(20\) in.'
    C: '\(16\) in., for a \(4\times4\) square'
    D: '\(8\) in.'
    answer: C
    hint: '\(P=2x+\dfrac{32}{x}\); set \(P''=0\).'
    explanation: '\(x=4\) and \(P=8+8=16\).'
  127:
    topic: s4-5
    question: Among all rectangles with perimeter 8 m, the largest area is
    A: '\(3\) m\(^2\)'
    B: '\(8\) m\(^2\)'
    C: '\(4\) m\(^2\), for a \(2\times2\) square'
    D: '\(16\) m\(^2\)'
    answer: C
    hint: '\(A=x(4-x)\).'
    explanation: 'Maximum at \(x=2\).'
  128:
    topic: s4-5
    question: A rectangle is inscribed in an isosceles right triangle with hypotenuse 2. The largest area it can have is
    A: '\(1\)'
    B: '\(\dfrac14\)'
    C: '\(\dfrac{\sqrt2}{2}\)'
    D: '\(\dfrac12\), using dimensions \(1\) by \(\tfrac12\)'
    answer: D
    hint: 'Put the triangle on the \(x\)-axis; the top vertices are on the lines \(y=1-x\); \(A=2x(1-x)\).'
    explanation: '\(A''=2-4x=0\) gives \(x=\tfrac12\) and \(A=\tfrac12\).'
  129:
    topic: s4-5
    question: 'A rectangle has its base on the \(x\)-axis and its upper vertices on \(y=12-x^2\). The largest possible area is'
    A: '\(24\)'
    B: '\(48\)'
    C: '\(16\)'
    D: '\(32\)'
    answer: D
    hint: '\(A=2x(12-x^2)\).'
    explanation: '\(A''=24-6x^2=0\) gives \(x=2\) and \(A=2\cdot2\cdot8=32\) (dimensions \(4\times8\)).'
  130:
    topic: s4-5
    question: An open box is made from an 8-in.-by-15-in. sheet by cutting equal squares from the corners. The box with largest volume has height about
    A: '\(1\) in.'
    B: '\(2.5\) in.'
    C: '\(4\) in.'
    D: '\(1.67\) in.'
    answer: D
    hint: '\(V=x(8-2x)(15-2x)\).'
    explanation: '\(V''=12x^2-92x+120=0\) gives \(x=\dfrac{5}{3}\approx1.67\) (the other root, 6, is outside \((0,4)\)).'
  131:
    topic: s4-5
    question: 'A 216 m\(^2\) rectangular pea patch is enclosed by a fence and divided into two equal parts by another fence parallel to one side. The least fence length is'
    A: '\(60\) m'
    B: '\(108\) m'
    C: '\(72\) m, with outer dimensions \(18\times12\) m'
    D: '\(90\) m'
    answer: C
    hint: 'If the outer sides are \(x\) and \(y\) with \(xy=216\), the fence length is \(2x+3y\) (the divider has length \(y\)).'
    explanation: '\(F=2x+\dfrac{648}{x}\); \(F''=0\) gives \(x=18\), \(y=12\), and \(F=36+36=72\).'
  132:
    topic: s4-5
    question: With 800 m of wire for a one-sided river fence, the largest area you can enclose with a rectangle (using the river as the fourth side) is
    A: '\(20{,}000\) m\(^2\)'
    B: '\(160{,}000\) m\(^2\)'
    C: '\(80{,}000\) m\(^2\)'
    D: '\(40{,}000\) m\(^2\)'
    answer: C
    hint: '\(A=x(800-2x)\).'
    explanation: '\(x=200\), length 400: \(A=200\cdot400=80{,}000\).'
  133:
    topic: s4-5
    question: 'A square-based, open-top tank holds 500 ft\(^3\). To use the least sheet metal, the base side and height should be'
    A: '\(7\) ft by \(10\) ft'
    B: '\(20\) ft by \(1.25\) ft'
    C: '\(5\) ft by \(20\) ft'
    D: '\(10\) ft by \(5\) ft'
    answer: D
    hint: 'Surface area \(=x^2+4xh\) with \(x^2h=500\).'
    explanation: '\(S=x^2+2000/x\); \(S''=0\) gives \(x=10\), \(h=5\).'
  134:
    topic: s4-5
    question: 'A poster has 50 in.\(^2\) of printing with 4-in. margins top and bottom and 2-in. margins on each side. The overall dimensions that use the least paper are'
    A: '\(7\) in. by \(14\) in.'
    B: '\(9\) in. by \(9\) in.'
    C: '\(10\) in. by \(15\) in.'
    D: '\(9\) in. wide by \(18\) in. tall'
    answer: D
    hint: 'Let the printed width be \(x\) and height \(50/x\). The overall area is \((x+4)(50/x+8)\).'
    explanation: 'Minimizing gives \(x=5\), so the paper is \(9\) by \(18\).'
  135:
    topic: s4-5
    question: The largest right circular cone that can be inscribed in a sphere of radius 3 has volume
    A: '\(\dfrac{64\pi}{3}\)'
    B: '\(\dfrac{32\pi}{3}\)'
    C: '\(36\pi\)'
    D: '\(12\pi\)'
    answer: B
    hint: 'If the cone''s height is \(h\) above the base plane, the base radius satisfies \(r^2=9-(h-3)^2\).'
    explanation: '\(V=\tfrac\pi3(6h^2-h^3)\); \(V''=0\) gives \(h=4\) and \(V=\tfrac{32\pi}3\).'
  136:
    topic: s4-5
    question: 'Two sides of a triangle have lengths \(a\) and \(b\) and enclose angle \(\theta\). The area \(\tfrac12ab\sin\theta\) is largest when'
    A: '\(\theta=\dfrac\pi2\)'
    B: '\(\theta=\pi\)'
    C: '\(\theta=\dfrac\pi3\)'
    D: '\(\theta=\dfrac\pi4\)'
    answer: A
    hint: 'Maximize \(\sin\theta\).'
    explanation: '\(\sin\theta\) is 1 at \(\theta=\pi/2\).'
  137:
    topic: s4-5
    question: 'The lightest open-top cylindrical can holding 1000 cm\(^3\) has height-to-radius ratio'
    A: '\(\pi\)'
    B: '\(1\) (so \(h=r\))'
    C: '\(\tfrac12\)'
    D: '\(2\)'
    answer: B
    hint: '\(S=\pi r^2+2\pi rh\) with \(\pi r^2h=1000\).'
    explanation: '\(S''=0\) gives \(r^3=1000/\pi\) and \(h=r\).'
  138:
    topic: s4-5
    question: 'If the top and bottom of a can are cut from squares of side \(2r\) (the side is cut with no waste), the aluminum used is \(A=8r^2+2\pi rh\). With fixed volume, the most economical ratio \(h/r\) is'
    A: '\(2\)'
    B: '\(\dfrac{8}{\pi}\)'
    C: '\(1\)'
    D: '\(\dfrac{4}{\pi}\)'
    answer: B
    hint: 'Substitute \(h=V/(\pi r^2)\) and set \(A''=0\).'
    explanation: '\(A=8r^2+\dfrac{2V}{r}\), so \(A''=16r-\dfrac{2V}{r^2}=0\) gives \(V=8r^3\). Then \(\pi r^2h=8r^3\) and \(h/r=\dfrac8\pi\).'
  139:
    topic: s4-5
    question: 'The U.S. Postal Service accepts a box with a square end only if length plus girth is at most 108 in. The largest volume has end side \(x=\) and length \(\ell=\)'
    A: '\(x=18\) in., \(\ell=36\) in.'
    B: '\(x=20\) in., \(\ell=28\) in.'
    C: '\(x=27\) in., \(\ell=0\) in.'
    D: '\(x=12\) in., \(\ell=60\) in.'
    answer: A
    hint: '\(\ell+4x=108\) and \(V=x^2\ell=x^2(108-4x)\).'
    explanation: '\(V''=216x-12x^2=0\) gives \(x=18\), \(\ell=36\), \(V=11{,}664\) in.\(^3\).'
  140:
    topic: s4-5
    question: 'A rectangular piece of paper with perimeter 36 cm is rolled into a cylinder (the rectangle''s sides \(x\) by \(y\) with circumference \(x\)). The values of \(x\) and \(y\) that give the largest volume are'
    A: '\(x=6\) cm and \(y=12\) cm'
    B: '\(x=18\) cm and \(y=0\)'
    C: '\(x=12\) cm and \(y=6\) cm'
    D: '\(x=9\) cm and \(y=9\) cm'
    answer: C
    hint: '\(x+y=18\), \(V=\dfrac{x^2y}{4\pi}\).'
    explanation: '\(V\propto x^2(18-x)\); \(V''=0\) gives \(x=12\).'
  141:
    topic: s4-5
    question: 'A right triangle with hypotenuse \(\sqrt3\) is revolved about one leg to make a cone. The cone of greatest volume has radius \(r\) and height \(h\):'
    A: '\(r=1\), \(h=\sqrt2\), \(V=\dfrac{\sqrt2\pi}{3}\)'
    B: '\(r=\sqrt2\), \(h=1\), \(V=\dfrac{2\pi}{3}\)'
    C: '\(r=\sqrt{3/2}\), \(h=\sqrt{3/2}\)'
    D: '\(r=\sqrt3\), \(h=0\)'
    answer: B
    hint: '\(r^2+h^2=3\) and \(V=\tfrac\pi3r^2h=\tfrac\pi3(3h-h^3)\).'
    explanation: '\(V''=0\) gives \(h=1\), \(r^2=2\).'
  142:
    topic: s4-5
    question: Jane is 2 mi offshore in a boat; she rows at 2 mph and walks at 5 mph to a village 6 mi down the shore from the nearest point. Where should she land to minimize time?
    A: 'at the nearest point (\(0\) mi)'
    B: 'directly at the village (\(6\) mi)'
    C: 'about \(0.87\) mi from the nearest point, toward the village'
    D: '\(3\) mi from the nearest point'
    answer: C
    hint: 'Time \(T(x)=\dfrac{\sqrt{4+x^2}}{2}+\dfrac{6-x}{5}\).'
    explanation: '\(T''=\dfrac{x}{2\sqrt{4+x^2}}-\dfrac15=0\) gives \(x=\tfrac{4}{\sqrt{21}}\approx0.873\).'
  143:
    topic: s4-5
    question: The 8-ft wall stands 27 ft from a building. The shortest straight beam that reaches the building from the ground outside the wall has length
    A: '\(13\sqrt{13}\) ft \(\approx46.9\) ft'
    B: '\(35\) ft'
    C: '\(8\sqrt{13}\) ft'
    D: '\(27\) ft'
    answer: A
    hint: '\(L=\dfrac{8}{\sin\theta}+\dfrac{27}{\cos\theta}\); set \(L''=0\), giving \(\tan^3\theta=\tfrac{8}{27}\).'
    explanation: '\(\tan\theta=\tfrac23\); \(L=(8^{2/3}+27^{2/3})^{3/2}=(4+9)^{3/2}=13\sqrt{13}\).'
  144:
    topic: s4-5
    question: "Fermat's principle says light travels along the path of least time. Reflecting off a plane mirror, this implies"
    A: the angle of incidence equals the angle of reflection
    B: the ray follows the shortest vertical path
    C: the angle of incidence is twice the angle of reflection
    D: the ray bends toward the normal
    answer: A
    hint: 'Minimize the total path \(A\to\) mirror \(\to B\).'
    explanation: 'Setting the derivative of the travel time to 0 gives \(\theta_1=\theta_2\).'
  145:
    topic: s4-5
    question: 'The rate of an autocatalytic reaction is \(v=kx(a-x)\). It is greatest when \(x=\)'
    A: '\(0\)'
    B: '\(\dfrac a2\)'
    C: '\(\dfrac a4\)'
    D: '\(a\)'
    answer: B
    hint: '\(v''=k(a-2x)\).'
    explanation: 'The maximum rate is \(ka^2/4\).'
  146:
    topic: s4-5
    question: 'The average flow velocity in the trachea is \(v=c(r_0-r)r^2\) for \(\tfrac{r_0}2\le r\le r_0\). It is greatest at \(r=\)'
    A: '\(r_0\)'
    B: '\(\dfrac{r_0}{2}\)'
    C: '\(\dfrac23r_0\)'
    D: '\(\dfrac34r_0\)'
    answer: C
    hint: '\(v''=c(2r_0r-3r^2)=0\).'
    explanation: '\(r=\tfrac23r_0\): the trachea is about 33% contracted.'
  147:
    topic: s4-5
    question: To make the average cost per item smallest, the production level must be where
    A: average cost is zero
    B: fixed cost equals variable cost
    C: marginal cost is zero
    D: average cost equals marginal cost
    answer: D
    hint: 'Minimize \(\dfrac{c(x)}{x}\).'
    explanation: '\(\dfrac{d}{dx}\dfrac{c}{x}=\dfrac{xc''-c}{x^2}=0\) means \(c''=c/x\).'
  148:
    topic: s4-5
    question: 'If \(r(x)=6x\) and \(c(x)=x^3-6x^2+15x\), the best you can do is'
    A: 'a profit of \(10\) at \(x=3\)'
    B: 'a loss at every \(x>0\)'
    C: a profit that grows without bound
    D: 'break even at \(x=0\) and \(x=3\) (revenue equals cost)'
    answer: D
    hint: 'Profit \(p=r-c=-x^3+6x^2-9x=-x(x-3)^2\).'
    explanation: '\(p\le0\) for \(x\ge0\), with \(p=0\) at \(x=0\) and \(x=3\).'
  149:
    topic: s4-5
    question: 'A tour service charges \$200 per person for 50 people, reduced by \$2 per person for each extra person (up to 80 people). Fixed costs are \$6000 and each person costs \$32. How many people maximize profit?'
    A: '\(50\)'
    B: '\(59\)'
    C: '\(80\)'
    D: '\(67\)'
    answer: D
    hint: 'With \(n\) people, the price per person is \(200-2(n-50)=300-2n\), so the profit is \(n(300-2n)-6000-32n\).'
    explanation: '\(P=-2n^2+268n-6000\), so \(P''=268-4n=0\) gives \(n=67\), which is within the allowed range of 50 to 80.'
  150:
    topic: s4-5
    question: 'The Wilson lot size formula minimizes \(A(q)=\dfrac{km}{q}+cm+\dfrac{hq}{2}\). The optimal order quantity is'
    A: '\(q=\dfrac{2km}{h}\)'
    B: '\(q=\sqrt{\dfrac{h}{2km}}\)'
    C: '\(q=\sqrt{\dfrac{km}{2h}}\)'
    D: '\(q=\sqrt{\dfrac{2km}{h}}\)'
    answer: D
    hint: 'Solve \(A''(q)=-\dfrac{km}{q^2}+\dfrac h2=0\).'
    explanation: '\(q^2=\dfrac{2km}{h}\). Since \(A''''>0\), this is a minimum.'
  151:
    topic: s4-5
    question: 'How close does the curve \(y=\sqrt x\) come to the point \((\tfrac32,0)\)?'
    A: '\(\dfrac{\sqrt5}{2}\)'
    B: '\(\dfrac{\sqrt3}{2}\)'
    C: '\(\dfrac32\)'
    D: '\(\dfrac{\sqrt2}{2}\)'
    answer: A
    hint: 'Minimize the square of the distance, \(D=(x-\tfrac32)^2+x\).'
    explanation: '\(D''=2x-3+1=0\) gives \(x=1\), so \(D=\tfrac14+1=\tfrac54\) and the distance is \(\tfrac{\sqrt5}{2}\).'
  152:
    topic: s4-5
    question: 'The function \(f(x)=3+4\cos x+\cos2x\) is never negative because'
    A: 'its minimum value is \(-1\)'
    B: it is increasing
    C: 'its minimum value on \([0,2\pi]\) is \(0\)'
    D: its minimum is 3
    answer: C
    hint: '\(f''=-4\sin x-2\sin2x=-4\sin x(1+\cos x)\).'
    explanation: 'The minimum \(f(\pi)=3-4+1=0\); also \(f=2(1+\cos x)^2\).'
  153:
    topic: s4-5
    question: 'A trough''s cross-section is an isosceles trapezoid with a 1-ft base and two 1-ft legs, each tilted outward by angle \(\theta\) from the vertical (\(\theta=0\) is a rectangle). The area is largest when \(\theta=\)'
    A: '\(\dfrac{\pi}{2}\)'
    B: '\(\dfrac\pi3\)'
    C: '\(\dfrac\pi4\)'
    D: '\(\dfrac\pi6\)'
    answer: D
    hint: 'The height is \(\cos\theta\) and the top width is \(1+2\sin\theta\), so \(A=(1+\sin\theta)\cos\theta\).'
    explanation: '\(A''=\cos^2\theta-\sin\theta-\sin^2\theta=1-\sin\theta-2\sin^2\theta=0\) gives \(\sin\theta=\tfrac12\).'
  154:
    topic: s4-5
    question: 'The stiffness \(S\) of a beam is proportional to width times the cube of the depth. From a 12-in.-diameter log, the stiffest beam has width \(w\) and depth \(d\):'
    A: '\(w=6\) in., \(d=6\sqrt3\) in.'
    B: '\(w=6\sqrt3\) in., \(d=6\) in.'
    C: '\(w=4\) in., \(d=\sqrt{128}\) in.'
    D: '\(w=6\sqrt2\) in., \(d=6\sqrt2\) in.'
    answer: A
    hint: '\(d^2=144-w^2\), so \(S=w(144-w^2)^{3/2}\).'
    explanation: '\(S''=0\) gives \(144-4w^2=0\), \(w=6\). (The strongest beam, with \(S=wd^2\), has \(w=4\sqrt3\) and \(d=4\sqrt6\).)'
  155:
    topic: s4-5
    question: 'The strength \(S\) of a rectangular beam is proportional to width times the square of its depth. From a 12-in.-diameter log, the strongest beam has width'
    A: '\(6\) in.'
    B: '\(6\sqrt2\) in.'
    C: '\(4\sqrt6\) in.'
    D: '\(4\sqrt3\) in.'
    answer: D
    hint: '\(S=wd^2=w(144-w^2)\).'
    explanation: '\(S''=144-3w^2=0\) gives \(w=4\sqrt3\), and \(d=4\sqrt6\).'
  156:
    topic: s4-5
    question: 'Where is the sum \(\tfrac{x}{2}+\dfrac{2}{x}\) (for \(x>0\)) smallest?'
    A: 'at \(x=2\), where it equals \(2\)'
    B: 'at \(x=1\)'
    C: it has no minimum
    D: 'at \(x=4\)'
    answer: A
    hint: '\(f''=\tfrac12-\tfrac2{x^2}\).'
    explanation: '\(x=2\) gives \(1+1=2\).'
  157:
    topic: s4-5
    question: A cylinder is inscribed in a sphere of radius 10 cm. The maximum volume of the cylinder is
    A: '\(\dfrac{4000\pi}{3\sqrt3}\) cm\(^3\)\(\approx2418\) cm\(^3\)'
    B: '\(\dfrac{4000\pi}{3}\) cm\(^3\)'
    C: '\(1000\pi\) cm\(^3\)'
    D: '\(\dfrac{2000\pi}{\sqrt3}\) cm\(^3\)'
    answer: A
    hint: 'With height \(h\) and radius \(r\): \(r^2=100-h^2/4\), so \(V=\pi h(100-h^2/4)\).'
    explanation: '\(V''=0\) gives \(h=\dfrac{20}{\sqrt3}\), and \(V=\dfrac{4000\pi}{3\sqrt3}\).'
  158:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 2} \frac{x - 2}{x^{2} - 4}\).'
    A: '\(\frac{1}{2}\)'
    B: '\(- \frac{1}{4}\)'
    C: does not exist
    D: '\(\frac{1}{4}\)'
    answer: D
    hint: 'This is \(\tfrac00\); differentiate numerator and denominator.'
    explanation: '\(\dfrac{1}{2x}\to\dfrac14\).'
  159:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} \frac{\sin{\left(5 x \right)}}{x}\).'
    A: '\(-5\)'
    B: does not exist
    C: '\(10\)'
    D: '\(5\)'
    answer: D
    hint: '\(\tfrac00\) form.'
    explanation: '\(\dfrac{5\cos5x}{1}\to5\).'
  160:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} \frac{5 x^{2} - 3 x}{7 x^{2} + 1}\).'
    A: '\(\frac{5}{7}\)'
    B: '\(- \frac{5}{7}\)'
    C: does not exist
    D: '\(\frac{10}{7}\)'
    answer: A
    hint: '\(\tfrac\infty\infty\) form; differentiate twice if needed.'
    explanation: 'The ratio of leading coefficients is \(\tfrac57\).'
  161:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 1} \frac{x^{3} - 1}{4 x^{3} - x - 3}\).'
    A: '\(- \frac{3}{11}\)'
    B: does not exist
    C: '\(\frac{3}{11}\)'
    D: '\(\frac{6}{11}\)'
    answer: C
    hint: '\(\tfrac00\) form.'
    explanation: '\(\dfrac{3x^2}{12x^2-1}\to\dfrac{3}{11}\).'
  162:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} \frac{1 - \cos{\left(x \right)}}{x^{2}}\).'
    A: '\(1\)'
    B: does not exist
    C: '\(- \frac{1}{2}\)'
    D: '\(\frac{1}{2}\)'
    answer: D
    hint: "Apply L'Hôpital twice."
    explanation: '\(\dfrac{\sin x}{2x}\to\dfrac{\cos x}{2}\to\dfrac12\).'
  163:
    topic: s4-6
    question: 'Evaluate \(\lim_{t\to -3} \frac{t^{3} - 4 t + 15}{t^{2} - t - 12}\).'
    A: '\(\frac{23}{7}\)'
    B: '\(- \frac{46}{7}\)'
    C: does not exist
    D: '\(- \frac{23}{7}\)'
    answer: D
    hint: '\(\tfrac00\) form at \(t=-3\).'
    explanation: '\(\dfrac{3t^2-4}{2t-1}\to\dfrac{23}{-7}=-\dfrac{23}{7}\).'
  164:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} \frac{5 x^{3} - 2 x}{7 x^{3} + 3}\).'
    A: '\(- \frac{5}{7}\)'
    B: '\(\frac{5}{7}\)'
    C: does not exist
    D: '\(\frac{10}{7}\)'
    answer: B
    hint: Same degree.
    explanation: 'The limit is \(\tfrac57\).'
  165:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} \frac{- x + \sin{\left(x \right)}}{x^{3}}\).'
    A: '\(\frac{1}{6}\)'
    B: does not exist
    C: '\(- \frac{1}{6}\)'
    D: '\(- \frac{1}{3}\)'
    answer: C
    hint: "Apply L'Hôpital three times."
    explanation: '\(\dfrac{\cos x-1}{3x^2}\to\dfrac{-\sin x}{6x}\to\dfrac{-\cos x}{6}\to-\dfrac16\).'
  166:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 1} \frac{x - 1}{\ln{\left(x \right)}}\).'
    A: '\(2\)'
    B: '\(-1\)'
    C: does not exist
    D: '\(1\)'
    answer: D
    hint: '\(\tfrac00\) form.'
    explanation: '\(\dfrac{1}{1/x}=x\to1\).'
  167:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} \frac{x^{2}}{\ln{\left(\sec{\left(x \right)} \right)}}\).'
    A: '\(-2\)'
    B: does not exist
    C: '\(4\)'
    D: '\(2\)'
    answer: D
    hint: '\(\tfrac00\); \(\dfrac{d}{dx}\ln\sec x=\tan x\).'
    explanation: '\(\dfrac{2x}{\tan x}\to2\).'
  168:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} \frac{3^{x} - 1}{x}\).'
    A: '\(3\)'
    B: '\(\frac{\ln{\left(3 \right)}}{2}\)'
    C: '\(1\)'
    D: '\(\ln{\left(3 \right)}\)'
    answer: D
    hint: '\(\dfrac{d}{dx}3^x=3^x\ln3\).'
    explanation: 'The limit is \(\ln3\).'
  169:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} \frac{2^{x} x}{2^{x} - 1}\).'
    A: '\(1\)'
    B: '\(\frac{1}{\ln{\left(2 \right)}}\)'
    C: '\(2\)'
    D: '\(\ln{\left(2 \right)}\)'
    answer: B
    hint: 'Apply L''Hôpital to \(\dfrac{x}{2^x-1}\).'
    explanation: 'Since \(2^x-1\approx x\ln2\), the quotient \(\dfrac{x\,2^x}{2^x-1}\to\dfrac{1}{\ln2}\).'
  170:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} \frac{\ln{\left(x + 1 \right)}}{\ln{\left(x \right)}}\).'
    A: '\(1\)'
    B: does not exist
    C: '\(-1\)'
    D: '\(2\)'
    answer: A
    hint: '\(\tfrac\infty\infty\) form.'
    explanation: '\(\dfrac{1/(x+1)}{1/x}=\dfrac{x}{x+1}\to1\).'
  171:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0^{+}} x \ln{\left(x \right)}\).'
    A: '\(1\)'
    B: '\(-1\)'
    C: '\(0\)'
    D: does not exist
    answer: C
    hint: 'This is \(0\cdot(-\infty)\). Rewrite as \(\dfrac{\ln x}{1/x}\).'
    explanation: '\(\dfrac{1/x}{-1/x^2}=-x\to0\).'
  172:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} x^{2} e^{- x}\).'
    A: '\(\infty\)'
    B: '\(0\)'
    C: '\(1\)'
    D: '\(e\)'
    answer: B
    hint: 'Not indeterminate as \(x\to0\): substitute.'
    explanation: '\(0\cdot1=0\).'
  173:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} x^{2} e^{- x}\).'
    A: '\(0\)'
    B: '\(1\)'
    C: does not exist
    D: '\(-1\)'
    answer: A
