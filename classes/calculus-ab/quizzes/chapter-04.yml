  103:
    topic: s4-4
    question: 'If \(f''(c)=0\) and \(f''''(c)<0\), then \(f\) has at \(x=c\)'
    A: an inflection point
    B: a local maximum
    C: no information
    D: a local minimum
    answer: B
    hint: Second Derivative Test.
    explanation: Concave down at a critical point means a peak.
  104:
    topic: s4-4
    question: 'If \(f''(c)=0\) and \(f''''(c)>0\), then \(f\) has at \(x=c\)'
    A: no information
    B: a local minimum
    C: an inflection point
    D: a local maximum
    answer: B
    hint: Second Derivative Test.
    explanation: Concave up at a critical point means a valley.
  105:
    topic: s4-4
    question: 'If \(f''(c)=0\) and \(f''''(c)=0\), the Second Derivative Test'
    A: shows an inflection point
    B: is inconclusive
    C: shows a local maximum
    D: shows a local minimum
    answer: B
    hint: 'Consider \(x^3\), \(x^4\) and \(-x^4\) at 0.'
    explanation: 'All three have \(f''=f''''=0\) at 0, with different behavior.'
  106:
    topic: s4-4
    question: A point of inflection is a point where
    A: '\(f''=0\)'
    B: the concavity of the graph changes
    C: '\(f''''\) exists'
    D: '\(f\) has a local extremum'
    answer: B
    hint: 'Think "sign change of \(f''''\)".'
    explanation: '\(f''''(c)=0\) alone is not enough (\(y=x^4\) at 0).'
  107:
    topic: s4-4
    question: 'Is it true that the concavity of a twice-differentiable \(f\) changes every time \(f''''(x)=0\)?'
    A: Only for cubics
    B: Only for even functions
    C: Yes, always
    D: 'No: \(y=x^4\) has \(f''''(0)=0\) but is concave up on both sides'
    answer: D
    hint: 'A sign change of \(f''''\) is needed.'
    explanation: '\(12x^2\) does not change sign at 0.'
  108:
    topic: s4-4
    question: 'What can be said about the inflection points of a quadratic \(y=ax^2+bx+c\), \(a\ne0\)?'
    A: 'There are none, since \(y''''=2a\) never changes sign'
    B: There is exactly one, at the vertex
    C: There are infinitely many
    D: There are two
    answer: A
    hint: 'Compute \(y''''\).'
    explanation: A parabola has constant concavity.
  109:
    topic: s4-4
    question: 'What can be said about the inflection points of a cubic \(y=ax^3+bx^2+cx+d\), \(a\ne0\)?'
    A: 'It depends on \(c\)'
    B: There are none
    C: 'There is exactly one, at \(x=-\dfrac{b}{3a}\)'
    D: There are two
    answer: C
    hint: '\(y''''=6ax+2b\) is linear.'
    explanation: A line with nonzero slope changes sign exactly once.
  110:
    topic: s4-4
    question: 'For what value of \(b\) does \(y=x^3+bx^2+cx+d\) have an inflection point at \(x=1\)?'
    A: '\(b=3\)'
    B: '\(b=-1\)'
    C: '\(b=-\tfrac13\)'
    D: '\(b=-3\)'
    answer: D
    hint: '\(y''''=6x+2b=0\) at \(x=1\).'
    explanation: '\(6+2b=0\).'
  111:
    topic: s4-4
    question: 'The function \(y=\sin|x|\) on \([-2\pi,2\pi]\) at \(x=0\) has'
    A: a local maximum
    B: 'a smooth minimum with \(y''=0\)'
    C: an inflection point
    D: a corner (not differentiable), and a local minimum
    answer: D
    hint: Compare the one-sided slopes at 0.
    explanation: 'The slope is \(-1\) on the left and \(+1\) on the right: a V-shaped corner.'
  112:
    topic: s4-4
    question: 'A curve is concave up and decreasing on an interval. The signs of \(y''\) and \(y''''\) are'
    A: '\(y''<0\) and \(y''''<0\)'
    B: '\(y''>0\) and \(y''''<0\)'
    C: '\(y''<0\) and \(y''''>0\)'
    D: '\(y''>0\) and \(y''''>0\)'
    answer: C
    hint: Decreasing means negative slope; concave up means the slope is increasing.
    explanation: The negative slope is rising toward 0.
  113:
    topic: s4-4
    question: 'A cost function \(c=f(x)\) has an inflection point at the level where marginal cost changes from decreasing to increasing. This happens where'
    A: '\(f''(x)=0\)'
    B: '\(f(x)\) is largest'
    C: '\(f''''\) goes from positive to negative'
    D: '\(f''''(x)=0\) with \(f''''\) going from negative to positive'
    answer: D
    hint: 'Marginal cost is \(f''\).'
    explanation: 'Marginal cost decreasing means \(f''''<0\); increasing means \(f''''>0\).'
  114:
    topic: s4-4
    question: 'Given \(y''=(x-1)^2(x-2)\), at what points does \(y\) have a local minimum, local maximum, or inflection point?'
    A: 'a local maximum at \(x=2\); inflection at \(x=1\) only'
    B: 'a local minimum at \(x=2\); inflection points at \(x=1\) and \(x=\tfrac53\)'
    C: 'a local minimum at \(x=1\); inflection at \(x=2\)'
    D: 'a local minimum at \(x=2\) only'
    answer: B
