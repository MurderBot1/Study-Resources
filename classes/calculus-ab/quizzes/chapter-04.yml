    question: 'Identify the local extreme values of \(f(x)=x^{4} - 8 x^{2} + 16\) and where they occur.'
    A: '\(\text{local max } 0 \text{ at } x=-2,\ \text{local min } 16 \text{ at } x=0,\ \text{local max } 0 \text{ at } x=2\)'
    B: '\(\text{local min } 0 \text{ at } x=2,\ \text{local max } 16 \text{ at } x=0,\ \text{local min } 0 \text{ at } x=-2\)'
    C: '\(\text{local min } 0 \text{ at } x=-2\)'
    D: '\(\text{local min } 0 \text{ at } x=-2,\ \text{local max } 16 \text{ at } x=0,\ \text{local min } 0 \text{ at } x=2\)'
    answer: D
    hint: 'Use the First Derivative Test: \(f''(x)=4 x^{3} - 16 x\).'
    explanation: 'The sign of \(f''\) changes at \(x=-2\), \(x=0\), \(x=2\). A change from \(+\) to \(-\) is a local maximum; from \(-\) to \(+\) a local minimum.'
  76:
