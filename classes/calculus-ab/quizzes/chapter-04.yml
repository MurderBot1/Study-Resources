    explanation: '\(y''\) goes \(-\) to \(+\) at \(x=2\) (min); \(y''''\) changes sign at \(1\) and \(\tfrac53\).'
  115:
    topic: s4-4
    question: 'Given \(y''=x^2(2-x)\), the function \(y\) has'
    A: 'a local maximum at \(x=2\) and an inflection point at \(x=0\)'
    B: 'a local minimum at \(x=2\)'
