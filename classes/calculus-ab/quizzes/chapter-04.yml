    A: '\(-x+C\)'
    B: '\(x+2+C\)'
    C: '\(-x-2+C\)'
    D: '\(-1+C\)'
    answer: A
    hint: '\(g(x)=1\).'
    explanation: '\(\int(-1)\,dx=-x+C\).'
  249:
    topic: s4-8
    question: 'A body moving along the \(s\)-axis has velocity \(\dfrac{ds}{dt}=9.8t-3\). Its displacement from \(t=1\) to \(t=3\) is'
    A: '\(26.4\) m'
    B: '\(35.2\) m'
    C: 'it cannot be found without \(s(0)\)'
    D: '\(33.2\) m (regardless of \(s(0)\))'
    answer: D
    hint: 'Displacement \(=s(3)-s(1)\); the constant of integration cancels.'
    explanation: '\(s=4.9t^2-3t+C\), so \(s(3)-s(1)=(44.1-9)-(4.9-3)=35.1-1.9=33.2\).'
