    B: 'Right if \(C=0\)'
    C: 'Wrong: the answer should be \(-\cos x+C\)'
    D: Right
    answer: A
    hint: Differentiate the proposed answer with the product rule.
    explanation: 'The extra term \(\tfrac{x^2}{2}\cos x\) means this is not an antiderivative. The correct one is \(-x\cos x+\sin x+C\).'
