    B: 'Yes: it is continuous on \([0,1]\) and differentiable on \((0,1)\)'
    C: 'No: \(f\) is not defined on \([0,1]\)'
    D: 'No: it is not continuous at \(x=1\)'
    answer: B
    hint: Check endpoint continuity and the open-interval derivative.
    explanation: 'The graph is a semicircle of radius \(\tfrac12\). The vertical tangents at the endpoints are allowed.'
  45:
    topic: s4-2
    question: 'The function \(f(x)=\begin{cases}x,&0\le x<1\\ 0,&x=1\end{cases}\) is zero at \(x=0\) and \(x=1\) and differentiable on \((0,1)\), but \(f''\) is never zero. Why does this not contradict Rolle''s Theorem?'
    A: '\(f\) is not differentiable on \((0,1)\)'
    B: '\(f\) is not continuous at \(x=1\)'
    C: 'Rolle''s Theorem requires \(f(0)\ne f(1)\)'
    D: '\(f\) is not defined at 0'
    answer: B
    hint: "Rolle's Theorem requires continuity on the closed interval."
    explanation: '\(\lim_{x\to1^-}f(x)=1\ne f(1)=0\), so the hypotheses fail at the right endpoint.'
  46:
    topic: s4-2
    question: 'For what values of \(a\), \(m\), and \(b\) does \(f(x)=\begin{cases}3,&x=0\\ -x^2+3x+a,&0<x<1\\ mx+b,&1\le x\le2\end{cases}\) satisfy the hypotheses of the MVT on \([0,2]\)?'
    A: '\(a=3\), \(m=1\), \(b=2\)'
    B: '\(a=3\), \(m=-1\), \(b=6\)'
    C: '\(a=3\), \(m=1\), \(b=4\)'
    D: '\(a=0\), \(m=1\), \(b=4\)'
    answer: C
    hint: "The function must be continuous at 0 and 1 and differentiable at 1: match values, then slopes."
    explanation: 'Continuity at 0: \(a=3\). Continuity at 1: \(-1+3+3=5=m+b\). Slopes at 1: \(-2+3=1=m\). So \(m=1\) and \(b=4\).'
