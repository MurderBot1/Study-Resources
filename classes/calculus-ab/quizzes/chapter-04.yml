    B: '\(F(x)-f(x)\) is constant on that interval'
    C: '\(F=-f\)'
    D: '\(F=f\)'
    answer: B
    hint: Apply the Mean Value Theorem to the difference.
    explanation: 'That is why every antiderivative has the form \(F(x)+C\).'
  246:
    topic: s4-8
    question: 'If two differentiable functions \(F\) and \(G\) solve \(\dfrac{dy}{dx}=f(x)\), \(y(x_0)=y_0\), on an interval, then'
