    C: at most three
    D: none
    answer: A
    hint: '\(f''\) is increasing, so it can vanish at most once.'
    explanation: 'If \(f\) had three zeros, Rolle''s Theorem gives two zeros of \(f''\) and then one of \(f''''\), contradicting \(f''''>0\).'
  69:
