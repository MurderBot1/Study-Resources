    explanation: 'Applying L''Hôpital twice gives \(\dfrac{2}{e^x}\to0\).'
  174:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} \frac{\ln{\left(x \right)}^{2}}{x}\).'
    A: '\(0\)'
    B: does not exist
    C: '\(-1\)'
    D: '\(1\)'
    answer: A
