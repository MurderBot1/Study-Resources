# Chapter 4: Applications of Derivatives
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 4.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 4: Applications of Derivatives"
description: "Extreme values, the Mean Value Theorem, monotonicity, concavity, optimization, L'Hôpital's Rule, Newton's method, and antiderivatives."
topics:
  s4-1:
    title: 4.1 Extreme Values of Functions
  s4-2:
    title: 4.2 The Mean Value Theorem
  s4-3:
    title: 4.3 Monotonic Functions and the First Derivative Test
  s4-4:
    title: 4.4 Concavity and Curve Sketching
  s4-5:
    title: 4.5 Applied Optimization Problems
  s4-6:
    title: "4.6 Indeterminate Forms and L'Hôpital's Rule"
  s4-7:
    title: "4.7 Newton's Method"
  s4-8:
    title: 4.8 Antiderivatives
questions:
  1:
    topic: s4-1
    question: 'A function \(f\) is continuous on the closed interval \([a,b]\). Which statement must be true?'
    A: '\(f\) is differentiable on \((a,b)\)'
    B: '\(f\) attains an absolute maximum and an absolute minimum on \([a,b]\)'
    C: '\(f\) attains its extreme values only at critical points'
    D: '\(f\) has a local maximum at an interior point'
    answer: B
    hint: This is the Extreme Value Theorem.
    explanation: A continuous function on a closed, bounded interval always achieves its absolute extrema, possibly at the endpoints.
  2:
    topic: s4-1
    question: 'Which function has an absolute maximum but no absolute minimum on \([-1,1]\)?'
    A: '\(y=|x|\)'
    B: '\(g(x)=\begin{cases}x^2,&x\ne0\\ 1,&x=0\end{cases}\)'
    C: '\(y=x^2\)'
    D: '\(y=\cos x\)'
    answer: B
    hint: The Extreme Value Theorem needs continuity. Look for a discontinuity that "hides" the lowest value.
    explanation: 'The values \(x^2\) come arbitrarily close to 0 but \(g(0)=1\), so the lowest value is never reached. The other three are continuous on \([-1,1]\).'
  3:
    topic: s4-1
    question: 'If \(f\) is differentiable at an interior local extreme point \(c\), then'
    A: '\(f''''(c)=0\)'
    B: '\(f''(c)\) does not exist'
    C: '\(f(c)=0\)'
    D: '\(f''(c)=0\)'
    answer: D
    hint: "This is Fermat's theorem about local extrema."
    explanation: At a smooth interior peak or valley, the tangent line is horizontal.
  4:
    topic: s4-1
    question: 'A number \(c\) in the domain of \(f\) is a critical point if'
    A: '\(f''(c)=0\) or \(f''(c)\) does not exist'
    B: '\(f''(c)=0\) only'
    C: '\(f(c)=0\)'
    D: '\(f''''(c)=0\)'
    answer: A
    hint: Corners and cusps count too.
    explanation: Interior extrema can only occur where the derivative is zero or fails to exist.
  5:
    topic: s4-1
    question: 'Does \(f(x)=|x|\) contradict Fermat''s theorem, since it has an absolute minimum at \(x=0\) but no derivative there?'
    A: 'Yes, because \(|x|\) is not continuous'
    B: 'Yes, because the minimum must have \(f''=0\)'
    C: 'No, because \(|x|\) has no minimum'
    D: 'No: the theorem only says extrema occur at points where \(f''=0\) or \(f''\) does not exist'
    answer: D
    hint: 'Is \(x=0\) a critical point?'
    explanation: 'Corners are critical points because \(f''\) fails to exist there.'
  6:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=\frac{2 x}{3} - 5\) on \([-2,3]\).'
    A: '\(\max=- \frac{19}{3} \text{ at } x=-2,\ \min=-3 \text{ at } x=3\)'
    B: '\(\max=-2 \text{ at } x=3,\ \min=- \frac{22}{3} \text{ at } x=-2\)'
    C: '\(\max=-3 \text{ at } x=3,\ \min=- \frac{19}{3} \text{ at } x=-2\)'
    D: '\(\max=-3 \text{ at } x=-2,\ \min=- \frac{19}{3} \text{ at } x=3\)'
    answer: C
    hint: A linear function is monotonic, so check the endpoints.
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(-3\) (at \(x=3\)) and the smallest is \(- \frac{19}{3}\) (at \(x=-2\)).'
  7:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=- x - 4\) on \([-4,1]\).'
    A: '\(\max=-5 \text{ at } x=1,\ \min=0 \text{ at } x=-4\)'
    B: '\(\max=1 \text{ at } x=-4,\ \min=-6 \text{ at } x=1\)'
    C: '\(\max=0 \text{ at } x=-4,\ \min=-5 \text{ at } x=1\)'
    D: '\(\max=0 \text{ at } x=1,\ \min=-5 \text{ at } x=-4\)'
    answer: C
    hint: The function is decreasing, so the maximum is at the left endpoint.
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(0\) (at \(x=-4\)) and the smallest is \(-5\) (at \(x=1\)).'
  8:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=x^{2} - 1\) on \([-1,2]\).'
    A: '\(\max=4 \text{ at } x=2,\ \min=-2 \text{ at } x=0\)'
    B: '\(\max=3 \text{ at } x=2,\ \min=-1 \text{ at } x=0\)'
    C: '\(\max=-1 \text{ at } x=0,\ \min=3 \text{ at } x=2\)'
    D: '\(\max=3 \text{ at } x=0,\ \min=-1 \text{ at } x=2\)'
    answer: B
    hint: Find the vertex and compare with the endpoints.
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(3\) (at \(x=2\)) and the smallest is \(-1\) (at \(x=0\)).'
  9:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=4 - x^{2}\) on \([-3,1]\).'
    A: '\(\max=4 \text{ at } x=0,\ \min=-5 \text{ at } x=-3\)'
    B: '\(\max=4 \text{ at } x=-3,\ \min=-5 \text{ at } x=0\)'
    C: '\(\max=5 \text{ at } x=0,\ \min=-6 \text{ at } x=-3\)'
    D: '\(\max=-5 \text{ at } x=-3,\ \min=4 \text{ at } x=0\)'
    answer: A
    hint: The vertex is the maximum; compare the endpoints for the minimum.
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(4\) (at \(x=0\)) and the smallest is \(-5\) (at \(x=-3\)).'
  10:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=- \frac{1}{x^{2}}\) on \([\frac{1}{2},2]\).'
    A: '\(\max=\frac{3}{4} \text{ at } x=2,\ \min=-5 \text{ at } x=\frac{1}{2}\)'
    B: '\(\max=-4 \text{ at } x=\frac{1}{2},\ \min=- \frac{1}{4} \text{ at } x=2\)'
    C: '\(\max=- \frac{1}{4} \text{ at } x=2,\ \min=-4 \text{ at } x=\frac{1}{2}\)'
    D: '\(\max=- \frac{1}{4} \text{ at } x=\frac{1}{2},\ \min=-4 \text{ at } x=2\)'
    answer: C
    hint: 'The function \(-1/x^2\) is increasing for \(x>0\).'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(- \frac{1}{4}\) (at \(x=2\)) and the smallest is \(-4\) (at \(x=\frac{1}{2}\)).'
  11:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=- \frac{1}{x}\) on \([-2,-1]\).'
    A: '\(\max=\frac{1}{2} \text{ at } x=-2,\ \min=1 \text{ at } x=-1\)'
    B: '\(\max=1 \text{ at } x=-1,\ \min=\frac{1}{2} \text{ at } x=-2\)'
    C: '\(\max=1 \text{ at } x=-2,\ \min=\frac{1}{2} \text{ at } x=-1\)'
    D: '\(\max=2 \text{ at } x=-1,\ \min=- \frac{1}{2} \text{ at } x=-2\)'
    answer: B
    hint: 'Differentiate: \(f''=1/x^2>0\).'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(1\) (at \(x=-1\)) and the smallest is \(\frac{1}{2}\) (at \(x=-2\)).'
  12:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=\sqrt[3]{x}\) on \([-1,8]\).'
    A: '\(\max=2 \text{ at } x=-1,\ \min=-1 \text{ at } x=8\)'
    B: '\(\max=3 \text{ at } x=8,\ \min=-2 \text{ at } x=-1\)'
    C: '\(\max=2 \text{ at } x=8,\ \min=-1 \text{ at } x=-1\)'
    D: '\(\max=-1 \text{ at } x=-1,\ \min=2 \text{ at } x=8\)'
    answer: C
    hint: The cube root is increasing.
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(2\) (at \(x=8\)) and the smallest is \(-1\) (at \(x=-1\)).'
  13:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=-3x^{2/3}\) on \([-1,8]\).'
    A: '\(\max=1 \text{ at } x=0,\ \min=-13 \text{ at } x=8\)'
    B: '\(\max=-12 \text{ at } x=8,\ \min=0 \text{ at } x=0\)'
    C: '\(\max=0 \text{ at } x=0,\ \min=-12 \text{ at } x=8\)'
    D: '\(\max=0 \text{ at } x=8,\ \min=-12 \text{ at } x=0\)'
    answer: C
    hint: '\(x^{2/3}\) has a cusp at 0; compare it with the endpoints.'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(0\) (at \(x=0\)) and the smallest is \(-12\) (at \(x=8\)).'
  14:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=\sqrt{4 - x^{2}}\) on \([-2,1]\).'
    A: '\(\max=3 \text{ at } x=0,\ \min=-1 \text{ at } x=-2\)'
    B: '\(\max=2 \text{ at } x=-2,\ \min=0 \text{ at } x=0\)'
    C: '\(\max=0 \text{ at } x=-2,\ \min=2 \text{ at } x=0\)'
    D: '\(\max=2 \text{ at } x=0,\ \min=0 \text{ at } x=-2\)'
    answer: D
    hint: 'The square root of the radicand is largest at \(x=0\).'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(2\) (at \(x=0\)) and the smallest is \(0\) (at \(x=-2\)).'
  15:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=\sin{\left(x \right)}\) on \([- \frac{\pi}{2},\frac{5 \pi}{6}]\).'
    A: '\(\max=1 \text{ at } x=\frac{\pi}{2},\ \min=-1 \text{ at } x=- \frac{\pi}{2}\)'
    B: '\(\max=1 \text{ at } x=- \frac{\pi}{2},\ \min=-1 \text{ at } x=\frac{\pi}{2}\)'
    C: '\(\max=2 \text{ at } x=\frac{\pi}{2},\ \min=-2 \text{ at } x=- \frac{\pi}{2}\)'
    D: '\(\max=-1 \text{ at } x=- \frac{\pi}{2},\ \min=1 \text{ at } x=\frac{\pi}{2}\)'
    answer: A
    hint: 'Where does \(\sin\) reach 1 and where is it smallest on this interval?'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(1\) (at \(x=\frac{\pi}{2}\)) and the smallest is \(-1\) (at \(x=- \frac{\pi}{2}\)).'
  16:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=2 - \left|{x}\right|\) on \([-1,3]\).'
    A: '\(\max=2 \text{ at } x=0,\ \min=-1 \text{ at } x=3\)'
    B: '\(\max=3 \text{ at } x=0,\ \min=-2 \text{ at } x=3\)'
    C: '\(\max=-1 \text{ at } x=3,\ \min=2 \text{ at } x=0\)'
    D: '\(\max=2 \text{ at } x=3,\ \min=-1 \text{ at } x=0\)'
    answer: A
    hint: 'The graph of \(2-|x|\) is an upside-down V.'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(2\) (at \(x=0\)) and the smallest is \(-1\) (at \(x=3\)).'
  17:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=\left|{x - 5}\right|\) on \([4,7]\).'
    A: '\(\max=2 \text{ at } x=5,\ \min=0 \text{ at } x=7\)'
    B: '\(\max=3 \text{ at } x=7,\ \min=-1 \text{ at } x=5\)'
    C: '\(\max=2 \text{ at } x=7,\ \min=0 \text{ at } x=5\)'
    D: '\(\max=0 \text{ at } x=5,\ \min=2 \text{ at } x=7\)'
    answer: C
    hint: The V-shaped graph has its vertex at 5.
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(2\) (at \(x=7\)) and the smallest is \(0\) (at \(x=5\)).'
  18:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=x e^{- x}\) on \([-1,1]\).'
    A: '\(\max=- e \text{ at } x=-1,\ \min=e^{-1} \text{ at } x=1\)'
    B: '\(\max=e^{-1} + 1 \text{ at } x=1,\ \min=- e - 1 \text{ at } x=-1\)'
    C: '\(\max=e^{-1} \text{ at } x=1,\ \min=- e \text{ at } x=-1\)'
    D: '\(\max=e^{-1} \text{ at } x=-1,\ \min=- e \text{ at } x=1\)'
    answer: C
    hint: '\(f''=e^{-x}(1-x)\).'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(e^{-1}\) (at \(x=1\)) and the smallest is \(- e\) (at \(x=-1\)).'
  19:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=\ln{\left(x \right)} + \frac{1}{x}\) on \([\frac{1}{2},4]\).'
    A: '\(\max=\frac{5}{4} + \ln{\left(4 \right)} \text{ at } x=4,\ \min=0 \text{ at } x=1\)'
    B: '\(\max=\frac{1}{4} + \ln{\left(4 \right)} \text{ at } x=1,\ \min=1 \text{ at } x=4\)'
    C: '\(\max=1 \text{ at } x=1,\ \min=\frac{1}{4} + \ln{\left(4 \right)} \text{ at } x=4\)'
    D: '\(\max=\frac{1}{4} + \ln{\left(4 \right)} \text{ at } x=4,\ \min=1 \text{ at } x=1\)'
    answer: D
    hint: 'Set \(f''=-1/x^2+1/x=0\).'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(\frac{1}{4} + \ln{\left(4 \right)}\) (at \(x=4\)) and the smallest is \(1\) (at \(x=1\)).'
  20:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=e^{- x^{2}}\) on \([-2,1]\).'
    A: '\(\max=1 \text{ at } x=0,\ \min=e^{-4} \text{ at } x=-2\)'
    B: '\(\max=e^{-4} \text{ at } x=-2,\ \min=1 \text{ at } x=0\)'
    C: '\(\max=1 \text{ at } x=-2,\ \min=e^{-4} \text{ at } x=0\)'
    D: '\(\max=2 \text{ at } x=0,\ \min=-1 + e^{-4} \text{ at } x=-2\)'
    answer: A
    hint: '\(e^{-x^2}\) is largest where the exponent is largest.'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(1\) (at \(x=0\)) and the smallest is \(e^{-4}\) (at \(x=-2\)).'
  21:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=2 x^{2} - 8 x + 9\) on \([-5,5]\).'
    A: '\(\max=100 \text{ at } x=-5,\ \min=0 \text{ at } x=2\)'
    B: '\(\max=99 \text{ at } x=-5,\ \min=1 \text{ at } x=2\)'
    C: '\(\max=99 \text{ at } x=2,\ \min=1 \text{ at } x=-5\)'
    D: '\(\max=1 \text{ at } x=2,\ \min=99 \text{ at } x=-5\)'
    answer: B
    hint: 'The parabola opens upward; its vertex is at \(x=2\).'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(99\) (at \(x=-5\)) and the smallest is \(1\) (at \(x=2\)).'
  22:
    topic: s4-1
    question: 'Find the absolute maximum and minimum of \(f(x)=x^{3} - 3 x^{2} + 3 x - 2\) on \([-2,3]\).'
    A: '\(\max=7 \text{ at } x=-2,\ \min=-28 \text{ at } x=3\)'
    B: '\(\max=8 \text{ at } x=3,\ \min=-29 \text{ at } x=-2\)'
    C: '\(\max=-28 \text{ at } x=-2,\ \min=7 \text{ at } x=3\)'
    D: '\(\max=7 \text{ at } x=3,\ \min=-28 \text{ at } x=-2\)'
    answer: D
    hint: 'Check the derivative: \(3(x-1)^2\ge0\), so the function never decreases.'
    explanation: 'Compare \(f\) at the critical points and endpoints: the largest value is \(7\) (at \(x=3\)) and the smallest is \(-28\) (at \(x=-2\)).'
  23:
    topic: s4-1
    question: 'The function \(y=x^3+x^2-8x+5\) has local extrema at \(x=\) (find the critical points of its derivative)'
    A: '\(x=-2\) and \(x=-\tfrac43\)'
    B: '\(x=-2\) and \(x=\tfrac43\)'
    C: '\(x=2\) and \(x=-\tfrac43\)'
    D: '\(x=0\) only'
    answer: B
    hint: 'Solve \(3x^2+2x-8=0\).'
    explanation: '\((3x-4)(x+2)=0\).'
  24:
    topic: s4-1
    question: 'The function \(y=x^3-3x^2+3x-2\) has'
    A: 'a critical point at \(x=1\) but no local extremum there'
    B: no critical points
    C: 'a local maximum at \(x=1\)'
    D: 'a local minimum at \(x=1\)'
    answer: A
    hint: '\(y''=3(x-1)^2\) does not change sign.'
    explanation: 'The derivative is zero at 1 but stays nonnegative on both sides, so \(x=1\) is an inflection point, not an extremum.'
  25:
    topic: s4-1
    question: 'At the critical point \(x=2\) of \(f(x)=(x-2)^{2/3}\), which statement is true?'
    A: '\(f\) has a local maximum at \(x=2\)'
    B: '\(f''(2)\) does not exist, yet \(f\) has a local (and absolute) minimum at \(x=2\)'
    C: '\(f\) has no local extremum at \(x=2\)'
    D: '\(f''(2)=0\)'
    answer: B
    hint: '\(f''=\tfrac23(x-2)^{-1/3}\) blows up at 2, while \(f\ge0=f(2)\).'
    explanation: 'The graph has a cusp at \(x=2\). This does not contradict the Extreme Value Theorem, which does not say a derivative must exist.'
  26:
    topic: s4-1
    question: 'What are the local extrema of \(y=x^{2/3}(x+2)\)?'
    A: 'a local minimum at \(x=-\tfrac45\) and a local maximum at \(x=0\)'
    B: 'only a maximum at \(x=-\tfrac45\)'
    C: 'only a minimum at \(x=0\)'
    D: 'a local maximum at \(x=-\tfrac45\) and a local minimum at \(x=0\)'
    answer: D
    hint: 'Expand to \(y=x^{5/3}+2x^{2/3}\); then \(y''=\dfrac{5x+4}{3x^{1/3}}\).'
    explanation: 'The critical points are \(x=-\tfrac45\) (\(y''=0\)) and \(x=0\) (\(y''\) undefined). \(y''\) goes \(+,-,+\) across them.'
  27:
    topic: s4-1
    question: 'A continuous function \(f\) on \([-1,1]\) has \(f(-1)=-1\) and an interior corner at the origin. The Extreme Value Theorem guarantees'
    A: no absolute extrema because the derivative fails at 0
    B: both an absolute maximum and an absolute minimum, even if they occur at the corner or at the endpoints
    C: 'extrema only at critical points where \(f''=0\)'
    D: only an absolute maximum
    answer: B
    hint: Continuity on a closed interval is all the theorem needs.
    explanation: Differentiability is not required for existence of the extrema.
  28:
    topic: s4-1
    question: 'An even function \(f\) has a local maximum at \(x=c\). What can be said about \(x=-c\)?'
    A: nothing
    B: '\(f(-c)=0\)'
    C: '\(f\) has a local minimum at \(x=-c\)'
    D: '\(f\) also has a local maximum at \(x=-c\)'
    answer: D
    hint: 'An even function is symmetric about the \(y\)-axis.'
    explanation: 'Reflecting the graph across the \(y\)-axis carries a local maximum to a local maximum. (For an odd function a local minimum at \(c\) gives a local maximum at \(-c\).)'
  29:
    topic: s4-1
    question: 'An odd function \(g\) has a local minimum at \(x=c\). What can be said about \(x=-c\)?'
    A: nothing
    B: '\(g\) has a local maximum at \(-c\)'
    C: '\(g\) has a local minimum at \(-c\)'
    D: '\(g(-c)=g(c)\)'
    answer: B
    hint: '\(g(-x)=-g(x)\) flips the graph upside down.'
    explanation: Odd symmetry is symmetry through the origin, which turns valleys into hills.
  30:
    topic: s4-1
    question: 'The Extreme Value Theorem can fail on an open interval. Which function has neither an absolute maximum nor an absolute minimum on \((0,1)\)?'
    A: '\(f(x)=\sin(\pi x)\)'
    B: '\(f(x)=1\)'
    C: '\(f(x)=x^2-x\)'
    D: '\(f(x)=x\)'
    answer: D
    hint: 'The extreme values of \(f(x)=x\) on \([0,1]\) occur at the endpoints, which are excluded.'
    explanation: 'On \((0,1)\), \(x\) takes every value strictly between 0 and 1 but neither 0 nor 1.'
  31:
    topic: s4-1
    question: Which of these has an absolute maximum value but no absolute minimum on its domain?
    A: '\(f(x)=-x^2\) on \((-\infty,\infty)\)'
    B: '\(f(x)=x^2\) on \([0,1]\)'
    C: '\(f(x)=\cos x\) on \([0,2\pi]\)'
    D: '\(f(x)=\sin x\) on \((-\infty,\infty)\)'
    answer: A
    hint: The graph must rise to a peak and then fall without bound.
    explanation: '\(-x^2\) peaks at 0 and decreases without bound. The others have both a max and a min.'
  32:
    topic: s4-1
    question: 'The perimeter of a rectangle with dimensions \(x\) by \(100/x\) is \(P(x)=2x+\dfrac{200}{x}\) for \(0<x<\infty\). Its absolute minimum is'
    A: '\(100\), at \(x=1\)'
    B: '\(20\), at \(x=10\)'
    C: '\(40\), at \(x=100\)'
    D: '\(40\), at \(x=10\)'
    answer: D
    hint: 'Solve \(P''=2-200/x^2=0\).'
    explanation: '\(x=10\) and \(P=20+20=40\): the rectangle is a \(10\times10\) square.'
  33:
    topic: s4-1
    question: The largest possible area of a right triangle whose hypotenuse is 5 cm long is
    A: '\(\dfrac{25}{8}\) cm\(^2\)'
    B: '\(\dfrac{25}{2}\) cm\(^2\)'
    C: '\(\dfrac{25}{4}\) cm\(^2\)'
    D: '\(6\) cm\(^2\)'
    answer: C
    hint: 'The legs \(a,b\) satisfy \(a^2+b^2=25\) and \(A=\tfrac12ab\). The maximum occurs when \(a=b\).'
    explanation: '\(a=b=\tfrac{5}{\sqrt2}\) gives \(A=\tfrac12\cdot\tfrac{25}{2}=\tfrac{25}{4}\).'
  34:
    topic: s4-1
    question: 'The peak current of \(i=2\cos t+2\sin t\) (the largest magnitude) is'
    A: '\(2\)'
    B: '\(\sqrt2\)'
    C: '\(4\)'
    D: '\(2\sqrt2\)'
    answer: D
    hint: 'Maximize \(i\); set \(i''=-2\sin t+2\cos t=0\).'
    explanation: '\(\tan t=1\) gives \(i=2\cdot\tfrac{\sqrt2}{2}\cdot2=2\sqrt2\).'
  35:
    topic: s4-2
