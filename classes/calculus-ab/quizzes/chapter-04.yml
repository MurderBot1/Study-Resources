    explanation: '\(\dfrac{2\ln x/x}{1}\to0\).'
  175:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 1^{+}} - \frac{1}{\ln{\left(x \right)}} + \frac{1}{x - 1}\).'
    A: '\(\frac{1}{2}\)'
    B: does not exist
    C: '\(- \frac{1}{2}\)'
    D: '\(-1\)'
    answer: C
    hint: 'This is \(\infty-\infty\); combine over a common denominator.'
    explanation: '\(\dfrac{\ln x-x+1}{(x-1)\ln x}\to-\tfrac12\) after applying L''Hôpital twice.'
  176:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0} - \frac{1}{\sin{\left(x \right)}} + \frac{1}{x}\).'
    A: does not exist
    B: '\(-1\)'
    C: '\(1\)'
    D: '\(0\)'
    answer: D
    hint: 'Combine: \(\dfrac{\sin x-x}{x\sin x}\).'
    explanation: '\(\dfrac{\cos x-1}{\sin x+x\cos x}\to0\).'
  177:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 1^{+}} x^{\frac{1}{1 - x}}\).'
    A: '\(e^{-1}\)'
    B: '\(0\)'
    C: '\(1\)'
    D: '\(e\)'
    answer: A
    hint: '\(1^\infty\) form: take the log.'
    explanation: '\(\ln y=\dfrac{\ln x}{1-x}\to-1\), so the limit is \(e^{-1}\).'
  178:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0^{+}} x^{x}\).'
    A: '\(e\)'
    B: '\(1\)'
    C: '\(0\)'
    D: '\(\infty\)'
    answer: B
    hint: '\(0^0\) form: \(\ln y=x\ln x\to0\).'
    explanation: 'The limit is \(e^0=1\).'
  179:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} \left(1 + \frac{1}{x}\right)^{x}\).'
    A: '\(\infty\)'
    B: '\(e\)'
    C: '\(1\)'
    D: '\(0\)'
    answer: B
    hint: '\(1^\infty\): \(\ln y=x\ln(1+1/x)\).'
    explanation: '\(\dfrac{\ln(1+1/x)}{1/x}\to1\), so the limit is \(e\).'
  180:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} \left(2 x + 1\right)^{\frac{1}{2 \ln{\left(x \right)}}}\).'
    A: '\(0\)'
    B: '\(e\)'
    C: '\(1\)'
    D: '\(e^{\frac{1}{2}}\)'
    answer: D
    hint: Take the natural log.
    explanation: '\(\ln y=\dfrac{\ln(1+2x)}{2\ln x}\to\dfrac12\), so the limit is \(e^{1/2}\).'
  181:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to 0^{+}} \left(x + e^{x}\right)^{\frac{1}{x}}\).'
    A: '\(2\)'
    B: '\(e^{2}\)'
    C: '\(1\)'
    D: '\(e\)'
    answer: B
    hint: '\(1^\infty\) form.'
    explanation: '\(\ln y=\dfrac{\ln(e^x+x)}{x}\to\dfrac{e^x+1}{e^x+x}\to2\), so the limit is \(e^2\).'
  182:
    topic: s4-6
    question: 'Evaluate \(\lim_{x\to \infty} \frac{\sqrt{x}}{\sqrt{x + 1}}\).'
    A: '\(-1\)'
    B: does not exist
    C: '\(1\)'
    D: '\(2\)'
    answer: C
    hint: "This is not a candidate for L'Hôpital; simplify instead."
    explanation: '\(\sqrt{\dfrac{x}{x+1}}\to1\). L''Hôpital''s Rule would just cycle.'
  183:
    topic: s4-6
    question: 'Why does L''Hôpital''s Rule not help in evaluating \(\displaystyle\lim_{x\to\infty}\dfrac{\sqrt{9x+1}}{\sqrt{x+1}}\)?'
    A: 'The limit is not of the form \(\infty/\infty\)'
    B: The limit is infinite
    C: The derivatives do not exist
    D: Each application returns the reciprocal form of the original quotient, so it cycles; simplify algebraically instead
    answer: D
    hint: Differentiate top and bottom and compare.
    explanation: 'Dividing by \(\sqrt x\): \(\sqrt{\dfrac{9+1/x}{1+1/x}}\to3\).'
  184:
    topic: s4-6
    question: Which limit is correct?
    A: '\(\displaystyle\lim_{x\to3}\dfrac{x-3}{x^2-3}=\lim\dfrac{1}{2x}=\dfrac16\)'
    B: '\(\displaystyle\lim_{x\to3}\dfrac{x-3}{x^2-3}=\dfrac{0}{6}=0\), since the form is not indeterminate'
    C: The limit does not exist
    D: 'The limit is \(\infty\)'
    answer: B
    hint: 'Check whether the form is \(\tfrac00\) before applying L''Hôpital.'
    explanation: 'The denominator at \(x=3\) is \(6\), not 0. L''Hôpital''s Rule applies only to indeterminate forms.'
  185:
    topic: s4-6
    question: Which of the following is an indeterminate form?
    A: '\(\infty+\infty\)'
    B: '\(\dfrac{1}{\infty}\)'
    C: '\(\infty-\infty\)'
    D: '\(\infty\cdot\infty\)'
    answer: C
    hint: The others have definite values.
    explanation: '\(\infty-\infty\) can equal anything depending on the functions involved.'
  186:
    topic: s4-6
    question: Which of the following is NOT an indeterminate form?
    A: '\(1^\infty\)'
    B: '\(0^0\)'
    C: '\(0\cdot\infty\)'
    D: '\(\infty\cdot\infty\)'
    answer: D
    hint: A product of two large numbers is large.
    explanation: '\(\infty\cdot\infty=\infty\).'
  187:
    topic: s4-6
    question: 'To compute \(\displaystyle\lim_{x\to0^+}x^x\), one writes \(x^x=e^{x\ln x}\). The exponent has the form'
    A: '\(1^\infty\)'
    B: '\(\infty-\infty\)'
    C: '\(0\cdot(-\infty)\)'
    D: '\(\dfrac00\)'
    answer: C
    hint: 'As \(x\to0^+\): \(x\to0\) and \(\ln x\to-\infty\).'
    explanation: 'Convert to \(\dfrac{\ln x}{1/x}\) to apply L''Hôpital.'
  188:
    topic: s4-6
    question: 'If \(f(x)=x+2\) and \(g(x)=x+1\), then \(\displaystyle\lim_{x\to0}\dfrac{f''(x)}{g''(x)}\) and \(\displaystyle\lim_{x\to0}\dfrac{f(x)}{g(x)}\) are'
    A: '\(2\) and \(1\)'
    B: '\(1\) and \(1\)'
    C: '\(2\) and \(2\)'
    D: '\(1\) and \(2\)'
    answer: D
    hint: 'This does not violate L''Hôpital''s Rule: the quotient \(f/g\) was not an indeterminate form.'
    explanation: '\(f''/g''=1\), but \(f(0)/g(0)=2\). The rule requires \(f(0)=g(0)=0\).'
  189:
    topic: s4-6
    question: 'Find a value of \(c\) that makes \(f(x)=\dfrac{9x-3\sin3x}{5x^3}\) (\(x\ne0\)), \(f(0)=c\), continuous at \(0\).'
    A: '\(c=\dfrac95\)'
    B: '\(c=\dfrac{27}{10}\)'
    C: '\(c=\dfrac{27}{5}\)'
    D: '\(c=0\)'
    answer: B
    hint: 'Compute \(\displaystyle\lim_{x\to0}f(x)\) by L''Hôpital''s Rule; the form is \(\tfrac00\) three times.'
    explanation: '\(\dfrac{9-9\cos3x}{15x^2}\to\dfrac{27\sin3x}{30x}\to\dfrac{81\cos3x}{30}=\dfrac{27}{10}\).'
  190:
    topic: s4-6
    question: 'The limit \(\displaystyle\lim_{x\to\infty}\left(\sqrt{x^2+x}-\sqrt{x^2-x}\right)\) equals'
    A: '\(0\)'
    B: '\(2\)'
    C: '\(\infty\)'
    D: '\(1\)'
    answer: D
    hint: 'This is \(\infty-\infty\); multiply by the conjugate.'
    explanation: '\(\dfrac{2x}{\sqrt{x^2+x}+\sqrt{x^2-x}}\to\dfrac{2x}{2x}=1\).'
  191:
    topic: s4-6
    question: 'As \(x\to\infty\), which of these grows fastest?'
    A: '\(x^{100}\)'
    B: '\(\ln x\)'
    C: '\(x^{\ln x}\)'
    D: '\(e^x\)'
    answer: D
    hint: Exponentials outgrow polynomials.
    explanation: 'Repeated L''Hôpital shows \(x^n/e^x\to0\) for every \(n\).'
  192:
    topic: s4-6
    question: 'A triangle has legs 1 and \(y\), hypotenuse \(r\), and the angle opposite \(y\) is \(\theta\). As \(\theta\to\pi/2\), the limit of \(r-y\) is'
    A: '\(\tfrac12\)'
    B: '\(1\)'
    C: '\(0\)'
    D: '\(\infty\)'
    answer: C
    hint: '\(r=\sec\theta\), \(y=\tan\theta\). Write \(\sec\theta-\tan\theta=\dfrac{1-\sin\theta}{\cos\theta}\).'
    explanation: 'L''Hôpital: \(\dfrac{-\cos\theta}{-\sin\theta}\to0\).'
  193:
    topic: s4-6
    question: 'Cauchy''s Mean Value Theorem for \(f(x)=x\), \(g(x)=x^2\) on \([a,b]\) gives \(c=\)'
    A: '\(\dfrac{a+b}{2}\)'
    B: '\(\sqrt{ab}\)'
    C: '\(a+b\)'
    D: '\(\dfrac{ab}{a+b}\)'
    answer: A
    hint: '\(\dfrac{f''(c)}{g''(c)}=\dfrac{f(b)-f(a)}{g(b)-g(a)}\).'
    explanation: '\(\dfrac{1}{2c}=\dfrac{b-a}{b^2-a^2}=\dfrac1{a+b}\).'
  194:
    topic: s4-7
    question: 'Use Newton''s method on \(f(x)=x^2+x-1\) with \(x_0=1\). The approximation \(x_2\) is'
    A: '\(-0.619\)'
    B: '\(0.719\)'
    C: '\(0.619\)'
    D: '\(0.6667\)'
    answer: C
    hint: '\(x_1=1-\dfrac{f(1)}{f''(1)}\) with \(f''(x)=2x+1\).'
    explanation: 'Iterate \(x_{n+1}=x_n-\dfrac{f(x_n)}{f''(x_n)}\): \(x_0\approx1.0\), \(x_1\approx0.6667\), \(x_2\approx0.619\).'
  195:
    topic: s4-7
    question: 'Use Newton''s method on \(f(x)=x^2+x-1\) with \(x_0=-1\). The approximation \(x_2\) is'
    A: '\(-2.0\)'
    B: '\(-1.5667\)'
    C: '\(1.6667\)'
    D: '\(-1.6667\)'
    answer: D
    hint: '\(f''(x)=2x+1\); note \(f''(-1)=-1\).'
    explanation: 'Iterate \(x_{n+1}=x_n-\dfrac{f(x_n)}{f''(x_n)}\): \(x_0\approx-1.0\), \(x_1\approx-2.0\), \(x_2\approx-1.6667\).'
  196:
    topic: s4-7
    question: 'Use Newton''s method on \(f(x)=x^3+3x+1\) with \(x_0=0\). \(x_2=\)'
    A: '\(0.3222\)'
    B: '\(-0.3333\)'
    C: '\(-0.2222\)'
    D: '\(-0.3222\)'
    answer: D
    hint: '\(f''(x)=3x^2+3\).'
    explanation: 'Iterate \(x_{n+1}=x_n-\dfrac{f(x_n)}{f''(x_n)}\): \(x_0\approx0.0\), \(x_1\approx-0.3333\), \(x_2\approx-0.3222\).'
  197:
    topic: s4-7
    question: 'Use Newton''s method on \(f(x)=x^4+x-3\) with \(x_0=1\). \(x_2=\)'
    A: '\(1.2\)'
    B: '\(1.2654\)'
    C: '\(1.1654\)'
    D: '\(-1.1654\)'
    answer: C
    hint: '\(f''(x)=4x^3+1\).'
    explanation: 'Iterate \(x_{n+1}=x_n-\dfrac{f(x_n)}{f''(x_n)}\): \(x_0\approx1.0\), \(x_1\approx1.2\), \(x_2\approx1.1654\).'
  198:
    topic: s4-7
    question: 'Use Newton''s method on \(f(x)=x^4+x-3\) with \(x_0=-1\). \(x_2=\)'
    A: '\(-1.6452\)'
    B: '\(-1.5452\)'
    C: '\(1.6452\)'
    D: '\(-2.0\)'
    answer: A
    hint: '\(f(-1)=-3\) and \(f''(-1)=-3\).'
    explanation: 'Iterate \(x_{n+1}=x_n-\dfrac{f(x_n)}{f''(x_n)}\): \(x_0\approx-1.0\), \(x_1\approx-2.0\), \(x_2\approx-1.6452\).'
  199:
    topic: s4-7
    question: 'Use Newton''s method on \(f(x)=2x-x^2+1\) with \(x_0=2\). \(x_2=\)'
    A: '\(2.4167\)'
    B: '\(2.5\)'
    C: '\(2.5167\)'
    D: '\(-2.4167\)'
    answer: A
    hint: '\(f''(x)=2-2x\).'
    explanation: 'Iterate \(x_{n+1}=x_n-\dfrac{f(x_n)}{f''(x_n)}\): \(x_0\approx2.0\), \(x_1\approx2.5\), \(x_2\approx2.4167\).'
  200:
    topic: s4-7
    question: 'If \(x_0\) is a root of \(f\) and \(f''(x_0)\ne0\), then Newton''s method gives'
    A: '\(x_1=x_0\) (and all later approximations stay at the root)'
    B: '\(x_1\) undefined'
    C: '\(x_1=0\)'
    D: '\(x_1=-x_0\)'
    answer: A
    hint: '\(x_1=x_0-\dfrac{f(x_0)}{f''(x_0)}\).'
    explanation: '\(f(x_0)=0\) so the correction term vanishes.'
  201:
    topic: s4-7
    question: 'To estimate \(\dfrac\pi2\) to five decimal places by solving \(\cos x=0\) with Newton''s method, the starting value'
    A: does not matter at all
    B: 'must be exactly \(\tfrac\pi2\)'
    C: must be negative
    D: 'matters: it must be chosen close enough to \(\pi/2\) (for example \(x_0=1\))'
    answer: D
    hint: '\(x_{n+1}=x_n+\cot x_n\). Check what happens near a point where \(\sin\) is 0.'
    explanation: 'Starting near an extremum of \(\cos\) (e.g. \(x_0=0\) with \(\sin0=0\)) the iteration breaks down.'
  202:
    topic: s4-7
    question: 'Newton''s method applied to \(f(x)=\begin{cases}\sqrt x,&x\ge0\\ \sqrt{-x},&x<0\end{cases}\) with \(x_0=h>0\) gives \(x_1=\)'
    A: '\(h\)'
    B: '\(-h\)'
    C: '\(h/2\)'
    D: '\(0\)'
    answer: B
    hint: '\(x_1=h-\dfrac{\sqrt h}{1/(2\sqrt h)}\).'
    explanation: '\(x_1=h-2h=-h\), and then \(x_2=h\): the iteration oscillates and never converges.'
  203:
    topic: s4-7
    question: 'Newton''s method for \(f(x)=x^{1/3}\) with \(x_0=1\) produces \(x_n=\)'
    A: '\(0\) after one step'
    B: '\(2^{-n}\)'
    C: '\((-2)^n\), so \(|x_n|\to\infty\)'
    D: '\(1\) for all \(n\)'
    answer: C
    hint: '\(x_{n+1}=x_n-3x_n=-2x_n\).'
    explanation: The approximations move farther from the root 0 each time.
  204:
    topic: s4-7
    question: 'Newton''s method to solve \(x^3-3x-1=0\) near \(x_0=2\) uses the recursion'
    A: '\(x_{n+1}=x_n-\dfrac{x_n^3-3x_n-1}{3x_n^2-3}\)'
    B: '\(x_{n+1}=x_n-(x_n^3-3x_n-1)\)'
    C: '\(x_{n+1}=\dfrac{x_n^3-3x_n-1}{3x_n^2-3}\)'
    D: '\(x_{n+1}=x_n+\dfrac{x_n^3-3x_n-1}{3x_n^2-3}\)'
    answer: A
    hint: '\(x_{n+1}=x_n-f(x_n)/f''(x_n)\).'
    explanation: '\(f''(x)=3x^2-3\).'
  205:
    topic: s4-7
    question: 'The four statements "find the roots of \(f(x)=x^3-3x-1\)", "find the \(x\)-coordinates where \(y=x^3\) meets \(y=3x+1\)", "find where \(y=x^3-3x\) crosses \(y=1\)", and "find \(x\) where \(g''(x)=0\) for \(g=\tfrac14x^4-\tfrac32x^2-x+5\)" ask for'
    A: two different pairs of answers
    B: the same information
    C: four different answers
    D: no solutions
    answer: B
    hint: 'Rewrite each as \(x^3-3x-1=0\).'
    explanation: 'All reduce to \(x^3-3x-1=0\) (note \(g''=x^3-3x-1\)).'
  206:
    topic: s4-7
    question: 'Newton''s method applied to \(f(x)=(x-1)^{40}\) with \(x_0=2\) converges very slowly because'
    A: the function is not continuous
    B: the root is complex
    C: 'the curve is nearly flat near the root so each step moves only a little (\(x_{n+1}-1=\tfrac{39}{40}(x_n-1)\))'
    D: 'the derivative is zero at \(x_0\)'
    answer: C
    hint: '\(x_{n+1}=x_n-\dfrac{x_n-1}{40}\).'
    explanation: 'Each step reduces the error by a factor of \(\tfrac{39}{40}\).'
  207:
    topic: s4-7
    question: 'Newton''s method on \(f(x)=4x^4-4x^2\) converges to a different zero depending on \(x_0\). Starting at \(x_0=-2\) leads to the zero at'
    A: it diverges
    B: '\(x=-1\)'
    C: '\(x=1\)'
    D: '\(x=0\)'
    answer: B
    hint: 'The zeros are \(0,\pm1\). Start far left.'
    explanation: '\(f=4x^2(x-1)(x+1)\) and Newton''s method from the far left moves toward the nearest root, \(-1\).'
  208:
    topic: s4-7
    question: "Newton's method requires"
    A: '\(f\) to have only one root'
    B: '\(f\) to be a polynomial'
    C: '\(f''\) to be constant'
    D: '\(f\) to be differentiable near the root and \(f''\ne0\) at the approximations'
    answer: D
    hint: 'Each step divides by \(f''(x_n)\).'
    explanation: 'If \(f''(x_n)=0\) the iteration breaks down.'
  209:
    topic: s4-8
    question: 'An antiderivative of \(f(x)=x^{2} - 2 x + 1\) is'
