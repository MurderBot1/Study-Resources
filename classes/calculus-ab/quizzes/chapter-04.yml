    B: 'increasing on \((-\infty,0)\) and \((1,\infty)\); local maximum at \(x=0\)'
    C: 'increasing on \((0,1)\); local maximum at \(x=1\)'
    D: 'increasing on \((-\infty,0)\) and \((1,\infty)\); local maximum at \(x=1\)'
    answer: B
    hint: 'Make a sign chart for \(x(x-1)\).'
    explanation: '\(f''>0\) for \(x<0\) and \(x>1\), \(f''<0\) on \((0,1)\); the sign goes \(+\to-\) at 0.'
  80:
    topic: s4-3
    question: 'Suppose \(f''(x)=(x-1)^2(x+2)\). Then \(f\) has'
    A: local maxima at both
    B: 'a local maximum at \(x=-2\) and a minimum at \(x=1\)'
    C: 'a local minimum at \(x=1\) only'
    D: 'a local minimum at \(x=-2\) and no extremum at \(x=1\)'
    answer: D
    hint: 'The factor \((x-1)^2\) never changes sign.'
    explanation: '\(f''\) is negative for \(x<-2\) and positive afterward (except 0 at \(x=1\)).'
  81:
    topic: s4-3
    question: 'Suppose \(f''(x)=(x-1)e^{-x}\). The function \(f\) has'
    A: 'a local minimum at \(x=0\)'
    B: 'a local maximum at \(x=1\)'
    C: 'a local minimum at \(x=1\)'
    D: no critical points
    answer: C
    hint: '\(e^{-x}>0\) always.'
    explanation: 'The sign of \(f''\) is the sign of \(x-1\): negative then positive.'
  82:
    topic: s4-3
    question: 'Suppose \(f''(x)=x^{-1/3}(x+2)\). The critical points of \(f\) are'
    A: '\(x=0\) only'
    B: '\(x=-2\) only'
    C: '\(x=-2\) and \(x=0\)'
    D: '\(x=2\) and \(x=0\)'
    answer: C
    hint: 'Look for zeros AND points where \(f''\) is undefined.'
    explanation: '\(f''=0\) at \(-2\), and \(f''\) is undefined at 0 (where \(f\) may still be defined).'
  83:
    topic: s4-3
    question: 'For \(g(x)=x\sqrt{8-x^2}\), the absolute maximum value is'
    A: '\(4\sqrt2\), at \(x=2\sqrt2\)'
    B: '\(8\), at \(x=2\)'
    C: '\(4\), at \(x=2\)'
    D: '\(0\), at \(x=0\)'
    answer: C
    hint: 'The domain is \([-2\sqrt2,2\sqrt2]\). Set \(g''=\dfrac{8-2x^2}{\sqrt{8-x^2}}=0\).'
    explanation: '\(x=\pm2\); \(g(2)=2\cdot2=4\).'
  84:
    topic: s4-3
    question: 'For \(f(x)=xe^{-x}\), the local extreme value is'
    A: 'a local maximum \(\dfrac1e\) at \(x=0\)'
    B: 'a local minimum \(\dfrac1e\) at \(x=1\)'
    C: 'a local maximum \(e\) at \(x=1\)'
    D: 'a local (and absolute) maximum \(\dfrac1e\) at \(x=1\)'
    answer: D
    hint: '\(f''=e^{-x}(1-x)\).'
    explanation: '\(f''\) goes from \(+\) to \(-\) at \(x=1\), and \(f(1)=1/e\).'
  85:
    topic: s4-3
    question: 'For \(f(x)=x\ln x\) with \(x>0\), the minimum value is'
    A: '\(-\dfrac1e\), at \(x=\dfrac1e\)'
    B: '\(\dfrac1e\), at \(x=\dfrac1e\)'
    C: '\(-e\), at \(x=e\)'
    D: '\(0\), at \(x=1\)'
    answer: A
    hint: '\(f''=\ln x+1\).'
    explanation: '\(\ln x=-1\) gives \(x=1/e\) and \(f=\tfrac1e\cdot(-1)=-\tfrac1e\).'
  86:
    topic: s4-3
    question: 'For \(f(x)=x^2\ln x\) with \(x>0\), the minimum value is'
    A: '\(-\dfrac1e\), at \(x=\dfrac1e\)'
    B: '\(\dfrac{1}{2e}\), at \(x=e^{-1/2}\)'
    C: '\(0\), at \(x=1\)'
    D: '\(-\dfrac{1}{2e}\), at \(x=e^{-1/2}\)'
    answer: D
    hint: '\(f''=x(2\ln x+1)\).'
    explanation: '\(\ln x=-\tfrac12\); then \(f=e^{-1}\cdot(-\tfrac12)\).'
  87:
    topic: s4-3
    question: 'For \(f(x)=x^3-3x^2\) on \((-\infty,2]\), the local extrema are'
    A: 'a local maximum \(0\) at \(x=0\) and an endpoint minimum \(-4\) at \(x=2\)'
    B: no extrema
    C: 'a local minimum \(0\) at \(x=0\) and an endpoint maximum \(-4\) at \(x=2\)'
    D: 'only a local maximum at \(x=0\)'
    answer: A
    hint: '\(f''=3x(x-2)\); the domain is cut at \(x=2\).'
    explanation: '\(f''>0\) for \(x<0\) and \(f''<0\) on \((0,2)\): a local max at 0. At the endpoint \(x=2\), \(f=-4\) is the smallest value nearby.'
  88:
    topic: s4-3
    question: 'To show that \(\ln x<x\) for \(x>1\), consider \(f(x)=x-\ln x\). Why does this work?'
    A: '\(f\) is decreasing for \(x>1\)'
    B: '\(f''\) is negative for \(x>1\)'
    C: '\(f(1)=0\)'
    D: '\(f''(x)=1-\tfrac1x>0\) for \(x>1\), so \(f\) is increasing, and \(f(1)=1>0\)'
    answer: D
    hint: 'Show \(f\) starts positive and increases.'
    explanation: 'So \(f(x)>f(1)=1>0\), i.e. \(x>\ln x\).'
  89:
    topic: s4-3
    question: 'If \(f\) is increasing on an interval, then \(f\) is'
    A: constant
    B: periodic
    C: one-to-one on that interval
    D: even
    answer: C
    hint: Two different inputs must give two different outputs.
    explanation: Increasing functions never repeat a value, so they have inverses.
  90:
    topic: s4-3
    question: 'The function \(f(x)=\tfrac13x+\tfrac56\) is increasing everywhere. Its inverse has derivative'
    A: '\(\dfrac{df^{-1}}{dx}=3\)'
    B: '\(-3\)'
    C: '\(\dfrac56\)'
    D: '\(\dfrac13\)'
    answer: A
    hint: 'Reciprocal slopes: \((f^{-1})''=1/f''\).'
    explanation: '\(f''=\tfrac13\) so \((f^{-1})''=3\).'
  91:
    topic: s4-3
    question: 'The function \(f(x)=27x^3\) is increasing, so it has an inverse. \(\dfrac{df^{-1}}{dx}\) at \(x=27\) (where \(f(1)=27\)) equals'
    A: '\(\dfrac{1}{3}\)'
    B: '\(\dfrac1{81}\)'
    C: '\(81\)'
    D: '\(\dfrac{1}{27}\)'
    answer: B
    hint: '\(f''(1)=81\).'
    explanation: '\((f^{-1})''(27)=1/f''(1)=1/81\).'
  92:
    topic: s4-3
    question: 'Where is \(f(x)=ax^2+bx+c\) (\(a>0\)) increasing?'
