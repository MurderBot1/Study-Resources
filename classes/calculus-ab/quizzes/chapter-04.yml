    explanation: '\(y''\) goes \(+\) to \(-\) at 2. \(y''''\) changes sign at 0 and at \(\tfrac43\).'
  116:
    topic: s4-4
    question: 'Given \(y''=\cos t\) for \(0\le t\le2\pi\), the function \(y\) has'
    A: 'inflection points at \(t=\tfrac\pi2,\tfrac{3\pi}2\)'
    B: 'a local maximum at \(t=\tfrac\pi2\), a local minimum at \(t=\tfrac{3\pi}2\), and inflection points at \(t=0,\pi,2\pi\)'
    C: no local extrema
    D: 'a local minimum at \(t=\tfrac\pi2\)'
    answer: B
