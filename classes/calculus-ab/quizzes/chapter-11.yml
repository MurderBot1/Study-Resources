  508:
    topic: s11-9
    question: 'When \(-0.1<x<0\), the series for \(e^x\) alternates; replacing \(e^x\) by \(1+x+\dfrac{x^2}2\) gives an error of at most'
    A: '\(\dfrac{|x|^2}{2}\le5\times10^{-3}\)'
    B: '\(\dfrac{|x|^4}{24}\le4.2\times10^{-6}\)'
    C: '\(1.84\times10^{-3}\)'
    D: '\(\dfrac{|x|^3}{6}\le1.67\times10^{-4}\)'
    answer: D
    hint: 'The first omitted term is \(\dfrac{x^3}{3!}\).'
    explanation: Alternating Series Estimation Theorem.
  509:
    topic: s11-9
    question: 'For \(|x|<0.5\), approximating \(\sinh x\) by \(x+\dfrac{x^3}6\) has error at most \(\dfrac{\cosh(0.5)(0.5)^5}{120}\), which is about (in units of \(10^{-4}\), two decimals)'
    A: '\(2.94\)'
    B: '\(0.73\)'
    C: '\(1.47\)'
    D: '\(5.87\)'
    answer: A
    hint: 'The fifth derivative of \(\sinh\) is \(\cosh\).'
    explanation: '\(\dfrac{1.1276\cdot0.03125}{120}\approx2.9\times10^{-4}\).'
  510:
    topic: s11-9
    question: 'For \(0\le h\le0.01\), replacing \(e^h\) by \(1+h\) gives an error no more than'
    A: '\(1\%\) of \(h\) exactly'
    B: '\(6\%\) of \(h\)'
    C: '\(0.06\%\) of \(h\)'
    D: '\(0.6\%\) of \(h\) (since \(|R_1|\le\dfrac{e^{0.01}h^2}2\le0.00505h\))'
    answer: D
    hint: '\(|R_1|\le\dfrac{e^{0.01}h^2}{2}\).'
    explanation: 'Divide by \(h\) and use \(h\le0.01\).'
  511:
    topic: s11-9
    question: 'To replace \(\ln(1+x)\) by \(x\) with an error of no more than \(1\%\) of \(x\) (\(x>0\)), use'
    A: '\(0<x\le1\)'
    B: '\(0<x\le0.02\)'
    C: '\(0<x\le0.002\)'
    D: '\(0<x\le0.2\)'
    answer: B
    hint: 'The alternating series error is about \(\dfrac{x^2}2\).'
    explanation: '\(\dfrac{x^2}2\le0.01x\) gives \(x\le0.02\).'
  512:
    topic: s11-9
    question: 'To estimate \(\dfrac\pi4=\tan^{-1}1=1-\dfrac13+\dfrac15-\cdots\) with error less than \(10^{-3}\), the number of terms required is'
    A: '\(1000\)'
    B: '\(50\)'
    C: '\(100\)'
    D: '\(500\)'
    answer: D
    hint: 'The error is less than the first omitted term \(\dfrac1{2N+1}\).'
    explanation: '\(\dfrac1{2N+1}<10^{-3}\) requires \(N\ge500\).'
  513:
    topic: s11-9
    question: 'For \(x\ne0\), the Alternating Series Estimation Theorem applied to \(\sin x\) shows that \(\dfrac{\sin x}x\) satisfies'
    A: '\(1-\dfrac{x^2}6<\dfrac{\sin x}x<1\)'
    B: '\(1-\dfrac{x^2}2<\dfrac{\sin x}x<1\)'
    C: '\(\dfrac{\sin x}x>1\)'
    D: '\(1<\dfrac{\sin x}x<1+\dfrac{x^2}6\)'
    answer: A
    hint: '\(\dfrac{\sin x}x=1-\dfrac{x^2}6+\dfrac{x^4}{120}-\cdots\) (for small \(x\)).'
    explanation: The sum lies between the first two partial sums.
  514:
    topic: s11-9
    question: 'For \(x\ne0\), the Alternating Series Estimation Theorem applied to \(\cos x\) shows that'
    A: '\(\dfrac12<\dfrac{1-\cos x}{x^2}<\dfrac12+\dfrac{x^2}{24}\)'
    B: '\(\dfrac12-\dfrac{x^2}{24}<\dfrac{1-\cos x}{x^2}<\dfrac12\)'
    C: '\(\dfrac12-\dfrac{x^2}{6}<\dfrac{1-\cos x}{x^2}<\dfrac12\)'
    D: '\(\dfrac{1-\cos x}{x^2}>1\)'
    answer: B
    hint: '\(\dfrac{1-\cos x}{x^2}=\dfrac12-\dfrac{x^2}{24}+\dfrac{x^4}{720}-\cdots\).'
    explanation: The sum lies between the first two partial sums.
  515:
    topic: s11-9
    question: 'The cubic approximation of \(\dfrac1{1-x}\) at \(x=0\) is \(1+x+x^2+x^3\). For \(|x|\le0.1\), an upper bound for the error is about'
    A: '\(2\times10^{-5}\)'
    B: '\(1.7\times10^{-4}\)'
    C: '\(10^{-4}\)'
    D: '\(10^{-3}\)'
    answer: B
    hint: '\(|R_3|=\dfrac{|x|^4}{(1-c)^5}\le\dfrac{(0.1)^4}{(0.9)^5}\).'
    explanation: '\(\dfrac{10^{-4}}{0.59049}\approx1.69\times10^{-4}\).'
  516:
    topic: s11-9
    question: 'The quadratic approximation \(1+3x+3x^2\) of \((1+x)^3\) on \([0,1]\) has error \(x^3\). The error is below \(\dfrac1{100}\) when'
    A: '\(x<0.5\)'
    B: '\(x<0.215\)'
    C: '\(x<0.1\)'
    D: '\(x<0.01\)'
    answer: B
    hint: 'Solve \(x^3<0.01\).'
    explanation: '\(x<0.01^{1/3}\approx0.2154\).'
  517:
    topic: s11-9
    question: 'If \(P\) approximates \(\pi\) to \(n\) decimal places, then \(P+\sin P\) approximates \(\pi\) to about'
    A: '\(n/2\) decimal places'
    B: '\(3n\) decimal places'
    C: '\(n+1\) decimal places'
    D: '\(2n\) decimal places'
    answer: B
    hint: 'Let \(P=\pi+x\); then \(\sin P=-\sin x\).'
    explanation: '\(P+\sin P=\pi+x-\sin x\approx\pi+\dfrac{x^3}6\).'
  518:
    topic: s11-9
    question: 'The series \(0.1-\dfrac{(0.1)^3}{3!}+\dfrac{(0.1)^5}{5!}-\cdots\) is the Maclaurin series of'
    A: '\(e^x\) at \(x=0.1\)'
    B: '\(\cos x\) at \(x=0.1\)'
    C: '\(\sin x\) evaluated at \(x=0.1\), so its sum is \(\sin0.1\approx0.0998\)'
    D: '\(\sinh x\) at \(x=0.1\)'
    answer: C
    hint: 'Compare with \(\sum\dfrac{(-1)^kx^{2k+1}}{(2k+1)!}\).'
    explanation: 'The sum is \(\sin(0.1)=0.0998334\ldots\).'
  519:
    topic: s11-9
    question: 'The series \(1-\dfrac{\pi^2}{4^2\cdot2!}+\dfrac{\pi^4}{4^4\cdot4!}-\cdots\) has sum'
    A: '\(\dfrac\pi4\)'
    B: '\(\cos\dfrac\pi4=\dfrac{\sqrt2}2\)'
    C: '\(\cos\pi\)'
    D: '\(\sin\dfrac\pi4\cdot2\)'
    answer: B
    hint: 'The terms are \(\dfrac{(-1)^k(\pi/4)^{2k}}{(2k)!}\).'
    explanation: 'Cosine series at \(x=\tfrac\pi4\).'
  520:
    topic: s11-9
    question: 'The series \(\dfrac\pi3-\dfrac{\pi^3}{3^3\cdot3}+\dfrac{\pi^5}{3^5\cdot5}-\cdots\) has sum'
    A: '\(\tan^{-1}\dfrac\pi3\approx0.808\)'
    B: '\(\ln\left(1+\dfrac\pi3\right)\)'
    C: '\(\sin\dfrac\pi3\)'
    D: '\(\dfrac\pi3\)'
    answer: A
    hint: 'The terms are \(\dfrac{(-1)^k(\pi/3)^{2k+1}}{2k+1}\).'
    explanation: 'This is the arctangent series at \(x=\tfrac\pi3\).'
  521:
    topic: s11-9
    question: 'The series \(\dfrac{1}{x^2}\left(1-\cos x\right)\) is approximated, for small \(x\), by'
    A: '\(\dfrac12+\dfrac{x^2}{24}\)'
    B: '\(\dfrac{x^2}{2}\)'
    C: '\(\dfrac12-\dfrac{x^2}{24}\)'
    D: '\(1-\dfrac{x^2}2\)'
    answer: C
    hint: 'Use \(1-\cos x=\dfrac{x^2}2-\dfrac{x^4}{24}+\cdots\).'
    explanation: 'Divide by \(x^2\).'
  522:
    topic: s11-9
    question: 'Every Taylor polynomial of positive degree generated by \(\cos x\) at \(x=0\) must eventually move away from the graph of \(\cos x\) as \(|x|\) increases because'
    A: cosine is not differentiable
    B: the polynomial is periodic
    C: the radius of convergence is zero
    D: 'the polynomial is unbounded while \(\cos x\) is bounded between \(-1\) and \(1\)'
    answer: D
    hint: 'Compare the behavior at large \(|x|\).'
    explanation: 'Nonconstant polynomials tend to \(\pm\infty\).'
  523:
    topic: s11-9
    question: The Maclaurin series of an even function contains
    A: both even and odd powers
    B: only the constant term
    C: 'only even powers of \(x\)'
    D: 'only odd powers of \(x\)'
    answer: C
    hint: 'Even functions have odd derivatives vanishing at \(0\).'
    explanation: '\(f^{(2k+1)}(0)=0\).'
  524:
    topic: s11-9
    question: The Maclaurin series of an odd function contains
    A: both even and odd powers
    B: 'only even powers of \(x\)'
    C: 'only odd powers of \(x\)'
    D: only the constant term
    answer: C
    hint: 'Odd functions have even derivatives vanishing at \(0\).'
    explanation: '\(f^{(2k)}(0)=0\).'
  525:
    topic: s11-9
    question: 'A function defined by a power series \(\sum a_nx^n\) with radius \(c>0\) has Taylor series at \(0\) equal to'
    A: the power series itself
    B: a different power series
    C: '\(0\)'
    D: a polynomial
    answer: A
    hint: 'Differentiate term by term and set \(x=0\).'
    explanation: '\(a_n=\dfrac{f^{(n)}(0)}{n!}\).'
  526:
    topic: s11-9
    question: 'Euler''s identity: \(e^{i\theta}=\)'
    A: '\(\cos\theta-i\sin\theta\)'
    B: '\(\cosh\theta+i\sinh\theta\)'
    C: '\(\sin\theta+i\cos\theta\)'
    D: '\(\cos\theta+i\sin\theta\)'
    answer: D
    hint: 'Compare the series for \(e^{i\theta}\) with those of \(\cos\) and \(\sin\).'
    explanation: Real and imaginary parts give the cosine and sine series.
  527:
    topic: s11-9
    question: '\(e^{-i\pi}=\)'
    A: '\(i\)'
    B: '\(-1\)'
    C: '\(1\)'
    D: '\(-i\)'
    answer: B
    hint: '\(e^{i\theta}=\cos\theta+i\sin\theta\) with \(\theta=-\pi\).'
    explanation: '\(\cos(-\pi)+i\sin(-\pi)=-1\).'
  528:
    topic: s11-9
    question: '\(e^{i\pi/4}=\)'
    A: '\(\dfrac{\sqrt2}2(1+i)\)'
    B: '\(\dfrac12(1+i)\)'
    C: '\(\sqrt2(1+i)\)'
    D: '\(\dfrac{\sqrt2}2(1-i)\)'
    answer: A
    hint: '\(\cos\tfrac\pi4=\sin\tfrac\pi4=\tfrac{\sqrt2}2\).'
    explanation: "Use Euler's identity."
  529:
    topic: s11-9
    question: '\(e^{-i\pi/2}=\)'
    A: '\(-1\)'
    B: '\(1\)'
    C: '\(i\)'
    D: '\(-i\)'
    answer: D
    hint: '\(\cos(-\tfrac\pi2)=0\), \(\sin(-\tfrac\pi2)=-1\).'
    explanation: "Euler's identity."
  530:
    topic: s11-9
    question: 'Euler''s identity gives \(\cos\theta=\)'
    A: '\(\dfrac{e^{i\theta}+e^{-i\theta}}{2i}\)'
    B: '\(\dfrac{e^{i\theta}+e^{-i\theta}}2\)'
    C: '\(\dfrac{e^{i\theta}-e^{-i\theta}}2\)'
    D: '\(e^{i\theta}+e^{-i\theta}\)'
    answer: B
    hint: 'Add \(e^{i\theta}\) and \(e^{-i\theta}\).'
    explanation: The sine terms cancel.
  531:
    topic: s11-9
    question: 'Euler''s identity gives \(\sin\theta=\)'
    A: '\(\dfrac{e^{i\theta}-e^{-i\theta}}{2}\)'
    B: '\(\dfrac{e^{i\theta}+e^{-i\theta}}{2i}\)'
    C: '\(\dfrac{e^{i\theta}-e^{-i\theta}}{i}\)'
    D: '\(\dfrac{e^{i\theta}-e^{-i\theta}}{2i}\)'
    answer: D
    hint: 'Subtract \(e^{-i\theta}\) from \(e^{i\theta}\).'
    explanation: 'The cosine terms cancel, leaving \(2i\sin\theta\).'
  532:
    topic: s11-9
    question: '\(\cosh i\theta=\)'
    A: '\(i\sin\theta\)'
    B: '\(-\cos\theta\)'
    C: '\(\cos\theta\)'
    D: '\(\cosh\theta\)'
    answer: C
    hint: '\(\cosh z=\dfrac{e^z+e^{-z}}2\).'
    explanation: '\(\dfrac{e^{i\theta}+e^{-i\theta}}2=\cos\theta\).'
  533:
    topic: s11-9
    question: '\(\sinh i\theta=\)'
    A: '\(\sin\theta\)'
    B: '\(-i\sin\theta\)'
    C: '\(\sinh\theta\)'
    D: '\(i\sin\theta\)'
    answer: D
    hint: '\(\sinh z=\dfrac{e^z-e^{-z}}2\).'
    explanation: '\(\dfrac{e^{i\theta}-e^{-i\theta}}2=i\sin\theta\).'
  534:
    topic: s11-9
    question: '\(\displaystyle\lim_{x\to0}\dfrac{x-\tan^{-1}x}{x^3}=\)'
    A: '\(0\)'
    B: '\(\dfrac13\)'
    C: '\(1\)'
    D: '\(\dfrac16\)'
    answer: B
    hint: 'Use \(\tan^{-1}x=x-\dfrac{x^3}3+\cdots\).'
    explanation: '\(\dfrac{x^3/3}{x^3}\to\tfrac13\).'
  535:
    topic: s11-9
    question: 'Using \(e^{(a+ib)x}=e^{ax}(\cos bx+i\sin bx)\), \(\displaystyle\int e^{ax}\cos bx\,dx=\)'
    A: '\(\dfrac{e^{ax}\cos bx}{a}+C\)'
    B: '\(\dfrac{e^{ax}(b\cos bx+a\sin bx)}{a^2+b^2}+C\)'
    C: '\(\dfrac{e^{ax}(a\cos bx-b\sin bx)}{a^2+b^2}+C\)'
    D: '\(\dfrac{e^{ax}(a\cos bx+b\sin bx)}{a^2+b^2}+C\)'
    answer: D
    hint: 'Take the real part of \(\displaystyle\int e^{(a+ib)x}dx=\dfrac{a-ib}{a^2+b^2}e^{(a+ib)x}\).'
    explanation: 'Real part of \((a-ib)(\cos bx+i\sin bx)\) is \(a\cos bx+b\sin bx\).'
  536:
    topic: s11-9
    question: '\(\dfrac d{dx}e^{(a+ib)x}=\)'
