    topic: s11-5
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\left(\dfrac{n-2}n\right)^n\) —'
    A: converges
    B: diverges
    answer: A
    hint: Root test.
    explanation: '\(\sqrt[n]{a_n}=\dfrac{n-2}n\to1\); but \(a_n\to e^{-2}\ne0\). Hence it diverges.'
