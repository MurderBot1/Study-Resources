    B: '\(1-\dfrac2{3x}+\dfrac4{9x^2}-\dfrac{40}{81x^3}\)'
    C: '\(1+\dfrac2{3x}-\dfrac4{9x^2}+\dfrac{40}{81x^3}\)'
