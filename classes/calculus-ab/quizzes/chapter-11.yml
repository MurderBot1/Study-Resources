    explanation: 'Expand: \(x^{4} + 4 x^{3} + 6 x^{2} + 4 x + 1\).'
  548:
    topic: s11-10
    question: 'The binomial series of \((1+x^2)^3\) is the polynomial'
    A: '\(1 + 6x^{2} + 72x^{4} + 720x^{6}\)'
    B: '\(1 + 3x^{2} + 3x^{4} + x^{6}\)'
    C: '\(1 + \dfrac{3x^{2}}{2} + 3x^{4} + x^{6}\)'
    D: '\(2 + 3x^{2} + 3x^{4} + x^{6}\)'
    answer: B
    hint: For a positive integer exponent the binomial series terminates (Binomial Theorem).
    explanation: 'Expand: \(x^{6} + 3 x^{4} + 3 x^{2} + 1\).'
  549:
    topic: s11-10
    question: 'The binomial series of \((1-2x)^3\) is the polynomial'
    A: '\(1 - 12x + 12x^{2} - 8x^{3}\)'
    B: '\(1 + 6x + 12x^{2} + 8x^{3}\)'
    C: '\(1 - 6x + 12x^{2} - 8x^{3}\)'
    D: '\(2 - 6x + 12x^{2} - 8x^{3}\)'
    answer: C
    hint: For a positive integer exponent the binomial series terminates (Binomial Theorem).
    explanation: 'Expand: \(- 8 x^{3} + 12 x^{2} - 6 x + 1\).'
  550:
    topic: s11-10
    question: 'The binomial series of \(\left(1-\dfrac x2\right)^4\) is the polynomial'
    A: '\(1 - 2x + \dfrac{3x^{2}}{2} - \dfrac{x^{3}}{2} + \dfrac{x^{4}}{16}\)'
    B: '\(2 - 2x + \dfrac{3x^{2}}{2} - \dfrac{x^{3}}{2} + \dfrac{x^{4}}{16}\)'
    C: '\(1 + 2x + \dfrac{3x^{2}}{2} + \dfrac{x^{3}}{2} + \dfrac{x^{4}}{16}\)'
    D: '\(1 - 4x + \dfrac{3x^{2}}{2} - \dfrac{x^{3}}{2} + \dfrac{x^{4}}{16}\)'
    answer: A
    hint: For a positive integer exponent the binomial series terminates (Binomial Theorem).
    explanation: 'Expand: \(\frac{x^{4}}{16} - \frac{x^{3}}{2} + \frac{3 x^{2}}{2} - 2 x + 1\).'
  551:
    topic: s11-10
    question: 'The series solution of \(y''+y=0,\ y(0)=1\) is \(y=\) (closed form)'
    A: '\(e^{x}\)'
    B: '\(e^{- x}\)'
    C: '\(1 - x\)'
    D: '\(e^{- 2 x}\)'
    answer: B
    hint: 'Assume \(y=\sum a_nx^n\) and match coefficients.'
    explanation: '\(a_{n+1}=-\dfrac{a_n}{n+1}\), giving \(\sum\dfrac{(-x)^n}{n!}=e^{-x}\).'
  552:
    topic: s11-10
    question: 'The series solution of \(y''-2y=0,\ y(0)=1\) is \(y=\) (closed form)'
    A: '\(e^{x}\)'
    B: '\(e^{- 2 x}\)'
    C: '\(e^{2 x}\)'
    D: '\(2 x + 1\)'
    answer: C
    hint: '\(a_{n+1}=\dfrac{2a_n}{n+1}\).'
    explanation: '\(a_n=\dfrac{2^n}{n!}\).'
  553:
    topic: s11-10
    question: 'The series solution of \(y''-y=1,\ y(0)=0\) is \(y=\) (closed form)'
    A: '\(e^{x} + 1\)'
    B: '\(1 - e^{x}\)'
    C: '\(e^{x} - 1\)'
    D: '\(-1 + e^{- x}\)'
    answer: C
    hint: 'Match coefficients: \(a_1=1\), \(a_{n+1}=\dfrac{a_n}{n+1}\).'
    explanation: '\(y=\sum_{n\ge1}\dfrac{x^n}{n!}=e^x-1\).'
  554:
    topic: s11-10
    question: 'The series solution of \(y''+y=1,\ y(0)=2\) is \(y=\) (closed form)'
    A: '\(1 + e^{- x}\)'
    B: '\(e^{- x}\)'
    C: '\(1 - e^{- x}\)'
    D: '\(2 e^{- x}\)'
    answer: A
    hint: Match coefficients.
    explanation: '\(y=1+e^{-x}\).'
  555:
    topic: s11-10
    question: 'The series solution of \(y''-y=x,\ y(0)=0\) is \(y=\) (closed form)'
    A: '\(x + e^{x} + 1\)'
    B: '\(\frac{x^{2}}{2}\)'
    C: '\(- x + e^{x}\)'
    D: '\(- x + e^{x} - 1\)'
    answer: D
    hint: Match coefficients.
    explanation: '\(y=e^x-1-x=\dfrac{x^2}{2!}+\dfrac{x^3}{3!}+\cdots\).'
  556:
    topic: s11-10
    question: 'The series solution of \(y''-xy=0,\ y(0)=1\) is \(y=\) (closed form)'
    A: '\(e^{\frac{x^{2}}{2}}\)'
    B: '\(e^{- \frac{x^{2}}{2}}\)'
    C: '\(e^{x}\)'
    D: '\(e^{x^{2}}\)'
    answer: A
    hint: '\(a_{n+1}=\dfrac{a_{n-1}}{n+1}\).'
    explanation: '\(y=\sum\dfrac{x^{2n}}{2^nn!}\).'
  557:
    topic: s11-10
    question: 'The series solution of \(y''-x^2y=0,\ y(0)=1\) is \(y=\) (closed form)'
    A: '\(e^{x^{3}}\)'
    B: '\(e^{\frac{x^{3}}{3}}\)'
    C: '\(e^{\frac{x^{2}}{2}}\)'
    D: '\(e^{- \frac{x^{3}}{3}}\)'
    answer: B
    hint: 'Only powers of \(x^3\) appear.'
    explanation: '\(y=\sum\dfrac{x^{3n}}{3^nn!}\).'
  558:
    topic: s11-10
    question: 'The series solution of \((1-x)y''-y=0,\ y(0)=2\) is \(y=\) (closed form)'
    A: '\(\frac{1}{1 - x}\)'
    B: '\(\frac{2}{x + 1}\)'
    C: '\(\frac{2}{1 - x}\)'
    D: '\(2 - 2 x\)'
    answer: C
    hint: '\(a_{n+1}=a_n\).'
    explanation: '\(y=2\sum x^n=\dfrac2{1-x}\).'
  559:
    topic: s11-10
    question: 'The series solution of \((1+x^2)y''+2xy=0,\ y(0)=3\) is \(y=\) (closed form)'
    A: '\(\frac{3}{1 - x^{2}}\)'
    B: '\(\frac{3}{x + 1}\)'
    C: '\(\frac{3}{x^{2} + 1}\)'
    D: '\(3 x^{2} + 3\)'
    answer: C
    hint: 'The equation says \(\left((1+x^2)y\right)''=0\).'
    explanation: '\(y=\dfrac3{1+x^2}=3\sum(-1)^nx^{2n}\).'
  560:
    topic: s11-10
    question: 'The series solution of \(y''''-y=0,\ y''(0)=1,\ y(0)=0\) is \(y=\) (closed form)'
    A: '\(\sin{\left(x \right)}\)'
    B: '\(\cosh{\left(x \right)}\)'
    C: '\(e^{x}\)'
    D: '\(\sinh{\left(x \right)}\)'
    answer: D
    hint: 'Match coefficients: \(a_{n+2}=\dfrac{a_n}{(n+1)(n+2)}\).'
    explanation: '\(y=\sum\dfrac{x^{2n+1}}{(2n+1)!}=\sinh x\).'
  561:
    topic: s11-10
    question: 'The series solution of \(y''''+y=0,\ y''(0)=0,\ y(0)=1\) is \(y=\) (closed form)'
    A: '\(\cosh{\left(x \right)}\)'
    B: '\(\cos{\left(x \right)}\)'
    C: '\(\sin{\left(x \right)}\)'
    D: '\(1 - \frac{x^{2}}{2}\)'
    answer: B
    hint: 'Match coefficients: \(a_{n+2}=-\dfrac{a_n}{(n+1)(n+2)}\).'
    explanation: '\(y=\sum\dfrac{(-1)^nx^{2n}}{(2n)!}=\cos x\).'
  562:
    topic: s11-10
    question: 'The series solution of \(y''''+y=x,\ y''(0)=1,\ y(0)=2\) is \(y=\) (closed form)'
    A: '\(x + 2 \cos{\left(x \right)}\)'
    B: '\(x - 2 \cos{\left(x \right)}\)'
    C: '\(x + 2 \sin{\left(x \right)}\)'
    D: '\(2 \cos{\left(x \right)}\)'
    answer: A
    hint: 'Try \(y=x+c_1\cos x+c_2\sin x\).'
    explanation: '\(y''(0)=1\) gives \(c_2=0\), and \(y(0)=2\) gives \(c_1=2\).'
  563:
    topic: s11-10
    question: 'The series solution of \(y''''-y=x,\ y''(0)=2,\ y(0)=-1\) is \(y=\) (closed form)'
    A: '\(x - 1\)'
    B: '\(x + e^{x} - 2 e^{- x}\)'
    C: '\(- x + e^{x} + 2 e^{- x}\)'
    D: '\(- x + e^{x} - 2 e^{- x}\)'
    answer: D
    hint: 'Particular solution \(-x\), homogeneous \(Ae^x+Be^{-x}\).'
    explanation: '\(A+B=-1\), \(-1+A-B=2\), so \(A=1\), \(B=-2\).'
  564:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^{0.2}\sin x^2\,dx\) (five decimals) is about'
    A: '\(0.00239\)'
    B: '\(0.00267\)'
    C: '\(0.01267\)'
    D: '\(0.00294\)'
    answer: B
    hint: '\(\sin x^2=x^2-\dfrac{x^6}6+\cdots\).'
    explanation: '\(\dfrac{x^3}3-\dfrac{x^7}{42}+\cdots\) at \(0.2\). The value is \(0.00267\).'
  565:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^{0.2}\dfrac{e^{-x}-1}x\,dx\) (five decimals) is about'
    A: '\(-0.18043\)'
    B: '\(-0.1714\)'
    C: '\(-0.19043\)'
    D: '\(-0.20946\)'
    answer: C
    hint: '\(\dfrac{e^{-x}-1}x=-1+\dfrac x2-\dfrac{x^2}6+\cdots\).'
    explanation: 'Integrate term by term. The value is \(-0.19043\).'
  566:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^{0.1}\dfrac1{\sqrt{1+x^4}}\,dx\) (five decimals) is about'
    A: '\(0.08999\)'
    B: '\(0.11001\)'
    C: '\(0.11\)'
    D: '\(0.1\)'
    answer: D
    hint: '\(\dfrac1{\sqrt{1+x^4}}=1-\dfrac{x^4}2+\cdots\).'
    explanation: '\(0.1-\dfrac{(0.1)^5}{10}+\cdots\). The value is \(0.10000\).'
  567:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^{0.25}\sqrt[3]{1+x^2}\,dx\) (five decimals) is about'
    A: '\(0.25171\)'
    B: '\(0.22653\)'
    C: '\(0.2769\)'
    D: '\(0.26171\)'
    answer: A
    hint: '\((1+x^2)^{1/3}=1+\dfrac{x^2}3-\dfrac{x^4}9+\cdots\).'
    explanation: 'Integrate term by term. The value is \(0.25171\).'
  568:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^{0.1}\dfrac{\sin x}x\,dx\) (five decimals) is about'
    A: '\(0.09994\)'
    B: '\(0.10994\)'
    C: '\(0.08994\)'
    D: '\(0.10995\)'
    answer: A
    hint: '\(\dfrac{\sin x}x=1-\dfrac{x^2}6+\dfrac{x^4}{120}-\cdots\).'
    explanation: '\(0.1-\dfrac{(0.1)^3}{18}+\cdots\). The value is \(0.09994\).'
  569:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^{0.1}e^{-x^2}\,dx\) (five decimals) is about'
    A: '\(0.09967\)'
    B: '\(0.10964\)'
    C: '\(0.10967\)'
    D: '\(0.08969\)'
    answer: A
    hint: '\(e^{-x^2}=1-x^2+\dfrac{x^4}2-\cdots\).'
    explanation: '\(0.1-\dfrac{(0.1)^3}3+\cdots\). The value is \(0.09967\).'
  570:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^{0.1}\sqrt{1+x^4}\,dx\) (five decimals) is about'
    A: '\(0.11001\)'
    B: '\(0.08999\)'
    C: '\(0.1\)'
    D: '\(0.11\)'
    answer: C
    hint: '\(\sqrt{1+x^4}=1+\dfrac{x^4}2-\cdots\).'
    explanation: '\(0.1+\dfrac{(0.1)^5}{10}\). The value is \(0.10000\).'
  571:
    topic: s11-10
    question: 'Using power series, the value of \(\displaystyle\int_0^1\dfrac{1-\cos x}{x^2}\,dx\) (five decimals) is about'
    A: '\(0.48639\)'
    B: '\(0.53503\)'
    C: '\(0.49639\)'
    D: '\(0.43774\)'
    answer: A
    hint: '\(\dfrac{1-\cos x}{x^2}=\dfrac12-\dfrac{x^2}{24}+\dfrac{x^4}{720}-\cdots\).'
    explanation: 'Integrate: \(\dfrac12-\dfrac1{72}+\dfrac1{3600}-\cdots\). The value is \(0.48639\).'
  572:
    topic: s11-10
    question: 'The error in approximating \(\displaystyle\int_0^1\cos t^2\,dt\) by \(\displaystyle\int_0^1\left(1-\dfrac{t^4}2+\dfrac{t^8}{24}\right)dt\) is less than (in units of \(10^{-4}\), two decimals)'
    A: '\(2.14\)'
    B: '\(0.53\)'
    C: '\(1.07\)'
    D: '\(10.7\)'
    answer: C
    hint: 'The next term of the alternating series is \(-\dfrac{t^{12}}{720}\).'
    explanation: '\(\displaystyle\int_0^1\dfrac{t^{12}}{720}dt=\dfrac1{13\cdot720}\approx1.07\times10^{-4}\).'
  573:
    topic: s11-10
    question: 'The error in approximating \(\displaystyle\int_0^1\cos\sqrt t\,dt\) by \(\displaystyle\int_0^1\left(1-\dfrac t2+\dfrac{t^2}{4!}-\dfrac{t^3}{6!}\right)dt\) is less than (in units of \(10^{-6}\), two decimals)'
    A: '\(2.48\)'
    B: '\(49.6\)'
    C: '\(4.96\)'
    D: '\(9.92\)'
    answer: C
    hint: 'The next term is \(\dfrac{t^4}{8!}\).'
    explanation: '\(\displaystyle\int_0^1\dfrac{t^4}{40320}dt=\dfrac1{5\cdot40320}\approx4.96\times10^{-6}\).'
  574:
    topic: s11-10
    question: 'A polynomial approximating \(F(x)=\displaystyle\int_0^x\sin t^2\,dt\) with error \(<10^{-3}\) on \([0,1]\) is'
    A: '\(\dfrac{x^3}3-\dfrac{x^7}{42}\)'
    B: '\(\dfrac{x^3}3+\dfrac{x^7}{42}\)'
    C: '\(\dfrac{x^3}3\)'
    D: '\(\dfrac{x^3}3-\dfrac{x^7}{7}\)'
    answer: A
    hint: '\(\sin t^2=t^2-\dfrac{t^6}6+\dfrac{t^{10}}{120}-\cdots\); the next term integrates to \(\dfrac{x^{11}}{1320}\).'
    explanation: '\(\dfrac{1}{1320}\approx7.6\times10^{-4}<10^{-3}\).'
  575:
    topic: s11-10
    question: 'To estimate \(\ln(1.1)\) with error less than \(10^{-8}\) using \(\ln(1+x)=x-\dfrac{x^2}2+\dfrac{x^3}3-\cdots\) at \(x=0.1\), the number of terms needed is'
    A: '\(10\)'
    B: '\(8\)'
    C: '\(7\)'
    D: '\(5\)'
    answer: C
    hint: 'The error is less than the first omitted term \(\dfrac{(0.1)^k}k\).'
    explanation: '\(\dfrac{(0.1)^8}8=1.25\times10^{-9}<10^{-8}\), while \(\dfrac{(0.1)^7}7\approx1.4\times10^{-8}\) is too big; so \(7\) terms.'
  576:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{x\to0}\dfrac{e^x-(1+x)}{x^2}\).'
    A: '\(\infty\)'
    B: '\(0\)'
    C: '\(1\)'
    D: '\(\dfrac12\)'
    answer: D
    hint: '\(e^x-1-x=\dfrac{x^2}2+\dfrac{x^3}6+\cdots\).'
    explanation: 'Divide by \(x^2\).'
  577:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{x\to0}\dfrac{e^x-e^{-x}}x\).'
    A: '\(\infty\)'
    B: '\(0\)'
    C: '\(1\)'
    D: '\(2\)'
    answer: D
    hint: '\(e^x-e^{-x}=2x+\dfrac{x^3}3+\cdots\).'
    explanation: 'Divide by \(x\).'
  578:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{t\to0}\dfrac{1-\cos t-\frac{t^2}2}{t^4}\).'
    A: '\(0\)'
    B: '\(\dfrac1{24}\)'
    C: '\(-\dfrac12\)'
    D: '\(-\dfrac1{24}\)'
    answer: D
    hint: '\(1-\cos t=\dfrac{t^2}2-\dfrac{t^4}{24}+\cdots\).'
    explanation: 'The numerator is \(-\dfrac{t^4}{24}+\cdots\).'
  579:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{\theta\to0}\dfrac{\sin\theta-\theta+\frac{\theta^3}6}{\theta^5}\).'
    A: '\(\dfrac16\)'
    B: '\(0\)'
    C: '\(-\dfrac1{120}\)'
    D: '\(\dfrac1{120}\)'
    answer: D
    hint: '\(\sin\theta=\theta-\dfrac{\theta^3}6+\dfrac{\theta^5}{120}-\cdots\).'
    explanation: 'The numerator is \(\dfrac{\theta^5}{120}+\cdots\).'
  580:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{y\to0}\dfrac{y-\tan^{-1}y}{y^3}\).'
    A: '\(0\)'
    B: '\(-\dfrac13\)'
    C: '\(\dfrac13\)'
    D: '\(1\)'
    answer: C
    hint: '\(\tan^{-1}y=y-\dfrac{y^3}3+\cdots\).'
    explanation: 'The numerator is \(\dfrac{y^3}3+\cdots\).'
  581:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{y\to0}\dfrac{\tan^{-1}y-\sin y}{y^3\cos y}\).'
    A: '\(0\)'
    B: '\(\dfrac13\)'
    C: '\(\dfrac16\)'
    D: '\(-\dfrac16\)'
    answer: D
    hint: '\(\tan^{-1}y-\sin y=\left(y-\tfrac{y^3}3\right)-\left(y-\tfrac{y^3}6\right)+\cdots\).'
    explanation: 'The numerator is \(-\dfrac{y^3}6+\cdots\) and \(\cos y\to1\).'
  582:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{x\to\infty}x^2\left(e^{-1/x^2}-1\right)\).'
    A: '\(\infty\)'
    B: '\(0\)'
    C: '\(1\)'
    D: '\(-1\)'
    answer: D
    hint: 'Let \(u=\dfrac1{x^2}\): \(e^{-u}-1=-u+\cdots\).'
    explanation: '\(x^2(-x^{-2})=-1\).'
  583:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{x\to\infty}(x+1)\sin\dfrac1{x+1}\).'
    A: '\(1\)'
    B: '\(-1\)'
    C: '\(0\)'
    D: '\(\infty\)'
    answer: A
    hint: 'Let \(t=\dfrac1{x+1}\).'
    explanation: '\(\dfrac{\sin t}t\to1\).'
  584:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{x\to0}\dfrac{\ln(1+x^2)}{1-\cos x}\).'
    A: '\(1\)'
    B: '\(0\)'
    C: '\(2\)'
    D: '\(\dfrac12\)'
    answer: C
    hint: '\(\ln(1+x^2)\approx x^2\) and \(1-\cos x\approx\dfrac{x^2}2\).'
    explanation: 'The ratio tends to \(2\).'
  585:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{x\to2}\dfrac{x^2-4}{\ln(x-1)}\).'
    A: '\(1\)'
    B: '\(2\)'
    C: '\(4\)'
    D: '\(0\)'
    answer: C
    hint: 'Let \(t=x-2\): \(\ln(1+t)=t-\dfrac{t^2}2+\cdots\).'
    explanation: '\(\dfrac{t(t+4)}{t}\to4\).'
  586:
    topic: s11-10
    question: 'Use series to evaluate \(\displaystyle\lim_{x\to0}\dfrac{\sin x-x}{x^3}\).'
    A: '\(0\)'
    B: '\(-\dfrac16\)'
    C: '\(-\dfrac12\)'
    D: '\(\dfrac16\)'
    answer: B
    hint: '\(\sin x-x=-\dfrac{x^3}6+\cdots\).'
    explanation: 'Divide by \(x^3\).'
  587:
    topic: s11-10
    question: 'Replacing \(x\) by \(-x\) in the series for \(\ln(1+x)\) and subtracting from it gives, for \(|x|<1\),'
    A: '\(\ln(1-x^2)=-x^2-\dfrac{x^4}2-\cdots\)'
    B: '\(\ln\dfrac{1+x}{1-x}=2\left(x-\dfrac{x^3}3+\dfrac{x^5}5-\cdots\right)\)'
    C: '\(\ln\dfrac{1+x}{1-x}=x+\dfrac{x^3}3+\cdots\)'
    D: '\(\ln\dfrac{1+x}{1-x}=2\left(x+\dfrac{x^3}3+\dfrac{x^5}5+\cdots\right)\)'
    answer: D
    hint: '\(\ln(1+x)-\ln(1-x)\): even powers cancel.'
    explanation: Odd powers double.
  588:
    topic: s11-10
    question: 'The Taylor series of \(\tan^{-1}x\) diverges for \(|x|>1\) because'
    A: the series is alternating
    B: '\(\tan^{-1}x\) is undefined for \(|x|>1\)'
    C: 'its radius of convergence is \(1\) (the terms \(\dfrac{x^{2n+1}}{2n+1}\) grow without bound when \(|x|>1\))'
    D: 'its radius is \(\pi\)'
    answer: C
    hint: Apply the ratio test.
    explanation: '\(\left|\dfrac{x^{2n+3}}{x^{2n+1}}\right|\to x^2>1\).'
  589:
    topic: s11-10
    question: 'For \(x>1\), \(\tan^{-1}x=\)'
    A: '\(\dfrac\pi2-\dfrac1x+\dfrac1{3x^3}-\dfrac1{5x^5}+\cdots\)'
    B: '\(-\dfrac\pi2-\dfrac1x+\dfrac1{3x^3}-\cdots\)'
    C: '\(x-\dfrac{x^3}3+\dfrac{x^5}5-\cdots\)'
    D: '\(\dfrac\pi2+\dfrac1x-\dfrac1{3x^3}+\cdots\)'
    answer: A
    hint: 'Integrate \(\dfrac1{1+t^2}=\dfrac1{t^2}-\dfrac1{t^4}+\cdots\) from \(x\) to \(\infty\).'
    explanation: '\(\tan^{-1}x=\dfrac\pi2-\displaystyle\int_x^\infty\dfrac{dt}{1+t^2}\).'
  590:
    topic: s11-10
    question: 'The Maclaurin series of \(\dfrac1{(1+x)^2}\) is'
    A: '\(\displaystyle\sum_{n=0}^\infty(n+1)x^n\)'
    B: '\(\displaystyle\sum_{n=0}^\infty\dfrac{(-1)^nx^n}{n+1}\)'
    C: '\(\displaystyle\sum_{n=0}^\infty(-1)^nnx^n\)'
    D: '\(\displaystyle\sum_{n=0}^\infty(-1)^n(n+1)x^n\)'
    answer: D
    hint: 'Differentiate \(\dfrac1{1+x}=\sum(-x)^n\) and change sign.'
    explanation: '\(-\dfrac d{dx}\dfrac1{1+x}=\dfrac1{(1+x)^2}\).'
  591:
    topic: s11-10
    question: 'The first 4 nonzero terms of the Maclaurin series of \(\sin^{-1}x\) are'
    A: '\(x + \frac{x^{3}}{12} + \frac{3 x^{5}}{40} + \frac{5 x^{7}}{112}\)'
    B: '\(x - \frac{x^{3}}{6} + \frac{3 x^{5}}{40} - \frac{5 x^{7}}{112}\)'
    C: '\(x + \frac{x^{3}}{6} + \frac{3 x^{5}}{40} + \frac{5 x^{7}}{112}\)'
    D: '\(x + \frac{x^{3}}{6} + \frac{3 x^{5}}{20} + \frac{5 x^{7}}{112}\)'
    answer: C
    hint: 'Integrate the binomial series for \((1-x^2)^{-1/2}\).'
    explanation: '\(x+\dfrac{x^3}6+\dfrac{3x^5}{40}+\dfrac{5x^7}{112}\), valid for \(|x|<1\).'
  592:
    topic: s11-10
    question: 'The Maclaurin series of \(\cos^{-1}x\) begins'
    A: '\(1-\dfrac{x^2}2+\dfrac{x^4}{24}-\cdots\)'
    B: '\(\dfrac\pi2+x+\dfrac{x^3}6+\cdots\)'
    C: '\(\dfrac\pi2-x-\dfrac{x^3}6-\dfrac{3x^5}{40}-\dfrac{5x^7}{112}-\cdots\)'
    D: '\(\pi-x-\dfrac{x^3}6-\cdots\)'
    answer: C
    hint: '\(\cos^{-1}x=\dfrac\pi2-\sin^{-1}x\).'
    explanation: 'Subtract the series for \(\sin^{-1}x\) from \(\tfrac\pi2\).'
  593:
    topic: s11-10
    question: 'The first 4 nonzero terms of the Maclaurin series of \(\sinh^{-1}x\) are'
    A: '\(x - \frac{x^{3}}{6} + \frac{3 x^{5}}{40} - \frac{5 x^{7}}{112}\)'
    B: '\(x + \frac{x^{3}}{6} + \frac{3 x^{5}}{40} + \frac{5 x^{7}}{112}\)'
    C: '\(x - \frac{x^{3}}{6} + \frac{3 x^{5}}{20} - \frac{5 x^{7}}{112}\)'
    D: '\(x - \frac{x^{3}}{12} + \frac{3 x^{5}}{40} - \frac{5 x^{7}}{112}\)'
    answer: A
    hint: 'Integrate the binomial series for \((1+t^2)^{-1/2}\).'
    explanation: '\(x-\dfrac{x^3}6+\dfrac{3x^5}{40}-\dfrac{15x^7}{336}\).'
  594:
    topic: s11-10
    question: 'By the Taylor series of \(\tan^{-1}x\) at \(x=1\), the series \(1-\dfrac13+\dfrac15-\dfrac17+\cdots\) sums to'
    A: '\(\dfrac\pi4\)'
    B: '\(\dfrac\pi2\)'
    C: '\(\ln2\)'
    D: '\(1\)'
    answer: A
    hint: '\(\tan^{-1}1=\dfrac\pi4\).'
    explanation: "The Gregory–Leibniz series."
  595:
    topic: s11-10
    question: 'The sum \(\displaystyle\sum_{n=1}^\infty\tan^{-1}\dfrac2{n^2}\) equals'
    A: '\(\dfrac\pi2\)'
    B: '\(\dfrac\pi4\)'
    C: '\(\dfrac{3\pi}4\)'
    D: '\(\pi\)'
    answer: C
    hint: '\(\tan^{-1}\dfrac2{n^2}=\tan^{-1}(n+1)-\tan^{-1}(n-1)\).'
    explanation: 'The partial sums are \(\tan^{-1}(N+1)+\tan^{-1}N-\tfrac\pi4\to\tfrac\pi2+\tfrac\pi2-\tfrac\pi4\).'
  596:
    topic: s11-10
    question: 'Wallis''s formula says \(\dfrac\pi4=\)'
    A: '\(\dfrac{1\cdot2\cdot3\cdot4\cdots}{2\cdot3\cdot4\cdot5\cdots}\)'
    B: '\(\dfrac{2\cdot2\cdot4\cdot4\cdots}{3\cdot5\cdot7\cdots}\)'
    C: '\(\dfrac{1\cdot3\cdot3\cdot5\cdot5\cdots}{2\cdot2\cdot4\cdot4\cdots}\)'
    D: '\(\dfrac{2\cdot4\cdot4\cdot6\cdot6\cdot8\cdots}{3\cdot3\cdot5\cdot5\cdot7\cdot7\cdots}\)'
    answer: D
    hint: 'A product representation of \(\pi\).'
    explanation: 'Truncating the product gives approximations of \(\pi\).'
  597:
    topic: s11-10
    question: 'The number of terms of the series for \(\tan^{-1}x\) needed to get \(\pi\) from \(\pi=48\tan^{-1}\tfrac1{18}+32\tan^{-1}\tfrac1{57}-20\tan^{-1}\tfrac1{239}\) with error \(<10^{-6}\) is'
    A: 'only a few (about 3 terms each), because the arguments \(\tfrac1{18},\tfrac1{57},\tfrac1{239}\) are small'
    B: about 1000 terms
    C: infinitely many
    D: about 500,000 terms
    answer: A
    hint: 'The error is below the first omitted term \(\dfrac{x^{2k+1}}{2k+1}\), multiplied by the coefficient.'
    explanation: 'Compare with \(\sum\tfrac1{n^2}=\tfrac{\pi^2}6\), which converges so slowly that 50 terms do not give two-place accuracy.'
  598:
    topic: s11-11
    question: 'The Fourier series of the constant function \(f(x)=1\) on \([0,2\pi]\) is'
    A: '\(\dfrac2\pi\displaystyle\sum_{k=1}^\infty\dfrac{\sin kx}k\)'
    B: '\(1\) (just the constant term \(\tfrac{a_0}2=1\); all other coefficients vanish)'
    C: '\(\dfrac{4}{\pi}\displaystyle\sum\dfrac{\sin(2k-1)x}{2k-1}\)'
    D: '\(\dfrac12+\cos x\)'
    answer: B
    hint: 'The Fourier series of \(f\) on \([0,2\pi]\) is \(\dfrac{a_0}2+\displaystyle\sum_{k=1}^\infty(a_k\cos kx+b_k\sin kx)\) with \(a_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\cos kx\,dx\) and \(b_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\sin kx\,dx\).'
    explanation: '\(a_0=\dfrac1\pi\cdot2\pi=2\), and \(\displaystyle\int_0^{2\pi}\cos kx\,dx=\int_0^{2\pi}\sin kx\,dx=0\).'
  599:
    topic: s11-11
    question: 'For \(f(x)=1\) on \([0,\pi]\) and \(-1\) on \((\pi,2\pi]\), the Fourier series is'
    A: '\(\dfrac4\pi\displaystyle\sum_{k=1}^\infty\dfrac{\sin(2k-1)x}{2k-1}\)'
    B: '\(\dfrac2\pi\displaystyle\sum_{k=1}^\infty\dfrac{\sin(2k-1)x}{2k-1}\)'
    C: '\(\dfrac4\pi\displaystyle\sum_{k=1}^\infty\dfrac{\cos(2k-1)x}{2k-1}\)'
    D: '\(\dfrac4\pi\displaystyle\sum_{k=1}^\infty\dfrac{\sin kx}{k}\)'
    answer: A
    hint: 'The Fourier series of \(f\) on \([0,2\pi]\) is \(\dfrac{a_0}2+\displaystyle\sum_{k=1}^\infty(a_k\cos kx+b_k\sin kx)\) with \(a_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\cos kx\,dx\) and \(b_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\sin kx\,dx\).'
    explanation: '\(a_k=0\) and \(b_k=\dfrac2{k\pi}\left(1-(-1)^k\right)\), which is \(\dfrac4{k\pi}\) for odd \(k\) and \(0\) for even \(k\).'
  600:
    topic: s11-11
    question: 'At \(x=\pi\), where \(f\) jumps from \(1\) to \(-1\), the Fourier series of that square wave converges to'
    A: '\(1\)'
    B: it diverges
    C: '\(0\), the average of the one-sided limits'
    D: '\(-1\)'
    answer: C
    hint: "Theorem: at a jump the series converges to the average of the left and right limits."
    explanation: '\(\dfrac{1+(-1)}2=0\) (indeed every term \(\sin(2k-1)\pi\) is \(0\)).'
  601:
    topic: s11-11
    question: 'For \(f(x)=x\) on \([0,\pi]\) and \(x-2\pi\) on \((\pi,2\pi]\), the Fourier series is'
    A: '\(2\displaystyle\sum_{k=1}^\infty\dfrac{(-1)^{k}\sin kx}k\)'
    B: '\(\displaystyle\sum_{k=1}^\infty\dfrac{(-1)^{k+1}\sin kx}{k^2}\)'
    C: '\(2\displaystyle\sum_{k=1}^\infty\dfrac{(-1)^{k+1}\cos kx}k\)'
    D: '\(2\displaystyle\sum_{k=1}^\infty\dfrac{(-1)^{k+1}\sin kx}k\)'
    answer: D
    hint: 'The Fourier series of \(f\) on \([0,2\pi]\) is \(\dfrac{a_0}2+\displaystyle\sum_{k=1}^\infty(a_k\cos kx+b_k\sin kx)\) with \(a_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\cos kx\,dx\) and \(b_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\sin kx\,dx\).'
    explanation: '\(a_k=0\) (the function is odd about \(0\) as a periodic function), \(b_k=\dfrac{2(-1)^{k+1}}k\).'
  602:
    topic: s11-11
    question: 'The Fourier series in the previous problem converges to \(f(x)\) for'
    A: '\(0<x<2\pi\) (the series is the "sawtooth")'
    B: 'all real \(x\), including at \(x=\pi\) and \(x=2\pi\) with value \(f\)'
    C: '\(0\le x\le2\pi\)'
    D: 'only \(x=0\)'
    answer: A
    hint: Use the Fourier convergence theorem for piecewise smooth functions.
    explanation: 'At \(x=0\) and \(2\pi\) the series converges to the average of the one-sided limits, \(0\).'
  603:
    topic: s11-11
    question: 'Term-by-term differentiation of the Fourier series \(2\sum\dfrac{(-1)^{k+1}\sin kx}k\) of \(f(x)=x\) gives the series'
    A: '\(1\), as expected'
    B: '\(2\displaystyle\sum\dfrac{(-1)^{k}\sin kx}{k^2}\)'
    C: '\(2\displaystyle\sum\dfrac{(-1)^{k+1}\cos kx}{k}\), which converges to \(1\)'
    D: '\(2\displaystyle\sum_{k=1}^\infty(-1)^{k+1}\cos kx\), which diverges (even though \(f''(x)=1\))'
    answer: D
    hint: 'Differentiate \(\dfrac{\sin kx}k\).'
    explanation: 'The terms \(\cos kx\) do not tend to \(0\).'
  604:
    topic: s11-11
    question: 'For \(f(x)=x^2\) on \([0,\pi]\) and \(0\) on \((\pi,2\pi]\), the constant term \(\dfrac{a_0}2\) of the Fourier series is'
    A: '\(\dfrac{\pi^2}6\)'
    B: '\(\dfrac{\pi^3}{3}\)'
    C: '\(\dfrac{\pi^2}3\)'
    D: '\(\dfrac{\pi}{6}\)'
    answer: A
    hint: '\(a_0=\dfrac1\pi\displaystyle\int_0^\pi x^2dx\).'
    explanation: '\(a_0=\dfrac{\pi^2}3\), so \(\dfrac{a_0}2=\dfrac{\pi^2}6\).'
  605:
    topic: s11-11
    question: 'For that \(f(x)=x^2\) on \([0,\pi]\) (and \(0\) after), \(a_k=\)'
    A: '\(\dfrac{2}{k^2}\)'
    B: '\(\dfrac{(-1)^k}{k}\)'
    C: '\(\dfrac{2(-1)^k}{k^2}\)'
    D: '\(\dfrac{2(-1)^k}{k}\)'
    answer: C
    hint: 'Integrate \(x^2\cos kx\) by parts twice.'
    explanation: '\(\dfrac1\pi\left[\dfrac{x^2\sin kx}k+\dfrac{2x\cos kx}{k^2}-\dfrac{2\sin kx}{k^3}\right]_0^\pi=\dfrac{2(-1)^k}{k^2}\).'
  606:
    topic: s11-11
    question: 'Evaluating the Fourier series of \(f(x)=x^2\) (on \([0,\pi]\), \(0\) on \((\pi,2\pi]\)) at \(x=\pi\), where it converges to \(\dfrac{\pi^2+0}2\), shows that'
    A: '\(\displaystyle\sum_{k=1}^\infty\dfrac1{k^2}=\dfrac{\pi^2}6\)'
    B: '\(\displaystyle\sum_{k=1}^\infty\dfrac1{k}=\dfrac{\pi^2}6\)'
    C: '\(\displaystyle\sum_{k=1}^\infty\dfrac1{k^2}=\dfrac{\pi^2}{12}\)'
    D: '\(\displaystyle\sum_{k=1}^\infty\dfrac1{k^2}=\dfrac{\pi^2}{3}\)'
    answer: A
    hint: 'At \(x=\pi\): \(\dfrac{\pi^2}6+\displaystyle\sum a_k(-1)^k=\dfrac{\pi^2}2\) (the sine terms vanish).'
    explanation: '\(\dfrac{\pi^2}6+2\sum\dfrac1{k^2}=\dfrac{\pi^2}2\).'
  607:
    topic: s11-11
    question: 'For \(f(x)=e^x\) on \([0,2\pi]\), the coefficients are'
    A: '\(a_k=\dfrac{e^{2\pi}+1}{\pi(1+k^2)}\), \(b_k=-\dfrac{k(e^{2\pi}+1)}{\pi(1+k^2)}\)'
    B: '\(a_k=\dfrac{e^{2\pi}-1}{\pi(1+k^2)}\), \(b_k=-\dfrac{k\left(e^{2\pi}-1\right)}{\pi(1+k^2)}\)'
    C: '\(a_k=\dfrac{e^{2\pi}-1}{\pi k^2}\), \(b_k=0\)'
    D: '\(a_k=0\), \(b_k=\dfrac{e^{2\pi}-1}{\pi(1+k^2)}\)'
    answer: B
    hint: 'The Fourier series of \(f\) on \([0,2\pi]\) is \(\dfrac{a_0}2+\displaystyle\sum_{k=1}^\infty(a_k\cos kx+b_k\sin kx)\) with \(a_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\cos kx\,dx\) and \(b_k=\dfrac1\pi\displaystyle\int_0^{2\pi}f(x)\sin kx\,dx\).'
    explanation: 'Use \(\displaystyle\int e^x\cos kx\,dx=\dfrac{e^x(\cos kx+k\sin kx)}{1+k^2}\) and the matching formula for the sine.'
  608:
    topic: s11-11
    question: 'For \(f(x)=e^x\) on \([0,2\pi]\), the constant term \(\dfrac{a_0}2\) is'
    A: '\(\dfrac{e^{\pi}-1}{2\pi}\)'
    B: '\(\dfrac{e^{2\pi}-1}{2\pi}\)'
    C: '\(e^{2\pi}-1\)'
    D: '\(\dfrac{e^{2\pi}-1}{\pi}\)'
    answer: B
    hint: '\(a_0=\dfrac1\pi\displaystyle\int_0^{2\pi}e^xdx\).'
    explanation: '\(a_0=\dfrac{e^{2\pi}-1}\pi\).'
  609:
    topic: s11-11
    question: 'For \(f(x)=e^x\) on \([0,\pi]\) and \(0\) on \((\pi,2\pi]\), the coefficient \(a_k\) is'
    A: '\(\dfrac{(-1)^ke^\pi-1}{\pi k^2}\)'
    B: '\(\dfrac{(-1)^ke^\pi+1}{\pi(1+k^2)}\)'
    C: '\(\dfrac{(-1)^ke^\pi-1}{\pi(1+k^2)}\)'
    D: '\(\dfrac{e^\pi-1}{\pi(1+k^2)}\)'
    answer: C
    hint: 'Integrate \(e^x\cos kx\) over \([0,\pi]\).'
    explanation: '\(\dfrac1\pi\cdot\dfrac{e^\pi(-1)^k-1}{1+k^2}\).'
  610:
    topic: s11-11
    question: 'For \(f(x)=\cos x\) on \([0,\pi]\) and \(0\) on \((\pi,2\pi]\), the coefficients \(a_k\) for \(k\ge2\) are'
    A: '\(\dfrac12\) for every \(k\)'
    B: '\(\dfrac{(-1)^k}{\pi k}\)'
    C: '\(0\) (and \(a_1=\tfrac12\))'
    D: '\(\dfrac1{k^2}\)'
    answer: C
    hint: 'Use \(\cos x\cos kx=\tfrac12[\cos(k-1)x+\cos(k+1)x]\).'
    explanation: 'Each integral over \([0,\pi]\) is \(\dfrac{\sin(k\mp1)\pi}{k\mp1}=0\) for \(k\ge2\); for \(k=1\) the term \(\tfrac12\cos0\) gives \(\tfrac\pi2\), so \(a_1=\tfrac12\).'
  611:
    topic: s11-11
    question: 'For \(f(x)=2\) on \([0,\pi]\) and \(-x\) on \((\pi,2\pi]\), the constant term \(\dfrac{a_0}2\) is'
    A: '\(1+\dfrac{3\pi}4\)'
    B: '\(2-\dfrac{3\pi}2\)'
    C: '\(1-\dfrac{3\pi}4\)'
    D: '\(\dfrac{3\pi}{4}\)'
    answer: C
    hint: '\(\dfrac{a_0}2\) is the average of \(f\) over \([0,2\pi]\).'
    explanation: '\(\dfrac1{2\pi}\left[2\pi-\dfrac{3\pi^2}{2}\right]=1-\dfrac{3\pi}4\).'
  612:
    topic: s11-11
    question: '\(\displaystyle\int_0^{2\pi}\cos px\,dx=\)'
    A: '\(2\pi\)'
    B: '\(0\) for every positive integer \(p\)'
    C: '\(\pi\)'
    D: '\(\dfrac{1}{p}\)'
    answer: B
    hint: '\(\int\cos px\,dx=\dfrac{\sin px}p\).'
    explanation: '\(\sin2p\pi=0\).'
  613:
    topic: s11-11
    question: '\(\displaystyle\int_0^{2\pi}\sin px\,dx=\)'
    A: '\(0\) for every positive integer \(p\)'
    B: '\(\dfrac2p\)'
    C: '\(2\pi\)'
    D: '\(\pi\)'
    answer: A
    hint: '\(\int\sin px\,dx=-\dfrac{\cos px}p\).'
    explanation: '\(\cos2p\pi=\cos0\).'
  614:
    topic: s11-11
    question: '\(\displaystyle\int_0^{2\pi}\cos px\cos qx\,dx=\)'
    A: '\(\pi\) for all \(p,q\)'
    B: '\(0\) for all \(p,q\)'
    C: '\(2\pi\) if \(p=q\)'
    D: '\(0\) if \(p\ne q\) and \(\pi\) if \(p=q\)'
    answer: D
    hint: '\(\cos A\cos B=\tfrac12[\cos(A-B)+\cos(A+B)]\).'
    explanation: 'For \(p=q\), \(\int\tfrac12(1+\cos2px)=\pi\).'
  615:
    topic: s11-11
    question: '\(\displaystyle\int_0^{2\pi}\sin px\sin qx\,dx=\)'
    A: '\(0\) if \(p\ne q\) and \(\pi\) if \(p=q\)'
    B: '\(2\pi\) if \(p=q\)'
    C: '\(\pi\) for all \(p,q\)'
    D: '\(0\) for all \(p,q\)'
    answer: A
    hint: '\(\sin A\sin B=\tfrac12[\cos(A-B)-\cos(A+B)]\).'
    explanation: 'For \(p=q\), \(\int\tfrac12(1-\cos2px)=\pi\).'
  616:
    topic: s11-11
    question: '\(\displaystyle\int_0^{2\pi}\sin px\cos qx\,dx=\)'
    A: '\(\dfrac{1}{p-q}\)'
    B: '\(2\pi\)'
    C: '\(0\) for all positive integers \(p,q\)'
    D: '\(\pi\) if \(p=q\)'
    answer: C
    hint: '\(\sin A\cos B=\tfrac12[\sin(A+B)+\sin(A-B)]\).'
    explanation: 'Each term integrates to \(0\) over a full period.'
  617:
    topic: s11-11
    question: 'If \(f\) and \(g\) both have Fourier series on \([0,2\pi]\), the Fourier series of \(f+g\) is'
    A: 'the sum of the Fourier series of \(f\) and of \(g\)'
    B: 'the Fourier series of \(f\) only'
    C: not defined
    D: their product
    answer: A
    hint: Fourier coefficients are given by integrals, which are linear.
    explanation: '\(a_k(f+g)=a_k(f)+a_k(g)\), and similarly for \(b_k\).'
  618:
    topic: s11-11
    question: 'Since the Fourier coefficients \(a_k,b_k\) come from integrals of \(f(x)\cos kx\) and \(f(x)\sin kx\), a Fourier series is useful for representing'
    A: periodic functions with jump discontinuities, where Taylor series fail
    B: only the exponential function
    C: only polynomials
    D: only functions analytic everywhere
    answer: A
    hint: Taylor series require smoothness; Fourier series require only piecewise smoothness.
    explanation: The square and sawtooth waves are typical examples.
