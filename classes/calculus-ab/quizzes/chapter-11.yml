  507:
    topic: s11-9
    question: 'For \(|x|<0.1\), using \(e^x\approx1+x+\dfrac{x^2}2\), the Remainder Estimation Theorem bounds the error by (use \(e^{0.1}\approx1.105\); in units of \(10^{-4}\), two decimals)'
