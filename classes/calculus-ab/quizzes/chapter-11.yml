    C: '\(\frac{63}{32}\)'
    D: '\(\frac{31}{16}\)'
    answer: D
    hint: 'Compute \(a_2,a_3,a_4,a_5\) in turn.'
    explanation: '\(a_2=\tfrac32\), \(a_3=\tfrac74\), \(a_4=\tfrac{15}8\), \(a_5=\tfrac{31}{16}\).'
