    B: diverges
    C: converges conditionally
    D: 'converges (by comparison with \(\sum\dfrac n{2^n}\))'
    answer: D
    hint: 'Every term is at most \(\dfrac n{2^n}\).'
    explanation: '\(\sum\dfrac n{2^n}=2\) converges.'
