    A: 'are decisive for \(p>1\)'
    B: 'are inconclusive (limits equal \(1\))'
    C: always show convergence
    D: always show divergence
    answer: B
    hint: 'Compute \(\left(\dfrac{\ln n}{\ln(n+1)}\right)^p\).'
    explanation: 'That ratio tends to \(1\).'
