  477:
    topic: s11-8
    question: 'The Taylor polynomial \(P_n\) of order \(n\) generated by \(f\) at \(x=a\) is the only polynomial of degree \(\le n\) such that'
    A: '\(g(x)=f(x)\) for all \(x\)'
    B: '\(g\) has no constant term'
    C: 'the error \(E(x)=f(x)-g(x)\) satisfies \(E(a)=0\) and \(\displaystyle\lim_{x\to a}\dfrac{E(x)}{(x-a)^n}=0\)'
    D: '\(g\) has the largest coefficients'
    answer: C
    hint: 'The best polynomial approximation near \(a\).'
    explanation: 'The error is negligible compared with \((x-a)^n\).'
  478:
    topic: s11-8
    question: 'The Taylor polynomial \(P_n\) and \(f\) have the same value and the same first \(n\) derivatives at \(x=a\). This is because'
    A: '\(P_n^{(k)}(a)=f^{(k)}(a)\) for \(k=0,\dots,n\), by differentiating \(\sum\dfrac{f^{(k)}(a)}{k!}(x-a)^k\)'
    B: '\(P_n\) has the same graph as \(f\)'
    C: '\(P_n\) is chosen to match only \(f(a)\)'
    D: '\(P_n\) is defined by \(f(x)\) for all \(x\)'
    answer: A
    hint: 'Differentiate \(k\) times and set \(x=a\).'
    explanation: 'Only the \(k\)th term survives and equals \(f^{(k)}(a)\).'
  479:
    topic: s11-8
    question: "The Mean Value Theorem is the special case of Taylor's Theorem with"
    A: '\(n=2\)'
    B: '\(n=0\)'
    C: '\(n=\infty\)'
    D: '\(n=1\)'
    answer: B
    hint: '\(f(b)=f(a)+f''(c)(b-a)\).'
    explanation: 'The remainder of order \(0\) is \(R_0=f''(c)(b-a)\).'
  480:
    topic: s11-8
    question: 'If the graph of a twice-differentiable \(f\) has an inflection point at \(x=a\), then the linearization of \(f\) at \(a\)'
    A: 'has no relation to \(f\)'
    B: is different from the quadratic approximation
    C: is the cubic approximation
    D: 'is also its quadratic approximation, since \(f''''(a)=0\)'
    answer: D
    hint: 'At an inflection point \(f''''(a)=0\).'
    explanation: 'The quadratic term \(\dfrac{f''''(a)}2(x-a)^2\) vanishes.'
  481:
    topic: s11-8
    question: 'The (second) second derivative test: if \(f''(a)=0\) and \(f''''\le0\) throughout an interval containing \(a\), then'
    A: '\(f\) has a local maximum at \(a\)'
    B: '\(f\) has an inflection point at \(a\)'
    C: '\(f\) has a local minimum at \(a\)'
    D: nothing can be concluded
    answer: A
    hint: '\(f(x)=f(a)+\dfrac{f''''(c)}2(x-a)^2\).'
    explanation: 'The second term is \(\le0\), so \(f(x)\le f(a)\).'
  482:
    topic: s11-9
    question: 'The Maclaurin series of \(e^{-5x}\) is'
