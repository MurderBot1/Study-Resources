  101:
    topic: s11-1
    question: 'A savings account has \(A_0=1000\), \(r=0.02015\), compounded \(m=12\) times a year, with \(b=50\) added each period (\(A_{n+1}=(1+\tfrac rm)A_n+b\)). After 5 years the balance (nearest cent) is'
    A: '\(3{,}833.51\)'
    B: '\(4{,}000\)'
    C: '\(4{,}259.45\)'
    D: '\(4{,}759.45\)'
    answer: C
    hint: 'Iterate 60 times, or use \(A_k=(1+\tfrac rm)^k\left(A_0+\tfrac{mb}r\right)-\tfrac{mb}r\).'
    explanation: '\(A_{60}\approx4259.45\).'
  102:
    topic: s11-1
    question: 'A \(5000\) deposit with \(r=0.0589\), \(m=12\), and a withdrawal of \(50\) per period has balance (after 5 years, nearest cent)'
    A: '\(2{,}583.03\)'
    B: '\(2{,}000\)'
    C: '\(3{,}228.78\)'
    D: '\(3{,}728.78\)'
    answer: C
    hint: 'Same recursion with \(b=-50\).'
    explanation: '\(A_{60}\approx3228.78\).'
  103:
    topic: s11-1
    question: 'A \(5000\) CD pays \(4.5\%\) annually, compounded quarterly. The time (years, one decimal) to reach \(20{,}000\) is about'
    A: '\(46.5\text{ years}\)'
    B: '\(61.8\text{ years}\)'
    C: '\(15.5\text{ years}\)'
    D: '\(31\text{ years}\)'
    answer: D
    hint: 'Solve \(5000\left(1+\tfrac{0.045}4\right)^{4t}=20000\).'
    explanation: '\(t=\dfrac{\ln4}{4\ln(1.01125)}\approx31.0\) years.'
  104:
    topic: s11-1
    question: 'If the CD earns \(6.25\%\) compounded quarterly, the time (years, one decimal) to reach \(20{,}000\) is about'
    A: '\(11.2\text{ years}\)'
    B: '\(44.7\text{ years}\)'
    C: '\(22.4\text{ years}\)'
    D: '\(33.5\text{ years}\)'
    answer: C
    hint: Same equation with the larger rate.
    explanation: '\(t=\dfrac{\ln4}{4\ln(1.015625)}\approx22.4\) years.'
  105:
    topic: s11-1
    question: 'The logistic difference equation \(a_{n+1}=ra_n(1-a_n)\) with \(0<a_0<1\) and \(r=\tfrac34\) produces a sequence that'
    A: 'converges to \(0\)'
    B: 'converges to \(1-\tfrac1r=-\tfrac13\)'
    C: oscillates between two values
    D: 'converges to \(\tfrac14\)'
    answer: A
    hint: 'Fixed points solve \(L=rL(1-L)\): \(L=0\) or \(L=1-\tfrac1r<0\).'
    explanation: 'The positive terms cannot approach a negative number, so \(a_n\to0\).'
  106:
    topic: s11-1
    question: 'For the logistic sequence \(a_{n+1}=ra_n(1-a_n)\) with \(1<r<3\), the sequence converges (for \(0<a_0<1\)) to'
    A: '\(1\)'
    B: '\(1-\dfrac1r\)'
    C: '\(\dfrac1r\)'
    D: '\(0\)'
    answer: B
    hint: 'Solve \(L=rL(1-L)\) with \(L\ne0\).'
    explanation: '\(1=r(1-L)\), so \(L=1-\tfrac1r\).'
  107:
    topic: s11-1
    question: 'In the logistic sequence, \(r=3\) is called a bifurcation value because'
    A: 'the sequence diverges to \(\infty\) for \(r>3\)'
    B: 'for \(3<r<3.45\) the terms eventually oscillate between two values (an attracting 2-cycle)'
    C: the sequence becomes constant
    D: 'the limit becomes \(0\)'
    answer: B
    hint: 'Experiment with \(r=3.2\).'
    explanation: 'The long-run behavior changes qualitatively at \(r=3\).'
  108:
    topic: s11-1
    question: 'For the logistic sequence with \(r=3.65\), nearby starting values such as \(a_0=0.3\) and \(a_0=0.301\)'
    A: give the same limit
    B: 'both converge to \(0\)'
    C: eventually give sequences that behave very differently (sensitive dependence on initial conditions)
    D: give sequences that stay close forever
    answer: C
    hint: 'This is the chaotic regime (\(r>3.57\)).'
    explanation: 'Small differences in \(a_0\) are amplified.'
  109:
    topic: s11-1
    question: 'To make \(\left|\sqrt[n]{0.5}-1\right|<10^{-3}\) hold for all \(n>N\), a suitable (least) integer \(N\) is'
    A: '\(992\)'
    B: '\(692\)'
    C: '\(2076\)'
    D: '\(346\)'
    answer: B
    hint: 'Solve \(1-0.5^{1/n}<0.001\).'
    explanation: '\(0.5^{1/n}>0.999\) gives \(n>\dfrac{\ln0.5}{\ln0.999}\approx692.8\); the least \(N\) is \(692\) (so \(n\ge693\)).'
  110:
    topic: s11-1
    question: 'To make \((0.9)^n<10^{-3}\) hold for all \(n>N\), the least integer \(N\) is'
    A: '\(85\)'
    B: '\(65\)'
    C: '\(32\)'
    D: '\(130\)'
    answer: B
    hint: '\(n>\dfrac{\ln10^{-3}}{\ln0.9}\).'
    explanation: '\(n>65.56\), so \(N=65\).'
  111:
    topic: s11-1
    question: 'To make \(\dfrac{2^n}{n!}<10^{-7}\) hold for all \(n>N\), the least integer \(N\) is'
    A: '\(28\)'
    B: '\(9\)'
    C: '\(19\)'
    D: '\(14\)'
    answer: D
    hint: 'Evaluate the terms until they fall below \(10^{-7}\).'
    explanation: '\(\dfrac{2^{14}}{14!}\ge10^{-7}\) but the next term is smaller.'
  112:
    topic: s11-2
    question: 'The \(n\)th partial sum of \(2+\dfrac23+\dfrac29+\dfrac2{27}+\cdots+\dfrac2{3^{n-1}}+\cdots\) is'
    A: '\(s_n=3\left(1-\dfrac1{3^n}\right)\), so the series converges to \(3\)'
    B: '\(s_n=2\left(1-\dfrac1{3^n}\right)\), so it converges to \(2\)'
    C: '\(s_n=\dfrac{2}{3^n}\), so it converges to \(0\)'
    D: '\(s_n=3\left(1-\dfrac1{3^{n-1}}\right)\), so it converges to \(3\)'
    answer: A
    hint: 'Geometric with \(a=2\), \(r=\tfrac13\): \(s_n=\dfrac{a(1-r^n)}{1-r}\).'
    explanation: '\(\dfrac{2(1-3^{-n})}{2/3}=3(1-3^{-n})\to3\).'
  113:
    topic: s11-2
    question: 'The geometric series \(\dfrac9{100}+\dfrac9{100^2}+\cdots+\dfrac9{100^n}+\cdots\) converges to'
    A: '\(\dfrac1{10}\)'
    B: '\(\dfrac1{11}\)'
    C: '\(\dfrac9{100}\)'
    D: '\(\dfrac19\)'
    answer: B
    hint: '\(a=\tfrac9{100}\), \(r=\tfrac1{100}\).'
    explanation: '\(\dfrac{9/100}{99/100}=\dfrac9{99}=\dfrac1{11}\).'
  114:
    topic: s11-2
    question: 'The series \(1-\dfrac12+\dfrac14-\dfrac18+\cdots+(-1)^{n-1}\dfrac1{2^{n-1}}+\cdots\) has partial sums \(s_n=\)'
    A: '\(\dfrac23\left(1-\left(-\tfrac12\right)^n\right)\), and sum \(\dfrac23\)'
    B: '\(\dfrac23\left(1+\left(-\tfrac12\right)^n\right)\), and sum \(\dfrac23\)'
    C: '\(2\left(1-\left(-\tfrac12\right)^n\right)\), and sum \(2\)'
    D: '\(\dfrac32\left(1-\left(-\tfrac12\right)^n\right)\), and sum \(\dfrac32\)'
    answer: A
    hint: '\(a=1\), \(r=-\tfrac12\).'
    explanation: '\(s_n=\dfrac{1-(-1/2)^n}{1+1/2}\).'
  115:
    topic: s11-2
    question: 'The series \(1-2+4-8+\cdots+(-1)^{n-1}2^{n-1}+\cdots\)'
    A: 'converges to \(-1\)'
    B: 'diverges, since \(s_n=\dfrac{1-(-2)^n}{3}\) has no limit'
    C: 'converges to \(\dfrac13\)'
    D: 'converges to \(\dfrac23\)'
    answer: B
    hint: 'Geometric with \(|r|=2\ge1\).'
    explanation: The partial sums oscillate with growing magnitude.
  116:
    topic: s11-2
    question: 'The series \(\dfrac1{2\cdot3}+\dfrac1{3\cdot4}+\dfrac1{4\cdot5}+\cdots+\dfrac1{(n+1)(n+2)}+\cdots\) has partial sums \(s_n=\)'
    A: '\(\dfrac12+\dfrac1{n+2}\), so it converges to \(\dfrac12\)'
    B: '\(\dfrac12-\dfrac1{n+1}\), so it converges to \(\dfrac12\)'
    C: '\(1-\dfrac1{n+2}\), so it converges to \(1\)'
    D: '\(\dfrac12-\dfrac1{n+2}\), so it converges to \(\dfrac12\)'
    answer: D
    hint: '\(\dfrac1{(n+1)(n+2)}=\dfrac1{n+1}-\dfrac1{n+2}\).'
    explanation: The sum telescopes.
  117:
    topic: s11-2
    question: 'The series \(\dfrac5{1\cdot2}+\dfrac5{2\cdot3}+\dfrac5{3\cdot4}+\cdots+\dfrac5{n(n+1)}+\cdots\) has sum'
    A: '\(10\)'
    B: '\(1\)'
    C: '\(5\)'
    D: '\(\dfrac52\)'
    answer: C
    hint: '\(\dfrac5{n(n+1)}=5\left(\dfrac1n-\dfrac1{n+1}\right)\).'
    explanation: '\(s_n=5\left(1-\dfrac1{n+1}\right)\to5\).'
  118:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\dfrac7{4^n}\) is'
    A: '\(\frac{28}{3}\)'
    B: '\(7\)'
    C: '\(\frac{7}{4}\)'
    D: '\(\frac{7}{3}\)'
    answer: D
    hint: 'Geometric with \(a=\tfrac74\), \(r=\tfrac14\).'
    explanation: '\(\dfrac{7/4}{3/4}=\dfrac73\).'
  119:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=0}^{\infty}(-1)^n\dfrac5{4^n}\) is'
    A: '\(\frac{5}{3}\)'
    B: '\(4\)'
    C: '\(-4\)'
    D: '\(5\)'
    answer: B
    hint: '\(a=5\), \(r=-\tfrac14\).'
    explanation: '\(\dfrac5{1+1/4}=4\).'
  120:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=0}^{\infty}\left(\dfrac5{2^n}+\dfrac1{3^n}\right)\) is'
    A: '\(\frac{17}{2}\)'
    B: '\(\frac{23}{2}\)'
    C: '\(\frac{31}{3}\)'
    D: '\(13\)'
    answer: B
    hint: Sum two geometric series.
    explanation: '\(\dfrac5{1-1/2}+\dfrac1{1-1/3}=10+\tfrac32\).'
  121:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=0}^{\infty}\left(\dfrac5{2^n}-\dfrac1{3^n}\right)\) is'
    A: '\(\frac{19}{2}\)'
    B: '\(7\)'
    C: '\(\frac{23}{2}\)'
    D: '\(\frac{17}{2}\)'
    answer: D
    hint: Subtract the geometric sums.
    explanation: '\(10-\tfrac32=\tfrac{17}2\).'
  122:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=0}^{\infty}\left(\dfrac1{2^n}+\dfrac{(-1)^n}{5^n}\right)\) is'
    A: '\(\frac{17}{6}\)'
    B: '\(\frac{7}{3}\)'
    C: '\(\frac{5}{2}\)'
    D: '\(\frac{11}{4}\)'
    answer: A
    hint: 'Two geometric series with \(r=\tfrac12\) and \(r=-\tfrac15\).'
    explanation: '\(2+\dfrac1{1+1/5}=2+\tfrac56\).'
  123:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=0}^{\infty}\dfrac{2^n}{5^n}\) is'
    A: '\(\frac{2}{3}\)'
    B: '\(\frac{5}{2}\)'
    C: '\(3\)'
    D: '\(\frac{5}{3}\)'
    answer: D
    hint: '\(r=\tfrac25\).'
    explanation: '\(\dfrac1{1-2/5}=\tfrac53\).'
  124:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=0}^{\infty}\dfrac{(-1)^n}{4^n}\) is'
    A: '\(\frac{5}{4}\)'
    B: '\(\frac{3}{4}\)'
    C: '\(\frac{4}{5}\)'
    D: '\(\frac{4}{3}\)'
    answer: C
    hint: '\(r=-\tfrac14\).'
    explanation: '\(\dfrac1{1+1/4}\).'
  125:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{4^n}\) is'
    A: '\(\frac{1}{3}\)'
    B: '\(\frac{1}{12}\)'
    C: '\(\frac{1}{16}\)'
    D: '\(\frac{1}{4}\)'
    answer: B
    hint: 'Geometric starting at \(n=2\): \(a=\tfrac1{16}\), \(r=\tfrac14\).'
    explanation: '\(\dfrac{1/16}{3/4}=\tfrac1{12}\).'
  126:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\dfrac4{(4n-3)(4n+1)}\) is'
    A: '\(2\)'
    B: '\(\frac{1}{2}\)'
    C: '\(1\)'
    D: '\(\frac{4}{3}\)'
    answer: C
    hint: '\(\dfrac4{(4n-3)(4n+1)}=\dfrac1{4n-3}-\dfrac1{4n+1}\).'
    explanation: 'The sum telescopes to \(1-0\).'
  127:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\dfrac6{(2n-1)(2n+1)}\) is'
    A: '\(\frac{3}{2}\)'
    B: '\(3\)'
    C: '\(6\)'
    D: '\(\frac{9}{2}\)'
    answer: B
    hint: '\(\dfrac6{(2n-1)(2n+1)}=\dfrac3{2n-1}-\dfrac3{2n+1}\).'
    explanation: 'The sum telescopes to \(3\).'
  128:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{40n}{(2n-1)^2(2n+1)^2}\) is'
    A: '\(5\)'
    B: '\(10\)'
    C: '\(4\)'
    D: '\(\frac{5}{2}\)'
    answer: A
    hint: '\(\dfrac{40n}{(2n-1)^2(2n+1)^2}=5\left[\dfrac1{(2n-1)^2}-\dfrac1{(2n+1)^2}\right]\).'
    explanation: 'Telescoping gives \(5\left[1-0\right]\).'
  129:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{2n+1}{n^2(n+1)^2}\) is'
    A: '\(1\)'
    B: '\(\frac{3}{2}\)'
    C: '\(2\)'
    D: '\(\frac{1}{2}\)'
    answer: A
    hint: '\(\dfrac{2n+1}{n^2(n+1)^2}=\dfrac1{n^2}-\dfrac1{(n+1)^2}\).'
    explanation: 'Telescoping gives \(1\).'
  130:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\left(\dfrac1{\sqrt n}-\dfrac1{\sqrt{n+1}}\right)\) is'
    A: '\(1\)'
    B: '\(\frac{1}{2}\)'
    C: '\(0\)'
    D: '\(2\)'
    answer: A
    hint: The sum telescopes.
    explanation: '\(s_n=1-\dfrac1{\sqrt{n+1}}\to1\).'
  131:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\left(\dfrac1{2^{1/n}}-\dfrac1{2^{1/(n+1)}}\right)\) is'
    A: '\(1\)'
    B: '\(- \frac{1}{2}\)'
    C: '\(-1\)'
    D: '\(\frac{1}{2}\)'
    answer: B
    hint: 'Let \(a_n=2^{-1/n}\); the sum is \(a_1-\lim a_{n+1}\).'
    explanation: '\(a_1=\tfrac12\), \(\lim a_n=1\), so the sum is \(\tfrac12-1=-\tfrac12\).'
  132:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\left(\dfrac1{\ln(n+2)}-\dfrac1{\ln(n+1)}\right)\) is'
    A: '\(- \frac{1}{\ln{\left(2 \right)}}\)'
    B: '\(\frac{1}{\ln{\left(2 \right)}}\)'
    C: '\(\ln{\left(2 \right)}\)'
    D: '\(-1\)'
    answer: A
    hint: 'Telescoping: partial sums are \(\dfrac1{\ln(n+2)}-\dfrac1{\ln2}\).'
    explanation: 'The limit is \(0-\dfrac1{\ln2}\).'
  133:
    topic: s11-2
    question: 'The sum of the series \(\displaystyle\sum_{n=1}^{\infty}\left(\tan^{-1}n-\tan^{-1}(n+1)\right)\) is'
    A: '\(- \frac{\pi}{2}\)'
    B: '\(- \frac{\pi}{4}\)'
    C: '\(\frac{\pi}{2}\)'
    D: '\(\frac{\pi}{4}\)'
    answer: B
    hint: 'Telescoping: \(\tan^{-1}1-\lim\tan^{-1}(n+1)\).'
    explanation: '\(\tfrac\pi4-\tfrac\pi2=-\tfrac\pi4\).'
  134:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\left(\dfrac1{\sqrt2}\right)^n\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Geometric with \(|r|<1\).'
    explanation: '\(r=\tfrac1{\sqrt2}\).'
  135:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\left(\sqrt2\right)^n\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Geometric with \(|r|>1\).'
    explanation: '\(r=\sqrt2>1\).'
  136:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}(-1)^{n+1}\dfrac3{2^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Geometric with \(r=-\tfrac12\).'
    explanation: 'Sum \(=\dfrac{3/2}{1+1/2}=1\).'
  137:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}(-1)^{n+1}n\) —'
    A: converges
    B: diverges
    answer: B
    hint: The terms do not tend to zero.
    explanation: '\(|a_n|=n\to\infty\).'
  138:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\cos n\pi\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\cos n\pi=(-1)^n\).'
    explanation: The terms do not tend to zero.
  139:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\dfrac{\cos n\pi}{5^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(\dfrac{(-1)^n}{5^n}\) is geometric with \(r=-\tfrac15\).'
    explanation: 'Sum \(=\dfrac1{1+1/5}=\dfrac56\).'
  140:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}e^{-2n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Geometric with \(r=e^{-2}\).'
    explanation: 'Sum \(=\dfrac1{1-e^{-2}}\).'
  141:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\ln\dfrac1n\) —'
    A: converges
    B: diverges
    answer: B
    hint: '\(\ln\tfrac1n=-\ln n\to-\infty\).'
    explanation: 'The \(n\)th-term test fails.'
  142:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac2{10^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Geometric with \(r=\tfrac1{10}\).'
    explanation: 'Sum \(=\dfrac{2/10}{9/10}=\tfrac29\).'
  143:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\dfrac{2^n-1}{3^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: Difference of two convergent geometric series.
    explanation: '\(\dfrac1{1-2/3}-\dfrac1{1-1/3}=3-\tfrac32=\tfrac32\).'
  144:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\left(1-\dfrac1n\right)^n\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\left(1-\tfrac1n\right)^n\to e^{-1}\ne0\).'
    explanation: The terms do not tend to zero.
  145:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\dfrac{n!}{1000^n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: Factorials beat exponentials.
    explanation: The terms eventually grow without bound.
  146:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{n^n}{n!}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\dfrac{n^n}{n!}\ge1\) (in fact it grows like \(e^n\)).'
    explanation: The terms do not tend to zero.
  147:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\ln\dfrac n{n+1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Telescoping: \(\ln n-\ln(n+1)\).'
    explanation: '\(s_n=-\ln(n+1)\to-\infty\).'
  148:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\ln\dfrac n{2n+1}\) —'
    A: converges
    B: diverges
    answer: B
    hint: '\(\dfrac n{2n+1}\to\tfrac12\).'
    explanation: 'The terms tend to \(\ln\tfrac12\ne0\).'
  149:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\left(\dfrac e\pi\right)^n\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Geometric with \(r=\dfrac e\pi\approx0.865\).'
    explanation: 'Sum \(=\dfrac\pi{\pi-e}\).'
  150:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\dfrac{e^{n\pi}}{\pi^{ne}}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Geometric with \(r=\dfrac{e^\pi}{\pi^e}\).'
    explanation: '\(e^\pi\approx23.14>\pi^e\approx22.46\), so \(r>1\).'
  151:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=0}^\infty\dfrac1{x^n}\), \(|x|>1\), has sum'
    A: '\(\dfrac x{x-1}\)'
    B: '\(\dfrac{x-1}{x}\)'
    C: '\(\dfrac{1}{x-1}\)'
    D: '\(\dfrac1{1-x}\)'
    answer: A
    hint: 'Geometric with \(r=\tfrac1x\).'
    explanation: '\(\dfrac1{1-1/x}=\dfrac x{x-1}\).'
  152:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty(-1)^nx^n\) converges for'
    A: '\(|x|<1\), with sum \(\dfrac1{1+x}\)'
    B: '\(|x|<1\), with sum \(\dfrac1{1-x}\)'
    C: '\(|x|\le1\), with sum \(\dfrac1{1+x}\)'
    D: 'all \(x\), with sum \(\dfrac1{1+x}\)'
    answer: A
    hint: '\(a=1\), \(r=-x\).'
    explanation: '\(|r|<1\).'
  153:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty(-1)^nx^{2n}\) converges for \(|x|<1\) with sum'
    A: '\(\dfrac1{1+x}\)'
    B: '\(\dfrac1{1-x^2}\)'
    C: '\(\dfrac{x}{1+x^2}\)'
    D: '\(\dfrac1{1+x^2}\)'
    answer: D
    hint: '\(r=-x^2\).'
    explanation: '\(\dfrac1{1-(-x^2)}\).'
  154:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty3\left(\dfrac{x-1}2\right)^n\) converges exactly for'
    A: '\(-1<x<3\), with sum \(\dfrac3{3-x}\)'
    B: '\(|x|<1\), with sum \(\dfrac6{3-x}\)'
    C: '\(0<x<2\), with sum \(\dfrac6{3-x}\)'
    D: '\(-1<x<3\), with sum \(\dfrac6{3-x}\)'
    answer: D
    hint: '\(|r|=\left|\dfrac{x-1}2\right|<1\).'
    explanation: '\(\dfrac3{1-(x-1)/2}=\dfrac6{3-x}\).'
  155:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty\dfrac{(-1)^n}2\left(\dfrac1{3+\sin x}\right)^n\) converges for'
    A: 'only \(x\) with \(\sin x>0\)'
    B: 'every \(x\), with sum \(\dfrac{1}{2(4+\sin x)}\)'
    C: '\(|x|<1\) only'
    D: 'every \(x\), with sum \(\dfrac{3+\sin x}{2(4+\sin x)}\)'
    answer: D
    hint: '\(r=-\dfrac1{3+\sin x}\), and \(3+\sin x\ge2\).'
    explanation: '\(|r|\le\tfrac12<1\); the sum is \(\dfrac{1/2}{1+\frac1{3+\sin x}}\).'
  156:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty2^nx^n\) converges for'
    A: '\(|x|<1\), with sum \(\dfrac1{1-x}\)'
    B: '\(|x|<\dfrac12\), with sum \(\dfrac1{1+2x}\)'
    C: '\(|x|<\dfrac12\), with sum \(\dfrac1{1-2x}\)'
    D: '\(|x|<2\), with sum \(\dfrac1{1-2x}\)'
    answer: C
    hint: '\(r=2x\).'
    explanation: '\(|2x|<1\).'
  157:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty(-1)^nx^{-2n}\) converges for \(|x|>1\) with sum'
    A: '\(\dfrac{x^2}{x^2+1}\)'
    B: '\(\dfrac{1}{x^2+1}\)'
    C: '\(\dfrac1{1+x^2}\)'
    D: '\(\dfrac{x^2}{x^2-1}\)'
    answer: A
    hint: '\(r=-\dfrac1{x^2}\).'
    explanation: '\(\dfrac1{1+1/x^2}=\dfrac{x^2}{x^2+1}\).'
  158:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty(-1)^n(x+1)^n\) converges for'
    A: '\(-2<x<0\), with sum \(\dfrac1{x+2}\)'
    B: '\(0<x<2\), with sum \(\dfrac1{x+2}\)'
    C: '\(-2<x<0\), with sum \(\dfrac1{x}\)'
    D: '\(-1<x<1\), with sum \(\dfrac1{x+2}\)'
    answer: A
    hint: '\(r=-(x+1)\).'
    explanation: '\(|x+1|<1\); sum \(=\dfrac1{1+(x+1)}\).'
  159:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty\left(-\dfrac12\right)^n(x-3)^n\) converges for'
    A: '\(1<x<5\), with sum \(\dfrac1{x-1}\)'
    B: '\(1<x<5\), with sum \(\dfrac2{x+1}\)'
    C: '\(2<x<4\), with sum \(\dfrac2{x-1}\)'
    D: '\(1<x<5\), with sum \(\dfrac2{x-1}\)'
    answer: D
    hint: '\(|r|=\left|\dfrac{x-3}2\right|<1\).'
    explanation: '\(\dfrac1{1+(x-3)/2}=\dfrac2{x-1}\).'
  160:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty\sin^nx\) converges when'
    A: '\(0<x<\pi\)'
    B: '\(x\ne\dfrac\pi2+k\pi\); the sum is \(\dfrac1{1-\sin x}\)'
    C: 'all \(x\), with sum \(\dfrac1{1+\sin x}\)'
    D: '\(x\) in \(\left[0,\tfrac\pi2\right]\) only'
    answer: B
    hint: 'Need \(|\sin x|<1\).'
    explanation: '\(|\sin x|=1\) exactly at \(x=\tfrac\pi2+k\pi\).'
  161:
    topic: s11-2
    question: 'The geometric series \(\displaystyle\sum_{n=0}^\infty(\ln x)^n\) converges for'
    A: '\(\dfrac1e<x<e\), with sum \(\dfrac1{1+\ln x}\)'
    B: '\(0<x<e\)'
    C: '\(\dfrac1e<x<e\), with sum \(\dfrac1{1-\ln x}\)'
    D: '\(|x|<1\)'
    answer: C
    hint: '\(|\ln x|<1\).'
    explanation: '\(-1<\ln x<1\).'
  162:
    topic: s11-2
    question: 'The repeating decimal \(0.\overline{23}\) equals the ratio'
    A: '\(\frac{23}{100}\)'
    B: '\(\frac{23}{99}\)'
    C: '\(\frac{23}{90}\)'
    D: '\(\frac{2}{9}\)'
    answer: B
    hint: Write it as a geometric series (or multiply by a power of 10 and subtract).
    explanation: 'The result is \(\frac{23}{99}\).'
  163:
    topic: s11-2
    question: 'The repeating decimal \(0.\overline{234}\) equals the ratio'
    A: '\(\frac{13}{50}\)'
    B: '\(\frac{26}{111}\)'
    C: '\(\frac{13}{55}\)'
    D: '\(\frac{117}{500}\)'
    answer: B
    hint: Write it as a geometric series (or multiply by a power of 10 and subtract).
    explanation: 'The result is \(\frac{26}{111}\).'
  164:
    topic: s11-2
    question: 'The repeating decimal \(0.\overline7\) equals the ratio'
    A: '\(\frac{77}{100}\)'
    B: '\(\frac{7}{9}\)'
    C: '\(\frac{7}{8}\)'
    D: '\(\frac{7}{10}\)'
    answer: B
    hint: Write it as a geometric series (or multiply by a power of 10 and subtract).
    explanation: 'The result is \(\frac{7}{9}\).'
  165:
    topic: s11-2
    question: 'The repeating decimal \(0.0\overline6\) equals the ratio'
    A: '\(\frac{1}{15}\)'
    B: '\(\frac{2}{15}\)'
    C: '\(\frac{2}{33}\)'
    D: '\(\frac{1}{16}\)'
    answer: A
    hint: Write it as a geometric series (or multiply by a power of 10 and subtract).
    explanation: 'The result is \(\frac{1}{15}\).'
  166:
    topic: s11-2
    question: 'The repeating decimal \(1.\overline{414}\) equals the ratio'
    A: '\(\frac{157}{111}\)'
    B: '\(\frac{1414}{999}\)'
    C: '\(\frac{141}{100}\)'
    D: '\(\frac{707}{500}\)'
    answer: A
    hint: Write it as a geometric series (or multiply by a power of 10 and subtract).
    explanation: 'The result is \(\frac{157}{111}\).'
  167:
    topic: s11-2
    question: 'The repeating decimal \(3.\overline{142857}\) equals the ratio'
    A: '\(\frac{31}{10}\)'
    B: '\(\frac{1047619}{333333}\)'
    C: '\(\frac{22}{7}\)'
    D: '\(\frac{3142857}{1000000}\)'
    answer: C
    hint: Write it as a geometric series (or multiply by a power of 10 and subtract).
    explanation: 'The result is \(\frac{22}{7}\).'
  168:
    topic: s11-2
    question: 'The decimal \(1.24\overline{123}\) as a fraction is'
    A: '\(\dfrac{124123}{100000}\)'
    B: '\(\dfrac{124123}{99900}\)'
    C: '\(\dfrac{1.24123}{99}\)'
    D: '\(\dfrac{41333}{33300}\)'
    answer: D
    hint: '\(1.24+\dfrac{123}{99900}\).'
    explanation: '\(\dfrac{124}{100}+\dfrac{123}{99900}=\dfrac{123999}{99900}=\dfrac{41333}{33300}\).'
  169:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^\infty\dfrac1{(n+1)(n+2)}\) can be written starting at \(n=0\) as'
    A: '\(\displaystyle\sum_{n=0}^\infty\dfrac1{(n+3)(n+4)}\)'
    B: '\(\displaystyle\sum_{n=0}^\infty\dfrac1{(n+2)(n+3)}\)'
    C: '\(\displaystyle\sum_{n=0}^\infty\dfrac1{n(n+1)}\)'
    D: '\(\displaystyle\sum_{n=0}^\infty\dfrac1{(n+1)(n+2)}\)'
    answer: B
    hint: 'Replace \(n\) by \(n+1\) and lower the starting index by 1.'
    explanation: Index shifts do not change the sum.
  170:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^\infty\dfrac1{(n+1)(n+2)}\) can be written starting at \(n=5\) as'
    A: '\(\displaystyle\sum_{n=5}^\infty\dfrac1{(n-5)(n-4)}\)'
    B: '\(\displaystyle\sum_{n=5}^\infty\dfrac1{(n-3)(n-2)}\)'
    C: '\(\displaystyle\sum_{n=5}^\infty\dfrac1{(n+1)(n+2)}\)'
    D: '\(\displaystyle\sum_{n=5}^\infty\dfrac1{(n-4)(n-3)}\)'
    answer: B
    hint: 'Replace \(n\) by \(n-4\).'
    explanation: '\((n-4)+1=n-3\) and \((n-4)+2=n-2\).'
  171:
    topic: s11-2
    question: 'The series \(\displaystyle\sum_{n=1}^\infty\dfrac5{n(n+1)}\) can be written starting at \(n=3\) as'
    A: '\(\displaystyle\sum_{n=3}^\infty\dfrac5{(n-3)(n-2)}\)'
    B: '\(\displaystyle\sum_{n=3}^\infty\dfrac5{(n-2)(n-1)}\)'
    C: '\(\displaystyle\sum_{n=3}^\infty\dfrac5{n(n+1)}\)'
    D: '\(\displaystyle\sum_{n=3}^\infty\dfrac5{(n-1)n}\)'
    answer: B
    hint: 'Replace \(n\) by \(n-2\).'
    explanation: 'The first term is \(\tfrac{5}{1\cdot2}\).'
  172:
    topic: s11-2
    question: If you add or delete a finite number of terms of a divergent series, the result
    A: may converge or diverge depending on the terms
    B: still diverges
    C: has the same sum
    D: converges
    answer: B
    hint: Changing finitely many terms changes the partial sums by a constant.
    explanation: Convergence is unaffected.
  173:
    topic: s11-2
    question: 'If \(\sum a_n\) converges and \(\sum b_n\) diverges, then \(\sum(a_n+b_n)\)'
    A: may converge or diverge
    B: converges
    C: 'converges to \(0\)'
    D: diverges
    answer: D
    hint: 'If \(\sum(a_n+b_n)\) converged, then \(\sum b_n=\sum(a_n+b_n)-\sum a_n\) would too.'
    explanation: Contradiction.
  174:
    topic: s11-2
    question: 'If \(\sum a_n\) converges and \(a_n>0\), then \(\sum\dfrac1{a_n}\)'
    A: may converge
    B: converges
    C: 'diverges, since \(\dfrac1{a_n}\to\infty\)'
    D: 'converges to \(\dfrac1{\sum a_n}\)'
    answer: C
    hint: '\(a_n\to0\), so \(\dfrac1{a_n}\to\infty\).'
    explanation: 'The \(n\)th-term test shows divergence.'
  175:
    topic: s11-2
    question: 'The ball dropped from \(4\) m rebounds to \(0.75\) of its previous height each time. The total distance traveled (up and down) is'
    A: '\(12\) m'
    B: '\(32\) m'
    C: '\(28\) m'
    D: '\(16\) m'
    answer: C
    hint: '\(4+2\left[4(0.75)+4(0.75)^2+\cdots\right]\).'
    explanation: '\(4+2\cdot\dfrac{3}{1-0.75}=4+24=28\).'
  176:
    topic: s11-2
    question: 'Using \(s=4.9t^2\), the total time (seconds, one decimal) for that ball to come to rest is about'
    A: '\(6.3\text{ s}\)'
    B: '\(18.9\text{ s}\)'
    C: '\(25.2\text{ s}\)'
    D: '\(12.6\text{ s}\)'
    answer: D
    hint: 'Each fall from height \(h\) takes \(\sqrt{h/4.9}\); the heights are \(4(0.75)^k\).'
    explanation: '\(\sqrt{\tfrac4{4.9}}\left(1+\dfrac{2\sqrt{0.75}}{1-\sqrt{0.75}}\right)\approx12.6\) s.'
  177:
    topic: s11-2
    question: 'The first of an infinite sequence of squares has area \(4\text{ m}^2\); each next square is formed by joining the midpoints of the sides of the previous one. The sum of all the areas is'
    A: '\(6\text{ m}^2\)'
    B: '\(16\text{ m}^2\)'
    C: '\(8\text{ m}^2\)'
    D: '\(4\text{ m}^2\)'
    answer: C
    hint: Each new square has half the area.
    explanation: '\(\dfrac4{1-1/2}=8\).'
  178:
    topic: s11-2
    question: 'There are \(2^n\) semicircles of radius \(\dfrac1{2^n}\) in the \(n\)th row of a figure. The sum of all semicircle areas is'
    A: '\(2\pi\)'
    B: '\(\dfrac\pi4\)'
    C: '\(\dfrac\pi2\)'
    D: '\(\pi\)'
    answer: C
    hint: 'Row \(n\) has area \(2^n\cdot\dfrac\pi2\cdot\dfrac1{4^n}\).'
    explanation: '\(\sum_{n\ge1}\dfrac\pi{2^{n+1}}=\dfrac\pi2\).'
  179:
    topic: s11-2
    question: 'For Koch''s snowflake, if \(C_1\) is an equilateral triangle with side \(1\), the length of \(C_n\) is'
    A: '\(L_n=3\cdot4^{n-1}\)'
    B: '\(L_n=3\), a constant'
    C: '\(L_n=3\left(\dfrac43\right)^{n-1}\), which tends to \(\infty\)'
    D: '\(L_n=3\left(\dfrac34\right)^{n-1}\), which tends to \(0\)'
    answer: C
    hint: 'Each side is replaced by \(4\) sides one third as long.'
    explanation: 'The perimeter is multiplied by \(\tfrac43\) at each stage.'
  180:
    topic: s11-2
    question: 'The areas \(A_n\) of the regions enclosed by the Koch curves \(C_n\) (starting with a unit equilateral triangle) converge to'
    A: '\(\dfrac{\sqrt3}4\)'
    B: '\(\infty\)'
    C: '\(\dfrac{\sqrt3}2\)'
    D: '\(\dfrac{2\sqrt3}5\)'
    answer: D
    hint: 'Add a geometric series of new small triangles to \(\tfrac{\sqrt3}4\).'
    explanation: 'The total area is \(\dfrac{2\sqrt3}5\); the area is finite while the length is infinite.'
  181:
    topic: s11-2
    question: 'The series \(1+2r+r^2+2r^3+r^4+2r^5+\cdots\) converges for'
    A: '\(|r|<1\), with sum \(\dfrac{1+2r}{1-r^2}\)'
    B: '\(|r|<2\), with sum \(\dfrac{1+2r}{1-r^2}\)'
    C: '\(|r|\le1\), with sum \(\dfrac{1+2r}{1-r^2}\)'
    D: '\(|r|<1\), with sum \(\dfrac{1}{1-r}\)'
    answer: A
    hint: 'Group in pairs: \((1+2r)(1+r^2+r^4+\cdots)\).'
    explanation: '\(\dfrac{1+2r}{1-r^2}\).'
  182:
    topic: s11-2
    question: 'For \(1+e^b+e^{2b}+e^{3b}+\cdots=9\), the value of \(b\) is'
    A: '\(\ln9\)'
    B: '\(\ln\dfrac98\)'
    C: '\(\dfrac89\)'
    D: '\(\ln\dfrac89\)'
    answer: D
    hint: 'Geometric with \(r=e^b\): \(\dfrac1{1-e^b}=9\).'
    explanation: '\(e^b=\dfrac89\).'
  183:
    topic: s11-2
    question: 'A geometric series \(\sum ar^{n-1}\) with \(a=2\) converges to \(5\) when \(r=\)'
    A: '\(\dfrac35\)'
    B: '\(\dfrac53\)'
    C: '\(\dfrac25\)'
    D: '\(\dfrac{3}{2}\)'
    answer: A
    hint: '\(\dfrac2{1-r}=5\).'
    explanation: '\(1-r=\tfrac25\).'
  184:
    topic: s11-2
    question: 'A geometric series \(\sum ar^{n-1}\) with \(a=\dfrac{13}2\) converges to \(5\) when \(r=\)'
    A: '\(\dfrac{13}{10}\)'
    B: '\(-\dfrac3{10}\)'
    C: '\(\dfrac3{10}\)'
    D: '\(-\dfrac{13}{10}\)'
    answer: B
    hint: '\(\dfrac{13/2}{1-r}=5\).'
    explanation: '\(1-r=\tfrac{13}{10}\).'
  185:
    topic: s11-2
    question: 'The error \(L-s_n\) in replacing a convergent geometric series \(\sum ar^{n-1}\) by its \(n\)th partial sum is'
    A: '\(ar^n\)'
    B: '\(\dfrac{ar^{n-1}}{1-r}\)'
    C: '\(\dfrac{ar^n}{1-r}\)'
    D: '\(\dfrac{a}{1-r^n}\)'
    answer: C
    hint: '\(L=\tfrac a{1-r}\) and \(s_n=\tfrac{a(1-r^n)}{1-r}\).'
    explanation: Subtract.
  186:
    topic: s11-2
    question: Every convergent series has terms that tend to zero. The converse is
    A: true only for positive terms
    B: true only for alternating series
    C: false (e.g., the harmonic series)
    D: "true"
    answer: C
    hint: 'Think of \(\sum\tfrac1n\).'
    explanation: '\(\tfrac1n\to0\) but \(\sum\tfrac1n\) diverges.'
  187:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{10^n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: Geometric (or integral test).
    explanation: '\(\int e^{-x\ln10}dx\) converges.'
  188:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}e^{-n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(\int_1^\infty e^{-x}dx\) converges.'
    explanation: It is also geometric.
  189:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac n{n+1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'The terms tend to \(1\), not \(0\).'
    explanation: '\(n\)th-term test.'
  190:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac5{n+1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\int\dfrac5{x+1}dx=5\ln(x+1)\) diverges.'
    explanation: Like a harmonic series.
  191:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac3{\sqrt n}\) —'
    A: converges
    B: diverges
    answer: B
    hint: '\(p\)-series with \(p=\tfrac12\le1\).'
    explanation: '\(\int3x^{-1/2}dx\) diverges.'
  192:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}-\dfrac2{n\sqrt n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(p\)-series with \(p=\tfrac32>1\).'
    explanation: '\(\int x^{-3/2}dx\) converges.'
  193:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}-\dfrac1{8^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Geometric with \(r=\tfrac18\).'
    explanation: '\(|r|<1\).'
  194:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}-\dfrac8n\) —'
    A: converges
    B: diverges
    answer: B
    hint: Constant multiple of the harmonic series.
    explanation: '\(\sum\tfrac1n\) diverges.'
  195:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac{\ln n}n\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\int\dfrac{\ln x}x\,dx=\tfrac12\ln^2x\) diverges.'
    explanation: Eventually decreasing and positive.
  196:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac{\ln n}{\sqrt n}\) —'
    A: converges
    B: diverges
    answer: B
    hint: '\(\dfrac{\ln n}{\sqrt n}>\dfrac1{\sqrt n}\) for \(n\ge3\).'
    explanation: 'Compare with a divergent \(p\)-series.'
  197:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{2^n}{3^n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Geometric with \(r=\tfrac23\).'
    explanation: '\(|r|<1\).'
  198:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{5^n}{4^n+3}\) —'
    A: converges
    B: diverges
    answer: B
    hint: '\(\dfrac{5^n}{4^n+3}\to\infty\).'
    explanation: 'The \(n\)th term does not tend to zero.'
  199:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=0}^{\infty}\dfrac{-2}{n+1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Constant multiple of \(\sum\tfrac1{n+1}\).'
    explanation: '\(\int\tfrac{dx}{x+1}\) diverges.'
  200:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{2n-1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\int\tfrac{dx}{2x-1}=\tfrac12\ln(2x-1)\) diverges.'
    explanation: Like the harmonic series.
  201:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{2^n}{n+1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: Exponentials beat polynomials.
    explanation: 'The terms tend to \(\infty\).'
  202:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{\sqrt n\left(\sqrt n+1\right)}\) —'
    A: converges
    B: diverges
    answer: B
    hint: 'Behaves like \(\dfrac1n\).'
    explanation: '\(\int\dfrac{dx}{\sqrt x(\sqrt x+1)}=2\ln(\sqrt x+1)\) diverges.'
  203:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac{\sqrt n}{\ln n}\) —'
    A: converges
    B: diverges
    answer: B
    hint: '\(\dfrac{\sqrt n}{\ln n}\to\infty\).'
    explanation: The terms do not tend to zero.
  204:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\left(1+\dfrac1n\right)^n\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\left(1+\tfrac1n\right)^n\to e\ne0\).'
    explanation: '\(n\)th-term test.'
  205:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{(\ln2)^n}\) —'
    A: converges
    B: diverges
    answer: B
    hint: 'Geometric with \(r=\dfrac1{\ln2}\approx1.44\).'
    explanation: '\(r>1\).'
  206:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{(\ln3)^n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Geometric with \(r=\dfrac1{\ln3}\approx0.91\).'
    explanation: '\(|r|<1\).'
  207:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=3}^{\infty}\dfrac{1/n}{(\ln n)\sqrt{\ln^2n-1}}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(\displaystyle\int\dfrac{dx}{x\ln x\sqrt{\ln^2x-1}}=\sec^{-1}(\ln x)\).'
    explanation: 'The integral converges because \(\sec^{-1}(\ln x)\to\tfrac\pi2\).'
  208:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{n(1+\ln^2n)}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(\displaystyle\int\dfrac{dx}{x(1+\ln^2x)}=\tan^{-1}(\ln x)\).'
    explanation: 'The limit \(\tfrac\pi2\) is finite.'
  209:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}n\sin\dfrac1n\) —'
    A: converges
    B: diverges
    answer: B
    hint: '\(n\sin\tfrac1n\to1\).'
    explanation: '\(n\)th-term test.'
  210:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}n\tan\dfrac1n\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(n\tan\tfrac1n\to1\).'
    explanation: '\(n\)th-term test.'
  211:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{e^n}{1+e^{2n}}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(\int\dfrac{e^x}{1+e^{2x}}dx=\tan^{-1}e^x\).'
    explanation: The integral converges.
  212:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac2{1+e^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Compare with \(2e^{-n}\), or integrate.'
    explanation: Geometric-like decay.
  213:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{8\tan^{-1}n}{1+n^2}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(\int\dfrac{8\tan^{-1}x}{1+x^2}dx=4(\tan^{-1}x)^2\).'
    explanation: The integral converges.
  214:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac n{n^2+1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\int\dfrac{x\,dx}{x^2+1}=\tfrac12\ln(x^2+1)\) diverges.'
    explanation: 'Like \(\sum\tfrac1n\).'
  215:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\operatorname{sech}n\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(\int\operatorname{sech}x\,dx=\tan^{-1}(\sinh x)\).'
    explanation: Bounded antiderivative.
  216:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\operatorname{sech}^2n\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(\int\operatorname{sech}^2x\,dx=\tanh x\).'
    explanation: Bounded antiderivative.
  217:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=1}^\infty\left(\dfrac a{n+2}-\dfrac1{n+4}\right)\) converges for'
    A: 'every real \(a\)'
    B: '\(a=0\) only'
    C: '\(a=\dfrac12\) only'
    D: '\(a=1\) only'
    answer: D
    hint: 'The terms are \(\dfrac{a-1}{n}\) plus smaller terms.'
    explanation: 'If \(a\ne1\) the series behaves like \((a-1)\sum\tfrac1n\), which diverges.'
  218:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=3}^\infty\left(\dfrac1{n-1}-\dfrac{2a}{n+1}\right)\) converges for'
    A: 'every real \(a\)'
    B: '\(a=1\) only'
    C: '\(a=2\) only'
    D: '\(a=\dfrac12\) only'
    answer: D
    hint: 'The terms behave like \(\dfrac{1-2a}n\).'
    explanation: 'Convergence requires \(1-2a=0\).'
  219:
    topic: s11-3
    question: The partial sums of the harmonic series satisfy
    A: '\(1+\dfrac12+\cdots+\dfrac1n\le\sqrt n\)'
    B: '\(\ln(n+1)\le1+\dfrac12+\cdots+\dfrac1n\le1+\ln n\)'
    C: '\(\ln n\le1+\dfrac12+\cdots+\dfrac1n\le\ln(n+1)\)'
    D: '\(1+\dfrac12+\cdots+\dfrac1n\le\ln n\)'
    answer: B
    hint: 'Compare rectangles with \(\displaystyle\int\tfrac1x\,dx\).'
    explanation: Upper and lower rectangle sums bound the integral.
  220:
    topic: s11-3
    question: 'Suppose you added one term of the harmonic series each second for 13 billion years (365-day years), starting with \(s_1=1\). The partial sum would be about'
    A: '\(20\)'
    B: '\(41\)'
    C: '\(82\)'
    D: '\(410\)'
    answer: B
    hint: '\(s_n\approx\ln n+\gamma\) with \(n\approx4.1\times10^{17}\).'
    explanation: '\(\ln(4.1\times10^{17})\approx40.5\), plus \(0.577\): about \(41\).'
  221:
    topic: s11-3
    question: 'For which values of \(x\) does \(\displaystyle\sum_{n=1}^\infty\dfrac1{nx}\) converge?'
    A: 'all \(x\)'
    B: '\(|x|>1\)'
    C: '\(x>1\)'
    D: 'none: it diverges for every \(x\ne0\)'
    answer: D
    hint: 'It is \(\dfrac1x\) times the harmonic series.'
    explanation: A nonzero constant multiple of a divergent series diverges.
  222:
    topic: s11-3
    question: 'If \(\sum a_n\) is a divergent series of positive numbers, then'
    A: '\(\sum a_n\) must be harmonic'
    B: 'there is also a divergent series \(\sum b_n\) of positive numbers with \(b_n<a_n\) for all \(n\) (and no "smallest" divergent series exists)'
    C: there is a smallest divergent series
    D: 'every positive series with \(b_n<a_n\) diverges'
    answer: B
    hint: 'Try \(b_n=\dfrac{a_n}{2}\).'
    explanation: A positive multiple of a divergent series diverges.
  223:
    topic: s11-3
    question: There is no "largest" convergent series of positive terms because
    A: convergent series must be geometric
    B: 'if \(\sum a_n\) converges, then \(\sum2a_n\) also converges and is larger term by term'
    C: the integral test fails
    D: '\(\sum a_n\) would have to be harmonic'
    answer: B
    hint: Multiply the terms by a constant larger than 1.
    explanation: Multiples of convergent series converge.
  224:
    topic: s11-3
    question: 'The Cauchy condensation test says that for a nonincreasing positive sequence \(a_n\to0\), \(\sum a_n\) converges if and only if'
    A: '\(\displaystyle\sum a_{2n}\) converges'
    B: '\(\displaystyle\sum 2^na_n\) converges'
    C: '\(\displaystyle\sum a_n^2\) converges'
    D: '\(\displaystyle\sum 2^na_{2^n}\) converges'
    answer: D
    hint: 'Group terms in blocks of \(2^n\).'
    explanation: 'Each block is bounded between \(2^{n-1}a_{2^n}\) and \(2^na_{2^{n-1}}\).'
  225:
    topic: s11-3
    question: 'By Cauchy condensation, \(\displaystyle\sum_{n=2}^\infty\dfrac1{n\ln n}\)'
    A: diverges
    B: 'converges to \(\ln2\)'
    C: converges conditionally
    D: converges
    answer: A
    hint: '\(2^na_{2^n}=\dfrac1{n\ln2}\).'
    explanation: '\(\sum\tfrac1n\) diverges.'
  226:
    topic: s11-3
    question: 'By Cauchy condensation, \(\displaystyle\sum_{n=1}^\infty\dfrac1{n^p}\) converges if'
    A: '\(p>0\)'
    B: '\(p>1\) (and diverges if \(p\le1\))'
    C: '\(p\ge1\)'
    D: '\(p<1\)'
    answer: B
    hint: '\(2^na_{2^n}=\left(2^{1-p}\right)^n\) is geometric.'
    explanation: 'It converges when \(2^{1-p}<1\).'
  227:
    topic: s11-3
    question: 'The integral \(\displaystyle\int_2^\infty\dfrac{dx}{x(\ln x)^p}\) converges if and only if'
    A: '\(p>1\)'
    B: '\(p>0\)'
    C: '\(p\ge1\)'
    D: '\(p<1\)'
    answer: A
    hint: 'Let \(u=\ln x\).'
    explanation: '\(\int u^{-p}du\) converges at infinity iff \(p>1\).'
  228:
    topic: s11-3
    question: 'Therefore \(\displaystyle\sum_{n=2}^\infty\dfrac1{n(\ln n)^p}\) converges if and only if'
    A: '\(p\ge1\)'
    B: '\(p<1\)'
    C: '\(p\ne1\)'
    D: '\(p>1\)'
    answer: D
    hint: Apply the integral test with the previous result.
    explanation: The terms are positive and decreasing.
  229:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{n\ln n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Compare with the logarithmic \(p\)-series \(\sum\dfrac1{n(\ln n)^p}\).'
    explanation: 'The exponent of \(\ln n\) is effectively \(p=1\).'
  230:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{n(\ln n)^{1.01}}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Compare with the logarithmic \(p\)-series \(\sum\dfrac1{n(\ln n)^p}\).'
    explanation: 'The exponent of \(\ln n\) is effectively \(p=1.01\).'
  231:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{n\ln(n^3)}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Compare with the logarithmic \(p\)-series \(\sum\dfrac1{n(\ln n)^p}\).'
    explanation: 'The exponent of \(\ln n\) is effectively \(p=1\) (note \(\ln n^3=3\ln n\)).'
  232:
    topic: s11-3
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{n(\ln n)^3}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Compare with the logarithmic \(p\)-series \(\sum\dfrac1{n(\ln n)^p}\).'
    explanation: 'The exponent of \(\ln n\) is effectively \(p=3\).'
  233:
    topic: s11-3
    question: 'Euler''s constant \(\gamma=\displaystyle\lim_{n\to\infty}\left(1+\dfrac12+\cdots+\dfrac1n-\ln n\right)\) is approximately'
    A: '\(1\)'
    B: '\(1.4142\)'
    C: '\(0.6931\)'
    D: '\(0.5772\)'
    answer: D
    hint: The sequence is decreasing and bounded below.
    explanation: '\(\gamma=0.5772\ldots\)'
  234:
    topic: s11-3
    question: 'The integral test shows that \(\displaystyle\sum_{n=0}^\infty e^{-n^2}\)'
    A: 'diverges, since \(\displaystyle\int e^{-x^2}dx\) is unbounded'
    B: converges only conditionally
    C: 'diverges, because \(e^{-n^2}\) is not geometric'
    D: 'converges, since \(\displaystyle\int_0^\infty e^{-x^2}dx\) converges'
    answer: D
    hint: '\(e^{-x^2}\) is positive and decreasing.'
    explanation: 'The improper integral equals \(\tfrac{\sqrt\pi}2\).'
  235:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{2\sqrt n+\sqrt[3]n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Limit comparison with \(\dfrac1{\sqrt n}\).'
    explanation: 'The ratio tends to \(\tfrac12\); \(\sum n^{-1/2}\) diverges.'
  236:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac3{n+\sqrt n}\) —'
    A: converges
    B: diverges
    answer: B
    hint: 'Limit comparison with \(\dfrac1n\).'
    explanation: 'The ratio tends to \(3\).'
  237:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{\sin^2n}{2^n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Direct comparison with \(\dfrac1{2^n}\).'
    explanation: '\(0\le\sin^2n\le1\).'
  238:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{1+\cos n}{n^2}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(0\le1+\cos n\le2\).'
    explanation: 'Compare with \(\sum\dfrac2{n^2}\).'
  239:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{2n}{3n-1}\) —'
    A: converges
    B: diverges
    answer: B
    hint: 'The terms tend to \(\tfrac23\).'
    explanation: '\(n\)th-term test.'
  240:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{n+1}{n^2\sqrt n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Limit comparison with \(\dfrac1{n^{3/2}}\).'
    explanation: 'The ratio tends to \(1\).'
  241:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\left(\dfrac n{3n+1}\right)^n\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Direct comparison with \(\left(\tfrac13\right)^n\).'
    explanation: '\(\dfrac n{3n+1}<\dfrac13\).'
  242:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{\sqrt{n^3+2}}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Direct comparison with \(\dfrac1{n^{3/2}}\).'
    explanation: '\(\sqrt{n^3+2}>n^{3/2}\).'
  243:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=3}^{\infty}\dfrac1{\ln(\ln n)}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\ln\ln n<n\).'
    explanation: '\(\dfrac1{\ln\ln n}>\dfrac1n\).'
  244:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{(\ln n)^2}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\((\ln n)^2<n\) for large \(n\).'
    explanation: 'Compare with \(\sum\tfrac1n\).'
  245:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{(\ln n)^2}{n^3}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\((\ln n)^2<n\), so the term is below \(\tfrac1{n^2}\).'
    explanation: Direct comparison.
  246:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=3}^{\infty}\dfrac{(\ln n)^3}n\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\ln n>1\) for \(n\ge3\).'
    explanation: 'The term exceeds \(\dfrac1n\).'
  247:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{\sqrt n\,\ln n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\ln n<\sqrt n\), so the term exceeds \(\dfrac1n\).'
    explanation: Compare with the harmonic series.
  248:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{(\ln n)^2}{n^{3/2}}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\((\ln n)^2<n^{1/4}\) for large \(n\); compare with \(n^{-5/4}\).'
    explanation: 'Limit comparison with \(n^{-5/4}\).'
  249:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{1+\ln n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(1+\ln n<n\) for \(n\ge2\).'
    explanation: 'The term exceeds \(\dfrac1n\).'
  250:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{(1+\ln n)^2}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\((1+\ln n)^2<n\) for large \(n\).'
    explanation: 'Compare with \(\sum\tfrac1n\).'
  251:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac{\ln(n+1)}{n+1}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(\ln(n+1)>1\) for \(n\ge2\).'
    explanation: 'The term exceeds \(\dfrac1{n+1}\).'
  252:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{1+\ln^2n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: '\(1+\ln^2n<n\) for large \(n\).'
    explanation: 'Compare with \(\sum\tfrac1n\).'
  253:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac1{n\sqrt{n^2-1}}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Limit comparison with \(\dfrac1{n^2}\).'
    explanation: 'The ratio tends to \(1\).'
  254:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{\sqrt n}{n^2+1}\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Limit comparison with \(n^{-3/2}\).'
    explanation: 'The ratio tends to \(1\).'
  255:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{n+2^n}{n^22^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: 'Split: \(\dfrac1{n2^n}+\dfrac1{n^2}\).'
    explanation: Both pieces converge.
  256:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{3^{n-1}+1}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(<\dfrac1{3^{n-1}}\), geometric.'
    explanation: Direct comparison.
  257:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{3^{n-1}+1}{3^n}\) —'
    A: converges
    B: diverges
    answer: B
    hint: 'The terms tend to \(\tfrac13\).'
    explanation: '\(n\)th-term test.'
  258:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\sin\dfrac1n\) —'
    A: converges
    B: diverges
    answer: B
    hint: 'Limit comparison with \(\dfrac1n\).'
    explanation: '\(\dfrac{\sin(1/n)}{1/n}\to1\).'
  259:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\tan\dfrac1n\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Limit comparison with \(\dfrac1n\).'
    explanation: '\(\dfrac{\tan(1/n)}{1/n}\to1\).'
  260:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{10n+1}{n(n+1)(n+2)}\) —'
    A: converges
    B: diverges
    answer: A
    hint: 'Limit comparison with \(\dfrac1{n^2}\).'
    explanation: 'The ratio tends to \(10\).'
  261:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{\tan^{-1}n}{n^{1.1}}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(\tan^{-1}n<\tfrac\pi2\).'
    explanation: 'Compare with \(\sum\dfrac{\pi/2}{n^{1.1}}\).'
  262:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=2}^{\infty}\dfrac{\sec^{-1}n}{n^{1.3}}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(\sec^{-1}n<\tfrac\pi2\).'
    explanation: 'Compare with \(\sum n^{-1.3}\).'
  263:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{\coth n}{n^2}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(\coth n\le\coth1\).'
    explanation: 'Compare with \(\sum\dfrac{\coth1}{n^2}\).'
  264:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{\tanh n}{n^2}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(0<\tanh n<1\).'
    explanation: 'Compare with \(\sum\tfrac1{n^2}\).'
  265:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{n\sqrt[n]n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: 'Limit comparison with \(\dfrac1n\).'
    explanation: '\(\sqrt[n]n\to1\).'
  266:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{\sqrt[n]n}{n^2}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(\sqrt[n]n\le2\).'
    explanation: 'Compare with \(\sum\tfrac2{n^2}\).'
  267:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{1+2+3+\cdots+n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: '\(1+2+\cdots+n=\dfrac{n(n+1)}2\).'
    explanation: 'The terms are \(\dfrac2{n(n+1)}\), comparable to \(\tfrac1{n^2}\).'
  268:
    topic: s11-4
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac1{1+2^2+3^2+\cdots+n^2}\) —'
    A: converges
    B: diverges
    answer: A
    hint: '\(1^2+\cdots+n^2=\dfrac{n(n+1)(2n+1)}6\).'
    explanation: 'The terms are comparable to \(\tfrac1{n^3}\).'
  269:
    topic: s11-4
    question: 'If \(a_n\ge0\) and \(\sum a_n\) converges, then \(\sum\dfrac{a_n}n\)'
    A: may diverge
    B: converges
    C: diverges
    D: 'converges only if \(a_n\) is decreasing'
    answer: B
    hint: '\(0\le\dfrac{a_n}n\le a_n\).'
    explanation: Direct comparison test.
  270:
    topic: s11-4
    question: 'If \(a_n\ge0\) and \(\sum a_n\) converges, then \(\sum a_n^2\)'
    A: diverges
    B: 'converges only if \(a_n<0\)'
    C: may diverge
    D: converges
    answer: D
    hint: 'Eventually \(a_n<1\), so \(a_n^2\le a_n\).'
    explanation: 'Direct comparison with \(\sum a_n\).'
  271:
    topic: s11-4
    question: 'Suppose \(a_n,b_n>0\), \(\displaystyle\lim_{n\to\infty}\dfrac{a_n}{b_n}=\infty\) and \(\sum a_n\) converges. Then \(\sum b_n\)'
    A: diverges
    B: may converge or diverge
    C: converges
    D: 'converges to \(\sum a_n\)'
    answer: C
    hint: 'Eventually \(b_n<a_n\).'
    explanation: Direct comparison.
  272:
    topic: s11-4
    question: 'It is not known whether \(\displaystyle\sum\dfrac1{n^3\sin^2n}\) converges or diverges. Terms become large when \(n\) is near a multiple of \(\pi\); at \(k=355\), the term is enormous because'
    A: '\(\sin355=1\)'
    B: '\(355\) is a multiple of \(\pi\)'
    C: '\(355^3\) is small'
    D: '\(\dfrac{355}{113}\) is an extremely good approximation of \(\pi\), so \(\sin355\) is tiny'
    answer: D
    hint: 'Compute \(355/113-\pi\).'
    explanation: '\(355\approx113\pi\), giving \(\sin355\approx-3\times10^{-5}\), a very large term.'
  273:
    topic: s11-4
    question: 'In the Limit Comparison Test, if \(\displaystyle\lim\dfrac{a_n}{b_n}=c\) with \(0<c<\infty\), then \(\sum a_n\) and \(\sum b_n\)'
    A: both converge
    B: both diverge
    C: both converge or both diverge
    D: have the same sum
    answer: C
    hint: 'For large \(n\), \(a_n\) is between \(\tfrac c2b_n\) and \(2cb_n\).'
    explanation: Apply direct comparison in each direction.
  274:
    topic: s11-4
    question: 'To test \(\displaystyle\sum\dfrac{2n+1}{n^3+n}\), the best comparison series is'
    A: '\(\displaystyle\sum\dfrac1{n^3}\)'
    B: '\(\displaystyle\sum\dfrac1{2^n}\)'
    C: '\(\displaystyle\sum\dfrac1n\)'
    D: '\(\displaystyle\sum\dfrac1{n^2}\) (limit comparison, ratio \(\to2\))'
    answer: D
    hint: Compare the leading terms of numerator and denominator.
    explanation: '\(\dfrac{2n}{n^3}=\dfrac2{n^2}\).'
  275:
    topic: s11-5
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{n^{\sqrt2}}{2^n}\) —'
    A: diverges
    B: converges
    answer: B
    hint: Ratio test.
    explanation: '\(\dfrac{a_{n+1}}{a_n}\to\dfrac12<1\).'
  276:
    topic: s11-5
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}n^2e^{-n}\) —'
    A: converges
    B: diverges
    answer: A
    hint: Ratio test.
    explanation: '\(\dfrac{(n+1)^2}{n^2}\cdot e^{-1}\to e^{-1}<1\).'
  277:
    topic: s11-5
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}n!\,e^{-n}\) —'
    A: diverges
    B: converges
    answer: A
    hint: Ratio test.
    explanation: '\(\dfrac{a_{n+1}}{a_n}=\dfrac{n+1}e\to\infty\).'
  278:
    topic: s11-5
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{n!}{10^n}\) —'
    A: converges
    B: diverges
    answer: B
    hint: Ratio test.
    explanation: '\(\dfrac{n+1}{10}\to\infty\).'
  279:
    topic: s11-5
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{n^{10}}{10^n}\) —'
    A: converges
    B: diverges
    answer: A
