    B: converges conditionally
    C: converges by the ratio test
    D: 'converges to \(\tfrac13\)'
    answer: A
    hint: 'The terms increase toward \(1\).'
    explanation: '\(n\)th-term test.'
  315:
    topic: s11-5
    question: 'For \(\displaystyle\sum_{n=1}^\infty\dfrac1{n^p}\), both the Ratio Test and Root Test'
    A: 'prove convergence for \(p>1\)'
    B: 'prove convergence for \(p>0\)'
    C: 'give limit \(1\) and are inconclusive for every \(p\)'
    D: 'prove divergence for \(p<1\)'
    answer: C
    hint: 'Compute \(\dfrac{n^p}{(n+1)^p}\) and \(\dfrac1{n^{p/n}}\).'
    explanation: 'Both tend to \(1\); use the integral test instead.'
