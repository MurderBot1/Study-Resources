    B: '\((a+ib)e^{(a+ib)x}\)'
    C: '\(e^{(a+ib)x}\)'
    D: '\(ae^{(a+ib)x}\)'
    answer: B
    hint: 'Differentiate \(e^{ax}(\cos bx+i\sin bx)\).'
    explanation: '\(ae^{ax}(\cos bx+i\sin bx)+e^{ax}(-b\sin bx+ib\cos bx)\).'
  537:
    topic: s11-10
    question: 'The first 4 nonzero terms of the Maclaurin series of \((1+x)^{1/2}\) are.'
