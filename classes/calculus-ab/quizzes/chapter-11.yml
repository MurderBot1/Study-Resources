  547:
    topic: s11-10
    question: 'The binomial series of \((1+x)^4\) is the polynomial'
    A: '\(1 - 4x + 6x^{2} - 4x^{3} + x^{4}\)'
    B: '\(2 + 4x + 6x^{2} + 4x^{3} + x^{4}\)'
    C: '\(1 + 4x + 6x^{2} + 4x^{3} + x^{4}\)'
    D: '\(1 + 8x + 6x^{2} + 4x^{3} + x^{4}\)'
    answer: C
