  313:
    topic: s11-5
    question: 'For \(a_1=3\), \(a_{n+1}=\dfrac n{n+1}a_n\), the series \(\sum a_n\)'
    A: converges conditionally
    B: 'diverges, because \(a_n=\dfrac3n\) (the ratio test is inconclusive)'
    C: converges by the root test
    D: converges by the ratio test
    answer: B
    hint: 'Find a closed formula: \(na_n\) is constant.'
    explanation: '\(a_n=\dfrac3n\) is a multiple of the harmonic series.'
  314:
    topic: s11-5
    question: 'For \(a_1=\tfrac13\), \(a_{n+1}=\sqrt[n]{a_n}\), the series \(\sum a_n\)'
