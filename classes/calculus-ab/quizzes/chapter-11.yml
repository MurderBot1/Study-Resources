    C: '\(\dfrac1{2^n}\)'
    D: '\(\dfrac{1}{(n+1)!}\)'
    answer: B
    hint: '\(a_2=\tfrac12\), \(a_3=\tfrac16\), \(a_4=\tfrac1{24}\).'
    explanation: Each term divides the previous one by the next integer.
