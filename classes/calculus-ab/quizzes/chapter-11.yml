    explanation: 'The ratio is \(\dfrac{n+1}{(2n+2)(2n+3)}\to0\).'
  295:
    topic: s11-5
    question: 'The series \(\displaystyle\sum_{n=1}^{\infty}\dfrac{n!}{n^n}\) —'
