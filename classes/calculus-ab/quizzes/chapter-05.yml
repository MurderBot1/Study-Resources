    answer: A
    hint: 'The first term is \(2^0\) and the last is \(2^5\).'
    explanation: 'Equivalent forms: \(\sum_{k=1}^{6}2^{k-1}\) and \(\sum_{k=-1}^{4}2^{k+1}\).'
