    question: 'Use the midpoint rule with four rectangles to estimate the area under \(f(x)=x^2\) between \(x=0\) and \(x=1\).'
    A: '\(\frac{21}{64}\)'
    B: '\(\frac{21}{128}\)'
    C: '\(\frac{21}{32}\)'
    D: '\(- \frac{21}{64}\)'
    answer: A
    hint: 'Evaluate \(f\) at the midpoint of each subinterval and multiply the sum by \(\Delta x\).'
    explanation: 'With \(\Delta x=\frac{1}{4}\) the midpoint sum is \(\frac{21}{64}\).'
  10:
    topic: s5-1
    question: 'Use the midpoint rule with four rectangles to estimate the area under \(f(x)=x^3\) between \(x=0\) and \(x=1\).'
