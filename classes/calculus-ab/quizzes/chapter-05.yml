  13:
    topic: s5-1
    question: 'A model train''s velocity (in./s) at \(t=0,1,\dots,10\) s is \(0,12,22,10,5,13,11,6,2,6,0\). Using left-endpoint values with 10 subintervals of length 1, the distance traveled is about'
    A: '\(92\)'
    B: '\(77\)'
    C: '\(87\)'
    D: '\(97\)'
    answer: C
    hint: 'Add the first ten velocities and multiply by \(\Delta t=1\).'
    explanation: '\(0+12+22+10+5+13+11+6+2+6=87\) inches.'
  14:
    topic: s5-1
    question: For the same velocities, using right-endpoint values gives a distance estimate of
    A: '\(100\)'
    B: '\(87\)'
    C: '\(79\)'
    D: '\(94\)'
    answer: B
    hint: Add the last ten velocities.
    explanation: '\(12+22+10+5+13+11+6+2+6+0=87\) inches, the same as the left-endpoint estimate because the velocity is 0 at both ends.'
  15:
    topic: s5-1
    question: 'Tide-water velocity (m/s) is recorded every 5 min for an hour: \(1,1.2,1.7,2.0,1.8,1.6,1.4,1.2,1.0,1.8,1.5,1.2,0\). The distance a bottle travels upstream, by the left-endpoint estimate (12 intervals of 300 s), is about'
    A: '\(87\text{ m}\)'
    B: '\(5220\text{ m}\)'
    C: '\(4920\text{ m}\)'
    D: '\(10440\text{ m}\)'
    answer: B
    hint: 'Convert minutes to seconds: each subinterval is \(5\cdot60=300\) s.'
    explanation: 'Left-endpoint sum \(=(1+1.2+1.7+2.0+1.8+1.6+1.4+1.2+1.0+1.8+1.5+1.2)\cdot300=5220\) m (right-endpoint estimate: 4920 m).'
  16:
    topic: s5-1
    question: 'A falling object''s acceleration (ft/s\(^2\)) at \(t=0,\dots,5\) s is \(32.00,19.41,11.77,7.14,4.33,2.63\). Since acceleration is decreasing, an upper estimate for the speed at \(t=5\) uses'
    A: 'right-endpoint values: about \(74.65\) ft/s'
    B: 'left-endpoint values: about \(74.65\) ft/s'
    C: 'right-endpoint values: about \(45.28\) ft/s'
    D: 'left-endpoint values: about \(45.28\) ft/s'
    answer: B
    hint: For a decreasing function, left endpoints give the larger (upper) sum.
    explanation: '\(32.00+19.41+11.77+7.14+4.33=74.65\) (the lower estimate with right endpoints is \(45.28\)).'
  17:
    topic: s5-1
    question: 'A projectile is shot straight up at 400 ft/s with only gravity acting (\(g=32\) ft/s\(^2\)). Its velocity after 5 s is'
    A: '\(400\) ft/s'
    B: '\(240\) ft/s'
    C: '\(560\) ft/s'
    D: '\(160\) ft/s'
    answer: B
    hint: '\(v=400-32t\).'
    explanation: '\(400-160=240\) ft/s. An upper estimate for the height uses the velocity at the start of each interval.'
  18:
    topic: s5-1
    question: 'Use four midpoint rectangles to estimate the average value of \(f(x)=x^3\) on \([0,2]\).'
    A: '\(\frac{31}{32}\)'
    B: '\(\frac{31}{16}\)'
    C: '\(- \frac{31}{16}\)'
    D: '\(\frac{31}{8}\)'
    answer: B
    hint: The average is the sum of the function values divided by the number of subintervals.
    explanation: 'Midpoints \(0.25,0.75,1.25,1.75\); the values sum to \(7.5\) when cubed (\(\tfrac1{64}+\tfrac{27}{64}+\tfrac{125}{64}+\tfrac{343}{64}=\tfrac{496}{64}\)), so the average is \(\dfrac{496/64}{4}=\dfrac{31}{16}\).'
  19:
    topic: s5-1
    question: 'Use four midpoint subintervals to estimate the average value of \(f(x)=1/x\) on \([1,9]\).'
    A: '\(\frac{25}{192}\)'
    B: '\(- \frac{25}{96}\)'
    C: '\(\frac{25}{96}\)'
    D: '\(\frac{25}{48}\)'
    answer: C
    hint: Midpoints are 2, 4, 6, 8.
    explanation: '\(\tfrac14\left(\tfrac12+\tfrac14+\tfrac16+\tfrac18\right)=\tfrac{25}{96}\).'
  20:
    topic: s5-1
    question: 'A regular \(n\)-gon is inscribed in a circle of radius 1. As \(n\to\infty\), the area of the polygon'
    A: 'approaches \(\pi\), the area of the circle'
    B: grows without bound
    C: 'approaches \(2\pi\)'
    D: 'approaches \(1\)'
    answer: A
    hint: 'Each of the \(n\) triangles has area \(\tfrac12\sin\tfrac{2\pi}{n}\).'
    explanation: '\(A_n=\tfrac n2\sin\tfrac{2\pi}n\to\pi\).'
  21:
    topic: s5-1
    question: The area of a regular 4-gon inscribed in a circle of radius 1 is
    A: '\(1\)'
    B: '\(\pi\)'
    C: '\(2\)'
    D: '\(4\)'
    answer: C
    hint: 'It is \(n\) congruent triangles with two sides of length 1 and included angle \(2\pi/n\).'
    explanation: '\(\tfrac n2\sin\tfrac{2\pi}n=2\approx2.0000\), a bit less than \(\pi\).'
  22:
    topic: s5-1
    question: The area of a regular 8-gon inscribed in a circle of radius 1 is
    A: '\(\pi\)'
    B: '\(2 \sqrt{2}\)'
    C: '\(4 \sqrt{2}\)'
    D: '\(\sqrt{2}\)'
    answer: B
    hint: 'It is \(n\) congruent triangles with two sides of length 1 and included angle \(2\pi/n\).'
    explanation: '\(\tfrac n2\sin\tfrac{2\pi}n=2 \sqrt{2}\approx2.8284\), a bit less than \(\pi\).'
  23:
    topic: s5-1
    question: 'A lower sum and an upper sum for the same partition of an increasing function \(f\) on \([a,b]\) differ by'
    A: '\(f(a)(b-a)\)'
    B: '\(\Delta x^2\)'
    C: '\(f(b)\,\Delta x\)'
    D: '\([f(b)-f(a)]\,\Delta x\)'
    answer: D
    hint: The difference telescopes into a single rectangle.
    explanation: 'The extra rectangles can be slid together into one of width \(\Delta x\) and height \(f(b)-f(a)\).'
  24:
    topic: s5-1
    question: 'If \(f\) is decreasing on \([a,b]\), a left-endpoint Riemann sum is'
    A: a midpoint sum
    B: an upper sum (overestimate)
    C: a lower sum (underestimate)
    D: always exactly equal to the area
    answer: B
    hint: On each subinterval the left endpoint has the largest value.
    explanation: Right endpoints give a lower sum for a decreasing function.
  25:
    topic: s5-1
    question: 'If \(f\) is increasing on \([a,b]\), a right-endpoint Riemann sum is'
    A: an upper sum (overestimate)
    B: always exact
    C: a lower sum (underestimate)
    D: equal to the midpoint sum
    answer: A
    hint: On each subinterval the right endpoint has the largest value.
    explanation: Left endpoints give a lower sum.
  26:
    topic: s5-1
    question: 'A tanker''s leakage (gal/h) over hours 0–5 is \(50,70,97,136,190,265\). Because the rate is increasing, the total escaped in the first 5 hours is at least'
    A: '\(265\) gallons'
    B: '\(50\) gallons'
    C: '\(758\) gallons'
    D: '\(543\) gallons (left-endpoint sum)'
    answer: D
    hint: For an increasing rate, left endpoints give the lower estimate.
    explanation: '\(50+70+97+136+190=543\); the upper (right-endpoint) estimate is \(70+97+136+190+265=758\).'
