# Chapter 5: Integration
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 5.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 5: Integration"
description: Estimating with finite sums, sigma notation, the definite integral, the Fundamental Theorem of Calculus, substitution, and area between curves.
topics:
  s5-1:
    title: 5.1 Estimating with Finite Sums
  s5-2:
    title: 5.2 Sigma Notation and Limits of Finite Sums
  s5-3:
    title: 5.3 The Definite Integral
  s5-4:
    title: 5.4 The Fundamental Theorem of Calculus
  s5-5:
    title: 5.5 Indefinite Integrals and the Substitution Rule
  s5-6:
    title: 5.6 Substitution and Area Between Curves
questions:
  1:
    topic: s5-1
    question: 'Estimate the area under the graph of \(f(x)=x^2\) between \(x=0\) and \(x=1\) using a lower sum with two rectangles of equal width.'
    A: '\(\frac{1}{8}\)'
    B: '\(- \frac{1}{8}\)'
    C: '\(\frac{1}{16}\)'
    D: '\(\frac{1}{4}\)'
    answer: A
    hint: 'The width of each rectangle is \(\dfrac{b-a}{n}\). A lower sum uses the smaller function value on each subinterval.'
    explanation: 'With \(\Delta x=\frac{1}{2}\) the sum is \(\frac{1}{8}\).'
  2:
    topic: s5-1
    question: 'Estimate the area under the graph of \(f(x)=x^2\) between \(x=0\) and \(x=1\) using an upper sum with four rectangles of equal width.'
    A: '\(\frac{15}{16}\)'
    B: '\(\frac{15}{64}\)'
    C: '\(- \frac{15}{32}\)'
    D: '\(\frac{15}{32}\)'
    answer: D
    hint: 'The width of each rectangle is \(\dfrac{b-a}{n}\). A upper sum uses the larger function value on each subinterval.'
    explanation: 'With \(\Delta x=\frac{1}{4}\) the sum is \(\frac{15}{32}\).'
