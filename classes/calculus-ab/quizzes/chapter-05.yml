    B: "Both give 0: the integrand is odd"
    C: 'Neither works because the integrand is not defined at \(\pm1\)'
    D: '(I) gives \(\tfrac23\) and (II) gives 0'
    answer: B
    hint: 'Check the symmetry of \(r\sqrt{1-r^2}\).'
    explanation: 'An odd function integrates to 0 over \([-1,1]\), and both methods agree.'
