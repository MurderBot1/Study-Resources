  241:
    topic: s5-6
    question: 'Which of the two ways of evaluating \(\displaystyle\int_{-1}^{1}r\sqrt{1-r^2}\,dr\) is right? (I) Let \(u=1-r^2\) and change limits to \(u(-1)=0\), \(u(1)=0\). (II) Compute the antiderivative \(-\tfrac13(1-r^2)^{3/2}\) and substitute.'
