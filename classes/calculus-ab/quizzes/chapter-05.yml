    explanation: 'An antiderivative is \(\operatorname{RootSum} {\left(4 z^{2} + 1, \left( i \mapsto i \ln{\left(2 i + e^{x} \right)} \right)\right)}\); then \(F(\ln{\left(\sqrt{3} \right)})-F(0)=- \frac{i \left(\ln{\left(2 \right)} - \frac{i \pi}{6}\right)}{2} - \frac{i \left(\ln{\left(\sqrt{2} \right)} + \frac{i \pi}{4}\right)}{2} + \frac{i \left(\ln{\left(\sqrt{2} \right)} - \frac{i \pi}{4}\right)}{2} + \frac{i \left(\ln{\left(2 \right)} + \frac{i \pi}{6}\right)}{2}\).'
  239:
    topic: s5-6
    question: 'Evaluate \(\displaystyle\int_{\frac{\pi}{2}}^{\pi} 2 \cot{\left(\frac{\theta}{3} \right)}\,d\theta\).'
