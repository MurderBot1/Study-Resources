    D: '\(-614\) knots'
    answer: D
    hint: '\(s=\sqrt{x^2+y^2}=13\); \(\dot s=\dfrac{x\dot x+y\dot y}{s}\) with \(\dot x=-442\), \(\dot y=-481\).'
    explanation: '\(\dfrac{5(-442)+12(-481)}{13}=\dfrac{-7982}{13}=-614\).'
  204:
    topic: s3-9
    question: A kite 300 ft high is carried horizontally by the wind at 25 ft/s. How fast must the string be let out when 500 ft of string are out?
    A: '\(15\) ft/s'
    B: '\(500\) ft/s'
    C: '\(25\) ft/s'
    D: '\(20\) ft/s'
    answer: D
    hint: 'The horizontal distance is \(x=\sqrt{500^2-300^2}=400\).'
    explanation: '\(\dot s=\dfrac{x}{s}\dot x=\dfrac{400}{500}(25)=20\).'
  205:
    topic: s3-9
    question: 'Sand falls onto a conical pile at 10 m\(^3\)/min. The height of the pile is always \(\tfrac38\) of the base diameter. How fast is the height rising when the pile is 4 m high?'
    A: 'about \(14.9\) cm/min'
    B: 'about \(28.0\) cm/min'
    C: 'about \(8.9\) cm/min'
    D: 'about \(11.2\) cm/min'
    answer: D
    hint: '\(h=\tfrac34r\), so \(r=\tfrac43h\) and \(V=\dfrac{16\pi}{27}h^3\).'
    explanation: '\(\dot V=\dfrac{16\pi}{9}h^2\dot h\), so \(\dot h=\dfrac{90}{16\pi h^2}\approx0.112\) m/min \(\approx11.2\) cm/min at \(h=4\).'
  206:
    topic: s3-9
    question: 'A spherical balloon is inflated at \(100\pi\) ft\(^3\)/min. How fast is the radius increasing when \(r=5\) ft?'
    A: '\(1\) ft/min'
    B: '\(\dfrac{1}{5}\) ft/min'
    C: '\(2\) ft/min'
    D: '\(5\) ft/min'
    answer: A
    hint: '\(\dot V=4\pi r^2\dot r\).'
    explanation: '\(100\pi=4\pi\cdot25\,\dot r\) gives \(\dot r=1\). The surface area then grows at \(8\pi r\dot r=40\pi\) ft\(^2\)/min.'
  207:
    topic: s3-9
    question: A dinghy is pulled to a dock by a rope through a ring 6 ft above the bow, hauled in at 2 ft/s. How fast is the boat approaching the dock when 10 ft of rope are out?
    A: '\(2\) ft/s'
    B: '\(2.5\) ft/s'
    C: '\(4\) ft/s'
    D: '\(1.6\) ft/s'
    answer: B
    hint: '\(s^2=x^2+36\) with \(s=10\), \(x=8\).'
    explanation: '\(s\dot s=x\dot x\) gives \(\dot x=\dfrac{10}{8}(-2)=-2.5\) ft/s.'
  208:
    topic: s3-9
    question: A balloon rises at 1 ft/s while a bicycle moving at 17 ft/s passes under it when the balloon is 65 ft up. Three seconds later, the distance between them is increasing at
    A: '\(17\) ft/s'
    B: '\(85\) ft/s'
    C: '\(9.5\) ft/s'
    D: '\(11\) ft/s'
    answer: D
    hint: 'After 3 s: \(x=51\), \(y=68\), \(s=85\).'
    explanation: '\(\dot s=\dfrac{x\dot x+y\dot y}{s}=\dfrac{51(17)+68(1)}{85}=11\).'
  209:
    topic: s3-9
    question: 'A particle moves along \(y=x^2\) in the first quadrant with \(\dot x=10\) m/s. How fast is the angle of inclination \(\theta\) of the line to the origin changing when \(x=3\)?'
    A: '\(\dfrac{10}{9}\) rad/s'
    B: '\(10\) rad/s'
    C: '\(\dfrac{1}{3}\) rad/s'
    D: '\(1\) rad/s'
    answer: D
    hint: '\(\tan\theta=\dfrac yx=x\), so \(\theta=\tan^{-1}x\).'
    explanation: '\(\dot\theta=\dfrac{\dot x}{1+x^2}=\dfrac{10}{10}=1\).'
  210:
    topic: s3-9
    question: A man 6 ft tall walks at 5 ft/s toward a street lamp 16 ft high. The tip of his shadow moves at
    A: '\(8\) ft/s away from the lamp'
    B: '\(3\) ft/s toward the lamp'
    C: '\(8\) ft/s toward the lamp'
    D: '\(5\) ft/s toward the lamp'
    answer: C
    hint: 'Similar triangles give the tip at \(T=\dfrac{16}{10}x=1.6x\) from the lamp pole, where \(x\) is his distance.'
    explanation: '\(\dot T=1.6\cdot(-5)=-8\); the shadow''s length changes at \(-3\) ft/s.'
  211:
    topic: s3-9
    question: 'Ice of uniform thickness coats an 8-in. (diameter) iron ball and melts at 10 in\(^3\)/min. When the ice is 2 in. thick, the outer surface area is changing at'
    A: '\(\dfrac{10}{3}\) in\(^2\)/min'
    B: '\(-\dfrac{10}{3}\) in\(^2\)/min'
    C: '\(-10\) in\(^2\)/min'
    D: '\(-\dfrac{5}{72\pi}\) in\(^2\)/min'
    answer: B
    hint: 'The outer radius is \(r=6\); \(\dot V=4\pi r^2\dot r\).'
    explanation: '\(\dot r=-\dfrac{10}{144\pi}\), and \(\dot S=8\pi r\dot r=-\dfrac{10}{3}\).'
  212:
    topic: s3-9
    question: "A highway patrol plane at 3 mi altitude flies at 120 mph. The radar shows the line-of-sight distance to an oncoming car is 5 mi and decreasing at 160 mph. The car's speed is"
    A: '\(40\) mph'
    B: '\(80\) mph'
    C: '\(160\) mph'
    D: '\(200\) mph'
    answer: B
    hint: 'The horizontal distance is 4 mi, so its rate is \(\dfrac54(-160)\).'
    explanation: 'The gap closes horizontally at 200 mph; the plane contributes 120, so the car goes \(200-120=80\) mph.'
  213:
    topic: s3-9
    question: 'Two walkers are on perpendicular streets: A approaches the intersection at 2 m/s (now 10 m away) and B moves away at 1 m/s (now 20 m away). The angle \(\theta\) at B is changing at about'
    A: '\(-3^\circ\) per second'
    B: '\(-0.5^\circ\) per second'
    C: '\(+6^\circ\) per second'
    D: '\(-6^\circ\) per second'
    answer: D
    hint: '\(\tan\theta=\dfrac{OA}{OB}\), so \(\dot\theta=\dfrac{OB\cdot\dot{OA}-OA\cdot\dot{OB}}{OA^2+OB^2}\).'
    explanation: '\(\dfrac{20(-2)-10(1)}{500}=-0.1\) rad/s \(\approx-5.7^\circ\)/s, about \(-6^\circ\)/s.'
  214:
    topic: s3-9
    question: A baseball diamond is a 90-ft square. A runner goes from first base to second at 16 ft/s. When 30 ft from first base, the distance to third base is changing at about
    A: '\(12.7\) ft/s'
    B: '\(5.1\) ft/s'
    C: '\(2.4\) ft/s'
    D: '\(16\) ft/s'
    answer: B
    hint: 'Distance to third: \(s=\sqrt{90^2+x^2}\).'
    explanation: '\(\dot s=\dfrac{x\dot x}{s}=\dfrac{30(16)}{\sqrt{9000}}\approx5.06\).'
  215:
    topic: s3-9
    question: 'Two ships leave point \(O\) on courses 120° apart at 14 and 21 knots. When \(OA=5\) and \(OB=3\) nautical miles, they are moving apart at'
    A: '\(29.5\) knots'
    B: '\(14.5\) knots'
    C: '\(35\) knots'
    D: '\(7\) knots'
    answer: A
    hint: 'Law of cosines with \(\cos120^\circ=-\tfrac12\): \(D^2=a^2+b^2+ab\).'
    explanation: '\(D=7\) and \(\dot D=\dfrac{2a\dot a+2b\dot b+a\dot b+\dot ab}{2D}=\dfrac{413}{14}=29.5\).'
  216:
    topic: s3-10
    question: 'The linearization of \(f(x)=x^3-2x+3\) at \(a=2\) is'
    A: '\(L(x)=10x-7\)'
    B: '\(L(x)=7x-7\)'
    C: '\(L(x)=10x+7\)'
    D: '\(L(x)=10x-13\)'
    answer: D
    hint: '\(L(x)=f(a)+f''(a)(x-a)\).'
    explanation: '\(f(2)=7\) and \(f''(2)=3(4)-2=10\), so \(L=7+10(x-2)=10x-13\).'
  217:
    topic: s3-10
    question: 'The linearization of \(f(x)=\sqrt{x^2+9}\) at \(a=-4\) is'
    A: '\(L(x)=-\dfrac45x+\dfrac95\)'
    B: '\(L(x)=\dfrac45x+\dfrac{41}5\)'
    C: '\(L(x)=-\dfrac45x+5\)'
    D: '\(L(x)=\dfrac45x+\dfrac95\)'
    answer: A
    hint: '\(f(-4)=5\) and \(f''(x)=\dfrac{x}{\sqrt{x^2+9}}\).'
    explanation: '\(L=5-\tfrac45(x+4)=-\tfrac45x+\tfrac95\).'
  218:
    topic: s3-10
    question: 'The linearization of \(f(x)=x+\dfrac1x\) at \(a=1\) is'
    A: '\(L(x)=x\)'
    B: '\(L(x)=x+1\)'
    C: '\(L(x)=2\)'
    D: '\(L(x)=2x\)'
    answer: C
    hint: '\(f''(1)=1-1\).'
    explanation: 'The tangent is horizontal at \(x=1\) with \(f(1)=2\).'
  219:
    topic: s3-10
    question: 'The linearization of \(f(x)=\sqrt[3]{x}\) at \(a=-8\) is'
    A: '\(L(x)=-2+\dfrac{x+8}{12}\)'
    B: '\(L(x)=2+\dfrac{x+8}{12}\)'
    C: '\(L(x)=-2+\dfrac{x+8}{3}\)'
    D: '\(L(x)=-2-\dfrac{x+8}{12}\)'
    answer: A
    hint: '\(f''(x)=\dfrac{1}{3x^{2/3}}\).'
    explanation: '\(f(-8)=-2\) and \(f''(-8)=\dfrac1{3\cdot4}=\dfrac1{12}\).'
  220:
    topic: s3-10
    question: 'The linearization of \(\tan x\) at \(x=\pi\) is'
    A: '\(L(x)=1\)'
    B: '\(L(x)=x\)'
    C: '\(L(x)=x-\pi\)'
    D: '\(L(x)=\pi\)'
    answer: C
    hint: '\(\tan\pi=0\) and \(\sec^2\pi=1\).'
    explanation: '\(L=0+1\cdot(x-\pi)\).'
  221:
    topic: s3-10
    question: 'The linearizations at \(x=0\) of \(\sin x\), \(\cos x\), \(\tan x\), \(e^x\) and \(\ln(1+x)\) are, respectively'
    A: '\(x,\ 1-x,\ x,\ 1+x,\ 1+x\)'
    B: '\(x,\ x,\ x,\ x,\ x\)'
    C: '\(1,\ 1,\ 1,\ 1+x,\ x\)'
    D: '\(x,\ 1,\ x,\ 1+x,\ x\)'
    answer: D
    hint: Evaluate each function and its derivative at 0.
    explanation: 'Their values at 0 are \(0,1,0,1,0\), and their derivatives are \(1,0,1,1,1\).'
  222:
    topic: s3-10
    question: 'The linearization of \((1+x)^k\) at \(x=0\) is'
    A: '\(1+kx\)'
    B: '\(1+x^k\)'
    C: '\(1+k\)'
    D: '\(kx\)'
    answer: A
    hint: '\(f(0)=1\) and \(f''(0)=k\).'
    explanation: '\(L(x)=1+kx\).'
  223:
    topic: s3-10
    question: 'Use \((1+x)^k\approx1+kx\) to estimate \((1.0002)^{50}\).'
    A: '\(1.01\)'
    B: '\(1.0002\)'
    C: '\(1.001\)'
    D: '\(1.1\)'
    answer: A
    hint: 'Here \(x=0.0002\) and \(k=50\).'
    explanation: '\(1+50(0.0002)=1.01\).'
  224:
    topic: s3-10
    question: 'Using the linear approximation, \(\sqrt[3]{1.009}\approx\)'
    A: '\(1.0003\)'
    B: '\(1.03\)'
    C: '\(1.003\)'
    D: '\(1.009\)'
    answer: C
    hint: '\(\sqrt[3]{1+x}\approx1+\tfrac x3\).'
    explanation: '\(1+0.009/3=1.003\).'
  225:
    topic: s3-10
    question: 'Find \(\dfrac{d}{dx}\left[- 3 \sqrt{x} + x^{3}\right]\).'
    A: '\(3 x^{3} - \frac{3}{2 \sqrt{x}}\)'
    B: '\(3 x^{2} - \frac{3}{2 \sqrt{x}}\)'
    C: '\(- \frac{3 \sqrt{x}}{2} + 3 x^{2}\)'
    D: '\(2 x^{2} - \frac{3}{2 \sqrt{x}}\)'
    answer: B
    hint: 'Then \(dy=y''\,dx\).'
    explanation: 'Differentiating gives \(3 x^{2} - \frac{3}{2 \sqrt{x}}\).'
  226:
    topic: s3-10
    question: 'Find \(\dfrac{d}{dx}\left[\frac{2 x}{x^{2} + 1}\right]\).'
    A: '\(2 x^{2} - \frac{4 x^{2}}{\left(x^{2} + 1\right)^{2}} + 2\)'
    B: '\(- \frac{4 x^{2}}{\left(x^{2} + 1\right)^{2}} + \frac{2}{x^{2} + 1}\)'
    C: '\(- \frac{2}{x^{2}}\)'
    D: '\(- 4 x^{2} \left(x^{2} + 1\right)^{2} + \frac{2}{x^{2} + 1}\)'
    answer: B
    hint: 'Quotient rule; multiply the result by \(dx\) to get \(dy\).'
    explanation: 'Differentiating gives \(- \frac{4 x^{2}}{\left(x^{2} + 1\right)^{2}} + \frac{2}{x^{2} + 1}\).'
  227:
    topic: s3-10
    question: 'Find \(\dfrac{d}{dx}\left[e^{\sqrt{x}}\right]\).'
    A: '\(\frac{e^{\sqrt{x}}}{2 x^{\frac{3}{2}}}\)'
    B: '\(- \frac{e^{\frac{1}{\sqrt{x}}}}{2 \sqrt{x}}\)'
    C: '\(\frac{e^{\sqrt{x}}}{2 \sqrt{x}}\)'
    D: '\(\frac{e^{x}}{\sqrt{x}}\)'
    answer: C
    hint: 'Chain rule; the differential is \(dy=\dfrac{e^{\sqrt x}}{2\sqrt x}dx\).'
    explanation: 'Differentiating gives \(\frac{e^{\sqrt{x}}}{2 \sqrt{x}}\).'
  228:
    topic: s3-10
    question: 'For \(f(x)=x^2+2x\), \(x_0=1\), \(dx=0.1\), the change \(\Delta f\), the differential \(df\), and the approximation error are'
    A: '\(\Delta f=0.41\), \(df=0.4\), error \(0.01\)'
    B: '\(\Delta f=0.31\), \(df=0.4\), error \(0.09\)'
    C: '\(\Delta f=0.41\), \(df=0.3\), error \(0.11\)'
    D: '\(\Delta f=0.4\), \(df=0.41\), error \(0.01\)'
    answer: A
    hint: '\(\Delta f=f(1.1)-f(1)\) and \(df=f''(1)\,dx\).'
    explanation: '\(f(1.1)=3.41\), \(f(1)=3\); \(f''(1)=4\) so \(df=0.4\); error \(=0.01\).'
  229:
    topic: s3-10
    question: 'The change in the volume \(V=\tfrac43\pi r^3\) of a sphere when \(r\) changes from \(r_0\) to \(r_0+dr\) is approximately'
    A: '\(dV=8\pi r_0^2\,dr\)'
    B: '\(dV=4\pi r_0^2\,dr\)'
    C: '\(dV=4\pi r_0\,dr\)'
    D: '\(dV=\tfrac43\pi r_0^3\,dr\)'
    answer: B
    hint: '\(dV=V''(r_0)\,dr\).'
    explanation: '\(V''(r)=4\pi r^2\), the surface area.'
  230:
    topic: s3-10
    question: 'The edge of a cube changes from \(x_0\) to \(x_0+dx\). The change in its volume \(V=x^3\) is approximately'
    A: '\(dV=6x_0\,dx\)'
    B: '\(dV=3x_0\,dx\)'
    C: '\(dV=3x_0^2\,dx\)'
    D: '\(dV=x_0^2\,dx\)'
    answer: C
    hint: 'Differentiate \(x^3\).'
    explanation: '\(3x_0^2\,dx\); its surface area changes by \(12x_0\,dx\).'
  231:
    topic: s3-10
    question: The radius of a circle increases from 2.00 m to 2.02 m. The estimated change in area is about
    A: '\(0.08\pi\) m\(^2\), a \(4\%\) increase'
    B: '\(0.08\pi\approx0.25\) m\(^2\), which is a \(2\%\) increase'
    C: '\(0.04\pi\) m\(^2\), a \(1\%\) increase'
    D: '\(0.02\pi\) m\(^2\), a \(2\%\) increase'
    answer: B
    hint: '\(dA=2\pi r\,dr\) and the original area is \(4\pi\).'
    explanation: '\(dA=2\pi(2)(0.02)=0.08\pi\), which is \(0.08\pi/4\pi=2\%\).'
  232:
    topic: s3-10
    question: "A tree's trunk has diameter 10 in. and its circumference increases by 2 in. in a year. About how much did the cross-sectional area increase?"
    A: '\(5\pi\) in\(^2\)'
    B: '\(2\pi\) in\(^2\)'
    C: '\(20\) in\(^2\)'
    D: '\(10\) in\(^2\)'
    answer: D
    hint: '\(C=\pi D\), so \(dD=2/\pi\); \(A=\tfrac\pi4D^2\) gives \(dA=\tfrac\pi2D\,dD\).'
    explanation: '\(dD=2/\pi\approx0.64\) in. and \(dA=\tfrac\pi2\cdot10\cdot\tfrac2\pi=10\).'
  233:
    topic: s3-10
    question: A cylinder has height 30 in., radius 6 in. and shell thickness 0.5 in. Its shell volume is approximately
    A: '\(180\pi\) in\(^3\)'
    B: '\(18\pi\) in\(^3\)'
    C: '\(90\pi\) in\(^3\)'
    D: '\(1080\pi\) in\(^3\)'
    answer: A
    hint: '\(dV=2\pi rh\,dr\).'
    explanation: '\(2\pi(6)(30)(0.5)=180\pi\).'
  234:
    topic: s3-10
    question: 'The edge of a cube is measured as \(10\pm1\%\) cm. The estimated percentage error in the volume is'
    A: '\(1\%\)'
    B: '\(9\%\)'
    C: '\(6\%\)'
    D: '\(3\%\)'
    answer: D
    hint: '\(V=x^3\) so \(\dfrac{dV}{V}=3\dfrac{dx}{x}\).'
    explanation: '\(3\cdot1\%=3\%\).'
  235:
    topic: s3-10
    question: "A square's side is measured. To be sure of calculating the area within 2% of its true value, the side must be measured to within about"
    A: '\(4\%\)'
    B: '\(1\%\)'
    C: '\(0.5\%\)'
    D: '\(2\%\)'
    answer: B
    hint: '\(A=s^2\) so \(\dfrac{dA}{A}=2\dfrac{ds}{s}\).'
    explanation: '\(2\%/2=1\%\).'
  236:
    topic: s3-10
    question: 'A sphere''s diameter is measured as \(100\pm1\) cm. The estimated percentage error in the volume is'
    A: '\(6\%\)'
    B: '\(3\%\)'
    C: '\(1\%\)'
    D: '\(0.03\%\)'
    answer: B
    hint: '\(V\propto D^3\), so the relative error triples.'
    explanation: '\(\dfrac{dV}{V}=3\dfrac{dD}{D}=3(1\%)=3\%\).'
  237:
    topic: s3-10
    question: 'A 5% error in measuring \(t\) causes about what error in calculating \(s=16t^2\)?'
    A: '\(2.5\%\)'
    B: '\(25\%\)'
    C: '\(10\%\)'
    D: '\(5\%\)'
    answer: C
    hint: '\(\dfrac{ds}{s}=2\dfrac{dt}{t}\).'
    explanation: '\(2\cdot5\%=10\%\).'
  238:
    topic: s3-10
    question: 'A cylinder has equal height and radius, \(V=\pi h^3\). To calculate the volume to within 1%, the height can be measured with an error of at most about'
    A: '\(3\%\)'
    B: '\(\tfrac13\%\)'
    C: '\(1\%\)'
    D: '\(\tfrac{1}{9}\%\)'
    answer: B
    hint: '\(\dfrac{dV}{V}=3\dfrac{dh}{h}\).'
    explanation: '\(\dfrac{dh}{h}\le\dfrac{1\%}{3}\).'
  239:
    topic: s3-10
    question: Using the linear approximation, by about what percentage should the radius of a sphere be increased to increase its volume by 50%?
    A: 'about \(25\%\)'
    B: 'about \(16.7\%\)'
    C: 'about \(10\%\)'
    D: 'about \(50\%\)'
    answer: B
    hint: '\(\dfrac{dV}{V}=3\dfrac{dr}{r}\).'
    explanation: '\(0.5=3\,dr/r\) gives \(dr/r\approx1/6\).'
  240:
    topic: s3-10
    question: 'A body''s mass is \(m=m_0\big/\sqrt{1-v^2/c^2}\approx m_0\left(1+\dfrac{v^2}{2c^2}\right)\). To increase its mass by 1%, it must be accelerated to a speed of about'
    A: '\(0.01c\)'
    B: '\(0.5c\)'
    C: '\(0.14c\)'
    D: '\(0.1c\)'
    answer: C
    hint: 'Set \(\dfrac{v^2}{2c^2}=0.01\).'
    explanation: '\(v^2/c^2=0.02\), so \(v\approx0.141c\).'
  241:
    topic: s3-10
    question: 'The linear approximation to \(\sqrt{1+x}\) near 0 is \(1+\tfrac x2\). It must improve as \(x\to0\) because'
    A: '\(\displaystyle\lim_{x\to0}\dfrac{\sqrt{1+x}}{1+x/2}=1\)'
    B: 'the error equals \(x\)'
    C: '\(\sqrt{1+x}=1+x/2\) exactly'
    D: '\(\sqrt{1+x}\) is a polynomial'
    answer: A
    hint: The ratio of the function to its approximation tends to 1.
    explanation: This is the statement that the error is negligible compared to the function near 0.
  242:
    topic: s3-10
    question: 'Among all linear functions \(g(x)=m(x-a)+c\), the linearization \(L(x)=f(a)+f''(a)(x-a)\) is the only one for which the error \(E(x)=f(x)-g(x)\) satisfies'
    A: '\(E(a)=1\)'
    B: '\(E(a)=0\) and \(\displaystyle\lim_{x\to a}\dfrac{E(x)}{x-a}=0\)'
    C: '\(E(x)=0\) for all \(x\)'
    D: '\(E\) is always positive'
    answer: B
    hint: 'The error must vanish at \(a\) and be negligible compared with \(x-a\).'
    explanation: 'Those two conditions force \(c=f(a)\) and \(m=f''(a)\).'
