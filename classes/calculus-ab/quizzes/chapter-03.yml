# Chapter 3: Differentiation
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 3.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 3: Differentiation"
description: The derivative as a function, differentiation rules, rates of change, trig/chain/implicit/inverse derivatives, related rates, and linearization.
topics:
  s3-1:
    title: 3.1 The Derivative as a Function
  s3-2:
    title: 3.2 Differentiation Rules for Polynomials, Exponentials, Products, and Quotients
  s3-3:
    title: 3.3 The Derivative as a Rate of Change
  s3-4:
    title: 3.4 Derivatives of Trigonometric Functions
  s3-5:
    title: 3.5 The Chain Rule and Parametric Equations
  s3-6:
    title: 3.6 Implicit Differentiation
  s3-7:
    title: 3.7 Derivatives of Inverse Functions and Logarithms
  s3-8:
    title: 3.8 Inverse Trigonometric Functions
  s3-9:
    title: 3.9 Related Rates
  s3-10:
    title: 3.10 Linearization and Differentials
questions:
  1:
    topic: s3-1
    question: 'For \(f(x)=4-x^2\), the derivative computed from the definition \(f''(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}\) gives \(f''(-3)=\)'
    A: '\(3\)'
    B: '\(6\)'
    C: '\(-2\)'
    D: '\(-6\)'
    answer: B
    hint: 'Compute \(\dfrac{f(x+h)-f(x)}{h}=-2x-h\).'
    explanation: '\(f''(x)=-2x\), so \(f''(-3)=6\).'
  2:
    topic: s3-1
    question: 'If \(g(t)=\dfrac{1}{t^2}\), then \(g''(2)=\)'
    A: '\(- \frac{1}{4}\)'
    B: '\(\frac{1}{4}\)'
    C: '\(\frac{1}{2}\)'
    D: '\(- \frac{1}{2}\)'
    answer: A
    hint: 'Use \(g''(t)=-2t^{-3}\).'
    explanation: '\(-\dfrac{2}{8}=-\dfrac14\).'
  3:
    topic: s3-1
    question: 'If \(k(z)=\dfrac{1-z}{2z}\), then \(k''(1)=\)'
    A: '\(\frac{1}{2}\)'
    B: '\(\frac{1}{4}\)'
    C: '\(-1\)'
    D: '\(- \frac{1}{2}\)'
    answer: D
    hint: 'Rewrite \(k(z)=\dfrac1{2z}-\dfrac12\).'
    explanation: '\(k''(z)=-\dfrac{1}{2z^2}\), so \(k''(1)=-\tfrac12\).'
  4:
    topic: s3-1
    question: 'If \(r(s)=\sqrt{2s+1}\), then \(r''(0)=\)'
    A: '\(\frac{1}{2}\)'
    B: '\(1\)'
    C: '\(2\)'
    D: '\(0\)'
    answer: B
    hint: 'The derivative of \(\sqrt{u}\) is \(\dfrac{u''}{2\sqrt u}\).'
    explanation: '\(r''(s)=\dfrac{1}{\sqrt{2s+1}}\), so \(r''(0)=1\).'
  5:
    topic: s3-1
    question: 'If \(p(\theta)=\sqrt{3\theta}\), then \(p''(3)=\)'
    A: '\(\frac{1}{2}\)'
    B: '\(\frac{3}{2}\)'
    C: '\(\frac{1}{3}\)'
    D: '\(1\)'
    answer: A
    hint: '\(p''(\theta)=\dfrac{3}{2\sqrt{3\theta}}\).'
    explanation: '\(\dfrac{3}{2\cdot3}=\dfrac12\).'
  6:
    topic: s3-1
    question: 'Find \(\dfrac{d}{dt}\left[\frac{t}{2 t + 1}\right]\).'
    A: '\(- \frac{3 t}{\left(2 t + 1\right)^{3}} + \frac{1}{2 t + 1}\)'
    B: '\(- \frac{2 t}{\left(2 t + 1\right)^{2}} + \frac{1}{2 t + 1}\)'
    C: '\(- \frac{2 t}{\left(1 - 2 t\right)^{2}} + \frac{1}{1 - 2 t}\)'
    D: '\(- \frac{2 t}{\left(2 t + 1\right)^{2}} + 1\)'
    answer: B
    hint: Use the quotient rule.
    explanation: 'Differentiating gives \(- \frac{2 t}{\left(2 t + 1\right)^{2}} + \frac{1}{2 t + 1}\).'
  7:
    topic: s3-1
    question: 'The slope of the tangent line to \(f(x)=x+\dfrac9x\) at \(x=-3\) is'
    A: '\(\frac{1}{3}\)'
    B: '\(0\)'
    C: '\(-2\)'
    D: '\(2\)'
    answer: B
    hint: '\(f''(x)=1-\dfrac{9}{x^2}\).'
    explanation: '\(1-\tfrac99=0\): a horizontal tangent.'
  8:
    topic: s3-1
    question: 'The slope of the tangent to \(y=(x+1)^3\) at \(x=-2\) is'
    A: '\(-3\)'
    B: '\(3\)'
    C: '\(9\)'
    D: '\(12\)'
    answer: B
    hint: '\(y''=3(x+1)^2\).'
    explanation: '\(3(-1)^2=3\).'
  9:
    topic: s3-1
    question: 'An equation of the tangent line to \(y=\dfrac{8}{\sqrt{x-2}}\) at \((6,4)\) is'
    A: '\(y=-\dfrac12x+4\)'
    B: '\(y=\dfrac12x+1\)'
    C: '\(y=-2x+16\)'
    D: '\(y=-\dfrac12x+7\)'
    answer: D
    hint: '\(y''=-4(x-2)^{-3/2}\). Find the slope at \(x=6\), then use point-slope form.'
    explanation: 'Slope \(=-4/8=-\tfrac12\), so \(y-4=-\tfrac12(x-6)\), i.e. \(y=-\tfrac12x+7\).'
  10:
    topic: s3-1
    question: Which statement about differentiability is true?
    A: '\(f\) is differentiable wherever it has a corner'
    B: 'If \(f\) is continuous at \(x_0\), then \(f\) is differentiable at \(x_0\)'
    C: 'If \(f\) is differentiable at \(x_0\), then \(f\) is continuous at \(x_0\)'
    D: '\(f\) can be differentiable at \(x_0\) without being defined there'
    answer: C
    hint: 'Think of \(|x|\) at 0.'
    explanation: 'Differentiability implies continuity, but the converse fails (for example \(|x|\) at 0).'
  11:
    topic: s3-1
    question: At which kind of point is a continuous function NOT differentiable?
    A: 'A corner, such as the point of \(y=|x|\) at \(x=0\)'
    B: A point where the tangent line is horizontal
    C: A point where the graph is smooth
    D: A point where the derivative equals 0
    answer: A
    hint: Compare the left-hand and right-hand derivatives.
    explanation: 'At a corner the two one-sided slopes (\(-1\) and \(1\) for \(|x|\)) are different, so the derivative does not exist.'
  12:
    topic: s3-1
    question: 'The graph of \(y=\lfloor x\rfloor\) (the greatest integer function)'
    A: 'is not differentiable on \((-\infty,\infty)\) because it has jumps at the integers'
    B: is differentiable everywhere with derivative 1
    C: is differentiable everywhere with derivative 0
    D: is differentiable only at the integers
    answer: A
    hint: Is the function even continuous at the integers?
    explanation: It is discontinuous at every integer, so it cannot be differentiable there. (It is differentiable, with derivative 0, between integers.)
  13:
    topic: s3-1
    question: 'Does the curve \(y=x^3\) ever have a negative slope?'
    A: 'Yes, for \(x>0\)'
    B: 'No, because \(y''=3x^2\ge0\)'
    C: 'Only at \(x=0\)'
    D: 'Yes, for \(x<0\)'
    answer: B
    hint: 'Compute \(y''\) and check its sign.'
    explanation: '\(3x^2\) is never negative; it is 0 only at the origin.'
  14:
    topic: s3-1
    question: 'Does the graph of \(y=2\sqrt x\) have any horizontal tangent?'
    A: 'Yes, at \(x=1\)'
    B: 'Yes, at \(x=0\)'
    C: 'Yes, wherever \(x>0\)'
    D: 'No, because \(y''=1/\sqrt x\) is never 0'
    answer: D
    hint: 'A horizontal tangent needs \(y''=0\).'
    explanation: '\(1/\sqrt{x}\) is positive for every \(x>0\) (and undefined at 0).'
  15:
    topic: s3-1
    question: 'Does the parabola \(y=2x^2-13x+5\) have a tangent line with slope \(-1\)? If so, where is the point of tangency?'
    A: 'Yes, at \((3,-16)\), with tangent \(y=-x-13\)'
    B: 'Yes, at \((-3,62)\), with tangent \(y=-x+59\)'
    C: 'No, the slope is never \(-1\)'
    D: 'Yes, at \((3,-16)\), with tangent \(y=-x+13\)'
    answer: A
    hint: 'Solve \(y''=4x-13=-1\).'
    explanation: '\(x=3\) and \(y=18-39+5=-16\); the line is \(y+16=-(x-3)\).'
  16:
    topic: s3-1
    question: 'Does \(y=\sqrt x\) have a tangent line with slope \(-1\)?'
    A: 'No, because \(y''=\dfrac{1}{2\sqrt x}>0\)'
    B: 'Yes, at \(x=-1\)'
    C: 'Yes, at \(x=\tfrac14\)'
    D: 'Yes, at \(x=1\)'
    answer: A
    hint: Check the sign of the derivative.
    explanation: 'The derivative of \(\sqrt{x}\) is always positive, so no tangent has negative slope.'
  17:
    topic: s3-1
    question: 'If \(|f(x)|\le x^2\) for \(-1\le x\le1\), then \(f\) is differentiable at \(x=0\) and \(f''(0)=\)'
    A: '\(0\)'
    B: '\(1\)'
    C: It cannot be determined
    D: '\(\infty\)'
    answer: A
    hint: '\(|f(h)|/|h|\le|h|\) and \(f(0)=0\) because \(|f(0)|\le0\).'
    explanation: '\(\left|\dfrac{f(h)-f(0)}{h}\right|\le|h|\to0\).'
  18:
    topic: s3-1
    question: 'For \(f(x)=\begin{cases}x^2\sin\frac1x,&x\neq0\\0,&x=0\end{cases}\), the derivative at \(0\) is'
    A: It does not exist
    B: '\(0\)'
    C: '\(\infty\)'
    D: '\(1\)'
    answer: B
    hint: 'Compute \(\dfrac{h^2\sin(1/h)-0}{h}=h\sin(1/h)\).'
    explanation: '\(|h\sin(1/h)|\le|h|\to0\).'
  19:
    topic: s3-1
    question: 'The centered difference quotient \(\dfrac{f(0+h)-f(0-h)}{2h}\) for \(f(x)=|x|\) has limit \(0\) as \(h\to0\), yet \(f\) has no derivative at \(0\). The moral is'
    A: '\(|x|\) is differentiable at 0'
    B: make sure the derivative exists before using a centered difference quotient
    C: one-sided derivatives never differ
    D: centered difference quotients are always exact
    answer: B
    hint: 'Compute the quotient: \(\dfrac{|h|-|{-h}|}{2h}\).'
    explanation: 'The quotient is identically 0, but the one-sided slopes are \(-1\) and \(1\).'
  20:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dt}\left[- 3 t^{5} + 5 t^{3}\right]\).'
    A: '\(- 15 t^{4} - 15 t^{2}\)'
    B: '\(- 15 t^{4} + 15 t^{2}\)'
    C: '\(- 15 t^{4} + 15 t\)'
    D: '\(15 t^{4} + 15 t^{2}\)'
    answer: B
    hint: Use the power rule on each term.
    explanation: 'Differentiating gives \(- 15 t^{4} + 15 t^{2}\).'
  21:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dx}\left[\frac{4 x^{3}}{3} - x + 2 e^{x}\right]\).'
    A: '\(4 x^{2} + 2 e^{x} - 1\)'
    B: '\(4 x^{2} + 2 e^{x} - 2\)'
    C: '\(2 x^{2} + 2 e^{x} - 1\)'
    D: '\(4 x^{4} + 4 e^{x} - 1\)'
    answer: A
    hint: 'The derivative of \(e^x\) is \(e^x\).'
    explanation: 'Differentiating gives \(4 x^{2} + 2 e^{x} - 1\).'
  22:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dz}\left[- \frac{1}{z} + \frac{3}{z^{2}}\right]\).'
    A: '\(\frac{1}{z^{2}} - \frac{3}{z^{3}}\)'
    B: '\(- \frac{6}{z^{3}}\)'
    C: '\(\frac{1}{z^{2}} - \frac{6}{z^{3}}\)'
    D: '\(\frac{1}{z^{2}}\)'
    answer: C
    hint: 'Rewrite \(1/z\) as \(z^{-1}\).'
    explanation: 'Differentiating gives \(\frac{1}{z^{2}} - \frac{6}{z^{3}}\).'
  23:
    topic: s3-2
    question: 'Find \(\dfrac{d^{2}}{dx^{2}}\left[6 x^{2} - 10 x - \frac{5}{x^{2}}\right]\).'
    A: '\(6 \left(2 - \frac{5}{x^{4}}\right)\)'
    B: '\(12 x - 10 + \frac{10}{x^{3}}\)'
    C: '\(12 - \frac{10}{x^{4}}\)'
    D: '\(12 - \frac{30}{x^{3}}\)'
    answer: A
    hint: 'Differentiate \(-5x^{-2}\) with the power rule.'
    explanation: 'Differentiating gives \(6 \left(2 - \frac{5}{x^{4}}\right)\).'
  24:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dx}\left[\left(3 - x^{2}\right) \left(x^{3} - x + 1\right)\right]\).'
    A: '\(2 x \left(x^{3} - x + 1\right) + \left(3 - x^{2}\right) \left(3 x^{2} - 1\right)\)'
    B: '\(- 2 x \left(x^{3} - x + 1\right) - \left(3 - x^{2}\right) \left(3 x^{2} - 1\right)\)'
    C: '\(- 2 x \left(3 x^{2} - 1\right)\)'
    D: '\(- 2 x \left(x^{3} - x + 1\right) + \left(3 - x^{2}\right) \left(3 x^{2} - 1\right)\)'
    answer: D
    hint: 'Product rule: \((uv)''=u''v+uv''\).'
    explanation: 'Differentiating gives \(- 2 x \left(x^{3} - x + 1\right) + \left(3 - x^{2}\right) \left(3 x^{2} - 1\right)\).'
  25:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dx}\left[\left(x^{2} + 1\right) \left(x + 5 + \frac{1}{x}\right)\right]\).'
    A: '\(2 x \left(x + 5 + \frac{1}{\sqrt{x}}\right) + \left(1 - \frac{1}{2 x^{2}}\right) \left(x^{2} + 1\right)\)'
    B: '\(2 x \left(x + 5 + \frac{1}{x}\right) + \left(1 - \frac{1}{x}\right) \left(x^{2} + 1\right)\)'
    C: '\(2 x \left(x + 5 + \frac{1}{x}\right) + \left(1 - \frac{1}{x^{2}}\right) \left(x^{2} + 1\right)\)'
    D: '\(2 x \left(x + 5 + \frac{1}{x}\right) + \left(2 - \frac{1}{x^{2}}\right) \left(x^{2} + 2\right)\)'
    answer: C
    hint: Multiply out first, or use the product rule.
    explanation: 'Differentiating gives \(2 x \left(x + 5 + \frac{1}{x}\right) + \left(1 - \frac{1}{x^{2}}\right) \left(x^{2} + 1\right)\).'
  26:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dx}\left[\frac{2 x + 5}{3 x - 2}\right]\).'
    A: '\(- \frac{3 \left(2 x + 5\right)}{\left(3 x - 2\right)^{2}} + \frac{2}{3 x - 2}\)'
    B: '\(- \frac{19}{3 x - 2}\)'
    C: '\(0.666666666666667\)'
    D: '\(\frac{12 x + 11}{\left(3 x - 2\right)^{2}}\)'
    answer: A
    hint: 'Quotient rule: \(\left(\dfrac uv\right)''=\dfrac{u''v-uv''}{v^2}\).'
    explanation: 'Differentiating gives \(- \frac{3 \left(2 x + 5\right)}{\left(3 x - 2\right)^{2}} + \frac{2}{3 x - 2}\).'
  27:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dx}\left[\frac{2 x + 1}{x^{2} - 1}\right]\).'
    A: '\(- \frac{3 x \left(2 x + 1\right)}{\left(x^{2} - 1\right)^{3}} + \frac{2}{x^{2} - 1}\)'
    B: '\(- \frac{2 x \left(2 x + 1\right)}{\left(x^{2} - 1\right)^{2}} - \frac{2}{x^{2} - 1}\)'
    C: '\(2 - \frac{2 \left(2 x + 1\right)}{x^{3}}\)'
    D: '\(- \frac{2 x \left(2 x + 1\right)}{\left(x^{2} - 1\right)^{2}} + \frac{2}{x^{2} - 1}\)'
    answer: D
    hint: 'Use the quotient rule with \(u=2x+1\), \(v=x^2-1\).'
    explanation: 'Differentiating gives \(- \frac{2 x \left(2 x + 1\right)}{\left(x^{2} - 1\right)^{2}} + \frac{2}{x^{2} - 1}\).'
  28:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dt}\left[\frac{1 - t}{t^{2} + 1}\right]\).'
    A: '\(- \frac{2 t \left(1 - t\right)}{\left(t^{2} + 1\right)^{2}} - \frac{1}{t^{2} + 1}\)'
    B: '\(- \frac{2 t}{\left(t^{2} + 1\right)^{2}}\)'
    C: '\(- \frac{2 t \left(\frac{1}{2} - t\right)}{\left(t^{2} + \frac{1}{2}\right)^{2}} - \frac{1}{t^{2} + \frac{1}{2}}\)'
    D: '\(t^{2} - \frac{2 t \left(t + 1\right)}{\left(t^{2} + 1\right)^{2}} + 1\)'
    answer: A
    hint: Quotient rule.
    explanation: 'Differentiating gives \(- \frac{2 t \left(1 - t\right)}{\left(t^{2} + 1\right)^{2}} - \frac{1}{t^{2} + 1}\).'
  29:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dx}\left[x^{3} e^{x}\right]\).'
    A: '\(3 x^{2} e^{x}\)'
    B: '\(x^{3} e^{x} + 3 x^{2} e^{x}\)'
    C: '\(- x^{3} e^{x} + 3 x^{2} e^{x}\)'
    D: '\(x^{3} e^{x}\)'
    answer: B
    hint: 'Product rule with \(u=x^3\) and \(v=e^x\).'
    explanation: 'Differentiating gives \(x^{3} e^{x} + 3 x^{2} e^{x}\).'
  30:
    topic: s3-2
    question: 'Find \(\dfrac{d}{dx}\left[2 e^{- x}\right]\).'
    A: '\(-2\)'
    B: '\(- e^{- x}\)'
    C: '\(- 2 e^{- 2 x}\)'
    D: '\(- 2 e^{- x}\)'
    answer: D
    hint: 'The derivative of \(e^{-x}\) is \(-e^{-x}\).'
    explanation: 'Differentiating gives \(- 2 e^{- x}\).'
  31:
    topic: s3-2
    question: 'Find \(\dfrac{d^{2}}{dx^{2}}\left[\frac{x^{3} + 7}{x}\right]\).'
    A: '\(\frac{2 \left(x^{4} + 7\right)}{x^{3}}\)'
    B: '\(\frac{2 \left(x^{3} + 7\right)}{x^{4}}\)'
    C: '\(\frac{2 \left(x^{3} + 8\right)}{x^{3}}\)'
    D: '\(\frac{2 \left(x^{3} + 7\right)}{x^{3}}\)'
    answer: D
    hint: 'Divide term by term first: \(x^2+7/x\).'
    explanation: 'Differentiating gives \(\frac{2 \left(x^{3} + 7\right)}{x^{3}}\).'
  32:
    topic: s3-2
    question: 'Find \(\dfrac{d^{5}}{dx^{5}}\left[\frac{x^{5}}{120}\right]\).'
    A: '\(1\)'
    B: '\(2\)'
    C: '\(0\)'
    D: '\(-1\)'
    answer: A
    hint: Repeated power rule.
    explanation: 'Differentiating gives \(1\).'
  33:
    topic: s3-2
    question: 'Suppose \(u\) and \(v\) are differentiable with \(u(0)=5\), \(u''(0)=-3\), \(v(0)=-1\), \(v''(0)=2\). Then \(\dfrac{d}{dx}(uv)\) at \(x=0\) equals'
    A: '\(-6\)'
    B: '\(7\)'
    C: '\(13\)'
    D: '\(-13\)'
    answer: C
    hint: '\((uv)''=u''v+uv''\).'
    explanation: '\((-3)(-1)+5\cdot2=3+10=13\).'
  34:
    topic: s3-2
    question: 'With the same values \(u(0)=5\), \(u''(0)=-3\), \(v(0)=-1\), \(v''(0)=2\), \(\dfrac{d}{dx}\!\left(\dfrac uv\right)\) at \(x=0\) equals'
    A: '\(-7\)'
    B: '\(-\dfrac{7}{25}\)'
    C: '\(7\)'
    D: '\(13\)'
    answer: A
    hint: '\(\left(\dfrac uv\right)''=\dfrac{u''v-uv''}{v^2}\).'
    explanation: '\(\dfrac{(-3)(-1)-5(2)}{(-1)^2}=3-10=-7\).'
  35:
    topic: s3-2
    question: 'With the same values, \(\dfrac{d}{dx}\!\left(\dfrac vu\right)\) at \(x=0\) equals'
    A: '\(\dfrac{7}{25}\)'
    B: '\(\dfrac{13}{25}\)'
    C: '\(\dfrac{7}{5}\)'
    D: '\(-\dfrac{7}{25}\)'
    answer: A
    hint: 'Swap the roles of \(u\) and \(v\) in the quotient rule.'
    explanation: '\(\dfrac{v''u-vu''}{u^2}=\dfrac{2\cdot5-(-1)(-3)}{25}=\dfrac{7}{25}\).'
  36:
    topic: s3-2
    question: 'With \(u(1)=2\), \(u''(1)=0\), \(v(1)=5\), \(v''(1)=-1\), the value of \(\dfrac{d}{dx}(uv)\) at \(x=1\) is'
    A: '\(-2\)'
    B: '\(0\)'
    C: '\(2\)'
    D: '\(-5\)'
    answer: A
    hint: '\((uv)''=u''v+uv''\).'
    explanation: '\(0\cdot5+2(-1)=-2\).'
  37:
    topic: s3-2
    question: 'An equation of the line perpendicular (normal) to \(y=x^3-4x+1\) at the point \((2,1)\) is'
    A: '\(y-1=\dfrac18(x-2)\)'
    B: '\(y-1=8(x-2)\)'
    C: '\(y-1=-8(x-2)\)'
    D: '\(y-1=-\dfrac18(x-2)\)'
    answer: D
    hint: 'The slope of the tangent is \(y''(2)=3\cdot4-4\). The normal has the negative reciprocal slope.'
    explanation: '\(y''(2)=8\), so the normal has slope \(-\tfrac18\).'
  38:
    topic: s3-2
    question: 'What is the smallest slope on the curve \(y=x^3-4x+1\), and where does it occur?'
    A: '\(-4\), at the point \((2,1)\)'
    B: '\(-4\), at the point \((0,1)\)'
    C: '\(0\), at the point \((0,1)\)'
    D: '\(-1\), at the point \((1,-2)\)'
    answer: B
    hint: 'Minimize \(y''=3x^2-4\).'
    explanation: '\(3x^2-4\) is smallest at \(x=0\), where it equals \(-4\); \(y(0)=1\).'
  39:
    topic: s3-2
    question: 'The tangents to \(y=x^3-4x+1\) that have slope \(8\) are'
    A: '\(y=8x-15\) and \(y=8x+17\)'
    B: '\(y=8x-15\) and \(y=8x-17\)'
    C: '\(y=8x-15\) only'
    D: '\(y=8x+1\) and \(y=8x-1\)'
    answer: A
    hint: 'Solve \(3x^2-4=8\), then use point-slope form at each point.'
    explanation: '\(x=\pm2\): the points are \((2,1)\) and \((-2,1)\), giving \(y=8x-15\) and \(y=8x+17\).'
  40:
    topic: s3-2
    question: 'The horizontal tangents to \(y=x^3-3x-2\) are the lines'
    A: '\(y=0\) and \(y=-4\)'
    B: '\(y=1\) and \(y=-1\)'
    C: '\(y=2\) and \(y=-2\)'
    D: '\(y=-2\) only'
    answer: A
    hint: 'Solve \(y''=3x^2-3=0\) and evaluate \(y\).'
    explanation: '\(x=\pm1\) gives \(y=-4\) at \(x=1\) and \(y=0\) at \(x=-1\).'
  41:
    topic: s3-2
    question: 'The tangent to Newton''s serpentine \(y=\dfrac{4x}{x^2+1}\) at the origin is'
    A: '\(y=0\)'
    B: '\(y=2\)'
    C: '\(y=x\)'
    D: '\(y=4x\)'
    answer: D
    hint: '\(y''=\dfrac{4(1-x^2)}{(x^2+1)^2}\).'
    explanation: '\(y''(0)=4\), and the line passes through the origin.'
  42:
    topic: s3-2
    question: 'The tangent to the Witch of Agnesi \(y=\dfrac{8}{x^2+4}\) at \((2,1)\) is'
    A: '\(y=-\dfrac{x}{2}+1\)'
    B: '\(y=-2x+5\)'
    C: '\(y=\dfrac{x}{2}\)'
    D: '\(y=-\dfrac{x}{2}+2\)'
    answer: D
    hint: '\(y''=\dfrac{-16x}{(x^2+4)^2}\).'
    explanation: 'The slope at \(x=2\) is \(-32/64=-\tfrac12\), so \(y-1=-\tfrac12(x-2)\).'
  43:
    topic: s3-2
    question: 'The curve \(y=ax^2+bx+c\) passes through \((1,2)\) and is tangent to the line \(y=x\) at the origin. Then \((a,b,c)=\)'
    A: '\((0,1,1)\)'
    B: '\((1,0,1)\)'
    C: '\((2,0,0)\)'
    D: '\((1,1,0)\)'
    answer: D
    hint: 'Use \(c=0\) (origin), \(y''(0)=b=1\), and \(a+b=2\).'
    explanation: '\(y=x^2+x\).'
  44:
    topic: s3-2
    question: 'The curves \(y=x^2+ax+b\) and \(y=cx-x^2\) have a common tangent line at \((1,0)\). Then \((a,b,c)=\)'
    A: '\((-3,2,1)\)'
    B: '\((-3,2,-1)\)'
    C: '\((3,-2,1)\)'
    D: '\((-1,0,1)\)'
    answer: A
    hint: 'Both curves pass through \((1,0)\) and have equal slopes there.'
    explanation: '\(c-1=0\Rightarrow c=1\); slopes: \(2+a=c-2=-1\Rightarrow a=-3\); \(1+a+b=0\Rightarrow b=2\).'
  45:
    topic: s3-2
    question: 'The tangent to \(y=x^3-x\) at \((-1,0)\) meets the curve again at'
    A: '\((2,6)\)'
    B: '\((1,0)\)'
    C: '\((2,2)\)'
    D: '\((0,0)\)'
    answer: A
    hint: 'The tangent is \(y=2x+2\). Solve \(x^3-x=2x+2\).'
    explanation: '\(x^3-3x-2=(x+1)^2(x-2)\), so the other root is \(x=2\), \(y=6\).'
  46:
    topic: s3-2
    question: 'The tangent to \(y=x^3-6x^2+5x\) at the origin meets the curve again at'
    A: '\((5,0)\)'
    B: '\((6,0)\)'
    C: '\((1,0)\)'
    D: '\((6,30)\)'
    answer: D
    hint: 'The tangent at the origin is \(y=5x\).'
    explanation: '\(x^3-6x^2+5x=5x\) gives \(x^2(x-6)=0\), so \(x=6\), \(y=30\).'
  47:
    topic: s3-2
    question: 'If \(P(x)=a_nx^n+\dots+a_1x+a_0\), then \(P''(x)=\)'
    A: '\(a_n n!\)'
    B: '\(na_nx^n+\dots+a_1x\)'
    C: '\(a_nx^{n-1}+\dots+a_1\)'
    D: '\(na_nx^{n-1}+\dots+2a_2x+a_1\)'
    answer: D
    hint: Differentiate each term with the power rule; constants vanish.
    explanation: 'The constant \(a_0\) disappears and each \(a_kx^k\) becomes \(ka_kx^{k-1}\).'
  48:
    topic: s3-2
    question: 'If \(R=M^2\left(\dfrac C2-\dfrac M3\right)\), the sensitivity \(dR/dM\) is'
    A: '\(CM-M^2\)'
    B: '\(\dfrac{C}{2}-\dfrac{M}{3}\)'
    C: '\(CM-\dfrac{M^2}{3}\)'
    D: '\(C-2M\)'
    answer: A
    hint: 'Expand first: \(R=\tfrac C2M^2-\tfrac13M^3\).'
    explanation: '\(\dfrac{dR}{dM}=CM-M^2\).'
  49:
    topic: s3-2
    question: 'If \(A(q)=\dfrac{km}{q}+cm+\dfrac{hq}{2}\), then \(\dfrac{d^2A}{dq^2}=\)'
    A: '\(\dfrac{h}{2}\)'
    B: '\(\dfrac{2km}{q^3}\)'
    C: '\(-\dfrac{2km}{q^3}\)'
    D: '\(-\dfrac{km}{q^2}\)'
    answer: B
    hint: '\(A''=-km\,q^{-2}+h/2\).'
    explanation: 'Differentiating again: \(2km\,q^{-3}\).'
  50:
    topic: s3-2
    question: 'If \(g\) is constant \(g(x)=c\) in the Product Rule, \((fg)''=f''g+fg''\) becomes'
    A: '\((cf)''=cf''\), the Constant Multiple Rule'
    B: '\((cf)''=0\)'
    C: '\((cf)''=c\), a constant'
    D: '\((cf)''=f''+c\)'
    answer: A
    hint: 'What is \(g''\) when \(g\) is constant?'
    explanation: '\(g''=0\), so \((cf)''=cf''+f\cdot0=cf''\).'
  51:
    topic: s3-3
    question: 'A body moves with position \(s=t^2-3t+2\) m, \(0\le t\le2\). Its displacement and average velocity over the interval are'
    A: '\(-2\) m and \(-2\) m/s'
    B: '\(-2\) m and \(-1\) m/s'
    C: '\(2\) m and \(1\) m/s'
    D: '\(0\) m and \(0\) m/s'
    answer: B
    hint: 'Displacement \(=s(2)-s(0)\).'
    explanation: '\(s(2)=0\), \(s(0)=2\), so displacement is \(-2\) and the average velocity is \(-2/2=-1\).'
  52:
    topic: s3-3
    question: 'For \(s=t^2-3t+2\), the body changes direction at'
    A: '\(t=0\)'
    B: '\(t=2\)'
    C: '\(t=1\)'
    D: '\(t=\dfrac32\)'
    answer: D
    hint: 'Direction changes when the velocity \(2t-3\) changes sign.'
    explanation: '\(v=2t-3=0\) at \(t=\tfrac32\), and \(v\) goes from negative to positive there.'
  53:
    topic: s3-3
    question: 'For \(s=6t-t^2\), \(0\le t\le6\), the body changes direction at'
    A: '\(t=0\)'
    B: '\(t=3\)'
    C: '\(t=2\)'
    D: '\(t=6\)'
    answer: B
    hint: '\(v=6-2t\).'
    explanation: '\(v>0\) for \(t<3\) and \(v<0\) for \(t>3\).'
  54:
    topic: s3-3
    question: 'For \(s=-t^3+3t^2-3t\), \(0\le t\le3\), the body'
    A: 'changes direction at \(t=\tfrac32\)'
    B: 'changes direction at \(t=1\)'
    C: never changes direction
    D: 'changes direction at \(t=3\)'
    answer: C
    hint: 'Factor \(v=-3t^2+6t-3\).'
    explanation: '\(v=-3(t-1)^2\le0\); it touches zero at \(t=1\) without changing sign.'
  55:
    topic: s3-3
    question: 'A body has velocity \(v=t^2-4t+3\) (\(t\ge0\)). When is it moving backward?'
    A: '\(1<t<3\)'
    B: '\(t>2\)'
    C: '\(t>3\)'
    D: '\(0\le t<1\)'
    answer: A
    hint: 'Solve \(v<0\); factor \(v=(t-1)(t-3)\).'
    explanation: '\(v<0\) exactly between its roots.'
  56:
    topic: s3-3
    question: 'A particle has position \(s=t^3-6t^2+9t\) m. Its acceleration at each time the velocity is zero is'
    A: '\(0\) at both times'
    B: '\(6\) m/s\(^2\) at \(t=1\) and \(-6\) m/s\(^2\) at \(t=3\)'
    C: '\(-6\) m/s\(^2\) at both times'
    D: '\(-6\) m/s\(^2\) at \(t=1\) and \(6\) m/s\(^2\) at \(t=3\)'
    answer: D
    hint: '\(v=3t^2-12t+9\) and \(a=6t-12\).'
    explanation: '\(v=3(t-1)(t-3)\), zero at \(t=1\) and \(t=3\); \(a(1)=-6\) and \(a(3)=6\).'
  57:
    topic: s3-3
    question: 'For \(s=t^3-6t^2+9t\), the total distance traveled from \(t=0\) to \(t=2\) is'
    A: '\(2\) m'
    B: '\(6\) m'
    C: '\(8\) m'
    D: '\(4\) m'
    answer: B
    hint: 'The body turns around at \(t=1\), so add the two legs.'
    explanation: '\(s(0)=0\), \(s(1)=4\), \(s(2)=2\): it travels \(4\) m forward and then \(2\) m back, for \(6\) m in total.'
  58:
    topic: s3-3
    question: 'On Mars, free fall is \(s=1.86t^2\) m. About how long until a rock dropped from rest reaches \(27.8\) m/s?'
    A: 'about \(3.7\) s'
    B: 'about \(14.9\) s'
    C: 'about \(7.5\) s'
    D: 'about \(15.0\) s'
    answer: C
    hint: 'Differentiate: \(v=3.72t\). Set it equal to 27.8.'
    explanation: '\(t=27.8/3.72\approx7.47\) s.'
  59:
    topic: s3-3
    question: 'A rock thrown up on the moon has height \(s=24t-0.8t^2\) m. How long does it take to reach its highest point?'
    A: '\(30\) s'
    B: '\(15\) s'
    C: '\(24\) s'
    D: '\(7.5\) s'
    answer: B
    hint: 'The highest point is where \(v=0\).'
    explanation: '\(v=24-1.6t=0\) gives \(t=15\) s.'
  60:
    topic: s3-3
    question: 'How high does the rock with \(s=24t-0.8t^2\) go?'
    A: '\(90\) m'
    B: '\(180\) m'
    C: '\(360\) m'
    D: '\(24\) m'
    answer: B
    hint: 'Evaluate \(s\) at the time of the highest point, \(t=15\).'
    explanation: '\(24(15)-0.8(225)=360-180=180\) m.'
  61:
    topic: s3-3
    question: 'How long is the rock with \(s=24t-0.8t^2\) in the air?'
    A: '\(15\) s'
    B: '\(60\) s'
    C: '\(180\) s'
    D: '\(30\) s'
    answer: D
    hint: 'It returns to the surface when \(s=0\) again.'
    explanation: '\(t(24-0.8t)=0\) gives \(t=30\) s.'
  62:
    topic: s3-3
    question: 'On a small planet a ball launched upward reaches \(s=15t-\tfrac12g_st^2\) m. If it reaches its maximum height at \(t=20\) s, then \(g_s\) equals'
    A: '\(1.5\) m/s\(^2\)'
    B: '\(0.75\) m/s\(^2\)'
    C: '\(0.375\) m/s\(^2\)'
    D: '\(9.8\) m/s\(^2\)'
    answer: B
    hint: '\(v=15-g_st\) is zero at the top.'
    explanation: '\(15-20g_s=0\) gives \(g_s=0.75\).'
  63:
    topic: s3-3
    question: 'A bullet fired straight up on the moon has \(s=832t-2.6t^2\) ft. How long does it stay aloft?'
    A: '\(832\) s'
    B: '\(320\) s'
    C: '\(160\) s'
    D: '\(52\) s'
    answer: B
    hint: 'Solve \(s=0\) for \(t>0\).'
    explanation: '\(t(832-2.6t)=0\) gives \(t=320\) s. (On Earth, \(s=832t-16t^2\) gives only 52 s.)'
  64:
    topic: s3-3
    question: 'A ball dropped from the Tower of Pisa (179 ft) has \(s=179-16t^2\). About how fast is it going when it hits the ground?'
    A: 'about \(54\) ft/s'
    B: 'about \(107\) ft/s'
    C: 'about \(11\) ft/s'
    D: 'about \(179\) ft/s'
    answer: B
    hint: 'Find the impact time with \(s=0\), then \(v=-32t\).'
    explanation: '\(t=\sqrt{179/16}\approx3.34\) s, so \(|v|=32t\approx107\) ft/s.'
  65:
    topic: s3-3
    question: 'The cost of producing \(x\) washing machines is \(c(x)=2000+100x-0.1x^2\) dollars. The marginal cost at \(x=100\) is'
    A: '\(\$80\)'
    B: '\(\$90\)'
    C: '\(\$110\)'
    D: '\(\$10{,}000\)'
    answer: A
    hint: 'Marginal cost is \(c''(x)\).'
    explanation: '\(c''(x)=100-0.2x\), so \(c''(100)=80\). (The average cost per machine for the first 100 is \(\$110\).)'
  66:
    topic: s3-3
    question: 'The revenue from selling \(x\) machines is \(r(x)=20000\left(1-\dfrac1x\right)\). The marginal revenue at \(x=100\) is'
    A: '\(\$2\)'
    B: '\(\$20{,}000\)'
    C: '\(\$200\)'
    D: '\(\$0.02\)'
    answer: A
    hint: '\(r''(x)=\dfrac{20000}{x^2}\).'
    explanation: '\(20000/10000=2\). As \(x\to\infty\), \(r''\to0\): each extra machine adds almost no revenue.'
  67:
    topic: s3-3
    question: 'A bacteria population is \(b=10^6+10^4t-10^3t^2\) after \(t\) hours. The growth rate at \(t=5\) hours is'
    A: '\(0\) bacteria/hour'
    B: '\(10^6\) bacteria per hour'
    C: '\(10^4\) bacteria per hour'
    D: '\(-10^4\) bacteria per hour'
    answer: A
    hint: '\(b''=10^4-2\cdot10^3t\).'
    explanation: '\(b''(5)=10^4-10^4=0\): the population has stopped growing. At \(t=10\) the rate is \(-10^4\).'
  68:
    topic: s3-3
    question: 'A tank drains so that \(Q(t)=200(30-t)^2\) gallons remain after \(t\) minutes. How fast is the water leaving at \(t=10\)?'
    A: '\(80{,}000\) gal/min'
    B: '\(10{,}000\) gal/min'
    C: '\(4000\) gal/min'
    D: '\(8000\) gal/min'
    answer: D
    hint: '\(Q''(t)=-400(30-t)\).'
    explanation: '\(Q''(10)=-8000\), so the water is leaving at 8000 gal/min. (The average rate over the first 10 minutes is 10,000 gal/min.)'
  69:
    topic: s3-3
    question: 'The volume of a balloon is \(V=\tfrac43\pi r^3\). Its rate of change with respect to the radius at \(r=2\) ft is'
    A: '\(8\pi\) ft\(^3\)/ft'
    B: '\(32\pi\) ft\(^3\)/ft'
    C: '\(16\pi\) ft\(^3\)/ft'
    D: '\(\dfrac{32\pi}{3}\) ft\(^3\)/ft'
    answer: C
    hint: '\(V''(r)=4\pi r^2\).'
    explanation: '\(4\pi\cdot4=16\pi\).'
  70:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dx}\left[- 10 x + 3 \cos{\left(x \right)}\right]\).'
    A: '\(- 3 \sin{(x)} - 20\)'
    B: '\(- 3 \sin{(x)} - 10\)'
    C: '\(-10\)'
    D: '\(- 3 \cos{(x)} - 10\)'
    answer: B
    hint: 'The derivative of \(\cos x\) is \(-\sin x\).'
    explanation: 'Differentiating gives \(- 3 \sin{\left(x \right)} - 10\).'
  71:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dx}\left[5 \sin{\left(x \right)} + \frac{3}{x}\right]\).'
    A: '\(- 3 x^{2} + 5 \cos{(x)}\)'
    B: '\(5 \cos{(x)} - \frac{3}{x}\)'
    C: '\(5 \cos{(x)} - \frac{3}{x^{3}}\)'
    D: '\(5 \cos{(x)} - \frac{3}{x^{2}}\)'
    answer: D
    hint: 'Rewrite \(3/x=3x^{-1}\).'
    explanation: 'Differentiating gives \(5 \cos{\left(x \right)} - \frac{3}{x^{2}}\).'
  72:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dx}\left[- 4 \sqrt{x} + \csc{\left(x \right)} + 7\right]\).'
    A: '\(- \cot{(x)} \csc{(x)} - \frac{2}{\sqrt{x}}\)'
    B: '\(- \cot{(x)} \csc{(x)} - \frac{2}{\sqrt[4]{x}}\)'
    C: '\(- 2 \cot{(x)} \csc{(x)} - \frac{2}{\sqrt{x}}\)'
    D: '\(- \cot{(x)} \csc{(x)} - \frac{1}{\sqrt{x}}\)'
    answer: A
    hint: '\(\dfrac{d}{dx}\csc x=-\csc x\cot x\).'
    explanation: 'Differentiating gives \(- \cot{\left(x \right)} \csc{\left(x \right)} - \frac{2}{\sqrt{x}}\).'
  73:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dx}\left[x^{2} \cot{\left(x \right)} - \frac{1}{x^{2}}\right]\).'
    A: '\(x^{4} \left(- \cot^{4}{(x)} - 1\right) + 4 x \cot{(x)} + \frac{4}{x^{3}}\)'
    B: '\(x^{2} \left(- \cot^{2}{(x)} - 1\right) + 2 x \cot{(x)} - \frac{2}{x^{3}}\)'
    C: '\(x^{2} \left(- \cot^{2}{(x)} - 1\right) + 2 x \cot{(x)} + \frac{2}{x^{3}}\)'
    D: '\(- 2 x \cot{(x)} + \frac{-1 - \frac{1}{\cot^{2}{(x)}}}{x^{2}} - \frac{2}{x^{3}}\)'
    answer: C
    hint: 'Product rule for \(x^2\cot x\); \(\dfrac{d}{dx}\cot x=-\csc^2x\).'
    explanation: 'Differentiating gives \(x^{2} \left(- \cot^{2}{\left(x \right)} - 1\right) + 2 x \cot{\left(x \right)} + \frac{2}{x^{3}}\).'
  74:
    topic: s3-4
    question: 'Simplify and differentiate: \(y=(\sec x+\tan x)(\sec x-\tan x)\). Then \(\dfrac{dy}{dx}=\)'
    A: '\(\sec^2x-\tan^2x\)'
    B: '\(2\sec x\tan x\)'
    C: '\(1\)'
    D: '\(0\)'
    answer: D
    hint: 'Multiply out using \(\sec^2x-\tan^2x=1\).'
    explanation: 'The product is \(\sec^2x-\tan^2x=1\), a constant, so the derivative is 0.'
  75:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dx}\left[\left(\sin{\left(x \right)} + \cos{\left(x \right)}\right) \sec{\left(x \right)}\right]\).'
    A: '\(\left(\sin{(x)} + \cos{(x)}\right) \tan{(x)} \sec{(x)}\)'
    B: '\(\left(- \sin{(x)} + \cos{(x)}\right) \sec{(x)} + \left(\sin{(x)} + \cos{(x)}\right) \sec^{2}{(x)}\)'
    C: '\(\left(\sin{(x)} + \cos{(x)}\right) \tan{(x)} \sec{(x)} + \cos{(x)} \sec{(x)}\)'
    D: '\(\left(- \sin{(x)} + \cos{(x)}\right) \sec{(x)} + \left(\sin{(x)} + \cos{(x)}\right) \tan{(x)} \sec{(x)}\)'
    answer: D
    hint: 'Multiply out: \(\tan x+1\).'
    explanation: 'Differentiating gives \(\left(- \sin{\left(x \right)} + \cos{\left(x \right)}\right) \sec{\left(x \right)} + \left(\sin{\left(x \right)} + \cos{\left(x \right)}\right) \tan{\left(x \right)} \sec{\left(x \right)}\).'
  76:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dx}\left[\frac{\cos{\left(x \right)}}{\sin{\left(x \right)} + 1}\right]\).'
    A: '\(-1 - \frac{\cos^{2}{(x)}}{\sin^{2}{(x)}}\)'
    B: '\(- \frac{\sin{(x)}}{\sin{(x)} + 1} - \frac{\cos^{2}{(x)}}{\left(\sin{(x)} + 1\right)^{2}}\)'
    C: '\(- \frac{\sin{(x)}}{\sin{(x)} + 1} - \frac{\cos{(x)}}{\left(\sin{(x)} + 1\right)^{2}}\)'
    D: '\(- \frac{\sin{(x)}}{\sin{(x)} + 2} - \frac{\cos^{2}{(x)}}{\left(\sin{(x)} + 2\right)^{2}}\)'
    answer: B
    hint: 'Quotient rule; \(\cos^2x+\sin^2x=1\) simplifies the numerator.'
    explanation: 'Differentiating gives \(- \frac{\sin{\left(x \right)}}{\sin{\left(x \right)} + 1} - \frac{\cos^{2}{\left(x \right)}}{\left(\sin{\left(x \right)} + 1\right)^{2}}\).'
  77:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dt}\left[\tan{\left(t \right)} - e^{- t}\right]\).'
    A: '\(1 + e^{- t}\)'
    B: '\(\tan^{2}{\left(t \right)} + 1 - e^{- t}\)'
    C: '\(\tan^{3}{\left(t \right)} + 1 + e^{- t}\)'
    D: '\(\tan^{2}{\left(t \right)} + 1 + e^{- t}\)'
    answer: D
    hint: '\(\dfrac{d}{dt}\tan t=\sec^2t\).'
    explanation: 'Differentiating gives \(\tan^{2}{\left(t \right)} + 1 + e^{- t}\).'
  78:
    topic: s3-4
    question: 'Find \(\dfrac{d}{d\theta}\left[- \theta^{2} \sin{\left(\theta \right)} + 4\right]\).'
    A: '\(- \theta^{2} \cos{\left(\theta \right)} - 2 \theta \sin{\left(\theta \right)}\)'
    B: '\(- 2 \theta \sin{\left(\theta \right)} - \theta \cos{\left(\theta \right)}\)'
    C: '\(- \frac{\theta^{2} \cos{\left(\theta \right)}}{2} - 2 \theta \sin{\left(\theta \right)}\)'
    D: '\(\theta^{2} \cos{\left(\theta \right)} + 2 \theta \sin{\left(\theta \right)}\)'
    answer: A
    hint: 'Product rule on \(\theta^2\sin\theta\).'
    explanation: 'Differentiating gives \(- \theta^{2} \cos{\left(\theta \right)} - 2 \theta \sin{\left(\theta \right)}\).'
  79:
    topic: s3-4
    question: 'Find \(\dfrac{d}{d\theta}\left[\theta \sin{\left(\theta \right)} + \cos{\left(\theta \right)}\right]\).'
    A: '\(2 \theta \cos{\left(\theta \right)}\)'
    B: '\(\theta \cos{\left(\theta \right)}\)'
    C: '\(- \theta \cos{\left(\theta \right)}\)'
    D: '\(\theta \sin{\left(\theta \right)}\)'
    answer: B
    hint: 'Product rule on \(\theta\sin\theta\); then the \(\sin\theta\) terms cancel.'
    explanation: 'Differentiating gives \(\theta \cos{\left(\theta \right)}\).'
  80:
    topic: s3-4
    question: 'Find \(\dfrac{d}{dx}\left[5 + \frac{1}{\cot{\left(x \right)}}\right]\).'
    A: '\(\frac{\cot{(x)} + 1}{\cot^{2}{(x)}}\)'
    B: '\(\frac{\cot^{2}{(x)} + \frac{1}{2}}{\cot^{2}{(x)}}\)'
    C: '\(\frac{\cot^{2}{(x)} + 1}{\cot^{2}{(x)}}\)'
    D: '\(\frac{1 + \frac{1}{\cot^{2}{(x)}}}{\cot^{2}{(x)}}\)'
    answer: C
    hint: '\(1/\cot x=\tan x\).'
    explanation: 'Differentiating gives \(\frac{\cot^{2}{\left(x \right)} + 1}{\cot^{2}{\left(x \right)}}\).'
  81:
    topic: s3-4
    question: 'Find \(\dfrac{d^{2}}{dx^{2}}\left[\csc{\left(x \right)}\right]\).'
    A: '\(\left(4 \cot^{4}{(x)} + 1\right) \csc{(x)}\)'
    B: '\(\left(2 \cot^{2}{(x)} + 2\right) \csc{(x)}\)'
    C: '\(\left(2 \cot^{2}{(x)} + 1\right) \csc{(x)}\)'
    D: '\(\left(2 \cot^{2}{(x)} - 1\right) \csc{(x)}\)'
    answer: C
    hint: '\(y''=-\csc x\cot x\); differentiate again with the product rule.'
    explanation: 'Differentiating gives \(\left(2 \cot^{2}{\left(x \right)} + 1\right) \csc{\left(x \right)}\).'
  82:
    topic: s3-4
    question: 'If \(y=-2\sin x\), then \(y^{(4)}=\dfrac{d^4y}{dx^4}\) equals'
    A: '\(-2\cos x\)'
    B: '\(2\sin x\)'
    C: '\(-2\sin x\)'
    D: '\(2\cos x\)'
    answer: C
    hint: 'The derivatives of \(\sin x\) cycle with period 4.'
    explanation: '\(\sin\to\cos\to-\sin\to-\cos\to\sin\), so the fourth derivative returns to \(-2\sin x\).'
  83:
    topic: s3-4
    question: '\(\dfrac{d^{999}}{dx^{999}}(\cos x)=\)'
    A: '\(-\cos x\)'
    B: '\(\cos x\)'
    C: '\(\sin x\)'
    D: '\(-\sin x\)'
    answer: C
    hint: 'The derivatives cycle with period 4. What is \(999\bmod4\)?'
    explanation: '\(999=4\cdot249+3\). The third derivative of \(\cos x\) is \(\sin x\).'
  84:
    topic: s3-4
    question: 'At what points does the graph of \(y=\tan x\), \(-\tfrac\pi2<x<\tfrac\pi2\), have a tangent line parallel to \(y=2x\)?'
    A: '\(x=0\)'
    B: '\(x=\pm\dfrac\pi3\)'
    C: '\(x=\pm\dfrac\pi6\)'
    D: '\(x=\pm\dfrac\pi4\)'
    answer: D
    hint: 'Solve \(\sec^2x=2\).'
    explanation: '\(\cos^2x=\tfrac12\) gives \(x=\pm\tfrac\pi4\), at the points \((\pm\tfrac\pi4,\pm1)\).'
  85:
    topic: s3-4
    question: 'Where on \(0<x<\pi\) is the tangent to \(y=\cot x\) parallel to \(y=-x\)?'
    A: '\(x=\dfrac\pi4\)'
    B: nowhere
    C: '\(x=\dfrac\pi2\)'
    D: '\(x=\dfrac{3\pi}4\)'
    answer: C
    hint: 'Solve \(-\csc^2x=-1\).'
    explanation: '\(\csc^2x=1\) means \(\sin x=1\), so \(x=\tfrac\pi2\); the point is \((\tfrac\pi2,0)\).'
  86:
    topic: s3-4
    question: 'Does \(y=x+2\cos x\) have a horizontal tangent on \(0\le x\le2\pi\)?'
    A: 'Yes, at \(x=\dfrac\pi6\) and \(x=\dfrac{5\pi}6\)'
    B: 'Yes, only at \(x=\dfrac\pi2\)'
    C: "No"
    D: 'Yes, at \(x=0\) and \(x=\pi\)'
    answer: A
    hint: 'Solve \(y''=1-2\sin x=0\).'
    explanation: '\(\sin x=\tfrac12\) gives \(x=\tfrac\pi6\) and \(\tfrac{5\pi}6\).'
  87:
    topic: s3-4
    question: 'Does \(y=2x+\sin x\) have a horizontal tangent?'
    A: 'Yes, at \(x=0\)'
    B: 'Yes, at \(x=\dfrac\pi2\)'
    C: 'Yes, at \(x=\pi\)'
    D: 'No, because \(y''=2+\cos x\ge1\)'
    answer: D
    hint: 'Can \(2+\cos x\) ever be 0?'
    explanation: '\(\cos x\ge-1\), so \(y''\ge1>0\).'
  88:
    topic: s3-4
    question: '\(\displaystyle\lim_{x\to-\pi/6}\sqrt{1+\cos(\pi\csc x)}=\)'
    A: '\(\sqrt2\)'
    B: '\(0\)'
    C: '\(\sqrt3\)'
    D: '\(1\)'
    answer: A
    hint: '\(\csc(-\pi/6)=-2\).'
    explanation: '\(\cos(-2\pi)=1\), so the limit is \(\sqrt{1+1}=\sqrt2\).'
  89:
    topic: s3-4
    question: '\(\displaystyle\lim_{\theta\to0}\cos\!\left(\dfrac{\pi\theta}{\sin\theta}\right)=\)'
    A: '\(-\dfrac\pi2\)'
    B: '\(0\)'
    C: '\(1\)'
    D: '\(-1\)'
    answer: D
    hint: '\(\theta/\sin\theta\to1\).'
    explanation: '\(\cos\pi=-1\), by continuity of cosine.'
  90:
    topic: s3-4
    question: 'For \(f(x)=\begin{cases}\dfrac{\sin^23x}{x^2},&x\neq0\\ c,&x=0\end{cases}\) to be continuous at \(x=0\), \(c\) must equal'
    A: '\(3\)'
    B: '\(1\)'
    C: '\(0\)'
    D: '\(9\)'
    answer: D
    hint: 'Write \(\dfrac{\sin^23x}{x^2}=9\left(\dfrac{\sin3x}{3x}\right)^2\).'
    explanation: 'The limit is \(9\cdot1^2=9\).'
  91:
    topic: s3-4
    question: 'For \(g(x)=\begin{cases}x+b,&x<0\\ \cos x,&x\ge0\end{cases}\), which statement is true?'
    A: '\(g\) is differentiable at 0 when \(b=1\)'
    B: '\(g\) is continuous for every \(b\)'
    C: '\(g\) is differentiable at 0 for every \(b\)'
    D: '\(g\) is continuous at 0 only when \(b=1\), and then it is still not differentiable at 0'
    answer: D
    hint: Match the values, then compare the one-sided derivatives.
    explanation: 'Continuity needs \(0+b=\cos0=1\). The left slope is 1 and the right slope is \(-\sin0=0\), so there is a corner.'
  92:
    topic: s3-4
    question: 'The position of a body is \(s=2-2\sin t\) m. Its velocity at \(t=\pi/4\) is'
    A: '\(2\) m/s'
    B: '\(-2\) m/s'
    C: '\(\sqrt2\) m/s'
    D: '\(-\sqrt2\) m/s'
    answer: D
    hint: '\(v=ds/dt\).'
    explanation: '\(v=-2\cos t\), so \(v(\pi/4)=-\sqrt2\). (The acceleration is \(2\sin t=\sqrt2\) m/s\(^2\).)'
  93:
    topic: s3-4
    question: 'In degree mode, \(\displaystyle\lim_{h\to0}\dfrac{\sin h}{h}\) equals'
    A: '\(0\)'
    B: '\(1\)'
    C: '\(\dfrac{180}{\pi}\)'
    D: '\(\dfrac{\pi}{180}\)'
    answer: D
    hint: 'Convert \(h\) degrees to radians: \(h^\circ=\dfrac{\pi h}{180}\) rad.'
    explanation: '\(\dfrac{\sin(\pi h/180)}{h}=\dfrac{\pi}{180}\cdot\dfrac{\sin u}{u}\to\dfrac{\pi}{180}\). This is why calculus uses radians.'
  94:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[\left(2 x + 1\right)^{5}\right]\).'
    A: '\(10 \left(2 x + 1\right)^{5}\)'
    B: '\(5 \left(2 x + 1\right)^{4}\)'
    C: '\(10 \left(2 x + 1\right)^{4}\)'
    D: '\(10 x \left(2 x + 1\right)^{4}\)'
    answer: C
    hint: 'Chain rule: \(5(2x+1)^4\cdot2\).'
    explanation: 'Differentiating gives \(10 \left(2 x + 1\right)^{4}\).'
  95:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[\frac{1}{\left(1 - \frac{x}{7}\right)^{7}}\right]\).'
    A: '\(\frac{1}{\left(\frac{6 x}{7} + 1\right)^{8}}\)'
    B: '\(\frac{1}{\left(1 - \frac{x}{7}\right)^{7}}\)'
    C: '\(\frac{1}{\left(1 - \frac{x}{7}\right)^{9}}\)'
    D: '\(\frac{1}{\left(1 - \frac{x}{7}\right)^{8}}\)'
    answer: D
    hint: 'Differentiate the outer power, then multiply by \(-\tfrac17\).'
    explanation: 'Differentiating gives \(\frac{1}{\left(1 - \frac{x}{7}\right)^{8}}\).'
  96:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[\sin^{3}{\left(x \right)}\right]\).'
    A: '\(3 \sin^{2}{(x)} \cos{(x)}\)'
    B: '\(4 \sin^{2}{(x)} \cos{(x)}\)'
    C: '\(3 \sin{(x)} \cos{(x)}\)'
    D: '\(6 \sin^{2}{(x)} \cos{(x)}\)'
    answer: A
    hint: 'Outer power 3, inner \(\sin x\).'
    explanation: 'Differentiating gives \(3 \sin^{2}{\left(x \right)} \cos{\left(x \right)}\).'
  97:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[e^{- 5 x}\right]\).'
    A: '\(- 6 e^{- 6 x}\)'
    B: '\(- 5 e^{- 5 x}\)'
    C: '\(- 10 e^{- 10 x}\)'
    D: '\(- \frac{5 e^{- \frac{5 x}{2}}}{2}\)'
    answer: B
    hint: '\(\dfrac{d}{dx}e^{u}=e^{u}u''\).'
    explanation: 'Differentiating gives \(- 5 e^{- 5 x}\).'
  98:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[e^{5 - 7 x}\right]\).'
    A: '\(- 7 e^{- 7 x - 5}\)'
    B: '\(- 7 e^{5 - 7 x}\)'
    C: '\(7 e^{5 - 7 x}\)'
    D: '\(- 8 e^{5 - 8 x}\)'
    answer: B
    hint: 'Multiply by the derivative of the exponent, \(-7\).'
    explanation: 'Differentiating gives \(- 7 e^{5 - 7 x}\).'
  99:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dt}\left[\sqrt{3 - t}\right]\).'
    A: '\(\frac{1}{2 \sqrt{3 - t}}\)'
    B: '\(- \frac{1}{2 \sqrt{3 - t}}\)'
    C: '\(- \frac{1}{2 \sqrt{3 - 2 t}}\)'
    D: '\(\frac{\sqrt{3 - t}}{2}\)'
    answer: B
    hint: 'Write \(\sqrt{3-t}=(3-t)^{1/2}\).'
    explanation: 'Differentiating gives \(- \frac{1}{2 \sqrt{3 - t}}\).'
  100:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[\sec{\left(\tan{\left(x \right)} \right)}\right]\).'
    A: '\(\left(\tan^{2}{(x)} + \frac{1}{2}\right) \tan{\left(\tan{(x)} \right)} \sec{\left(\tan{(x)} \right)}\)'
    B: '\(\left(\tan^{4}{(x)} + 1\right) \tan{\left(\tan{(x)} \right)} \sec{\left(\tan{(x)} \right)}\)'
    C: '\(\left(\tan^{2}{(x)} + 1\right) \tan{\left(\tan{(x)} \right)} \sec{\left(\tan{(x)} \right)}\)'
    D: '\(\left(1 + \frac{1}{\tan^{2}{(x)}}\right) \tan{\left(\tan{(x)} \right)} \sec{\left(\tan{(x)} \right)}\)'
    answer: C
    hint: '\(\dfrac{d}{du}\sec u=\sec u\tan u\), then multiply by \(\sec^2x\).'
    explanation: 'Differentiating gives \(\left(\tan^{2}{\left(x \right)} + 1\right) \tan{\left(\tan{\left(x \right)} \right)} \sec{\left(\tan{\left(x \right)} \right)}\).'
  101:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[x^{2} \sin^{4}{\left(x \right)} + \frac{x}{\cos^{2}{\left(x \right)}}\right]\).'
    A: '\(4 x^{2} \sin^{3}{(x)} \cos{(x)} + 2 x \sin^{4}{(x)} + 2 x \sin{(x)} \cos^{3}{(x)} + \frac{1}{\cos^{2}{(x)}}\)'
    B: '\(4 x^{3} \sin^{3}{(x)} \cos{(x)} + 3 x \sin^{4}{(x)} + \frac{3 x \sin{(x)}}{\cos^{3}{(x)}} + \frac{1}{\cos^{2}{(x)}}\)'
    C: '\(- 4 x^{2} \sin^{3}{(x)} \cos{(x)} + 2 x \sin^{4}{(x)} + \frac{2 x \sin{(x)}}{\cos^{3}{(x)}} + \frac{1}{\cos^{2}{(x)}}\)'
    D: '\(4 x^{2} \sin^{3}{(x)} \cos{(x)} + 2 x \sin^{4}{(x)} + \frac{2 x \sin{(x)}}{\cos^{3}{(x)}} + \frac{1}{\cos^{2}{(x)}}\)'
    answer: D
    hint: Use the product rule on each term and the chain rule for the powers.
    explanation: 'Differentiating gives \(4 x^{2} \sin^{3}{\left(x \right)} \cos{\left(x \right)} + 2 x \sin^{4}{\left(x \right)} + \frac{2 x \sin{\left(x \right)}}{\cos^{3}{\left(x \right)}} + \frac{1}{\cos^{2}{\left(x \right)}}\).'
  102:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dx}\left[\left(x^{2} - 2 x + 2\right) e^{\frac{5 x}{2}}\right]\).'
    A: '\(\left(2 x + 2\right) e^{\frac{5 x}{2}} + \frac{5 \left(x^{2} + 2 x + 2\right) e^{\frac{5 x}{2}}}{2}\)'
    B: '\(\left(2 x - 2\right) e^{\frac{5 x}{2}} + \frac{5 \left(x^{2} - 2 x + 2\right) e^{\frac{5 x}{2}}}{2}\)'
    C: '\(\left(- 2 x - 2\right) e^{\frac{5 x}{2}} + \frac{5 \left(- 2 x - 2 + \frac{1}{x^{2}}\right) e^{\frac{5 x}{2}}}{2}\)'
    D: '\(\left(2 x - 1\right) e^{\frac{5 x}{2}} + \frac{5 \left(x^{2} - x + 2\right) e^{\frac{5 x}{2}}}{2}\)'
    answer: B
    hint: 'Product rule; the derivative of \(e^{5x/2}\) is \(\tfrac52e^{5x/2}\).'
    explanation: 'Differentiating gives \(\left(2 x - 2\right) e^{\frac{5 x}{2}} + \frac{5 \left(x^{2} - 2 x + 2\right) e^{\frac{5 x}{2}}}{2}\).'
  103:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dt}\left[\sin^{2}{\left(\pi t - 2 \right)}\right]\).'
    A: '\(2 \pi \sin{\left(\pi t - 3 \right)} \cos{\left(\pi t - 3 \right)}\)'
    B: '\(2 \pi \sin{\left(\pi t + 2 \right)} \cos{\left(\pi t + 2 \right)}\)'
    C: '\(2 \pi \sin{\left(\pi t - 2 \right)} \cos{\left(\pi t - 2 \right)}\)'
    D: '\(2 \pi \sin^{2}{\left(\pi t - 2 \right)}\)'
    answer: C
    hint: Chain rule twice.
    explanation: 'Differentiating gives \(2 \pi \sin{\left(\pi t - 2 \right)} \cos{\left(\pi t - 2 \right)}\).'
  104:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dt}\left[\sec^{2}{\left(\pi t \right)}\right]\).'
    A: '\(2 \pi \tan{\left(\pi t \right)} \sec^{2}{\left(\pi t \right)}\)'
    B: '\(3 \pi \tan{\left(\pi t \right)} \sec^{3}{\left(\pi t \right)}\)'
    C: '\(\pi \tan{\left(\pi t \right)} \sec{\left(\pi t \right)}\)'
    D: '\(4 \pi \tan{\left(\pi t \right)} \sec^{4}{\left(\pi t \right)}\)'
    answer: A
    hint: 'Outer power 2, then \(\sec\), then \(\pi t\).'
    explanation: 'Differentiating gives \(2 \pi \tan{\left(\pi t \right)} \sec^{2}{\left(\pi t \right)}\).'
  105:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dt}\left[e^{3 \sin{\left(\frac{t}{2} \right)}}\right]\).'
    A: '\(\frac{3 e^{3 \sin{\left(\frac{t}{2} \right)}} \cos{\left(\frac{t}{2} \right)}}{2}\)'
    B: '\(\frac{3 e^{3 \sin{\left(t \right)}} \cos{\left(t \right)}}{2}\)'
    C: '\(\frac{3 e^{4 \sin{\left(\frac{t}{2} \right)}} \cos{\left(\frac{t}{2} \right)}}{2}\)'
    D: '\(\frac{3 e^{- 3 \sin{\left(\frac{t}{2} \right)}} \cos{\left(\frac{t}{2} \right)}}{2}\)'
    answer: A
    hint: '\(\left(e^{\sin(t/2)}\right)^3=e^{3\sin(t/2)}\).'
    explanation: 'Differentiating gives \(\frac{3 e^{3 \sin{\left(\frac{t}{2} \right)}} \cos{\left(\frac{t}{2} \right)}}{2}\).'
  106:
    topic: s3-5
    question: 'Find \(\dfrac{d}{dt}\left[\sin{\left(\cos{\left(2 t - 5 \right)} \right)}\right]\).'
    A: '\(2 \sin{\left(2 t + 5 \right)} \cos{\left(\cos{\left(2 t + 5 \right)} \right)}\)'
    B: '\(- 2 \sin{\left(2 t + 5 \right)} \cos{\left(\cos{\left(2 t + 5 \right)} \right)}\)'
    C: '\(- 2 \sin{\left(2 t - 5 \right)} \cos{\left(\cos{\left(2 t - 5 \right)} \right)}\)'
    D: '\(- 2 \sin{\left(3 t - 5 \right)} \cos{\left(\cos{\left(3 t - 5 \right)} \right)}\)'
    answer: C
    hint: 'Three layers: \(\sin\), \(\cos\), and \(2t-5\).'
    explanation: 'Differentiating gives \(- 2 \sin{\left(2 t - 5 \right)} \cos{\left(\cos{\left(2 t - 5 \right)} \right)}\).'
  107:
    topic: s3-5
    question: 'Find \(\dfrac{d^{2}}{dx^{2}}\left[\left(1 + \frac{1}{x}\right)^{3}\right]\).'
    A: '\(\frac{6 \left(1 + \frac{1}{x}\right) \left(1 + \frac{2}{x}\right)}{x^{3}}\)'
    B: '\(\frac{6 \left(1 + \frac{1}{x}\right) \left(1 + \frac{2}{x}\right)}{x^{4}}\)'
    C: '\(\frac{12 \left(1 + \frac{1}{x}\right) \left(1 + \frac{2}{x}\right)}{x^{3}}\)'
    D: '\(\frac{6 \left(2 + \frac{1}{x}\right) \left(2 + \frac{2}{x}\right)}{x^{3}}\)'
    answer: A
    hint: 'Second derivative: differentiate \(3(1+1/x)^2\cdot(-1/x^2)\) again.'
    explanation: 'Differentiating gives \(\frac{6 \left(1 + \frac{1}{x}\right) \left(1 + \frac{2}{x}\right)}{x^{3}}\).'
  108:
    topic: s3-5
    question: 'Find \(\dfrac{d^{2}}{dx^{2}}\left[5 x + e^{x^{2}}\right]\).'
    A: '\(3 \left(3 x^{3} + 1\right) e^{x^{3}}\)'
    B: '\(2 \left(2 x^{2} + 2\right) e^{x^{2}}\)'
    C: '\(\left(x + 1\right) e^{x}\)'
    D: '\(2 \left(2 x^{2} + 1\right) e^{x^{2}}\)'
    answer: D
    hint: 'Second derivative of \(e^{x^2}\) needs the product rule.'
    explanation: 'Differentiating gives \(2 \left(2 x^{2} + 1\right) e^{x^{2}}\).'
  109:
    topic: s3-5
    question: 'Find the value of \((f\circ g)''(x)\) if \(f(u)=u^5+1\), \(u=g(x)=\sqrt x\), \(x=1\).'
    A: '\(- \frac{5}{2}\)'
    B: '\(5\)'
    C: '\(\frac{5}{2}\)'
    D: '\(\frac{7}{2}\)'
    answer: C
    hint: '\((f\circ g)''(x)=f''(g(x))\,g''(x)\).'
    explanation: 'Compute \(g(x_0)\), then \(f''(g(x_0))\cdot g''(x_0)=\frac{5}{2}\).'
  110:
    topic: s3-5
    question: 'Find the value of \((f\circ g)''(x)\) if \(f(u)=1-\dfrac1u\), \(u=g(x)=\dfrac1{1-x}\), \(x=-1\).'
    A: '\(1\)'
    B: '\(0\)'
    C: '\(-1\)'
    D: '\(2\)'
    answer: A
    hint: '\((f\circ g)''(x)=f''(g(x))\,g''(x)\).'
    explanation: 'Compute \(g(x_0)\), then \(f''(g(x_0))\cdot g''(x_0)=1\).'
  111:
    topic: s3-5
    question: 'Find the value of \((f\circ g)''(x)\) if \(f(u)=\cot\dfrac{\pi u}{10}\), \(u=g(x)=5\sqrt x\), \(x=1\).'
    A: '\(- \frac{\pi}{2}\)'
    B: '\(1 - \frac{\pi}{4}\)'
    C: '\(\frac{\pi}{4}\)'
    D: '\(- \frac{\pi}{4}\)'
    answer: D
    hint: '\((f\circ g)''(x)=f''(g(x))\,g''(x)\).'
    explanation: 'Compute \(g(x_0)\), then \(f''(g(x_0))\cdot g''(x_0)=- \frac{\pi}{4}\).'
  112:
    topic: s3-5
    question: 'Find the value of \((f\circ g)''(x)\) if \(f(u)=u+\dfrac1{\cos^2u}\), \(u=g(x)=\pi x\), \(x=\tfrac14\).'
    A: '\(- 5 \pi\)'
    B: '\(5 \pi\)'
    C: '\(10 \pi\)'
    D: '\(1 + 5 \pi\)'
    answer: B
    hint: '\((f\circ g)''(x)=f''(g(x))\,g''(x)\).'
    explanation: 'Compute \(g(x_0)\), then \(f''(g(x_0))\cdot g''(x_0)=5 \pi\).'
  113:
    topic: s3-5
    question: 'Find the value of \((f\circ g)''(x)\) if \(f(u)=\left(\dfrac{u-1}{u+1}\right)^2\), \(u=g(x)=\dfrac1{x^2}-1\), \(x=-1\).'
    A: '\(8\)'
    B: '\(-8\)'
    C: '\(-7\)'
    D: '\(-16\)'
    answer: B
    hint: '\((f\circ g)''(x)=f''(g(x))\,g''(x)\).'
    explanation: 'Compute \(g(x_0)\), then \(f''(g(x_0))\cdot g''(x_0)=-8\).'
  114:
    topic: s3-5
    question: 'Suppose \(f(2)=8\), \(g(2)=2\), \(f''(2)=\tfrac13\), \(g''(2)=-3\), and \(f(3)=3\), \(g(3)=-4\), \(f''(3)=2\pi\), \(g''(3)=5\). Then \(\dfrac{d}{dx}f(g(x))\) at \(x=2\) equals'
    A: '\(-3\)'
    B: '\(\tfrac13\)'
    C: '\(1\)'
    D: '\(-1\)'
    answer: D
    hint: '\(f''(g(2))\,g''(2)=f''(2)\,g''(2)\).'
    explanation: '\(\tfrac13\cdot(-3)=-1\).'
  115:
    topic: s3-5
    question: 'With the same table, \(\dfrac{d}{dx}\bigl(f(x)g(x)\bigr)\) at \(x=3\) equals'
    A: '\(10\pi\)'
    B: '\(15-8\pi\)'
    C: '\(8\pi-15\)'
    D: '\(15+8\pi\)'
    answer: B
    hint: 'Product rule: \(f''g+fg''\).'
    explanation: '\(2\pi(-4)+3\cdot5=15-8\pi\).'
  116:
    topic: s3-5
    question: 'With the same table, \(\dfrac{d}{dx}\dfrac{f(x)}{g(x)}\) at \(x=2\) equals'
    A: '\(\dfrac{-37}{6}\)'
    B: '\(\dfrac{1}{6}\)'
    C: '\(\dfrac{26}{3}\)'
    D: '\(\dfrac{37}{6}\)'
    answer: D
    hint: 'Quotient rule: \(\dfrac{f''g-fg''}{g^2}\).'
    explanation: '\(\dfrac{\frac13\cdot2-8(-3)}{4}=\dfrac{2/3+24}{4}=\dfrac{37}{6}\).'
  117:
    topic: s3-5
    question: 'With the same table, \(\dfrac{d}{dx}\dfrac{1}{g^2(x)}\) at \(x=3\) equals'
    A: '\(-\dfrac{5}{32}\)'
    B: '\(\dfrac{5}{16}\)'
    C: '\(\dfrac{5}{32}\)'
    D: '\(-\dfrac{5}{64}\)'
    answer: C
    hint: '\(\dfrac{d}{dx}g^{-2}=-2g^{-3}g''\).'
    explanation: '\(-2\cdot\dfrac{5}{(-4)^3}=\dfrac{10}{64}=\dfrac5{32}\).'
  118:
    topic: s3-5
    question: 'Find \(\dfrac{ds}{dt}\) when \(\theta=3\pi/2\) if \(s=\cos\theta\) and \(\dfrac{d\theta}{dt}=5\).'
    A: '\(-5\)'
    B: '\(-1\)'
    C: '\(5\)'
    D: '\(0\)'
    answer: C
    hint: '\(\dfrac{ds}{dt}=-\sin\theta\cdot\dfrac{d\theta}{dt}\).'
    explanation: '\(-\sin(3\pi/2)\cdot5=-(-1)(5)=5\).'
  119:
    topic: s3-5
    question: 'The parametric curve \(x=\cos2t\), \(y=\sin2t\), \(0\le t\le\pi\), traces'
    A: half the unit circle
    B: the unit circle twice
    C: 'the unit circle once, clockwise from \((1,0)\)'
    D: 'the unit circle once, counterclockwise from \((1,0)\)'
    answer: D
    hint: '\(2t\) runs from 0 to \(2\pi\).'
    explanation: '\(x^2+y^2=1\), and the angle \(2t\) goes through \(2\pi\), one full counterclockwise turn.'
  120:
    topic: s3-5
    question: 'The path \(x=3t\), \(y=9t^2\), \(-\infty<t<\infty\) is'
    A: 'the parabola \(y=x^2\)'
    B: 'the line \(y=3x\)'
    C: 'half of the parabola \(y=x^2\)'
    D: 'the parabola \(y=3x^2\)'
    answer: A
    hint: 'Substitute \(t=x/3\).'
    explanation: '\(y=9(x/3)^2=x^2\), traced entirely, left to right.'
  121:
    topic: s3-5
    question: 'The path \(x=2t-5\), \(y=4t-7\), \(-\infty<t<\infty\) is'
    A: 'the line \(y=2x-3\)'
    B: 'the line \(y=4x-7\)'
    C: a parabola
    D: 'the line \(y=2x+3\)'
    answer: D
    hint: 'Eliminate \(t=(x+5)/2\).'
    explanation: '\(y=4\cdot\dfrac{x+5}{2}-7=2x+3\).'
  122:
    topic: s3-5
    question: 'The path \(x=4\cos t\), \(y=2\sin t\), \(0\le t\le2\pi\) traces'
    A: 'the circle \(x^2+y^2=4\)'
    B: the ellipse once clockwise
    C: 'the ellipse \(\dfrac{x^2}{4}+\dfrac{y^2}{16}=1\)'
    D: 'the ellipse \(\dfrac{x^2}{16}+\dfrac{y^2}{4}=1\) once counterclockwise'
    answer: D
    hint: 'Use \(\cos^2t+\sin^2t=1\).'
    explanation: '\((x/4)^2+(y/2)^2=1\).'
  123:
    topic: s3-5
    question: 'For \(x=2\cos t\), \(y=2\sin t\), the slope \(\dfrac{dy}{dx}\) at \(t=\pi/4\) is'
    A: '\(0\)'
    B: '\(1\)'
    C: '\(-\sqrt2\)'
    D: '\(-1\)'
    answer: D
    hint: '\(\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}\).'
    explanation: '\(\dfrac{2\cos t}{-2\sin t}=-\cot t=-1\) at \(t=\pi/4\).'
  124:
    topic: s3-5
    question: 'For \(x=2\cos t\), \(y=2\sin t\), the value of \(\dfrac{d^2y}{dx^2}\) at \(t=\pi/4\) is'
    A: '\(-2\sqrt2\)'
    B: '\(-1\)'
    C: '\(-\sqrt2\)'
    D: '\(\sqrt2\)'
    answer: C
    hint: '\(\dfrac{d^2y}{dx^2}=\dfrac{d(dy/dx)/dt}{dx/dt}\).'
    explanation: '\(\dfrac{d}{dt}(-\cot t)=\csc^2t\); divide by \(-2\sin t\): \(-\tfrac12\csc^3t=-\tfrac12(\sqrt2)^3=-\sqrt2\).'
  125:
    topic: s3-5
    question: 'A piston has position \(s=A\cos(2\pi bt)\). If the frequency \(b\) is doubled, the maximum velocity, acceleration and jerk are multiplied by'
    A: '\(4\), \(8\) and \(16\)'
    B: '\(2\), \(4\) and \(8\) respectively'
    C: '\(1\), \(2\) and \(4\)'
    D: '\(2\), \(2\) and \(2\)'
    answer: B
    hint: 'Each derivative brings down another factor of \(2\pi b\).'
    explanation: '\(s''\) has amplitude \(2\pi bA\), \(s''''\) has \((2\pi b)^2A\), \(s''''''\) has \((2\pi b)^3A\).'
  126:
    topic: s3-5
    question: 'The temperature in Fairbanks is approximated by \(y=37\sin\!\left[\dfrac{2\pi}{365}(x-101)\right]+25\). The temperature is rising fastest when'
    A: '\(x=101\), at about \(0.64^\circ\)F per day'
    B: '\(x=193\), at about \(0.64^\circ\)F per day'
    C: '\(x=101\), at about \(37^\circ\)F per day'
    D: '\(x=283\), at about \(0.64^\circ\)F per day'
    answer: A
    hint: '\(y''=37\cdot\dfrac{2\pi}{365}\cos[\dots]\) is largest when the cosine is 1.'
    explanation: '\(\cos0=1\) at \(x=101\); the rate is \(37\cdot2\pi/365\approx0.637\).'
  127:
    topic: s3-5
    question: 'A particle has position \(s=\sqrt{1+4t}\). Its velocity at \(t=6\) s is'
    A: '\(0.4\) m/s'
    B: '\(0.8\) m/s'
    C: '\(0.2\) m/s'
    D: '\(5\) m/s'
    answer: A
    hint: '\(s''=\dfrac{2}{\sqrt{1+4t}}\).'
    explanation: '\(\dfrac{2}{\sqrt{25}}=0.4\). The acceleration is \(-\dfrac{4}{(1+4t)^{3/2}}=-0.032\) m/s\(^2\).'
  128:
    topic: s3-5
    question: 'If \(f(x)=x^2\) and \(g(x)=|x|\), the composites \(f\circ g\) and \(g\circ f\) are both differentiable at \(x=0\) even though \(g\) is not. Why is that not a contradiction of the Chain Rule?'
    A: The Chain Rule is a sufficient condition; it only guarantees a derivative when both parts are differentiable
    B: The Chain Rule is wrong in this case
    C: Composites are always differentiable
    D: '\(|x|\) is differentiable at 0 after all'
    answer: A
    hint: '\(f\circ g(x)=|x|^2=x^2\) and \(g\circ f(x)=|x^2|=x^2\).'
    explanation: 'The composites simplify to \(x^2\), which is smooth. The theorem just does not apply, and it does not forbid the result.'
  129:
    topic: s3-6
    question: 'Find \(\dfrac{d}{dx}\left[x^{\frac{9}{4}}\right]\).'
    A: '\(\frac{9 x^{\frac{9}{4}}}{4}\)'
    B: '\(\frac{9}{4 x^{\frac{5}{4}}}\)'
    C: '\(\frac{13 x^{\frac{5}{4}}}{4}\)'
    D: '\(\frac{9 x^{\frac{5}{4}}}{4}\)'
    answer: D
    hint: Power rule with a rational exponent.
    explanation: 'Differentiating gives \(\frac{9 x^{\frac{5}{4}}}{4}\).'
  130:
    topic: s3-6
    question: 'Find \(\dfrac{d}{dx}\left[7 \sqrt{x + 6}\right]\).'
    A: '\(\frac{7}{2 \left(x + 6\right)}\)'
    B: '\(\frac{7}{2 \sqrt{x + 6}}\)'
    C: '\(\frac{9}{2 \sqrt{x + 6}}\)'
    D: '\(\frac{7}{2 \sqrt{x + 5}}\)'
    answer: B
    hint: 'Chain rule with \(u=x+6\).'
    explanation: 'Differentiating gives \(\frac{7}{2 \sqrt{x + 6}}\).'
  131:
    topic: s3-6
    question: 'Find \(\dfrac{d}{dx}\left[\frac{1}{\sqrt{2 x + 5}}\right]\).'
    A: '\(- \frac{1}{\left(2 x + 5\right)^{\frac{3}{2}}}\)'
    B: '\(- \frac{1}{\left(2 x + 6\right)^{\frac{3}{2}}}\)'
    C: '\(- \frac{1}{\left(2 x + 5\right)^{3}}\)'
    D: '\(- \frac{1}{\left(x + 5\right)^{\frac{3}{2}}}\)'
    answer: A
    hint: 'Chain rule: bring down \(-\tfrac12\) and multiply by 2.'
    explanation: 'Differentiating gives \(- \frac{1}{\left(2 x + 5\right)^{\frac{3}{2}}}\).'
  132:
    topic: s3-6
    question: 'Find \(\dfrac{d}{dx}\left[x \sqrt{x^{2} + 1}\right]\).'
    A: '\(\frac{x^{2}}{\sqrt{x^{2} + 1}} + \sqrt{x^{2} + 1}\)'
    B: '\(\sqrt{1 + \frac{1}{x^{2}}} + \frac{1}{x^{2} \sqrt{1 + \frac{1}{x^{2}}}}\)'
    C: '\(\frac{x^{4}}{\sqrt{x^{4} + 1}} + \sqrt{x^{4} + 1}\)'
    D: '\(\frac{x^{2}}{\sqrt{x^{2} + 2}} + \sqrt{x^{2} + 2}\)'
    answer: A
    hint: Product rule with the chain rule inside.
    explanation: 'Differentiating gives \(\frac{x^{2}}{\sqrt{x^{2} + 1}} + \sqrt{x^{2} + 1}\).'
  133:
    topic: s3-6
    question: 'Find \(\dfrac{d}{dx}\left[\left(1 - 6 x\right)^{\frac{2}{3}}\right]\).'
    A: '\(- \frac{4}{\sqrt[3]{6 x + 1}}\)'
    B: '\(- \frac{4}{\sqrt[6]{1 - 6 x}}\)'
    C: '\(- \frac{4}{\sqrt[3]{1 - 6 x}}\)'
    D: '\(- \frac{4}{\sqrt[3]{1 - 3 x}}\)'
    answer: C
    hint: 'Chain rule with inner derivative \(-6\).'
    explanation: 'Differentiating gives \(- \frac{4}{\sqrt[3]{1 - 6 x}}\).'
  134:
    topic: s3-6
    question: 'If \(x^2y+xy^2=6\), implicit differentiation gives \(\dfrac{dy}{dx}=\)'
    A: '\(-\dfrac{2xy+y^2}{x^2+2xy}\)'
    B: '\(-\dfrac{2xy+y^2}{x^2}\)'
    C: '\(\dfrac{2xy+y^2}{x^2+2xy}\)'
    D: '\(-\dfrac{x^2+2xy}{2xy+y^2}\)'
    answer: A
    hint: 'Differentiate each term with respect to \(x\), treating \(y\) as a function of \(x\).'
    explanation: '\(2xy+x^2y''+y^2+2xyy''=0\), so \(y''=-\dfrac{2xy+y^2}{x^2+2xy}\).'
  135:
    topic: s3-6
    question: 'If \(x^3+y^3=18xy\), then \(\dfrac{dy}{dx}=\)'
    A: '\(\dfrac{x^2-6y}{y^2-6x}\)'
    B: '\(\dfrac{6y-x^2}{y^2-6x}\)'
    C: '\(\dfrac{6y-x^2}{6x-y^2}\)'
    D: '\(\dfrac{18y-3x^2}{3y^2}\)'
    answer: B
    hint: '\(3x^2+3y^2y''=18y+18xy''\).'
    explanation: 'Collect \(y''\): \(y''(3y^2-18x)=18y-3x^2\).'
  136:
    topic: s3-6
    question: 'If \(y^2=\dfrac{x-1}{x+1}\), then \(\dfrac{dy}{dx}=\)'
    A: '\(\dfrac{1}{2y(x+1)}\)'
    B: '\(\dfrac{1}{y(x+1)^2}\)'
    C: '\(\dfrac{y}{(x+1)^2}\)'
    D: '\(\dfrac{2}{y(x+1)^2}\)'
    answer: B
    hint: '\(2yy''=\dfrac{2}{(x+1)^2}\).'
    explanation: 'The quotient rule gives \(\dfrac{(x+1)-(x-1)}{(x+1)^2}=\dfrac{2}{(x+1)^2}\).'
  137:
    topic: s3-6
    question: 'If \(x=\tan y\), then \(\dfrac{dy}{dx}=\)'
    A: '\(\cos^2y=\dfrac{1}{1+x^2}\)'
    B: '\(\sin^2y\)'
    C: '\(\dfrac1{\cos y}\)'
    D: '\(\sec^2y\)'
    answer: A
    hint: '\(1=\sec^2y\cdot y''\).'
    explanation: '\(y''=\cos^2y\), and \(\cos^2y=\dfrac1{1+\tan^2y}=\dfrac1{1+x^2}\).'
  138:
    topic: s3-6
    question: 'If \(x^2+y^2=1\), then \(\dfrac{d^2y}{dx^2}=\)'
    A: '\(-\dfrac{1}{y^3}\)'
    B: '\(-\dfrac{x}{y^3}\)'
    C: '\(\dfrac1{y^3}\)'
    D: '\(-\dfrac1y\)'
    answer: A
    hint: '\(y''=-x/y\). Differentiate again and substitute \(x^2+y^2=1\).'
    explanation: '\(y''''=\dfrac{-y+xy''}{y^2}\cdot\dots=-\dfrac{y^2+x^2}{y^3}=-\dfrac1{y^3}\).'
  139:
    topic: s3-6
    question: 'At \((2,3)\) on \(x^2+xy-y^2=1\), the tangent line is'
    A: '\(y-3=\dfrac74(x-2)\)'
    B: '\(y-3=\dfrac47(x-2)\)'
    C: '\(y-3=-\dfrac74(x-2)\)'
    D: '\(y-3=\dfrac74x\)'
    answer: A
    hint: '\(y''=\dfrac{2x+y}{2y-x}\).'
    explanation: '\(y''(2,3)=\dfrac{7}{4}\). (The normal has slope \(-\tfrac47\).)'
  140:
    topic: s3-6
    question: 'At \((3,-4)\) on the circle \(x^2+y^2=25\), the slope of the tangent is'
    A: '\(\dfrac43\)'
    B: '\(\dfrac34\)'
    C: '\(-\dfrac43\)'
    D: '\(-\dfrac34\)'
    answer: B
    hint: '\(y''=-x/y\).'
    explanation: '\(-3/(-4)=\tfrac34\).'
  141:
    topic: s3-6
    question: 'On \(x^2y^2=9\) at \((-1,3)\), the tangent line has slope'
    A: '\(3\)'
    B: '\(-\dfrac13\)'
    C: '\(-3\)'
    D: '\(\dfrac13\)'
    answer: A
    hint: '\(y''=-y/x\).'
    explanation: '\(-3/(-1)=3\).'
  142:
    topic: s3-6
    question: 'The curve \(x^2+xy+y^2=7\) crosses the \(x\)-axis at two points. The tangents there are'
    A: 'parallel, each with slope \(2\)'
    B: both horizontal
    C: 'parallel, each with slope \(-2\)'
    D: perpendicular
    answer: C
    hint: 'Set \(y=0\): \(x=\pm\sqrt7\). Then \(y''=-\dfrac{2x+y}{x+2y}\).'
    explanation: 'At \(y=0\): \(y''=-\dfrac{2x}{x}=-2\) for both points.'
  143:
    topic: s3-6
    question: 'The folium \(x^3+y^3-9xy=0\) has slope \(\dfrac54\) at'
    A: '\((4,2)\)'
    B: '\((4,4)\)'
    C: '\((0,0)\)'
    D: '\((2,4)\)'
    answer: A
    hint: '\(y''=\dfrac{9y-3x^2}{3y^2-9x}\).'
    explanation: 'At \((4,2)\): \(\dfrac{18-48}{12-36}=\dfrac54\). At \((2,4)\): \(\dfrac{36-12}{48-18}=\dfrac45\).'
  144:
    topic: s3-6
    question: 'Which of these could be true if \(f''''(x)=x^{-1/3}\)?'
    A: '\(f(x)=\dfrac9{10}x^{5/3}-7\)'
    B: '\(f''(x)=\dfrac32x^{2/3}+6\) with \(f''''''(x)=\dfrac13x^{-4/3}\)'
    C: '\(f(x)=x^{-1/3}\)'
    D: '\(f(x)=\dfrac32x^{2/3}-3\)'
    answer: A
    hint: Differentiate each candidate twice.
    explanation: '\(f''=\dfrac32x^{2/3}\) and \(f''''=x^{-1/3}\). (The choice with \(f''''''\) has the wrong sign: \(f''''''=-\tfrac13x^{-4/3}\).)'
  145:
    topic: s3-6
    question: 'The curves \(y^2=x^3\) and \(2x^2+3y^2=5\) meet at \((1,1)\). Their tangent lines there are'
    A: identical
    B: perpendicular
    C: neither perpendicular nor parallel
    D: parallel
    answer: B
    hint: 'Compute both slopes at \((1,1)\).'
    explanation: 'The slopes are \(\tfrac32\) and \(-\tfrac23\); their product is \(-1\).'
  146:
    topic: s3-7
    question: 'Let \(f(x)=x^3-3x^2-1\), \(x\ge2\). The value of \(\dfrac{df^{-1}}{dx}\) at \(x=-1=f(3)\) is'
    A: '\(9\)'
    B: '\(\dfrac19\)'
    C: '\(-\dfrac19\)'
    D: '\(\dfrac13\)'
    answer: B
    hint: '\((f^{-1})''(f(a))=\dfrac{1}{f''(a)}\).'
    explanation: '\(f''(x)=3x^2-6x\), so \(f''(3)=9\) and the inverse slope is \(\tfrac19\).'
  147:
    topic: s3-7
    question: 'Let \(f(x)=x^2-4x-5\), \(x>2\). The value of \(\dfrac{df^{-1}}{dx}\) at \(x=0=f(5)\) is'
    A: '\(6\)'
    B: '\(\dfrac16\)'
    C: '\(\dfrac15\)'
    D: '\(\dfrac1{10}\)'
    answer: B
    hint: '\(f''(5)=2\cdot5-4\).'
    explanation: '\(f''(5)=6\), so \((f^{-1})''(0)=\tfrac16\).'
  148:
    topic: s3-7
    question: 'If \(y=f(x)\) has an inverse and its graph passes through \((2,4)\) with slope \(\tfrac13\), then \(\dfrac{df^{-1}}{dx}\) at \(x=4\) is'
    A: '\(\dfrac13\)'
    B: '\(-3\)'
    C: '\(3\)'
    D: '\(\dfrac12\)'
    answer: C
    hint: Slopes of inverse functions are reciprocals.
    explanation: '\((f^{-1})''(4)=1/f''(2)=3\).'
  149:
    topic: s3-7
    question: 'If \(y=g(x)\) has an inverse and passes through the origin with slope 2, the graph of \(g^{-1}\) at the origin has slope'
    A: '\(-2\)'
    B: '\(2\)'
    C: '\(0\)'
    D: '\(\dfrac12\)'
    answer: D
    hint: 'Reflect across \(y=x\).'
    explanation: 'Reflecting across \(y=x\) inverts the slope.'
  150:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dx}\left[\ln{\left(3 x \right)}\right]\).'
    A: '\(\frac{1}{x^{2}}\)'
    B: '\(1\)'
    C: '\(\frac{1}{x}\)'
    D: '\(x\)'
    answer: C
    hint: '\(\ln3x=\ln3+\ln x\).'
    explanation: 'Differentiating gives \(\frac{1}{x}\).'
  151:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dt}\left[\ln{\left(t^{\frac{3}{2}} \right)}\right]\).'
    A: '\(\frac{3 t}{2}\)'
    B: '\(\frac{3}{t}\)'
    C: '\(\frac{3}{2 t}\)'
    D: '\(\frac{3}{2 t^{2}}\)'
    answer: C
    hint: '\(\ln t^{3/2}=\tfrac32\ln t\).'
    explanation: 'Differentiating gives \(\frac{3}{2 t}\).'
  152:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dx}\left[\ln{\left(\frac{3}{x} \right)}\right]\).'
    A: '\(0\)'
    B: '\(- \frac{2}{x^{2}}\)'
    C: '\(- \frac{1}{x}\)'
    D: '\(x\)'
    answer: C
    hint: '\(\ln\dfrac3x=\ln3-\ln x\).'
    explanation: 'Differentiating gives \(- \frac{1}{x}\).'
  153:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dx}\left[\ln{\left(x \right)}^{3}\right]\).'
    A: '\(\frac{3 \ln{(x)}^{2}}{2 x}\)'
    B: '\(\frac{3}{x \ln{(x)}^{2}}\)'
    C: '\(\frac{3 \ln{(x)}^{2}}{x}\)'
    D: '\(\frac{3 \ln{(x)}^{2}}{\sqrt{x}}\)'
    answer: C
    hint: Chain rule with the cube.
    explanation: 'Differentiating gives \(\frac{3 \ln{\left(x \right)}^{2}}{x}\).'
  154:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dt}\left[t \ln{\left(t \right)}^{2}\right]\).'
    A: '\(\ln{\left(t \right)}^{4} + 4 \ln{\left(t \right)}\)'
    B: '\(\ln{\left(t \right)}^{2}\)'
    C: '\(\ln{\left(t \right)}^{2} - 2 \ln{\left(t \right)}\)'
    D: '\(\ln{\left(t \right)}^{2} + 2 \ln{\left(t \right)}\)'
    answer: D
    hint: Product rule.
    explanation: 'Differentiating gives \(\ln{\left(t \right)}^{2} + 2 \ln{\left(t \right)}\).'
  155:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dt}\left[\frac{\ln{\left(t \right)}}{t}\right]\).'
    A: '\(- \frac{\ln{\left(t \right)}}{t} + \frac{1}{t}\)'
    B: '\(- \frac{\ln{\left(t \right)}}{t^{2}}\)'
    C: '\(\frac{\ln{\left(t \right)}}{t^{2}} - \frac{1}{t^{2}}\)'
    D: '\(- \frac{\ln{\left(t \right)}}{t^{2}} + \frac{1}{t^{2}}\)'
    answer: D
    hint: Quotient rule.
    explanation: 'Differentiating gives \(- \frac{\ln{\left(t \right)}}{t^{2}} + \frac{1}{t^{2}}\).'
  156:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dx}\left[\ln{\left(\ln{\left(x \right)} \right)}\right]\).'
    A: '\(\frac{1}{x^{2} \ln{(x)}^{2}}\)'
    B: '\(- \frac{1}{x \ln{(x)}}\)'
    C: '\(\frac{1}{x \ln{(x)}}\)'
    D: '\(x \ln{(x)}\)'
    answer: C
    hint: 'Chain rule: \(\dfrac{1}{\ln x}\cdot\dfrac1x\).'
    explanation: 'Differentiating gives \(\frac{1}{x \ln{\left(x \right)}}\).'
  157:
    topic: s3-7
    question: 'Find \(\dfrac{d}{d\theta}\left[\theta \left(\sin{\left(\ln{\left(\theta \right)} \right)} + \cos{\left(\ln{\left(\theta \right)} \right)}\right)\right]\).'
    A: '\(\theta \left(- \frac{\sin{\left(\ln{\left(\theta \right)} \right)}}{\theta} + \frac{\cos{\left(\ln{\left(\theta \right)} \right)}}{\theta}\right) + \sin{\left(\ln{\left(\theta \right)} \right)} + \cos{\left(\ln{\left(\theta \right)} \right)}\)'
    B: '\(\theta \left(- \frac{2 \sin{\left(\ln{\left(\theta \right)} \right)}}{\theta^{2}} + \frac{\cos{\left(\ln{\left(\theta \right)} \right)}}{\theta^{2}}\right) + \sin{\left(\ln{\left(\theta \right)} \right)} + \cos{\left(\ln{\left(\theta \right)} \right)}\)'
    C: '\(\theta \left(- \frac{\sin{\left(\ln{\left(\theta \right)} \right)}}{2 \sqrt{\theta}} + \frac{\cos{\left(\ln{\left(\theta \right)} \right)}}{\sqrt{\theta}}\right) + \sin{\left(\ln{\left(\theta \right)} \right)} + \cos{\left(\ln{\left(\theta \right)} \right)}\)'
    D: '\(\theta \left(- \frac{\sin{\left(\ln{\left(\theta \right)} \right)}}{\theta} + \frac{\cos{\left(\ln{\left(\theta \right)} \right)}}{\theta}\right) + \sin{\left(\ln{\left(\theta \right)} \right)} - \cos{\left(\ln{\left(\theta \right)} \right)}\)'
    answer: A
    hint: 'Product rule; the \(\sin\) and \(\cos\) terms combine nicely.'
    explanation: 'Differentiating gives \(\theta \left(- \frac{\sin{\left(\ln{\left(\theta \right)} \right)}}{\theta} + \frac{\cos{\left(\ln{\left(\theta \right)} \right)}}{\theta}\right) + \sin{\left(\ln{\left(\theta \right)} \right)} + \cos{\left(\ln{\left(\theta \right)} \right)}\).'
  158:
    topic: s3-7
    question: 'Find \(\dfrac{d}{d\theta}\left[\ln{\left(\tan{\left(\theta \right)} + \sec{\left(\theta \right)} \right)}\right]\).'
    A: '\(\frac{\tan^{2}{\left(\theta \right)} + \tan{\left(\theta \right)} \sec{\left(\theta \right)}}{\tan{\left(\theta \right)} + \sec{\left(\theta \right)}}\)'
    B: '\(\frac{\tan^{4}{\left(\theta \right)} + \tan{\left(\theta \right)} \sec{\left(\theta \right)} + 1}{\tan{\left(\theta \right)} + \sec{\left(\theta \right)}}\)'
    C: '\(\frac{\tan^{2}{\left(\theta \right)} + \tan{\left(\theta \right)} \sec{\left(\theta \right)} + 2}{\tan{\left(\theta \right)} + \sec{\left(\theta \right)}}\)'
    D: '\(\frac{\tan^{2}{\left(\theta \right)} + \tan{\left(\theta \right)} \sec{\left(\theta \right)} + 1}{\tan{\left(\theta \right)} + \sec{\left(\theta \right)}}\)'
    answer: D
    hint: 'The derivative of \(\sec\theta+\tan\theta\) is \(\sec\theta(\tan\theta+\sec\theta)\).'
    explanation: 'Differentiating gives \(\frac{\tan^{2}{\left(\theta \right)} + \tan{\left(\theta \right)} \sec{\left(\theta \right)} + 1}{\tan{\left(\theta \right)} + \sec{\left(\theta \right)}}\).'
  159:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dx}\left[\frac{\ln{\left(\frac{x + 1}{1 - x} \right)}}{2}\right]\).'
    A: '\(\frac{\left(1 - x\right) \left(\frac{1}{1 - x} + \frac{x + 1}{\left(1 - x\right)^{2}}\right)}{2 \left(x + 1\right)}\)'
    B: '\(\frac{\left(2 - x\right) \left(\frac{1}{2 - x} + \frac{x + 2}{\left(2 - x\right)^{2}}\right)}{2 \left(x + 2\right)}\)'
    C: '\(- \frac{\left(1 - x\right) \left(\frac{1}{1 - x} + \frac{x + 1}{\left(1 - x\right)^{2}}\right)}{2 \left(x + 1\right)}\)'
    D: '\(\frac{\left(x + 1\right)^{2} \left(x + 1 + \frac{1}{x + 1}\right)}{2}\)'
    answer: A
    hint: 'Write \(\tfrac12[\ln(1+x)-\ln(1-x)]\).'
    explanation: 'Differentiating gives \(\frac{\left(1 - x\right) \left(\frac{1}{1 - x} + \frac{x + 1}{\left(1 - x\right)^{2}}\right)}{2 \left(x + 1\right)}\).'
  160:
    topic: s3-7
    question: 'Find \(\dfrac{d}{dx}\left[2^{x}\right]\).'
    A: '\(3^{x} \ln{\left(3 \right)}\)'
    B: '\(4^{x} \ln{\left(4 \right)}\)'
    C: '\(2^{x} \ln{\left(2 \right)}\)'
    D: '\(- 2^{x} \ln{\left(2 \right)}\)'
    answer: C
    hint: '\(\dfrac{d}{dx}a^x=a^x\ln a\).'
    explanation: 'Differentiating gives \(2^{x} \ln{\left(2 \right)}\).'
  161:
    topic: s3-7
    question: 'Find \(\dfrac{d}{ds}\left[5^{\sqrt{s}}\right]\).'
    A: '\(\frac{\left(\frac{5}{2}\right)^{\sqrt{s}} \ln{\left(\frac{5}{2} \right)}}{2 \sqrt{s}}\)'
    B: '\(\frac{5^{\sqrt{s}} \ln{\left(5 \right)}}{2 \sqrt{s}}\)'
    C: '\(\frac{5^{\sqrt{s}} \ln{\left(5 \right)}}{2 s^{\frac{3}{2}}}\)'
    D: '\(\frac{6^{\sqrt{s}} \ln{\left(6 \right)}}{2 \sqrt{s}}\)'
    answer: B
