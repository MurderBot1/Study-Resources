# Chapter 9: Further Applications of Integration
#
# Practice questions based on the exercises in Thomas' Calculus: Early Transcendentals (11th ed.), Chapter 9.
# Math is written in LaTeX between \( and \). Format: see the README ("Quiz file format").

title: "Chapter 9: Further Applications of Integration"
description: "Slope fields and separable equations, first-order linear equations, Euler's method, autonomous equations and phase lines, and applications of first-order equations."
topics:
  s9-1:
    title: 9.1 Slope Fields and Separable Differential Equations
  s9-2:
    title: 9.2 First-Order Linear Differential Equations
  s9-3:
    title: "9.3 Euler's Method"
  s9-4:
    title: 9.4 Graphical Solutions of Autonomous Differential Equations
  s9-5:
    title: 9.5 Applications of First-Order Differential Equations
questions:
  1:
    topic: s9-1
    question: 'Which function is a solution of \(2y''+3y=e^{-x}\) for every constant \(C\)?'
    A: '\(y=C e^{- \frac{3 x}{2}} + e^{- x}\)'
    B: '\(y=C e^{- x} + e^{- x}\)'
    C: '\(y=C + e^{- \frac{3 x}{2}}\)'
    D: '\(y=C e^{- \frac{3 x}{2}} + 2 e^{- x}\)'
    answer: A
    hint: 'Substitute into \(2y''+3y\) and compare with \(e^{-x}\).'
    explanation: 'For \(y=e^{-x}\): \(2(-e^{-x})+3e^{-x}=e^{-x}\), and the \(Ce^{-3x/2}\) term solves \(2y''+3y=0\).'
  2:
    topic: s9-1
    question: 'Which function is a solution of \(y''=y^2\) for every constant \(C\)?'
    A: '\(y=\frac{1}{C + x}\)'
    B: '\(y=- \frac{1}{C + x^{2}}\)'
    C: '\(y=- \frac{1}{C + x}\)'
    D: '\(y=e^{C + x}\)'
    answer: C
    hint: 'Differentiate and compare with \(y^2\).'
    explanation: '\(y=-(x+C)^{-1}\) gives \(y''=(x+C)^{-2}=y^2\).'
  3:
    topic: s9-1
    question: 'If \(y=\dfrac1x\displaystyle\int_1^x\dfrac{e^t}t\,dt\) for \(x>0\), then \(x^2y''+xy\) equals'
    A: '\(1\)'
    B: '\(xe^x\)'
    C: '\(\dfrac{e^x}x\)'
    D: '\(e^x\)'
    answer: D
    hint: 'Note \(xy=\displaystyle\int_1^x\dfrac{e^t}t\,dt\), and use the Fundamental Theorem.'
    explanation: '\((xy)''=y+xy''=\dfrac{e^x}x\); multiply by \(x\): \(xy+x^2y''=e^x\).'
  4:
    topic: s9-1
    question: 'If \(y=\dfrac{1}{\sqrt{1+x^4}}\displaystyle\int_1^x\sqrt{1+t^4}\,dt\), then \(y''+\dfrac{2x^3}{1+x^4}y\) equals'
    A: '\(\sqrt{1+x^4}\)'
    B: '\(\dfrac{2x^3}{1+x^4}\)'
    C: '\(0\)'
    D: '\(1\)'
    answer: D
    hint: 'Differentiate the product of \(\left(1+x^4\right)^{-1/2}\) and the integral.'
    explanation: '\(y''=-\dfrac{2x^3}{1+x^4}y+1\), so the left side is \(1\).'
  5:
    topic: s9-1
    question: 'The function \(y=e^{-x}\tan^{-1}\left(2e^x\right)\) satisfies \(y''+y=\)'
    A: '\(\dfrac{2e^x}{1+4e^{2x}}\)'
    B: '\(\dfrac{1}{1+4e^{2x}}\)'
    C: '\(\dfrac{2}{1+4e^{2x}}\)'
    D: '\(\tan^{-1}\left(2e^x\right)\)'
    answer: C
    hint: 'Product rule: \(y''=-e^{-x}\tan^{-1}(2e^x)+e^{-x}\dfrac{2e^x}{1+4e^{2x}}\).'
    explanation: 'The \(-y\) cancels with \(+y\), leaving \(\dfrac{2}{1+4e^{2x}}\).'
  6:
    topic: s9-1
    question: 'For \(y=\dfrac{\cos x}x\) (\(x>0\)), the expression \(xy''+y\) equals'
    A: '\(\sin x\)'
    B: '\(-\cos x\)'
    C: '\(-\sin x\)'
    D: '\(0\)'
    answer: C
    hint: '\(xy''+y=(xy)''\) and \(xy=\cos x\).'
    explanation: '\((\cos x)''=-\sin x\). The initial condition \(y(\pi/2)=0\) also holds.'
  7:
    topic: s9-1
    question: 'The function \(y=\dfrac x{\ln x}\) satisfies \(x^2y''=xy-y^2\) for \(x>1\) and the initial value'
    A: '\(y(e)=\dfrac1e\)'
    B: '\(y(1)=e\)'
    C: '\(y(e)=e\)'
    D: '\(y(e)=1\)'
    answer: C
    hint: 'Evaluate \(\dfrac x{\ln x}\) at \(x=e\).'
    explanation: '\(\dfrac{e}{\ln e}=e\).'
  8:
    topic: s9-1
    question: 'Which function solves \(y''=e^{-x^2}-2xy\) with \(y(2)=0\)?'
    A: '\(y=x e^{- x^{2}} - 2\)'
    B: '\(y=\left(x - 2\right) e^{- x^{2}}\)'
    C: '\(y=\left(x + 2\right) e^{- x^{2}}\)'
    D: '\(y=\left(x - 2\right) e^{- x}\)'
    answer: B
    hint: 'Try \(y=(x-2)e^{-x^2}\): it vanishes at \(x=2\).'
    explanation: '\(y''=e^{-x^2}-2x(x-2)e^{-x^2}=e^{-x^2}-2xy\).'
  9:
    topic: s9-1
    question: 'Solve \(2\sqrt{xy}\,\dfrac{dy}{dx}=1\) for \(x,y>0\).'
    A: '\(2 \sqrt{x} + \frac{4 y^{\frac{3}{2}}}{3}=C\)'
    B: '\(- 2 \sqrt{x} + \frac{4 y^{\frac{3}{2}}}{3}=C\)'
    C: '\(- 2 \sqrt{x} + \frac{2 y^{\frac{3}{2}}}{3}=C\)'
    D: '\(- 2 \sqrt{x} + \frac{4 \sqrt{y}}{3}=C\)'
    answer: B
    hint: 'Separate: \(2\sqrt y\,dy=\dfrac{dx}{\sqrt x}\).'
    explanation: '\(\dfrac43y^{3/2}=2\sqrt x+C\).'
  10:
    topic: s9-1
    question: 'Solve \(\dfrac{dy}{dx}=x^2\sqrt y\) for \(y>0\).'
    A: '\(y=\left(C + \frac{x^{3}}{3}\right)^{2}\)'
    B: '\(y=C + \frac{x^{3}}{3}\)'
    C: '\(y=\left(C + \frac{x^{3}}{6}\right)^{2}\)'
    D: '\(y=C + \frac{x^{3}}{6}\)'
    answer: C
    hint: 'Separate: \(\dfrac{dy}{\sqrt y}=x^2dx\).'
    explanation: '\(2\sqrt y=\dfrac{x^3}3+C\), so \(y=\left(\dfrac{x^3}6+C\right)^2\).'
  11:
    topic: s9-1
    question: 'Solve \(\dfrac{dy}{dx}=e^{x-y}\).'
    A: '\(y=C + e^{x}\)'
    B: '\(y=C + x\)'
    C: '\(y=\ln{\left(C + e^{x} \right)}\)'
    D: '\(y=\ln{\left(C + x \right)}\)'
    answer: C
    hint: '\(e^y\,dy=e^x\,dx\).'
    explanation: '\(e^y=e^x+C\), so \(y=\ln(e^x+C)\).'
  12:
    topic: s9-1
    question: 'Solve \(\dfrac{dy}{dx}=3x^2e^{-y}\).'
    A: '\(y=\ln{\left(C + x^{3} \right)}\)'
    B: '\(y=C + x^{3}\)'
    C: '\(y=3 \ln{\left(C + x^{2} \right)}\)'
    D: '\(y=C + \ln{\left(x^{3} \right)}\)'
    answer: A
    hint: '\(e^y\,dy=3x^2dx\).'
    explanation: '\(e^y=x^3+C\).'
  13:
    topic: s9-1
    question: 'Solve \(\dfrac{dy}{dx}=\sqrt y\cos^2\sqrt y\) for \(y>0\) (implicit form).'
    A: '\(- x + \tan{\left(\sqrt{y} \right)}=C\)'
    B: '\(- x + 2 \sqrt{y}=C\)'
    C: '\(- x + 2 \tan{\left(\sqrt{y} \right)}=C\)'
    D: '\(- x + 2 \tan{\left(y \right)}=C\)'
    answer: C
    hint: '\(\dfrac{dy}{\sqrt y\cos^2\sqrt y}=dx\); let \(u=\sqrt y\).'
    explanation: '\(\int\dfrac{dy}{\sqrt y\cos^2\sqrt y}=2\tan\sqrt y\), so \(2\tan\sqrt y=x+C\).'
  14:
    topic: s9-1
    question: 'Solve \(\sqrt x\,\dfrac{dy}{dx}=e^{y+\sqrt x}\) for \(x>0\) (implicit form).'
    A: '\(2 e^{\sqrt{x}} + e^{y}=C\)'
    B: '\(e^{\sqrt{x}} + e^{- y}=C\)'
    C: '\(- 2 e^{\sqrt{x}} + e^{- y}=C\)'
    D: '\(2 e^{\sqrt{x}} + e^{- y}=C\)'
    answer: D
    hint: '\(e^{-y}dy=\dfrac{e^{\sqrt x}}{\sqrt x}dx\).'
    explanation: '\(-e^{-y}=2e^{\sqrt x}+C\), so \(e^{-y}+2e^{\sqrt x}=C\).'
  15:
    topic: s9-1
    question: 'Solve \((\sec x)\,\dfrac{dy}{dx}=e^{y+\sin x}\) (implicit form).'
    A: '\(e^{y} + e^{\sin{\left(x \right)}}=C\)'
    B: '\(e^{\sin{\left(x \right)}} + e^{- y}=C\)'
    C: '\(- e^{\sin{\left(x \right)}} + e^{- y}=C\)'
    D: '\(\sin{\left(x \right)} + e^{- y}=C\)'
    answer: B
    hint: '\(e^{-y}dy=e^{\sin x}\cos x\,dx\).'
    explanation: '\(-e^{-y}=e^{\sin x}+C\).'
  16:
    topic: s9-1
    question: 'Solve \(\dfrac{dy}{dx}=2x\sqrt{1-y^2}\) for \(-1<y<1\) (implicit form).'
    A: '\(- x + \sin^{-1}{\left(y \right)}=C\)'
    B: '\(- x^{2} + \cos^{-1}{\left(y \right)}=C\)'
    C: '\(- x^{2} + y=C\)'
    D: '\(- x^{2} + \sin^{-1}{\left(y \right)}=C\)'
    answer: D
    hint: '\(\dfrac{dy}{\sqrt{1-y^2}}=2x\,dx\).'
    explanation: '\(\sin^{-1}y=x^2+C\), i.e. \(y=\sin(x^2+C)\).'
  17:
    topic: s9-1
    question: 'Solve \(\dfrac{dy}{dx}=\dfrac{e^{2x-y}}{e^{x+y}}\).'
    A: '\(y=\ln{\left(C + 2 e^{x} \right)}\)'
    B: '\(y=C + e^{x}\)'
    C: '\(y=\frac{\ln{\left(C + e^{x} \right)}}{2}\)'
    D: '\(y=\frac{\ln{\left(C + 2 e^{x} \right)}}{2}\)'
    answer: D
    hint: 'Simplify: \(\dfrac{dy}{dx}=e^{x-2y}\); then \(e^{2y}dy=e^xdx\).'
    explanation: '\(\dfrac12e^{2y}=e^x+C\), so \(y=\tfrac12\ln(2e^x+C)\).'
  18:
    topic: s9-1
    question: 'For the equation \(y''=y+1\), the slope is zero along'
    A: 'the \(x\)-axis'
    B: 'the vertical line \(x=-1\)'
    C: 'the line \(y=x\)'
    D: 'the horizontal line \(y=-1\)'
    answer: D
    hint: 'Slope field segments are flat where \(y''=0\).'
    explanation: 'The right side depends only on \(y\) and vanishes when \(y=-1\).'
  19:
    topic: s9-1
    question: 'For the equation \(y''=x+y\), the slope field has horizontal segments along'
    A: 'the \(x\)-axis only'
    B: 'the line \(y=-x\)'
    C: 'the line \(y=1\)'
    D: 'the line \(y=x\)'
    answer: B
    hint: 'Set \(x+y=0\).'
    explanation: 'On \(y=-x\) the slope is \(0\); the slope is positive above this line.'
  20:
    topic: s9-1
    question: 'The slope field of \(y''=-\dfrac xy\) looks like'
    A: parallel straight lines
    B: exponential curves
    C: a family of parabolas opening upward
    D: concentric circles (the solution curves are circles about the origin)
    answer: D
    hint: 'Separate: \(y\,dy=-x\,dx\).'
    explanation: '\(x^2+y^2=C\).'
  21:
    topic: s9-1
    question: 'In the slope field of \(y''=y^2-x^2\), the segments are horizontal along'
    A: 'the line \(y=0\) only'
    B: 'the \(x\)-axis only'
    C: the unit circle
    D: 'the lines \(y=x\) and \(y=-x\)'
    answer: D
    hint: 'Set \(y^2-x^2=0\).'
    explanation: '\((y-x)(y+x)=0\).'
  22:
    topic: s9-1
    question: 'The equilibrium solutions of \(y''=(y+2)(y-2)\) are'
    A: '\(y=-2\) only'
    B: '\(y=-2\) and \(y=2\)'
    C: '\(y=\pm4\)'
    D: '\(y=0\)'
    answer: B
    hint: 'Constant solutions satisfy \(y''=0\).'
    explanation: 'The factors are zero at \(y=\pm2\).'
  23:
    topic: s9-1
    question: 'The equilibrium solutions of \(y''=y(y+1)(y-1)\) are'
    A: '\(y=0\) only'
    B: '\(y=-1\) and \(1\) only'
    C: '\(y=-1,\ 0,\ 1\)'
    D: '\(y=0\) and \(1\) only'
    answer: C
    hint: Set each factor equal to zero.
    explanation: 'The three horizontal solutions are \(y=-1,0,1\).'
  24:
    topic: s9-1
    question: 'The solution of \(y''=y\) through \((0,1)\) is'
    A: '\(y=2 e^{x}\)'
    B: '\(y=x + 1\)'
    C: '\(y=e^{x}\)'
    D: '\(y=e^{- x}\)'
    answer: C
    hint: 'Separate and integrate: \(\ln|y|=x+C\).'
    explanation: '\(y=Ce^x\) with \(C=1\).'
  25:
    topic: s9-1
    question: 'The solution of \(y''=2(y-4)\) through \((0,1)\) is'
    A: '\(y=1 - 3 e^{2 x}\)'
    B: '\(y=4 - 3 e^{- 2 x}\)'
    C: '\(y=3 e^{2 x} + 4\)'
    D: '\(y=4 - 3 e^{2 x}\)'
    answer: D
    hint: '\(y-4=Ce^{2x}\).'
    explanation: '\(1-4=C\), so \(y=4-3e^{2x}\).'
  26:
    topic: s9-1
    question: 'The solution of \(y''=y^2\) through \((0,1)\) is'
    A: '\(y=- \frac{1}{x + 1}\)'
    B: '\(y=\frac{1}{1 - x}\)'
    C: '\(y=e^{x}\)'
    D: '\(y=\frac{1}{x + 1}\)'
    answer: B
    hint: '\(-\dfrac1y=x+C\).'
    explanation: '\(C=-1\) gives \(y=\dfrac1{1-x}\), which blows up at \(x=1\).'
  27:
    topic: s9-1
    question: 'The solution of \(y''=(y-1)(x+2)\) through \((0,3)\) is'
    A: '\(y=2 e^{\frac{x^{2}}{2}} + 1\)'
    B: '\(y=2 e^{x^{2} + 2 x} + 1\)'
    C: '\(y=3 e^{\frac{x^{2}}{2} + 2 x}\)'
    D: '\(y=2 e^{\frac{x^{2}}{2} + 2 x} + 1\)'
    answer: D
    hint: '\(\dfrac{dy}{y-1}=(x+2)dx\).'
    explanation: '\(\ln|y-1|=\tfrac{x^2}2+2x+C\); \(y(0)=3\) gives \(e^C=2\).'
  28:
    topic: s9-1
    question: 'The solution of \(y''=\dfrac{xy}{x^2+4}\) through \((0,2)\) is'
    A: '\(y=\frac{\sqrt{x^{2} + 4}}{2}\)'
    B: '\(y=2 \sqrt{x^{2} + 4}\)'
    C: '\(y=\sqrt{x^{2} + 4}\)'
    D: '\(y=x^{2} + 4\)'
    answer: C
    hint: '\(\dfrac{dy}{y}=\dfrac{x\,dx}{x^2+4}\).'
    explanation: '\(\ln|y|=\tfrac12\ln(x^2+4)+C\); \(y(0)=2\) gives \(y=\sqrt{x^2+4}\).'
  29:
    topic: s9-1
    question: 'The logistic problem \(y''=y(2-y)\), \(y(0)=\tfrac12\) has solution'
    A: '\(y=\frac{2}{1 + e^{- 2 x}}\)'
    B: '\(y=\frac{2}{1 + 3 e^{- 2 x}}\)'
    C: '\(y=\frac{1}{1 + 3 e^{- 2 x}}\)'
    D: '\(y=\frac{2}{1 + 3 e^{- x}}\)'
    answer: B
    hint: 'Logistic form \(y=\dfrac{2}{1+Ae^{-2x}}\).'
    explanation: '\(y(0)=\tfrac2{1+A}=\tfrac12\) gives \(A=3\).'
  30:
    topic: s9-1
    question: 'For \(y''=(\sin x)(\sin y)\), \(y(0)=2\), separating variables gives'
    A: '\(\tan\dfrac y2=\sin x+C\)'
    B: '\(\ln|\sin y|=-\cos x+C\)'
    C: '\(\ln\left|\tan\dfrac y2\right|=-\cos x+C\)'
    D: '\(\ln\left|\tan\dfrac y2\right|=\cos x+C\)'
    answer: C
    hint: '\(\csc y\,dy=\sin x\,dx\) and \(\int\csc y\,dy=\ln\left|\tan\tfrac y2\right|\).'
    explanation: '\(\int\sin x\,dx=-\cos x\).'
  31:
    topic: s9-1
    question: 'Using \(y''+y=f(x)\), \(y(0)=0\) with \(f(x)=2x\), the solution is'
    A: '\(y=2x-2-2e^{-x}\)'
    B: '\(y=2x+2-2e^{-x}\)'
    C: '\(y=2x-2+2e^{-x}\)'
    D: '\(y=x^2\)'
    answer: C
    hint: 'Integrating factor \(e^x\): \((ye^x)''=2xe^x\).'
    explanation: '\(ye^x=2(x-1)e^x+C\), and \(y(0)=0\) gives \(C=2\).'
  32:
    topic: s9-1
    question: 'Using \(y''+y=f(x)\), \(y(0)=0\) with \(f(x)=3e^{x/2}\), the solution is'
    A: '\(y=e^{x/2}-e^{-x}\)'
    B: '\(y=2e^{x/2}-2e^{-x}\)'
    C: '\(y=3e^{x/2}-3e^{-x}\)'
    D: '\(y=2e^{x/2}+2e^{-x}\)'
    answer: B
    hint: 'Integrating factor \(e^x\): \((ye^x)''=3e^{3x/2}\).'
    explanation: '\(ye^x=2e^{3x/2}+C\), and \(y(0)=0\) gives \(C=-2\).'
  33:
    topic: s9-1
    question: 'The differential equation \(y''=\dfrac{3x^2+4x+2}{2(y-1)}\) has implicit general solution'
    A: '\((y-1)^2=x^3+2x^2+2x+C\)'
    B: '\((y-1)^2=3x^2+4x+2+C\)'
    C: '\(y-1=x^3+2x^2+2x+C\)'
    D: '\((y-1)^2=2\left(x^3+2x^2+2x\right)+C\)'
    answer: A
    hint: '\(2(y-1)\,dy=\left(3x^2+4x+2\right)dx\).'
    explanation: Integrate both sides.
  34:
    topic: s9-1
    question: 'For that equation with \(y(0)=-1\), the solution is'
    A: '\(y=1-\sqrt{x^3+2x^2+2x+2}\)'
    B: '\(y=-1-\sqrt{x^3+2x^2+2x}\)'
    C: '\(y=1+\sqrt{x^3+2x^2+2x+4}\)'
    D: '\(y=1-\sqrt{x^3+2x^2+2x+4}\)'
    answer: D
    hint: 'The constant: \((-1-1)^2=0+C\).'
    explanation: '\(C=4\), and the sign is chosen so that \(y(0)=1-2=-1\).'
  35:
    topic: s9-2
    question: 'Solve \(x\dfrac{dy}{dx}+y=e^x\), \(x>0\).'
    A: '\(y=\frac{C}{x} + e^{x}\)'
    B: '\(y=x \left(C + e^{x}\right)\)'
    C: '\(y=\frac{C + e^{x}}{x}\)'
    D: '\(y=1 + \frac{- C + e^{x}}{x}\)'
    answer: C
    hint: 'The left side is \((xy)''\).'
    explanation: '\(xy=e^x+C\).'
  36:
    topic: s9-2
    question: 'Solve \(e^x\dfrac{dy}{dx}+2e^xy=1\).'
    A: '\(y=C e^{- 2 x} + 1\)'
    B: '\(y=C e^{- 2 x} + e^{- x}\)'
    C: '\(y=C e^{2 x} + e^{- x}\)'
    D: '\(y=C + e^{- x}\)'
    answer: B
    hint: 'Divide by \(e^x\): \(y''+2y=e^{-x}\); integrating factor \(e^{2x}\).'
    explanation: '\((ye^{2x})''=e^{x}\), so \(ye^{2x}=e^x+C\).'
  37:
    topic: s9-2
    question: 'Solve \(xy''+3y=\dfrac{\sin x}{x^2}\), \(x>0\).'
    A: '\(y=\frac{C - \cos{\left(x \right)}}{x^{3}}\)'
    B: '\(y=\frac{C + \cos{\left(x \right)}}{x^{3}}\)'
    C: '\(y=\frac{C - \cos{\left(x \right)}}{x^{2}}\)'
    D: '\(y=\frac{C - \sin{\left(x \right)}}{x^{3}}\)'
    answer: A
    hint: 'Integrating factor \(x^3\): \((x^3y)''=\sin x\).'
    explanation: '\(x^3y=-\cos x+C\).'
  38:
    topic: s9-2
    question: 'Solve \(y''+(\tan x)y=\cos^2x\), \(-\tfrac\pi2<x<\tfrac\pi2\).'
    A: '\(y=\left(C + \cos{\left(x \right)}\right) \sin{\left(x \right)}\)'
    B: '\(y=\left(C + \cos{\left(x \right)}\right) \cos{\left(x \right)}\)'
    C: '\(y=C \sin{\left(x \right)} + \cos{\left(x \right)}\)'
    D: '\(y=\left(C + \sin{\left(x \right)}\right) \cos{\left(x \right)}\)'
    answer: D
    hint: 'Integrating factor \(e^{\int\tan x\,dx}=\sec x\).'
    explanation: '\((y\sec x)''=\cos x\), so \(y\sec x=\sin x+C\).'
  39:
    topic: s9-2
    question: 'Solve \(x\dfrac{dy}{dx}+2y=1-\dfrac1x\), \(x>0\).'
    A: '\(y=\frac{C}{x} + \frac{1}{2} - \frac{1}{x}\)'
    B: '\(y=\frac{C}{x^{2}} + 1 - \frac{1}{x}\)'
    C: '\(y=\frac{C}{x^{2}} + \frac{1}{2} + \frac{1}{x}\)'
    D: '\(y=\frac{C}{x^{2}} + \frac{1}{2} - \frac{1}{x}\)'
    answer: D
    hint: 'Integrating factor \(x^2\): \((x^2y)''=x-1\).'
    explanation: '\(x^2y=\tfrac{x^2}2-x+C\).'
  40:
    topic: s9-2
    question: 'Solve \((1+x)y''+y=\sqrt x\).'
    A: '\(y=\left(C + \frac{2 x^{\frac{3}{2}}}{3}\right) \left(x + 1\right)\)'
    B: '\(y=\frac{C + \frac{2 x^{\frac{3}{2}}}{3}}{x + 1}\)'
    C: '\(y=\frac{C + \frac{x^{\frac{3}{2}}}{3}}{x + 1}\)'
    D: '\(y=\frac{C}{x + 1} + \frac{2 x^{\frac{3}{2}}}{3}\)'
    answer: B
    hint: 'The left side is \(((1+x)y)''\).'
    explanation: '\((1+x)y=\int\sqrt x\,dx=\tfrac23x^{3/2}+C\).'
  41:
    topic: s9-2
    question: 'Solve \(2y''=e^{x/2}+y\).'
    A: '\(y=C e^{- \frac{x}{2}} + \frac{x e^{\frac{x}{2}}}{2}\)'
    B: '\(y=C e^{\frac{x}{2}} + \frac{e^{\frac{x}{2}}}{2}\)'
    C: '\(y=C e^{\frac{x}{2}} + x e^{\frac{x}{2}}\)'
    D: '\(y=C e^{\frac{x}{2}} + \frac{x e^{\frac{x}{2}}}{2}\)'
    answer: D
