    hint: 'Equilibria are zeros of \(f\); stable if \(f\) changes from \(+\) to \(-\), unstable if from \(-\) to \(+\).'
    explanation: 'Signs of \(f\) around each zero: \(0\) is unstable; \(\frac{1}{2}\) is stable.'
  127:
    topic: s9-4
    question: 'Classify the equilibrium values of \(\dfrac{dP}{dt}=2P(P-3)\).'
    A: '\(0\): stable; \(3\): stable'
    B: '\(0\): unstable; \(3\): unstable'
    C: '\(0\): unstable; \(3\): stable'
    D: '\(0\): stable; \(3\): unstable'
    answer: D
    hint: 'Equilibria are zeros of \(f\); stable if \(f\) changes from \(+\) to \(-\), unstable if from \(-\) to \(+\).'
    explanation: 'Signs of \(f\) around each zero: \(0\) is stable; \(3\) is unstable.'
  128:
    topic: s9-4
    question: 'Classify the equilibrium values of \(\dfrac{dP}{dt}=3P(1-P)\left(P-\tfrac12\right)\).'
    A: '\(0\): unstable; \(\frac{1}{2}\): unstable; \(1\): stable'
    B: '\(0\): unstable; \(\frac{1}{2}\): stable; \(1\): unstable'
    C: '\(0\): stable; \(\frac{1}{2}\): unstable; \(1\): stable'
    D: '\(0\): stable; \(\frac{1}{2}\): unstable; \(1\): unstable'
    answer: C
    hint: 'Equilibria are zeros of \(f\); stable if \(f\) changes from \(+\) to \(-\), unstable if from \(-\) to \(+\).'
    explanation: 'Signs of \(f\) around each zero: \(0\) is stable; \(\frac{1}{2}\) is unstable; \(1\) is stable.'
  129:
    topic: s9-4
    question: 'In the logistic model \(\dfrac{dP}{dt}=rP(M-P)\), the population grows fastest when'
    A: '\(P=\dfrac M4\)'
    B: '\(P=0\)'
    C: '\(P=\dfrac M2\)'
    D: '\(P=M\)'
    answer: C
    hint: 'The growth rate \(rP(M-P)\) is a downward parabola in \(P\).'
    explanation: 'Its vertex is at \(P=M/2\), which is also where the solution curves have inflection points.'
  130:
    topic: s9-4
    question: 'For \(\dfrac{dP}{dt}=rP(M-P)(P-m)\) with \(0<m<M\), the equilibria are'
    A: '\(0\) (unstable), \(m\) (stable), \(M\) (unstable)'
    B: '\(0\) (stable), \(m\) (unstable), \(M\) (stable)'
    C: '\(0\) (stable), \(m\) (stable), \(M\) (unstable)'
    D: '\(m\) (unstable) and \(M\) (stable) only'
    answer: B
    hint: 'Check the sign of \(rP(M-P)(P-m)\) in each interval.'
    explanation: 'Negative for \(0<P<m\), positive for \(m<P<M\), negative for \(P>M\).'
  131:
    topic: s9-4
    question: 'In the deer model \(\dfrac{dP}{dt}=rP(M-P)(P-m)\), if the population ever falls below \(m\) then'
    A: it stays constant
    B: 'the population decreases toward \(0\) (extinction)'
    C: 'it oscillates about \(m\)'
    D: 'it recovers to \(M\)'
    answer: B
    hint: 'For \(0<P<m\), \(\dfrac{dP}{dt}<0\).'
    explanation: 'So \(m\) acts as a threshold for survival.'
  132:
    topic: s9-4
    question: 'In the deer model, if \(P>M\) for all \(t\) then \(\displaystyle\lim_{t\to\infty}P(t)=\)'
    A: '\(0\)'
    B: '\(M\)'
    C: '\(\infty\)'
    D: '\(m\)'
    answer: B
    hint: 'For \(P>M\), \(\dfrac{dP}{dt}<0\), and \(M\) is a stable equilibrium.'
    explanation: 'The solution is decreasing and bounded below by \(M\), so it tends to \(M\).'
  133:
    topic: s9-4
    question: 'A 160-lb skydiver (\(mg=160\)) falls with \(m\dfrac{dv}{dt}=mg-kv^2\), \(k=0.005\). The terminal velocity (ft/s, one decimal) is'
    A: '\(357.8\text{ ft/s}\)'
    B: '\(178.9\text{ ft/s}\)'
    C: '\(32{,}000\text{ ft/s}\)'
    D: '\(89.4\text{ ft/s}\)'
    answer: B
    hint: 'Terminal velocity is the stable equilibrium: set \(\dfrac{dv}{dt}=0\).'
    explanation: '\(v=\sqrt{mg/k}=\sqrt{160/0.005}=\sqrt{32000}\approx178.9\) ft/s.'
  134:
    topic: s9-4
    question: 'A body falling with air resistance proportional to \(\sqrt v\) satisfies \(m\dfrac{dv}{dt}=mg-k\sqrt v\). Its terminal velocity is'
    A: '\(\dfrac{k}{mg}\)'
    B: '\(\left(\dfrac{mg}k\right)^2\)'
    C: '\(\sqrt{\dfrac{mg}k}\)'
    D: '\(\dfrac{mg}k\)'
    answer: B
    hint: 'Set \(\dfrac{dv}{dt}=0\): \(k\sqrt v=mg\).'
    explanation: '\(\sqrt v=\dfrac{mg}k\), so \(v=\left(\dfrac{mg}k\right)^2\).'
  135:
    topic: s9-4
    question: 'A sailboat is pushed by a constant 50-lb wind force; water resistance is 5 times the speed (\(m\dfrac{dv}{dt}=50-5v\)). The maximum velocity is'
    A: '\(5\) ft/s'
    B: '\(50\) ft/s'
    C: '\(10\) ft/s'
    D: '\(250\) ft/s'
    answer: C
    hint: 'Maximum velocity is the equilibrium \(\dfrac{dv}{dt}=0\).'
    explanation: '\(50-5v=0\) gives \(v=10\).'
  136:
    topic: s9-4
    question: 'In the social diffusion model \(\dfrac{dX}{dt}=kX(N-X)\), information spreads fastest when'
    A: '\(X=\dfrac N4\)'
    B: '\(X=\dfrac N2\)'
    C: '\(X=0\)'
    D: '\(X=N\)'
    answer: B
    hint: 'The rate \(kX(N-X)\) is largest at the vertex of the parabola.'
    explanation: 'Eventually everyone (\(N\) people) receives the information, since \(X=N\) is stable.'
  137:
    topic: s9-4
    question: 'In an RL circuit \(L\dfrac{di}{dt}+Ri=V\) closed at \(t=0\), the steady-state current (as \(t\to\infty\)) is'
    A: '\(\dfrac VL\)'
    B: '\(0\)'
    C: '\(\dfrac VR\)'
    D: '\(VR\)'
    answer: C
    hint: 'The steady state is the equilibrium \(\dfrac{di}{dt}=0\).'
    explanation: '\(Ri=V\).'
  138:
    topic: s9-4
    question: 'A pearl sinking in shampoo obeys \(m\dfrac{dv}{dt}=mg-Pg-kv\) (weight minus buoyancy minus friction). Its terminal velocity is'
    A: '\(\dfrac{mg}k\)'
    B: '\(\dfrac{(m+P)g}k\)'
    C: '\(\dfrac{(m-P)g}k\)'
    D: '\(\dfrac{k}{(m-P)g}\)'
    answer: C
    hint: 'Set \(\dfrac{dv}{dt}=0\).'
    explanation: '\(kv=(m-P)g\).'
  139:
    topic: s9-4
    question: 'For the autonomous equation \(\dfrac{dy}{dx}=f(y)\), the solution curves through different points on the same horizontal line are'
    A: 'identical in slope (the slope depends only on \(y\)), and each is a horizontal translate of the others'
    B: always periodic
    C: 'parallel in the \(y\)-direction'
    D: always straight lines
    answer: A
    hint: 'The right side contains no \(x\).'
    explanation: 'If \(y(x)\) is a solution, so is \(y(x-c)\).'
  140:
    topic: s9-5
    question: 'A 66-kg cyclist on a 7-kg bicycle coasts from 9 m/s with \(k=3.9\) kg/s (\(m\dfrac{dv}{dt}=-kv\)). The distance coasted before stopping (m, one decimal) is'
    A: '\(35.1\text{ m}\)'
    B: '\(84.2\text{ m}\)'
    C: '\(336.9\text{ m}\)'
    D: '\(168.5\text{ m}\)'
    answer: D
    hint: '\(s(\infty)=\dfrac{mv_0}k\).'
    explanation: '\(\dfrac{73\cdot9}{3.9}\approx168.5\) m.'
  141:
    topic: s9-5
    question: For the same cyclist, the time (s, one decimal) for the speed to drop to 1 m/s is
    A: '\(82.2\text{ s}\)'
    B: '\(41.1\text{ s}\)'
    C: '\(18.7\text{ s}\)'
    D: '\(9.4\text{ s}\)'
    answer: B
    hint: '\(v=v_0e^{-kt/m}\).'
    explanation: '\(t=\dfrac mk\ln9=\dfrac{73}{3.9}\ln9\approx41.1\) s.'
  142:
    topic: s9-5
    question: 'An Iowa-class battleship (\(m=51{,}000{,}000\) kg, \(k=59{,}000\) kg/s) loses power at 9 m/s. The distance it coasts (m, nearest metre) is'
    A: '\(3{,}890\text{ m}\)'
    B: '\(15{,}560\text{ m}\)'
    C: '\(864\text{ m}\)'
    D: '\(7{,}780\text{ m}\)'
    answer: D
    hint: '\(\dfrac{mv_0}k\).'
    explanation: '\(\dfrac{51\times10^6\cdot9}{59000}\approx7780\) m.'
  143:
    topic: s9-5
    question: For the same battleship, the time (s, nearest second) for its speed to fall to 1 m/s is
    A: '\(950\text{ s}\)'
    B: '\(1{,}899\text{ s}\)'
    C: '\(864\text{ s}\)'
    D: '\(3{,}800\text{ s}\)'
    answer: B
    hint: '\(t=\dfrac mk\ln\dfrac{v_0}{v}\).'
    explanation: '\(\dfrac{51\times10^6}{59000}\ln9\approx1899\) s.'
  144:
    topic: s9-5
    question: 'When a skater of mass \(m\) coasts with initial velocity \(v_0\) and resistance \(-kv\), her distance from the start is'
    A: '\(s(t)=\dfrac{mv_0}ke^{-kt/m}\)'
    B: '\(s(t)=\dfrac{mv_0}k\left(1-e^{-kt/m}\right)\)'
    C: '\(s(t)=v_0\left(1-e^{-kt/m}\right)\)'
    D: '\(s(t)=\dfrac{kv_0}m\left(1-e^{-kt/m}\right)\)'
    answer: B
    hint: 'Integrate \(v=v_0e^{-kt/m}\) from \(0\) to \(t\).'
    explanation: '\(s=\dfrac{mv_0}k\left(1-e^{-kt/m}\right)\), approaching \(\dfrac{mv_0}k\).'
  145:
    topic: s9-5
    question: 'Ashley Sharritts coasted a total of 4.91 m with \(m=39.92\) kg and \(v_0=2.75\) m/s. The value of \(k\) (kg/s, one decimal) from \(s(\infty)=\dfrac{mv_0}k\) is'
    A: '\(8.1\text{ kg/s}\)'
    B: '\(11.2\text{ kg/s}\)'
    C: '\(44.7\text{ kg/s}\)'
    D: '\(22.4\text{ kg/s}\)'
    answer: D
    hint: '\(k=\dfrac{mv_0}{s_{\max}}\).'
    explanation: '\(\dfrac{39.92\cdot2.75}{4.91}\approx22.4\).'
  146:
    topic: s9-5
    question: 'Kelly Schmitzer coasted 1.32 m with \(m=49.90\) kg and \(v_0=0.80\) m/s. Then \(k\) (kg/s, one decimal) is'
    A: '\(62.4\text{ kg/s}\)'
    B: '\(60.5\text{ kg/s}\)'
    C: '\(30.2\text{ kg/s}\)'
    D: '\(15.1\text{ kg/s}\)'
    answer: C
    hint: '\(k=\dfrac{mv_0}{s_{\max}}\).'
    explanation: '\(\dfrac{49.9\cdot0.8}{1.32}\approx30.2\).'
  147:
    topic: s9-5
    question: 'A tank supports at most 150 guppies; 6 are introduced; \(\dfrac{dP}{dt}=0.0015(150-P)P\) (weeks). The population is'
    A: '\(P=\dfrac{150}{1+25e^{-0.225t}}\)'
    B: '\(P=\dfrac{6}{1+24e^{-0.225t}}\)'
    C: '\(P=\dfrac{150}{1+24e^{-0.0015t}}\)'
    D: '\(P=\dfrac{150}{1+24e^{-0.225t}}\)'
    answer: D
    hint: 'Logistic: \(P=\dfrac M{1+Ae^{-rMt}}\) with \(rM=0.0015\cdot150=0.225\).'
    explanation: '\(A=\dfrac{150-6}6=24\).'
  148:
    topic: s9-5
    question: For the guppy tank, the time (weeks, one decimal) for the population to reach 100 is
    A: '\(21.3\text{ weeks}\)'
    B: '\(17.2\text{ weeks}\)'
    C: '\(8.6\text{ weeks}\)'
    D: '\(34.4\text{ weeks}\)'
    answer: B
    hint: 'Set \(\dfrac{150}{1+24e^{-0.225t}}=100\).'
    explanation: '\(24e^{-0.225t}=\tfrac12\), so \(t=\dfrac{\ln48}{0.225}\approx17.2\).'
  149:
    topic: s9-5
    question: For the guppy tank, the time (weeks, one decimal) for the population to reach 125 is
    A: '\(21.3\text{ weeks}\)'
    B: '\(17.2\text{ weeks}\)'
    C: '\(10.6\text{ weeks}\)'
    D: '\(42.6\text{ weeks}\)'
    answer: A
    hint: 'Set \(\dfrac{150}{1+24e^{-0.225t}}=125\).'
    explanation: '\(24e^{-0.225t}=0.2\), so \(t=\dfrac{\ln120}{0.225}\approx21.3\).'
  150:
    topic: s9-5
    question: 'A preserve supports at most 250 gorillas; 28 were present in 1970; \(\dfrac{dP}{dt}=0.0004(250-P)P\). The population is'
    A: '\(P=\dfrac{250}{1+8e^{-0.1t}}\)'
    B: '\(P=\dfrac{250}{1+\frac{111}{14}e^{-0.0004t}}\)'
    C: '\(P=\dfrac{28}{1+\frac{111}{14}e^{-0.1t}}\)'
    D: '\(P=\dfrac{250}{1+\frac{111}{14}e^{-0.1t}}\)'
    answer: D
    hint: '\(rM=0.0004\cdot250=0.1\) and \(A=\dfrac{250-28}{28}\).'
    explanation: '\(A=\dfrac{222}{28}=\dfrac{111}{14}\approx7.93\).'
  151:
    topic: s9-5
    question: In that preserve, the time (years, one decimal) for the population to reach half the carrying capacity (125) is
    A: '\(20.7\text{ years}\)'
    B: '\(41.4\text{ years}\)'
    C: '\(79.3\text{ years}\)'
    D: '\(10.4\text{ years}\)'
    answer: A
    hint: 'At \(P=M/2\), \(Ae^{-rMt}=1\).'
    explanation: '\(t=\dfrac{\ln(111/14)}{0.1}\approx20.7\) years.'
  152:
    topic: s9-5
    question: 'In a logistic model \(\dfrac{dP}{dt}=rP(M-P)\), the population never actually reaches \(M\) in finite time because'
    A: the growth rate becomes negative
    B: '\(P\) is not differentiable at \(M\)'
    C: '\(M\) is unstable'
    D: '\(M\) is an equilibrium, and solutions cannot cross equilibria'
    answer: D
    hint: Uniqueness of solutions.
    explanation: 'The solution approaches \(M\) asymptotically.'
  153:
    topic: s9-5
    question: 'The halibut fishery: \(\dfrac{dy}{dt}=r(M-y)y\), \(M=8\times10^7\) kg, \(r=0.08875\times10^{-7}\)/yr. If \(y(0)=1.6\times10^7\) kg, the weight after 1 year (in millions of kg, two decimals) is'
    A: '\(24\text{ million kg}\)'
    B: '\(16.93\text{ million kg}\)'
    C: '\(32\text{ million kg}\)'
    D: '\(16\text{ million kg}\)'
    answer: B
    hint: '\(y=\dfrac M{1+Ae^{-rMt}}\) with \(rM=0.071\) and \(A=\dfrac{M-y_0}{y_0}=4\).'
    explanation: '\(y(1)=\dfrac{80}{1+4e^{-0.071}}\approx16.93\) million kg.'
  154:
    topic: s9-5
    question: 'For that fishery, the time (years, one decimal) when the weight reaches \(4\times10^7\) kg is'
    A: '\(9.8\text{ years}\)'
    B: '\(19.5\text{ years}\)'
    C: '\(39\text{ years}\)'
    D: '\(14\text{ years}\)'
    answer: B
    hint: 'Half of \(M\): \(Ae^{-rMt}=1\).'
    explanation: '\(t=\dfrac{\ln4}{0.071}\approx19.5\) years.'
  155:
    topic: s9-5
    question: 'For \(\dfrac{dP}{dt}=0.001(100-P)P-c\) with \(c=1\), the equilibrium values (to two decimals) are'
    A: '\(P\approx5.00\) and \(P\approx95.00\)'
    B: '\(P\approx0\) and \(P=100\)'
    C: '\(P\approx11.27\) and \(P\approx88.73\)'
    D: '\(P\approx11.27\) only'
    answer: C
    hint: 'Set \(0.001(100-P)P=1\), i.e. \(P^2-100P+1000=0\).'
    explanation: '\(P=\dfrac{100\pm\sqrt{6000}}2\approx11.27,\ 88.73\).'
  156:
    topic: s9-5
    question: 'In the modified logistic model \(\dfrac{dP}{dt}=0.001(100-P)P-c\), the constant \(c\) represents'
    A: a constant harvesting (or hunting) rate
    B: the carrying capacity
    C: the initial population
    D: the birth rate
    answer: A
    hint: It is subtracted from the growth rate.
    explanation: 'Population is removed at \(c\) units per time.'
  157:
    topic: s9-5
    question: 'The exact solution of \(y''=1+y\), \(y(0)=1\) is'
    A: '\(y=2 e^{x} + 1\)'
    B: '\(y=2 e^{x} - 1\)'
    C: '\(y=e^{x}\)'
    D: '\(y=e^{x} - 0.5\)'
    answer: B
    hint: 'Let \(u=1+y\).'
    explanation: '\(1+y=2e^x\).'
  158:
    topic: s9-5
    question: 'The exact solution of \(y''=0.5(400-y)y\), \(y(0)=2\) is'
    A: '\(y=\frac{2}{1 + 199 e^{- 200 x}}\)'
    B: '\(y=\frac{400}{1 + 199 e^{- \frac{x}{2}}}\)'
    C: '\(y=\frac{400}{1 + 200 e^{- 200 x}}\)'
    D: '\(y=\frac{400}{1 + 199 e^{- 200 x}}\)'
    answer: D
    hint: 'Logistic with \(M=400\), \(rM=200\).'
    explanation: '\(A=\dfrac{400-2}2=199\).'
  159:
    topic: s9-5
    question: 'The logistic equation \(\dfrac{dP}{dt}=r(M-P)P\) has general solution'
    A: '\(P=\dfrac M{1+Ae^{-rMt}}\)'
    B: '\(P=\dfrac{1+Ae^{-rMt}}{M}\)'
    C: '\(P=\dfrac M{1+Ae^{-rt}}\)'
    D: '\(P=M\left(1-Ae^{-rMt}\right)\)'
    answer: A
    hint: 'Use partial fractions: \(\dfrac1{P(M-P)}=\dfrac1M\left(\dfrac1P+\dfrac1{M-P}\right)\).'
    explanation: '\(\ln\left|\dfrac P{M-P}\right|=rMt+C\).'
  160:
    topic: s9-5
    question: 'The solution of \(\dfrac{dP}{dt}=kP^2\), \(P(0)=P_0>0\), is \(P=\dfrac{P_0}{1-kP_0t}\), which'
    A: 'tends to \(0\) as \(t\to\infty\)'
    B: 'blows up (has a vertical asymptote) at \(t=\dfrac1{kP_0}\)'
    C: 'blows up at \(t=\dfrac{k}{P_0}\)'
    D: 'is bounded for all \(t>0\)'
    answer: B
    hint: The denominator vanishes at a positive time.
    explanation: '\(1-kP_0t=0\) gives \(t=\dfrac1{kP_0}\).'
  161:
    topic: s9-5
    question: 'For \(\dfrac{dP}{dt}=r(M-P)(P-m)\) with \(m=100\), \(M=1200\), the equation separates as \(\left[\dfrac1{1200-P}+\dfrac1{P-100}\right]dP=\)'
    A: '\(100r\,dt\)'
    B: '\(1100r\,dt\)'
    C: '\(1300r\,dt\)'
    D: '\(r\,dt\)'
    answer: B
    hint: '\(\dfrac1{(M-P)(P-m)}=\dfrac1{M-m}\left(\dfrac1{M-P}+\dfrac1{P-m}\right)\).'
    explanation: 'Multiply \(\dfrac{dP}{(M-P)(P-m)}=r\,dt\) by \(M-m=1100\).'
  162:
    topic: s9-5
    question: 'With \(m=100\), \(M=1200\) and \(P(0)=300\), the solution of that equation satisfies'
    A: '\(\dfrac{P-100}{1200-P}=\dfrac29e^{-1100rt}\)'
    B: '\(\dfrac{P-100}{1200-P}=\dfrac29e^{1100rt}\)'
    C: '\(\dfrac{P-100}{1200-P}=\dfrac92e^{1100rt}\)'
    D: '\(\dfrac{1200-P}{P-100}=\dfrac29e^{1100rt}\)'
    answer: B
    hint: 'Integrate: \(\ln\left|\dfrac{P-100}{1200-P}\right|=1100rt+C\).'
    explanation: 'At \(t=0\): \(\dfrac{200}{900}=\dfrac29\).'
  163:
    topic: s9-5
    question: 'The orthogonal trajectories of the family \(y=mx\) are'
    A: 'the hyperbolas \(xy=c\)'
    B: 'the parabolas \(y=cx^2\)'
    C: 'the circles \(x^2+y^2=c\)'
    D: 'the lines \(y=cx\)'
    answer: C
    hint: 'The slope of the family is \(\dfrac yx\); orthogonal slope is \(-\dfrac xy\).'
    explanation: '\(y\,dy=-x\,dx\) gives \(x^2+y^2=c\).'
  164:
    topic: s9-5
    question: 'The orthogonal trajectories of \(y=cx^2\) are'
    A: 'the ellipses \(2x^2+y^2=k\)'
    B: 'the ellipses \(x^2+2y^2=k\)'
    C: 'the circles \(x^2+y^2=k\)'
    D: 'the parabolas \(y=kx^2\)'
    answer: B
    hint: 'Eliminate \(c\): \(y''=\dfrac{2y}x\); orthogonal slope is \(-\dfrac x{2y}\).'
    explanation: '\(2y\,dy=-x\,dx\) gives \(x^2+2y^2=k\).'
  165:
    topic: s9-5
    question: 'The orthogonal trajectories of \(2x^2+y^2=c^2\) are'
    A: 'the parabolas \(y^2=Cx\)'
    B: 'the lines \(y=Cx\)'
    C: 'the parabolas \(x^2=Cy\)'
    D: 'the circles \(x^2+y^2=C\)'
    answer: A
    hint: 'Differentiating: \(4x+2yy''=0\), so the slope is \(-\dfrac{2x}y\).'
    explanation: 'Orthogonal slope \(\dfrac y{2x}\): \(\dfrac{dy}y=\dfrac{dx}{2x}\) gives \(y^2=Cx\).'
  166:
    topic: s9-5
    question: 'The orthogonal trajectories of \(y=ce^{-x}\) are'
    A: '\(y=-ce^{x}\)'
    B: '\(y=e^{x}+C\)'
    C: '\(y^2=2x+C\)'
    D: '\(y^2=-2x+C\)'
    answer: C
    hint: 'The family satisfies \(y''=-y\); orthogonal slope is \(\dfrac1y\).'
    explanation: '\(y\,dy=dx\) gives \(\dfrac{y^2}2=x+C\).'
  167:
    topic: s9-5
    question: 'The orthogonal trajectories of \(kx^2+y^2=1\) satisfy'
    A: '\(\ln|y|-\dfrac{y^2}2=\dfrac{x^2}2+C\)'
    B: '\(y^2=x^2+C\)'
    C: '\(\ln|y|+\dfrac{y^2}2=\dfrac{x^2}2+C\)'
    D: '\(\ln|y|-\dfrac{y^2}2=-\dfrac{x^2}2+C\)'
    answer: A
    hint: 'Eliminate \(k\): \(y''=-\dfrac{1-y^2}{xy}\); orthogonal slope is \(\dfrac{xy}{1-y^2}\).'
    explanation: '\(\dfrac{1-y^2}y\,dy=x\,dx\).'
  168:
    topic: s9-5
    question: 'The orthogonal trajectories of \(y=e^{kx}\) satisfy'
    A: '\(\ln y=-\dfrac{x^2}2+C\)'
    B: '\(\dfrac{y^2\ln y}2-\dfrac{y^2}4=-\dfrac{x^2}2+C\)'
    C: '\(\dfrac{y^2\ln y}2-\dfrac{y^2}4=\dfrac{x^2}2+C\)'
    D: '\(y\ln y=-x+C\)'
    answer: B
    hint: 'Eliminate \(k=\dfrac{\ln y}x\): \(y''=\dfrac{y\ln y}x\); orthogonal slope is \(-\dfrac x{y\ln y}\).'
    explanation: '\(y\ln y\,dy=-x\,dx\), and \(\int y\ln y\,dy=\dfrac{y^2\ln y}2-\dfrac{y^2}4\).'
  169:
    topic: s9-5
    question: 'The curves \(2x^2+3y^2=5\) and \(y^2=x^3\) meet at \((1,1)\) with slopes'
    A: '\(-\dfrac32\) and \(\dfrac23\), so they are not orthogonal'
    B: '\(-\dfrac23\) and \(-\dfrac32\), so they are orthogonal'
    C: '\(\dfrac23\) and \(\dfrac32\), so they are orthogonal'
    D: '\(-\dfrac23\) and \(\dfrac32\), so they are orthogonal'
    answer: D
    hint: Differentiate implicitly.
    explanation: '\(4x+6yy''=0\) gives \(-\tfrac23\); \(2yy''=3x^2\) gives \(\tfrac32\); the product is \(-1\).'
  170:
    topic: s9-5
    question: 'The family of solutions of \(x\,dx+y\,dy=0\) is circles about the origin; its orthogonal trajectories are'
    A: 'the parabolas \(y=kx^2\)'
    B: 'the hyperbolas \(xy=k\)'
    C: the same circles
    D: 'the lines through the origin \(y=kx\)'
    answer: D
    hint: 'Slopes are \(-\dfrac xy\); orthogonal slope is \(\dfrac yx\).'
    explanation: '\(\dfrac{dy}y=\dfrac{dx}x\) gives \(y=kx\).'
  171:
    topic: s9-5
    question: 'The family of solutions of \(x\,dy-2y\,dx=0\) is \(y=Cx^2\); its orthogonal trajectories are'
    A: '\(y=kx\)'
    B: '\(y=kx^2\)'
    C: '\(2x^2+y^2=k\)'
    D: '\(x^2+2y^2=k\)'
    answer: D
    hint: 'Orthogonal slope is \(-\dfrac{x}{2y}\).'
    explanation: '\(2y\,dy=-x\,dx\).'
  172:
    topic: s9-5
    question: 'The parabolas \(y^2=4a^2-4ax\) and \(y^2=4b^2+4bx\) (\(a,b>0\)) intersect at'
    A: '\(\left(a-b,\ \pm\sqrt{ab}\right)\)'
    B: '\(\left(a-b,\ \pm2\sqrt{ab}\right)\)'
    C: '\(\left(a+b,\ \pm2\sqrt{ab}\right)\)'
    D: '\(\left(b-a,\ \pm2\sqrt{ab}\right)\)'
    answer: B
    hint: Set the right sides equal.
    explanation: '\(4a^2-4ax=4b^2+4bx\) gives \(x=a-b\); then \(y^2=4ab\).'
